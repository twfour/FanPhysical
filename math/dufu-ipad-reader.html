\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]朝回：下朝回来。<br>[2]典：典当。<br>[3]行处：所到之处。<br>[4]深深：在花丛深处。<br>[5]见：通“现”。<br>[6]共流转：在一起逗留、徘徊。<br>[7]违：错过。</p>", "englishHtml": "<p class=\"poem-lines\">The Winding River(II)<br>I pawn my spring gown after audience day by day,<br>To drink my fill in riverside shops all the way.<br>No wonder there&#x27;s no shop but I owe debt of wine.<br>If not, why live to seventy like an old pine?<br>Butterflies gather honey from flower to flower;<br>Dragonflies skim over water lower and lower.<br>Let us enjoy more wine with ease as time evolves!<br>Do not regret too late when sun or moon revolves!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Winding River ( II ),” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as water, flowers, wine, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "023", "zhTitle": "曲江对酒", "enTitle": "Drinking by Poolside", "chinese": "苑[1]外江头坐不归，\n水精宫殿[2]转霏微[3]。\n桃花细逐杨花落，\n黄鸟时兼白鸟飞。\n纵饮久判[4]人共弃，\n懒朝真与世相违。\n吏情更觉沧洲[5]远，\n老大徒伤未拂衣[6]。\n这首诗写于公元758年，杜甫最后留居长安时。诗一开首就说坐在江头不愿归去，说明已久坐多时，可见诗人心中情绪，为下文做铺垫。第二句表意是写薄暮之下，墙垣宫殿一片朦胧，实则是说昔时风光今已不再，时过境迁，盛衰在目，仿佛一切如昨，转眼便归于尘土。作为一同目睹过繁华成空而又被忘却的见证者，诗人就想这样守着这一江春水，守着这断井残垣，看着桃花追逐杨花争相落下，看着黄鹂白鹭竞相飞走，看着它们纷纷离去，而诗人自认纵酒多时已被厌弃，也不愿违心做出勤谨政事的虚伪表象，如果不是微职在身年纪又大，诗人也想离开，找一处水边，或就在这苑外江头，终日闲坐。这首诗寄情于景物花鸟，反映出诗人理想成空，报国无门的苦楚。\n注释：\n[1]苑：曲江西南的芙蓉苑，是帝妃游玩的地方。\n[2]水精宫殿：指芙蓉苑中的宫殿。\n[3]霏微：迷濛的样子。\n[4]判（pān）：甘愿。\n[5]沧洲：指隐士的居处。\n[6]拂衣：拂袖而去，告老还乡。", "english": "I won't come back, sitting by poolside ill at ease,\nTill crystal palaces turn dim and low in twilight.\nPeach blossoms fall with willow-down blown by the breeze,\nWhen yellow birds spread wings with white birds in their flight.\nSeeking no favor, I drink my wine all the day;\nI'm not assiduous in the court where I feel cold.\nLonging in office for my hermitage far away,\nWhy do I not resign before I grow too old?", "poemType": "七言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">苑<sup class=\"note-ref\">[1]</sup>外江头坐不归，<br>水精宫殿<sup class=\"note-ref\">[2]</sup>转霏微<sup class=\"note-ref\">[3]</sup>。<br>桃花细逐杨花落，<br>黄鸟时兼白鸟飞。<br>纵饮久判<sup class=\"note-ref\">[4]</sup>人共弃，<br>懒朝真与世相违。<br>吏情更觉沧洲<sup class=\"note-ref\">[5]</sup>远，<br>老大徒伤未拂衣<sup class=\"note-ref\">[6]</sup>。</p>\n<p class=\"prose\">这首诗写于公元758年，杜甫最后留居长安时。诗一开首就说坐在江头不愿归去，说明已久坐多时，可见诗人心中情绪，为下文做铺垫。第二句表意是写薄暮之下，墙垣宫殿一片朦胧，实则是说昔时风光今已不再，时过境迁，盛衰在目，仿佛一切如昨，转眼便归于尘土。</p>\n<p class=\"prose\">作为一同目睹过繁华成空而又被忘却的见证者，诗人就想这样守着这一江春水，守着这断井残垣，看着桃花追逐杨花争相落下，看着黄鹂白鹭竞相飞走，看着它们纷纷离去，而诗人自认纵酒多时已被厌弃，也不愿违心做出勤谨政事的虚伪表象，如果不是微职在身年纪又大，诗人也想离开，找一处水边，或就在这苑外江头，终日闲坐。</p>\n<p class=\"prose\">这首诗寄情于景物花鸟，反映出诗人理想成空，报国无门的苦楚。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]苑：曲江西南的芙蓉苑，是帝妃游玩的地方。<br>[2]水精宫殿：指芙蓉苑中的宫殿。<br>[3]霏微：迷濛的样子。<br>[4]判（pān）：甘愿。<br>[5]沧洲：指隐士的居处。<br>[6]拂衣：拂袖而去，告老还乡。</p>", "englishHtml": "<p class=\"poem-lines\">I won&#x27;t come back, sitting by poolside ill at ease,<br>Till crystal palaces turn dim and low in twilight.<br>Peach blossoms fall with willow-down blown by the breeze,<br>When yellow birds spread wings with white birds in their flight.<br>Seeking no favor, I drink my wine all the day;<br>I&#x27;m not assiduous in the court where I feel cold.<br>Longing in office for my hermitage far away,<br>Why do I not resign before I grow too old?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Drinking by Poolside,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as water, flowers, birds, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "024", "zhTitle": "九日蓝田崔氏庄", "enTitle": "Mountain-climbing Day in Blue Field", "chinese": "老去悲秋强[2]自宽，\n兴来今日尽君欢。\n羞将短发还吹帽，\n笑倩[3]旁人为正冠。\n蓝水[4]远从千涧落，\n玉山[5]高并两峰寒。\n明年此会知谁健[6]？\n醉[7]把茱萸仔细看。\n诗人感到自己已经并且仍在老去，面对寂寥秋景更是悲由心生，只得勉强宽慰自己。所以重阳这天，一定要和友人尽欢而散。前两句犹如题记，交代了此诗的创作时间和背景，其意辗转曲折，诗句婉转自如。颔联借用“孟嘉落帽”的典故，倾诉自己有心向往前人的风流蕴藉，怎奈如今地位尴尬，只得“笑倩旁人为正冠”，虽笑犹悲，悲凉之情深刻入骨。颈联笔锋一转，描山绘水，气象峥嵘，意高而境远，豪迈苍凉，力透纸背。明年此际，山水固然如故，然而人事终难料，那时又有几人健在呢？结尾不置一言，只将寄托对亲朋好友的相思之情的茱萸细看，饱含诗人无法释怀的满腹忧愁。\n注释：\n[1]蓝田：今陕西省西安市蓝田县。\n[2]强：勉强。\n[3]倩：请。\n[4]蓝水：蓝田山下的蓝溪。\n[5]玉山：蓝田山。\n[6]健：在。\n[7]醉：再。", "english": "How to console an old man on an autumn day?\nHigh mountains bring high spirit, I'm happy and gay.\nMy hat blown down reveals my short hair, I feel shy;\nSmiling, I ask you to put it right with a sigh.\nBlue water comes from a thousand creeks far away;\nJade Mountain stands with two high peaks cold cloud to stay.\nAfter we part, can we meet here again next year?\nDrunken, I ask dogwood if it will reappear.", "poemType": "七言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">老去悲秋强<sup class=\"note-ref\">[2]</sup>自宽，<br>兴来今日尽君欢。<br>羞将短发还吹帽，<br>笑倩<sup class=\"note-ref\">[3]</sup>旁人为正冠。<br>蓝水<sup class=\"note-ref\">[4]</sup>远从千涧落，<br>玉山<sup class=\"note-ref\">[5]</sup>高并两峰寒。<br>明年此会知谁健<sup class=\"note-ref\">[6]</sup>？<br>醉<sup class=\"note-ref\">[7]</sup>把茱萸仔细看。</p>\n<p class=\"prose\">诗人感到自己已经并且仍在老去，面对寂寥秋景更是悲由心生，只得勉强宽慰自己。所以重阳这天，一定要和友人尽欢而散。前两句犹如题记，交代了此诗的创作时间和背景，其意辗转曲折，诗句婉转自如。颔联借用“孟嘉落帽”的典故，倾诉自己有心向往前人的风流蕴藉，怎奈如今地位尴尬，只得“笑倩旁人为正冠”，虽笑犹悲，悲凉之情深刻入骨。</p>\n<p class=\"prose\">颈联笔锋一转，描山绘水，气象峥嵘，意高而境远，豪迈苍凉，力透纸背。明年此际，山水固然如故，然而人事终难料，那时又有几人健在呢？结尾不置一言，只将寄托对亲朋好友的相思之情的茱萸细看，饱含诗人无法释怀的满腹忧愁。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]蓝田：今陕西省西安市蓝田县。<br>[2]强：勉强。<br>[3]倩：请。<br>[4]蓝水：蓝田山下的蓝溪。<br>[5]玉山：蓝田山。<br>[6]健：在。<br>[7]醉：再。</p>", "englishHtml": "<p class=\"poem-lines\">How to console an old man on an autumn day?<br>High mountains bring high spirit, I&#x27;m happy and gay.<br>My hat blown down reveals my short hair, I feel shy;<br>Smiling, I ask you to put it right with a sigh.<br>Blue water comes from a thousand creeks far away;<br>Jade Mountain stands with two high peaks cold cloud to stay.<br>After we part, can we meet here again next year?<br>Drunken, I ask dogwood if it will reappear.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Mountain-climbing Day in Blue Field,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as mountains, water, wine, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "025", "zhTitle": "日暮", "enTitle": "After Nightfall", "chinese": "牛羊下来久，\n各已闭柴门。\n风月自清夜，\n江山非故园[1]。\n石泉流暗壁[2]，\n草露滴秋根[3]。\n头白灯明里，\n何须花烬[4]繁？\n公元767年秋，诗人在流寓夔州瀼西东屯期间，写下了这首诗。余晖遍洒的宁静山村，牛羊早已从山野之中归来，家家户户柴扉紧闭，一片阒然幽静中，使人想起户内人们享受天伦之乐的情景。皓月明空，照着寂静的村庄，也照着诗人孤单的身影。诗人看着这明丽如画的风景，怎奈这不是故乡，于是思乡的愁肠被触动。颈联有意把“暗泉流石壁，秋露滴草根”错置词序，使诗句更为铿锵顿挫，使诗意更为奇逸浓郁。清新洁净的意境下，凄寂幽邃的夜景中，带给人一丝悲凉、抑郁之感。结尾仿佛是一声叹息，诗人已是迟暮之年，白发与灯光交相辉映，仕途一无所成，归乡又遥遥无期，饱尝生活的辛酸，因而面对似在报喜的灯花，不但不觉欢欣，反而倍感烦恼，仿佛喜兆和自己根本无缘，婉转曲折，耐人寻味。\n注释：\n[1]故园：故乡。\n[2]石泉流暗壁：就是“暗泉流石壁”。\n[3]草露滴秋根：就是“秋露滴草根”。秋根，秋天的草根。\n[4]花烬：灯芯燃烧后结成的像花一样的物体，民间常以此为喜兆。", "english": "Long have cattle come to the pen,\nAnd closed are all wicker gates then.\nBeautiful is the moonlit night,\nBut my homeland is not in sight.\nWater flows from fountains unseen;\nDewdrops drip on autumn grass green.\nMy white hair twinkling by lamplight,\nDo I need flowers gleaming bright?", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">牛羊下来久，<br>各已闭柴门。<br>风月自清夜，<br>江山非故园<sup class=\"note-ref\">[1]</sup>。<br>石泉流暗壁<sup class=\"note-ref\">[2]</sup>，<br>草露滴秋根<sup class=\"note-ref\">[3]</sup>。<br>头白灯明里，<br>何须花烬<sup class=\"note-ref\">[4]</sup>繁？</p>\n<p class=\"prose\">公元767年秋，诗人在流寓夔州瀼西东屯期间，写下了这首诗。余晖遍洒的宁静山村，牛羊早已从山野之中归来，家家户户柴扉紧闭，一片阒然幽静中，使人想起户内人们享受天伦之乐的情景。皓月明空，照着寂静的村庄，也照着诗人孤单的身影。</p>\n<p class=\"prose\">诗人看着这明丽如画的风景，怎奈这不是故乡，于是思乡的愁肠被触动。颈联有意把“暗泉流石壁，秋露滴草根”错置词序，使诗句更为铿锵顿挫，使诗意更为奇逸浓郁。清新洁净的意境下，凄寂幽邃的夜景中，带给人一丝悲凉、抑郁之感。</p>\n<p class=\"prose\">结尾仿佛是一声叹息，诗人已是迟暮之年，白发与灯光交相辉映，仕途一无所成，归乡又遥遥无期，饱尝生活的辛酸，因而面对似在报喜的灯花，不但不觉欢欣，反而倍感烦恼，仿佛喜兆和自己根本无缘，婉转曲折，耐人寻味。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]故园：故乡。<br>[2]石泉流暗壁：就是“暗泉流石壁”。<br>[3]草露滴秋根：就是“秋露滴草根”。秋根，秋天的草根。<br>[4]花烬：灯芯燃烧后结成的像花一样的物体，民间常以此为喜兆。</p>", "englishHtml": "<p class=\"poem-lines\">Long have cattle come to the pen,<br>And closed are all wicker gates then.<br>Beautiful is the moonlit night,<br>But my homeland is not in sight.<br>Water flows from fountains unseen;<br>Dewdrops drip on autumn grass green.<br>My white hair twinkling by lamplight,<br>Do I need flowers gleaming bright?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “After Nightfall,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, moonlight, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "026", "zhTitle": "独立", "enTitle": "Alone I Stand", "chinese": "空外[1]一鸷鸟[2]，\n河间双白鸥[3]。\n飘飖[4]搏击便，\n容易往来游。\n草露亦多湿，\n蛛丝仍未收。\n天机近人事，\n独立万端忧。\n《独立》读来像一首寓言诗。第一联说：天上一只鹰，河中两只鸥。对仗工整。第二联说：鹰从天上冲下来，白鸥却还无忧无虑，从容不迫，在河中游来游去。这两句形式相对，意义相反。第三联说草上的露水会沾湿飞虫的翅膀，蜘蛛的罗网会捕捉小虫，所以小虫和白鸥一样，都在危险之中，却无警惕之心。第四联就把天人结合起来，说天上人间一样危险，诗人独立无言，不禁忧从中来。\n注释：\n[1]空外：虚空之外。\n[2]鸷鸟：比喻小人。\n[3]白鸥：比喻君子。\n[4]飘飖（yáo）：形容轻盈洒脱的样子。", "english": "A falcon hovers in the sky;\nA pair of gulls on water glide.\nThe falcon darts down from on high\nOn gulls floating on river wide.\nThe dewy grass may wet the wing;\nThe spider's net may trap the weak.\nNature and man are the same thing.\nAggrieved alone, I cannot speak.", "poemType": "五言律诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">空外<sup class=\"note-ref\">[1]</sup>一鸷鸟<sup class=\"note-ref\">[2]</sup>，<br>河间双白鸥<sup class=\"note-ref\">[3]</sup>。<br>飘飖<sup class=\"note-ref\">[4]</sup>搏击便，<br>容易往来游。<br>草露亦多湿，<br>蛛丝仍未收。<br>天机近人事，<br>独立万端忧。</p>\n<p class=\"prose\">《独立》读来像一首寓言诗。第一联说：天上一只鹰，河中两只鸥。对仗工整。第二联说：鹰从天上冲下来，白鸥却还无忧无虑，从容不迫，在河中游来游去。这两句形式相对，意义相反。第三联说草上的露水会沾湿飞虫的翅膀，蜘蛛的罗网会捕捉小虫，所以小虫和白鸥一样，都在危险之中，却无警惕之心。</p>\n<p class=\"prose\">第四联就把天人结合起来，说天上人间一样危险，诗人独立无言，不禁忧从中来。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]空外：虚空之外。<br>[2]鸷鸟：比喻小人。<br>[3]白鸥：比喻君子。<br>[4]飘飖（yáo）：形容轻盈洒脱的样子。</p>", "englishHtml": "<p class=\"poem-lines\">A falcon hovers in the sky;<br>A pair of gulls on water glide.<br>The falcon darts down from on high<br>On gulls floating on river wide.<br>The dewy grass may wet the wing;<br>The spider&#x27;s net may trap the weak.<br>Nature and man are the same thing.<br>Aggrieved alone, I cannot speak.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Alone I Stand,” the poem begins from a vivid object or scene and lets its energy expand into emotion.</p>\n<p class=\"commentary\">As a five-character regulated verse, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "027", "zhTitle": "赠卫八处士", "enTitle": "For Wei the Eighth", "chinese": "人生不相见，\n动如参与商。\n今夕复何夕？\n共此灯烛光。\n少壮能几时？\n鬓发各已苍[1]。\n访旧半为鬼，\n惊呼热中肠。\n焉知二十载，\n重上君子堂？\n昔别君未婚，\n儿女忽成行。\n怡然敬父执[2]，\n问我来何方？\n问答乃未已[3]，\n儿女罗酒浆。\n夜雨剪春韭，\n新炊[4]间黄粱[5]。\n主称会面难，\n一举累[6]十觞。\n十觞亦不醉，\n感子故意长[7]。\n明日隔山岳，\n世事两茫茫。\n《唐史拾遗》中说：“杜甫与李白、高适、卫宾相友善，时宾年最小，号小友。”卫八处士可能就是卫宾，八是排行，处士就是不出仕的隐士。这首诗是公元759年写的。前十句抒情，先说会面之难，可见相会之乐。中间转为叙事，说到变化之大，儿女成长之快，主人款待之殷，写出了朋友之情，长幼之义。最后两句想到明天的别离，今天的相会越乐，明天的离别就越悲。全诗前后一片茫茫，更显得诗意沉郁了。\n注释：\n[1]苍：灰白色。\n[2]父执：父亲经常接近的朋友。\n[3]乃未已：话未说完。\n[4]新炊：刚煮好的新鲜饭。\n[5]黄粱：黄米。\n[6]累：连续。\n[7]故意长：老友间的深情厚谊。", "english": "How rarely together friends are!\nAs Morning Star with Evening Star.\nO what a rare night is tonight?\nTogether we share candlelight.\nHow long can last our youthful years?\nGrey hair on our temples appears.\nWe find half of our friends departed.\nHow can we not cry broken-hearted!\nAfter twenty years, who knows then,\nI come into your hall again.\nUnmarried twenty years ago,\nNow you have children in a row.\nSeeing their father's friend at home,\nThey're glad to ask where I come from.\nOur talk has not come to an end,\nWhen wine is offered to the friend.\nThey bring leeks cut after night rain\nAnd millet cooked with new grain.\nThe host says, “It is hard to meet.\nLet us drink ten cups of wine sweet!”\nTen cupfuls cannot make me drunk,\nFor deep in your love I am sunk.\nMountains will divide us tomorrow.\nO What can we foresee but sorrow!", "poemType": "五言古诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">人生不相见，<br>动如参与商。<br>今夕复何夕？<br>共此灯烛光。<br>少壮能几时？<br>鬓发各已苍<sup class=\"note-ref\">[1]</sup>。<br>访旧半为鬼，<br>惊呼热中肠。<br>焉知二十载，<br>重上君子堂？<br>昔别君未婚，<br>儿女忽成行。<br>怡然敬父执<sup class=\"note-ref\">[2]</sup>，<br>问我来何方？<br>问答乃未已<sup class=\"note-ref\">[3]</sup>，<br>儿女罗酒浆。<br>夜雨剪春韭，<br>新炊<sup class=\"note-ref\">[4]</sup>间黄粱<sup class=\"note-ref\">[5]</sup>。<br>主称会面难，<br>一举累<sup class=\"note-ref\">[6]</sup>十觞。<br>十觞亦不醉，<br>感子故意长<sup class=\"note-ref\">[7]</sup>。<br>明日隔山岳，<br>世事两茫茫。</p>\n<p class=\"prose\">《唐史拾遗》中说：“杜甫与李白、高适、卫宾相友善，时宾年最小，号小友。”卫八处士可能就是卫宾，八是排行，处士就是不出仕的隐士。这首诗是公元759年写的。前十句抒情，先说会面之难，可见相会之乐。中间转为叙事，说到变化之大，儿女成长之快，主人款待之殷，写出了朋友之情，长幼之义。</p>\n<p class=\"prose\">最后两句想到明天的别离，今天的相会越乐，明天的离别就越悲。全诗前后一片茫茫，更显得诗意沉郁了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]苍：灰白色。<br>[2]父执：父亲经常接近的朋友。<br>[3]乃未已：话未说完。<br>[4]新炊：刚煮好的新鲜饭。<br>[5]黄粱：黄米。<br>[6]累：连续。<br>[7]故意长：老友间的深情厚谊。</p>", "englishHtml": "<p class=\"poem-lines\">How rarely together friends are!<br>As Morning Star with Evening Star.<br>O what a rare night is tonight?<br>Together we share candlelight.<br>How long can last our youthful years?<br>Grey hair on our temples appears.<br>We find half of our friends departed.<br>How can we not cry broken-hearted!<br>After twenty years, who knows then,<br>I come into your hall again.<br>Unmarried twenty years ago,<br>Now you have children in a row.<br>Seeing their father&#x27;s friend at home,<br>They&#x27;re glad to ask where I come from.<br>Our talk has not come to an end,<br>When wine is offered to the friend.<br>They bring leeks cut after night rain<br>And millet cooked with new grain.<br>The host says, “It is hard to meet.<br>Let us drink ten cups of wine sweet!”<br>Ten cupfuls cannot make me drunk,<br>For deep in your love I am sunk.<br>Mountains will divide us tomorrow.<br>O What can we foresee but sorrow!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For Wei the Eighth,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as mountains and wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "028", "zhTitle": "新安吏", "enTitle": "A Recruiting Sergeant at Xin'an", "chinese": "客行新安道，\n喧呼闻点兵。\n借问新安吏：\n“县小更[1]无丁？”\n“府帖昨夜下，\n次[2]选中男行。”\n“中男[3]绝短小，\n何以守王城？”\n肥男有母送，\n瘦男独伶俜[4]。\n白水暮东流，\n青山犹哭声。\n“莫自使眼枯，\n收汝泪纵横。\n眼枯即见骨，\n天地终无情。\n我军取相州，\n日夕望其平。\n岂意贼难料，\n归军星散营。\n就粮近故垒，\n练卒依旧京。\n掘壕不到水，\n牧马役亦轻。\n况乃王师顺，\n抚养甚分明。\n送行勿泣血，\n仆射[5]如父兄。”\n公元758年，郭子仪打败了叛军，收复了长安和洛阳，但得不到唐肃宗的信任，军粮不足，士气低落，反在邺城打了败仗。唐王朝为了补充兵力，大肆抽丁拉夫。杜甫这时经过洛阳以西的新安，耳闻目睹了这次惨败后人民所遭受的痛苦，写下了“三吏”“三别”六篇史诗。《新安吏》写的是征兵本来应该征21岁以上的壮丁，但是壮丁不足，只好抓十几岁的中男。中男抓走之后，哭声仍然在耳，仿佛连青山白水也在呜咽一样，这就是诗人移情于景了。杜甫同情壮丁，但又不能怨恨王朝。于是只好安慰壮丁说：战壕不会挖得太深，放马的劳役也不会太重，加上郭子仪将军对士兵情若父兄，所以放心去当兵吧。本诗既反映了壮丁的悲苦，又流露了诗人的用心。这就是杜甫的现实主义了。\n注释：\n[1]更：难道。\n[2]次：依次。\n[3]中男：指十八岁以上、二十三岁以下的成丁。\n[4]伶俜（pīnɡ）：形容孤独。\n[5]仆射：指郭子仪。", "english": "I pass by Xin'an on my way\nAnd hear sergeants call roll and bray.\nI ask one of this county small\nIf he can draft adults at all.\nLast night came order for hands green,\nDraft age is lowered to eighteen.\nThe teenagers are small and short.\nHow can they hold the royal fort?\nFat sons still need their mothers' care;\nWeak ones look lonely in despair.\nAt dusk the pale stream flows east still;\nTheir wails echo from hill to hill.\nDon't cry until your eyes go dry!\nLet no tears crisscross your face wry!\nThough to skin and bone your eyes go,\nNo mercy would the Heaven show.\nOur force should take Xiangzhou with might,\nVictory expected day and night.\nBut rebels not easy to beat\nCounter-attack, our troops retreat.\nWe've grain enough in our stronghold,\nAnd training camp near capital old.\nTo dig deep trench you do not need;\nIt is not hard to tend the steed.\nThe royal force has at its head\nGeneral Guo by whom you're well fed.\nDon't shed at parting bloody tears!\nThe general treats you as compeers.", "poemType": "五言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">客行新安道，<br>喧呼闻点兵。<br>借问新安吏：<br>“县小更<sup class=\"note-ref\">[1]</sup>无丁？”<br>“府帖昨夜下，<br>次<sup class=\"note-ref\">[2]</sup>选中男行。”<br>“中男<sup class=\"note-ref\">[3]</sup>绝短小，<br>何以守王城？”<br>肥男有母送，<br>瘦男独伶俜<sup class=\"note-ref\">[4]</sup>。<br>白水暮东流，<br>青山犹哭声。<br>“莫自使眼枯，<br>收汝泪纵横。<br>眼枯即见骨，<br>天地终无情。<br>我军取相州，<br>日夕望其平。<br>岂意贼难料，<br>归军星散营。<br>就粮近故垒，<br>练卒依旧京。<br>掘壕不到水，<br>牧马役亦轻。<br>况乃王师顺，<br>抚养甚分明。<br>送行勿泣血，<br>仆射<sup class=\"note-ref\">[5]</sup>如父兄。”</p>\n<p class=\"prose\">公元758年，郭子仪打败了叛军，收复了长安和洛阳，但得不到唐肃宗的信任，军粮不足，士气低落，反在邺城打了败仗。唐王朝为了补充兵力，大肆抽丁拉夫。杜甫这时经过洛阳以西的新安，耳闻目睹了这次惨败后人民所遭受的痛苦，写下了“三吏”“三别”六篇史诗。</p>\n<p class=\"prose\">《新安吏》写的是征兵本来应该征21岁以上的壮丁，但是壮丁不足，只好抓十几岁的中男。中男抓走之后，哭声仍然在耳，仿佛连青山白水也在呜咽一样，这就是诗人移情于景了。杜甫同情壮丁，但又不能怨恨王朝。于是只好安慰壮丁说：战壕不会挖得太深，放马的劳役也不会太重，加上郭子仪将军对士兵情若父兄，所以放心去当兵吧。</p>\n<p class=\"prose\">本诗既反映了壮丁的悲苦，又流露了诗人的用心。这就是杜甫的现实主义了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]更：难道。<br>[2]次：依次。<br>[3]中男：指十八岁以上、二十三岁以下的成丁。<br>[4]伶俜（pīnɡ）：形容孤独。<br>[5]仆射：指郭子仪。</p>", "englishHtml": "<p class=\"poem-lines\">I pass by Xin&#x27;an on my way<br>And hear sergeants call roll and bray.<br>I ask one of this county small<br>If he can draft adults at all.<br>Last night came order for hands green,<br>Draft age is lowered to eighteen.<br>The teenagers are small and short.<br>How can they hold the royal fort?<br>Fat sons still need their mothers&#x27; care;<br>Weak ones look lonely in despair.<br>At dusk the pale stream flows east still;<br>Their wails echo from hill to hill.<br>Don&#x27;t cry until your eyes go dry!<br>Let no tears crisscross your face wry!<br>Though to skin and bone your eyes go,<br>No mercy would the Heaven show.<br>Our force should take Xiangzhou with might,<br>Victory expected day and night.<br>But rebels not easy to beat<br>Counter-attack, our troops retreat.<br>We&#x27;ve grain enough in our stronghold,<br>And training camp near capital old.<br>To dig deep trench you do not need;<br>It is not hard to tend the steed.<br>The royal force has at its head<br>General Guo by whom you&#x27;re well fed.<br>Don&#x27;t shed at parting bloody tears!<br>The general treats you as compeers.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Recruiting Sergeant at Xin&#x27;an,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, water, homecoming, and war and displacement give the poem its visual texture and emotional temperature.</p>"}, {"num": "029", "zhTitle": "石壕吏", "enTitle": "The Pressgang at Stone Moat Village", "chinese": "暮投石壕村，\n有吏[1]夜捉人。\n老翁逾[2]墙走，\n老妇出门看。\n吏呼一何怒！\n妇啼一何苦！\n听妇前致词：\n“三男邺城戍[3]。\n一男附书至，\n二男新战死。\n存者且偷生，\n死者长已矣！\n室中更无人，\n惟有乳下孙。\n有孙母未去[4]，\n出入无完裙。\n老妪力虽衰，\n请从吏夜归。\n急应河阳役，\n犹得备晨炊。”\n夜久语声绝，\n如闻泣幽咽[5]。\n天明登前途[6]，\n独与老翁别。\n《石壕吏》是“三吏”中最著名的一篇，全篇重点在“有吏夜捉人”一句。《新安吏》中还是征兵，《石壕吏》中却是捉人，可见情况更加严重。诗中说道：三男戍，二男死，孙方幼，媳无裙，翁逾墙，妇夜往。抓壮丁抓不到，连老妇人都拉去当差，可见民不聊生。全诗非常简练，在“吏呼一何怒”之后，不再写吏，而只写妇致词，这用的是寓问于答的写法。古人评说：“其事何长！其言何简！”全篇句句叙事，没有抒情，没有议论，但是通过叙事，却流露出了诗人的爱憎之情、褒贬之意。梁启超在《情圣杜甫》中谈到“三吏”时说：“这些诗是要作者的精神和那所写之人的精神并合为一，才能作出。……作这首《石壕吏》时，他已经化身做那位儿女死绝衣食不给的老太婆，所以他说的话，完全和他们自己说一样。……这类诗的好处在真，事愈写得详，真情愈发得透，我们熟读他，可以理会得‘真即是美’的道理。”\n注释：\n[1]吏：指来抓壮丁的低级官吏。\n[2]逾（yú）：越过，翻过。\n[3]戍（shù）：驻守，指服役。\n[4]去：离开，这里指改嫁。\n[5]泣幽咽：低声细小断续的哭声。\n[6]登前途：上路。", "english": "I seek for shelter at nightfall.\nWhat is the pressgang coming for?\nMy old host climbs over the wall;\nMy old hostess answers the door.\nHow angry is the sergeant's shout!\nHow bitter is the woman's cry!\nI hear what she tries to speak out.\n“I'd three sons guarding the town high.\nOne wrote a letter telling me\nThat his brothers were killed in war.\nHe'll keep alive if he can be;\nThe dead have passed and are no more.\nIn the house there is no man left,\nExcept my grandson in the breast\nOf his mother, of all bereft;\nShe can't come out, in tatters dressed.\nThough I'm a woman weak and old,\nI beg to go tonight with you,\nThat I may serve in the stronghold\nAnd cook morning meals as my due.”\nWith night her voices fade away;\nI seem to hear still sob and sigh.\nAt dawn again I go my way\nAnd only bid my host goodbye.", "poemType": "五言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">暮投石壕村，<br>有吏<sup class=\"note-ref\">[1]</sup>夜捉人。<br>老翁逾<sup class=\"note-ref\">[2]</sup>墙走，<br>老妇出门看。<br>吏呼一何怒！<br>妇啼一何苦！<br>听妇前致词：<br>“三男邺城戍<sup class=\"note-ref\">[3]</sup>。<br>一男附书至，<br>二男新战死。<br>存者且偷生，<br>死者长已矣！<br>室中更无人，<br>惟有乳下孙。<br>有孙母未去<sup class=\"note-ref\">[4]</sup>，<br>出入无完裙。<br>老妪力虽衰，<br>请从吏夜归。<br>急应河阳役，<br>犹得备晨炊。”<br>夜久语声绝，<br>如闻泣幽咽<sup class=\"note-ref\">[5]</sup>。<br>天明登前途<sup class=\"note-ref\">[6]</sup>，<br>独与老翁别。</p>\n<p class=\"prose\">《石壕吏》是“三吏”中最著名的一篇，全篇重点在“有吏夜捉人”一句。《新安吏》中还是征兵，《石壕吏》中却是捉人，可见情况更加严重。诗中说道：三男戍，二男死，孙方幼，媳无裙，翁逾墙，妇夜往。抓壮丁抓不到，连老妇人都拉去当差，可见民不聊生。</p>\n<p class=\"prose\">全诗非常简练，在“吏呼一何怒”之后，不再写吏，而只写妇致词，这用的是寓问于答的写法。古人评说：“其事何长！其言何简！”全篇句句叙事，没有抒情，没有议论，但是通过叙事，却流露出了诗人的爱憎之情、褒贬之意。梁启超在《情圣杜甫》中谈到“三吏”时说：“这些诗是要作者的精神和那所写之人的精神并合为一，才能作出。</p>\n<p class=\"prose\">……作这首《石壕吏》时，他已经化身做那位儿女死绝衣食不给的老太婆，所以他说的话，完全和他们自己说一样。……这类诗的好处在真，事愈写得详，真情愈发得透，我们熟读他，可以理会得‘真即是美’的道理。”</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]吏：指来抓壮丁的低级官吏。<br>[2]逾（yú）：越过，翻过。<br>[3]戍（shù）：驻守，指服役。<br>[4]去：离开，这里指改嫁。<br>[5]泣幽咽：低声细小断续的哭声。<br>[6]登前途：上路。</p>", "englishHtml": "<p class=\"poem-lines\">I seek for shelter at nightfall.<br>What is the pressgang coming for?<br>My old host climbs over the wall;<br>My old hostess answers the door.<br>How angry is the sergeant&#x27;s shout!<br>How bitter is the woman&#x27;s cry!<br>I hear what she tries to speak out.<br>“I&#x27;d three sons guarding the town high.<br>One wrote a letter telling me<br>That his brothers were killed in war.<br>He&#x27;ll keep alive if he can be;<br>The dead have passed and are no more.<br>In the house there is no man left,<br>Except my grandson in the breast<br>Of his mother, of all bereft;<br>She can&#x27;t come out, in tatters dressed.<br>Though I&#x27;m a woman weak and old,<br>I beg to go tonight with you,<br>That I may serve in the stronghold<br>And cook morning meals as my due.”<br>With night her voices fade away;<br>I seem to hear still sob and sigh.<br>At dawn again I go my way<br>And only bid my host goodbye.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Pressgang at Stone Moat Village,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, frontier scenes, homecoming, and war and displacement give the poem its visual texture and emotional temperature.</p>"}, {"num": "030", "zhTitle": "潼关吏", "enTitle": "Officer at the Western Pass", "chinese": "士卒何草草，\n筑城潼关道。\n大城铁不如，\n小城万丈余。\n借问潼关吏：\n“修关还备胡[2]？”\n要[3]我下马行，\n为我指山隅：\n“连云列战格，\n飞鸟不能逾。\n胡来但自守，\n岂复忧西都[4]。\n丈人[5]视要处，\n窄狭容单车。\n艰难奋[6]长戟，\n万古用一夫。”\n“哀哉桃林[7]战，\n百万化为鱼。\n请嘱防关将，\n慎勿学哥舒！”\n唐军在邺城战败后，恐怕洛阳失守，又在潼关修筑工事。杜甫经过时，向潼关吏了解情况。问答中穿插了叙事和议论，这和《新安吏》《石壕吏》不同。《潼关吏》前四句是总写，“草草”是辛苦的意思。杜甫问后，没有立刻写关吏的回答，而是插了两句叙事，然后才描写关山险阻，请杜甫老丈放心，只要一夫当关，就可以万夫莫开。关吏的话使诗人想起了桃林之败，于是发了几句议论。原来三年前叛军进攻潼关，守将哥舒翰要坚守，但宰相杨国忠促战，哥舒翰不得不出关迎敌，在灵宝以西的桃林塞大战，结果全军覆没，很多士兵葬身鱼腹。杜甫听了关吏自信的话，发了一番感慨，要守将谨慎从事，不能再蹈哥舒翰的覆辙。从诗中可以看出杜甫忠君爱国爱民之心。\n注释：\n[1]潼关：地名，位于华州华阴县东北，今陕西省渭南市潼关县北。\n[2]备胡：抵御安史叛军。\n[3]要：同“邀”，邀请。\n[4]西都：指长安。\n[5]丈人：关吏对杜甫的尊称。\n[6]奋：挥动。\n[7]桃林：桃林塞，指河南省灵宝市以西至潼关一带的地方。", "english": "How hard do soldiers work and toil,\nBuilding ramparts on western soil!\nIron-clad bastions high and low\nLike walls along the mountain go.\nI ask an officer near by\nIf against foes are built walls high.\nHe asks me to dismount and look\nAround and points to mountain nook.\nThe forts on the peaks scrape the sky,\nOver them even birds can't fly.\nWhen come the foe, we guard the wall,\nThere's no fear for the capital.\nHe shows me the narrow pass too,\nOnly single chariots file through.\nWhen guarded with long spear by one,\nThe fortress can be forced by none.\nBut defeated at Peach Grove, alas!\nTen thousand men slain at the pass.\nPlease tell the general guarding here:\nBe not defeated as that year!", "poemType": "五言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">士卒何草草，<br>筑城潼关道。<br>大城铁不如，<br>小城万丈余。<br>借问潼关吏：<br>“修关还备胡<sup class=\"note-ref\">[2]</sup>？”<br>要<sup class=\"note-ref\">[3]</sup>我下马行，<br>为我指山隅：<br>“连云列战格，<br>飞鸟不能逾。<br>胡来但自守，<br>岂复忧西都<sup class=\"note-ref\">[4]</sup>。<br>丈人<sup class=\"note-ref\">[5]</sup>视要处，<br>窄狭容单车。<br>艰难奋<sup class=\"note-ref\">[6]</sup>长戟，<br>万古用一夫。”<br>“哀哉桃林<sup class=\"note-ref\">[7]</sup>战，<br>百万化为鱼。<br>请嘱防关将，<br>慎勿学哥舒！”</p>\n<p class=\"prose\">唐军在邺城战败后，恐怕洛阳失守，又在潼关修筑工事。杜甫经过时，向潼关吏了解情况。问答中穿插了叙事和议论，这和《新安吏》《石壕吏》不同。《潼关吏》前四句是总写，“草草”是辛苦的意思。杜甫问后，没有立刻写关吏的回答，而是插了两句叙事，然后才描写关山险阻，请杜甫老丈放心，只要一夫当关，就可以万夫莫开。</p>\n<p class=\"prose\">关吏的话使诗人想起了桃林之败，于是发了几句议论。原来三年前叛军进攻潼关，守将哥舒翰要坚守，但宰相杨国忠促战，哥舒翰不得不出关迎敌，在灵宝以西的桃林塞大战，结果全军覆没，很多士兵葬身鱼腹。杜甫听了关吏自信的话，发了一番感慨，要守将谨慎从事，不能再蹈哥舒翰的覆辙。</p>\n<p class=\"prose\">从诗中可以看出杜甫忠君爱国爱民之心。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]潼关：地名，位于华州华阴县东北，今陕西省渭南市潼关县北。<br>[2]备胡：抵御安史叛军。<br>[3]要：同“邀”，邀请。<br>[4]西都：指长安。<br>[5]丈人：关吏对杜甫的尊称。<br>[6]奋：挥动。<br>[7]桃林：桃林塞，指河南省灵宝市以西至潼关一带的地方。</p>", "englishHtml": "<p class=\"poem-lines\">How hard do soldiers work and toil,<br>Building ramparts on western soil!<br>Iron-clad bastions high and low<br>Like walls along the mountain go.<br>I ask an officer near by<br>If against foes are built walls high.<br>He asks me to dismount and look<br>Around and points to mountain nook.<br>The forts on the peaks scrape the sky,<br>Over them even birds can&#x27;t fly.<br>When come the foe, we guard the wall,<br>There&#x27;s no fear for the capital.<br>He shows me the narrow pass too,<br>Only single chariots file through.<br>When guarded with long spear by one,<br>The fortress can be forced by none.<br>But defeated at Peach Grove, alas!<br>Ten thousand men slain at the pass.<br>Please tell the general guarding here:<br>Be not defeated as that year!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Officer at the Western Pass,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, clouds, flowers, and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "031", "zhTitle": "新婚别", "enTitle": "Lament of the Newly Wed", "chinese": "兔丝[1]附蓬麻，\n引蔓故不长。\n嫁女与征夫，\n不如弃路旁。\n结发为妻子，\n席不暖君床。\n暮婚晨告别，\n无乃太匆忙！\n君行虽不远，\n守边赴河阳[2]。\n妾身未分明，\n何以拜姑嫜[3]？\n父母养我时，\n日夜令我藏。\n生女有所归[4]，\n鸡狗亦得将。\n君今往死地，\n沉痛迫中肠。\n誓欲随君去，\n形势反苍黄[5]。\n勿为新婚念，\n努力事戎行。\n妇人在军中，\n兵气恐不扬。\n自嗟贫家女，\n久致罗襦裳[6]。\n罗襦不复施，\n对君洗红妆。\n仰视百鸟飞，\n大小必双翔[7]。\n人事多错迕，\n与君永相望。\n“三吏”主要是用问答方式写的，诗中有诗人和官吏的对话，或老妇对官吏的回答。“三别”却是用独白方式写的，诗中没有诗人出现，如《新婚别》就是新娘内心的独白。开始写新娘诉说自己不幸的命运，内容非常有戏剧性，却以比喻开始，把自己比作蔓草，缠绕在蓬麻上，注定了生长不长的。所以昨夜洞房花烛，今晨就要生离死别。而根据古代婚礼，三天以后才能拜见公婆，这样一夜夫妻，连身份都不明呢。接着新娘把话题由自身转到丈夫身上，说自己嫁鸡随鸡，而丈夫要上战场，自己又不能跟随，只能待在家里，心乱如麻。再后写新娘以理化情，鼓励丈夫从军，自己宁可不穿罗衣，不施脂粉，在家等候丈夫回来。最后又以比喻作结，看见百鸟双飞，觉得自己反而不如鸟了。这首诗写出了新娘矛盾曲折的心理，从中可以看出诗人同情人民、反对战争的思想。\n注释：\n[1]兔丝：植物名，又名无根草。一种依附于其他植物生长的寄生植物。\n[2]河阳：唐军与叛军对峙之处。\n[3]姑嫜（zhānɡ）：公婆。\n[4]归：出嫁。\n[5]苍黄：同“仓皇”，形容慌张失措的样子。这里指会带来麻烦。\n[6]襦裳：襦为短衣，裳为下衣。\n[7]双翔：成双成对地飞翔。", "english": "The creeper clinging to the flax is wrong,\nFor it can't be expected to grow long.\nIf a maiden to a soldier is tied\nIn wedlock, better forsake her by roadside.\nMy hair dressed up, to you I'm newly wed,\nBut we have not yet warmed our nuptial bed.\nMarried last night, at dawn we bid adieu.\nWhy should I part in such hurry with you?\nThough you may not be very far away,\nOnly in Heyang garrison you'll stay.\nI have not performed the rites of a wife.\nHow can I serve your parents all my life?\nBred by my parents, I was told it's right\nTo hide indoors every day and night.\nOh, I am destined to go to your house\nLike a hen or a dog to be your spouse.\nNow you go to a place in face of death,\nHow can I not utter my painful breath?\nI would follow you wherever you go,\nBut I fear it would bring less weal than woe.\nSo forget the bride in your family then,\nBut do your duty as all army men.\nIf there were women in the camp, I fear,\nIt's no good for morale on the frontier.\nAs a daughter of a poor family,\nIt's difficult to get silk robe for me.\nBut I fear I could not wear it again,\nRougeless and powderless I would remain.\nLooking up, I see hundreds of birds fly,\nBig or small, all of them in pairs on high.\nWhy different should be our human fate?\nO how long, how long should I for you wait!", "poemType": "五言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">兔丝<sup class=\"note-ref\">[1]</sup>附蓬麻，<br>引蔓故不长。<br>嫁女与征夫，<br>不如弃路旁。<br>结发为妻子，<br>席不暖君床。<br>暮婚晨告别，<br>无乃太匆忙！<br>君行虽不远，<br>守边赴河阳<sup class=\"note-ref\">[2]</sup>。<br>妾身未分明，<br>何以拜姑嫜<sup class=\"note-ref\">[3]</sup>？<br>父母养我时，<br>日夜令我藏。<br>生女有所归<sup class=\"note-ref\">[4]</sup>，<br>鸡狗亦得将。<br>君今往死地，<br>沉痛迫中肠。<br>誓欲随君去，<br>形势反苍黄<sup class=\"note-ref\">[5]</sup>。<br>勿为新婚念，<br>努力事戎行。<br>妇人在军中，<br>兵气恐不扬。<br>自嗟贫家女，<br>久致罗襦裳<sup class=\"note-ref\">[6]</sup>。<br>罗襦不复施，<br>对君洗红妆。<br>仰视百鸟飞，<br>大小必双翔<sup class=\"note-ref\">[7]</sup>。<br>人事多错迕，<br>与君永相望。</p>\n<p class=\"prose\">“三吏”主要是用问答方式写的，诗中有诗人和官吏的对话，或老妇对官吏的回答。“三别”却是用独白方式写的，诗中没有诗人出现，如《新婚别》就是新娘内心的独白。开始写新娘诉说自己不幸的命运，内容非常有戏剧性，却以比喻开始，把自己比作蔓草，缠绕在蓬麻上，注定了生长不长的。</p>\n<p class=\"prose\">所以昨夜洞房花烛，今晨就要生离死别。而根据古代婚礼，三天以后才能拜见公婆，这样一夜夫妻，连身份都不明呢。接着新娘把话题由自身转到丈夫身上，说自己嫁鸡随鸡，而丈夫要上战场，自己又不能跟随，只能待在家里，心乱如麻。再后写新娘以理化情，鼓励丈夫从军，自己宁可不穿罗衣，不施脂粉，在家等候丈夫回来。</p>\n<p class=\"prose\">最后又以比喻作结，看见百鸟双飞，觉得自己反而不如鸟了。这首诗写出了新娘矛盾曲折的心理，从中可以看出诗人同情人民、反对战争的思想。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]兔丝：植物名，又名无根草。一种依附于其他植物生长的寄生植物。<br>[2]河阳：唐军与叛军对峙之处。<br>[3]姑嫜（zhānɡ）：公婆。<br>[4]归：出嫁。<br>[5]苍黄：同“仓皇”，形容慌张失措的样子。这里指会带来麻烦。<br>[6]襦裳：襦为短衣，裳为下衣。<br>[7]双翔：成双成对地飞翔。</p>", "englishHtml": "<p class=\"poem-lines\">The creeper clinging to the flax is wrong,<br>For it can&#x27;t be expected to grow long.<br>If a maiden to a soldier is tied<br>In wedlock, better forsake her by roadside.<br>My hair dressed up, to you I&#x27;m newly wed,<br>But we have not yet warmed our nuptial bed.<br>Married last night, at dawn we bid adieu.<br>Why should I part in such hurry with you?<br>Though you may not be very far away,<br>Only in Heyang garrison you&#x27;ll stay.<br>I have not performed the rites of a wife.<br>How can I serve your parents all my life?<br>Bred by my parents, I was told it&#x27;s right<br>To hide indoors every day and night.<br>Oh, I am destined to go to your house<br>Like a hen or a dog to be your spouse.<br>Now you go to a place in face of death,<br>How can I not utter my painful breath?<br>I would follow you wherever you go,<br>But I fear it would bring less weal than woe.<br>So forget the bride in your family then,<br>But do your duty as all army men.<br>If there were women in the camp, I fear,<br>It&#x27;s no good for morale on the frontier.<br>As a daughter of a poor family,<br>It&#x27;s difficult to get silk robe for me.<br>But I fear I could not wear it again,<br>Rougeless and powderless I would remain.<br>Looking up, I see hundreds of birds fly,<br>Big or small, all of them in pairs on high.<br>Why different should be our human fate?<br>O how long, how long should I for you wait!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Lament of the Newly Wed,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, birds, homecoming, and war and displacement give the poem its visual texture and emotional temperature.</p>"}, {"num": "032", "zhTitle": "垂老别", "enTitle": "Lament of an Old Man", "chinese": "四郊未宁静，\n垂老不得安。\n子孙阵亡尽，\n焉用身独完[1]！\n投杖出门去，\n同行为辛酸。\n幸有牙齿存，\n所悲骨髓干[2]。\n男儿既介胄[3]，\n长揖别上官。\n老妻卧路啼，\n岁暮衣裳单。\n孰知是死别，\n且复伤其寒。\n此去必不归，\n还闻劝加餐。\n土门[4]壁甚坚，\n杏园[5]度亦难。\n势异邺城下，\n纵死时犹宽。\n人生有离合，\n岂择衰盛端[6]！\n忆昔少壮日，\n迟回竟长叹。\n万国尽征戍，\n烽火被冈峦[7]。\n积尸草木腥，\n流血川原丹。\n何乡为乐土？\n安敢尚盘桓！\n弃绝蓬室居，\n塌然摧肺肝[8]。\n《石壕吏》写“有吏夜捉人”，捉走的是老妇；《垂老别》写官府征兵，征去的却是老翁。这首叙事诗不以情节曲折取胜，而以人物的心理刻画见长。诗人用老翁的自诉自叹，对人对己的安慰语气来展开描写，着重表现人物时而沉重忧愤，时而自作旷达的复杂心理。杜甫高于一般诗人的地方，主要在于他无论是叙事还是抒情，都能做到立足生活，深入人心，通过个别反映一般，准确传神地表现他那个时代的生活现实，概括劳动人民的辛酸苦难。诗中老翁担心老妻受寒着凉，老妻劝老翁要努力加餐，这些生活中极其寻常的劝慰语言，出现在极不寻常的生离死别的背景之下，便收到了惊心动魄的艺术效果。有时老翁故作旷达之语，但也不能掩饰内心的矛盾，反倒流露出了乱世的真情。这就是杜诗为什么被称为“诗史”的原因。\n注释：\n[1]身独完：独自活下去。\n[2]骨髓干：形容身体的衰老。\n[3]介胄：即“甲胄”，指铠甲、头盔。\n[4]土门：土门关。唐代防守的要地。\n[5]杏园：唐军防守的要地，位于今河南省卫辉市东南。\n[6]端：思绪。\n[7]被冈峦：遍布整个山冈。\n[8]摧肺肝：极度悲痛的样子。", "english": "In all the country there's no peace.\nHow can an old man live with ease?\nSons and grandsons in battle slain,\nWhy should my old body remain?\nCasting my staff away, I go;\nMy companions compassion show.\nFortunately my teeth are sound,\nBut in my bones no marrow's found.\nAs soldier clad in armor now,\nTo officers I make a bow.\nBy the roadside cries my wife old,\nSo thinly clad in winter cold.\nWho knows if we can meet again?\nSeeing her shiver, I feel pain.\nOnce gone, I can't come back, I fear;\nShe still says, “Eat more!” to my ear.\nI tell her the fortress is strong,\nTo cross the stream takes a time long.\nUnlike the siege of days gone by,\nIt's not so soon for me to die.\nTo meet or part is fate in life,\nWhether with a young or old wife.\nRemembering when I was strong,\nCan I not heave sighs deep and long!\nWar's raging in the countryside;\nBeacon fire blazes far and wide.\nGrass and trees stink with bodies dead;\nWith blood the streams and plains turn red.\nWhere can I find a happy land?\nWhy do I tarry here and stand?\nWhy not from my humble home part\nAnd march away with broken heart!", "poemType": "五言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">四郊未宁静，<br>垂老不得安。<br>子孙阵亡尽，<br>焉用身独完<sup class=\"note-ref\">[1]</sup>！<br>投杖出门去，<br>同行为辛酸。<br>幸有牙齿存，<br>所悲骨髓干<sup class=\"note-ref\">[2]</sup>。<br>男儿既介胄<sup class=\"note-ref\">[3]</sup>，<br>长揖别上官。<br>老妻卧路啼，<br>岁暮衣裳单。<br>孰知是死别，<br>且复伤其寒。<br>此去必不归，<br>还闻劝加餐。<br>土门<sup class=\"note-ref\">[4]</sup>壁甚坚，<br>杏园<sup class=\"note-ref\">[5]</sup>度亦难。<br>势异邺城下，<br>纵死时犹宽。<br>人生有离合，<br>岂择衰盛端<sup class=\"note-ref\">[6]</sup>！<br>忆昔少壮日，<br>迟回竟长叹。<br>万国尽征戍，<br>烽火被冈峦<sup class=\"note-ref\">[7]</sup>。<br>积尸草木腥，<br>流血川原丹。<br>何乡为乐土？<br>安敢尚盘桓！<br>弃绝蓬室居，<br>塌然摧肺肝<sup class=\"note-ref\">[8]</sup>。</p>\n<p class=\"prose\">《石壕吏》写“有吏夜捉人”，捉走的是老妇；《垂老别》写官府征兵，征去的却是老翁。这首叙事诗不以情节曲折取胜，而以人物的心理刻画见长。诗人用老翁的自诉自叹，对人对己的安慰语气来展开描写，着重表现人物时而沉重忧愤，时而自作旷达的复杂心理。</p>\n<p class=\"prose\">杜甫高于一般诗人的地方，主要在于他无论是叙事还是抒情，都能做到立足生活，深入人心，通过个别反映一般，准确传神地表现他那个时代的生活现实，概括劳动人民的辛酸苦难。诗中老翁担心老妻受寒着凉，老妻劝老翁要努力加餐，这些生活中极其寻常的劝慰语言，出现在极不寻常的生离死别的背景之下，便收到了惊心动魄的艺术效果。</p>\n<p class=\"prose\">有时老翁故作旷达之语，但也不能掩饰内心的矛盾，反倒流露出了乱世的真情。这就是杜诗为什么被称为“诗史”的原因。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]身独完：独自活下去。<br>[2]骨髓干：形容身体的衰老。<br>[3]介胄：即“甲胄”，指铠甲、头盔。<br>[4]土门：土门关。唐代防守的要地。<br>[5]杏园：唐军防守的要地，位于今河南省卫辉市东南。<br>[6]端：思绪。<br>[7]被冈峦：遍布整个山冈。<br>[8]摧肺肝：极度悲痛的样子。</p>", "englishHtml": "<p class=\"poem-lines\">In all the country there&#x27;s no peace.<br>How can an old man live with ease?<br>Sons and grandsons in battle slain,<br>Why should my old body remain?<br>Casting my staff away, I go;<br>My companions compassion show.<br>Fortunately my teeth are sound,<br>But in my bones no marrow&#x27;s found.<br>As soldier clad in armor now,<br>To officers I make a bow.<br>By the roadside cries my wife old,<br>So thinly clad in winter cold.<br>Who knows if we can meet again?<br>Seeing her shiver, I feel pain.<br>Once gone, I can&#x27;t come back, I fear;<br>She still says, “Eat more!” to my ear.<br>I tell her the fortress is strong,<br>To cross the stream takes a time long.<br>Unlike the siege of days gone by,<br>It&#x27;s not so soon for me to die.<br>To meet or part is fate in life,<br>Whether with a young or old wife.<br>Remembering when I was strong,<br>Can I not heave sighs deep and long!<br>War&#x27;s raging in the countryside;<br>Beacon fire blazes far and wide.<br>Grass and trees stink with bodies dead;<br>With blood the streams and plains turn red.<br>Where can I find a happy land?<br>Why do I tarry here and stand?<br>Why not from my humble home part<br>And march away with broken heart!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Lament of an Old Man,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as frontier scenes, homecoming, war and displacement, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "033", "zhTitle": "无家别", "enTitle": "Lament of a Homeless", "chinese": "寂寞天宝后[1]，\n园庐[2]但蒿藜。\n我里百余家，\n世乱各东西。\n存者无消息，\n死者为尘泥。\n贱子因阵败，\n归来寻旧蹊。\n久行见空巷，\n日瘦[3]气惨凄。\n但对狐与狸，\n竖毛怒我啼。\n四邻何所有？\n一二老寡妻。\n宿鸟恋本枝，\n安辞且穷栖。\n方春独荷锄，\n日暮还灌畦。\n县吏知我至，\n召令习鼓鼙。\n虽从本州役，\n内顾无所携[4]。\n近行止一身，\n远去终转迷[5]。\n家乡既荡尽，\n远近理亦齐。\n永痛长病母，\n五年委沟溪[6]。\n生我不得力，\n终身两酸嘶[7]。\n人生无家别，\n何以为蒸黎[8]！\n“三别”中《新婚别》写的是年轻的新婚夫妇，《垂老别》写的是年高的老夫老妻，《无家别》写的却是无家可归的中年男子。无家可归的人自称“贱子”，在战乱后回到家乡，只见一片荒凉，满目蒿藜。昔日百户人家，今日只见空巷。天上的太阳也愁容满面，消瘦暗淡；地上不见人迹，只有狐狸出没。近景描写细致，刻画入微。空宅凄凄，家人早已故去，抚今忆昔，不禁感慨系之，把自己比作无枝可栖的归鸟。不料县吏知道他回来了，又征调他去打鼓。于是他自喜自伤，喜的是在本州服役，伤的是无人送别；但一想到还要远去打仗，远近又有什么分别？这样层层深入地分析他的心理变化，又通过环境的描写，反映人物的思想感情。\n注释：\n[1]天宝后：安史之乱后。安史之乱爆发于天宝年间，故称“天宝后”。\n[2]庐：住所，房屋。\n[3]日瘦：日光淡薄。\n[4]无所携：家里没有人可以作别。\n[5]终转迷：终究前途未卜，生死难料。\n[6]委沟溪：母亲被埋葬在山谷中。\n[7]两酸嘶：母子二人含恨。\n[8]蒸黎：劳动人民。", "english": "Since the rebellion I feel lone,\nMy house with weeds is overgrown.\nA hundred homes can find no rest;\nPeople are scattered east and west.\nNone knows where the living have fled,\nWhile to dust have returned the dead.\nMy humble self after the defeat\nCome back to find my old retreat.\nI walk long on deserted lanes.\nThe sun grows lean where drear air reigns.\nIn face of bristling fox or cat,\nI am afraid to be growled at.\nHow many neighbors left, all told?\nOnly one or two widows old.\nA bird will not leave its own nest,\nMy house, though poor, will give me rest.\nTo hoe up weeds in spring's my lot,\nAt dusk I water garden plot.\nThe magistrate knowing I've come\nOrders me to learn to beat drum.\nFor service in my native land,\nI need not carry things in hand.\nAlone, I care not where to stay,\nBe it near by or far away.\nThe land's in ruins and debris,\nThe distance means nothing to me.\nSick for five years, my mother died\nUnburied, with none by her side.\nShe gave birth to me, is it wrong?\nHow to repay her all life long?\nI have no home to say goodbye.\nWhat can poor people do but sigh!", "poemType": "五言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">寂寞天宝后<sup class=\"note-ref\">[1]</sup>，<br>园庐<sup class=\"note-ref\">[2]</sup>但蒿藜。<br>我里百余家，<br>世乱各东西。<br>存者无消息，<br>死者为尘泥。<br>贱子因阵败，<br>归来寻旧蹊。<br>久行见空巷，<br>日瘦<sup class=\"note-ref\">[3]</sup>气惨凄。<br>但对狐与狸，<br>竖毛怒我啼。<br>四邻何所有？<br>一二老寡妻。<br>宿鸟恋本枝，<br>安辞且穷栖。<br>方春独荷锄，<br>日暮还灌畦。<br>县吏知我至，<br>召令习鼓鼙。<br>虽从本州役，<br>内顾无所携<sup class=\"note-ref\">[4]</sup>。<br>近行止一身，<br>远去终转迷<sup class=\"note-ref\">[5]</sup>。<br>家乡既荡尽，<br>远近理亦齐。<br>永痛长病母，<br>五年委沟溪<sup class=\"note-ref\">[6]</sup>。<br>生我不得力，<br>终身两酸嘶<sup class=\"note-ref\">[7]</sup>。<br>人生无家别，<br>何以为蒸黎<sup class=\"note-ref\">[8]</sup>！</p>\n<p class=\"prose\">“三别”中《新婚别》写的是年轻的新婚夫妇，《垂老别》写的是年高的老夫老妻，《无家别》写的却是无家可归的中年男子。无家可归的人自称“贱子”，在战乱后回到家乡，只见一片荒凉，满目蒿藜。昔日百户人家，今日只见空巷。天上的太阳也愁容满面，消瘦暗淡；</p>\n<p class=\"prose\">地上不见人迹，只有狐狸出没。近景描写细致，刻画入微。空宅凄凄，家人早已故去，抚今忆昔，不禁感慨系之，把自己比作无枝可栖的归鸟。不料县吏知道他回来了，又征调他去打鼓。于是他自喜自伤，喜的是在本州服役，伤的是无人送别；但一想到还要远去打仗，远近又有什么分别？</p>\n<p class=\"prose\">这样层层深入地分析他的心理变化，又通过环境的描写，反映人物的思想感情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]天宝后：安史之乱后。安史之乱爆发于天宝年间，故称“天宝后”。<br>[2]庐：住所，房屋。<br>[3]日瘦：日光淡薄。<br>[4]无所携：家里没有人可以作别。<br>[5]终转迷：终究前途未卜，生死难料。<br>[6]委沟溪：母亲被埋葬在山谷中。<br>[7]两酸嘶：母子二人含恨。<br>[8]蒸黎：劳动人民。</p>", "englishHtml": "<p class=\"poem-lines\">Since the rebellion I feel lone,<br>My house with weeds is overgrown.<br>A hundred homes can find no rest;<br>People are scattered east and west.<br>None knows where the living have fled,<br>While to dust have returned the dead.<br>My humble self after the defeat<br>Come back to find my old retreat.<br>I walk long on deserted lanes.<br>The sun grows lean where drear air reigns.<br>In face of bristling fox or cat,<br>I am afraid to be growled at.<br>How many neighbors left, all told?<br>Only one or two widows old.<br>A bird will not leave its own nest,<br>My house, though poor, will give me rest.<br>To hoe up weeds in spring&#x27;s my lot,<br>At dusk I water garden plot.<br>The magistrate knowing I&#x27;ve come<br>Orders me to learn to beat drum.<br>For service in my native land,<br>I need not carry things in hand.<br>Alone, I care not where to stay,<br>Be it near by or far away.<br>The land&#x27;s in ruins and debris,<br>The distance means nothing to me.<br>Sick for five years, my mother died<br>Unburied, with none by her side.<br>She gave birth to me, is it wrong?<br>How to repay her all life long?<br>I have no home to say goodbye.<br>What can poor people do but sigh!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Lament of a Homeless,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, birds, homecoming, and war and displacement give the poem its visual texture and emotional temperature.</p>"}, {"num": "034", "zhTitle": "佳人", "enTitle": "A Fair Lady", "chinese": "绝代有佳人，\n幽居在空谷。\n自云良家子，\n零落依草木[1]。\n关中昔丧败，\n兄弟遭杀戮。\n官高何足论？\n不得收骨肉[2]。\n世情恶衰歇，\n万事随转烛[3]。\n夫婿轻薄儿，\n新人美如玉。\n合昏[4]尚知时，\n鸳鸯不独宿。\n但见新人笑，\n那闻旧人哭？\n在山泉水清，\n出山泉水浊。\n侍婢卖珠回，\n牵萝[5]补茅屋。\n摘花不插发，\n采柏[6]动盈掬。\n天寒翠袖薄，\n日暮倚修竹。\n《佳人》作于公元759年秋天，杜甫在安史之乱后辞官家居的时候。诗中的绝代佳人是个良家女子，兄弟都是高官，不幸在战乱中被害，自己又被喜新厌旧的丈夫遗弃，只得同侍婢幽居在空谷中。这位佳人的形象，在中国古典文学的人物画廊中，显得独特而且鲜明。她的命运非常悲惨，但是情操却又非常高洁。杜甫写她的命运时，用的是第一人称，语气直率酣畅，多用“赋”的手法；赞美她的人品时，用的却是第三人称，笔调含蓄蕴藉，多用“比兴”手法。如用山中泉水之清，来比喻空谷佳人的品格；用补壁青萝的朴素，来显示她纯洁的心灵；用采来充饥的柏子，象征耐寒不凋的品质；用日暮常倚的翠竹，暗示挺拔劲节的操行。所以梁启超在《情圣杜甫》中说：“这位佳人，身份是非常名贵的，境遇是非常可怜的，情绪是非常温厚的，性格是非常高亢的，这便是他（杜甫）本人的写照。”\n注释：\n[1]依草木：在山中居住。\n[2]骨肉：一同受苦的兄弟。\n[3]转烛：风中的烛火转动明灭，比喻世事无常。\n[4]合昏：夜合花，叶子早晨开傍晚合。\n[5]牵萝：拾树枝藤条。\n[6]采柏：采摘柏树叶。", "english": "The fairest lady in full bloom\nLives in a valley in deep gloom.\nBorn from a noble family,\nShe sinks into wild greenery.\nRiots broke out on Central Plain,\nHer brothers by ill luck were slain.\nIn vain were they officials high;\nTheir corpses still unburied lie.\nThe world cares not for those who fall;\nWith dying candle passes all.\n“My husband's fickle, I'm afraid,\nHe took a new wife fair as jade.\nAt dusk mimosa folds up leaves;\nAt night a lonely lovebird grieves.\nHe loves his new wife's smile so deep\nThat he hears not his old wife weep.\nClear water flowing from the fountain\nTurns filthy when out of the mountain.\nMy maid's sold pearls that we may dine;\nWe mend our thatched cot with vine.\nI pick for my hair no flowers sweet,\nBut handfuls of cypress seed to eat.\nWith cold shiver my thin sleeves green.\nAt dusk on long bamboo I'd lean.”", "poemType": "五言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">绝代有佳人，<br>幽居在空谷。<br>自云良家子，<br>零落依草木<sup class=\"note-ref\">[1]</sup>。<br>关中昔丧败，<br>兄弟遭杀戮。<br>官高何足论？<br>不得收骨肉<sup class=\"note-ref\">[2]</sup>。<br>世情恶衰歇，<br>万事随转烛<sup class=\"note-ref\">[3]</sup>。<br>夫婿轻薄儿，<br>新人美如玉。<br>合昏<sup class=\"note-ref\">[4]</sup>尚知时，<br>鸳鸯不独宿。<br>但见新人笑，<br>那闻旧人哭？<br>在山泉水清，<br>出山泉水浊。<br>侍婢卖珠回，<br>牵萝<sup class=\"note-ref\">[5]</sup>补茅屋。<br>摘花不插发，<br>采柏<sup class=\"note-ref\">[6]</sup>动盈掬。<br>天寒翠袖薄，<br>日暮倚修竹。</p>\n<p class=\"prose\">《佳人》作于公元759年秋天，杜甫在安史之乱后辞官家居的时候。诗中的绝代佳人是个良家女子，兄弟都是高官，不幸在战乱中被害，自己又被喜新厌旧的丈夫遗弃，只得同侍婢幽居在空谷中。这位佳人的形象，在中国古典文学的人物画廊中，显得独特而且鲜明。</p>\n<p class=\"prose\">她的命运非常悲惨，但是情操却又非常高洁。杜甫写她的命运时，用的是第一人称，语气直率酣畅，多用“赋”的手法；赞美她的人品时，用的却是第三人称，笔调含蓄蕴藉，多用“比兴”手法。如用山中泉水之清，来比喻空谷佳人的品格；用补壁青萝的朴素，来显示她纯洁的心灵；</p>\n<p class=\"prose\">用采来充饥的柏子，象征耐寒不凋的品质；用日暮常倚的翠竹，暗示挺拔劲节的操行。所以梁启超在《情圣杜甫》中说：“这位佳人，身份是非常名贵的，境遇是非常可怜的，情绪是非常温厚的，性格是非常高亢的，这便是他（杜甫）本人的写照。”</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]依草木：在山中居住。<br>[2]骨肉：一同受苦的兄弟。<br>[3]转烛：风中的烛火转动明灭，比喻世事无常。<br>[4]合昏：夜合花，叶子早晨开傍晚合。<br>[5]牵萝：拾树枝藤条。<br>[6]采柏：采摘柏树叶。</p>", "englishHtml": "<p class=\"poem-lines\">The fairest lady in full bloom<br>Lives in a valley in deep gloom.<br>Born from a noble family,<br>She sinks into wild greenery.<br>Riots broke out on Central Plain,<br>Her brothers by ill luck were slain.<br>In vain were they officials high;<br>Their corpses still unburied lie.<br>The world cares not for those who fall;<br>With dying candle passes all.<br>“My husband&#x27;s fickle, I&#x27;m afraid,<br>He took a new wife fair as jade.<br>At dusk mimosa folds up leaves;<br>At night a lonely lovebird grieves.<br>He loves his new wife&#x27;s smile so deep<br>That he hears not his old wife weep.<br>Clear water flowing from the fountain<br>Turns filthy when out of the mountain.<br>My maid&#x27;s sold pearls that we may dine;<br>We mend our thatched cot with vine.<br>I pick for my hair no flowers sweet,<br>But handfuls of cypress seed to eat.<br>With cold shiver my thin sleeves green.<br>At dusk on long bamboo I&#x27;d lean.”</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Fair Lady,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, water, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "035", "zhTitle": "梦李白 （二首其一）", "enTitle": "Dreaming of Li Bai ( I )", "chinese": "梦李白\n（二首其一）\n死别已吞声，\n生别常恻恻[1]。\n江南瘴疠[2]地，\n逐客无消息。\n故人入我梦，\n明我长相忆。\n君今在罗网[3]，\n何以有羽翼？\n恐非平生魂，\n路远不可测。\n魂来枫林[4]青，\n魂返关塞[5]黑。\n落月满屋梁，\n犹疑照颜色[6]。\n水深波浪阔，\n无使皎龙得！\n公元758年李白流放夜郎，第二年春在白帝城遇赦，回到江陵。但是杜甫远在北方，不知此事，写了两首《梦李白》，这是第一首。这首记梦诗分别按梦前、梦中、梦后叙写。写梦之前先写别离，生离之前先说死别，以死别衬托生离，可见二人是生死之交。前四句写梦前，第五句不说梦见故人，却说故人入梦，而入梦又是有感于诗人的长久思念，可见二人思念之深。梦中乍见而喜，转念而疑，继而生出忧惧，对梦中心理的刻画，十分细腻逼真。梦魂归去，诗人依然思念不已，唯恐水深蛟龙作浪，诗魂再陷龙潭，的确是至诚至真的文字。梁启超说得好：杜甫对李白“所感痛苦，和自己亲受一样，所以作出来的诗，句句都带血带泪”。\n注释：\n[1]恻恻：悲叹不已。\n[2]瘴疠：疾病，时疫。\n[3]罗网：指法网。\n[4]枫林：李白被放逐前往的地方多见枫树。\n[5]关塞：杜甫流亡经过的秦州一带多见关塞。\n[6]颜色：指相貌。", "english": "Dreaming of Li Bai\n(I)\nWe stifle sobs on parting with the dead;\nOn parting with the living, tears are shed.\nYou're exiled to miasmic Southern shore.\nHow can you not send us news any more?\nLast night you came into my dream anew;\nThis shows how long I am thinking of you.\nNow you are caught in net and bound with strings.\nHow can you free yourself with bound-up wings?\nI fear it was not your soul I did dream.\nCould it go such long way o'er mount and stream?\nWhen it came, green would maple forests loom;\nWhen it went, dark mountains were left in gloom.\nThe setting moon on rafters sheds its light;\nI seem to see your beaming face as bright.\nO monstrous billows where water is deep,\nDon't wake up monsters and dragons asleep!", "poemType": "五言古诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">梦李白<br>（二首其一）<br>死别已吞声，<br>生别常恻恻<sup class=\"note-ref\">[1]</sup>。<br>江南瘴疠<sup class=\"note-ref\">[2]</sup>地，<br>逐客无消息。<br>故人入我梦，<br>明我长相忆。<br>君今在罗网<sup class=\"note-ref\">[3]</sup>，<br>何以有羽翼？<br>恐非平生魂，<br>路远不可测。<br>魂来枫林<sup class=\"note-ref\">[4]</sup>青，<br>魂返关塞<sup class=\"note-ref\">[5]</sup>黑。<br>落月满屋梁，<br>犹疑照颜色<sup class=\"note-ref\">[6]</sup>。<br>水深波浪阔，<br>无使皎龙得！</p>\n<p class=\"prose\">公元758年李白流放夜郎，第二年春在白帝城遇赦，回到江陵。但是杜甫远在北方，不知此事，写了两首《梦李白》，这是第一首。这首记梦诗分别按梦前、梦中、梦后叙写。写梦之前先写别离，生离之前先说死别，以死别衬托生离，可见二人是生死之交。</p>\n<p class=\"prose\">前四句写梦前，第五句不说梦见故人，却说故人入梦，而入梦又是有感于诗人的长久思念，可见二人思念之深。梦中乍见而喜，转念而疑，继而生出忧惧，对梦中心理的刻画，十分细腻逼真。梦魂归去，诗人依然思念不已，唯恐水深蛟龙作浪，诗魂再陷龙潭，的确是至诚至真的文字。</p>\n<p class=\"prose\">梁启超说得好：杜甫对李白“所感痛苦，和自己亲受一样，所以作出来的诗，句句都带血带泪”。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]恻恻：悲叹不已。<br>[2]瘴疠：疾病，时疫。<br>[3]罗网：指法网。<br>[4]枫林：李白被放逐前往的地方多见枫树。<br>[5]关塞：杜甫流亡经过的秦州一带多见关塞。<br>[6]颜色：指相貌。</p>", "englishHtml": "<p class=\"poem-lines\">Dreaming of Li Bai(I)<br>We stifle sobs on parting with the dead;<br>On parting with the living, tears are shed.<br>You&#x27;re exiled to miasmic Southern shore.<br>How can you not send us news any more?<br>Last night you came into my dream anew;<br>This shows how long I am thinking of you.<br>Now you are caught in net and bound with strings.<br>How can you free yourself with bound-up wings?<br>I fear it was not your soul I did dream.<br>Could it go such long way o&#x27;er mount and stream?<br>When it came, green would maple forests loom;<br>When it went, dark mountains were left in gloom.<br>The setting moon on rafters sheds its light;<br>I seem to see your beaming face as bright.<br>O monstrous billows where water is deep,<br>Don&#x27;t wake up monsters and dragons asleep!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Dreaming of Li Bai ( I ),” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, moonlight, trees, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "036", "zhTitle": "梦李白 （二首其二）", "enTitle": "Dreaming of Li Bai ( II )", "chinese": "梦李白\n（二首其二）\n浮云[1]终日行，\n游子[2]久不至。\n三夜频梦君，\n情亲见君意。\n告归常局促，\n苦道来不易。\n江湖多风波，\n舟楫恐失坠。\n出门搔白首[3]，\n若负平生志。\n冠盖满京华，\n斯人独憔悴。\n孰云网恢恢？\n将老身反累。\n千秋万岁名，\n寂寞身后事。\n前篇所写是诗人初次梦见李白的情景，此后又连续出现类似的梦境，于是诗人又有此后篇的咏叹。前篇写的是梦见李白后忐忑不安的心理，后篇写的是梦中所见李白的形象。前四句诉说对故人的情谊。君入我梦，我见君意，体现两人肝胆相照的深情厚谊。“告归”六句描绘梦中李白的形象：每当魂归时，总是局促不安，苦诉往来之不易和江上风波迭起，对舟楫为风浪所吞的担忧；走出门去时搔着满头白发，分明是对壮志未酬宏图难展的怅然。对李白的多个侧面描写，使其犹在眼前。“江湖”两句，暗喻李白身处险境，抒发诗人与李白惺惺相惜之情。后六句是诗人梦醒后所发感慨：峨冠华盖权高位重者满京华都是，唯独这样一个风华绝代的人晚景凄凉，说什么天网恢恢。纵然一定会流芳百世，然而身后之事生前是看不到了。作者发出沉重的喟叹，寄托着对李白的崇高评价和深厚同情，也包含着诗人自己的无限心事。\n注释：\n[1]浮云：比喻人飘游不定。\n[2]游子：指李白。\n[3]搔白首：大概是李白的习惯动作。", "english": "Dreaming of Li Bai\n(II)\nWandering clouds can be seen all the day,\nBut you, a wanderer, are far away.\nFor three successive nights I dreamed of you,\nThis shows our friendship old and ever new.\nLeaving in haste, you said you had to go,\nIt was not easy to come, as we know.\nThere might be perils on the lake or river,\nA single man in a small boat should shiver.\nOn leaving me, you scratched your white hair,\nRegretting your ideals vanish in air.\nSo many courtiers in the capital,\nWhy should you not find your place, not at all?\nWho says there is justice under the sky?\nHow could you have been exiled so far? Why?\nWhat is the use of fame which lasts so long\nAs people have sung the funeral song?", "poemType": "五言古诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">梦李白<br>（二首其二）<br>浮云<sup class=\"note-ref\">[1]</sup>终日行，<br>游子<sup class=\"note-ref\">[2]</sup>久不至。<br>三夜频梦君，<br>情亲见君意。<br>告归常局促，<br>苦道来不易。<br>江湖多风波，<br>舟楫恐失坠。<br>出门搔白首<sup class=\"note-ref\">[3]</sup>，<br>若负平生志。<br>冠盖满京华，<br>斯人独憔悴。<br>孰云网恢恢？<br>将老身反累。<br>千秋万岁名，<br>寂寞身后事。</p>\n<p class=\"prose\">前篇所写是诗人初次梦见李白的情景，此后又连续出现类似的梦境，于是诗人又有此后篇的咏叹。前篇写的是梦见李白后忐忑不安的心理，后篇写的是梦中所见李白的形象。前四句诉说对故人的情谊。君入我梦，我见君意，体现两人肝胆相照的深情厚谊。</p>\n<p class=\"prose\">“告归”六句描绘梦中李白的形象：每当魂归时，总是局促不安，苦诉往来之不易和江上风波迭起，对舟楫为风浪所吞的担忧；走出门去时搔着满头白发，分明是对壮志未酬宏图难展的怅然。对李白的多个侧面描写，使其犹在眼前。“江湖”两句，暗喻李白身处险境，抒发诗人与李白惺惺相惜之情。</p>\n<p class=\"prose\">后六句是诗人梦醒后所发感慨：峨冠华盖权高位重者满京华都是，唯独这样一个风华绝代的人晚景凄凉，说什么天网恢恢。纵然一定会流芳百世，然而身后之事生前是看不到了。作者发出沉重的喟叹，寄托着对李白的崇高评价和深厚同情，也包含着诗人自己的无限心事。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]浮云：比喻人飘游不定。<br>[2]游子：指李白。<br>[3]搔白首：大概是李白的习惯动作。</p>", "englishHtml": "<p class=\"poem-lines\">Dreaming of Li Bai(II)<br>Wandering clouds can be seen all the day,<br>But you, a wanderer, are far away.<br>For three successive nights I dreamed of you,<br>This shows our friendship old and ever new.<br>Leaving in haste, you said you had to go,<br>It was not easy to come, as we know.<br>There might be perils on the lake or river,<br>A single man in a small boat should shiver.<br>On leaving me, you scratched your white hair,<br>Regretting your ideals vanish in air.<br>So many courtiers in the capital,<br>Why should you not find your place, not at all?<br>Who says there is justice under the sky?<br>How could you have been exiled so far? Why?<br>What is the use of fame which lasts so long<br>As people have sung the funeral song?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Dreaming of Li Bai ( II ),” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, clouds, homecoming, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "037", "zhTitle": "秦州杂诗 （二十首其七）", "enTitle": "On the Frontier ( VII )", "chinese": "秦州杂诗\n（二十首其七）\n莽莽万重山，\n孤城山谷间。\n无风云出塞，\n不夜月临关。\n属国[1]归何晚？\n楼兰[2]斩未还。\n烟尘一长望，\n衰飒正摧颜。\n公元759年秋天，杜甫携眷西行，历尽千辛万苦来到秦州。寓居秦州期间，诗人写出了《秦州杂诗》，共20首，这是第七首。首联即壁立千仞，落孤城于层峦叠嶂之间，四周苍莽大山，更衬托其险要高峻之势。扼咽喉要道，守边塞重地，身处这样一个富有烽火气息的敏感边城，日常生活也多一丝警觉之感。颔联表面写景，实则意味边塞生活宁静的表象下暗流涌动，也表达了诗人对紧张的边防形势的深切关注。五、六句用典，苏武出使匈奴，被扣留19年，归国后任典属国；傅介子以百人出使，取楼兰王首级。吐蕃趁唐内乱，夺取陇右、河西之地，才使秦州成为边防前线，大约这时有使臣出使吐蕃未还，而吐蕃侵袭的危机还未解除，所以诗人叹息国家衰弱，并对这种局势感到深深的忧虑。所以结尾诗人仿佛看到处处烟尘，战火弥漫，对国家衰落的担忧，使诗人不禁疾首蹙额。全诗蕴含着作者对国势日渐式微的悲凉之感。\n注释：\n[1]属国：指吐蕃的使臣。\n[2]楼兰：汉代西域的一个古代小国。", "english": "On the Frontier\n(VII)\nMountain on mountain towers far and near,\nA lonely town garrisons the frontier.\nEven without wind, cloud will sail the sky;\nThe moon on townwalls sheds twilight on high.\nHow could all the peace talks be held so late?\nWhen could we conquer the barbarous state?\nGazing on the war flames far, far away,\nMy face would lose color at the decay.", "poemType": "五言古诗", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">秦州杂诗<br>（二十首其七）<br>莽莽万重山，<br>孤城山谷间。<br>无风云出塞，<br>不夜月临关。<br>属国<sup class=\"note-ref\">[1]</sup>归何晚？<br>楼兰<sup class=\"note-ref\">[2]</sup>斩未还。<br>烟尘一长望，<br>衰飒正摧颜。</p>\n<p class=\"prose\">公元759年秋天，杜甫携眷西行，历尽千辛万苦来到秦州。寓居秦州期间，诗人写出了《秦州杂诗》，共20首，这是第七首。首联即壁立千仞，落孤城于层峦叠嶂之间，四周苍莽大山，更衬托其险要高峻之势。扼咽喉要道，守边塞重地，身处这样一个富有烽火气息的敏感边城，日常生活也多一丝警觉之感。</p>\n<p class=\"prose\">颔联表面写景，实则意味边塞生活宁静的表象下暗流涌动，也表达了诗人对紧张的边防形势的深切关注。五、六句用典，苏武出使匈奴，被扣留19年，归国后任典属国；傅介子以百人出使，取楼兰王首级。</p>\n<p class=\"prose\">吐蕃趁唐内乱，夺取陇右、河西之地，才使秦州成为边防前线，大约这时有使臣出使吐蕃未还，而吐蕃侵袭的危机还未解除，所以诗人叹息国家衰弱，并对这种局势感到深深的忧虑。所以结尾诗人仿佛看到处处烟尘，战火弥漫，对国家衰落的担忧，使诗人不禁疾首蹙额。</p>\n<p class=\"prose\">全诗蕴含着作者对国势日渐式微的悲凉之感。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]属国：指吐蕃的使臣。<br>[2]楼兰：汉代西域的一个古代小国。</p>", "englishHtml": "<p class=\"poem-lines\">On the Frontier</p>\n<p class=\"stanza-marker\">(VII)</p>\n<p class=\"poem-lines\">Mountain on mountain towers far and near,<br>A lonely town garrisons the frontier.<br>Even without wind, cloud will sail the sky;<br>The moon on townwalls sheds twilight on high.<br>How could all the peace talks be held so late?<br>When could we conquer the barbarous state?<br>Gazing on the war flames far, far away,<br>My face would lose color at the decay.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On the Frontier ( VII ),” the poem places personal feeling against the vastness of the frontier, so distance and danger become part of its force.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it sets Du Fu&#x27;s energetic voice against open space, travel, and danger. Key images such as mountains, moonlight, clouds, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "038", "zhTitle": "天末怀李白", "enTitle": "Thinking of Li Bai from the End of the Earth", "chinese": "凉风起天末[1]，\n君子意如何？\n鸿雁几时到？\n江湖秋水多。\n文章憎命达，\n魑魅[2]喜人过[3]。\n应共冤魂语，\n投诗赠汨罗。\n这首诗当作于公元759年秋，当时诗人弃官远游客居秦州。李白流放夜郎途中遇赦，还至湖南，杜甫因赋诗怀念他。天末指秦州，因地处边塞，宛在天尽头。凉风骤起，诗人自己的窘迫困顿都按下不提，只一句略嫌局促的寒暄，只是这一句寒暄包含了多少沧桑事，所以不知从何说起，只得欲说还休。急切盼望的书信久久不至，江湖多险，故书信一日不至，诗人一日不能安心，更见诗人思之心切。五、六句说文才出众者总是命途多舛，小人奸佞最喜闻乐见的是好人之过。这两句诗道出了自古以来才智之士的共同命运，也是与李白同病相怜的心声。自然而然地，诗人想起了屈原，同样遭到谗言诬陷，后被放逐的爱国忠魂。他说李白应“投诗赠汨罗”，是对李白的高度肯定，这样一个人不被这个时代所欣赏，只能向命运相同的古时圣贤倾诉。此诗感情强烈，读来百转千回。\n注释：\n[1]天末：天边。\n[2]魑（chī）魅（mèi）：妖怪。\n[3]过：失误。", "english": "An autumn wind rises from the end of the sky.\nWhat do you think of it in your mind and your eye?\nWhen will the wild geese bring your happy news to me?\nCould autumn fill the lake and the river with glee?\nGood fortune never favors those who can well write;\nDemons will ever do wrong to those who know what's right.\nWould you confide to the poet wronged long ago\nYour verse which might comfort his soul in weal and woe?", "poemType": "五言律诗", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">凉风起天末<sup class=\"note-ref\">[1]</sup>，<br>君子意如何？<br>鸿雁几时到？<br>江湖秋水多。<br>文章憎命达，<br>魑魅<sup class=\"note-ref\">[2]</sup>喜人过<sup class=\"note-ref\">[3]</sup>。<br>应共冤魂语，<br>投诗赠汨罗。</p>\n<p class=\"prose\">这首诗当作于公元759年秋，当时诗人弃官远游客居秦州。李白流放夜郎途中遇赦，还至湖南，杜甫因赋诗怀念他。天末指秦州，因地处边塞，宛在天尽头。凉风骤起，诗人自己的窘迫困顿都按下不提，只一句略嫌局促的寒暄，只是这一句寒暄包含了多少沧桑事，所以不知从何说起，只得欲说还休。</p>\n<p class=\"prose\">急切盼望的书信久久不至，江湖多险，故书信一日不至，诗人一日不能安心，更见诗人思之心切。五、六句说文才出众者总是命途多舛，小人奸佞最喜闻乐见的是好人之过。这两句诗道出了自古以来才智之士的共同命运，也是与李白同病相怜的心声。</p>\n<p class=\"prose\">自然而然地，诗人想起了屈原，同样遭到谗言诬陷，后被放逐的爱国忠魂。他说李白应“投诗赠汨罗”，是对李白的高度肯定，这样一个人不被这个时代所欣赏，只能向命运相同的古时圣贤倾诉。此诗感情强烈，读来百转千回。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]天末：天边。<br>[2]魑（chī）魅（mèi）：妖怪。<br>[3]过：失误。</p>", "englishHtml": "<p class=\"poem-lines\">An autumn wind rises from the end of the sky.<br>What do you think of it in your mind and your eye?<br>When will the wild geese bring your happy news to me?<br>Could autumn fill the lake and the river with glee?<br>Good fortune never favors those who can well write;<br>Demons will ever do wrong to those who know what&#x27;s right.<br>Would you confide to the poet wronged long ago<br>Your verse which might comfort his soul in weal and woe?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Thinking of Li Bai from the End of the Earth,” the poem places personal feeling against the vastness of the frontier, so distance and danger become part of its force.</p>\n<p class=\"commentary\">As a five-character regulated verse, it sets Du Fu&#x27;s energetic voice against open space, travel, and danger. Key images such as water and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "039", "zhTitle": "月夜忆舍弟", "enTitle": "Thinking of My Brothers on a Moonlit Night", "chinese": "戍鼓[2]断人行[3]，\n边秋[4]一雁声。\n露从今夜白，\n月是故乡明。\n有弟皆分散，\n无家问死生。\n寄书长不达，\n况乃未休兵[5]。\n《月夜忆舍弟》是公元759年所作。一般望月思亲多写所见，杜甫却写所闻戍鼓和雁鸣，使人觉得凄凉，可见杜甫匠心。说今夜露白，既是写景，又是点明时令；说故乡月明，看似写景，实是抒情，这样借景抒情，就化平板为神奇了。接着转入主题，说兄弟离散，生死难卜，既说“无家”，自然寄信也收不到；最后说“未休兵”，又和最初说的“断人行”前后呼应。全诗层次井然，结构严谨，写出兄弟情深，可见大家本色。\n注释：\n[1]舍弟：自己称呼弟弟的谦词。\n[2]戍鼓：边防驻军的更鼓。\n[3]断人行：鼓声响起，宵禁开始。\n[4]边秋：边塞的秋天。\n[5]未休兵：战争还未停息。", "english": "War drums break people's journey drear;\nA swan honks on autumn frontier.\nDew turns into frost since tonight;\nThe moon viewed at home is more bright.\nI've brothers scattered here and there;\nFor our life or death none would care.\nLetters can't reach where I intend;\nAlas! the war's not come to an end.", "poemType": "五言律诗", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">戍鼓<sup class=\"note-ref\">[2]</sup>断人行<sup class=\"note-ref\">[3]</sup>，<br>边秋<sup class=\"note-ref\">[4]</sup>一雁声。<br>露从今夜白，<br>月是故乡明。<br>有弟皆分散，<br>无家问死生。<br>寄书长不达，<br>况乃未休兵<sup class=\"note-ref\">[5]</sup>。</p>\n<p class=\"prose\">《月夜忆舍弟》是公元759年所作。一般望月思亲多写所见，杜甫却写所闻戍鼓和雁鸣，使人觉得凄凉，可见杜甫匠心。说今夜露白，既是写景，又是点明时令；说故乡月明，看似写景，实是抒情，这样借景抒情，就化平板为神奇了。接着转入主题，说兄弟离散，生死难卜，既说“无家”，自然寄信也收不到；</p>\n<p class=\"prose\">最后说“未休兵”，又和最初说的“断人行”前后呼应。全诗层次井然，结构严谨，写出兄弟情深，可见大家本色。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]舍弟：自己称呼弟弟的谦词。<br>[2]戍鼓：边防驻军的更鼓。<br>[3]断人行：鼓声响起，宵禁开始。<br>[4]边秋：边塞的秋天。<br>[5]未休兵：战争还未停息。</p>", "englishHtml": "<p class=\"poem-lines\">War drums break people&#x27;s journey drear;<br>A swan honks on autumn frontier.<br>Dew turns into frost since tonight;<br>The moon viewed at home is more bright.<br>I&#x27;ve brothers scattered here and there;<br>For our life or death none would care.<br>Letters can&#x27;t reach where I intend;<br>Alas! the war&#x27;s not come to an end.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Thinking of My Brothers on a Moonlit Night,” the poem places personal feeling against the vastness of the frontier, so distance and danger become part of its force.</p>\n<p class=\"commentary\">As a five-character regulated verse, it sets Du Fu&#x27;s energetic voice against open space, travel, and danger. Key images such as moonlight, birds, frontier scenes, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "040", "zhTitle": "同谷七歌 （其七）", "enTitle": "Seven Songs Written in Tonggu ( VII )", "chinese": "同谷七歌\n（其七）\n男儿生不成名身已老，\n三年饥走荒山道。\n长安卿相多少年，\n富贵应须致身早。\n山中儒生旧相识，\n但话宿昔[1]伤怀抱。\n呜呼七歌兮悄终曲，\n仰视皇天白日速。\n此诗写的是公元759年，杜甫应同谷县令之邀，从秦州出发历尽艰难到达同谷，而县令却嫌弃杜甫已弃官且穷困潦倒便避而不见。适逢大雪封山的隆冬季节，诗人衣食无着之下搭草屋栖身，眼见一家人饿病在床，无奈中长歌当哭，和着血泪写出了这组长诗，这是第七首，是组诗中最精彩的篇章。开头是叹穷嗟老的身世感慨，年近半百，名未成，身已老，转徙流离，老病穷愁，集中地抒发了诗人身世飘零之感。三、四句，追叙困居长安时，达官贵人中少年很多，这不能不使诗人发出愤激的讽刺之词：“富贵应须致身早”，以看似劝人的口吻，表达对凭借父兄余荫谋取卿相的腐败政治的愤慨。诗人身处异常窘困的境地，感叹自己不幸的遭遇，忧国忧民的怀抱无法施展，因而和友人谈起的都是令人伤感的往事。诗人默默地收起笔望天，只见白日转移，向着西方天际快速飞驰，顿生迟暮之感，悲壮激烈之情在诗人心底涌起。\n注释：\n[1]宿昔：昔日。", "english": "Seven Songs Written in Tonggu\n(VII)\nI am a man grown old without making a name.\nStarved three long years, I trudge desolate mountain way.\nIn the capital young men have won wealth and fame,\nIt is all natural for them to have their day.\nI meet a scholar in the hills, a friend of mine,\nTalking about the past, we can give sigh for sigh.\nAlas! I've sung all my seven songs, line by line;\nLooking up, I see the sun sink in western sky.", "poemType": "七言古诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">同谷七歌（其七）<br>男儿生不成名身已老，<br>三年饥走荒山道。<br>长安卿相多少年，<br>富贵应须致身早。<br>山中儒生旧相识，<br>但话宿昔<sup class=\"note-ref\">[1]</sup>伤怀抱。<br>呜呼七歌兮悄终曲，<br>仰视皇天白日速。</p>\n<p class=\"prose\">此诗写的是公元759年，杜甫应同谷县令之邀，从秦州出发历尽艰难到达同谷，而县令却嫌弃杜甫已弃官且穷困潦倒便避而不见。适逢大雪封山的隆冬季节，诗人衣食无着之下搭草屋栖身，眼见一家人饿病在床，无奈中长歌当哭，和着血泪写出了这组长诗，这是第七首，是组诗中最精彩的篇章。</p>\n<p class=\"prose\">开头是叹穷嗟老的身世感慨，年近半百，名未成，身已老，转徙流离，老病穷愁，集中地抒发了诗人身世飘零之感。三、四句，追叙困居长安时，达官贵人中少年很多，这不能不使诗人发出愤激的讽刺之词：“富贵应须致身早”，以看似劝人的口吻，表达对凭借父兄余荫谋取卿相的腐败政治的愤慨。</p>\n<p class=\"prose\">诗人身处异常窘困的境地，感叹自己不幸的遭遇，忧国忧民的怀抱无法施展，因而和友人谈起的都是令人伤感的往事。诗人默默地收起笔望天，只见白日转移，向着西方天际快速飞驰，顿生迟暮之感，悲壮激烈之情在诗人心底涌起。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]宿昔：昔日。</p>", "englishHtml": "<p class=\"poem-lines\">Seven Songs Written in Tonggu</p>\n<p class=\"stanza-marker\">(VII)</p>\n<p class=\"poem-lines\">I am a man grown old without making a name.<br>Starved three long years, I trudge desolate mountain way.<br>In the capital young men have won wealth and fame,<br>It is all natural for them to have their day.<br>I meet a scholar in the hills, a friend of mine,<br>Talking about the past, we can give sigh for sigh.<br>Alas! I&#x27;ve sung all my seven songs, line by line;<br>Looking up, I see the sun sink in western sky.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seven Songs Written in Tonggu ( VII ),” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "041", "zhTitle": "病马", "enTitle": "To My Sick Horse", "chinese": "乘尔[1]亦已久，\n天寒关塞深。\n尘中老尽力[2]，\n岁晚病伤心。\n毛骨岂殊众[3]？\n驯良[4]犹至今。\n物微意不浅，\n感动一沉吟[5]。\n《病马》大约也是公元759年杜甫因为马病而写的。诗中说：我骑你的日子很久了。不管天寒地冻，山高路远，你总是风尘仆仆，尽心尽力。到了年终，你却病倒了，教我如何不伤心呢！你的皮毛筋骨和别的马没有什么不同，不过你驯善地跟随我一直到了今天。你的身价并不高贵，但是对我如此情深义重，叫我如何能不感动？能不沉吟？这首诗充分表现了杜甫的人道主义精神，也可能是他借马比喻自己。\n注释：\n[1]尔：指马。\n[2]老尽力：年老而力驰。\n[3]殊众：不同于众人。\n[4]驯良：和顺善良。\n[5]沉吟：忧思。", "english": "You have been ridden long\nThrough cold, deep mountain pass.\nIn dust you toil along,\nSick at year's end, alas!\nIs your coat not the same\nAs others? Meek till now,\nYou're dearer than your frame.\nCan I not be moved? How?", "poemType": "五言律诗", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">乘尔<sup class=\"note-ref\">[1]</sup>亦已久，<br>天寒关塞深。<br>尘中老尽力<sup class=\"note-ref\">[2]</sup>，<br>岁晚病伤心。<br>毛骨岂殊众<sup class=\"note-ref\">[3]</sup>？<br>驯良<sup class=\"note-ref\">[4]</sup>犹至今。<br>物微意不浅，<br>感动一沉吟<sup class=\"note-ref\">[5]</sup>。</p>\n<p class=\"prose\">《病马》大约也是公元759年杜甫因为马病而写的。诗中说：我骑你的日子很久了。不管天寒地冻，山高路远，你总是风尘仆仆，尽心尽力。到了年终，你却病倒了，教我如何不伤心呢！你的皮毛筋骨和别的马没有什么不同，不过你驯善地跟随我一直到了今天。</p>\n<p class=\"prose\">你的身价并不高贵，但是对我如此情深义重，叫我如何能不感动？能不沉吟？这首诗充分表现了杜甫的人道主义精神，也可能是他借马比喻自己。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]尔：指马。<br>[2]老尽力：年老而力驰。<br>[3]殊众：不同于众人。<br>[4]驯良：和顺善良。<br>[5]沉吟：忧思。</p>", "englishHtml": "<p class=\"poem-lines\">You have been ridden long<br>Through cold, deep mountain pass.<br>In dust you toil along,<br>Sick at year&#x27;s end, alas!<br>Is your coat not the same<br>As others? Meek till now,<br>You&#x27;re dearer than your frame.<br>Can I not be moved? How?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “To My Sick Horse,” the poem turns a natural scene into a space of movement, wonder, and emotional release.</p>\n<p class=\"commentary\">As a five-character regulated verse, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as frontier scenes and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "042", "zhTitle": "野望", "enTitle": "Dim Prospect", "chinese": "清秋望不极，\n迢递[1]起层阴[2]。\n远水兼[3]天净，\n孤城隐雾深。\n叶稀风更落，\n山迥[4]日初沉。\n独鹤归何晚[5]，\n昏鸦已满林。\n如果说《病马》是借物咏人的诗，那么《野望》就是借景抒情的作品。开始总写野外的景色，一眼望去清旷无极，远远地却出现了层层阴云。尽管还是秋水共长天一色，但孤城已经笼罩在浓雾之中。西风一起，落叶飘零，太阳也沉到山坳里去了。孤独的白鹤归来时已经天晚，暮色昏昏欲睡，林中满是乌鸦聒噪之声。这阴云浓雾，西风落叶，夕阳昏鸦，都象征着当时的形势，而纯洁的归鹤则是诗人的化身。\n注释：\n[1]迢递（dì）：遥远貌。\n[2]层（cénɡ）阴：重叠的阴云。\n[3]兼：连着。\n[4]迥（jiǒnɡ）：远。\n[5]归何晚：为何归来得晚。", "english": "Autumn presents a boundless view,\nFar off dark masses loom in heap.\nThe sky blends into water blue,\nThe lonely town veiled in mist deep.\nThe wind strips trees of leaves again,\nThe sun beyond the mountains sinks.\nSo late comes back the snowy crane,\nThe wood's thronged with crows as dusk winks.", "poemType": "五言律诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">清秋望不极，<br>迢递<sup class=\"note-ref\">[1]</sup>起层阴<sup class=\"note-ref\">[2]</sup>。<br>远水兼<sup class=\"note-ref\">[3]</sup>天净，<br>孤城隐雾深。<br>叶稀风更落，<br>山迥<sup class=\"note-ref\">[4]</sup>日初沉。<br>独鹤归何晚<sup class=\"note-ref\">[5]</sup>，<br>昏鸦已满林。</p>\n<p class=\"prose\">如果说《病马》是借物咏人的诗，那么《野望》就是借景抒情的作品。开始总写野外的景色，一眼望去清旷无极，远远地却出现了层层阴云。尽管还是秋水共长天一色，但孤城已经笼罩在浓雾之中。西风一起，落叶飘零，太阳也沉到山坳里去了。孤独的白鹤归来时已经天晚，暮色昏昏欲睡，林中满是乌鸦聒噪之声。</p>\n<p class=\"prose\">这阴云浓雾，西风落叶，夕阳昏鸦，都象征着当时的形势，而纯洁的归鹤则是诗人的化身。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]迢递（dì）：遥远貌。<br>[2]层（cénɡ）阴：重叠的阴云。<br>[3]兼：连着。<br>[4]迥（jiǒnɡ）：远。<br>[5]归何晚：为何归来得晚。</p>", "englishHtml": "<p class=\"poem-lines\">Autumn presents a boundless view,<br>Far off dark masses loom in heap.<br>The sky blends into water blue,<br>The lonely town veiled in mist deep.<br>The wind strips trees of leaves again,<br>The sun beyond the mountains sinks.<br>So late comes back the snowy crane,<br>The wood&#x27;s thronged with crows as dusk winks.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Dim Prospect,” the poem presents retreat or solitude as a way to stand apart from worldly pressure.</p>\n<p class=\"commentary\">As a five-character regulated verse, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as mountains, water, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "043", "zhTitle": "蜀相", "enTitle": "Temple of the Premier of Shu", "chinese": "丞相[1]祠堂何处寻？\n锦官城[2]外柏森森。\n映阶碧草自春色，\n隔叶黄鹂空好音。\n三顾频烦天下计，\n两朝开济[3]老臣心。\n出师未捷[4]身先死，\n长使英雄泪满襟。\n公元760年春天，杜甫初来成都，看了诸葛丞相祠堂，写了这首《蜀相》。诗人先问“祠堂何处”，回答说“锦官（成都）城外”，翠柏森森，既是写景，又是写人，说诸葛亮和翠柏一样万古长青。接着又写映阶草绿，隔叶禽鸣，但加了个“自”字，就有绿草念人之意；又加了个“空”字。更是知音远去，好音谁听？不写人而人自见。接着知音出现：一个三顾茅庐，商量安定天下的大计；一个开国济世，显示辅佐先帝后主的忠心。可惜出师未捷身先死，后世英雄怎能不涕泪零零呢？杜甫以身许国，志在济世，自然也在后世英雄之内。这首七律写出了诗人对诸葛亮的景仰，可以说西蜀丞相就是他的楷模。\n注释：\n[1]丞相：诸葛亮。\n[2]锦官城：成都。\n[3]开济：开创基业，周济艰危。\n[4]捷：取胜。", "english": "Where is the famous premier's temple to be found?\nOutside the Town of Brocade with cypresses around.\nIn vain before the steps spring grass grows green and long,\nAnd amid the leaves golden orioles sing their song.\nThrice the king visited him for the State's gains and pains;\nHe served heart and soul the kingdom during two reigns.\nBut he died before he accomplished his career.\nHow could heroes not wet their sleeves with tear on tear!", "poemType": "七言律诗", "poemTheme": "沉郁抒怀", "chineseHtml": "<p class=\"poem-lines\">丞相<sup class=\"note-ref\">[1]</sup>祠堂何处寻？<br>锦官城<sup class=\"note-ref\">[2]</sup>外柏森森。<br>映阶碧草自春色，<br>隔叶黄鹂空好音。<br>三顾频烦天下计，<br>两朝开济<sup class=\"note-ref\">[3]</sup>老臣心。<br>出师未捷<sup class=\"note-ref\">[4]</sup>身先死，<br>长使英雄泪满襟。</p>\n<p class=\"prose\">公元760年春天，杜甫初来成都，看了诸葛丞相祠堂，写了这首《蜀相》。诗人先问“祠堂何处”，回答说“锦官（成都）城外”，翠柏森森，既是写景，又是写人，说诸葛亮和翠柏一样万古长青。接着又写映阶草绿，隔叶禽鸣，但加了个“自”字，就有绿草念人之意；</p>\n<p class=\"prose\">又加了个“空”字。更是知音远去，好音谁听？不写人而人自见。接着知音出现：一个三顾茅庐，商量安定天下的大计；一个开国济世，显示辅佐先帝后主的忠心。可惜出师未捷身先死，后世英雄怎能不涕泪零零呢？杜甫以身许国，志在济世，自然也在后世英雄之内。</p>\n<p class=\"prose\">这首七律写出了诗人对诸葛亮的景仰，可以说西蜀丞相就是他的楷模。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]丞相：诸葛亮。<br>[2]锦官城：成都。<br>[3]开济：开创基业，周济艰危。<br>[4]捷：取胜。</p>", "englishHtml": "<p class=\"poem-lines\">Where is the famous premier&#x27;s temple to be found?<br>Outside the Town of Brocade with cypresses around.<br>In vain before the steps spring grass grows green and long,<br>And amid the leaves golden orioles sing their song.<br>Thrice the king visited him for the State&#x27;s gains and pains;<br>He served heart and soul the kingdom during two reigns.<br>But he died before he accomplished his career.<br>How could heroes not wet their sleeves with tear on tear!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Temple of the Premier of Shu,” the poem blends scene, memory, and moral pressure, letting a restrained voice carry deep feeling.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "044", "zhTitle": "戏题王宰画山水图歌", "enTitle": "Wang Zai's Painting of Landscape", "chinese": "十日画一水，\n五日画一石。\n能事[1]不受相促迫，\n王宰始肯留真迹。\n壮哉昆仑方壶[2]图，\n挂君高堂之素壁。\n巴陵[3]洞庭日本东，\n赤岸[4]水与银河通，\n中有云气随飞龙。\n舟人渔子入浦溆[5]，\n山木尽亚洪涛风。\n尤工远势[6]古莫比，\n咫尺应须论万里。\n焉得并州快剪刀，\n剪取吴淞半江水。\n这是一首题画诗。公元760年，杜甫定居成都期间，认识四川著名山水画家王宰，应邀作此诗。十日一水，五日一石，区区数言，就刻画了王宰一丝不苟的创作态度，盛赞其大家风范，高超的技艺不愿受时间的催迫，留下真实的笔迹于人间。“巴陵”句中连举三个地名，一气呵成，力现江水起于洞庭，东流到海，源远流长，一泻千里。江岸水势浩瀚渺远，连接天际，水天一色，仿佛与银河相通，云气弥漫，似有蛟龙。狂风激流中，渔人正急急避舟岸边，大风吹得山上树木像波浪一样俯偃起落。其画面行云流水，波澜壮阔，构图宏伟，气韵生动。诗人高度评价王宰旷古未有的技法，并用极为精练的诗歌语言概括了我国山水画的表现特点：“咫尺应须论万里”。面对如此美作，诗人惊叹不知怎样得来的并州快剪，将秀丽江水剪来一半。\n注释：\n[1]能事：十分擅长的事情。\n[2]方壶：神话中的仙山，此处指高山。\n[3]巴陵：郡名。\n[4]赤岸：泛指江湖的边岸。\n[5]浦溆（xù）：岸边。\n[6]远势：指绘画中的构图背景。", "english": "He spends five days to paint a stone\nAnd ten to paint a stream alone.\nHe will not work when pressed,\nSo of his work we are deeply impressed.\nHow lofty mountains undulate from east to west!\nThe wall on which the picture hangs is blessed.\nWater flows from Western mountains to Eastern Bay\nUntil it joins the Milky Way.\nWaves rise like clouds with which the flying dragons play.\nThe frightened fishermen run far away,\nAll mountain forests bend to stormy sway.\nHe can paint landscape far and near:\nOn a foot of silk miles of hills appear.\nWhere could I get the sharpest scissor blade\nTo cut the scroll and make a river of white jade?", "poemType": "乐府/古体", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">十日画一水，<br>五日画一石。<br>能事<sup class=\"note-ref\">[1]</sup>不受相促迫，<br>王宰始肯留真迹。<br>壮哉昆仑方壶<sup class=\"note-ref\">[2]</sup>图，<br>挂君高堂之素壁。<br>巴陵<sup class=\"note-ref\">[3]</sup>洞庭日本东，<br>赤岸<sup class=\"note-ref\">[4]</sup>水与银河通，<br>中有云气随飞龙。<br>舟人渔子入浦溆<sup class=\"note-ref\">[5]</sup>，<br>山木尽亚洪涛风。<br>尤工远势<sup class=\"note-ref\">[6]</sup>古莫比，<br>咫尺应须论万里。<br>焉得并州快剪刀，<br>剪取吴淞半江水。</p>\n<p class=\"prose\">这是一首题画诗。公元760年，杜甫定居成都期间，认识四川著名山水画家王宰，应邀作此诗。十日一水，五日一石，区区数言，就刻画了王宰一丝不苟的创作态度，盛赞其大家风范，高超的技艺不愿受时间的催迫，留下真实的笔迹于人间。“巴陵”句中连举三个地名，一气呵成，力现江水起于洞庭，东流到海，源远流长，一泻千里。</p>\n<p class=\"prose\">江岸水势浩瀚渺远，连接天际，水天一色，仿佛与银河相通，云气弥漫，似有蛟龙。狂风激流中，渔人正急急避舟岸边，大风吹得山上树木像波浪一样俯偃起落。其画面行云流水，波澜壮阔，构图宏伟，气韵生动。诗人高度评价王宰旷古未有的技法，并用极为精练的诗歌语言概括了我国山水画的表现特点：“咫尺应须论万里”。</p>\n<p class=\"prose\">面对如此美作，诗人惊叹不知怎样得来的并州快剪，将秀丽江水剪来一半。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]能事：十分擅长的事情。<br>[2]方壶：神话中的仙山，此处指高山。<br>[3]巴陵：郡名。<br>[4]赤岸：泛指江湖的边岸。<br>[5]浦溆（xù）：岸边。<br>[6]远势：指绘画中的构图背景。</p>", "englishHtml": "<p class=\"poem-lines\">He spends five days to paint a stone<br>And ten to paint a stream alone.<br>He will not work when pressed,<br>So of his work we are deeply impressed.<br>How lofty mountains undulate from east to west!<br>The wall on which the picture hangs is blessed.<br>Water flows from Western mountains to Eastern Bay<br>Until it joins the Milky Way.<br>Waves rise like clouds with which the flying dragons play.<br>The frightened fishermen run far away,<br>All mountain forests bend to stormy sway.<br>He can paint landscape far and near:<br>On a foot of silk miles of hills appear.<br>Where could I get the sharpest scissor blade<br>To cut the scroll and make a river of white jade?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Wang Zai&#x27;s Painting of Landscape,” the poem turns a natural scene into a space of movement, wonder, and emotional release.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as mountains, water, and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "045", "zhTitle": "南邻", "enTitle": "My Southern Neighbor", "chinese": "锦里[1]先生乌角巾，\n园收芋栗[2]未全贫。\n惯看宾客[3]儿童喜，\n得食阶除[4]鸟雀驯。\n秋水才深四五尺，\n野航恰受两三人。\n白沙翠竹江村暮[5]，\n相送柴门月色新。\n这是公元760年，作者的生活比较安定的时期，到南邻朱山人家造访，回家以后写下的诗作。前四句是诗人造访时的场景：主人锦里先生头戴隐士常戴的“乌角巾”；园子里种的芋头、栗子，都成熟该收了，生活虽然清贫，但是从其家中的氛围可以知道，主人是个安贫乐道之士，满足于眼下的田园之乐。见惯了宾客的孩子们也不怕生，笑脸相迎；连台阶上啄食的鸟雀见人来也不飞，一派人与自然和谐相处的安宁静谧氛围。转眼诗人就已逗留大半天了，夕阳西下，该回去了。门外小河水深不过四五尺，山村野渡的小船只能容纳两三人，主人送客上船。渐渐地，白沙、翠竹，连同村庄一同隐在这暮色中，而自家的柴门，在已经升起的明月照耀下显现出来。\n注释：\n[1]锦里：锦江附近。\n[2]芋栗：长得像芋艿的橡栗。\n[3]宾客：一作“门户”。\n[4]阶除：台阶、门前的庭院。\n[5]暮：一作“路”。", "english": "My southern neighbor wears a black cornered hat,\nThere are chestnuts and taros in his garden flat.\nHis children smile to welcome guests they used to see,\nBirds seeking food in his yard are not frightened to flee.\nThe stream is four or five feet deep before his door;\nThe tiny boat can take three passengers or four.\nI leave his green bamboos and white sand when it's late,\nHe sees me off in moonlight at his garden gate.", "poemType": "七言律诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">锦里<sup class=\"note-ref\">[1]</sup>先生乌角巾，<br>园收芋栗<sup class=\"note-ref\">[2]</sup>未全贫。<br>惯看宾客<sup class=\"note-ref\">[3]</sup>儿童喜，<br>得食阶除<sup class=\"note-ref\">[4]</sup>鸟雀驯。<br>秋水才深四五尺，<br>野航恰受两三人。<br>白沙翠竹江村暮<sup class=\"note-ref\">[5]</sup>，<br>相送柴门月色新。</p>\n<p class=\"prose\">这是公元760年，作者的生活比较安定的时期，到南邻朱山人家造访，回家以后写下的诗作。前四句是诗人造访时的场景：主人锦里先生头戴隐士常戴的“乌角巾”；园子里种的芋头、栗子，都成熟该收了，生活虽然清贫，但是从其家中的氛围可以知道，主人是个安贫乐道之士，满足于眼下的田园之乐。</p>\n<p class=\"prose\">见惯了宾客的孩子们也不怕生，笑脸相迎；连台阶上啄食的鸟雀见人来也不飞，一派人与自然和谐相处的安宁静谧氛围。转眼诗人就已逗留大半天了，夕阳西下，该回去了。门外小河水深不过四五尺，山村野渡的小船只能容纳两三人，主人送客上船。</p>\n<p class=\"prose\">渐渐地，白沙、翠竹，连同村庄一同隐在这暮色中，而自家的柴门，在已经升起的明月照耀下显现出来。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]锦里：锦江附近。<br>[2]芋栗：长得像芋艿的橡栗。<br>[3]宾客：一作“门户”。<br>[4]阶除：台阶、门前的庭院。<br>[5]暮：一作“路”。</p>", "englishHtml": "<p class=\"poem-lines\">My southern neighbor wears a black cornered hat,<br>There are chestnuts and taros in his garden flat.<br>His children smile to welcome guests they used to see,<br>Birds seeking food in his yard are not frightened to flee.<br>The stream is four or five feet deep before his door;<br>The tiny boat can take three passengers or four.<br>I leave his green bamboos and white sand when it&#x27;s late,<br>He sees me off in moonlight at his garden gate.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “My Southern Neighbor,” the poem presents retreat or solitude as a way to stand apart from worldly pressure.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water, moonlight, birds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "046", "zhTitle": "狂夫", "enTitle": "Unbent Mind", "chinese": "万里桥西一草堂，\n百花潭水即沧浪。\n风含翠筱[1]娟娟净[2]，\n雨裛[3]红蕖[4]冉冉香[5]。\n厚禄故人书断绝，\n恒饥[6]稚子色凄凉。\n欲填沟壑唯疏放，\n自笑狂夫老更狂。\n此诗作于公元760年夏。前四句写草堂及浣花溪的美丽景色，令人陶然。斜风细雨之中，翠竹轻摇，竹叶上泛着水光；细雨润物，使荷花格外娇艳，暗香浮动。颔联有“微风燕子斜”“润物细无声”的意味，风之微雨之细都不言而喻。后四句是与此美景极不相称的残酷的生活现实。诗人初到成都时，靠故人接济，一旦故人断绝消息，他的家人就免不了挨饿了，颈联即写此事。即使身陷这样的窘境，诗人却像一个斗士般顽强，以近乎狂放的态度面对，诗人的这种人生态度，不但没有随同岁月流逝而衰退，反而越来越增强了，一句“自笑”，多少无处排遣的愁苦饱含其中。\n注释：\n[1]筱（xiǎo）：细竹。\n[2]娟娟净：秀丽洁白之态。\n[3]裛（yì）：滋润。\n[4]红蕖：粉红的荷花。\n[5]冉冉香：阵阵的清香。\n[6]恒饥：长时间挨饿。", "english": "West of the Bridge there stands my thatched hall,\nBeside a pool where water plays with flowers.\nThe breeze caresses bamboos green and tall;\nPink lotus blooms moistened sweeten the bowers.\nBut unprovided for by my old friend,\nMy hungry children look haggard and drear.\nCould I bow before I come to my end?\nI laugh and hold my unbent mind as dear.", "poemType": "七言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">万里桥西一草堂，<br>百花潭水即沧浪。<br>风含翠筱<sup class=\"note-ref\">[1]</sup>娟娟净<sup class=\"note-ref\">[2]</sup>，<br>雨裛<sup class=\"note-ref\">[3]</sup>红蕖<sup class=\"note-ref\">[4]</sup>冉冉香<sup class=\"note-ref\">[5]</sup>。<br>厚禄故人书断绝，<br>恒饥<sup class=\"note-ref\">[6]</sup>稚子色凄凉。<br>欲填沟壑唯疏放，<br>自笑狂夫老更狂。</p>\n<p class=\"prose\">此诗作于公元760年夏。前四句写草堂及浣花溪的美丽景色，令人陶然。斜风细雨之中，翠竹轻摇，竹叶上泛着水光；细雨润物，使荷花格外娇艳，暗香浮动。颔联有
