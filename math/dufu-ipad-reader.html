<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>许渊冲译杜甫诗选｜iPad 横屏对照阅读</title>
  <style>
    :root {
      --ink: #28231b;
      --muted: #756d60;
      --paper: #f8f1e4;
      --paper-deep: #eee0c7;
      --panel: rgba(255, 250, 239, .88);
      --line: rgba(80, 61, 33, .18);
      --accent: #9b3f24;
      --accent-2: #2f5d50;
      --shadow: 0 22px 70px rgba(56, 38, 16, .16);
      --body-size: 19px;
      --body-leading: 1.86;
      --poem-size: 23px;
      --en-size: calc(var(--body-size) + 4px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(155, 63, 36, .10), transparent 31%),
        radial-gradient(circle at 84% 18%, rgba(47, 93, 80, .11), transparent 28%),
        linear-gradient(135deg, #fbf5e8 0%, #f2e3c9 46%, #ead8b8 100%);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Times New Roman", serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .38;
      background-image:
        linear-gradient(rgba(72, 50, 22, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 50, 22, .035) 1px, transparent 1px);
      background-size: 28px 28px, 28px 28px;
      mix-blend-mode: multiply;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(220px, 24vw) 1fr;
      gap: 14px;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    .sidebar, .reader {
      position: relative;
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      border-radius: 14px 6px 6px 14px;
      overflow: hidden;
    }

    .brand {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0));
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-weight: 700;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: clamp(26px, 3.1vw, 42px);
      font-weight: 650;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .tool, .nav-button {
      appearance: none;
      border: 1px solid rgba(80, 61, 33, .22);
      background: rgba(255, 255, 255, .42);
      color: var(--ink);
      border-radius: 8px;
      min-height: 38px;
      font: 650 13px/1 "Avenir Next", "Helvetica Neue", sans-serif;
      cursor: pointer;
    }

    .tool:active, .nav-button:active, .poem-link:active {
      transform: translateY(1px);
    }

    .search-wrap {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: 100%;
      height: 40px;
      border: 1px solid rgba(80, 61, 33, .22);
      border-radius: 8px;
      padding: 0 12px;
      background: rgba(255, 255, 255, .58);
      color: var(--ink);
      font-size: 15px;
      outline: none;
    }

    .list {
      overflow: auto;
      padding: 8px;
    }

    .poem-link {
      width: 100%;
      border: 0;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 8px;
      align-items: start;
      padding: 10px 9px;
      margin: 2px 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .poem-link.active {
      background: #f0ddbb;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .num {
      color: var(--accent);
      font: 700 12px/1.5 "Avenir Next", sans-serif;
    }

    .link-title {
      display: block;
      font-size: 15px;
      line-height: 1.25;
      white-space: normal;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .type-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 7px;
      border: 1px solid rgba(155, 63, 36, .22);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(155, 63, 36, .07);
      font: 650 11px/1 "Avenir Next", "Helvetica Neue", sans-serif;
      white-space: nowrap;
    }

    .theme-pill {
      border-color: rgba(47, 93, 80, .24);
      color: var(--accent-2);
      background: rgba(47, 93, 80, .08);
    }

    .link-en {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font: 12px/1.25 "Georgia", serif;
    }

    .sidebar-footer {
      padding: 10px 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font: 12px/1.4 "Avenir Next", sans-serif;
    }

    .reader {
      border-radius: 6px 14px 14px 6px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .reader-header {
      min-height: 84px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(155,63,36,.09), transparent 38%),
        rgba(255,255,255,.22);
    }

    .current-title {
      margin: 0;
      font-size: clamp(25px, 3vw, 40px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .current-en {
      margin: 5px 0 0;
      color: var(--muted);
      font: italic 18px/1.25 Georgia, serif;
    }

    .current-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .nav {
      display: flex;
      gap: 8px;
    }

    .nav-button {
      min-width: 44px;
      font-size: 18px;
    }

    .columns {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .92fr);
      gap: 0;
      overflow: hidden;
    }

    .column {
      min-width: 0;
      overflow: auto;
      padding: 28px clamp(22px, 3vw, 44px) 60px;
      scroll-behavior: smooth;
    }

    .column.left {
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 239, .38);
    }

    .column.right {
      background: rgba(255, 255, 255, .28);
    }

    .column-label {
      position: sticky;
      top: -28px;
      z-index: 1;
      margin: -28px 0 22px;
      padding: 16px 0 12px;
      color: var(--accent);
      background: linear-gradient(180deg, rgba(255,250,239,.97), rgba(255,250,239,.78));
      font: 750 12px/1 "Avenir Next", sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .right .column-label {
      color: var(--accent-2);
      background: linear-gradient(180deg, rgba(250,249,243,.97), rgba(250,249,243,.76));
    }

    .poem-lines {
      margin: 0 0 24px;
      font-size: var(--poem-size);
      line-height: 1.78;
      letter-spacing: 0;
    }

    .note-ref {
      font-size: .52em;
      line-height: 0;
      vertical-align: super;
      margin: 0 .04em;
      color: var(--accent);
      font-family: "Avenir Next", sans-serif;
      font-weight: 700;
    }

    .stanza-marker {
      margin: 0 0 10px;
      color: var(--muted);
      font-family: "Avenir Next", sans-serif;
      font-size: 14px;
      letter-spacing: .12em;
      font-weight: 700;
    }

    .prose {
      margin: 0 0 18px;
      font-size: var(--body-size);
      line-height: var(--body-leading);
      text-align: justify;
    }

    .right .prose, .right .poem-lines {
      font-family: Georgia, "Times New Roman", serif;
      font-size: var(--en-size);
      line-height: 1.9;
      text-align: left;
    }

    .note-title {
      margin: 26px 0 12px;
      font-size: 15px;
      color: var(--accent);
      font-family: "Avenir Next", sans-serif;
      letter-spacing: .12em;
    }

    .commentary-title {
      margin: 30px 0 12px;
      color: var(--accent-2);
      font-family: "Avenir Next", sans-serif;
      font-size: 15px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .commentary {
      margin: 0 0 14px;
      color: #4c463d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: calc(var(--en-size) - 2px);
      line-height: 1.82;
      text-align: left;
    }

    .word-popover {
      position: fixed;
      z-index: 40;
      width: min(340px, calc(100vw - 28px));
      border: 1px solid rgba(47, 93, 80, .22);
      border-radius: 8px;
      background: rgba(255, 252, 244, .98);
      box-shadow: 0 22px 58px rgba(42, 32, 19, .24);
      padding: 14px;
      color: var(--ink);
      transform: translateY(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .word-popover.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .word-popover-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .word-popover-word {
      margin: 0;
      font: 700 22px/1.15 Georgia, "Times New Roman", serif;
      color: var(--accent-2);
    }

    .word-popover-close {
      width: 32px;
      height: 32px;
      min-width: 32px;
      padding: 0;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1;
    }

    .word-popover-label {
      margin: 0 0 4px;
      color: var(--muted);
      font: 800 11px/1 "Avenir Next", sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .word-popover p {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.58;
    }

    .word-popover [hidden] {
      display: none;
    }

    .progress {
      height: 5px;
      background: rgba(80, 61, 33, .10);
    }

    .progress-bar {
      height: 100%;
      width: 1%;
      background: linear-gradient(90deg, var(--accent), #c99045);
      transition: width .28s ease;
    }

    .compact-toggle {
      display: none;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100dvh;
        grid-template-columns: 1fr;
      }
      .sidebar {
        max-height: 42dvh;
        border-radius: 14px;
      }
      .reader {
        min-height: 72dvh;
        border-radius: 14px;
      }
      .columns {
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .column {
        overflow: visible;
      }
      .column.left {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <section class="brand">
        <div class="eyebrow">Xu Yuanchong Reader</div>
        <h1>杜甫诗选</h1>
        <p class="subtitle">iPad 横屏中英对照阅读 · 100 首/组</p>
      </section>
      <section class="tools" aria-label="阅读设置">
        <button class="tool" id="smaller" title="缩小字号">A−</button>
        <button class="tool" id="larger" title="放大字号">A＋</button>
      </section>
      <section class="search-wrap">
        <input class="search" id="search" type="search" placeholder="搜索诗题 / 英文题名" />
      </section>
      <nav class="list" id="list" aria-label="诗歌目录"></nav>
      <footer class="sidebar-footer">
        左右栏可独立滚动，适合 iPad Pro 横屏阅读。
      </footer>
    </aside>

    <section class="reader">
      <header class="reader-header">
        <div>
          <h2 class="current-title" id="title"></h2>
          <p class="current-en" id="enTitle"></p>
          <div class="current-meta">
            <span class="type-pill" id="poemType"></span>
            <span class="type-pill theme-pill" id="poemTheme"></span>
          </div>
        </div>
        <div class="nav">
          <button class="nav-button" id="prev" title="上一首">‹</button>
          <button class="nav-button" id="next" title="下一首">›</button>
        </div>
      </header>
      <section class="columns">
        <article class="column left" id="leftPane">
          <div class="column-label">Chinese · 原文与赏析</div>
          <div id="chinese"></div>
        </article>
        <article class="column right" id="rightPane">
          <div class="column-label">English · Xu Yuanchong</div>
          <div id="english"></div>
        </article>
      </section>
      <div class="progress"><div class="progress-bar" id="progress"></div></div>
    </section>
    <aside class="word-popover" id="wordPopover" aria-live="polite">
      <div class="word-popover-header">
        <h3 class="word-popover-word" id="wordPopoverWord"></h3>
        <button class="word-popover-close" id="wordPopoverClose" type="button" title="关闭">×</button>
      </div>
      <div>
        <p class="word-popover-label" id="wordZhLabel">中文释义</p>
        <p id="wordPopoverZh"></p>
        <p class="word-popover-label" id="wordEnLabel">English</p>
        <p id="wordPopoverEn"></p>
        <p class="word-popover-label" id="wordPinyinLabel" hidden>拼音</p>
        <p id="wordPopoverPinyin" hidden></p>
        <p class="word-popover-label" id="wordContextLabel">In This Poem</p>
        <p id="wordPopoverContext"></p>
      </div>
    </aside>
  </main>

  <script>
    const poems = [{"num": "001", "zhTitle": "望岳", "enTitle": "Gazing on Mount Tai", "chinese": "岱宗[1]夫如何？\n齐鲁青未了。\n造化[2]钟[3]神秀，\n阴阳割昏晓。\n荡胸生层云，\n决眦[4]入归鸟。\n会当[5]凌[6]绝顶，\n一览众山小。\n这是杜甫诗中最早的一首，大约是公元736年杜甫24岁远望泰山时写的。诗开始说：这五岳之首的泰山多么高大，无边无际的青翠色覆盖了齐鲁两个古国（齐在泰山之北，鲁在泰山之南）。接着说：天地间的神奇秀美都凝聚在这里；泰山高耸入云，山南阳光灿烂，山北阴影朦胧，仿佛是泰山把晓色和暮色分割开了。远远望去，山中云生雾绕，令人心荡神怡；一直望到天色将晚，飞鸟都要归巢，眼眶似乎要开裂了。于是诗人想到孔子“登泰山而小天下”的名言，心中思忖，总有一天，自己也要登上泰山的顶峰，俯视脚下起伏的群山。\n注释：\n[1]岱宗：指泰山，在今山东省泰安市城北。\n[2]造化：指天地、大自然。\n[3]钟：聚集。\n[4]决眦（zì）：指睁大眼睛远望；眦，上下眼睑的接合处，指眼眶。\n[5]会当：应当，定要。\n[6]凌：登上。", "english": "O peak of peaks, how high it stands!\nOne boundless green o'erspreads two States.\nA marvel done by Nature's hands,\nO'er light and shade it dominates.\nClouds rise therefrom and lave my breast;\nMy eyes are strained to see birds fleet.\nTry to ascend the mountain's crest:\nIt dwarfs all peaks under our feet.", "poemType": "五言律诗", "poemTheme": "登临抒怀", "chineseHtml": "<p class=\"poem-lines\">岱宗<sup class=\"note-ref\">[1]</sup>夫如何？<br>齐鲁青未了。<br>造化<sup class=\"note-ref\">[2]</sup>钟<sup class=\"note-ref\">[3]</sup>神秀，<br>阴阳割昏晓。<br>荡胸生层云，<br>决眦<sup class=\"note-ref\">[4]</sup>入归鸟。<br>会当<sup class=\"note-ref\">[5]</sup>凌<sup class=\"note-ref\">[6]</sup>绝顶，<br>一览众山小。</p>\n<p class=\"prose\">这是杜甫诗中最早的一首，大约是公元736年杜甫24岁远望泰山时写的。诗开始说：这五岳之首的泰山多么高大，无边无际的青翠色覆盖了齐鲁两个古国（齐在泰山之北，鲁在泰山之南）。接着说：天地间的神奇秀美都凝聚在这里；泰山高耸入云，山南阳光灿烂，山北阴影朦胧，仿佛是泰山把晓色和暮色分割开了。</p>\n<p class=\"prose\">远远望去，山中云生雾绕，令人心荡神怡；一直望到天色将晚，飞鸟都要归巢，眼眶似乎要开裂了。于是诗人想到孔子“登泰山而小天下”的名言，心中思忖，总有一天，自己也要登上泰山的顶峰，俯视脚下起伏的群山。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]岱宗：指泰山，在今山东省泰安市城北。<br>[2]造化：指天地、大自然。<br>[3]钟：聚集。<br>[4]决眦（zì）：指睁大眼睛远望；眦，上下眼睑的接合处，指眼眶。<br>[5]会当：应当，定要。<br>[6]凌：登上。</p>", "englishHtml": "<p class=\"poem-lines\">O peak of peaks, how high it stands!<br>One boundless green o&#x27;erspreads two States.<br>A marvel done by Nature&#x27;s hands,<br>O&#x27;er light and shade it dominates.<br>Clouds rise therefrom and lave my breast;<br>My eyes are strained to see birds fleet.<br>Try to ascend the mountain&#x27;s crest:<br>It dwarfs all peaks under our feet.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Gazing on Mount Tai,” the poem uses the act of looking from a height to enlarge both the landscape and the speaker&#x27;s inner pressure.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, clouds, birds, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "002", "zhTitle": "题张氏隐居 （二首其二）", "enTitle": "Written at Zhang's Hermitage ( II )", "chinese": "题张氏隐居\n（二首其二）\n之子时相见，\n邀人晚兴[1]留。\n霁潭[2]鳣发发[3]，\n春草鹿呦呦[4]。\n杜酒[5]偏劳劝，\n张梨[6]不外求。\n前村山路险，\n归醉每无愁。\n公元736年，杜甫游于齐赵，结识隐居的张氏，写下此诗。组诗共两首，第一首作于初识张氏时。这是其二，大概作于与张氏相熟之时，所以开首便道“之子时相见”。诗中含了很多典故，如“之子”直译过来是“这人”或“这位先生”，而《诗经》中有“彼其之子”句，汉成帝时有童谣“燕燕尾涎涎，张公子，时相见”。如此风趣地借用典故，不仅没有丝毫迂腐累赘之嫌，反而有些小小的幽默感，也表明二人的友谊情深。三、四两句状物，同样见于《诗经》，《卫风·硕人》中有“鳣鲔发发”，《小雅·鹿鸣》有“呦呦鹿鸣，食野之苹”之句。“鹿鸣思野草，可以喻嘉宾”，所以此联不单写景，更寓情于景，景中含情。“杜酒”句实打实是玩笑了，杜康是酒祖，所以称“杜酒”，这酒明明是我们杜家的造物，却劳动主家来劝饮。“张梨”是当时的名产“张公大谷之梨”，张氏的园中有梨，故也称“张梨”，既然这里有“张梨”，何必去外寻那个“张梨”。末联的醉行山路也不愁，映出了宾主尽欢的酣畅。全文将典故这般妙用，不可不谓“文章天成”了。\n注释：\n[1]晚兴：到傍晚还有兴致。\n[2]霁潭：一作“济潭”。\n[3]发（bō）发：盛貌。\n[4]呦（yōu）呦：象声词，鹿的叫声。\n[5]杜酒：家酿的酒。\n[6]张梨：原指张公大谷之梨，一种珍贵的梨树品种，后作为对梨的美称。", "english": "Written at Zhang's Hermitage\n(II)\nAlthough we have met now and then,\nThis evening I'm invited again.\nCarps in the pool swim to and fro;\nDeer on spring grass bleat high and low.\nYou urge me to drink my sweet wine;\nNo fruit is as your pear so fine.\nThough rugged is my homeward way,\nDrunken, my heart is ever gay.", "poemType": "五言古诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">题张氏隐居<br>（二首其二）<br>之子时相见，<br>邀人晚兴<sup class=\"note-ref\">[1]</sup>留。<br>霁潭<sup class=\"note-ref\">[2]</sup>鳣发发<sup class=\"note-ref\">[3]</sup>，<br>春草鹿呦呦<sup class=\"note-ref\">[4]</sup>。<br>杜酒<sup class=\"note-ref\">[5]</sup>偏劳劝，<br>张梨<sup class=\"note-ref\">[6]</sup>不外求。<br>前村山路险，<br>归醉每无愁。</p>\n<p class=\"prose\">公元736年，杜甫游于齐赵，结识隐居的张氏，写下此诗。组诗共两首，第一首作于初识张氏时。这是其二，大概作于与张氏相熟之时，所以开首便道“之子时相见”。诗中含了很多典故，如“之子”直译过来是“这人”或“这位先生”，而《诗经》中有“彼其之子”句，汉成帝时有童谣“燕燕尾涎涎，张公子，时相见”。</p>\n<p class=\"prose\">如此风趣地借用典故，不仅没有丝毫迂腐累赘之嫌，反而有些小小的幽默感，也表明二人的友谊情深。三、四两句状物，同样见于《诗经》，《卫风·硕人》中有“鳣鲔发发”，《小雅·鹿鸣》有“呦呦鹿鸣，食野之苹”之句。“鹿鸣思野草，可以喻嘉宾”，所以此联不单写景，更寓情于景，景中含情。</p>\n<p class=\"prose\">“杜酒”句实打实是玩笑了，杜康是酒祖，所以称“杜酒”，这酒明明是我们杜家的造物，却劳动主家来劝饮。“张梨”是当时的名产“张公大谷之梨”，张氏的园中有梨，故也称“张梨”，既然这里有“张梨”，何必去外寻那个“张梨”。末联的醉行山路也不愁，映出了宾主尽欢的酣畅。</p>\n<p class=\"prose\">全文将典故这般妙用，不可不谓“文章天成”了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]晚兴：到傍晚还有兴致。<br>[2]霁潭：一作“济潭”。<br>[3]发（bō）发：盛貌。<br>[4]呦（yōu）呦：象声词，鹿的叫声。<br>[5]杜酒：家酿的酒。<br>[6]张梨：原指张公大谷之梨，一种珍贵的梨树品种，后作为对梨的美称。</p>", "englishHtml": "<p class=\"poem-lines\">Written at Zhang&#x27;s Hermitage(II)<br>Although we have met now and then,<br>This evening I&#x27;m invited again.<br>Carps in the pool swim to and fro;<br>Deer on spring grass bleat high and low.<br>You urge me to drink my sweet wine;<br>No fruit is as your pear so fine.<br>Though rugged is my homeward way,<br>Drunken, my heart is ever gay.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Written at Zhang&#x27;s Hermitage ( II ),” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as mountains, wine, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "003", "zhTitle": "房兵曹胡马", "enTitle": "The Tartar Steed of Captain Fang", "chinese": "胡马大宛名，\n锋棱[1]瘦骨成。\n竹批[2]双耳峻[3]，\n风入四蹄轻。\n所向无空阔，\n真堪托死生[4]。\n骁腾[5]有如此，\n万里可横行。\n此诗作于公元740或741年，杜甫本善骑射，也很爱马，写了很多咏马的诗。此诗前四句写的是马的品相，开首说马来自大宛，“大宛汗血古共知”，还未论及骨相，已然使人觉得这是一匹好马。接着写马的特征：骨骼嶙峋，耸如锋棱，耳如刀劈，尖锐挺立，都表明这是一匹良马。第四句由静转动，视角由旁观者到骑乘者，再现了神骏飞驰的场景，这很可能不是诗人的想象，而是真实的感受，所以才有下文的“真堪托死生”。有马如此，真可以横行万里，建功立业了。全诗写得豪放奔腾，饱含了诗人青年时期的壮志雄心。\n注释：\n[1]锋棱：锋利的棱角。\n[2]竹批：形容马的耳朵像竹尖一样。\n[3]峻：尖锐。\n[4]托死生：值得托付生命。\n[5]骁（xiāo）腾：勇猛矫健地奔驰。", "english": "A Tartar steed of famous breed\nWith bony frame runs at full speed.\nAs pointed bamboo its sharp ears,\nFast as the wind, light it appears.\nInto nothing distances melt, [1]\nNo danger on its back is felt.\nIf their four hoofs can run their fill,\nYou can ride wherever you will.[2]\n注释：\n[1]Rewi Alley's version versified.\n[2]Li Weijian's version versified.", "poemType": "五言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">胡马大宛名，<br>锋棱<sup class=\"note-ref\">[1]</sup>瘦骨成。<br>竹批<sup class=\"note-ref\">[2]</sup>双耳峻<sup class=\"note-ref\">[3]</sup>，<br>风入四蹄轻。<br>所向无空阔，<br>真堪托死生<sup class=\"note-ref\">[4]</sup>。<br>骁腾<sup class=\"note-ref\">[5]</sup>有如此，<br>万里可横行。</p>\n<p class=\"prose\">此诗作于公元740或741年，杜甫本善骑射，也很爱马，写了很多咏马的诗。此诗前四句写的是马的品相，开首说马来自大宛，“大宛汗血古共知”，还未论及骨相，已然使人觉得这是一匹好马。接着写马的特征：骨骼嶙峋，耸如锋棱，耳如刀劈，尖锐挺立，都表明这是一匹良马。</p>\n<p class=\"prose\">第四句由静转动，视角由旁观者到骑乘者，再现了神骏飞驰的场景，这很可能不是诗人的想象，而是真实的感受，所以才有下文的“真堪托死生”。有马如此，真可以横行万里，建功立业了。全诗写得豪放奔腾，饱含了诗人青年时期的壮志雄心。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]锋棱：锋利的棱角。<br>[2]竹批：形容马的耳朵像竹尖一样。<br>[3]峻：尖锐。<br>[4]托死生：值得托付生命。<br>[5]骁（xiāo）腾：勇猛矫健地奔驰。</p>", "englishHtml": "<p class=\"poem-lines\">A Tartar steed of famous breed<br>With bony frame runs at full speed.<br>As pointed bamboo its sharp ears,<br>Fast as the wind, light it appears.<br>Into nothing distances melt, [1]<br>No danger on its back is felt.<br>If their four hoofs can run their fill,<br>You can ride wherever you will.[2]</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Rewi Alley&#x27;s version versified.<br>[2]Li Weijian&#x27;s version versified.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Tartar Steed of Captain Fang,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as trees and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "004", "zhTitle": "画鹰", "enTitle": "A Painted Falcon", "chinese": "素练风霜起，\n苍鹰画作殊[1]。\n[2]身思狡兔，\n侧目甫似愁胡[3]。\n绦镟光堪摘[4]，\n轩楹[5]势可呼。\n何当击凡鸟，\n毛血洒平芜[6]！\n这是一首题画诗，大约与《房兵曹胡马》是同一时期作品。前两句为点题之句，洁白的画绢上，突然腾起了一片肃杀之气，以倒插起笔，读来令人讶异。第二句随即点明，原来是画中矫健不凡的鹰挟风带霜而起，带给人很强的视觉效果。三、四两句是传神之笔，由外而内，刻画出苍鹰搏击前的动作及其心理状态，仿佛眼前所见不是画，而是活生生的鹰。“绦”是系鹰用的丝绳；“镟”是系鹰用的金属的圆轴，分明是画，却明晃晃得照人，使人思忖着要把丝绳解掉，挂在轩楹上的俨然是活物，呼之欲出。最后直把画鹰当成真鹰，竟有任其搏飞高翔之愿，字里行间寄托着作者的思想和志向。\n注释：\n[1]殊：不同凡响。\n[2]（sǒnɡ）身：即竦身，做好准备搏击的样子。\n[3]愁胡：发愁的胡人。\n[4]堪摘（zhāi）：可以摘除。\n[5]轩楹：廊间的柱子，诗中指悬挂画鹰的地方。\n[6]平芜：草原。", "english": "A frosty wind from silk scroll seems to rise,\nA superb falcon appears to the eyes.\nIt hovers to attack a cunning hare;\nLike frowning monkey its side glances glare.\nIts golden chains and rings brighten the hall,\nWhere it may alight to answer your call.\nWhen would it strike the birds of lowly breed\nAnd shed their blood and feathers at high speed?", "poemType": "五言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">素练风霜起，<br>苍鹰画作殊<sup class=\"note-ref\">[1]</sup>。<br><sup class=\"note-ref\">[2]</sup>身思狡兔，<br>侧目甫似愁胡<sup class=\"note-ref\">[3]</sup>。<br>绦镟光堪摘<sup class=\"note-ref\">[4]</sup>，<br>轩楹<sup class=\"note-ref\">[5]</sup>势可呼。<br>何当击凡鸟，<br>毛血洒平芜<sup class=\"note-ref\">[6]</sup>！</p>\n<p class=\"prose\">这是一首题画诗，大约与《房兵曹胡马》是同一时期作品。前两句为点题之句，洁白的画绢上，突然腾起了一片肃杀之气，以倒插起笔，读来令人讶异。第二句随即点明，原来是画中矫健不凡的鹰挟风带霜而起，带给人很强的视觉效果。三、四两句是传神之笔，由外而内，刻画出苍鹰搏击前的动作及其心理状态，仿佛眼前所见不是画，而是活生生的鹰。</p>\n<p class=\"prose\">“绦”是系鹰用的丝绳；“镟”是系鹰用的金属的圆轴，分明是画，却明晃晃得照人，使人思忖着要把丝绳解掉，挂在轩楹上的俨然是活物，呼之欲出。最后直把画鹰当成真鹰，竟有任其搏飞高翔之愿，字里行间寄托着作者的思想和志向。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]殊：不同凡响。<br>[2]（sǒnɡ）身：即竦身，做好准备搏击的样子。<br>[3]愁胡：发愁的胡人。<br>[4]堪摘（zhāi）：可以摘除。<br>[5]轩楹：廊间的柱子，诗中指悬挂画鹰的地方。<br>[6]平芜：草原。</p>", "englishHtml": "<p class=\"poem-lines\">A frosty wind from silk scroll seems to rise,<br>A superb falcon appears to the eyes.<br>It hovers to attack a cunning hare;<br>Like frowning monkey its side glances glare.<br>Its golden chains and rings brighten the hall,<br>Where it may alight to answer your call.<br>When would it strike the birds of lowly breed<br>And shed their blood and feathers at high speed?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Painted Falcon,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as birds and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "005", "zhTitle": "兵车行", "enTitle": "Song of the Conscripts", "chinese": "车辚辚[1]，马萧萧，\n行人[2]弓箭各在腰。\n耶[3]娘妻子走相送，\n尘埃不见咸阳桥[4]。\n牵衣顿足拦道哭，\n哭声直上干[5]云霄。\n道旁过者问行人，\n行人但云点行频。\n或从十五北防河，\n便至四十西营田。\n去时里正与裹头，\n归来头白还戍边。\n边庭[6]流血成海水，\n武皇开边意未已。\n君不闻，\n汉家山东二百州，\n千村万落生荆杞[7]。\n纵有健妇把锄犁，\n禾生陇亩[8]无东西。\n况复秦兵耐苦战，\n被驱不异犬与鸡。\n长者虽有问，\n役夫敢申恨？\n且如今年冬，\n未休关西卒。\n县官急索租，\n租税从何出？\n信知生男恶，\n反是生女好。\n生女犹得嫁比邻，\n生男埋没随百草。\n君不见，\n青海头，\n古来白骨无人收。\n新鬼烦冤旧鬼哭，\n天阴雨湿声啾啾。\n这首诗通过目睹耳闻的送别情景，揭露了唐玄宗对外发动战争给人民带来的痛苦，充满了反战情绪。诗从客观描写开始，说到“道旁过者问行人”，“过者”是过路人，就是杜甫自己；“行人”谈到15岁出征，40岁还在戍边的“征夫”。这句以上写诗人亲眼所见；以下写亲耳所闻：“行人但云点行频”，就是征夫回答说征兵太频繁了。下面的“武皇”是以汉喻唐，用汉武帝影射唐玄宗，“汉家”也是暗指唐王室。“长者虽有问”一句中，“长者”是征夫对诗人的尊称，“役夫”是征夫的自称。“未休关西卒”是说还在大量征兵，要去关西打仗。这是诗人通过当事人的口述，揭露征兵和逼租给人民造成的苦难。最后，诗人用哀痛的笔调描述了战场上的悲惨现实。全诗运用口语非常突出，前人评说：“语杂歌谣，最易感人，愈浅愈切。”\n注释：\n[1]辚（lín）辚：雷声，比喻行车的声音。\n[2]行人：指出征的士兵。\n[3]耶：通假字，同“爷”，父亲。\n[4]咸阳桥：唐代时期是长安通往西北的必经之路。\n[5]干（ɡān）：冲。\n[6]边庭：边疆。\n[7]荆杞（qǐ）：荆棘、枸杞，带刺的野生灌木。\n[8]陇（lǒnɡ）亩：田地。", "english": "Chariots rumble\nAnd horses grumble.\nThe conscripts march with bow and arrows at the waist.\nTheir fathers, mothers, wives and children come in haste\nTo see them off; the bridge is shrouded in dust they've raised.\nThey clutch at their coats, stamp the feet and bar the way;\nTheir grief cries loud and strikes the cloud straight, straightaway.\nAn onlooker by roadside asks an enrollee.\n“The conscription is frequent, ” only answers he.\nSome went north at fifteen to guard the rivershore,\nAnd were sent west to till the land at forty or more.\nThe elder bound their young heads when they went away;\nJust home, they're sent to the frontier though their hair's gray.\nThe field on borderland becomes a sea of blood;\nThe emperor's greed for land is still at high flood.\nHave you not heard\nTwo hundred districts east of the Hua Mountains lie,\nWhere briers and brambles grow in villages far and nigh?\nAlthough stout women can wield the plough and the hoe,\nThorns and weeds in the east as in the west o'ergrow.\nThe enemy are used to hard and stubborn fight;\nOur men are driven just like dogs or fowls in flight.\n“You are kind to ask me.\nTo complain I'm not free.\nIn winter of this year\nConscription goes on here.\nThe magistrates for taxes press.\nHow can we pay them in distress?\nIf we had known sons bring no joy,\nWe would have preferred girl to boy.\nA daughter can be wed to a neighbor, alas!\nA son can only be buried under the grass!”\nHave you not seen\nOn borders green\nBleached bones since olden days unburied on the plain?\nThe old ghosts weep and cry, while the new ghosts complain;\nThe air is loud with screech and scream in gloomy rain.", "poemType": "乐府/古体", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">车辚辚<sup class=\"note-ref\">[1]</sup>，马萧萧，<br>行人<sup class=\"note-ref\">[2]</sup>弓箭各在腰。<br>耶<sup class=\"note-ref\">[3]</sup>娘妻子走相送，<br>尘埃不见咸阳桥<sup class=\"note-ref\">[4]</sup>。<br>牵衣顿足拦道哭，<br>哭声直上干<sup class=\"note-ref\">[5]</sup>云霄。<br>道旁过者问行人，<br>行人但云点行频。<br>或从十五北防河，<br>便至四十西营田。<br>去时里正与裹头，<br>归来头白还戍边。<br>边庭<sup class=\"note-ref\">[6]</sup>流血成海水，<br>武皇开边意未已。<br>君不闻，<br>汉家山东二百州，<br>千村万落生荆杞<sup class=\"note-ref\">[7]</sup>。<br>纵有健妇把锄犁，<br>禾生陇亩<sup class=\"note-ref\">[8]</sup>无东西。<br>况复秦兵耐苦战，<br>被驱不异犬与鸡。<br>长者虽有问，<br>役夫敢申恨？<br>且如今年冬，<br>未休关西卒。<br>县官急索租，<br>租税从何出？<br>信知生男恶，<br>反是生女好。<br>生女犹得嫁比邻，<br>生男埋没随百草。<br>君不见，<br>青海头，<br>古来白骨无人收。<br>新鬼烦冤旧鬼哭，<br>天阴雨湿声啾啾。</p>\n<p class=\"prose\">这首诗通过目睹耳闻的送别情景，揭露了唐玄宗对外发动战争给人民带来的痛苦，充满了反战情绪。诗从客观描写开始，说到“道旁过者问行人”，“过者”是过路人，就是杜甫自己；“行人”谈到15岁出征，40岁还在戍边的“征夫”。这句以上写诗人亲眼所见；</p>\n<p class=\"prose\">以下写亲耳所闻：“行人但云点行频”，就是征夫回答说征兵太频繁了。下面的“武皇”是以汉喻唐，用汉武帝影射唐玄宗，“汉家”也是暗指唐王室。“长者虽有问”一句中，“长者”是征夫对诗人的尊称，“役夫”是征夫的自称。“未休关西卒”是说还在大量征兵，要去关西打仗。</p>\n<p class=\"prose\">这是诗人通过当事人的口述，揭露征兵和逼租给人民造成的苦难。最后，诗人用哀痛的笔调描述了战场上的悲惨现实。全诗运用口语非常突出，前人评说：“语杂歌谣，最易感人，愈浅愈切。”</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]辚（lín）辚：雷声，比喻行车的声音。<br>[2]行人：指出征的士兵。<br>[3]耶：通假字，同“爷”，父亲。<br>[4]咸阳桥：唐代时期是长安通往西北的必经之路。<br>[5]干（ɡān）：冲。<br>[6]边庭：边疆。<br>[7]荆杞（qǐ）：荆棘、枸杞，带刺的野生灌木。<br>[8]陇（lǒnɡ）亩：田地。</p>", "englishHtml": "<p class=\"poem-lines\">Chariots rumble<br>And horses grumble.<br>The conscripts march with bow and arrows at the waist.<br>Their fathers, mothers, wives and children come in haste<br>To see them off; the bridge is shrouded in dust they&#x27;ve raised.<br>They clutch at their coats, stamp the feet and bar the way;<br>Their grief cries loud and strikes the cloud straight, straightaway.<br>An onlooker by roadside asks an enrollee.<br>“The conscription is frequent, ” only answers he.<br>Some went north at fifteen to guard the rivershore,<br>And were sent west to till the land at forty or more.<br>The elder bound their young heads when they went away;<br>Just home, they&#x27;re sent to the frontier though their hair&#x27;s gray.<br>The field on borderland becomes a sea of blood;<br>The emperor&#x27;s greed for land is still at high flood.<br>Have you not heard<br>Two hundred districts east of the Hua Mountains lie,<br>Where briers and brambles grow in villages far and nigh?<br>Although stout women can wield the plough and the hoe,<br>Thorns and weeds in the east as in the west o&#x27;ergrow.<br>The enemy are used to hard and stubborn fight;<br>Our men are driven just like dogs or fowls in flight.<br>“You are kind to ask me.<br>To complain I&#x27;m not free.<br>In winter of this year<br>Conscription goes on here.<br>The magistrates for taxes press.<br>How can we pay them in distress?<br>If we had known sons bring no joy,<br>We would have preferred girl to boy.<br>A daughter can be wed to a neighbor, alas!<br>A son can only be buried under the grass!”<br>Have you not seen<br>On borders green<br>Bleached bones since olden days unburied on the plain?<br>The old ghosts weep and cry, while the new ghosts complain;<br>The air is loud with screech and scream in gloomy rain.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song of the Conscripts,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, water, clouds, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "006", "zhTitle": "赠李白", "enTitle": "To Li Bai", "chinese": "秋来相顾尚飘蓬[1]，\n未就[2]丹砂[3]愧葛洪。\n痛饮狂歌空度日，\n飞扬跋扈[4]为谁雄？\n《赠李白》是现存杜诗中最早的一首绝句，大约作于公元745年李白45岁、杜甫33岁的时候，所以第一句的“秋来”，既指时间上是秋天，又指李白到了一生中的秋季；“相顾”是说两人都是怀才不遇，同病相怜，所以都像蓬草一样，四处飘零。第二句写诗人不能入世，一展鸿图，只好出世求仙学道，但是冶炼丹砂也无成效，不能像东晋的葛洪一样，炼成丹药升天而去。于是只好痛快地饮酒，狂热地吟诗，几乎是虚度了光阴。什么时候才能像大鹏鸟一样飞腾到九天之上，或者像鲲鱼一样跃起尾巴，翻江倒海，称雄天下呢？这首诗短短四句，写出了两人相知相交的深情厚谊，也写出了诗人放荡不羁、一生寂寞的悲剧。\n注释：\n[1]飘蓬：比喻人的行踪飘忽不定。\n[2]未就：没有成功。\n[3]丹砂：朱砂。\n[4]飞扬跋扈（hù）：不守常规，放浪不羁。此处作褒义词用。", "english": "When autumn comes, you're drifting still like thistledown;\nYou try to find the way to heaven, but you fail.\nIn singing mad and drinking dead your days you drown.\nO when will fly the roc? O when will leap the whale?", "poemType": "七言绝句", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">秋来相顾尚飘蓬<sup class=\"note-ref\">[1]</sup>，<br>未就<sup class=\"note-ref\">[2]</sup>丹砂<sup class=\"note-ref\">[3]</sup>愧葛洪。<br>痛饮狂歌空度日，<br>飞扬跋扈<sup class=\"note-ref\">[4]</sup>为谁雄？</p>\n<p class=\"prose\">《赠李白》是现存杜诗中最早的一首绝句，大约作于公元745年李白45岁、杜甫33岁的时候，所以第一句的“秋来”，既指时间上是秋天，又指李白到了一生中的秋季；“相顾”是说两人都是怀才不遇，同病相怜，所以都像蓬草一样，四处飘零。</p>\n<p class=\"prose\">第二句写诗人不能入世，一展鸿图，只好出世求仙学道，但是冶炼丹砂也无成效，不能像东晋的葛洪一样，炼成丹药升天而去。于是只好痛快地饮酒，狂热地吟诗，几乎是虚度了光阴。什么时候才能像大鹏鸟一样飞腾到九天之上，或者像鲲鱼一样跃起尾巴，翻江倒海，称雄天下呢？</p>\n<p class=\"prose\">这首诗短短四句，写出了两人相知相交的深情厚谊，也写出了诗人放荡不羁、一生寂寞的悲剧。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]飘蓬：比喻人的行踪飘忽不定。<br>[2]未就：没有成功。<br>[3]丹砂：朱砂。<br>[4]飞扬跋扈（hù）：不守常规，放浪不羁。此处作褒义词用。</p>", "englishHtml": "<p class=\"poem-lines\">When autumn comes, you&#x27;re drifting still like thistledown;<br>You try to find the way to heaven, but you fail.<br>In singing mad and drinking dead your days you drown.<br>O when will fly the roc? O when will leap the whale?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “To Li Bai,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Its power comes from the pressure between plain language and the feeling held beneath it.</p>"}, {"num": "007", "zhTitle": "饮中八仙歌 （节选）", "enTitle": "Songs of Eight Immortal Drinkers ( Excerpts )", "chinese": "饮中八仙歌\n（节选）\n知章骑马似乘船，\n眼花落井水底眠。\n……\n宗之潇洒美少年，\n举觞白眼[1]望青天，\n皎如玉树临风[2]前。\n……\n李白一斗诗百篇，\n长安市上酒家眠，\n天子呼来不上船，\n自称臣是酒中仙。\n张旭三杯草圣传，\n脱帽露顶[3]王公前，\n挥毫落纸如云烟。\n《饮中八仙歌》是别具一格、富有特色的“肖像诗”，写的是八位好酒贪饮、飘飘欲仙的诗人。这里只选了四位：第一位是贺知章，他的名作是《回乡偶书》（少小离家老大回）；第二位是崔宗之，就是李白《别友人》（浮云游子意，落日故人情）中的友人；第三位是李白；第四位是书法草圣张旭，他的名作是《桃花溪》。这里只谈李白，四句诗塑造了一个桀骜不驯、豪放不羁、傲视王侯的艺术形象。尤其是第三句“天子呼来不上船”，使李白的形象显得高大奇伟、神采奕奕，焕发出美的理想光辉，这正是千百年来人民所喜爱的富有浪漫主义色彩的诗人形象。\n注释：\n[1]白眼：形容看不起的表情。青眼看朋友，白眼视俗人。\n[2]玉树临风：用玉树来比喻崔宗之的风姿卓越。\n[3]脱帽露顶：写张旭狂放不羁的醉态。", "english": "Songs of Eight Immortal Drinkers\n(Excerpts)\nZhizhang feels dizzy on his horse as in a boat.\nShould he fall in a well, asleep there he would float.\n...\nWithout restraint, Zongzhi is a gallant young guy;\nWine cup in hand, he turns white eyes to the blue sky,\nLike one of the jade trees standing in vernal breeze.\n...\nLi Bai would turn sweet nectar into verses fine.\nDrunk in the capital, he'd lie in shops of wine.\nEven imperial summons proudly he'd decline,\nSaying immortals could not leave the drink divine.\nIn cursive writing Zhang Xu's worthy of his fame.\nAfter three drinks he bares his head before lord and dame,\nAnd splashes cloud and mist on paper as with flame.", "poemType": "七言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">饮中八仙歌（节选）<br>知章骑马似乘船，<br>眼花落井水底眠。<br>……宗之潇洒美少年，<br>举觞白眼<sup class=\"note-ref\">[1]</sup>望青天，<br>皎如玉树临风<sup class=\"note-ref\">[2]</sup>前。<br>……李白一斗诗百篇，<br>长安市上酒家眠，<br>天子呼来不上船，<br>自称臣是酒中仙。<br>张旭三杯草圣传，<br>脱帽露顶<sup class=\"note-ref\">[3]</sup>王公前，<br>挥毫落纸如云烟。</p>\n<p class=\"prose\">《饮中八仙歌》是别具一格、富有特色的“肖像诗”，写的是八位好酒贪饮、飘飘欲仙的诗人。这里只选了四位：第一位是贺知章，他的名作是《回乡偶书》（少小离家老大回）；第二位是崔宗之，就是李白《别友人》（浮云游子意，落日故人情）中的友人；</p>\n<p class=\"prose\">第三位是李白；第四位是书法草圣张旭，他的名作是《桃花溪》。这里只谈李白，四句诗塑造了一个桀骜不驯、豪放不羁、傲视王侯的艺术形象。尤其是第三句“天子呼来不上船”，使李白的形象显得高大奇伟、神采奕奕，焕发出美的理想光辉，这正是千百年来人民所喜爱的富有浪漫主义色彩的诗人形象。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]白眼：形容看不起的表情。青眼看朋友，白眼视俗人。<br>[2]玉树临风：用玉树来比喻崔宗之的风姿卓越。<br>[3]脱帽露顶：写张旭狂放不羁的醉态。</p>", "englishHtml": "<p class=\"poem-lines\">Songs of Eight Immortal Drinkers<br>(Excerpts)<br>Zhizhang feels dizzy on his horse as in a boat.<br>Should he fall in a well, asleep there he would float.<br>...<br>Without restraint, Zongzhi is a gallant young guy;<br>Wine cup in hand, he turns white eyes to the blue sky,<br>Like one of the jade trees standing in vernal breeze....<br>Li Bai would turn sweet nectar into verses fine.<br>Drunk in the capital, he&#x27;d lie in shops of wine.<br>Even imperial summons proudly he&#x27;d decline,<br>Saying immortals could not leave the drink divine.<br>In cursive writing Zhang Xu&#x27;s worthy of his fame.<br>After three drinks he bares his head before lord and dame,<br>And splashes cloud and mist on paper as with flame.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Songs of Eight Immortal Drinkers ( Excerpts ),” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, clouds, flowers, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "008", "zhTitle": "春日忆李白", "enTitle": "Thinking of Li Bai on a Spring Day", "chinese": "白也诗无敌，\n飘然思不群[1]。\n清新庾开府[2]，\n俊逸[3]鲍参军。\n渭北春天树，\n江东日暮云。\n何时一樽酒，\n重与细论文[4]？\n杜甫与李白在鲁郡东石门分别后，杜甫奔赴长安，公元746或747年杜甫居于长安时作此诗。杜甫在题赠或怀念李白的诗中，总是赞扬备至。此诗中开头四句赞美之热烈，也可看出杜甫对李白非常钦仰。他称赞李白的诗出尘拔俗，清新俊逸，更以古人比之，显示出李白文采的高度。颈联未做任何修饰描绘，看去只是平实的写景，细究之，“渭北”是指诗人所居长安一带，而当时李白正在江东游历，作者将两地景色并列一处，有“碣石潇湘”之意，二人天各一方，牵连着双方的是同样的无限思念。结尾是作者的向往，表达早日重聚的愿望，也是二人惺惺相惜之情的体现。\n注释：\n[1]不群：不同凡响，胜过同辈。\n[2]庾（yú）开府：指庾信。\n[3]俊逸：形容人貌俊而才高。\n[4]论文：论诗。", "english": "A poet unequalled by a compeer,\nYour fancy flies into celestial sphere.\nYou freshen up the earth like vernal shower\nAnd beautify the world like brilliant flower.\nA towering tree under northern sky,\nA floating eastern cloud of sunset dye.\nWhen can we drink together cups of wine\nAnd talk about fine verse and letters fine?", "poemType": "五言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">白也诗无敌，<br>飘然思不群<sup class=\"note-ref\">[1]</sup>。<br>清新庾开府<sup class=\"note-ref\">[2]</sup>，<br>俊逸<sup class=\"note-ref\">[3]</sup>鲍参军。<br>渭北春天树，<br>江东日暮云。<br>何时一樽酒，<br>重与细论文<sup class=\"note-ref\">[4]</sup>？</p>\n<p class=\"prose\">杜甫与李白在鲁郡东石门分别后，杜甫奔赴长安，公元746或747年杜甫居于长安时作此诗。杜甫在题赠或怀念李白的诗中，总是赞扬备至。此诗中开头四句赞美之热烈，也可看出杜甫对李白非常钦仰。他称赞李白的诗出尘拔俗，清新俊逸，更以古人比之，显示出李白文采的高度。</p>\n<p class=\"prose\">颈联未做任何修饰描绘，看去只是平实的写景，细究之，“渭北”是指诗人所居长安一带，而当时李白正在江东游历，作者将两地景色并列一处，有“碣石潇湘”之意，二人天各一方，牵连着双方的是同样的无限思念。结尾是作者的向往，表达早日重聚的愿望，也是二人惺惺相惜之情的体现。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]不群：不同凡响，胜过同辈。<br>[2]庾（yú）开府：指庾信。<br>[3]俊逸：形容人貌俊而才高。<br>[4]论文：论诗。</p>", "englishHtml": "<p class=\"poem-lines\">A poet unequalled by a compeer,<br>Your fancy flies into celestial sphere.<br>You freshen up the earth like vernal shower<br>And beautify the world like brilliant flower.<br>A towering tree under northern sky,<br>A floating eastern cloud of sunset dye.<br>When can we drink together cups of wine<br>And talk about fine verse and letters fine?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Thinking of Li Bai on a Spring Day,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as water, clouds, trees, and wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "009", "zhTitle": "前出塞 （九首其六）", "enTitle": "Song of the Frontier ( VI )", "chinese": "前出塞\n（九首其六）\n挽[1]弓当挽强，\n用箭当用长。\n射人先射马，\n擒贼先擒王。\n杀人亦有限，\n列国自有疆[2]。\n苟能[3]制侵陵[4]，\n岂在多杀伤！\n据说《前出塞》是写天宝末年哥舒翰征伐吐蕃的事。前四句很像当时军中流行的作战歌诀，讲如何练兵用武，克敌制胜。诗人用了欲擒先纵、先扬后抑的手法。后四句转写战争不应该多杀伤，而要在制止侵略的范围之内，尽量减少伤亡，这样才能体现“止戈为武”的精神。唐诗中以议论为主的很少，这首诗却以议论见长，并且富于哲理。\n注释：\n[1]挽：拉。\n[2]疆：边界。\n[3]苟能：如果能。\n[4]侵陵：侵犯。", "english": "Song of the Frontier\n(VI)\nThe bow you carry should be strong;\nThe arrows you use should be long.\nBefore a horseman, shoot his horse;\nCapture the chief to beat his force!\nSlaughter shan't go beyond its sphere;\nEach State should guard its own frontier.\nIf an invasion is repelled,\nWhy shed more blood unless compelled?", "poemType": "五言古诗", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">前出塞<br>（九首其六）<br>挽<sup class=\"note-ref\">[1]</sup>弓当挽强，<br>用箭当用长。<br>射人先射马，<br>擒贼先擒王。<br>杀人亦有限，<br>列国自有疆<sup class=\"note-ref\">[2]</sup>。<br>苟能<sup class=\"note-ref\">[3]</sup>制侵陵<sup class=\"note-ref\">[4]</sup>，<br>岂在多杀伤！</p>\n<p class=\"prose\">据说《前出塞》是写天宝末年哥舒翰征伐吐蕃的事。前四句很像当时军中流行的作战歌诀，讲如何练兵用武，克敌制胜。诗人用了欲擒先纵、先扬后抑的手法。后四句转写战争不应该多杀伤，而要在制止侵略的范围之内，尽量减少伤亡，这样才能体现“止戈为武”的精神。唐诗中以议论为主的很少，这首诗却以议论见长，并且富于哲理。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]挽：拉。<br>[2]疆：边界。<br>[3]苟能：如果能。<br>[4]侵陵：侵犯。</p>", "englishHtml": "<p class=\"poem-lines\">Song of the Frontier(VI)<br>The bow you carry should be strong;<br>The arrows you use should be long.<br>Before a horseman, shoot his horse;<br>Capture the chief to beat his force!<br>Slaughter shan&#x27;t go beyond its sphere;<br>Each State should guard its own frontier.<br>If an invasion is repelled,<br>Why shed more blood unless compelled?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song of the Frontier ( VI ),” the poem places personal feeling against the vastness of the frontier, so distance and danger become part of its force.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it sets Du Fu&#x27;s energetic voice against open space, travel, and danger. Key images such as frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "010", "zhTitle": "丽人行", "enTitle": "Satire on Fair Ladies", "chinese": "三月三日天气新，\n长安水边多丽人。\n态浓意远淑且真[1]，\n肌理细腻骨肉匀。\n绣罗衣裳照暮春，\n蹙金孔雀银麒麟。\n头上何所有？\n翠微[2]叶[3]垂鬓唇[4]。\n背后何所见？\n珠压腰衱[5]稳称身。\n就中云幕[6]椒房[7]亲，\n赐名大国虢与秦。\n紫驼之峰出翠釜，\n水精之盘行素鳞。\n犀箸厌饫久未下，\n鸾刀缕切空纷纶。\n黄门[8]飞鞚不动尘，\n御厨络绎送八珍。\n箫鼓哀吟感鬼神，\n宾从杂遝[9]实要津。\n后来鞍马何逡巡，\n当轩下马入锦茵。\n杨花雪落覆白苹，\n青鸟飞去衔红巾。\n炙手可热势绝伦，\n慎莫近前丞相嗔。\n这首诗约作于公元755年，是讽刺杨贵妃兄妹骄奢荒淫的作品。前十句泛写曲江水边踏青的丽人之众多，仪容之娴雅，体态之优美，衣着之华丽。十一、十二句点明其中有杨家姊妹虢国夫人和秦国夫人。十三至十八句写盛宴的山珍海味。十九至二十二句写宾客盈门。二十三句“杨花雪落覆白苹”，“杨”字暗指杨国忠和虢国夫人的乱伦关系。下一句“青鸟飞去衔红巾”，青鸟是为他们私通传信的使者，红巾却是他们幽会的信物。梁启超在《情圣杜甫》中说：“如《丽人行》那首七古，全首将近二百字的长篇，完全立在第三者地位观察事实……全首二十六句中之二十四句，只是极力铺叙那种豪奢热闹情状，不仅字面上没有讥刺痕迹，连骨子里头也没有。直至结尾两句：‘炙手可热势绝伦，慎莫近前丞相嗔。’算是把主意一逗，但依然不着议论，完全让读者自己去批评，这种可以说是讽刺文学中之最高技术。”\n注释：\n[1]淑且真：形容女子美好而纯真，毫不做作。\n[2]翠微：薄薄的翡翠片。\n[3]（è）叶：一种女子发饰。\n[4]鬓唇：鬓边。\n[5]腰衱（jié）：裙带。\n[6]云幕：指宫殿中的云状帷幕。\n[7]椒房：汉代皇后居室。后世因称皇后为椒房。\n[8]黄门：宦官。\n[9]杂遝（tà）：行人众多，拥挤纷乱。", "english": "The weather's fine in the third moon on the third day,\nBy riverside so many beauties in array.\nEach of the ladies has a fascinating face,\nTheir skin is delicate, their manner full of grace.\nEmbroidered with peacocks and unicorns in gold,\nTheir dress in rich silks shines so bright when spring is old.\nWhat do they wear on the head?\nEmerald pendant leaves hang down in silver thread.\nWhat do you see from behind?\nHow nice-fitting are their waistbands with pearls combined.\nAmong them there're the emperor's favorite kin,\nEnnobled Duchess of Guo comes with Duchess of Qin.\nWhat do they eat?\nThe purple meat\nOf camel's hump cooked in green cauldron as a dish;\nOn crystal plate is served snow-white slices of raw fish.\nSee rhino chopsticks the satiated eaters stay,\nAnd untouched morsels carved by belled knives on the tray.\nWhen eunuchs' horses come running, no dust is raised;\nThey bring still more rare dishes delicious to the taste.\nListen to soul-stirring music of flutes and drums!\nOn the main road an official retinue comes.\nA rider ambles on saddled horse, the last of all,\nHe alights, treads on satin carpet, enters the hall.\nThe willow down like snow falls on the duckweed white;\nThe blue bird picking red handkerchief goes in flight.\nThe prime minister's powerful without a peer.\nHis angry touch would burn your hand. Do not come near!", "poemType": "乐府/古体", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">三月三日天气新，<br>长安水边多丽人。<br>态浓意远淑且真<sup class=\"note-ref\">[1]</sup>，<br>肌理细腻骨肉匀。<br>绣罗衣裳照暮春，<br>蹙金孔雀银麒麟。<br>头上何所有？<br>翠微<sup class=\"note-ref\">[2]</sup>叶<sup class=\"note-ref\">[3]</sup>垂鬓唇<sup class=\"note-ref\">[4]</sup>。<br>背后何所见？<br>珠压腰衱<sup class=\"note-ref\">[5]</sup>稳称身。<br>就中云幕<sup class=\"note-ref\">[6]</sup>椒房<sup class=\"note-ref\">[7]</sup>亲，<br>赐名大国虢与秦。<br>紫驼之峰出翠釜，<br>水精之盘行素鳞。<br>犀箸厌饫久未下，<br>鸾刀缕切空纷纶。<br>黄门<sup class=\"note-ref\">[8]</sup>飞鞚不动尘，<br>御厨络绎送八珍。<br>箫鼓哀吟感鬼神，<br>宾从杂遝<sup class=\"note-ref\">[9]</sup>实要津。<br>后来鞍马何逡巡，<br>当轩下马入锦茵。<br>杨花雪落覆白苹，<br>青鸟飞去衔红巾。<br>炙手可热势绝伦，<br>慎莫近前丞相嗔。</p>\n<p class=\"prose\">这首诗约作于公元755年，是讽刺杨贵妃兄妹骄奢荒淫的作品。前十句泛写曲江水边踏青的丽人之众多，仪容之娴雅，体态之优美，衣着之华丽。十一、十二句点明其中有杨家姊妹虢国夫人和秦国夫人。十三至十八句写盛宴的山珍海味。十九至二十二句写宾客盈门。</p>\n<p class=\"prose\">二十三句“杨花雪落覆白苹”，“杨”字暗指杨国忠和虢国夫人的乱伦关系。下一句“青鸟飞去衔红巾”，青鸟是为他们私通传信的使者，红巾却是他们幽会的信物。</p>\n<p class=\"prose\">梁启超在《情圣杜甫》中说：“如《丽人行》那首七古，全首将近二百字的长篇，完全立在第三者地位观察事实……全首二十六句中之二十四句，只是极力铺叙那种豪奢热闹情状，不仅字面上没有讥刺痕迹，连骨子里头也没有。直至结尾两句：‘炙手可热势绝伦，慎莫近前丞相嗔。’</p>\n<p class=\"prose\">算是把主意一逗，但依然不着议论，完全让读者自己去批评，这种可以说是讽刺文学中之最高技术。”</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]淑且真：形容女子美好而纯真，毫不做作。<br>[2]翠微：薄薄的翡翠片。<br>[3]（è）叶：一种女子发饰。<br>[4]鬓唇：鬓边。<br>[5]腰衱（jié）：裙带。<br>[6]云幕：指宫殿中的云状帷幕。<br>[7]椒房：汉代皇后居室。后世因称皇后为椒房。<br>[8]黄门：宦官。<br>[9]杂遝（tà）：行人众多，拥挤纷乱。</p>", "englishHtml": "<p class=\"poem-lines\">The weather&#x27;s fine in the third moon on the third day,<br>By riverside so many beauties in array.<br>Each of the ladies has a fascinating face,<br>Their skin is delicate, their manner full of grace.<br>Embroidered with peacocks and unicorns in gold,<br>Their dress in rich silks shines so bright when spring is old.<br>What do they wear on the head?<br>Emerald pendant leaves hang down in silver thread.<br>What do you see from behind?<br>How nice-fitting are their waistbands with pearls combined.<br>Among them there&#x27;re the emperor&#x27;s favorite kin,<br>Ennobled Duchess of Guo comes with Duchess of Qin.<br>What do they eat?<br>The purple meat<br>Of camel&#x27;s hump cooked in green cauldron as a dish;<br>On crystal plate is served snow-white slices of raw fish.<br>See rhino chopsticks the satiated eaters stay,<br>And untouched morsels carved by belled knives on the tray.<br>When eunuchs&#x27; horses come running, no dust is raised;<br>They bring still more rare dishes delicious to the taste.<br>Listen to soul-stirring music of flutes and drums!<br>On the main road an official retinue comes.<br>A rider ambles on saddled horse, the last of all,<br>He alights, treads on satin carpet, enters the hall.<br>The willow down like snow falls on the duckweed white;<br>The blue bird picking red handkerchief goes in flight.<br>The prime minister&#x27;s powerful without a peer.<br>His angry touch would burn your hand. Do not come near!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Satire on Fair Ladies,” the poem turns a natural scene into a space of movement, wonder, and emotional release.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as mountains, water, moonlight, and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "011", "zhTitle": "贫交行", "enTitle": "Friendship in Poverty", "chinese": "翻手[1]为云覆[2]手雨，\n纷纷轻薄[3]何须数[4]。\n君不见管鲍[5]贫时交，\n此道今人弃如土。\n天宝中期，诗人久寓京华，献赋谋职不成，参加科举失利，受尽冷遇，生活困顿之中，饱谙炎凉世态，所以愤而写下此诗。诗开头以翻手覆手、云雨莫测形容世人之交的变化多端，对这种“同利为朋，利尽交疏”的小人之交，诗人给予的是愤慨与蔑视。在黑暗丑陋的现实中，诗人想起了古时的圣贤，而先贤的美德已经被世人随意丢弃，这首短诗是诗人对现实世态的控诉。\n注释：\n[1]翻手：比喻人反复无常。\n[2]覆：颠倒。\n[3]轻薄：轻佻，不纯全。\n[4]何须数：意谓数不胜数。\n[5]管鲍：指管仲和鲍叔牙。管仲早年与鲍叔牙相处很好，管仲贫困，也欺骗过鲍叔牙，但鲍叔牙始终善待管仲。现在人们常用“管鲍”来比喻情谊深厚的朋友。", "english": "Friends of today are changeable as rain or cloud:\nWhen you are rich or poor, they come and go in crowd.\nBut a poor man might become a minister wise;\nThose looked down upon as dirt to fame may rise.", "poemType": "七言绝句", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">翻手<sup class=\"note-ref\">[1]</sup>为云覆<sup class=\"note-ref\">[2]</sup>手雨，<br>纷纷轻薄<sup class=\"note-ref\">[3]</sup>何须数<sup class=\"note-ref\">[4]</sup>。<br>君不见管鲍<sup class=\"note-ref\">[5]</sup>贫时交，<br>此道今人弃如土。</p>\n<p class=\"prose\">天宝中期，诗人久寓京华，献赋谋职不成，参加科举失利，受尽冷遇，生活困顿之中，饱谙炎凉世态，所以愤而写下此诗。诗开头以翻手覆手、云雨莫测形容世人之交的变化多端，对这种“同利为朋，利尽交疏”的小人之交，诗人给予的是愤慨与蔑视。</p>\n<p class=\"prose\">在黑暗丑陋的现实中，诗人想起了古时的圣贤，而先贤的美德已经被世人随意丢弃，这首短诗是诗人对现实世态的控诉。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]翻手：比喻人反复无常。<br>[2]覆：颠倒。<br>[3]轻薄：轻佻，不纯全。<br>[4]何须数：意谓数不胜数。<br>[5]管鲍：指管仲和鲍叔牙。管仲早年与鲍叔牙相处很好，管仲贫困，也欺骗过鲍叔牙，但鲍叔牙始终善待管仲。现在人们常用“管鲍”来比喻情谊深厚的朋友。</p>", "englishHtml": "<p class=\"poem-lines\">Friends of today are changeable as rain or cloud:<br>When you are rich or poor, they come and go in crowd.<br>But a poor man might become a minister wise;<br>Those looked down upon as dirt to fame may rise.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Friendship in Poverty,” the poem turns a natural scene into a space of movement, wonder, and emotional release.</p>\n<p class=\"commentary\">As a seven-character quatrain, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "012", "zhTitle": "后出塞 （五首其二）", "enTitle": "Song on the Frontier ( II )", "chinese": "后出塞\n（五首其二）\n朝进东门营，\n暮上河阳桥。\n落日照大旗[1]，\n马鸣风萧萧。\n平沙列万幕[2]，\n部伍各见招。\n中天悬明月，\n令严夜寂寥。\n悲笳[3]数声动，\n壮士惨不骄。\n借问大将[4]谁？\n恐是霍嫖姚[5]。\n后出塞组诗一共五首，这是其中的第二首，以一个刚刚入伍的新兵的口吻，叙述了出征关塞的部伍生活情景。早上进入洛阳城东的军营，晚上到达孟津河阳桥。“落日”四句，描绘了一幅千军万马的壮阔军容，“落日”“平沙”充满了边塞风情。“寂寥”对应前文的“万幕”，又以明月中天衬托“寂寥”，越发映出军令如山下无人作声的安静。这样的寂静中，响起了静营的军号声，一个“悲”字，就写出了悲从中来的意境。至此，这位新兵不禁慨然兴问，统率这支军队的大将是谁呢？但因为时当静营之后，慑于军令的森严，不敢发问，只是心里揣测，大概是像霍去病那样的将领吧！以此结尾，更使军容的壮阔整肃深入人心。\n注释：\n[1]大旗：大将用的红旗。\n[2]幕：帐幕。\n[3]悲笳：静营的号令。笳，古代乐器，音色悲壮，常用作军中号角。\n[4]大将：指召募统军之将。\n[5]嫖（piáo）姚（yáo）：同“剽姚”，指霍去病。汉武帝时，霍去病是嫖姚校尉。", "english": "Song on the Frontier\n(II)\nAt dawn we come to Camp of Eastern Gate;\nAt dusk we cross the bridge on Yellow River.\nReddened at sunset, our flags undulate;\nIn whistling wind our neighing horses quiver.\nThousands of tents aligned on sandy ground,\nAll the ranks and files answer the roll call.\nBright in the sky above hangs a moon round,\nSilence and order reign since the nightfall.\nSad Tartar bugles stir our warriors' heart,\nHow could they of their homesickness be proud?\nWhat could their commander do for his part,\nEven if he could sweep away the cloud?", "poemType": "五言古诗", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">后出塞<br>（五首其二）<br>朝进东门营，<br>暮上河阳桥。<br>落日照大旗<sup class=\"note-ref\">[1]</sup>，<br>马鸣风萧萧。<br>平沙列万幕<sup class=\"note-ref\">[2]</sup>，<br>部伍各见招。<br>中天悬明月，<br>令严夜寂寥。<br>悲笳<sup class=\"note-ref\">[3]</sup>数声动，<br>壮士惨不骄。<br>借问大将<sup class=\"note-ref\">[4]</sup>谁？<br>恐是霍嫖姚<sup class=\"note-ref\">[5]</sup>。</p>\n<p class=\"prose\">后出塞组诗一共五首，这是其中的第二首，以一个刚刚入伍的新兵的口吻，叙述了出征关塞的部伍生活情景。早上进入洛阳城东的军营，晚上到达孟津河阳桥。“落日”四句，描绘了一幅千军万马的壮阔军容，“落日”“平沙”充满了边塞风情。“寂寥”对应前文的“万幕”，又以明月中天衬托“寂寥”，越发映出军令如山下无人作声的安静。</p>\n<p class=\"prose\">这样的寂静中，响起了静营的军号声，一个“悲”字，就写出了悲从中来的意境。至此，这位新兵不禁慨然兴问，统率这支军队的大将是谁呢？但因为时当静营之后，慑于军令的森严，不敢发问，只是心里揣测，大概是像霍去病那样的将领吧！以此结尾，更使军容的壮阔整肃深入人心。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]大旗：大将用的红旗。<br>[2]幕：帐幕。<br>[3]悲笳：静营的号令。笳，古代乐器，音色悲壮，常用作军中号角。<br>[4]大将：指召募统军之将。<br>[5]嫖（piáo）姚（yáo）：同“剽姚”，指霍去病。汉武帝时，霍去病是嫖姚校尉。</p>", "englishHtml": "<p class=\"poem-lines\">Song on the Frontier(II)<br>At dawn we come to Camp of Eastern Gate;<br>At dusk we cross the bridge on Yellow River.<br>Reddened at sunset, our flags undulate;<br>In whistling wind our neighing horses quiver.<br>Thousands of tents aligned on sandy ground,<br>All the ranks and files answer the roll call.<br>Bright in the sky above hangs a moon round,<br>Silence and order reign since the nightfall.<br>Sad Tartar bugles stir our warriors&#x27; heart,<br>How could they of their homesickness be proud?<br>What could their commander do for his part,<br>Even if he could sweep away the cloud?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song on the Frontier ( II ),” the poem places personal feeling against the vastness of the frontier, so distance and danger become part of its force.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it sets Du Fu&#x27;s energetic voice against open space, travel, and danger. Key images such as water, moonlight, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "013", "zhTitle": "自京赴奉先县咏怀五百字 （节选）", "enTitle": "On the Way from the Capital to Fengxian ( Excerpts )", "chinese": "自京赴奉先县咏怀五百字\n（节选）\n朱门[1]酒肉臭，\n路有冻死骨。\n荣枯[2]咫尺异，\n惆怅[3]难再述。\n此诗作于公元755年十月，也就是安史之乱爆发的前一个月。诗人在长安久居10年，终于得到一个看管兵器铠甲的小官职位。不久诗人由长安往奉先探望妻儿，一路所见，故有此诗。原诗太长，这里只节选了传诵千古的四句。作者通过鲜明的对比，形象地揭示出贫富悬殊的社会现实，诗人忧国忧民的情怀与怀才不遇的现实、山雨欲来的动荡时局、诗人一片赤诚的情感，纷繁复杂地交织成沉郁的诗风，成就了这千古名句。\n注释：\n[1]朱门：豪门望族。\n[2]荣枯：繁荣和落寞。将生活奢靡的豪门与路边冻饿而死的穷人进行对比。\n[3]惆怅：感慨，难过。", "english": "On the Way from the Capital to Fengxian\n(Excerpts)\nThe mansions burst with wine and meat;\nThe poor die frozen on the street.\nWoe stands within an inch of weal.\nDistressed, can I tell what I feel?", "poemType": "古体诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">自京赴奉先县咏怀五百字（节选）<br>朱门<sup class=\"note-ref\">[1]</sup>酒肉臭，<br>路有冻死骨。<br>荣枯<sup class=\"note-ref\">[2]</sup>咫尺异，<br>惆怅<sup class=\"note-ref\">[3]</sup>难再述。</p>\n<p class=\"prose\">此诗作于公元755年十月，也就是安史之乱爆发的前一个月。诗人在长安久居10年，终于得到一个看管兵器铠甲的小官职位。不久诗人由长安往奉先探望妻儿，一路所见，故有此诗。原诗太长，这里只节选了传诵千古的四句。</p>\n<p class=\"prose\">作者通过鲜明的对比，形象地揭示出贫富悬殊的社会现实，诗人忧国忧民的情怀与怀才不遇的现实、山雨欲来的动荡时局、诗人一片赤诚的情感，纷繁复杂地交织成沉郁的诗风，成就了这千古名句。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]朱门：豪门望族。<br>[2]荣枯：繁荣和落寞。将生活奢靡的豪门与路边冻饿而死的穷人进行对比。<br>[3]惆怅：感慨，难过。</p>", "englishHtml": "<p class=\"poem-lines\">On the Way from the Capital to Fengxian<br>(Excerpts)<br>The mansions burst with wine and meat;<br>The poor die frozen on the street.<br>Woe stands within an inch of weal.<br>Distressed, can I tell what I feel?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On the Way from the Capital to Fengxian ( Excerpts ),” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "014", "zhTitle": "月夜", "enTitle": "A Moonlit Night", "chinese": "今夜鄜州[1]月，\n闺中[2]只独看。\n遥怜[3]小儿女，\n未解[4]忆长安。\n香雾云鬟湿，\n清辉玉臂寒。\n何时倚虚幌[5]，\n双照泪痕干！\n公元756年六月，安禄山叛军攻进潼关，杜甫携家逃到鄜州羌村。八月杜甫离家，途中被叛军捉住，送到沦陷后的长安，望月思家，写下了这首《月夜》。诗人不说自己思念家人，反说妻子思念自己，可见双方都在思念。“独看”二字，暗示过去曾经同看，更增添了思念之情。说儿女“未解忆长安”，反衬妻子的“忆”，又突出了“独”字；雾湿云鬟，月寒玉臂，想象妻子望月时间越久，思念越深，不免热泪盈眶，而这眼泪却是最后的“双照泪痕干”泄露出来的。既然双照泪痕才干，独看自然是泪痕不干了。“独看”和“双照”是诗眼，“独看”在诗人是现实，在妻子是想象；“双照”却包括回忆和希望。本诗词旨委婉，章法紧密，所以古人说：“五律至此，无忝诗圣矣！”\n注释：\n[1]鄜（fū）州：今陕西省延安市富县。\n[2]闺中：指作者的妻子。\n[3]怜：疼爱。\n[4]未解：不懂。\n[5]虚幌：薄又透明的帐子。", "english": "On the moon over Fuzhou which shines bright,\nAlone you would gaze in your room tonight.\nI'm grieved to think our little children are\nToo young to yearn for their father afar.\nYour cloudlike hair is moist with dew, it seems;\nYour jade-white arms would feel the cold moonbeams.\nO when can we stand by the windowside,\nWatching the moon with our tear traces dried?", "poemType": "五言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">今夜鄜州<sup class=\"note-ref\">[1]</sup>月，<br>闺中<sup class=\"note-ref\">[2]</sup>只独看。<br>遥怜<sup class=\"note-ref\">[3]</sup>小儿女，<br>未解<sup class=\"note-ref\">[4]</sup>忆长安。<br>香雾云鬟湿，<br>清辉玉臂寒。<br>何时倚虚幌<sup class=\"note-ref\">[5]</sup>，<br>双照泪痕干！</p>\n<p class=\"prose\">公元756年六月，安禄山叛军攻进潼关，杜甫携家逃到鄜州羌村。八月杜甫离家，途中被叛军捉住，送到沦陷后的长安，望月思家，写下了这首《月夜》。诗人不说自己思念家人，反说妻子思念自己，可见双方都在思念。“独看”二字，暗示过去曾经同看，更增添了思念之情。</p>\n<p class=\"prose\">说儿女“未解忆长安”，反衬妻子的“忆”，又突出了“独”字；雾湿云鬟，月寒玉臂，想象妻子望月时间越久，思念越深，不免热泪盈眶，而这眼泪却是最后的“双照泪痕干”泄露出来的。既然双照泪痕才干，独看自然是泪痕不干了。“独看”和“双照”是诗眼，“独看”在诗人是现实，在妻子是想象；</p>\n<p class=\"prose\">“双照”却包括回忆和希望。本诗词旨委婉，章法紧密，所以古人说：“五律至此，无忝诗圣矣！”</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]鄜（fū）州：今陕西省延安市富县。<br>[2]闺中：指作者的妻子。<br>[3]怜：疼爱。<br>[4]未解：不懂。<br>[5]虚幌：薄又透明的帐子。</p>", "englishHtml": "<p class=\"poem-lines\">On the moon over Fuzhou which shines bright,<br>Alone you would gaze in your room tonight.<br>I&#x27;m grieved to think our little children are<br>Too young to yearn for their father afar.<br>Your cloudlike hair is moist with dew, it seems;<br>Your jade-white arms would feel the cold moonbeams.<br>O when can we stand by the windowside,<br>Watching the moon with our tear traces dried?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Moonlit Night,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as moonlight, clouds, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "015", "zhTitle": "悲陈陶", "enTitle": "Lament on the Defeat at Chentao", "chinese": "孟冬[2]十郡[3]良家子[4]，\n血作陈陶泽中水。\n野旷天清无战声[5]，\n四万义军[6]同日死。\n群胡归来血洗箭，\n仍唱胡歌饮都市。\n都人回面向北啼[7]，\n日夜更望官军至。\n公元756年冬天，安禄山叛军在长安西北的陈陶泽和唐军作战，唐军义兵四五万人来自西北十郡（今陕西一带），几乎全军覆没，血染陈陶战场，景象惨不忍睹。杜甫当时被困长安，写下了这首纪实诗。第三句“野旷天清无战声”，仿佛天地都在沉痛哀悼牺牲的义士。第五、六句写叛军的骄横得意，衬托出第七、八句人民的悲伤，只有寄希望于官军收复长安了。诗人不只是客观地展现伤痛，而且写出了人民的感情和希望。\n注释：\n[1]陈陶：地名，在长安西北。\n[2]孟冬：农历十月。\n[3]十郡（jùn）：指秦中各郡。\n[4]良家子：从家世清白的人家中征召的青年士兵。\n[5]无战声：战事结束，旷野一片安静。\n[6]义军：所有为国牺牲的士兵。\n[7]向北啼：唐肃宗驻扎于长安北方的灵武，所以百姓向北而啼。", "english": "In early winter noble sons of household good\nBlended with water in Chentao mires their pure blood.\nNo more war cry beneath the sky on the vast plain;\nIn one day forty thousand loyal warriors slain.\nThe enemy came back with blood-stained arrows long;\nThey drank in market place and shouted barbarous song.\nOur countrymen turned north their faces bathed in tears;\nDay and night they expect the royal cavaliers.", "poemType": "七言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">孟冬<sup class=\"note-ref\">[2]</sup>十郡<sup class=\"note-ref\">[3]</sup>良家子<sup class=\"note-ref\">[4]</sup>，<br>血作陈陶泽中水。<br>野旷天清无战声<sup class=\"note-ref\">[5]</sup>，<br>四万义军<sup class=\"note-ref\">[6]</sup>同日死。<br>群胡归来血洗箭，<br>仍唱胡歌饮都市。<br>都人回面向北啼<sup class=\"note-ref\">[7]</sup>，<br>日夜更望官军至。</p>\n<p class=\"prose\">公元756年冬天，安禄山叛军在长安西北的陈陶泽和唐军作战，唐军义兵四五万人来自西北十郡（今陕西一带），几乎全军覆没，血染陈陶战场，景象惨不忍睹。杜甫当时被困长安，写下了这首纪实诗。第三句“野旷天清无战声”，仿佛天地都在沉痛哀悼牺牲的义士。</p>\n<p class=\"prose\">第五、六句写叛军的骄横得意，衬托出第七、八句人民的悲伤，只有寄希望于官军收复长安了。诗人不只是客观地展现伤痛，而且写出了人民的感情和希望。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]陈陶：地名，在长安西北。<br>[2]孟冬：农历十月。<br>[3]十郡（jùn）：指秦中各郡。<br>[4]良家子：从家世清白的人家中征召的青年士兵。<br>[5]无战声：战事结束，旷野一片安静。<br>[6]义军：所有为国牺牲的士兵。<br>[7]向北啼：唐肃宗驻扎于长安北方的灵武，所以百姓向北而啼。</p>", "englishHtml": "<p class=\"poem-lines\">In early winter noble sons of household good<br>Blended with water in Chentao mires their pure blood.<br>No more war cry beneath the sky on the vast plain;<br>In one day forty thousand loyal warriors slain.<br>The enemy came back with blood-stained arrows long;<br>They drank in market place and shouted barbarous song.<br>Our countrymen turned north their faces bathed in tears;<br>Day and night they expect the royal cavaliers.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Lament on the Defeat at Chentao,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, frontier scenes, homecoming, and war and displacement give the poem its visual texture and emotional temperature.</p>"}, {"num": "016", "zhTitle": "对雪", "enTitle": "Facing Snow", "chinese": "战哭[1]多新鬼[2]，\n愁吟[3]独老翁。\n乱云低薄暮，\n急雪舞回风[4]。\n瓢[5]弃樽无绿，\n炉存火似红。\n数州消息断，\n愁坐[6]正书空[7]。\n这首诗是在长安失陷后写的。安禄山攻陷长安后，诗人逃到半路被叛军抓回。痛苦的心情，艰难的生活，时时折磨着他。房琯所率唐军新败，死伤数万，长安光复无望，又给诗人心头蒙上一层愁苦。诗的开头暗示唐军大败，以及自身所处环境的险恶。三、四两句既点出题目，又对应上文的“独”，身为俘虏，唯有风雪相对，沉郁的困苦愁情被这乱云急雪渲染、放大。诗人的生活也贫困窘迫，酒葫芦在动乱中早已丢弃，酒樽也成了摆设，炉子里仿佛有火在熊熊燃烧，这种想象的手法，把诗人渴望温暖的感受和铁炉的冰冷生动鲜明地展露无遗。末尾回归对家人和局势的担忧，表达了诗人对国家命运的深切关怀。\n注释：\n[1]战哭：在战场上哭泣的士兵。\n[2]新鬼：死去士兵的亡魂。\n[3]愁吟：哀鸣。\n[4]回风：旋风。\n[5]瓢（piáo）：此处指酒葫芦。\n[6]愁坐：忧伤地静坐。\n[7]书空：典出晋代殷浩，用手指在空中虚画字形，形容忧愁或百无聊赖。", "english": "So many weep on battlefield;\nAn old man sings with grief he's filled.\nAt dusk the tousled clouds fly low;\nIn swirling wind falls sudden snow.\nThe gourd and pot not green with wine,\nHow for a burning stove does he pine!\nCould he get news from anywhere?\nWhat can he do but write in air!", "poemType": "五言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">战哭<sup class=\"note-ref\">[1]</sup>多新鬼<sup class=\"note-ref\">[2]</sup>，<br>愁吟<sup class=\"note-ref\">[3]</sup>独老翁。<br>乱云低薄暮，<br>急雪舞回风<sup class=\"note-ref\">[4]</sup>。<br>瓢<sup class=\"note-ref\">[5]</sup>弃樽无绿，<br>炉存火似红。<br>数州消息断，<br>愁坐<sup class=\"note-ref\">[6]</sup>正书空<sup class=\"note-ref\">[7]</sup>。</p>\n<p class=\"prose\">这首诗是在长安失陷后写的。安禄山攻陷长安后，诗人逃到半路被叛军抓回。痛苦的心情，艰难的生活，时时折磨着他。房琯所率唐军新败，死伤数万，长安光复无望，又给诗人心头蒙上一层愁苦。诗的开头暗示唐军大败，以及自身所处环境的险恶。</p>\n<p class=\"prose\">三、四两句既点出题目，又对应上文的“独”，身为俘虏，唯有风雪相对，沉郁的困苦愁情被这乱云急雪渲染、放大。诗人的生活也贫困窘迫，酒葫芦在动乱中早已丢弃，酒樽也成了摆设，炉子里仿佛有火在熊熊燃烧，这种想象的手法，把诗人渴望温暖的感受和铁炉的冰冷生动鲜明地展露无遗。</p>\n<p class=\"prose\">末尾回归对家人和局势的担忧，表达了诗人对国家命运的深切关怀。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]战哭：在战场上哭泣的士兵。<br>[2]新鬼：死去士兵的亡魂。<br>[3]愁吟：哀鸣。<br>[4]回风：旋风。<br>[5]瓢（piáo）：此处指酒葫芦。<br>[6]愁坐：忧伤地静坐。<br>[7]书空：典出晋代殷浩，用手指在空中虚画字形，形容忧愁或百无聊赖。</p>", "englishHtml": "<p class=\"poem-lines\">So many weep on battlefield;<br>An old man sings with grief he&#x27;s filled.<br>At dusk the tousled clouds fly low;<br>In swirling wind falls sudden snow.<br>The gourd and pot not green with wine,<br>How for a burning stove does he pine!<br>Could he get news from anywhere?<br>What can he do but write in air!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Facing Snow,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as clouds, wine, war and displacement, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "017", "zhTitle": "春望", "enTitle": "Spring View", "chinese": "国[1]破山河在，\n城春草木深。\n感时[2]花溅泪，\n恨别鸟惊心。\n烽火连三月，\n家书抵万金。\n白头搔更短[3]，\n浑欲不胜簪[4]。\n《春望》作于公元757年三月，安禄山叛军攻陷长安一年之后。诗一开始就写国都沦陷，城池残破，虽然山河依旧，可是乱草遍地，林木苍苍，已经人事全非了。这表面上是写景，实际上是抒情。接着诗人有感于时世艰难，看见美丽的花朵反而会流泪；因恨家破人散，听见欢乐的鸟叫也会胆战心惊。战争已经从去年三月打到今年三月，得到一封家信都抵得上万两黄金。诗人担惊受怕，头发都变白了，急得直搔头，而头发越搔越少，少得连发簪都插不住了。这首诗寄情于物，托感于景，情景交融，传达了诗人爱国爱家的一片真心，是传诵千年的名诗。\n注释：\n[1]国：指都城。\n[2]感时：感叹时事。\n[3]短：少。\n[4]不胜簪（zān）：插不上簪子。", "english": "On war-torn land streams flow and mountains stand;\nIn vernal town grass and weeds are o'ergrown.\nGrieved o'er the years, flowers make us shed tears;\nHating to part, hearing birds breaks our heart.\nThe beacon fire has gone higher and higher;\nWords from household are worth their weight in gold.\nI cannot bear to scratch my grizzling hair;\nIt grows too thin to hold a light hairpin.", "poemType": "五言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">国<sup class=\"note-ref\">[1]</sup>破山河在，<br>城春草木深。<br>感时<sup class=\"note-ref\">[2]</sup>花溅泪，<br>恨别鸟惊心。<br>烽火连三月，<br>家书抵万金。<br>白头搔更短<sup class=\"note-ref\">[3]</sup>，<br>浑欲不胜簪<sup class=\"note-ref\">[4]</sup>。</p>\n<p class=\"prose\">《春望》作于公元757年三月，安禄山叛军攻陷长安一年之后。诗一开始就写国都沦陷，城池残破，虽然山河依旧，可是乱草遍地，林木苍苍，已经人事全非了。这表面上是写景，实际上是抒情。接着诗人有感于时世艰难，看见美丽的花朵反而会流泪；</p>\n<p class=\"prose\">因恨家破人散，听见欢乐的鸟叫也会胆战心惊。战争已经从去年三月打到今年三月，得到一封家信都抵得上万两黄金。诗人担惊受怕，头发都变白了，急得直搔头，而头发越搔越少，少得连发簪都插不住了。这首诗寄情于物，托感于景，情景交融，传达了诗人爱国爱家的一片真心，是传诵千年的名诗。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]国：指都城。<br>[2]感时：感叹时事。<br>[3]短：少。<br>[4]不胜簪（zān）：插不上簪子。</p>", "englishHtml": "<p class=\"poem-lines\">On war-torn land streams flow and mountains stand;<br>In vernal town grass and weeds are o&#x27;ergrown.<br>Grieved o&#x27;er the years, flowers make us shed tears;<br>Hating to part, hearing birds breaks our heart.<br>The beacon fire has gone higher and higher;<br>Words from household are worth their weight in gold.<br>I cannot bear to scratch my grizzling hair;<br>It grows too thin to hold a light hairpin.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Spring View,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, water, moonlight, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "018", "zhTitle": "哀江头", "enTitle": "Lament along the Winding River", "chinese": "少陵野老吞声哭[1]，\n春日潜行[2]曲江曲。\n江头宫殿锁千门，\n细柳新蒲为谁绿[3]？\n忆昔霓旌[4]下南苑，\n苑中万物生颜色[5]。\n昭阳殿里第一人，\n同辇随君侍君侧。\n辇前才人带弓箭，\n白马嚼啮黄金勒。\n翻身向天仰射云[6]，\n一笑正坠双飞翼。\n明眸皓齿今何在？\n血污游魂归不得。\n清渭东流剑阁深，\n去住彼此无消息。\n人生有情泪沾臆，\n江水江花岂终极？\n黄昏胡骑[7]尘满城，\n欲往城南望城北。\n《哀江头》也是公元757年春天的作品。江指曲江，在长安的东南。汉武帝在江边修建了亭台楼阁，是汉唐两代的游览名胜。但安禄山攻占长安之后，宫门上锁，庭苑荒芜。杜甫一人偷偷前来，抚今追昔，不禁感慨系之，就写下了这首《哀江头》。前四句写沦陷后曲折多致的曲江已经人物全非，今非昔比了。自第五句起，八句回忆沦陷前春到曲江的繁华景象，特写唐玄宗和杨贵妃同车来游，宫中女官戎装侍卫，一箭射下两只大雁的盛况。自第十三句起，写杨贵妃因兵变惨死马嵬坡，身为游魂，欲归不得，而唐玄宗却经由剑阁入川，生死隔绝了。最后四句诗人见景伤情，感慨深沉，用无情的江水江花来反衬，更显得诗人情深。这深情表现在行动上，就是他本来要回城南，却心烦意乱，反而走向城北了。诗人在表达爱国热忱之时，也流露了对君王的伤悼之情。\n注释：\n[1]吞声哭：不敢出声地哭泣。\n[2]潜行：偷偷地走到这里。\n[3]为谁绿：国破家亡，连草木都失去了绿意。\n[4]霓（ní）旌：指天子的旗。\n[5]生颜色：蓬勃生辉。\n[6]仰射云：仰射云间飞过的鸟。\n[7]胡骑：指叛军的骑兵。", "english": "Old and deprived, I swallow tears on a spring day;\nAlong Winding River in stealth I go my way.\nAll palace gates and doors are locked on rivershore;\nWillows and reeds are green for no one to adore.\nI remember rainbow banners streamed at high tide\nTo Southern Park where everything was beautified.\nThe first lady of the Sunny Palace would ride\nIn the imperial chariot by the emperor's side.\nThe horsewomen before her bore arrows and bow;\nTheir white steeds champed at golden bits on the front row.\nOne archer, leaning back, shot at cloud in the sky;\nOne arrow brought down two winged birds from on high.\nWhere are the first lady's pearly teeth and eyes bright?\nHer spirit, blood-stained, could not come back from the height.\nFar from Sword Cliff, with River Wei her soul flew east;\nThe emperor got no news from her in the least.\nA man who has a heart will wet his breast with tears.\nWould riverside grass and flowers not weep for years?\nAt dusk the rebels' horses overrun the town;\nI want to go upward, but instead I go down.", "poemType": "七言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">少陵野老吞声哭<sup class=\"note-ref\">[1]</sup>，<br>春日潜行<sup class=\"note-ref\">[2]</sup>曲江曲。<br>江头宫殿锁千门，<br>细柳新蒲为谁绿<sup class=\"note-ref\">[3]</sup>？<br>忆昔霓旌<sup class=\"note-ref\">[4]</sup>下南苑，<br>苑中万物生颜色<sup class=\"note-ref\">[5]</sup>。<br>昭阳殿里第一人，<br>同辇随君侍君侧。<br>辇前才人带弓箭，<br>白马嚼啮黄金勒。<br>翻身向天仰射云<sup class=\"note-ref\">[6]</sup>，<br>一笑正坠双飞翼。<br>明眸皓齿今何在？<br>血污游魂归不得。<br>清渭东流剑阁深，<br>去住彼此无消息。<br>人生有情泪沾臆，<br>江水江花岂终极？<br>黄昏胡骑<sup class=\"note-ref\">[7]</sup>尘满城，<br>欲往城南望城北。</p>\n<p class=\"prose\">《哀江头》也是公元757年春天的作品。江指曲江，在长安的东南。汉武帝在江边修建了亭台楼阁，是汉唐两代的游览名胜。但安禄山攻占长安之后，宫门上锁，庭苑荒芜。杜甫一人偷偷前来，抚今追昔，不禁感慨系之，就写下了这首《哀江头》。</p>\n<p class=\"prose\">前四句写沦陷后曲折多致的曲江已经人物全非，今非昔比了。自第五句起，八句回忆沦陷前春到曲江的繁华景象，特写唐玄宗和杨贵妃同车来游，宫中女官戎装侍卫，一箭射下两只大雁的盛况。自第十三句起，写杨贵妃因兵变惨死马嵬坡，身为游魂，欲归不得，而唐玄宗却经由剑阁入川，生死隔绝了。</p>\n<p class=\"prose\">最后四句诗人见景伤情，感慨深沉，用无情的江水江花来反衬，更显得诗人情深。这深情表现在行动上，就是他本来要回城南，却心烦意乱，反而走向城北了。诗人在表达爱国热忱之时，也流露了对君王的伤悼之情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]吞声哭：不敢出声地哭泣。<br>[2]潜行：偷偷地走到这里。<br>[3]为谁绿：国破家亡，连草木都失去了绿意。<br>[4]霓（ní）旌：指天子的旗。<br>[5]生颜色：蓬勃生辉。<br>[6]仰射云：仰射云间飞过的鸟。<br>[7]胡骑：指叛军的骑兵。</p>", "englishHtml": "<p class=\"poem-lines\">Old and deprived, I swallow tears on a spring day;<br>Along Winding River in stealth I go my way.<br>All palace gates and doors are locked on rivershore;<br>Willows and reeds are green for no one to adore.<br>I remember rainbow banners streamed at high tide<br>To Southern Park where everything was beautified.<br>The first lady of the Sunny Palace would ride<br>In the imperial chariot by the emperor&#x27;s side.<br>The horsewomen before her bore arrows and bow;<br>Their white steeds champed at golden bits on the front row.<br>One archer, leaning back, shot at cloud in the sky;<br>One arrow brought down two winged birds from on high.<br>Where are the first lady&#x27;s pearly teeth and eyes bright?<br>Her spirit, blood-stained, could not come back from the height.<br>Far from Sword Cliff, with River Wei her soul flew east;<br>The emperor got no news from her in the least.<br>A man who has a heart will wet his breast with tears.<br>Would riverside grass and flowers not weep for years?<br>At dusk the rebels&#x27; horses overrun the town;<br>I want to go upward, but instead I go down.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Lament along the Winding River,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, clouds, flowers, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "019", "zhTitle": "喜达行在所 （三首其二）", "enTitle": "At the Temporary Imperial Court ( II )", "chinese": "喜达行在所\n（三首其二）\n愁思胡笳夕，\n凄凉汉苑[1]春。\n生还今日事，\n间道[2]暂时人。\n司隶[3]章初睹，\n南阳气已新。\n喜心翻倒极，\n呜咽泪沾巾。\n行在所，指朝廷临时政府所在地。公元757年四月，杜甫冒险逃出被叛军占据的长安，投奔在凤翔的唐肃宗。历尽千辛万苦，他终于到达了临时政府。当年五月，唐肃宗拜杜甫为左拾遗。《喜达行在所》是组诗，这是其中第二首。开篇追忆当年身陷叛军时，夜闻胡笳则愁，春回旧苑则悲。汉苑实指唐宫，旧日宫墙记录着往日的繁华，似诉今日凄凉。诗人刚刚生还，惊魂未定，不久之前，逃亡途中的事还历历在目，仿佛仍然随时都会死去，故称“暂时人”。“司隶”两句描写朝廷新气象，借用刘秀光武中兴重整汉室的典故，南阳是刘秀的故乡，刘秀拨乱反正，正如今日凤翔景象。眼见中兴有望，诗人喜极而泣。\n注释：\n[1]汉苑：此处以汉代比唐代，如曲江、南苑等地。\n[2]间道：易于逃窜的小道。\n[3]司隶：代指朝廷官员。", "english": "At the Temporary Imperial Court\n(II)\nSad to hear the Tartar bugle at nightfall\nAnd see the royal garden desolate,\nHow glad I'm now to answer royal call\nAfter living as a captive of late!\nI'm happy to assume an office new\nWhen the imperial court will thrive again,\nBut memory of the past comes in view,\nTears stream down and leave on my sleeves their stain.", "poemType": "五言古诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">喜达行在所<br>（三首其二）<br>愁思胡笳夕，<br>凄凉汉苑<sup class=\"note-ref\">[1]</sup>春。<br>生还今日事，<br>间道<sup class=\"note-ref\">[2]</sup>暂时人。<br>司隶<sup class=\"note-ref\">[3]</sup>章初睹，<br>南阳气已新。<br>喜心翻倒极，<br>呜咽泪沾巾。</p>\n<p class=\"prose\">行在所，指朝廷临时政府所在地。公元757年四月，杜甫冒险逃出被叛军占据的长安，投奔在凤翔的唐肃宗。历尽千辛万苦，他终于到达了临时政府。当年五月，唐肃宗拜杜甫为左拾遗。《喜达行在所》是组诗，这是其中第二首。开篇追忆当年身陷叛军时，夜闻胡笳则愁，春回旧苑则悲。</p>\n<p class=\"prose\">汉苑实指唐宫，旧日宫墙记录着往日的繁华，似诉今日凄凉。诗人刚刚生还，惊魂未定，不久之前，逃亡途中的事还历历在目，仿佛仍然随时都会死去，故称“暂时人”。“司隶”两句描写朝廷新气象，借用刘秀光武中兴重整汉室的典故，南阳是刘秀的故乡，刘秀拨乱反正，正如今日凤翔景象。</p>\n<p class=\"prose\">眼见中兴有望，诗人喜极而泣。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]汉苑：此处以汉代比唐代，如曲江、南苑等地。<br>[2]间道：易于逃窜的小道。<br>[3]司隶：代指朝廷官员。</p>", "englishHtml": "<p class=\"poem-lines\">At the Temporary Imperial Court(II)<br>Sad to hear the Tartar bugle at nightfall<br>And see the royal garden desolate,<br>How glad I&#x27;m now to answer royal call<br>After living as a captive of late!<br>I&#x27;m happy to assume an office new<br>When the imperial court will thrive again,<br>But memory of the past comes in view,<br>Tears stream down and leave on my sleeves their stain.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “At the Temporary Imperial Court ( II ),” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as frontier scenes and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "020", "zhTitle": "羌村 （三首其一）", "enTitle": "Coming Back to Qiang Village ( I )", "chinese": "羌村\n（三首其一）\n峥嵘[1]赤云西[2]，\n日脚下平地。\n柴门鸟雀噪，\n归客千里至。\n妻孥[3]怪我在，\n惊定还拭泪。\n世乱遭飘荡，\n生还偶然遂[4]！\n邻人满墙头，\n感叹亦歔欷[5]。\n夜阑[6]更秉烛，\n相对如梦寐。\n公元757年秋天，杜甫回到羌村，全家久别重逢，悲喜交集，诗人写了三首《羌村》，这里选的是第一首。前四句写夕阳西下时，杜甫到羌村的情况。诗人把璀璨的晚霞比作峥嵘的山峰，把云缝中照射下来的光线叫作“日脚”，仿佛太阳经过了一天的奔波，急于西下，正如诗人经过了长途跋涉，急于回家一样，这又是情景交融了。鸟雀的叫声反衬出了山村的荒凉萧条。中间四句写妻子见面不敢相信，不敢相认，甚至发愣了；这刻画出了患难余生的心理状态。后四句先写邻人围观，寥寥十字，富有人情味。后写家人深夜烛下对坐，反疑相见是梦，真是入木三分。全诗用白描手法，取材于一时见闻，景实情真，写出了典型的生活情景和人物的心理活动，所以读来耐人寻味。\n注释：\n[1]峥嵘：形容山峰高峻。\n[2]赤云西：赤云的西边。\n[3]妻孥（nú）：妻子和儿女。\n[4]遂：如愿以偿。\n[5]歔（xū）欷（xī）：悲泣之声。\n[6]夜阑：深夜。", "english": "Coming Back to Qiang Village\n(I)\nLike rugged hills hangs gilt-edged cloud;\nThe sunset sheds departing ray.\nThe wicket gate with birds is loud\nWhen I come back from far away.\nAt my appearance starts my wife;\nThen calming down, she melts in tears.\nBy chance I come back still in life,\nWhile people drift in bitter years.\nMy neighbors look over the wall;\nThey sigh and from their eyes tears stream.\nWhen night comes, candles light the hall;\nWe sit face to face as in dream.", "poemType": "五言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">羌村<br>（三首其一）<br>峥嵘<sup class=\"note-ref\">[1]</sup>赤云西<sup class=\"note-ref\">[2]</sup>，<br>日脚下平地。<br>柴门鸟雀噪，<br>归客千里至。<br>妻孥<sup class=\"note-ref\">[3]</sup>怪我在，<br>惊定还拭泪。<br>世乱遭飘荡，<br>生还偶然遂<sup class=\"note-ref\">[4]</sup>！<br>邻人满墙头，<br>感叹亦歔欷<sup class=\"note-ref\">[5]</sup>。<br>夜阑<sup class=\"note-ref\">[6]</sup>更秉烛，<br>相对如梦寐。</p>\n<p class=\"prose\">公元757年秋天，杜甫回到羌村，全家久别重逢，悲喜交集，诗人写了三首《羌村》，这里选的是第一首。前四句写夕阳西下时，杜甫到羌村的情况。诗人把璀璨的晚霞比作峥嵘的山峰，把云缝中照射下来的光线叫作“日脚”，仿佛太阳经过了一天的奔波，急于西下，正如诗人经过了长途跋涉，急于回家一样，这又是情景交融了。</p>\n<p class=\"prose\">鸟雀的叫声反衬出了山村的荒凉萧条。中间四句写妻子见面不敢相信，不敢相认，甚至发愣了；这刻画出了患难余生的心理状态。后四句先写邻人围观，寥寥十字，富有人情味。后写家人深夜烛下对坐，反疑相见是梦，真是入木三分。全诗用白描手法，取材于一时见闻，景实情真，写出了典型的生活情景和人物的心理活动，所以读来耐人寻味。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]峥嵘：形容山峰高峻。<br>[2]赤云西：赤云的西边。<br>[3]妻孥（nú）：妻子和儿女。<br>[4]遂：如愿以偿。<br>[5]歔（xū）欷（xī）：悲泣之声。<br>[6]夜阑：深夜。</p>", "englishHtml": "<p class=\"poem-lines\">Coming Back to Qiang Village(I)<br>Like rugged hills hangs gilt-edged cloud;<br>The sunset sheds departing ray.<br>The wicket gate with birds is loud<br>When I come back from far away.<br>At my appearance starts my wife;<br>Then calming down, she melts in tears.<br>By chance I come back still in life,<br>While people drift in bitter years.<br>My neighbors look over the wall;<br>They sigh and from their eyes tears stream.<br>When night comes, candles light the hall;<br>We sit face to face as in dream.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Coming Back to Qiang Village ( I ),” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as clouds, birds, homecoming, and war and displacement give the poem its visual texture and emotional temperature.</p>"}, {"num": "021", "zhTitle": "曲江[1] （二首其一）", "enTitle": "The Winding River ( I )", "chinese": "曲江[1]\n（二首其一）\n一片花飞减却春[2]，\n风飘万点[3]正愁人。\n且看欲尽花经眼，\n莫厌伤多酒入唇。\n江上小堂巢翡翠[4]，\n苑边高冢[5]卧麒麟。\n细推[6]物理[7]须行乐，\n何用浮名[8]绊此身？\n这首诗作于公元758年暮春，唐军已收复长安，安史之乱渐渐平息，但这场浩劫留下的是满目疮痍。回到长安后，宦官李辅国擅权，左拾遗杜甫受到排挤，心情极度烦闷，于是借此诗伤春感时。开篇语奇而意境深远，终于盼到春暖花开，而春光易逝花易老，转眼已是残春景象。每落一片花瓣，都会减掉一丝春色，何况“风飘万点”，怎不使人伤春惜春。颔联写花飞欲尽，莫不经眼，作者借酒浇愁，无心去想酒多伤身。颈联写曲江的荒凉颓废，江上的小堂，因长期无人，小鸟巢其中；苑边的陵墓，久无人祭扫，墓饰倒卧杂草。经过一番动荡，繁华不再，昔日盛况难返，寄寓作者对世事无常的感慨。然而道法自然，万物兴废本是自然之理，宇宙万物之间，所有荣华兴盛都只是昙花一现，又何必为浮名所累，还是快意人生及时行乐吧。\n注释：\n[1]曲江：唐代地名，位于今陕西西安东南郊的河流，游玩佳处。\n[2]减却春：失去春色。\n[3]万点：很多的落花。\n[4]巢翡翠：翡翠鸟筑巢。\n[5]冢（zhǒnɡ）：坟墓。\n[6]推：推究。\n[7]物理：事物的道理。\n[8]浮名：虚名。", "english": "The Winding River\n(I)\nEach fallen petal means a bit of spring passed away.\nHow sad to see so many blown down by the breeze!\nBefore all blossoms fall by the end of the day,\nFear not to drink more wine would put your mind at ease!\nKingfishers build their nest in a riverside hall;\nAn unicorn in stone before the graveyard lies.\nWe should enjoy life in response to nature's call.\nWhy should we seek for vainglory in people's eyes?", "poemType": "七言古诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">曲江<sup class=\"note-ref\">[1]</sup><br>（二首其一）<br>一片花飞减却春<sup class=\"note-ref\">[2]</sup>，<br>风飘万点<sup class=\"note-ref\">[3]</sup>正愁人。<br>且看欲尽花经眼，<br>莫厌伤多酒入唇。<br>江上小堂巢翡翠<sup class=\"note-ref\">[4]</sup>，<br>苑边高冢<sup class=\"note-ref\">[5]</sup>卧麒麟。<br>细推<sup class=\"note-ref\">[6]</sup>物理<sup class=\"note-ref\">[7]</sup>须行乐，<br>何用浮名<sup class=\"note-ref\">[8]</sup>绊此身？</p>\n<p class=\"prose\">这首诗作于公元758年暮春，唐军已收复长安，安史之乱渐渐平息，但这场浩劫留下的是满目疮痍。回到长安后，宦官李辅国擅权，左拾遗杜甫受到排挤，心情极度烦闷，于是借此诗伤春感时。开篇语奇而意境深远，终于盼到春暖花开，而春光易逝花易老，转眼已是残春景象。</p>\n<p class=\"prose\">每落一片花瓣，都会减掉一丝春色，何况“风飘万点”，怎不使人伤春惜春。颔联写花飞欲尽，莫不经眼，作者借酒浇愁，无心去想酒多伤身。颈联写曲江的荒凉颓废，江上的小堂，因长期无人，小鸟巢其中；苑边的陵墓，久无人祭扫，墓饰倒卧杂草。</p>\n<p class=\"prose\">经过一番动荡，繁华不再，昔日盛况难返，寄寓作者对世事无常的感慨。然而道法自然，万物兴废本是自然之理，宇宙万物之间，所有荣华兴盛都只是昙花一现，又何必为浮名所累，还是快意人生及时行乐吧。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]曲江：唐代地名，位于今陕西西安东南郊的河流，游玩佳处。<br>[2]减却春：失去春色。<br>[3]万点：很多的落花。<br>[4]巢翡翠：翡翠鸟筑巢。<br>[5]冢（zhǒnɡ）：坟墓。<br>[6]推：推究。<br>[7]物理：事物的道理。<br>[8]浮名：虚名。</p>", "englishHtml": "<p class=\"poem-lines\">The Winding River(I)<br>Each fallen petal means a bit of spring passed away.<br>How sad to see so many blown down by the breeze!<br>Before all blossoms fall by the end of the day,<br>Fear not to drink more wine would put your mind at ease!<br>Kingfishers build their nest in a riverside hall;<br>An unicorn in stone before the graveyard lies.<br>We should enjoy life in response to nature&#x27;s call.<br>Why should we seek for vainglory in people&#x27;s eyes?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Winding River ( I ),” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as water, flowers, and wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "022", "zhTitle": "曲江 （二首其二）", "enTitle": "The Winding River ( II )", "chinese": "曲江\n（二首其二）\n朝回[1]日日典[2]春衣，\n每日江头尽醉归。\n酒债寻常行处[3]有，\n人生七十古来稀。\n穿花蛱蝶深深[4]见[5]，\n点水蜻蜓款款飞。\n传语风光共流转[6]，\n暂时相赏莫相违[7]。\n暮春时节，诗人下朝回来，典当春衣买醉，生活清贫如此。典当春衣，有可能是因为冬衣已经当完，终日熏熏，可见其仕不得志。典衣买酒终是杯水车薪，故处处赊有酒债，诗人对此的评论是“人生七十古来稀”，人生苦短，既然仕途不得志，姑且“莫思身外无穷事，且尽生前有限杯”。“穿花”两句是杜诗中的名句，这一联不事雕琢，有璞玉天成之妙，“深深”映照出“穿”的灵巧，“款款”衬托出“点”的优雅，这两句对仗工整，意境恬然自得。美好的事物总是短暂的，恰如短暂的人生，所以风光如许，不可辜负，诗人于无奈的尘世中，寻得一丝慰藉。\n注释：\n[1]朝回：下朝回来。\n[2]典：典当。\n[3]行处：所到之处。\n[4]深深：在花丛深处。\n[5]见：通“现”。\n[6]共流转：在一起逗留、徘徊。\n[7]违：错过。", "english": "The Winding River\n(II)\nI pawn my spring gown after audience day by day,\nTo drink my fill in riverside shops all the way.\nNo wonder there's no shop but I owe debt of wine.\nIf not, why live to seventy like an old pine?\nButterflies gather honey from flower to flower;\nDragonflies skim over water lower and lower.\nLet us enjoy more wine with ease as time evolves!\nDo not regret too late when sun or moon revolves!", "poemType": "七言古诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">曲江<br>（二首其二）<br>朝回<sup class=\"note-ref\">[1]</sup>日日典<sup class=\"note-ref\">[2]</sup>春衣，<br>每日江头尽醉归。<br>酒债寻常行处<sup class=\"note-ref\">[3]</sup>有，<br>人生七十古来稀。<br>穿花蛱蝶深深<sup class=\"note-ref\">[4]</sup>见<sup class=\"note-ref\">[5]</sup>，<br>点水蜻蜓款款飞。<br>传语风光共流转<sup class=\"note-ref\">[6]</sup>，<br>暂时相赏莫相违<sup class=\"note-ref\">[7]</sup>。</p>\n<p class=\"prose\">暮春时节，诗人下朝回来，典当春衣买醉，生活清贫如此。典当春衣，有可能是因为冬衣已经当完，终日熏熏，可见其仕不得志。典衣买酒终是杯水车薪，故处处赊有酒债，诗人对此的评论是“人生七十古来稀”，人生苦短，既然仕途不得志，姑且“莫思身外无穷事，且尽生前有限杯”。</p>\n<p class=\"prose\">“穿花”两句是杜诗中的名句，这一联不事雕琢，有璞玉天成之妙，“深深”映照出“穿”的灵巧，“款款”衬托出“点”的优雅，这两句对仗工整，意境恬然自得。美好的事物总是短暂的，恰如短暂的人生，所以风光如许，不可辜负，诗人于无奈的尘世中，寻得一丝慰藉。</p>
