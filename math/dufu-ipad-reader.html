class=\"prose\">第三首是第二首的延伸，紧接上文的暮色写晨曦中的夔州。诗人日日独坐江楼，秋色清明，江水宁静，带给诗人的却是烦扰不安。每当山城的千家百户还沉浸在朝晖中，自己却孤身一人坐在江边山楼上，看着留宿江中的渔船，总是在上下翻飞的燕子，流露出诗人烦恼的心情。</p>\n<p class=\"prose\">颈联用典，汉元帝初时，日蚀地震，匡衡上疏，帝悦其言，迁为光禄大夫，太子少傅，建议亦常被采纳；东汉刘向，在朝历经三世，都得重用，对儒学传播起了很大的作用。诗人将自己与匡、刘对比，叹息自己一生事与愿违。尾联用同学多不贱反衬自己的落魄不得志。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]翠微：青山。<br>[2]信宿：再宿，连住两夜。<br>[3]抗疏：指臣子对皇帝的命令有所抵制，上疏劝谏。<br>[4]刘向：字子政，汉朝经学家。<br>[5]轻肥：轻裘肥马。</p>", "englishHtml": "<p class=\"poem-lines\">Reflections in Autumn</p>\n<p class=\"stanza-marker\">(III)</p>\n<p class=\"poem-lines\">Thousands of mountain cottages bathed in the twilight,<br>Each day by riverside I gaze on verdant scene.<br>Fishermen come to cast their net after the night,<br>And swallows flap their wings and flit in autumn green.<br>Disposed after my proposal, I don&#x27;t care for fame;<br>Studying classics, I am not yet a good hand.<br>Most of my young companions have made a fine name;<br>Splendidly clad, they ride splendid steeds on the land.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reflections in Autumn ( III),” the poem turns a natural scene into a space of movement, wonder, and emotional release.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as mountains, water, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "080", "zhTitle": "秋兴 （八首其四）", "enTitle": "Reflections in Autumn ( IV )", "chinese": "秋兴\n（八首其四）\n闻道长安似弈棋，\n百年[1]世事不胜悲。\n王侯第宅[2]皆新主，\n文武衣冠异昔时[3]。\n直北关山金鼓振[4]，\n征西[5]车马羽书驰[6]。\n鱼龙寂寞秋江冷，\n故国平居有所思。\n这一首是感叹长安时局多变以及边境纷扰。广德年间，吐蕃、回纥不断入侵，京师震撼，并曾一度占领长安，代宗仓促幸陕。是时诏征天下之兵，因宦官程元振专权，莫有至者。组诗由此首开始，主题转向回忆长安。首联说长安政局像棋局一样变化无常，自己一生见证了风雨飘摇，联想自己的浮生身世，心中满是悲苦。时局动荡，官员更替，满朝文武都是新人，本就备受冷遇的自己更加无所适从。西北多事，报军情的文件来往驰送，时局危急。尾联写在这国家残破、秋江清冷、飘零困苦、晚景凄凉的情况下，昔日在长安的生活常常呈现在怀想之中。表达诗人对人物皆非，盛世难再的叹惜与无奈。\n注释：\n[1]百年：人的一生。\n[2]第宅：府宅。\n[3]异昔时：不同往日。\n[4]金鼓振：发生战事。\n[5]征西：与吐蕃之间的战事。\n[6]驰：形容紧急。", "english": "Reflections in Autumn\n(IV)\nThe change in capital's like a game on chessboard.\nHow sad to know what's happened in a hundred years!\nNew tenants occupy the mansions of old lord;\nOfficials and officers are not old compeers.\nOn Northern frontiers clash of gong vies with drumbeat;\nDispatch-riders hurry along their western way.\nIn autumn river quiet fish and dragon meet.\nHow can I not think of the splendid bygone day!", "poemType": "七言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">秋兴<br>（八首其四）<br>闻道长安似弈棋，<br>百年<sup class=\"note-ref\">[1]</sup>世事不胜悲。<br>王侯第宅<sup class=\"note-ref\">[2]</sup>皆新主，<br>文武衣冠异昔时<sup class=\"note-ref\">[3]</sup>。<br>直北关山金鼓振<sup class=\"note-ref\">[4]</sup>，<br>征西<sup class=\"note-ref\">[5]</sup>车马羽书驰<sup class=\"note-ref\">[6]</sup>。<br>鱼龙寂寞秋江冷，<br>故国平居有所思。</p>\n<p class=\"prose\">这一首是感叹长安时局多变以及边境纷扰。广德年间，吐蕃、回纥不断入侵，京师震撼，并曾一度占领长安，代宗仓促幸陕。是时诏征天下之兵，因宦官程元振专权，莫有至者。组诗由此首开始，主题转向回忆长安。首联说长安政局像棋局一样变化无常，自己一生见证了风雨飘摇，联想自己的浮生身世，心中满是悲苦。</p>\n<p class=\"prose\">时局动荡，官员更替，满朝文武都是新人，本就备受冷遇的自己更加无所适从。西北多事，报军情的文件来往驰送，时局危急。尾联写在这国家残破、秋江清冷、飘零困苦、晚景凄凉的情况下，昔日在长安的生活常常呈现在怀想之中。表达诗人对人物皆非，盛世难再的叹惜与无奈。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]百年：人的一生。<br>[2]第宅：府宅。<br>[3]异昔时：不同往日。<br>[4]金鼓振：发生战事。<br>[5]征西：与吐蕃之间的战事。<br>[6]驰：形容紧急。</p>", "englishHtml": "<p class=\"poem-lines\">Reflections in Autumn(IV)<br>The change in capital&#x27;s like a game on chessboard.<br>How sad to know what&#x27;s happened in a hundred years!<br>New tenants occupy the mansions of old lord;<br>Officials and officers are not old compeers.<br>On Northern frontiers clash of gong vies with drumbeat;<br>Dispatch-riders hurry along their western way.<br>In autumn river quiet fish and dragon meet.<br>How can I not think of the splendid bygone day!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reflections in Autumn ( IV ),” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, water, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "081", "zhTitle": "秋兴 （八首其五）", "enTitle": "Reflections in Autumn ( V )", "chinese": "秋兴\n（八首其五）\n蓬莱宫阙[1]对南山，\n承露金茎霄汉间。\n西望瑶池降王母，\n东来紫气满函关[2]。\n云移[3]雉尾开宫扇，\n日绕龙鳞[4]识圣颜。\n一卧沧江[5]惊岁晚，\n几回青琐点朝班[6]！\n这首承接上文，描绘长安宫殿的巍峨壮丽，早朝场面的庄严肃穆，以及自己曾得“识圣颜”至今引为欣慰的回忆。值此沧江病卧，岁晚秋深，更加触动他的忧国之情。蓬莱宫阙，即大明宫，唐高宗时改为蓬莱宫。南山，即终南山，山上有含元殿、宣政殿、紫宸殿，与蓬莱宫相对。承露金茎即通天台。汉武帝在建章宫西边作承露盘，上有仙人掌，用于承接露水，和玉屑饮用，以求成仙。诗歌的首联描写长安宫殿的景色，既是景物的描写，也是暗指唐玄宗好道教求神仙的荒唐。颔联则用西王母和老子出函谷关的典故进一步指出，唐玄宗因为崇奉道教、追求长生而导致国家混乱。颈联联系到自身，感慨自己没有能尽力劝谏君王，于是想到自己在朝为官时的景象，“忠君爱国”的思想又充斥着诗人的胸怀。尾联写诗人虽然豪情万丈，但身居夔州，远离朝廷，加上年老多病，这一辈子是没有希望再去朝廷替皇上分忧解难了，寄托了年华老去，壮志难酬的感叹和哀伤。\n注释：\n[1]蓬莱宫阙：指大明宫。\n[2]函关：函谷关。\n[3]云移：把宫扇比作云，像云一样散开。\n[4]日绕龙鳞：形容皇帝衮袍上的龙纹光彩照人的样子。\n[5]卧沧江：在夔州养病。\n[6]点朝班：指上朝时，点名传呼百官依次上朝面圣。", "english": "Reflections in Autumn\n(V)\nThe fairy palaces face Southern Mountains high,\nThe gold plate welcomes the dew fallen from the sky.\nThe Western Queen comes to the Pool of Emerald;\nThe Eastern Pass sees purple mist veil Master Old.\nThe royal fans of phoenix tails usher like cloud\nThe robe of dragon scales with sunbeams overflowed.\nI lie by riverside till the end of the year.\nHow long from the court audience did I disappear!", "poemType": "七言古诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">秋兴<br>（八首其五）<br>蓬莱宫阙<sup class=\"note-ref\">[1]</sup>对南山，<br>承露金茎霄汉间。<br>西望瑶池降王母，<br>东来紫气满函关<sup class=\"note-ref\">[2]</sup>。<br>云移<sup class=\"note-ref\">[3]</sup>雉尾开宫扇，<br>日绕龙鳞<sup class=\"note-ref\">[4]</sup>识圣颜。<br>一卧沧江<sup class=\"note-ref\">[5]</sup>惊岁晚，<br>几回青琐点朝班<sup class=\"note-ref\">[6]</sup>！</p>\n<p class=\"prose\">这首承接上文，描绘长安宫殿的巍峨壮丽，早朝场面的庄严肃穆，以及自己曾得“识圣颜”至今引为欣慰的回忆。值此沧江病卧，岁晚秋深，更加触动他的忧国之情。蓬莱宫阙，即大明宫，唐高宗时改为蓬莱宫。南山，即终南山，山上有含元殿、宣政殿、紫宸殿，与蓬莱宫相对。</p>\n<p class=\"prose\">承露金茎即通天台。汉武帝在建章宫西边作承露盘，上有仙人掌，用于承接露水，和玉屑饮用，以求成仙。诗歌的首联描写长安宫殿的景色，既是景物的描写，也是暗指唐玄宗好道教求神仙的荒唐。颔联则用西王母和老子出函谷关的典故进一步指出，唐玄宗因为崇奉道教、追求长生而导致国家混乱。</p>\n<p class=\"prose\">颈联联系到自身，感慨自己没有能尽力劝谏君王，于是想到自己在朝为官时的景象，“忠君爱国”的思想又充斥着诗人的胸怀。尾联写诗人虽然豪情万丈，但身居夔州，远离朝廷，加上年老多病，这一辈子是没有希望再去朝廷替皇上分忧解难了，寄托了年华老去，壮志难酬的感叹和哀伤。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]蓬莱宫阙：指大明宫。<br>[2]函关：函谷关。<br>[3]云移：把宫扇比作云，像云一样散开。<br>[4]日绕龙鳞：形容皇帝衮袍上的龙纹光彩照人的样子。<br>[5]卧沧江：在夔州养病。<br>[6]点朝班：指上朝时，点名传呼百官依次上朝面圣。</p>", "englishHtml": "<p class=\"poem-lines\">Reflections in Autumn(V)<br>The fairy palaces face Southern Mountains high,<br>The gold plate welcomes the dew fallen from the sky.<br>The Western Queen comes to the Pool of Emerald;<br>The Eastern Pass sees purple mist veil Master Old.<br>The royal fans of phoenix tails usher like cloud<br>The robe of dragon scales with sunbeams overflowed.<br>I lie by riverside till the end of the year.<br>How long from the court audience did I disappear!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reflections in Autumn ( V ),” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, clouds, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "082", "zhTitle": "秋兴 （八首其六）", "enTitle": "Reflections in Autumn ( VI)", "chinese": "秋兴\n（八首其六）\n瞿塘峡[1]口曲江[2]头，\n万里风烟接素秋。\n花萼夹城通御气，\n芙蓉小苑入边愁[3]。\n珠帘绣柱围黄鹄[4]，\n锦缆牙樯[5]起白鸥。\n回首可怜歌舞地，\n秦中自古帝王州。\n本篇慨叹安史之乱以来，长安城满目疮痍。诗人在万里之外的瞿塘峡口，回想往日玄宗游幸曲江的盛况，对“自古帝王州”昔盛今衰的变化，不胜感慨。瞿塘为三峡门户，最险。曲江池，唐开元中疏凿，号为胜景。首联写如今万里唐家江山，全都淹没在这绵延万里的战火风烟之中。瞿塘峡与曲江口也接在这瑟瑟秋天的烽烟之中。花萼夹城，玄宗即位后，于兴庆宫西置楼，名曰花萼相辉之楼。后又筑夹城，天子游玩芙蓉园，必得从花萼楼夹城通过，故曰“通御气”，及后安禄山攻陷长安，作者羁身此地，望得山河破碎，故起边愁。颈联两句写当日皇帝游览之盛况，暗写今日江山之凋敝，昔盛今衰对比之中，可见作者的情怀。尾联歌舞地指曲江，秦中指长安，周秦汉隋都在此建都，秦州本帝王之州，今竟然以歌舞之故失去江山，实为可怜。金圣叹说这句有奉劝安禄山等国贼之意，秦州自古乃帝王之州，岂是逆贼可久居之地，暗示对来者的期待。\n注释：\n[1]瞿塘峡：峡名，三峡之一。\n[2]曲江：地名，在长安的南边。\n[3]入边愁：传来边地战乱的消息。\n[4]黄鹄：鸟名，即天鹅。\n[5]锦缆牙樯：带有华丽装饰的游船。", "english": "Reflections in Autumn\n(VI)\nBetween the narrow Gorge and Winding River head\nFor miles and miles mild autumn breeze and mist out spread.\nThe royal way goes between walls with flowers in bloom.\nTo Lotus Hall where comes news of frontier in gloom.\nThe golden crane amid pillars and pearly screen,\nSilver-white gulls around ivory masts or between.\nWhat pity to see these places of dance and song\nWhere none of emperors or kings can reign for long!", "poemType": "七言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">秋兴<br>（八首其六）<br>瞿塘峡<sup class=\"note-ref\">[1]</sup>口曲江<sup class=\"note-ref\">[2]</sup>头，<br>万里风烟接素秋。<br>花萼夹城通御气，<br>芙蓉小苑入边愁<sup class=\"note-ref\">[3]</sup>。<br>珠帘绣柱围黄鹄<sup class=\"note-ref\">[4]</sup>，<br>锦缆牙樯<sup class=\"note-ref\">[5]</sup>起白鸥。<br>回首可怜歌舞地，<br>秦中自古帝王州。</p>\n<p class=\"prose\">本篇慨叹安史之乱以来，长安城满目疮痍。诗人在万里之外的瞿塘峡口，回想往日玄宗游幸曲江的盛况，对“自古帝王州”昔盛今衰的变化，不胜感慨。瞿塘为三峡门户，最险。曲江池，唐开元中疏凿，号为胜景。首联写如今万里唐家江山，全都淹没在这绵延万里的战火风烟之中。</p>\n<p class=\"prose\">瞿塘峡与曲江口也接在这瑟瑟秋天的烽烟之中。花萼夹城，玄宗即位后，于兴庆宫西置楼，名曰花萼相辉之楼。后又筑夹城，天子游玩芙蓉园，必得从花萼楼夹城通过，故曰“通御气”，及后安禄山攻陷长安，作者羁身此地，望得山河破碎，故起边愁。</p>\n<p class=\"prose\">颈联两句写当日皇帝游览之盛况，暗写今日江山之凋敝，昔盛今衰对比之中，可见作者的情怀。尾联歌舞地指曲江，秦中指长安，周秦汉隋都在此建都，秦州本帝王之州，今竟然以歌舞之故失去江山，实为可怜。金圣叹说这句有奉劝安禄山等国贼之意，秦州自古乃帝王之州，岂是逆贼可久居之地，暗示对来者的期待。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]瞿塘峡：峡名，三峡之一。<br>[2]曲江：地名，在长安的南边。<br>[3]入边愁：传来边地战乱的消息。<br>[4]黄鹄：鸟名，即天鹅。<br>[5]锦缆牙樯：带有华丽装饰的游船。</p>", "englishHtml": "<p class=\"poem-lines\">Reflections in Autumn(VI)<br>Between the narrow Gorge and Winding River head<br>For miles and miles mild autumn breeze and mist out spread.<br>The royal way goes between walls with flowers in bloom.<br>To Lotus Hall where comes news of frontier in gloom.<br>The golden crane amid pillars and pearly screen,<br>Silver-white gulls around ivory masts or between.<br>What pity to see these places of dance and song<br>Where none of emperors or kings can reign for long!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reflections in Autumn ( VI),” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "083", "zhTitle": "秋兴 （八首其七）", "enTitle": "Reflections in Autumn ( VII )", "chinese": "秋兴\n（八首其七）\n昆明池[1]水汉时功，\n武帝[2]旌旗在眼中。\n织女机丝虚夜月，\n石鲸鳞甲动秋风。\n波漂菰[3]米沉云黑，\n露冷莲房坠粉红[4]。\n关塞极天惟鸟道，\n江湖满地一渔翁[5]。\n本篇写长安城昆明池盛衰变化，自伤漂泊江湖。这首诗以精丽的语言、生动的形象，在回忆昔日长安盛况的同时，抒发了自己旅居夔州欲归不得的感慨。诗的开头两句，借汉指唐，用想象中的威武场面颂扬了盛唐的强大。接下来四句的描写，似乎是写景，其实是对今日的荒凉冷落已是今非昔比的一种喟叹。因此结尾两句，不仅实写关塞险阻，而且含有政治上的艰难。所以诗人说自己是漂泊江湖的一个渔翁，暗喻自己漂泊无归宿，这样来表现自己处境的凄凉，形象而又真切。这首诗既抒发了忧国的情思，也感叹了自己可悲的命运。\n注释：\n[1]昆明池：遗址在今陕西省西安市西南斗门镇一带，汉武帝所建。\n[2]武帝：此处代指唐玄宗。\n[3]菰（ɡū）：即茭白，生在浅水中的草本植物。\n[4]坠粉红：形容莲蓬成熟后，花瓣坠落的样子。\n[5]渔翁：杜甫自比。", "english": "Reflections in Autumn\n(VII)\nThe Kunming Lake reminds us of the glorious day.\nBut Emperor Wu's flags cannot forever sway.\nThe Weaving Maiden seems to weave night with moonbeams,\nThe stone whale would exhale autumn breeze from its scale.\nWild seeds float on the waves as clouds darken the sky;\nCold dew chills lotus blooms falling in rosy dye.\nWe can go by a narrow path to the frontier,\nI'd be a fisher to whom stream and lake are dear.", "poemType": "七言古诗", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">秋兴<br>（八首其七）<br>昆明池<sup class=\"note-ref\">[1]</sup>水汉时功，<br>武帝<sup class=\"note-ref\">[2]</sup>旌旗在眼中。<br>织女机丝虚夜月，<br>石鲸鳞甲动秋风。<br>波漂菰<sup class=\"note-ref\">[3]</sup>米沉云黑，<br>露冷莲房坠粉红<sup class=\"note-ref\">[4]</sup>。<br>关塞极天惟鸟道，<br>江湖满地一渔翁<sup class=\"note-ref\">[5]</sup>。</p>\n<p class=\"prose\">本篇写长安城昆明池盛衰变化，自伤漂泊江湖。这首诗以精丽的语言、生动的形象，在回忆昔日长安盛况的同时，抒发了自己旅居夔州欲归不得的感慨。诗的开头两句，借汉指唐，用想象中的威武场面颂扬了盛唐的强大。接下来四句的描写，似乎是写景，其实是对今日的荒凉冷落已是今非昔比的一种喟叹。</p>\n<p class=\"prose\">因此结尾两句，不仅实写关塞险阻，而且含有政治上的艰难。所以诗人说自己是漂泊江湖的一个渔翁，暗喻自己漂泊无归宿，这样来表现自己处境的凄凉，形象而又真切。这首诗既抒发了忧国的情思，也感叹了自己可悲的命运。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]昆明池：遗址在今陕西省西安市西南斗门镇一带，汉武帝所建。<br>[2]武帝：此处代指唐玄宗。<br>[3]菰（ɡū）：即茭白，生在浅水中的草本植物。<br>[4]坠粉红：形容莲蓬成熟后，花瓣坠落的样子。<br>[5]渔翁：杜甫自比。</p>", "englishHtml": "<p class=\"poem-lines\">Reflections in Autumn</p>\n<p class=\"stanza-marker\">(VII)</p>\n<p class=\"poem-lines\">The Kunming Lake reminds us of the glorious day.<br>But Emperor Wu&#x27;s flags cannot forever sway.<br>The Weaving Maiden seems to weave night with moonbeams,<br>The stone whale would exhale autumn breeze from its scale.<br>Wild seeds float on the waves as clouds darken the sky;<br>Cold dew chills lotus blooms falling in rosy dye.<br>We can go by a narrow path to the frontier,<br>I&#x27;d be a fisher to whom stream and lake are dear.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reflections in Autumn ( VII ),” the poem places personal feeling against the vastness of the frontier, so distance and danger become part of its force.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it sets Du Fu&#x27;s energetic voice against open space, travel, and danger. Key images such as water, moonlight, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "084", "zhTitle": "秋兴 （八首其八）", "enTitle": "Reflections in Autumn ( VIII )", "chinese": "秋兴\n（八首其八）\n昆吾御宿自逶迤[1]，\n紫阁峰阴入渼陂[2]。\n香稻啄余鹦鹉粒，\n碧梧栖老凤凰枝。\n佳人拾翠[3]春相问[4]，\n仙侣[5]同舟晚更移[6]。\n彩笔昔曾干气象，\n白头吟望苦低垂。\n此诗回想昔日在长安畅游渼陂之情境，慨叹青春献赋之豪情不再。诗人回忆在长安时与友人同游渼陂，首联即忆行踪，从长安出发，经过昆吾、御宿两地，再沿紫阁峰北面的山路而达于渼陂。颔联以写渼陂物产之丰，以及景色之美。颈联记渼陂泛舟的盛事。结尾以当年才华横溢反衬今日才思枯竭，言外有无穷感慨。诗人在盛衰今昔的巨大背景和心理反差中，不仅对唐王朝盛衰引起哲理性思考，更感到人生变幻无常，追忆昔日的风光之余，只能“白头吟望苦低垂”而已，通过强烈对比，表达对昔日如梦繁华的深沉缅怀，并抒发对盛衰交替，盛世难再的愁苦无奈。\n注释：\n[1]逶迤（wēi yí）：道路、河道等弯且长的样子。\n[2]渼陂：湖泊名，位于今位于陕西省西安市鄠邑区涝河西畔。\n[3]拾翠：拾起翠鸟羽毛。\n[4]相问：互赠礼物。\n[5]仙侣：好伴侣。\n[6]晚更移：指天色已晚，要乘船前往别处尽兴游玩。", "english": "Reflections in Autumn\n(VIII)\nTo Royal Residence it is a winding way,\nThe purple peaks cast on the lake their shadows gray.\nParrots can't peck up all the grains left on the plain;\nPhoenix when old on the plane tree will still remain.\nFair maidens gather vernal flowers with sweet smiles;\nBoating with immortals would shorten evening miles.\nWhile young, I had a magic brush to paint the scene.\nWhat can I do now my age is no longer green?", "poemType": "七言古诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">秋兴<br>（八首其八）<br>昆吾御宿自逶迤<sup class=\"note-ref\">[1]</sup>，<br>紫阁峰阴入渼陂<sup class=\"note-ref\">[2]</sup>。<br>香稻啄余鹦鹉粒，<br>碧梧栖老凤凰枝。<br>佳人拾翠<sup class=\"note-ref\">[3]</sup>春相问<sup class=\"note-ref\">[4]</sup>，<br>仙侣<sup class=\"note-ref\">[5]</sup>同舟晚更移<sup class=\"note-ref\">[6]</sup>。<br>彩笔昔曾干气象，<br>白头吟望苦低垂。</p>\n<p class=\"prose\">此诗回想昔日在长安畅游渼陂之情境，慨叹青春献赋之豪情不再。诗人回忆在长安时与友人同游渼陂，首联即忆行踪，从长安出发，经过昆吾、御宿两地，再沿紫阁峰北面的山路而达于渼陂。颔联以写渼陂物产之丰，以及景色之美。颈联记渼陂泛舟的盛事。</p>\n<p class=\"prose\">结尾以当年才华横溢反衬今日才思枯竭，言外有无穷感慨。诗人在盛衰今昔的巨大背景和心理反差中，不仅对唐王朝盛衰引起哲理性思考，更感到人生变幻无常，追忆昔日的风光之余，只能“白头吟望苦低垂”而已，通过强烈对比，表达对昔日如梦繁华的深沉缅怀，并抒发对盛衰交替，盛世难再的愁苦无奈。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]逶迤（wēi yí）：道路、河道等弯且长的样子。<br>[2]渼陂：湖泊名，位于今位于陕西省西安市鄠邑区涝河西畔。<br>[3]拾翠：拾起翠鸟羽毛。<br>[4]相问：互赠礼物。<br>[5]仙侣：好伴侣。<br>[6]晚更移：指天色已晚，要乘船前往别处尽兴游玩。</p>", "englishHtml": "<p class=\"poem-lines\">Reflections in Autumn</p>\n<p class=\"stanza-marker\">(VIII)</p>\n<p class=\"poem-lines\">To Royal Residence it is a winding way,<br>The purple peaks cast on the lake their shadows gray.<br>Parrots can&#x27;t peck up all the grains left on the plain;<br>Phoenix when old on the plane tree will still remain.<br>Fair maidens gather vernal flowers with sweet smiles;<br>Boating with immortals would shorten evening miles.<br>While young, I had a magic brush to paint the scene.<br>What can I do now my age is no longer green?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reflections in Autumn ( VIII ),” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "085", "zhTitle": "咏怀古迹 （五首其三）", "enTitle": "Thoughts on a Historic Site ( III )", "chinese": "咏怀古迹\n（五首其三）\n群山万壑赴荆门，\n生长明妃[1]尚有村。\n一去紫台[2]连朔漠，\n独留青冢[3]向黄昏。\n画图省[4]识春风面[5]，\n环佩空归月夜魂。\n千载琵琶作胡语，\n分明怨恨曲中论。\n《咏怀古迹》也是公元766年杜甫旅居夔州时的作品，共五首，这里选的是第三首。诗人从三峡西头的白帝城向东远望，只见群山起伏如波涛滚滚奔向荆门的昭君村。但是村在人亡，昭君早已离开紫禁城去了无边无际的北方沙漠，现在只剩下孤零零的青冢，对着笼罩四野的黄昏。假如当年画师画出了她的青春美貌，就不至于月夜思念亲人，孤魂在环佩声中不远千里回到故园了。1000年来琵琶奏出的哀曲，都是昭君在诉说她的怨情。当时杜甫也远离故乡，欲归不得，和昭君的境遇有相似之处，所以就借他人的酒杯，浇自己的块垒了。昭君身行万里，冢留千秋，心与祖国同在，名随诗乐长存，她的悲剧在读者心中留下了难以磨灭的印象。\n注释：\n[1]明妃：指王昭君。\n[2]紫台：汉宫，宫廷。\n[3]青冢：指王昭君的坟墓。\n[4]省（xǐnɡ）识：老相识。\n[5]春风面：形容王昭君的美貌。", "english": "Thoughts on a Historic Site\n(III)\nAll mountains rise and fall till they reach Thatched Gate,\n’Tis the home village where was born the Lady Bright.\nShe left the palace for the desert desolate,\nHer lonely tomb still green is left to face twilight.\nNo picture could portray her face as fair as spring's,\nIn vain her roving soul returned beneath the moon.\nThe pipa's sighed for ages on Tartarian strings,\nWe can discern her bitter grief in its sad tune.", "poemType": "七言古诗", "poemTheme": "咏史怀古", "chineseHtml": "<p class=\"poem-lines\">咏怀古迹<br>（五首其三）<br>群山万壑赴荆门，<br>生长明妃<sup class=\"note-ref\">[1]</sup>尚有村。<br>一去紫台<sup class=\"note-ref\">[2]</sup>连朔漠，<br>独留青冢<sup class=\"note-ref\">[3]</sup>向黄昏。<br>画图省<sup class=\"note-ref\">[4]</sup>识春风面<sup class=\"note-ref\">[5]</sup>，<br>环佩空归月夜魂。<br>千载琵琶作胡语，<br>分明怨恨曲中论。</p>\n<p class=\"prose\">《咏怀古迹》也是公元766年杜甫旅居夔州时的作品，共五首，这里选的是第三首。诗人从三峡西头的白帝城向东远望，只见群山起伏如波涛滚滚奔向荆门的昭君村。但是村在人亡，昭君早已离开紫禁城去了无边无际的北方沙漠，现在只剩下孤零零的青冢，对着笼罩四野的黄昏。</p>\n<p class=\"prose\">假如当年画师画出了她的青春美貌，就不至于月夜思念亲人，孤魂在环佩声中不远千里回到故园了。1000年来琵琶奏出的哀曲，都是昭君在诉说她的怨情。当时杜甫也远离故乡，欲归不得，和昭君的境遇有相似之处，所以就借他人的酒杯，浇自己的块垒了。</p>\n<p class=\"prose\">昭君身行万里，冢留千秋，心与祖国同在，名随诗乐长存，她的悲剧在读者心中留下了难以磨灭的印象。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]明妃：指王昭君。<br>[2]紫台：汉宫，宫廷。<br>[3]青冢：指王昭君的坟墓。<br>[4]省（xǐnɡ）识：老相识。<br>[5]春风面：形容王昭君的美貌。</p>", "englishHtml": "<p class=\"poem-lines\">Thoughts on a Historic Site</p>\n<p class=\"stanza-marker\">(III)</p>\n<p class=\"poem-lines\">All mountains rise and fall till they reach Thatched Gate,<br>’Tis the home village where was born the Lady Bright.<br>She left the palace for the desert desolate,<br>Her lonely tomb still green is left to face twilight.<br>No picture could portray her face as fair as spring&#x27;s,<br>In vain her roving soul returned beneath the moon.<br>The pipa&#x27;s sighed for ages on Tartarian strings,<br>We can discern her bitter grief in its sad tune.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Thoughts on a Historic Site ( III ),” the poem looks back at history, using the past to intensify the speaker&#x27;s present emotion.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it uses historical distance to make ambition and loss feel more dramatic. Key images such as mountains, moonlight, frontier scenes, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "086", "zhTitle": "阁夜", "enTitle": "Night in My Bower", "chinese": "岁暮阴阳催短景，\n天涯霜雪霁[1]寒宵。\n五更鼓角声悲壮，\n三峡星河影动摇。\n野哭[2]千家闻战伐[3]，\n夷歌数处起渔樵。\n卧龙跃马终黄土，\n人事音书[4]漫[5]寂寥。\n公元766年，杜甫旅居夔州西阁，写了这首《阁夜》。开始两句点明时间，“岁暮”指冬天，“阴阳”指日月，“短景”指冬天日短，“催”字使人觉得岁月催人老。第二句的“天涯”指夔州，霜雪方停，寒光明朗如昼，对此夜景，诗人不禁感慨万千。第三、四句写五更时分，鼓角之声分外悲壮；天上银河映照在峡江中，摇曳不定，衬托着诗人深沉的情怀。第五、六句加重写所闻，一听说征伐之事，立刻引起千家恸哭，这是时代的哭声；江边林中，又传来了渔歌和樵唱，这是地方的歌声。诗人极目远望，看到西郊的武侯祠和东南的白帝庙，想起诸葛亮和“跃马而称帝”的公孙述，都是一世之雄，而今安在？自己没有得到亲友音书，感到寂寥，相形之下，算得了什么呢！这首诗从当前现实写到千年陈迹，气象雄阔，仿佛把宇宙纳入毫端，有上天下地、俯仰古今之概。\n注释：\n[1]霁（jì）：雨雪停。\n[2]野哭：形容哭声遍野。\n[3]战伐：崔旰（ɡàn）之乱。《资治通鉴·唐纪四十·代宗永泰元年》有：“（崔旰）于是帅所部五千余人袭成都。辛巳，战于城西，英大败。旰遂入成都，屠英家。英又单骑奔简州。普州刺史韩澄杀英，送首于旰。邛州牙将柏茂琳、泸州牙将杨子琳、剑州牙将李昌（náo），各举兵讨旰，蜀中大乱。”\n[4]音书：亲友间的音讯，书信等。\n[5]漫：徒然，白白地。", "english": "By the year's end the day grows short to lengthen night,\nI'm far from home where snow and frost turn the earth white.\nI hear drear horns and drums announce the dawning day,\nMirrored in the Three Gorges, shivers the Milky Way.\nThousands of rural homes weep to know war prolong,\nWhere can woodsmen and fishermen sing their folk song?\nPremier and Emperor were buried underground.\nWhat matters if we live lonely or safe and sound?", "poemType": "七言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">岁暮阴阳催短景，<br>天涯霜雪霁<sup class=\"note-ref\">[1]</sup>寒宵。<br>五更鼓角声悲壮，<br>三峡星河影动摇。<br>野哭<sup class=\"note-ref\">[2]</sup>千家闻战伐<sup class=\"note-ref\">[3]</sup>，<br>夷歌数处起渔樵。<br>卧龙跃马终黄土，<br>人事音书<sup class=\"note-ref\">[4]</sup>漫<sup class=\"note-ref\">[5]</sup>寂寥。</p>\n<p class=\"prose\">公元766年，杜甫旅居夔州西阁，写了这首《阁夜》。开始两句点明时间，“岁暮”指冬天，“阴阳”指日月，“短景”指冬天日短，“催”字使人觉得岁月催人老。第二句的“天涯”指夔州，霜雪方停，寒光明朗如昼，对此夜景，诗人不禁感慨万千。</p>\n<p class=\"prose\">第三、四句写五更时分，鼓角之声分外悲壮；天上银河映照在峡江中，摇曳不定，衬托着诗人深沉的情怀。第五、六句加重写所闻，一听说征伐之事，立刻引起千家恸哭，这是时代的哭声；江边林中，又传来了渔歌和樵唱，这是地方的歌声。诗人极目远望，看到西郊的武侯祠和东南的白帝庙，想起诸葛亮和“跃马而称帝”的公孙述，都是一世之雄，而今安在？</p>\n<p class=\"prose\">自己没有得到亲友音书，感到寂寥，相形之下，算得了什么呢！这首诗从当前现实写到千年陈迹，气象雄阔，仿佛把宇宙纳入毫端，有上天下地、俯仰古今之概。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]霁（jì）：雨雪停。<br>[2]野哭：形容哭声遍野。<br>[3]战伐：崔旰（ɡàn）之乱。《资治通鉴·唐纪四十·代宗永泰元年》有：“（崔旰）于是帅所部五千余人袭成都。辛巳，战于城西，英大败。旰遂入成都，屠英家。英又单骑奔简州。普州刺史韩澄杀英，送首于旰。邛州牙将柏茂琳、泸州牙将杨子琳、剑州牙将李昌（náo），各举兵讨旰，蜀中大乱。”<br>[4]音书：亲友间的音讯，书信等。<br>[5]漫：徒然，白白地。</p>", "englishHtml": "<p class=\"poem-lines\">By the year&#x27;s end the day grows short to lengthen night,<br>I&#x27;m far from home where snow and frost turn the earth white.<br>I hear drear horns and drums announce the dawning day,<br>Mirrored in the Three Gorges, shivers the Milky Way.<br>Thousands of rural homes weep to know war prolong,<br>Where can woodsmen and fishermen sing their folk song?<br>Premier and Emperor were buried underground.<br>What matters if we live lonely or safe and sound?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Night in My Bower,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, homecoming, and war and displacement give the poem its visual texture and emotional temperature.</p>"}, {"num": "087", "zhTitle": "孤雁", "enTitle": "A Lonely Swan", "chinese": "孤雁不饮啄[1]，\n飞鸣声念群。\n谁怜一片影，\n相失万重云[2]？\n望尽[3]似犹见，\n哀多如更闻。\n野鸦无意绪，\n鸣噪[4]自纷纷。\n《孤雁》作于公元765年杜甫旅居夔州期间。诗人晚年多病，故交零落，处境艰难，心中充满失意之感和哀伤之情。这首《孤雁》，表达的就是乱离漂泊中孤独之人的痛苦心情。开篇即唤出“孤雁”，不饮，不啄，只是不断追寻，寻找它的同伴。孤雁还有诗人怜惜，形单影只如同孤雁的诗人又有谁来怜惜呢？诗人与孤雁，浑然一体。清人朱鹤龄评注这首诗说：“此托孤雁以念兄弟也”，不只是兄弟，诗人念的还包括了解他懂得他的知音朋友。第三联紧承上联，望断天涯路，仿佛同伴依稀可辨，于是它更要不停地追飞，不停地呼唤了，这两句字字血泪，情深意切，哀痛欲绝。它的心情是那么迫切，而野鸦却全然不懂，“无意绪”是孤雁对着野鸦时的心情，也是杜甫既不能与知己亲朋相见，又要面对着一些俗客庸夫时厌恶无聊的心绪。诗人用诚挚而热烈的感情，书写了忠贞之鸟的赞歌，也是诗人对自己准则的宣扬。\n注释：\n[1]饮啄：鸟喝水和觅食。\n[2]万重云：形容云海茫茫。\n[3]望尽：望到天尽头。\n[4]鸣噪：野鸦啼叫。", "english": "A lonely swan cares not for what it drinks\nSinging all the way, for the flock it thinks.\nWho will pity its lonely shadow far\nAway from the flock as cloud from a star?\nIt still remains in view though lost to sight,\nIts sorrow can be heard in its long flight.\nUnlike the insensible duck or crow\nMaking loud noises in weal as in woe.", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">孤雁不饮啄<sup class=\"note-ref\">[1]</sup>，<br>飞鸣声念群。<br>谁怜一片影，<br>相失万重云<sup class=\"note-ref\">[2]</sup>？<br>望尽<sup class=\"note-ref\">[3]</sup>似犹见，<br>哀多如更闻。<br>野鸦无意绪，<br>鸣噪<sup class=\"note-ref\">[4]</sup>自纷纷。</p>\n<p class=\"prose\">《孤雁》作于公元765年杜甫旅居夔州期间。诗人晚年多病，故交零落，处境艰难，心中充满失意之感和哀伤之情。这首《孤雁》，表达的就是乱离漂泊中孤独之人的痛苦心情。开篇即唤出“孤雁”，不饮，不啄，只是不断追寻，寻找它的同伴。孤雁还有诗人怜惜，形单影只如同孤雁的诗人又有谁来怜惜呢？</p>\n<p class=\"prose\">诗人与孤雁，浑然一体。清人朱鹤龄评注这首诗说：“此托孤雁以念兄弟也”，不只是兄弟，诗人念的还包括了解他懂得他的知音朋友。第三联紧承上联，望断天涯路，仿佛同伴依稀可辨，于是它更要不停地追飞，不停地呼唤了，这两句字字血泪，情深意切，哀痛欲绝。</p>\n<p class=\"prose\">它的心情是那么迫切，而野鸦却全然不懂，“无意绪”是孤雁对着野鸦时的心情，也是杜甫既不能与知己亲朋相见，又要面对着一些俗客庸夫时厌恶无聊的心绪。诗人用诚挚而热烈的感情，书写了忠贞之鸟的赞歌，也是诗人对自己准则的宣扬。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]饮啄：鸟喝水和觅食。<br>[2]万重云：形容云海茫茫。<br>[3]望尽：望到天尽头。<br>[4]鸣噪：野鸦啼叫。</p>", "englishHtml": "<p class=\"poem-lines\">A lonely swan cares not for what it drinks<br>Singing all the way, for the flock it thinks.<br>Who will pity its lonely shadow far<br>Away from the flock as cloud from a star?<br>It still remains in view though lost to sight,<br>Its sorrow can be heard in its long flight.<br>Unlike the insensible duck or crow<br>Making loud noises in weal as in woe.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Lonely Swan,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as clouds and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "088", "zhTitle": "又呈吴郎", "enTitle": "For the Tenant of My Thatched Hall", "chinese": "堂前扑枣[1]任西邻，\n无食无儿一妇人。\n不为[2]困穷宁有此？\n只缘[3]恐惧转须亲[4]。\n即防远客虽多事，\n便插疏篱[5]却甚真。\n已诉征求贫到骨，\n正思戎马泪盈巾。\n公元767年，杜甫住在瀼西的草堂里。草堂前有几棵枣树，西邻的一个寡妇常来打枣，杜甫从不干涉。后来，杜甫把草堂让给一位姓吴的亲戚，他自己搬到离草堂十几里路远的东屯去。不料这姓吴的一来就在草堂插上篱笆，禁止打枣。寡妇向杜甫诉苦，杜甫便写此诗去劝告吴郎。吴郎的年辈要比杜甫小，而诗人有意地用了“呈”这个不大相称的敬词，这是让吴郎易于接受。全诗措词十分委婉含蓄，因为诗人希望吴郎接收劝告。说明诗人十分同情体谅穷苦人的处境。在这种委婉曲折中，诗人联想到国家大局，以至流下热泪。这首诗作表达了杜甫对穷困人民的深切同情。\n注释：\n[1]扑枣：把枣子打落下来。\n[2]不为：如果不是，若非。\n[3]只缘：正因为。\n[4]转须亲：反而更应该亲近她。\n[5]插疏篱：稀稀疏疏地修建了一些篱笆。", "english": "Let your west neighbor pick up dates before the hall!\nA sonless woman now in want of food and all.\nCould she pick dates if she were not poor to excess?\nYou should be kind to her to make her fear you less.\nShe might be over cautious to be kept away.\nWhy should you put up a fence in your neighbor's way?\nStricken to the bones, so pitiable she appears.\nThinking of the war flames, how can I not shed tears!", "poemType": "七言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">堂前扑枣<sup class=\"note-ref\">[1]</sup>任西邻，<br>无食无儿一妇人。<br>不为<sup class=\"note-ref\">[2]</sup>困穷宁有此？<br>只缘<sup class=\"note-ref\">[3]</sup>恐惧转须亲<sup class=\"note-ref\">[4]</sup>。<br>即防远客虽多事，<br>便插疏篱<sup class=\"note-ref\">[5]</sup>却甚真。<br>已诉征求贫到骨，<br>正思戎马泪盈巾。</p>\n<p class=\"prose\">公元767年，杜甫住在瀼西的草堂里。草堂前有几棵枣树，西邻的一个寡妇常来打枣，杜甫从不干涉。后来，杜甫把草堂让给一位姓吴的亲戚，他自己搬到离草堂十几里路远的东屯去。不料这姓吴的一来就在草堂插上篱笆，禁止打枣。寡妇向杜甫诉苦，杜甫便写此诗去劝告吴郎。</p>\n<p class=\"prose\">吴郎的年辈要比杜甫小，而诗人有意地用了“呈”这个不大相称的敬词，这是让吴郎易于接受。全诗措词十分委婉含蓄，因为诗人希望吴郎接收劝告。说明诗人十分同情体谅穷苦人的处境。在这种委婉曲折中，诗人联想到国家大局，以至流下热泪。这首诗作表达了杜甫对穷困人民的深切同情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]扑枣：把枣子打落下来。<br>[2]不为：如果不是，若非。<br>[3]只缘：正因为。<br>[4]转须亲：反而更应该亲近她。<br>[5]插疏篱：稀稀疏疏地修建了一些篱笆。</p>", "englishHtml": "<p class=\"poem-lines\">Let your west neighbor pick up dates before the hall!<br>A sonless woman now in want of food and all.<br>Could she pick dates if she were not poor to excess?<br>You should be kind to her to make her fear you less.<br>She might be over cautious to be kept away.<br>Why should you put up a fence in your neighbor&#x27;s way?<br>Stricken to the bones, so pitiable she appears.<br>Thinking of the war flames, how can I not shed tears!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For the Tenant of My Thatched Hall,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as homecoming and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "089", "zhTitle": "九日", "enTitle": "On Mountain-climbing Day", "chinese": "重阳独酌杯中酒，\n抱病[1]起登江上台。\n竹叶于人既无分，\n菊花从此不须开。\n殊方日落玄猿哭，\n旧国霜前白雁来。\n弟妹萧条各何在？\n干戈[2]衰谢两相催！\n公元767年重阳，杜甫在夔州登高，有此诗篇。重阳有登高怀远的风俗，诗人抱病前往，应是心中愁绪无法排解。因病戒酒，遂也无心赏菊，用带着较强烈主观情绪的诗句，加强情感表达，胸中不快之意呼之欲出。竹叶，即竹叶青，指代酒。颈联因景伤情，日落猿啼，似乎它们也有胸臆难平之事；白雁归来，尚能与家人团聚。这些，很自然地透露了诗人内心的情绪。尾联以佳节思亲作结，遥怜弟妹，寄托飘零寥落之感，叹息岁月已经催人老，又何苦再以干戈摧残。\n注释：\n[1]抱病：生病，带病。\n[2]干戈：战争。", "english": "I drink my wine alone on Mountain-climbing Day,\nThough ill, I go up riverside tower and stay.\nI cannot drink wine made out of bamboo's green leaves;\nChrysanthemums not in full bloom, I think none grieves.\nBut black apes wail at sunset in a foreign land;\nWhite swans will come before the frost without command.\nWhere are my homesick younger brothers and sisters dear?\nWar flames afar and nearing old age make me drear.", "poemType": "七言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">重阳独酌杯中酒，<br>抱病<sup class=\"note-ref\">[1]</sup>起登江上台。<br>竹叶于人既无分，<br>菊花从此不须开。<br>殊方日落玄猿哭，<br>旧国霜前白雁来。<br>弟妹萧条各何在？<br>干戈<sup class=\"note-ref\">[2]</sup>衰谢两相催！</p>\n<p class=\"prose\">公元767年重阳，杜甫在夔州登高，有此诗篇。重阳有登高怀远的风俗，诗人抱病前往，应是心中愁绪无法排解。因病戒酒，遂也无心赏菊，用带着较强烈主观情绪的诗句，加强情感表达，胸中不快之意呼之欲出。竹叶，即竹叶青，指代酒。颈联因景伤情，日落猿啼，似乎它们也有胸臆难平之事；</p>\n<p class=\"prose\">白雁归来，尚能与家人团聚。这些，很自然地透露了诗人内心的情绪。尾联以佳节思亲作结，遥怜弟妹，寄托飘零寥落之感，叹息岁月已经催人老，又何苦再以干戈摧残。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]抱病：生病，带病。<br>[2]干戈：战争。</p>", "englishHtml": "<p class=\"poem-lines\">I drink my wine alone on Mountain-climbing Day,<br>Though ill, I go up riverside tower and stay.<br>I cannot drink wine made out of bamboo&#x27;s green leaves;<br>Chrysanthemums not in full bloom, I think none grieves.<br>But black apes wail at sunset in a foreign land;<br>White swans will come before the frost without command.<br>Where are my homesick younger brothers and sisters dear?<br>War flames afar and nearing old age make me drear.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On Mountain-climbing Day,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, flowers, birds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "090", "zhTitle": "登高", "enTitle": "On the Height", "chinese": "风急天高猿啸哀[1]，\n渚[2]清沙白鸟飞回。\n无边落木萧萧[3]下，\n不尽长江滚滚来。\n万里悲秋常作客，\n百年多病独登台。\n艰难苦恨繁[4]霜鬓[5]，\n潦倒新停浊酒杯。\n《登高》是杜甫于公元767年秋天在夔州时所写的杰作，被誉为古今七言律诗之冠。诗的前半写景，后半抒情。第一联刻画眼前具体景物，形声色态，一一得到表现，天风沙渚，自然成对。不但上下两句对，而且还有句中自对，如上句“天”对“风”、“高”对“急”，下句“沙”对“渚”、“白”对“清”，读来富有节奏感。第二联表现了夔州秋天的典型特征。诗人仰望茫无边际、萧萧而下的木叶，俯视奔流不息、滚滚而来的江水，抒发了韶光易逝、壮志难酬的感慨，把眼前景和心中情紧密地联系起来了。第三联写诗人漂泊无定的生涯，沦落他乡、年老多病的处境，产生了无限悲愁的情绪。这种情绪从空间（万里悲秋）和时间（百年多病）两方面来表达，诗意显得更加深沉。最后一联作结，诗人备尝艰难潦倒之苦，白发日多，加上因病断酒，悲愁就更难排遣。这种悲愁就像江水和落叶一样，无穷无尽，无边无际，仿佛充塞宇宙，要使万物同声一哭了。古人认为这诗不止“全篇可法”，而且“用句用字”“皆古今人必不敢道，决不能道者”，所以是当之无愧的“旷代之作”。\n注释：\n[1]哀：忧愁。\n[2]渚（zhǔ）：水中的小片陆地。\n[3]萧萧：类似风吹动树叶的声音。\n[4]繁：增多。\n[5]霜鬓：白发。", "english": "The wind so swift, the sky so wide, apes wail and cry;\nWater so clear and beach so white, birds wheel and fly.\nThe boundless forest sheds its leaves shower by shower;\nThe endless river rolls its waves hour after hour.\nA thousand miles from home, I'm grieved at autumn's plight;\nIll now and then for years, alone I'm on this height.\nLiving in times so hard, at frosted hair I pine;\nCast down by poverty, I have to give up wine.", "poemType": "七言律诗", "poemTheme": "登临抒怀", "chineseHtml": "<p class=\"poem-lines\">风急天高猿啸哀<sup class=\"note-ref\">[1]</sup>，<br>渚<sup class=\"note-ref\">[2]</sup>清沙白鸟飞回。<br>无边落木萧萧<sup class=\"note-ref\">[3]</sup>下，<br>不尽长江滚滚来。<br>万里悲秋常作客，<br>百年多病独登台。<br>艰难苦恨繁<sup class=\"note-ref\">[4]</sup>霜鬓<sup class=\"note-ref\">[5]</sup>，<br>潦倒新停浊酒杯。</p>\n<p class=\"prose\">《登高》是杜甫于公元767年秋天在夔州时所写的杰作，被誉为古今七言律诗之冠。诗的前半写景，后半抒情。第一联刻画眼前具体景物，形声色态，一一得到表现，天风沙渚，自然成对。不但上下两句对，而且还有句中自对，如上句“天”对“风”、“高”对“急”，下句“沙”对“渚”、“白”对“清”，读来富有节奏感。</p>\n<p class=\"prose\">第二联表现了夔州秋天的典型特征。诗人仰望茫无边际、萧萧而下的木叶，俯视奔流不息、滚滚而来的江水，抒发了韶光易逝、壮志难酬的感慨，把眼前景和心中情紧密地联系起来了。第三联写诗人漂泊无定的生涯，沦落他乡、年老多病的处境，产生了无限悲愁的情绪。</p>\n<p class=\"prose\">这种情绪从空间（万里悲秋）和时间（百年多病）两方面来表达，诗意显得更加深沉。最后一联作结，诗人备尝艰难潦倒之苦，白发日多，加上因病断酒，悲愁就更难排遣。这种悲愁就像江水和落叶一样，无穷无尽，无边无际，仿佛充塞宇宙，要使万物同声一哭了。</p>\n<p class=\"prose\">古人认为这诗不止“全篇可法”，而且“用句用字”“皆古今人必不敢道，决不能道者”，所以是当之无愧的“旷代之作”。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]哀：忧愁。<br>[2]渚（zhǔ）：水中的小片陆地。<br>[3]萧萧：类似风吹动树叶的声音。<br>[4]繁：增多。<br>[5]霜鬓：白发。</p>", "englishHtml": "<p class=\"poem-lines\">The wind so swift, the sky so wide, apes wail and cry;<br>Water so clear and beach so white, birds wheel and fly.<br>The boundless forest sheds its leaves shower by shower;<br>The endless river rolls its waves hour after hour.<br>A thousand miles from home, I&#x27;m grieved at autumn&#x27;s plight;<br>Ill now and then for years, alone I&#x27;m on this height.<br>Living in times so hard, at frosted hair I pine;<br>Cast down by poverty, I have to give up wine.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On the Height,” the poem uses the act of looking from a height to enlarge both the landscape and the speaker&#x27;s inner pressure.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, birds, wine, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "091", "zhTitle": "漫成一首", "enTitle": "Mooring at Night", "chinese": "江月去人只数尺，\n风灯[1]照夜欲三更。\n沙头宿鹭联拳静，\n船尾跳鱼拨剌[2]鸣。\n这首诗是公元766年杜甫流寓巴蜀时期，在从云安前往夔州的船上所作。诗写夜泊之景，一开篇便描画了一幅碧波荡漾、月影摇曳、江天一色的夜景图，营造出一种静谧的气氛。被微风吹动摇曳的灯火将夜照得朦胧，恍惚中看见白鹭蜷曲着身子，三五成群地栖息在沙滩上，那样安静恬适。船尾旁有鱼跃出水面，暂时打破了这宁静，以声音结尾，有“蝉噪林逾静，鸟鸣山更幽”之妙。本诗平和静谧，生气灵动，可见诗人对自然与生命的热爱。\n注释：\n[1]风灯：防风的灯。\n[2]拨剌：象声词。指鱼尾拨动水的声音。", "english": "The moon in the river but a few feet away,\nThe lantern waits at midnight for the dawning day.\nOn the beach white egrets fall wing to wing in sleep,\nAstern a fish is heard out of water splash and leap.", "poemType": "七言绝句", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">江月去人只数尺，<br>风灯<sup class=\"note-ref\">[1]</sup>照夜欲三更。<br>沙头宿鹭联拳静，<br>船尾跳鱼拨剌<sup class=\"note-ref\">[2]</sup>鸣。</p>\n<p class=\"prose\">这首诗是公元766年杜甫流寓巴蜀时期，在从云安前往夔州的船上所作。诗写夜泊之景，一开篇便描画了一幅碧波荡漾、月影摇曳、江天一色的夜景图，营造出一种静谧的气氛。被微风吹动摇曳的灯火将夜照得朦胧，恍惚中看见白鹭蜷曲着身子，三五成群地栖息在沙滩上，那样安静恬适。</p>\n<p class=\"prose\">船尾旁有鱼跃出水面，暂时打破了这宁静，以声音结尾，有“蝉噪林逾静，鸟鸣山更幽”之妙。本诗平和静谧，生气灵动，可见诗人对自然与生命的热爱。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]风灯：防风的灯。<br>[2]拨剌：象声词。指鱼尾拨动水的声音。</p>", "englishHtml": "<p class=\"poem-lines\">The moon in the river but a few feet away,<br>The lantern waits at midnight for the dawning day.<br>On the beach white egrets fall wing to wing in sleep,<br>Astern a fish is heard out of water splash and leap.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Mooring at Night,” the poem begins from a vivid object or scene and lets its energy expand into emotion.</p>\n<p class=\"commentary\">As a seven-character quatrain, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water, moonlight, and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "092", "zhTitle": "短歌行赠王郎司直", "enTitle": "For a Young Friend", "chinese": "王郎酒酣拔剑斫地[1]歌莫哀！\n我能拔尔抑塞[2]磊落之奇才。\n豫章翻风白日动，\n鲸鱼跋浪沧溟[3]开。\n且脱佩剑休徘徊[4]。\n西得诸侯棹[5]锦水，\n欲向何门趿[6]珠履？\n仲宣楼头春色深，\n青眼高歌望吾子。\n眼中之人吾老矣！\n这首诗作于公元768年，诗人到达江陵后的春末。上半首表达劝慰王郎之意。王郎在江陵不得志，趁着酒兴正浓，拔剑起舞，斫地悲歌，杜甫劝他不要悲哀。当时王郎正要西行入蜀，杜甫久居四川，表示可以替王郎推荐，所以说“我能拔尔”，把你这俊伟不凡的奇才从压抑苦闷中解脱出来，并盛赞王郎的杰出才能。下半首抒写送行之情。诗人说以王郎的奇才，此去西川，一定会得到高官的赏识，却不知要投在谁的门下。诗人对王郎青眼有加，故高歌寄予厚望，并叹道：你正值青春，前途不可限量，不像我，已经老了。抒发自己才不得施的无奈和悲凉，也含有劝诫王郎之意。\n注释：\n[1]斫（zhuó）地：砍地。\n[2]抑塞：郁闷，压抑。\n[3]沧溟（mínɡ）：大海。\n[4]休徘徊：不要犹豫不决。\n[5]棹（zhào）：划船的工具，此处泛指船。\n[6]趿（tà）：拖着鞋子。", "english": "My dear drunken young friend,\nYou draw your sword to strike the ground and sing your plaint.\nI can help you to end\nYour grief and develop your talent without restraint.\nYou are a giant tree on which sunbeams would quiver,\nOr a leviathan whale to make upsurge a river.\nSo why should you strike the ground with your sword and shiver?\nIf you go west to cross the River of Brocade,\nOn whose door would you lean and on whose balustrade?\nThe tower for talents is built in vernal hue,\nAll longing eyes are singing and waiting for you,\nBit in your eyes I'm an old man. What can I do?", "poemType": "乐府/古体", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">王郎酒酣拔剑斫地<sup class=\"note-ref\">[1]</sup>歌莫哀！<br>我能拔尔抑塞<sup class=\"note-ref\">[2]</sup>磊落之奇才。<br>豫章翻风白日动，<br>鲸鱼跋浪沧溟<sup class=\"note-ref\">[3]</sup>开。<br>且脱佩剑休徘徊<sup class=\"note-ref\">[4]</sup>。<br>西得诸侯棹<sup class=\"note-ref\">[5]</sup>锦水，<br>欲向何门趿<sup class=\"note-ref\">[6]</sup>珠履？<br>仲宣楼头春色深，<br>青眼高歌望吾子。<br>眼中之人吾老矣！</p>\n<p class=\"prose\">这首诗作于公元768年，诗人到达江陵后的春末。上半首表达劝慰王郎之意。王郎在江陵不得志，趁着酒兴正浓，拔剑起舞，斫地悲歌，杜甫劝他不要悲哀。当时王郎正要西行入蜀，杜甫久居四川，表示可以替王郎推荐，所以说“我能拔尔”，把你这俊伟不凡的奇才从压抑苦闷中解脱出来，并盛赞王郎的杰出才能。</p>\n<p class=\"prose\">下半首抒写送行之情。诗人说以王郎的奇才，此去西川，一定会得到高官的赏识，却不知要投在谁的门下。诗人对王郎青眼有加，故高歌寄予厚望，并叹道：你正值青春，前途不可限量，不像我，已经老了。抒发自己才不得施的无奈和悲凉，也含有劝诫王郎之意。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]斫（zhuó）地：砍地。<br>[2]抑塞：郁闷，压抑。<br>[3]沧溟（mínɡ）：大海。<br>[4]休徘徊：不要犹豫不决。<br>[5]棹（zhào）：划船的工具，此处泛指船。<br>[6]趿（tà）：拖着鞋子。</p>", "englishHtml": "<p class=\"poem-lines\">My dear drunken young friend,<br>You draw your sword to strike the ground and sing your plaint.<br>I can help you to end<br>Your grief and develop your talent without restraint.<br>You are a giant tree on which sunbeams would quiver,<br>Or a leviathan whale to make upsurge a river.<br>So why should you strike the ground with your sword and shiver?<br>If you go west to cross the River of Brocade,<br>On whose door would you lean and on whose balustrade?<br>The tower for talents is built in vernal hue,<br>All longing eyes are singing and waiting for you,<br>Bit in your eyes I&#x27;m an old man. What can I do?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For a Young Friend,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as water, wine, frontier scenes, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "093", "zhTitle": "江上", "enTitle": "On the River", "chinese": "江上日多雨，\n萧萧荆楚[1]秋。\n高风下木叶，\n永夜[2]揽貂裘。\n勋业[3]频看镜，\n行藏独倚楼。\n时危思报主，\n衰谢不能休。\n《金圣叹选批杜诗》中说：“《江上》乃是全题，盖身在江上，而心不忘魏阙也。”所谓魏阙，就是皇帝的京城。诗人看见江南多雨，潇潇洒洒，西风一吹，落叶纷纷，他通宵不眠，拥裘独坐，想到事业无成，揽镜自照，容颜已老，长年不为朝廷所用，只好凭栏远望，寄托报国之心。时局危难，自己虽然年事已高，还是欲罢不能，由此可以看出诗人忧国忧民的情怀。\n注释：\n[1]荆楚：今湖北省。\n[2]永夜：长夜。\n[3]勋业：功业。", "english": "Each day upon the river falls cold rain;\nThe southern land in autumn looks forlorn,\nThe high wind blows down withered leaves again;\nAll night long I sit in my furs outworn.\nNo deeds achieved, in mirror oft I frown;\nUnused for long, I lean on balustrade.\nAt this critical hour I'd serve the crown.\nThough feeble, can I give up and evade?", "poemType": "五言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">江上日多雨，<br>萧萧荆楚<sup class=\"note-ref\">[1]</sup>秋。<br>高风下木叶，<br>永夜<sup class=\"note-ref\">[2]</sup>揽貂裘。<br>勋业<sup class=\"note-ref\">[3]</sup>频看镜，<br>行藏独倚楼。<br>时危思报主，<br>衰谢不能休。</p>\n<p class=\"prose\">《金圣叹选批杜诗》中说：“《江上》乃是全题，盖身在江上，而心不忘魏阙也。”所谓魏阙，就是皇帝的京城。诗人看见江南多雨，潇潇洒洒，西风一吹，落叶纷纷，他通宵不眠，拥裘独坐，想到事业无成，揽镜自照，容颜已老，长年不为朝廷所用，只好凭栏远望，寄托报国之心。</p>\n<p class=\"prose\">时局危难，自己虽然年事已高，还是欲罢不能，由此可以看出诗人忧国忧民的情怀。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]荆楚：今湖北省。<br>[2]永夜：长夜。<br>[3]勋业：功业。</p>", "englishHtml": "<p class=\"poem-lines\">Each day upon the river falls cold rain;<br>The southern land in autumn looks forlorn,<br>The high wind blows down withered leaves again;<br>All night long I sit in my furs outworn.<br>No deeds achieved, in mirror oft I frown;<br>Unused for long, I lean on balustrade.<br>At this critical hour I&#x27;d serve the crown.<br>Though feeble, can I give up and evade?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On the River,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "094", "zhTitle": "江汉", "enTitle": "On River Han", "chinese": "江汉思归客，\n乾坤一腐儒[1]。\n片云天共远，\n永夜月同孤。\n落日[2]心犹壮，\n秋风病欲苏[3]。\n古来存[4]老马[5]，\n不必取长途。\n公元768年正月，杜甫自夔州出三峡，流寓江陵等地，写了《江汉》一诗。诗人思归而不能归，成了天涯沦落人。在天地之间，犹如白云一样遥远，仿佛夜月一样孤独。虽然到了夕阳晚境，但是心还未老；西风一起，病体反倒复苏了。他感到自己像识途的老马，尽管无力再走长途，但还是可供驱驰的。这首《江汉》抒发了诗人怀才见弃的不平之气和报国思用的怀抱，情景交融，有强烈的艺术感染力。\n注释：\n[1]腐儒：诗人的自称，自嘲。\n[2]落日：垂暮之年。\n[3]病欲苏：病快要康复。\n[4]存：留养。\n[5]老马：诗人自比。", "english": "On River Han my home thoughts fly,\nBookworm with worldly ways in fright.\nThe cloud and I share the vast sky;\nI'm lonely as the moon all night,\nMy heart won't sink with sinking sun;\nAutumn wind blows illness away.\nA jaded horse may not have done,\nThough it cannot go a long way.", "poemType": "五言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">江汉思归客，<br>乾坤一腐儒<sup class=\"note-ref\">[1]</sup>。<br>片云天共远，<br>永夜月同孤。<br>落日<sup class=\"note-ref\">[2]</sup>心犹壮，<br>秋风病欲苏<sup class=\"note-ref\">[3]</sup>。<br>古来存<sup class=\"note-ref\">[4]</sup>老马<sup class=\"note-ref\">[5]</sup>，<br>不必取长途。</p>\n<p class=\"prose\">公元768年正月，杜甫自夔州出三峡，流寓江陵等地，写了《江汉》一诗。诗人思归而不能归，成了天涯沦落人。在天地之间，犹如白云一样遥远，仿佛夜月一样孤独。虽然到了夕阳晚境，但是心还未老；西风一起，病体反倒复苏了。他感到自己像识途的老马，尽管无力再走长途，但还是可供驱驰的。</p>\n<p class=\"prose\">这首《江汉》抒发了诗人怀才见弃的不平之气和报国思用的怀抱，情景交融，有强烈的艺术感染力。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]腐儒：诗人的自称，自嘲。<br>[2]落日：垂暮之年。<br>[3]病欲苏：病快要康复。<br>[4]存：留养。<br>[5]老马：诗人自比。</p>", "englishHtml": "<p class=\"poem-lines\">On River Han my home thoughts fly,<br>Bookworm with worldly ways in fright.<br>The cloud and I share the vast sky;<br>I&#x27;m lonely as the moon all night,<br>My heart won&#x27;t sink with sinking sun;<br>Autumn wind blows illness away.<br>A jaded horse may not have done,<br>Though it cannot go a long way.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On River Han,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, moonlight, clouds, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "095", "zhTitle": "登岳阳楼", "enTitle": "On Yueyang Tower", "chinese": "昔[1]闻洞庭水，\n今上岳阳楼。\n吴楚东南坼[2]，\n乾坤日夜浮。\n亲朋无一字[3]，\n老病有孤舟。\n戎马关山北，\n凭轩[4]涕泗流。\n公元768年冬天，杜甫由湖北的江陵漂泊到湖南的岳州，写了《登岳阳楼》一诗。前半写景，说诗人早就听说洞庭湖乃天下胜境，但是直到晚年才登上岳阳楼。他看见广阔的湖水把古代吴国和楚国的疆界分开，日月星辰似乎都漂浮在水中。诗的后半述怀：亲友都没有音信，只有年老多病的诗人，泛着一叶扁舟，在江南漂流。眼看万里关山兵荒马乱，诗人只能倚着栏杆涕泗滂沱，声泪俱下。这首诗意境宽阔宏伟，前无古人，后无来者。\n注释：\n[1]昔：从前。\n[2]坼（chè）：分开。\n[3]无一字：没有书信。\n[4]凭轩：靠着窗户。", "english": "Long have I heard of Dongting Lake,\nNow I ascend the Yueyang Height.\nHere eastern state and southern break;\nHere sun and moon float day and night.\nNo word from friends or kinsfolk dear,\nA boat bears my declining years.\nWar's raging on the northern frontier,\nLeaning on rails, I shed sad tears.", "poemType": "五言律诗", "poemTheme": "登临抒怀", "chineseHtml": "<p class=\"poem-lines\">昔<sup class=\"note-ref\">[1]</sup>闻洞庭水，<br>今上岳阳楼。<br>吴楚东南坼<sup class=\"note-ref\">[2]</sup>，<br>乾坤日夜浮。<br>亲朋无一字<sup class=\"note-ref\">[3]</sup>，<br>老病有孤舟。<br>戎马关山北，<br>凭轩<sup class=\"note-ref\">[4]</sup>涕泗流。</p>\n<p class=\"prose\">公元768年冬天，杜甫由湖北的江陵漂泊到湖南的岳州，写了《登岳阳楼》一诗。前半写景，说诗人早就听说洞庭湖乃天下胜境，但是直到晚年才登上岳阳楼。他看见广阔的湖水把古代吴国和楚国的疆界分开，日月星辰似乎都漂浮在水中。诗的后半述怀：亲友都没有音信，只有年老多病的诗人，泛着一叶扁舟，在江南漂流。</p>\n<p class=\"prose\">眼看万里关山兵荒马乱，诗人只能倚着栏杆涕泗滂沱，声泪俱下。这首诗意境宽阔宏伟，前无古人，后无来者。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]昔：从前。<br>[2]坼（chè）：分开。<br>[3]无一字：没有书信。<br>[4]凭轩：靠着窗户。</p>", "englishHtml": "<p class=\"poem-lines\">Long have I heard of Dongting Lake,<br>Now I ascend the Yueyang Height.<br>Here eastern state and southern break;<br>Here sun and moon float day and night.<br>No word from friends or kinsfolk dear,<br>A boat bears my declining years.<br>War&#x27;s raging on the northern frontier,<br>Leaning on rails, I shed sad tears.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On Yueyang Tower,” the poem uses the act of looking from a height to enlarge both the landscape and the speaker&#x27;s inner pressure.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, water, frontier scenes, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "096", "zhTitle": "南征", "enTitle": "Journey to the South", "chinese": "春岸桃花水[1]，\n云帆[2]枫树林。\n偷生长避地[3]，\n适远更沾襟。\n老病南征日，\n君恩北望心。\n百年[4]歌自苦，\n未见有知音。\n公元769年春，杜甫在由岳阳往长沙的途中作此诗。首联描绘了明媚春光中，一幅美好的自然图景。然而诗人长年颠沛流离，远适南国的羁旅悲愁，更兼光景无多，前路漫漫，触景伤情，这美好春光竟也饱含离愁别绪。诗人北归不得，只能南下，但即使这样，诗人拳拳之心，仍思望报效朝廷。可叹命运弄人，诗人在“春华无人赏”的叹息中老去，却始终无人理解，这是诗人一生的悲剧。\n注释：\n[1]桃花水：形容春暖桃花盛开的时节的春潮。\n[2]云帆：白帆。\n[3]避地：前往异乡避难。\n[4]百年：一生。", "english": "Peach blossoms in full bloom by riverside,\nCloud-like sails pass by maples far and wide.\nTo earn a living I have to change place,\nComing from afar, tears stream on my face.\nOn southern journey, old and ill I sigh;\nLooking northward, I long for royal sky.\nWhy should I torture myself for so long?\nWhere is the connoisseur who knows my song?", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">春岸桃花水<sup class=\"note-ref\">[1]</sup>，<br>云帆<sup class=\"note-ref\">[2]</sup>枫树林。<br>偷生长避地<sup class=\"note-ref\">[3]</sup>，<br>适远更沾襟。<br>老病南征日，<br>君恩北望心。<br>百年<sup class=\"note-ref\">[4]</sup>歌自苦，<br>未见有知音。</p>\n<p class=\"prose\">公元769年春，杜甫在由岳阳往长沙的途中作此诗。首联描绘了明媚春光中，一幅美好的自然图景。然而诗人长年颠沛流离，远适南国的羁旅悲愁，更兼光景无多，前路漫漫，触景伤情，这美好春光竟也饱含离愁别绪。诗人北归不得，只能南下，但即使这样，诗人拳拳之心，仍思望报效朝廷。</p>\n<p class=\"prose\">可叹命运弄人，诗人在“春华无人赏”的叹息中老去，却始终无人理解，这是诗人一生的悲剧。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]桃花水：形容春暖桃花盛开的时节的春潮。<br>[2]云帆：白帆。<br>[3]避地：前往异乡避难。<br>[4]百年：一生。</p>", "englishHtml": "<p class=\"poem-lines\">Peach blossoms in full bloom by riverside,<br>Cloud-like sails pass by maples far and wide.<br>To earn a living I have to change place,<br>Coming from afar, tears stream on my face.<br>On southern journey, old and ill I sigh;<br>Looking northward, I long for royal sky.<br>Why should I torture myself for so long?<br>Where is the connoisseur who knows my song?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Journey to the South,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, clouds, flowers, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "097", "zhTitle": "小寒食舟中作", "enTitle": "Boating after Cold Food Day", "chinese": "佳辰强饮食犹寒，\n隐几萧条戴鹖冠。\n春水船如天上坐，\n老年花似雾中看。\n娟娟戏蝶过闲幔，\n片片轻鸥下急湍。\n云白山青万余里，\n愁看直北[2]是长安。\n公元770年寒食节后一天，杜甫在潭州（今长沙）淹留，写了这首《小寒食舟中作》。从寒食到清明三天禁火，诗人只能吃点冷食，勉强喝了点酒。他戴着隐士帽，百无聊赖地在舟中靠茶几坐着。看见春来水涨，江流浩漫，小舟漂荡起伏，犹如身在天上云间；老眼昏花，岸边花草看来如隔薄雾。舟中布幔闲卷，蝴蝶翩跹穿空而过；片片白鸥，轻快地逐流飞翔。作者思绪随着万里不断的云山远去，想到万方多难的长安，不禁忧愁涌上心头。这是杜甫在逝世前半年所作的一首情景交融的七言律诗。\n注释：\n[1]小寒食：指清明节的前一天。\n[2]直北：正北方。", "english": "I try to drink, but food's still cold on festive day;\nIn hermit's cap, at table, drear and bleak I stay.\nMy boat is drifting on above a mirrored sky,\nThe flowers look veiled in mist to wrinkled eye.\nThe listless curtains see butterflies dancing past;\nOver the rapids gulls on gulls are skimming fast.\nFor miles and miles outspread cloud on cloud, hill on hill,\nBut the imperial town lies farther northward still.", "poemType": "七言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">佳辰强饮食犹寒，<br>隐几萧条戴鹖冠。<br>春水船如天上坐，<br>老年花似雾中看。<br>娟娟戏蝶过闲幔，<br>片片轻鸥下急湍。<br>云白山青万余里，<br>愁看直北<sup class=\"note-ref\">[2]</sup>是长安。</p>\n<p class=\"prose\">公元770年寒食节后一天，杜甫在潭州（今长沙）淹留，写了这首《小寒食舟中作》。从寒食到清明三天禁火，诗人只能吃点冷食，勉强喝了点酒。他戴着隐士帽，百无聊赖地在舟中靠茶几坐着。看见春来水涨，江流浩漫，小舟漂荡起伏，犹如身在天上云间；</p>\n<p class=\"prose\">老眼昏花，岸边花草看来如隔薄雾。舟中布幔闲卷，蝴蝶翩跹穿空而过；片片白鸥，轻快地逐流飞翔。作者思绪随着万里不断的云山远去，想到万方多难的长安，不禁忧愁涌上心头。这是杜甫在逝世前半年所作的一首情景交融的七言律诗。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]小寒食：指清明节的前一天。<br>[2]直北：正北方。</p>", "englishHtml": "<p class=\"poem-lines\">I try to drink, but food&#x27;s still cold on festive day;<br>In hermit&#x27;s cap, at table, drear and bleak I stay.<br>My boat is drifting on above a mirrored sky,<br>The flowers look veiled in mist to wrinkled eye.<br>The listless curtains see butterflies dancing past;<br>Over the rapids gulls on gulls are skimming fast.<br>For miles and miles outspread cloud on cloud, hill on hill,<br>But the imperial town lies farther northward still.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Boating after Cold Food Day,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as mountains, water, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "098", "zhTitle": "发潭州", "enTitle": "Departure from Changsha", "chinese": "夜醉长沙酒，\n晓行湘水[2]春。\n岸花飞送客，\n樯燕[3]语留人。\n贾傅才未有，\n褚公[4]书绝伦。\n名高前后事，\n回首一伤神。\n诗人因时局动乱，亲友尽疏，北归无望，只能泛舟漂泊。公元769年春诗人离开潭州赴衡州，作此诗。北归无望，前途渺茫，天涯飘零，客居舟中，这都是诗人所忧所愁，无可奈何下只有借酒消愁，沉醉而眠，天明之后，又不得不继续漂泊沦落。首联即流露无限辛酸。颔联从侧面抒发“世情薄，人情恶”的喟叹，然而诗人似乎不太在意这些：自有岸边飞花送我，桅上春燕殷勤留我。让诗人百感交集的，是他想到的被贬长沙的贾谊，和被贬潭州的书法名家褚遂良。历史上才智之士的命运何其相似，这让同样身处湘地的诗人情何以堪！于是诗人产生了情感的共鸣，所有的悲愤忧愁，所有的黯然神伤，都化作一句“往事哪堪回首”。\n注释：\n[1]潭州：地名，今湖南长沙一带。\n[2]湘水：湘江。\n[3]樯燕：立在船桅之上的燕子。\n[4]贾傅、褚公：即汉代贾谊和唐代褚遂良。", "english": "Drunken at night in Southern town,\nI sail on vernal stream at dawn.\nFallen petals bid me adieu,\nSwallows' songs retain me anew.\nA talent exiled long ago,\nA good hand banished in woe.\nWhat good to win a wide-spread fame?\nLooking back, nothing's left to blame.", "poemType": "五言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">夜醉长沙酒，<br>晓行湘水<sup class=\"note-ref\">[2]</sup>春。<br>岸花飞送客，<br>樯燕<sup class=\"note-ref\">[3]</sup>语留人。<br>贾傅才未有，<br>褚公<sup class=\"note-ref\">[4]</sup>书绝伦。<br>名高前后事，<br>回首一伤神。</p>\n<p class=\"prose\">诗人因时局动乱，亲友尽疏，北归无望，只能泛舟漂泊。公元769年春诗人离开潭州赴衡州，作此诗。北归无望，前途渺茫，天涯飘零，客居舟中，这都是诗人所忧所愁，无可奈何下只有借酒消愁，沉醉而眠，天明之后，又不得不继续漂泊沦落。首联即流露无限辛酸。</p>\n<p class=\"prose\">颔联从侧面抒发“世情薄，人情恶”的喟叹，然而诗人似乎不太在意这些：自有岸边飞花送我，桅上春燕殷勤留我。让诗人百感交集的，是他想到的被贬长沙的贾谊，和被贬潭州的书法名家褚遂良。历史上才智之士的命运何其相似，这让同样身处湘地的诗人情何以堪！</p>\n<p class=\"prose\">于是诗人产生了情感的共鸣，所有的悲愤忧愁，所有的黯然神伤，都化作一句“往事哪堪回首”。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]潭州：地名，今湖南长沙一带。<br>[2]湘水：湘江。<br>[3]樯燕：立在船桅之上的燕子。<br>[4]贾傅、褚公：即汉代贾谊和唐代褚遂良。</p>", "englishHtml": "<p class=\"poem-lines\">Drunken at night in Southern town,<br>I sail on vernal stream at dawn.<br>Fallen petals bid me adieu,<br>Swallows&#x27; songs retain me anew.<br>A talent exiled long ago,<br>A good hand banished in woe.<br>What good to win a wide-spread fame?<br>Looking back, nothing&#x27;s left to blame.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Departure from Changsha,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as water, flowers, wine, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "099", "zhTitle": "燕子来舟中作", "enTitle": "To Swallows Coming to My Boat", "chinese": "湖南为客动经春，\n燕子衔泥两度新[1]。\n旧入故园尝识主，\n如今社日远看人。\n可怜处处巢居室[2]，\n何异飘飘托此身[3]？\n暂语船樯还起去，\n穿花贴水益沾巾[4]。\n公元769年正月，诗人由岳州到潭州，写这首诗时，已经是第二年的春天了，诗人仍在潭州，客居舟上。时值燕子衔泥的春季，诗人生命将尽，经一春则少一春，故此诗弥漫出一片萧索、苍凉、悲怆的身世之慨。旧时故园燕，所以“尝识主”，如今远看人，大约是因为变化之大不敢相认。想到燕子“处处无家处处家”，诗人顿生“同是天涯沦落人”之感。燕子飞入舟中，寥寥数语而去，继续飘零此生，又不忍径去，穿花贴水，徘徊顾恋，似在惜别，诗人禁不住老泪纵横。全诗极写漂泊动荡的忧思，满是凄怆悲楚，字字血泪。\n注释：\n[1]两度新：到现在已是第二个春天，第二次见到燕子衔泥。\n[2]巢居室：燕子在屋子梁上筑巢。\n[3]托此身：到处流浪，寻求安身之处。\n[4]沾巾：落泪。此处指作者因感动于燕子多情而落泪。", "english": "It is the second spring I stay on Southern shore,\nTo build their nest, the swallows peck twice clods of clay.\n“Friends to my garden, you should have known me before.\nWhy should you gaze at me on this festive spring day?\nIt is a pity you should build nest here or there.\nDoes it not look like my boat floating far and nigh?\nI should tell you to leave the mast without your stare.\nDon't wrinkle the water and bring tears to my eye!”", "poemType": "七言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">湖南为客动经春，<br>燕子衔泥两度新<sup class=\"note-ref\">[1]</sup>。<br>旧入故园尝识主，<br>如今社日远看人。<br>可怜处处巢居室<sup class=\"note-ref\">[2]</sup>，<br>何异飘飘托此身<sup class=\"note-ref\">[3]</sup>？<br>暂语船樯还起去，<br>穿花贴水益沾巾<sup class=\"note-ref\">[4]</sup>。</p>\n<p class=\"prose\">公元769年正月，诗人由岳州到潭州，写这首诗时，已经是第二年的春天了，诗人仍在潭州，客居舟上。时值燕子衔泥的春季，诗人生命将尽，经一春则少一春，故此诗弥漫出一片萧索、苍凉、悲怆的身世之慨。旧时故园燕，所以“尝识主”，如今远看人，大约是因为变化之大不敢相认。</p>\n<p class=\"prose\">想到燕子“处处无家处处家”，诗人顿生“同是天涯沦落人”之感。燕子飞入舟中，寥寥数语而去，继续飘零此生，又不忍径去，穿花贴水，徘徊顾恋，似在惜别，诗人禁不住老泪纵横。全诗极写漂泊动荡的忧思，满是凄怆悲楚，字字血泪。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]两度新：到现在已是第二个春天，第二次见到燕子衔泥。<br>[2]巢居室：燕子在屋子梁上筑巢。<br>[3]托此身：到处流浪，寻求安身之处。<br>[4]沾巾：落泪。此处指作者因感动于燕子多情而落泪。</p>", "englishHtml": "<p class=\"poem-lines\">It is the second spring I stay on Southern shore,<br>To build their nest, the swallows peck twice clods of clay.<br>“Friends to my garden, you should have known me before.<br>Why should you gaze at me on this festive spring day?<br>It is a pity you should build nest here or there.<br>Does it not look like my boat floating far and nigh?<br>I should tell you to leave the mast without your stare.<br>Don&#x27;t wrinkle the water and bring tears to my eye!”</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “To Swallows Coming to My Boat,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, flowers, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "100", "zhTitle": "江南逢李龟年", "enTitle": "Coming across a Disfavored Court Musician on the Southern Shore of the Yangtze River", "chinese": "岐王[2]宅里寻常见，\n崔九[3]堂前几度闻。\n正是江南好风景，\n落花时节又逢君。\n这是杜甫绝句中情感最深沉、含蕴最丰富的一首。李龟年是开元盛世最著名的乐师，经常出入王公贵族之门，如岐王李范宫邸、宠臣崔九宅院。杜甫也因才华卓著受到公侯接待，二人曾经几度相会。但是安史之乱后，二人流落江南，又在潭州相逢，不免感慨系之。江南风景虽好，却成了乱离时世和沉沦身世的反衬。从时间上来讲，已是落花时节；从李龟年来讲，他流落街头，沿街卖唱，“每逢良辰胜景，为人歌数阕，座中闻之，莫不掩泣罢酒”，这是他的落花时节；从杜甫来讲，他年老多病，漂泊江湖，也是他的落花时节；从唐王朝来讲，歌舞升平的盛世成了兵荒马乱的年代，不能不算是它的落花时节。所以“落花时节”四字，总结了40年的时代沧桑、人生变迁，含蕴非常丰富，感慨非常深远。半年之后，杜甫就离开了人世。\n注释：\n[1]李龟年：唐代著名音乐家。\n[2]岐王：唐玄宗的弟弟李范。\n[3]崔九：崔涤，唐玄宗时期大臣。", "english": "How oft in princely mansions did we meet!\nAs oft in lordly halls I heard you sing.\nNow the Southern scenery is most sweet,\nBut I meet you again in parting spring.", "poemType": "七言绝句", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">岐王<sup class=\"note-ref\">[2]</sup>宅里寻常见，<br>崔九<sup class=\"note-ref\">[3]</sup>堂前几度闻。<br>正是江南好风景，<br>落花时节又逢君。</p>\n<p class=\"prose\">这是杜甫绝句中情感最深沉、含蕴最丰富的一首。李龟年是开元盛世最著名的乐师，经常出入王公贵族之门，如岐王李范宫邸、宠臣崔九宅院。杜甫也因才华卓著受到公侯接待，二人曾经几度相会。但是安史之乱后，二人流落江南，又在潭州相逢，不免感慨系之。</p>\n<p class=\"prose\">江南风景虽好，却成了乱离时世和沉沦身世的反衬。从时间上来讲，已是落花时节；从李龟年来讲，他流落街头，沿街卖唱，“每逢良辰胜景，为人歌数阕，座中闻之，莫不掩泣罢酒”，这是他的落花时节；从杜甫来讲，他年老多病，漂泊江湖，也是他的落花时节；</p>\n<p class=\"prose\">从唐王朝来讲，歌舞升平的盛世成了兵荒马乱的年代，不能不算是它的落花时节。所以“落花时节”四字，总结了40年的时代沧桑、人生变迁，含蕴非常丰富，感慨非常深远。半年之后，杜甫就离开了人世。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]李龟年：唐代著名音乐家。<br>[2]岐王：唐玄宗的弟弟李范。<br>[3]崔九：崔涤，唐玄宗时期大臣。</p>", "englishHtml": "<p class=\"poem-lines\">How oft in princely mansions did we meet!<br>As oft in lordly halls I heard you sing.<br>Now the Southern scenery is most sweet,<br>But I meet you again in parting spring.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Coming across a Disfavored Court Musician on the Southern Shore of the Yangtze River,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water and flowers give the poem its visual texture and emotional temperature.</p>"}];
    const activeStorageKey = "dufu-reader-active-index";
    let active = 0;
    let scale = Number(localStorage.getItem("dufu-reader-scale") || "0");

    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const title = document.getElementById("title");
    const enTitle = document.getElementById("enTitle");
    const poemType = document.getElementById("poemType");
    const poemTheme = document.getElementById("poemTheme");
    const chinese = document.getElementById("chinese");
    const english = document.getElementById("english");
    const leftPane = document.getElementById("leftPane");
    const rightPane = document.getElementById("rightPane");
    const progress = document.getElementById("progress");
    const wordPopover = document.getElementById("wordPopover");
    const wordPopoverWord = document.getElementById("wordPopoverWord");
    const wordZhLabel = document.getElementById("wordZhLabel");
    const wordEnLabel = document.getElementById("wordEnLabel");
    const wordPinyinLabel = document.getElementById("wordPinyinLabel");
    const wordContextLabel = document.getElementById("wordContextLabel");
    const wordPopoverZh = document.getElementById("wordPopoverZh");
    const wordPopoverEn = document.getElementById("wordPopoverEn");
    const wordPopoverPinyin = document.getElementById("wordPopoverPinyin");
    const wordPopoverContext = document.getElementById("wordPopoverContext");
    const wordPopoverClose = document.getElementById("wordPopoverClose");

    function applyScale() {
      document.documentElement.style.setProperty("--body-size", `${19 + scale}px`);
      document.documentElement.style.setProperty("--poem-size", `${23 + scale}px`);
      document.documentElement.style.setProperty("--en-size", `${23 + scale}px`);
      localStorage.setItem("dufu-reader-scale", String(scale));
    }

    function renderList(filter = "") {
      const q = filter.trim().toLowerCase();
      list.innerHTML = "";
      poems.forEach((poem, index) => {
        if (q && !`${poem.zhTitle} ${poem.enTitle} ${poem.poemType} ${poem.poemTheme}`.toLowerCase().includes(q)) return;
        const button = document.createElement("button");
        button.className = "poem-link" + (index === active ? " active" : "");
        button.innerHTML = `<span class="num">${poem.num}</span><span><span class="link-row"><span class="link-title">${poem.zhTitle}</span><span class="type-pill">${poem.poemType}</span><span class="type-pill theme-pill">${poem.poemTheme}</span></span><span class="link-en">${poem.enTitle}</span></span>`;
        button.addEventListener("click", () => showPoem(index));
        list.appendChild(button);
      });
    }

    function showPoem(index) {
      active = Math.max(0, Math.min(poems.length - 1, index));
      localStorage.setItem(activeStorageKey, String(active));
      const poem = poems[active];
      title.textContent = `${poem.num}. ${poem.zhTitle}`;
      enTitle.textContent = poem.enTitle;
      poemType.textContent = poem.poemType;
      poemTheme.textContent = poem.poemTheme;
      chinese.innerHTML = poem.chineseHtml;
      english.innerHTML = poem.englishHtml;
      leftPane.scrollTop = 0;
      rightPane.scrollTop = 0;
      progress.style.width = `${((active + 1) / poems.length) * 100}%`;
      renderList(search.value);
      const current = list.querySelector(".active");
      if (current) current.scrollIntoView({ block: "nearest" });
      hideWordPopover();
    }

    function normalizeSelection(value, sourceLanguage) {
      const cleaned = value
        .trim()
        .replace(/[“”"‘’.,;:!?()[\]{}<>，。？！；：《》【】（）]/g, "")
        .replace(/^[-—]+|[-—]+$/g, "");
      if (sourceLanguage === "zh") {
        return cleaned.replace(/\s+/g, "").slice(0, 24);
      }
      return cleaned.toLowerCase();
    }

    function getSelectionSource(selection) {
      if (!selection || selection.rangeCount === 0) return null;
      const range = selection.getRangeAt(0);
      const node = range.commonAncestorContainer.nodeType === Node.TEXT_NODE
        ? range.commonAncestorContainer.parentElement
        : range.commonAncestorContainer;
      if (!node) return null;
      if (title.contains(node)) return "zh";
      if (leftPane.contains(node)) return "zh";
      if (rightPane.contains(node)) return "en";
      return null;
    }

    function showWordPopover() {
      const selection = window.getSelection();
      const sourceLanguage = getSelectionSource(selection);
      if (!sourceLanguage) {
        hideWordPopover();
        return;
      }
      const raw = selection.toString().trim();
      const word = normalizeSelection(raw, sourceLanguage);
      if (
        !word
        || (sourceLanguage === "en" && (word.includes(" ") || word.length > 32 || !/[a-z]/.test(word)))
        || (sourceLanguage === "zh" && (word.length > 12 || !/[\u3400-\u9fff]/.test(word)))
      ) {
        hideWordPopover();
        return;
      }
      const range = selection.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      if (!rect || (rect.width === 0 && rect.height === 0)) return;
      configureWordPopoverLabels(sourceLanguage);
      wordPopoverWord.textContent = word;
      wordPopoverZh.textContent = "AI 正在解释...";
      wordPopoverEn.textContent = sourceLanguage === "zh" ? "Preparing an English gloss..." : "Thinking in context...";
      wordPopoverPinyin.textContent = sourceLanguage === "zh" ? "正在生成拼音..." : "正在生成音标...";
      wordPopoverContext.textContent = sourceLanguage === "zh"
        ? "会结合当前诗题、中文诗句和赏析上下文解释这个词。"
        : "会结合当前诗题、英文诗句和上下文解释这个词。";
      positionWordPopover(rect);
      wordPopover.classList.add("open");
      queryWordAi(word, selection, raw, sourceLanguage);
    }

    function configureWordPopoverLabels(sourceLanguage) {
      if (sourceLanguage === "zh") {
        wordZhLabel.textContent = "词语释义";
        wordEnLabel.textContent = "English Gloss";
        wordPinyinLabel.textContent = "拼音";
        wordContextLabel.textContent = "诗中用法";
      } else {
        wordZhLabel.textContent = "中文释义";
        wordEnLabel.textContent = "English";
        wordPinyinLabel.textContent = "音标";
        wordContextLabel.textContent = "In This Poem";
      }
      wordPinyinLabel.hidden = false;
      wordPopoverPinyin.hidden = false;
    }

    async function queryWordAi(word, selection, rawSelection, sourceLanguage) {
      const poem = poems[active];
      const sentence = getSelectionSentence(selection, rawSelection, sourceLanguage);
      const fallback = {
        zh: "AI 暂时不可用，本地词表也暂无释义。",
        en: "No local entry yet.",
        pinyin: sourceLanguage === "zh" ? "暂无拼音。" : "音标暂缺。",
        context: "可以稍后重新选择该词再试。"
      };
      try {
        const response = await fetch("/api/word-ai", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            word,
            sentence,
            sourceLanguage,
            poemTitle: poem.zhTitle,
            poemEnTitle: poem.enTitle,
            commentaryContext: (sourceLanguage === "zh" ? poem.chinese : poem.english).replace(/\s+/g, " ").slice(0, 500)
          })
        });
        const data = await response.json();
        if (!response.ok || !data.ok || !data.explanation) {
          throw new Error(data.error || "AI request failed");
        }
        if (wordPopoverWord.textContent !== word) return;
        wordPopoverZh.textContent = data.explanation.zh || fallback.zh;
        wordPopoverEn.textContent = data.explanation.en || fallback.en;
        wordPopoverPinyin.textContent = data.explanation.pinyin || fallback.pinyin || (sourceLanguage === "zh" ? "暂无拼音。" : "音标暂缺。");
        wordPopoverContext.textContent = data.explanation.context || fallback.context;
      } catch (error) {
        if (wordPopoverWord.textContent !== word) return;
        wordPopoverZh.textContent = fallback.zh;
        wordPopoverEn.textContent = fallback.en;
        wordPopoverPinyin.textContent = fallback.pinyin || (sourceLanguage === "zh" ? "暂无拼音。" : "音标暂缺。");
        wordPopoverContext.textContent = fallback.context + "（AI 解释暂时不可用：" + error.message + "）";
      }
    }

    function getSelectionSentence(selection, rawSelection, sourceLanguage) {
      if (!selection || selection.rangeCount === 0) return rawSelection || "";
      const range = selection.getRangeAt(0);
      if (title.contains(range.startContainer)) {
        return title.textContent.replace(/^\d+\.\s*/, "").trim();
      }
      const block = range.startContainer.parentElement && range.startContainer.parentElement.closest("p");
      if (!block) return rawSelection || "";
      const text = block.textContent.replace(/\s+/g, " ").trim();
      if (!text) return rawSelection || "";
      const selected = rawSelection.trim();
      const index = text.indexOf(selected);
      if (index === -1) return text.slice(0, 260);
      const marks = sourceLanguage === "zh" ? ["。", "；", "？", "！"] : [".", ";", "?", "!"];
      const left = Math.max(0, ...marks.map((mark) => text.lastIndexOf(mark, index)));
      const rightCandidates = marks
        .map((mark) => text.indexOf(mark, index + selected.length))
        .filter((pos) => pos !== -1);
      const right = rightCandidates.length ? Math.min(...rightCandidates) + 1 : text.length;
      return text.slice(left, right).trim().slice(0, 260);
    }

    function positionWordPopover(rect) {
      const gap = 10;
      const width = Math.min(340, window.innerWidth - 28);
      let left = rect.left + rect.width / 2 - width / 2;
      left = Math.max(14, Math.min(left, window.innerWidth - width - 14));
      let top = rect.bottom + gap;
      if (top + 220 > window.innerHeight) {
        top = Math.max(14, rect.top - 230);
      }
      wordPopover.style.left = `${left}px`;
      wordPopover.style.top = `${top}px`;
    }

    function hideWordPopover() {
      if (wordPopover) wordPopover.classList.remove("open");
    }

    document.getElementById("prev").addEventListener("click", () => showPoem(active - 1));
    document.getElementById("next").addEventListener("click", () => showPoem(active + 1));
    document.getElementById("smaller").addEventListener("click", () => { scale = Math.max(-4, scale - 1); applyScale(); });
    document.getElementById("larger").addEventListener("click", () => { scale = Math.min(7, scale + 1); applyScale(); });
    search.addEventListener("input", () => renderList(search.value));
    title.addEventListener("mouseup", () => setTimeout(showWordPopover, 10));
    title.addEventListener("touchend", () => setTimeout(showWordPopover, 220));
    leftPane.addEventListener("mouseup", () => setTimeout(showWordPopover, 10));
    leftPane.addEventListener("touchend", () => setTimeout(showWordPopover, 220));
    rightPane.addEventListener("mouseup", () => setTimeout(showWordPopover, 10));
    rightPane.addEventListener("touchend", () => setTimeout(showWordPopover, 220));
    wordPopoverClose.addEventListener("click", hideWordPopover);
    document.addEventListener("mousedown", (event) => {
      if (!wordPopover.contains(event.target) && !title.contains(event.target) && !rightPane.contains(event.target) && !leftPane.contains(event.target)) hideWordPopover();
    });
    window.addEventListener("resize", hideWordPopover);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") hideWordPopover();
      if (event.key === "ArrowLeft") showPoem(active - 1);
      if (event.key === "ArrowRight") showPoem(active + 1);
    });

    applyScale();
    renderList();
    const savedActive = Number(localStorage.getItem(activeStorageKey));
    showPoem(Number.isInteger(savedActive) ? savedActive : 0);
  </script>
</body>
