“微风燕子斜”“润物细无声”的意味，风之微雨之细都不言而喻。后四句是与此美景极不相称的残酷的生活现实。</p>\n<p class=\"prose\">诗人初到成都时，靠故人接济，一旦故人断绝消息，他的家人就免不了挨饿了，颈联即写此事。即使身陷这样的窘境，诗人却像一个斗士般顽强，以近乎狂放的态度面对，诗人的这种人生态度，不但没有随同岁月流逝而衰退，反而越来越增强了，一句“自笑”，多少无处排遣的愁苦饱含其中。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]筱（xiǎo）：细竹。<br>[2]娟娟净：秀丽洁白之态。<br>[3]裛（yì）：滋润。<br>[4]红蕖：粉红的荷花。<br>[5]冉冉香：阵阵的清香。<br>[6]恒饥：长时间挨饿。</p>", "englishHtml": "<p class=\"poem-lines\">West of the Bridge there stands my thatched hall,<br>Beside a pool where water plays with flowers.<br>The breeze caresses bamboos green and tall;<br>Pink lotus blooms moistened sweeten the bowers.<br>But unprovided for by my old friend,<br>My hungry children look haggard and drear.<br>Could I bow before I come to my end?<br>I laugh and hold my unbent mind as dear.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Unbent Mind,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, flowers, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "047", "zhTitle": "江村", "enTitle": "The Riverside Village", "chinese": "清江[2]一曲抱[3]村流，\n长夏江村事事幽。\n自去自来[4]梁上燕，\n相亲相近水中鸥。\n老妻画纸为棋局，\n稚子[5]敲针作钓钩。\n多病所须惟药物，\n微躯此外更何求？\n《江村》是公元760年杜甫在成都西郊浣花溪畔修筑草堂后的作品。弯弯曲曲的锦江环抱着草堂流过，江畔小村在漫长的夏天显得非常幽静。村里的燕子在梁间飞来飞去，自由自在；江上的白鸥成对成双，相伴相随。老妻把纸画成棋盘，正好下棋消夏；儿子把针敲成鱼钩，清江可以垂钓。只是多病需要吃药，除此以外并无他求。诗中重复字多，如“江”“村”两见，“事事”叠现，还有“自去自来”“相亲相近”，但是错落有致，读来不嫌重复。全诗前后照应紧凑，结句转为凄婉，具有杜诗沉郁的特点。\n注释：\n[1]江村：江畔的村庄。\n[2]清江：清澈的江水。\n[3]抱：环绕，围绕。\n[4]自去自来：形容自由自在，无拘无束。\n[5]稚子：幼子。", "english": "The winding clear river around the village flows;\nWe pass the long summer by riverside with ease.\nThe swallow freely comes in and freely out goes;\nThe gulls on water snuggle each other as they please.\nMy wife draws lines on paper to make a chessboard;\nMy son knocks a needle into a fishing hook.\nIll, I need only medicine I can afford.\nWhat else do I want for myself in my humble nook?", "poemType": "七言律诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">清江<sup class=\"note-ref\">[2]</sup>一曲抱<sup class=\"note-ref\">[3]</sup>村流，<br>长夏江村事事幽。<br>自去自来<sup class=\"note-ref\">[4]</sup>梁上燕，<br>相亲相近水中鸥。<br>老妻画纸为棋局，<br>稚子<sup class=\"note-ref\">[5]</sup>敲针作钓钩。<br>多病所须惟药物，<br>微躯此外更何求？</p>\n<p class=\"prose\">《江村》是公元760年杜甫在成都西郊浣花溪畔修筑草堂后的作品。弯弯曲曲的锦江环抱着草堂流过，江畔小村在漫长的夏天显得非常幽静。村里的燕子在梁间飞来飞去，自由自在；江上的白鸥成对成双，相伴相随。老妻把纸画成棋盘，正好下棋消夏；</p>\n<p class=\"prose\">儿子把针敲成鱼钩，清江可以垂钓。只是多病需要吃药，除此以外并无他求。诗中重复字多，如“江”“村”两见，“事事”叠现，还有“自去自来”“相亲相近”，但是错落有致，读来不嫌重复。全诗前后照应紧凑，结句转为凄婉，具有杜诗沉郁的特点。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]江村：江畔的村庄。<br>[2]清江：清澈的江水。<br>[3]抱：环绕，围绕。<br>[4]自去自来：形容自由自在，无拘无束。<br>[5]稚子：幼子。</p>", "englishHtml": "<p class=\"poem-lines\">The winding clear river around the village flows;<br>We pass the long summer by riverside with ease.<br>The swallow freely comes in and freely out goes;<br>The gulls on water snuggle each other as they please.<br>My wife draws lines on paper to make a chessboard;<br>My son knocks a needle into a fishing hook.<br>Ill, I need only medicine I can afford.<br>What else do I want for myself in my humble nook?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Riverside Village,” the poem presents retreat or solitude as a way to stand apart from worldly pressure.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "048", "zhTitle": "野老", "enTitle": "An Old Man by the Riverside", "chinese": "野老篱边[2]江岸回，\n柴门不正逐江开[3]。\n渔人网集澄潭[4]下，\n贾客[5]船随返照来。\n长路关心悲剑阁，\n片云何意傍琴台？\n王师未报收东郡，\n城阙秋生画角哀。\n公元760年，经过长年的颠沛流离之后，杜甫在成都草堂定居下来，写下此诗。终于有了一个憩息之所的诗人，在此诗的前四句表达的是闲适隐逸的心情。然而江中的客船又扰乱了诗人平静的心，使他想起漫漫长路的那一端，是长安，还是洛阳？然而剑阁之内动荡离乱，音信全无，关山难越，与亲人梦魂阻隔，自己浮云般的漂泊之身，究竟为何滞留剑外呢？片云是诗人自喻，琴台相传为司马相如和卓文君当垆卖酒之地，此指代成都。此句流露出诗人寓居剑外，报国无门的愁苦。东郡，指洛阳。尾联两句叹洛阳二次失陷后，至今尚未光复，城楼传来的号角声也十分凄切悲凉，以声音做结尾，有余音绕梁的艺术效果。\n注释：\n[1]野老：杜甫自称。\n[2]篱边：竹篱的旁边。\n[3]逐江开：描写浣花溪向东流去。\n[4]澄潭：指百花潭。\n[5]贾（ɡǔ）客：商人。", "english": "A fence of bamboo winds along the riverside,\nMy wicket gate opens askew to greet the tide.\nFishermen set their nets in water clear and bright,\nMerchant ships arrive with the departing sunlight.\nThe road is long to recover the whole lost land,\nWhy should the lonely cloud drift where no lutists stand?\nThe east is not yet in the hand of royal force.\nI'm grieved to hear autumn bugle and neighing horse.", "poemType": "七言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">野老篱边<sup class=\"note-ref\">[2]</sup>江岸回，<br>柴门不正逐江开<sup class=\"note-ref\">[3]</sup>。<br>渔人网集澄潭<sup class=\"note-ref\">[4]</sup>下，<br>贾客<sup class=\"note-ref\">[5]</sup>船随返照来。<br>长路关心悲剑阁，<br>片云何意傍琴台？<br>王师未报收东郡，<br>城阙秋生画角哀。</p>\n<p class=\"prose\">公元760年，经过长年的颠沛流离之后，杜甫在成都草堂定居下来，写下此诗。终于有了一个憩息之所的诗人，在此诗的前四句表达的是闲适隐逸的心情。然而江中的客船又扰乱了诗人平静的心，使他想起漫漫长路的那一端，是长安，还是洛阳？然而剑阁之内动荡离乱，音信全无，关山难越，与亲人梦魂阻隔，自己浮云般的漂泊之身，究竟为何滞留剑外呢？</p>\n<p class=\"prose\">片云是诗人自喻，琴台相传为司马相如和卓文君当垆卖酒之地，此指代成都。此句流露出诗人寓居剑外，报国无门的愁苦。东郡，指洛阳。尾联两句叹洛阳二次失陷后，至今尚未光复，城楼传来的号角声也十分凄切悲凉，以声音做结尾，有余音绕梁的艺术效果。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]野老：杜甫自称。<br>[2]篱边：竹篱的旁边。<br>[3]逐江开：描写浣花溪向东流去。<br>[4]澄潭：指百花潭。<br>[5]贾（ɡǔ）客：商人。</p>", "englishHtml": "<p class=\"poem-lines\">A fence of bamboo winds along the riverside,<br>My wicket gate opens askew to greet the tide.<br>Fishermen set their nets in water clear and bright,<br>Merchant ships arrive with the departing sunlight.<br>The road is long to recover the whole lost land,<br>Why should the lonely cloud drift where no lutists stand?<br>The east is not yet in the hand of royal force.<br>I&#x27;m grieved to hear autumn bugle and neighing horse.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “An Old Man by the Riverside,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as water, clouds, frontier scenes, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "049", "zhTitle": "恨别", "enTitle": "Separation", "chinese": "洛城[1]一别四千里，\n胡骑长驱五六年。\n草木变衰行剑外[2]，\n兵戈阻绝老江边。\n思家步月清宵立，\n忆弟看云白日眠。\n闻道河阳近乘胜，\n司徒[3]急为破幽燕。\n公元760年杜甫在成都写下此诗。首联作者通过空间和时间，以一己之身的遭遇，反映出国家的动荡局面和百姓的离乱之苦。诗人于剑外，眼见草木盛衰变易，枯荣交替，然而兵戈未息，不能重返故土，只得在这逝者如斯的江边渐渐老去。颈联突出题意，思家故夜不能寐，忆弟故怅然高卧，倦极而眠，委婉曲折地表现了怀念亲人的无限相思。尾联充满希望，诗人听到唐军连战连捷的喜讯，感到复国指日可待，自己也可还乡，所以充满希冀。\n注释：\n[1]洛城：洛阳。\n[2]剑外：指蜀地。\n[3]司徒：指李光弼。", "english": "The capital is left four thousand li away,\nFor five or six years by Tartar steeds occupied.\nGrasses and woods wither in the west day by day;\nWar flames prevent me from leaving the riverside.\nThinking of home, I pace with the moon all the night;\nLonging for brothers while watching clouds brings sleep.\n’Tis said the rebels are beaten with main and might;\nWe wish but victory be followed up far and deep.", "poemType": "七言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">洛城<sup class=\"note-ref\">[1]</sup>一别四千里，<br>胡骑长驱五六年。<br>草木变衰行剑外<sup class=\"note-ref\">[2]</sup>，<br>兵戈阻绝老江边。<br>思家步月清宵立，<br>忆弟看云白日眠。<br>闻道河阳近乘胜，<br>司徒<sup class=\"note-ref\">[3]</sup>急为破幽燕。</p>\n<p class=\"prose\">公元760年杜甫在成都写下此诗。首联作者通过空间和时间，以一己之身的遭遇，反映出国家的动荡局面和百姓的离乱之苦。诗人于剑外，眼见草木盛衰变易，枯荣交替，然而兵戈未息，不能重返故土，只得在这逝者如斯的江边渐渐老去。颈联突出题意，思家故夜不能寐，忆弟故怅然高卧，倦极而眠，委婉曲折地表现了怀念亲人的无限相思。</p>\n<p class=\"prose\">尾联充满希望，诗人听到唐军连战连捷的喜讯，感到复国指日可待，自己也可还乡，所以充满希冀。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]洛城：洛阳。<br>[2]剑外：指蜀地。<br>[3]司徒：指李光弼。</p>", "englishHtml": "<p class=\"poem-lines\">The capital is left four thousand li away,<br>For five or six years by Tartar steeds occupied.<br>Grasses and woods wither in the west day by day;<br>War flames prevent me from leaving the riverside.<br>Thinking of home, I pace with the moon all the night;<br>Longing for brothers while watching clouds brings sleep.<br>’Tis said the rebels are beaten with main and might;<br>We wish but victory be followed up far and deep.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Separation,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, moonlight, clouds, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "050", "zhTitle": "后游", "enTitle": "The Temple Revisited", "chinese": "寺忆曾[1]游处，\n桥怜再渡时。\n江山如有待[2]，\n花柳自无私。\n野润烟光[3]薄，\n沙暄[4]日色迟。\n客愁全为减，\n舍此复何之？\n杜甫于公元761年曾到新津，写下《游修觉寺》，第二次即写了这首《后游》。前四句回应往日之游而写后来之游，前两句采取倒装句式，有如老友重逢一般，对景物寄予深厚感情。美好江山似乎早已期待着老朋友的再次光临，花柳也很慷慨，诗人对山水花草富有感恩和喜爱之情，也从侧面说明了他在人世间的不得意。诗人是如此陶醉于自然，以至于从“烟光薄”到“日色迟”，流连于此，欣然忘返，又从侧面说明了景色之美。诗文以一句感慨结尾，得风景如此，漂泊在外的客愁全消，除了这还有什么地方可去呢？不只是赞风景绝佳，更是对山河破碎，民生凋敝，报国无门，忧愁难解的委婉表达。\n注释：\n[1]曾（cénɡ）：一作“新”，一作“重”。\n[2]待：有所期待。\n[3]烟光：云霭雾气。\n[4]暄（xuān）：暖。", "english": "The memories of the temple still last.\nCan I forget the bridge where I have passed?\nThe hill and stream still seem to wait for me;\nTo enjoy flowers and willows I'm free.\nMorning sheds light and mist to feed the land;\nThe setting sunbeams won't leave beaming sand.\nMy homesickness vanishes in the air.\nWhere else can I cure my nostalgia? Where?", "poemType": "五言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">寺忆曾<sup class=\"note-ref\">[1]</sup>游处，<br>桥怜再渡时。<br>江山如有待<sup class=\"note-ref\">[2]</sup>，<br>花柳自无私。<br>野润烟光<sup class=\"note-ref\">[3]</sup>薄，<br>沙暄<sup class=\"note-ref\">[4]</sup>日色迟。<br>客愁全为减，<br>舍此复何之？</p>\n<p class=\"prose\">杜甫于公元761年曾到新津，写下《游修觉寺》，第二次即写了这首《后游》。前四句回应往日之游而写后来之游，前两句采取倒装句式，有如老友重逢一般，对景物寄予深厚感情。美好江山似乎早已期待着老朋友的再次光临，花柳也很慷慨，诗人对山水花草富有感恩和喜爱之情，也从侧面说明了他在人世间的不得意。</p>\n<p class=\"prose\">诗人是如此陶醉于自然，以至于从“烟光薄”到“日色迟”，流连于此，欣然忘返，又从侧面说明了景色之美。诗文以一句感慨结尾，得风景如此，漂泊在外的客愁全消，除了这还有什么地方可去呢？不只是赞风景绝佳，更是对山河破碎，民生凋敝，报国无门，忧愁难解的委婉表达。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]曾（cénɡ）：一作“新”，一作“重”。<br>[2]待：有所期待。<br>[3]烟光：云霭雾气。<br>[4]暄（xuān）：暖。</p>", "englishHtml": "<p class=\"poem-lines\">The memories of the temple still last.<br>Can I forget the bridge where I have passed?<br>The hill and stream still seem to wait for me;<br>To enjoy flowers and willows I&#x27;m free.<br>Morning sheds light and mist to feed the land;<br>The setting sunbeams won&#x27;t leave beaming sand.<br>My homesickness vanishes in the air.<br>Where else can I cure my nostalgia? Where?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Temple Revisited,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as mountains, water, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "051", "zhTitle": "客至", "enTitle": "For a Guest", "chinese": "舍[1]南舍北皆春水，\n但见群鸥日日来。\n花径[2]不曾缘客扫，\n蓬门[3]今始为君开。\n盘飧市远[4]无兼味，\n樽[5]酒家贫只旧醅[6]。\n肯与邻翁相对饮，\n隔篱呼取尽余杯。\n《客至》是公元761年杜甫在草堂待客的作品。先写环境，草堂南北都是浣花溪水，天天只见白鸥飞来，而白鸥是水边隐士的伴侣，这就点明了杜甫的隐居生活。花径未扫，蓬门始开，更说明了生活幽静。前半虚写客来之前，后半实写客来之后。草堂远离街市，买东西不方便，菜肴简单，酒也只有家酿的旧醅。但如果要“把酒话桑麻”，还可以请邻翁过来同饮。这首诗把门前景、家常话、身边事，编织成富有情趣的生活场景，是一首充满了人情味的叙事诗。\n注释：\n[1]舍：指家。\n[2]花径：长满花草的小路。\n[3]蓬门：蓬草编扎的门户。用以指代简陋的房屋。\n[4]市远：远离市集。\n[5]樽：酒器。\n[6]旧醅（pēi）：隔年的酒。", "english": "North and south of my cottage winds spring water green;\nI see but flocks of gulls coming from day to day.\nThe footpath strewn with fallen blooms is not swept clean;\nMy wicket gate is opened but for you today.\nFar from market, I can afford but simple dish;\nBeing not rich, I've only old wine for our cup.\nTo drink together with my neighbor if you wish,\nI'll call him o'er the fence to finish the wine up.", "poemType": "七言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">舍<sup class=\"note-ref\">[1]</sup>南舍北皆春水，<br>但见群鸥日日来。<br>花径<sup class=\"note-ref\">[2]</sup>不曾缘客扫，<br>蓬门<sup class=\"note-ref\">[3]</sup>今始为君开。<br>盘飧市远<sup class=\"note-ref\">[4]</sup>无兼味，<br>樽<sup class=\"note-ref\">[5]</sup>酒家贫只旧醅<sup class=\"note-ref\">[6]</sup>。<br>肯与邻翁相对饮，<br>隔篱呼取尽余杯。</p>\n<p class=\"prose\">《客至》是公元761年杜甫在草堂待客的作品。先写环境，草堂南北都是浣花溪水，天天只见白鸥飞来，而白鸥是水边隐士的伴侣，这就点明了杜甫的隐居生活。花径未扫，蓬门始开，更说明了生活幽静。前半虚写客来之前，后半实写客来之后。草堂远离街市，买东西不方便，菜肴简单，酒也只有家酿的旧醅。</p>\n<p class=\"prose\">但如果要“把酒话桑麻”，还可以请邻翁过来同饮。这首诗把门前景、家常话、身边事，编织成富有情趣的生活场景，是一首充满了人情味的叙事诗。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]舍：指家。<br>[2]花径：长满花草的小路。<br>[3]蓬门：蓬草编扎的门户。用以指代简陋的房屋。<br>[4]市远：远离市集。<br>[5]樽：酒器。<br>[6]旧醅（pēi）：隔年的酒。</p>", "englishHtml": "<p class=\"poem-lines\">North and south of my cottage winds spring water green;<br>I see but flocks of gulls coming from day to day.<br>The footpath strewn with fallen blooms is not swept clean;<br>My wicket gate is opened but for you today.<br>Far from market, I can afford but simple dish;<br>Being not rich, I&#x27;ve only old wine for our cup.<br>To drink together with my neighbor if you wish,<br>I&#x27;ll call him o&#x27;er the fence to finish the wine up.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For a Guest,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as water, flowers, wine, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "052", "zhTitle": "绝句漫兴 （九首其一）", "enTitle": "Quatrains Written at Random ( I )", "chinese": "绝句漫兴\n（九首其一）\n眼见客愁愁不醒[1]，\n无赖[2]春色到江[3]亭。\n即遣花开深造次[4]，\n便觉莺语太丁宁。\n《绝句漫兴九首》写于杜甫寓居成都草堂的第二年（761）。“漫兴”就是兴之所至，随手写出，不求写尽，也不求写全的意思。这一首写诗人沉浸在飘零客居的愁思中，春色如懵懂无知的少女，莽莽撞撞地闯进了诗人的眼帘，就在诗人的眼前花团锦簇，莺啼婉转，更平添一层烦愁心绪。诗人善用反衬手法，深化情景对立，加强思想感情的表达。\n注释：\n[1]愁不醒：难以排遣愁烦。\n[2]无赖：春意恼人。\n[3]江：浣花溪。\n[4]造次：仓促。", "english": "Quatrains Written at Random\n(I)\nMy eyes are unawakened to grief of spring,\nWhich beautifies still the riverside bowers.\nWhy should the talkative orioles sing\nAnd my eyes be bewildered by blooming flowers?", "poemType": "古体诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">绝句漫兴<br>（九首其一）<br>眼见客愁愁不醒<sup class=\"note-ref\">[1]</sup>，<br>无赖<sup class=\"note-ref\">[2]</sup>春色到江<sup class=\"note-ref\">[3]</sup>亭。<br>即遣花开深造次<sup class=\"note-ref\">[4]</sup>，<br>便觉莺语太丁宁。</p>\n<p class=\"prose\">《绝句漫兴九首》写于杜甫寓居成都草堂的第二年（761）。“漫兴”就是兴之所至，随手写出，不求写尽，也不求写全的意思。这一首写诗人沉浸在飘零客居的愁思中，春色如懵懂无知的少女，莽莽撞撞地闯进了诗人的眼帘，就在诗人的眼前花团锦簇，莺啼婉转，更平添一层烦愁心绪。</p>\n<p class=\"prose\">诗人善用反衬手法，深化情景对立，加强思想感情的表达。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]愁不醒：难以排遣愁烦。<br>[2]无赖：春意恼人。<br>[3]江：浣花溪。<br>[4]造次：仓促。</p>", "englishHtml": "<p class=\"poem-lines\">Quatrains Written at Random(I)<br>My eyes are unawakened to grief of spring,<br>Which beautifies still the riverside bowers.<br>Why should the talkative orioles sing<br>And my eyes be bewildered by blooming flowers?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Quatrains Written at Random ( I ),” the poem presents retreat or solitude as a way to stand apart from worldly pressure.</p>\n<p class=\"commentary\">As a ancient-style poem, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water, flowers, birds, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "053", "zhTitle": "绝句漫兴 （九首其三）", "enTitle": "Quatrains Written at Random ( III )", "chinese": "绝句漫兴\n（九首其三）\n熟知茅斋[1]绝低小，\n江上燕子故来频。\n衔泥点污[2]琴书内，\n更接飞虫打着人。\n这一首景中含情，带有浓厚的生活气息，更透出一股闲适之意。给人自然、亲切之感。燕子往来穿梭，忙忙碌碌，相形之下诗人好整以暇，倒显出些许无奈与落寞。一说诗人通过对燕子频频扰人情景的描写，引出禽鸟也似欺人的感慨，表现诗人客居他乡的诸多烦恼和心绪不宁。\n注释：\n[1]茅斋：茅屋。\n[2]点污：弄脏。", "english": "Quatrains Written at Random\n(III)\nKnowing my thatched hut small with roof low,\nSwallows oft come across the stream and go.\nThey stain my lute and books with clods of clay\nAnd knock at my head while catching its prey.", "poemType": "古体诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">绝句漫兴<br>（九首其三）<br>熟知茅斋<sup class=\"note-ref\">[1]</sup>绝低小，<br>江上燕子故来频。<br>衔泥点污<sup class=\"note-ref\">[2]</sup>琴书内，<br>更接飞虫打着人。</p>\n<p class=\"prose\">这一首景中含情，带有浓厚的生活气息，更透出一股闲适之意。给人自然、亲切之感。燕子往来穿梭，忙忙碌碌，相形之下诗人好整以暇，倒显出些许无奈与落寞。一说诗人通过对燕子频频扰人情景的描写，引出禽鸟也似欺人的感慨，表现诗人客居他乡的诸多烦恼和心绪不宁。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]茅斋：茅屋。<br>[2]点污：弄脏。</p>", "englishHtml": "<p class=\"poem-lines\">Quatrains Written at Random</p>\n<p class=\"stanza-marker\">(III)</p>\n<p class=\"poem-lines\">Knowing my thatched hut small with roof low,<br>Swallows oft come across the stream and go.<br>They stain my lute and books with clods of clay<br>And knock at my head while catching its prey.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Quatrains Written at Random ( III ),” the poem begins from a vivid object or scene and lets its energy expand into emotion.</p>\n<p class=\"commentary\">As a ancient-style poem, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water give the poem its visual texture and emotional temperature.</p>"}, {"num": "054", "zhTitle": "绝句漫兴 （九首其五）", "enTitle": "Quatrains Written at Random ( V )", "chinese": "绝句漫兴\n（九首其五）\n肠断春江欲尽头，\n杖藜徐步立芳洲[1]。\n颠狂[2]柳絮随风舞，\n轻薄桃花逐水流。\n诗人要走到春江的尽头，为什么会“肠断”呢？可能是忧国忧家，也可能是惜春归去，所以放慢了脚步，拄着拐杖，站在芳草萋萋的洲头，看见柳絮如醉如狂，随风飞舞，桃花轻浮浪荡，顺水漂流。这既可以说是惜春归去，也可以说是借物讽人，写出了诗人的遐思漫想。\n注释：\n[1]芳洲：花草丛生的水中洲陆。\n[2]颠狂：诗中形容放荡不羁的样子。", "english": "Quatrains Written at Random\n(V)\nThe river's broken-hearted to see spring pass away;\nStanding on fragrant islet, I ask spring to stay.\nBut willow down runs wild and dances with wanton breeze;\nPeach blossoms frivolous go with the stream as they please.", "poemType": "古体诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">绝句漫兴<br>（九首其五）<br>肠断春江欲尽头，<br>杖藜徐步立芳洲<sup class=\"note-ref\">[1]</sup>。<br>颠狂<sup class=\"note-ref\">[2]</sup>柳絮随风舞，<br>轻薄桃花逐水流。</p>\n<p class=\"prose\">诗人要走到春江的尽头，为什么会“肠断”呢？可能是忧国忧家，也可能是惜春归去，所以放慢了脚步，拄着拐杖，站在芳草萋萋的洲头，看见柳絮如醉如狂，随风飞舞，桃花轻浮浪荡，顺水漂流。这既可以说是惜春归去，也可以说是借物讽人，写出了诗人的遐思漫想。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]芳洲：花草丛生的水中洲陆。<br>[2]颠狂：诗中形容放荡不羁的样子。</p>", "englishHtml": "<p class=\"poem-lines\">Quatrains Written at Random(V)<br>The river&#x27;s broken-hearted to see spring pass away;<br>Standing on fragrant islet, I ask spring to stay.<br>But willow down runs wild and dances with wanton breeze;<br>Peach blossoms frivolous go with the stream as they please.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Quatrains Written at Random ( V ),” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a ancient-style poem, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as water, flowers, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "055", "zhTitle": "绝句漫兴 （九首其七）", "enTitle": "Quatrains Written at Random ( VII )", "chinese": "绝句漫兴\n（九首其七）\n糁径杨花铺白毡，\n点溪荷叶叠青钱。\n笋根雉子[1]无人见，\n沙上凫雏[2]傍母眠。\n这首写初夏景色。作者漫步林溪之间，初夏的美妙自然令人流连，闲静之中，微含客居异地的萧寂之感。“糁径”指杨花散落的小径，好像铺上了一层白毡，“点”“叠”二字，把荷叶在水中的状态写得十分生动传神。这首诗语言朴实生动，意境清新隽永，景物相融，各得其妙。\n注释：\n[1]雉子：小鸡。\n[2]凫雏：小鸭子。", "english": "Quatrains Written at Random\n(VII)\nThe path paved with willow-down looks like carpet white;\nThe creek dotted with lotus leaves like coins blue.\nWaterbirds young and old sleep on sand left and right;\nThe pheasants lie hidden at the foot of bamboo.", "poemType": "古体诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">绝句漫兴<br>（九首其七）<br>糁径杨花铺白毡，<br>点溪荷叶叠青钱。<br>笋根雉子<sup class=\"note-ref\">[1]</sup>无人见，<br>沙上凫雏<sup class=\"note-ref\">[2]</sup>傍母眠。</p>\n<p class=\"prose\">这首写初夏景色。作者漫步林溪之间，初夏的美妙自然令人流连，闲静之中，微含客居异地的萧寂之感。“糁径”指杨花散落的小径，好像铺上了一层白毡，“点”“叠”二字，把荷叶在水中的状态写得十分生动传神。这首诗语言朴实生动，意境清新隽永，景物相融，各得其妙。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]雉子：小鸡。<br>[2]凫雏：小鸭子。</p>", "englishHtml": "<p class=\"poem-lines\">Quatrains Written at Random</p>\n<p class=\"stanza-marker\">(VII)</p>\n<p class=\"poem-lines\">The path paved with willow-down looks like carpet white;<br>The creek dotted with lotus leaves like coins blue.<br>Waterbirds young and old sleep on sand left and right;<br>The pheasants lie hidden at the foot of bamboo.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Quatrains Written at Random ( VII ),” the poem begins from a vivid object or scene and lets its energy expand into emotion.</p>\n<p class=\"commentary\">As a ancient-style poem, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "056", "zhTitle": "春夜喜雨", "enTitle": "Happy Rain on a Spring Night", "chinese": "好雨[1]知时节，\n当春乃发生[2]。\n随风潜入夜，\n润物细无声。\n野径[3]云俱黑，\n江船火独明。\n晓看红湿处，\n花重[4]锦官城[5]。\n《春夜喜雨》是杜甫的名作。开头一个“好”字，就把雨拟人化。雨“好”在哪里呢？第一好在适时，春天万物生长，正需要雨，雨就来了，多么“知时节”！第二“好”在“润物”，无声无息，造福天下，既不求名，也不讨好。这写的是所闻。下面再写所见：开门一看，天上阴云密布，地上水上一片漆黑，只有几点渔火闪烁，雨可能要下个通宵，这说明第三“好”在持久，又点明了是夜雨。最后写所想：明天一定满城花开，春意盎然，这还点明了“春”。诗写的是好雨，也表现了好人的品格。\n注释：\n[1]好雨：春雨。\n[2]发生：植物生长。\n[3]野径：小路。\n[4]花重：花沾了雨滴显得更饱满。\n[5]锦官城：指成都。", "english": "Good rain knows its time right;\nIt will fall when comes spring.\nWith wind it steals in night;\nMute, it moistens each thing.\nO'er wild lanes dark cloud spreads;\nIn boat a lantern looms.\nDawn sees saturated reds;\nThe town's heavy with blooms.", "poemType": "五言律诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">好雨<sup class=\"note-ref\">[1]</sup>知时节，<br>当春乃发生<sup class=\"note-ref\">[2]</sup>。<br>随风潜入夜，<br>润物细无声。<br>野径<sup class=\"note-ref\">[3]</sup>云俱黑，<br>江船火独明。<br>晓看红湿处，<br>花重<sup class=\"note-ref\">[4]</sup>锦官城<sup class=\"note-ref\">[5]</sup>。</p>\n<p class=\"prose\">《春夜喜雨》是杜甫的名作。开头一个“好”字，就把雨拟人化。雨“好”在哪里呢？第一好在适时，春天万物生长，正需要雨，雨就来了，多么“知时节”！第二“好”在“润物”，无声无息，造福天下，既不求名，也不讨好。这写的是所闻。</p>\n<p class=\"prose\">下面再写所见：开门一看，天上阴云密布，地上水上一片漆黑，只有几点渔火闪烁，雨可能要下个通宵，这说明第三“好”在持久，又点明了是夜雨。最后写所想：明天一定满城花开，春意盎然，这还点明了“春”。诗写的是好雨，也表现了好人的品格。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]好雨：春雨。<br>[2]发生：植物生长。<br>[3]野径：小路。<br>[4]花重：花沾了雨滴显得更饱满。<br>[5]锦官城：指成都。</p>", "englishHtml": "<p class=\"poem-lines\">Good rain knows its time right;<br>It will fall when comes spring.<br>With wind it steals in night;<br>Mute, it moistens each thing.<br>O&#x27;er wild lanes dark cloud spreads;<br>In boat a lantern looms.<br>Dawn sees saturated reds;<br>The town&#x27;s heavy with blooms.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Happy Rain on a Spring Night,” the poem begins from a vivid object or scene and lets its energy expand into emotion.</p>\n<p class=\"commentary\">As a five-character regulated verse, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "057", "zhTitle": "江亭", "enTitle": "Riverside Pavilion", "chinese": "坦腹[1]江亭暖，\n长吟野望时。\n水流心不竞，\n云在意俱迟。\n寂寂[2]春将晚，\n欣欣[3]物自私。\n江东犹苦战，\n回首一颦眉。\n此诗作于公元761年，诗人居于草堂，生活暂时比较稳定。暮春时节，诗人仰卧江亭，吟诵着《野望》，此刻诗人的心境，是与世无争的，就像仅仅为了自然规律而流动飘卷的江水和白云一样。这两句诗不止是情景交融，更包含深刻的人生哲理。五、六句融景入情，诗人百般寂寥反怪万物自私，透露了万物兴盛而诗人独自忧伤的悲凉。国运衰微，江东战局艰苦，诗人每每回首，都愁眉不展。这首诗前四句写隐居生活的悠闲，后四句写对国家的担忧，表达诗人心怀天下，忧心国事的焦灼苦闷。\n注释：\n[1]坦腹：仰卧，坦露胸腹。\n[2]寂寂：悄悄地。\n[3]欣欣：繁盛的样子。", "english": "I lie supine by riverside,\nAnd croon while gazing on fields wide.\nWith running water I won't vie;\nMy mind floats with the cloud on high.\nSpring will soon be late in the gloom.\nWhy should flowers vie in full bloom?\nThe war is raging in the east.\nCan I not frown with mind unreleased?", "poemType": "五言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">坦腹<sup class=\"note-ref\">[1]</sup>江亭暖，<br>长吟野望时。<br>水流心不竞，<br>云在意俱迟。<br>寂寂<sup class=\"note-ref\">[2]</sup>春将晚，<br>欣欣<sup class=\"note-ref\">[3]</sup>物自私。<br>江东犹苦战，<br>回首一颦眉。</p>\n<p class=\"prose\">此诗作于公元761年，诗人居于草堂，生活暂时比较稳定。暮春时节，诗人仰卧江亭，吟诵着《野望》，此刻诗人的心境，是与世无争的，就像仅仅为了自然规律而流动飘卷的江水和白云一样。这两句诗不止是情景交融，更包含深刻的人生哲理。五、六句融景入情，诗人百般寂寥反怪万物自私，透露了万物兴盛而诗人独自忧伤的悲凉。</p>\n<p class=\"prose\">国运衰微，江东战局艰苦，诗人每每回首，都愁眉不展。这首诗前四句写隐居生活的悠闲，后四句写对国家的担忧，表达诗人心怀天下，忧心国事的焦灼苦闷。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]坦腹：仰卧，坦露胸腹。<br>[2]寂寂：悄悄地。<br>[3]欣欣：繁盛的样子。</p>", "englishHtml": "<p class=\"poem-lines\">I lie supine by riverside,<br>And croon while gazing on fields wide.<br>With running water I won&#x27;t vie;<br>My mind floats with the cloud on high.<br>Spring will soon be late in the gloom.<br>Why should flowers vie in full bloom?<br>The war is raging in the east.<br>Can I not frown with mind unreleased?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Riverside Pavilion,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, clouds, and war and displacement give the poem its visual texture and emotional temperature.</p>"}, {"num": "058", "zhTitle": "琴台", "enTitle": "Wooing Lutist", "chinese": "茂陵[2]多病后，\n尚爱卓文君[3]。\n酒肆人间世，\n琴台日暮云。\n野花留宝靥[4]，\n蔓草见罗裙。\n归凤求凰意，\n寥寥不复闻。\n此诗是杜甫晚年在成都凭吊司马相如奏《凤求凰》的琴台遗迹时所作。司马相如晚年退居茂陵，故这里以地名代之。首联是说尽管年华老去，多病缠身，司马相如对卓文君仍然怀着热烈的爱，引出颔联对他们年轻时代的追忆。二人不向世俗礼法屈服，开酒垆维持生计，诗人对他们非凡的勇气表示赞赏。诗人徘徊在琴台，对着暮霭碧云，暗自追怀。琴台旁美丽的野花，使作者联想到它仿佛是文君当年脸上的笑靥；嫩绿的蔓草，仿佛是文君昔日所着的碧罗裙，再现卓文君光彩照人的形象。尾联鲜明地点出主题，这种敢于挑战世俗，追求自由美好生活的精神，后世再无人继之了。\n注释：\n[1]琴台：汉代司马相如弹琴遇见卓文君的地方。\n[2]茂陵：司马相如生病后住在茂陵。\n[3]卓文君：汉代的才女，与司马相如相识相爱。\n[4]宝靥（yè）：笑脸。", "english": "The lutist ill but fine\nStill loved the phenix proud.\nIn their shop they sold wine;\nHe played lute for the cloud.\nHer dimple in full bloom,\nAnd her skirt like grass green.\nWhere's the bride with her groom?\nNowhere can they be seen.", "poemType": "五言律诗", "poemTheme": "咏史怀古", "chineseHtml": "<p class=\"poem-lines\">茂陵<sup class=\"note-ref\">[2]</sup>多病后，<br>尚爱卓文君<sup class=\"note-ref\">[3]</sup>。<br>酒肆人间世，<br>琴台日暮云。<br>野花留宝靥<sup class=\"note-ref\">[4]</sup>，<br>蔓草见罗裙。<br>归凤求凰意，<br>寥寥不复闻。</p>\n<p class=\"prose\">此诗是杜甫晚年在成都凭吊司马相如奏《凤求凰》的琴台遗迹时所作。司马相如晚年退居茂陵，故这里以地名代之。首联是说尽管年华老去，多病缠身，司马相如对卓文君仍然怀着热烈的爱，引出颔联对他们年轻时代的追忆。二人不向世俗礼法屈服，开酒垆维持生计，诗人对他们非凡的勇气表示赞赏。</p>\n<p class=\"prose\">诗人徘徊在琴台，对着暮霭碧云，暗自追怀。琴台旁美丽的野花，使作者联想到它仿佛是文君当年脸上的笑靥；嫩绿的蔓草，仿佛是文君昔日所着的碧罗裙，再现卓文君光彩照人的形象。尾联鲜明地点出主题，这种敢于挑战世俗，追求自由美好生活的精神，后世再无人继之了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]琴台：汉代司马相如弹琴遇见卓文君的地方。<br>[2]茂陵：司马相如生病后住在茂陵。<br>[3]卓文君：汉代的才女，与司马相如相识相爱。<br>[4]宝靥（yè）：笑脸。</p>", "englishHtml": "<p class=\"poem-lines\">The lutist ill but fine<br>Still loved the phenix proud.<br>In their shop they sold wine;<br>He played lute for the cloud.<br>Her dimple in full bloom,<br>And her skirt like grass green.<br>Where&#x27;s the bride with her groom?<br>Nowhere can they be seen.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Wooing Lutist,” the poem looks back at history, using the past to intensify the speaker&#x27;s present emotion.</p>\n<p class=\"commentary\">As a five-character regulated verse, it uses historical distance to make ambition and loss feel more dramatic. Key images such as clouds, flowers, wine, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "059", "zhTitle": "水槛遣心 （二首其一）", "enTitle": "Waterside Hermitage ( I )", "chinese": "水槛[1]遣心\n（二首其一）\n去郭[2]轩楹[3]敞，\n无村眺望赊[4]。\n澄江平少岸，\n幽树晚多花。\n细雨鱼儿出，\n微风燕子斜。\n城中十万户，\n此地两三家。\n此诗大约作于公元761年。一番经营后，草堂园亩扩展了，树木多了。水亭旁，还添了专供垂钓、眺望的水槛。诗人这一时期的生活是安定闲适的。由于远离城郭，旁无村落，所以轩楹宽敞，视野开阔，良辰美景一览无余。上涨的江水碧澄清澈，几乎与岸齐平了，所以看不到江边堤面；树木郁郁葱葱，繁花竞相开放，在幽暗的黄昏中，散发出缕缕清香。细雨中鱼儿戏水，微风中燕子斜飞，这是历来为人传诵的名句。这一刻，诗人不只是热爱自然，更是融入于自然，故如此自然天成而不露雕琢之痕。这里只闲居着两三户人家，所以没有城中的喧嚣，也是诗人“风景这边独好”之感的由衷抒发。\n注释：\n[1]水槛（jiàn）：水亭的栏杆。\n[2]去郭：远离城郭。\n[3]轩楹：廊柱，此处指草堂的建筑物。\n[4]赊（shē）：长，远。", "english": "Waterside Hermitage\n(I)\nFar from the town, my garden's wide;\nNo hut in view, I gaze afar.\nClear water levels riverside;\nAt dusk blooms look like star on star.\nSee fish emerge when rain is light,\nAnd flying swallow clip the breeze.\nTownhouse on townhouse out of sight,\nI live in hermitage with ease.", "poemType": "五言古诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">水槛<sup class=\"note-ref\">[1]</sup>遣心<br>（二首其一）<br>去郭<sup class=\"note-ref\">[2]</sup>轩楹<sup class=\"note-ref\">[3]</sup>敞，<br>无村眺望赊<sup class=\"note-ref\">[4]</sup>。<br>澄江平少岸，<br>幽树晚多花。<br>细雨鱼儿出，<br>微风燕子斜。<br>城中十万户，<br>此地两三家。</p>\n<p class=\"prose\">此诗大约作于公元761年。一番经营后，草堂园亩扩展了，树木多了。水亭旁，还添了专供垂钓、眺望的水槛。诗人这一时期的生活是安定闲适的。由于远离城郭，旁无村落，所以轩楹宽敞，视野开阔，良辰美景一览无余。上涨的江水碧澄清澈，几乎与岸齐平了，所以看不到江边堤面；</p>\n<p class=\"prose\">树木郁郁葱葱，繁花竞相开放，在幽暗的黄昏中，散发出缕缕清香。细雨中鱼儿戏水，微风中燕子斜飞，这是历来为人传诵的名句。这一刻，诗人不只是热爱自然，更是融入于自然，故如此自然天成而不露雕琢之痕。这里只闲居着两三户人家，所以没有城中的喧嚣，也是诗人“风景这边独好”之感的由衷抒发。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]水槛（jiàn）：水亭的栏杆。<br>[2]去郭：远离城郭。<br>[3]轩楹：廊柱，此处指草堂的建筑物。<br>[4]赊（shē）：长，远。</p>", "englishHtml": "<p class=\"poem-lines\">Waterside Hermitage(I)<br>Far from the town, my garden&#x27;s wide;<br>No hut in view, I gaze afar.<br>Clear water levels riverside;<br>At dusk blooms look like star on star.<br>See fish emerge when rain is light,<br>And flying swallow clip the breeze.<br>Townhouse on townhouse out of sight,<br>I live in hermitage with ease.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Waterside Hermitage ( I ),” the poem presents retreat or solitude as a way to stand apart from worldly pressure.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water, flowers, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "060", "zhTitle": "茅屋为秋风所破歌", "enTitle": "My Cottage Unroofed by Autumn Gales", "chinese": "八月秋高风怒号，\n卷我屋上三重茅[1]。\n茅飞渡江洒江郊，\n高者挂罥[2]长林梢，\n下者飘转沉塘坳[3]。\n南村群童欺我老无力，\n忍能对面为盗贼。\n公然抱茅入竹去，\n唇焦口燥呼不得，\n归来倚杖自叹息。\n俄顷风定云墨色，\n秋天漠漠向昏黑。\n布衾多年冷似铁，\n娇儿恶卧踏里裂。\n床头屋漏无干处，\n雨脚如麻未断绝。\n自经丧乱少睡眠，\n长夜沾湿何由彻[4]！\n安得广厦[5]千万间，\n大庇[6]天下寒士俱欢颜，\n风雨不动安如山！\n呜呼！\n何时眼前突兀[7]见此屋，\n吾庐独破受冻死亦足！\n公元760年八月，风雨交加，风把杜甫草堂屋顶上的茅草吹走，雨从破屋顶上漏下来，于是诗人就写了这一首《茅屋为秋风所破歌》。全诗可以分为四节：第一节五句，句句押韵，音响宏大，读来如闻秋风咆哮。第二节五句，写村童穷苦，抱狂风吹落的茅草而去，诗人心急如焚，但又无可奈何。第三节八句，写屋破又遭连夜雨的苦况。第四节五句，一、三句七字，二、五、六句九字，长句气势磅礴，由个人的艰苦联想到天下的寒士，迸发出奔放的激情和热烈的希望，显示了诗人博大的胸怀和崇高的理想。\n注释：\n[1]三重（chónɡ）茅：几层的茅草。\n[2]挂罥（juàn）：挂着。\n[3]塘坳（ào）：池塘。\n[4]何由彻：怎样支撑到早晨天亮。\n[5]广厦（shà）：宽敞高大的房屋。\n[6]大庇：全部遮盖起来。\n[7]突兀：形容房屋高高耸立的样子。", "english": "In the eighth moon the autumn gales furiously howl;\nThey roll up three layers of straw from my thatched bower.\nThe straw flies across the river and spreads in shower,\nSome hanging knotted on the tops of trees that tower,\nSome swirling down and sinking into water foul.\nUrchins from southern village know I'm old and weak,\nThey rob me to my face without a blush on the cheek,\nAnd holding armfuls of straw, into bamboos they sneak.\nIn vain I call them till my lips are parched and dry;\nAgain alone, I lean on my cane and sigh.\nShortly the gale subsides and clouds turn dark as ink;\nThe autumn skies are shrouded and in darkness sink.\nMy cotton quilt is cold, for years it has been worn;\nMy restless children kick in sleep and it is torn.\nThe roof leaks o'er beds, leaving no corner dry;\nWithout cease the rain falls thick and fast from the sky.\nAfter the troubled times troubled has been my sleep.\nWet through, how can I pass the night so long, so deep!\nCould I get mansions covering ten thousand miles,\nI'd house all scholars poor and make them beam with smiles.\nIn wind and rain these mansions would stand like mountains high.\nAlas! Should these houses appear before my eye,\nFrozen in my unroofed cot, content I'd die.", "poemType": "乐府/古体", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">八月秋高风怒号，<br>卷我屋上三重茅<sup class=\"note-ref\">[1]</sup>。<br>茅飞渡江洒江郊，<br>高者挂罥<sup class=\"note-ref\">[2]</sup>长林梢，<br>下者飘转沉塘坳<sup class=\"note-ref\">[3]</sup>。<br>南村群童欺我老无力，<br>忍能对面为盗贼。<br>公然抱茅入竹去，<br>唇焦口燥呼不得，<br>归来倚杖自叹息。<br>俄顷风定云墨色，<br>秋天漠漠向昏黑。<br>布衾多年冷似铁，<br>娇儿恶卧踏里裂。<br>床头屋漏无干处，<br>雨脚如麻未断绝。<br>自经丧乱少睡眠，<br>长夜沾湿何由彻<sup class=\"note-ref\">[4]</sup>！<br>安得广厦<sup class=\"note-ref\">[5]</sup>千万间，<br>大庇<sup class=\"note-ref\">[6]</sup>天下寒士俱欢颜，<br>风雨不动安如山！<br>呜呼！<br>何时眼前突兀<sup class=\"note-ref\">[7]</sup>见此屋，<br>吾庐独破受冻死亦足！</p>\n<p class=\"prose\">公元760年八月，风雨交加，风把杜甫草堂屋顶上的茅草吹走，雨从破屋顶上漏下来，于是诗人就写了这一首《茅屋为秋风所破歌》。全诗可以分为四节：第一节五句，句句押韵，音响宏大，读来如闻秋风咆哮。第二节五句，写村童穷苦，抱狂风吹落的茅草而去，诗人心急如焚，但又无可奈何。</p>\n<p class=\"prose\">第三节八句，写屋破又遭连夜雨的苦况。第四节五句，一、三句七字，二、五、六句九字，长句气势磅礴，由个人的艰苦联想到天下的寒士，迸发出奔放的激情和热烈的希望，显示了诗人博大的胸怀和崇高的理想。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]三重（chónɡ）茅：几层的茅草。<br>[2]挂罥（juàn）：挂着。<br>[3]塘坳（ào）：池塘。<br>[4]何由彻：怎样支撑到早晨天亮。<br>[5]广厦（shà）：宽敞高大的房屋。<br>[6]大庇：全部遮盖起来。<br>[7]突兀：形容房屋高高耸立的样子。</p>", "englishHtml": "<p class=\"poem-lines\">In the eighth moon the autumn gales furiously howl;<br>They roll up three layers of straw from my thatched bower.<br>The straw flies across the river and spreads in shower,<br>Some hanging knotted on the tops of trees that tower,<br>Some swirling down and sinking into water foul.<br>Urchins from southern village know I&#x27;m old and weak,<br>They rob me to my face without a blush on the cheek,<br>And holding armfuls of straw, into bamboos they sneak.<br>In vain I call them till my lips are parched and dry;<br>Again alone, I lean on my cane and sigh.<br>Shortly the gale subsides and clouds turn dark as ink;<br>The autumn skies are shrouded and in darkness sink.<br>My cotton quilt is cold, for years it has been worn;<br>My restless children kick in sleep and it is torn.<br>The roof leaks o&#x27;er beds, leaving no corner dry;<br>Without cease the rain falls thick and fast from the sky.<br>After the troubled times troubled has been my sleep.<br>Wet through, how can I pass the night so long, so deep!<br>Could I get mansions covering ten thousand miles,<br>I&#x27;d house all scholars poor and make them beam with smiles.<br>In wind and rain these mansions would stand like mountains high.<br>Alas! Should these houses appear before my eye,<br>Frozen in my unroofed cot, content I&#x27;d die.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “My Cottage Unroofed by Autumn Gales,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, moonlight, and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "061", "zhTitle": "赠花卿", "enTitle": "To General Hua", "chinese": "锦城[1]丝管[2]日纷纷[3]，\n半入江[4]风半入云。\n此曲只应天上有，\n人间能得几回闻？\n花卿是花敬定，成都尹的部将，但是居功自傲，目无朝廷，僭用天子的音乐，所以杜甫这首诗对他进行了委婉的讽刺。开始说的“锦城”就是成都，“丝管”指的是管弦乐器，“日纷纷”是说日日演奏，音乐从花卿家里随风飞到锦江之上白云之间去了。前两句是实写，读来仿佛是对乐曲的赞美，其实有言外之意。后两句是虚写，说此曲只应天上有，而“天上”暗指天子。既然是天子用的音乐，人间的大臣怎么可以僭用呢？这不合乎礼制，在当时简直是大逆不道。所以这首诗和《丽人行》一样是寓讽于谀的。\n注释：\n[1]锦城：成都。\n[2]丝管：弦乐和管乐。\n[3]纷纷：形容多。\n[4]江：指成都的锦江。", "english": "With songs from day to day the Town of Silk is loud;\nThey waft with winds across the streams into the cloud.\nSuch music can be heard but in celestial spheres.\nHow many times has it been played for human ears?", "poemType": "七言绝句", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">锦城<sup class=\"note-ref\">[1]</sup>丝管<sup class=\"note-ref\">[2]</sup>日纷纷<sup class=\"note-ref\">[3]</sup>，<br>半入江<sup class=\"note-ref\">[4]</sup>风半入云。<br>此曲只应天上有，<br>人间能得几回闻？</p>\n<p class=\"prose\">花卿是花敬定，成都尹的部将，但是居功自傲，目无朝廷，僭用天子的音乐，所以杜甫这首诗对他进行了委婉的讽刺。开始说的“锦城”就是成都，“丝管”指的是管弦乐器，“日纷纷”是说日日演奏，音乐从花卿家里随风飞到锦江之上白云之间去了。</p>\n<p class=\"prose\">前两句是实写，读来仿佛是对乐曲的赞美，其实有言外之意。后两句是虚写，说此曲只应天上有，而“天上”暗指天子。既然是天子用的音乐，人间的大臣怎么可以僭用呢？这不合乎礼制，在当时简直是大逆不道。所以这首诗和《丽人行》一样是寓讽于谀的。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]锦城：成都。<br>[2]丝管：弦乐和管乐。<br>[3]纷纷：形容多。<br>[4]江：指成都的锦江。</p>", "englishHtml": "<p class=\"poem-lines\">With songs from day to day the Town of Silk is loud;<br>They waft with winds across the streams into the cloud.<br>Such music can be heard but in celestial spheres.<br>How many times has it been played for human ears?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “To General Hua,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "062", "zhTitle": "不见", "enTitle": "Longing for Li Bai", "chinese": "不见李生[1]久，\n佯狂[2]真可哀。\n世人皆欲杀，\n吾意独怜才[3]。\n敏捷诗千首，\n飘零酒一杯。\n匡山读书处，\n头白好归来。\n这首诗写于客居成都初期，或许此时诗人辗转得知李白已在流放途中获释，故有感而作，此时自二人分别已16年。起首便言不见日久，并对李白只能以佯狂纵酒来表示对污浊世俗的不满感到深深的悲哀。当道朝廷的政客，都欲将其除之而后快，诗人对李白的遭遇满怀悲愤和同情，而诗人自己因疏救房琯被逐出朝廷，所以他非常理解李白的冤屈和苦衷，有与其同病相怜之意。诗人赞李白才思敏捷，风华盖世，又叹其只能一生飘零，借酒消愁。所有的叹息和怀念，最后化为深切的呼唤。匡山位于四川境内，李白年少时曾读书于此，所以是叶落归根的好去处，而这时诗人客居成都，李白归来就能相见。诗以相见的渴望结尾，首尾呼应，抒发肝胆相照的深厚感情。次年，李白客死当涂，此诗遂成千古长叹。\n注释：\n[1]李生：指李白。\n[2]佯（yánɡ）狂：故作颠狂的样子。\n[3]怜才：爱惜有才之人。", "english": "I have not seen Li Bai for long,\nMen of the world have done him wrong.\nHe can't but pretend to be mad.\nHow could a talent turn so sad!\nAt once he can write line on line;\nWhat he asks for is cups of wine.\nCome back to read, oh! in the height,\nLet age snow on your head hair white!", "poemType": "五言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">不见李生<sup class=\"note-ref\">[1]</sup>久，<br>佯狂<sup class=\"note-ref\">[2]</sup>真可哀。<br>世人皆欲杀，<br>吾意独怜才<sup class=\"note-ref\">[3]</sup>。<br>敏捷诗千首，<br>飘零酒一杯。<br>匡山读书处，<br>头白好归来。</p>\n<p class=\"prose\">这首诗写于客居成都初期，或许此时诗人辗转得知李白已在流放途中获释，故有感而作，此时自二人分别已16年。起首便言不见日久，并对李白只能以佯狂纵酒来表示对污浊世俗的不满感到深深的悲哀。当道朝廷的政客，都欲将其除之而后快，诗人对李白的遭遇满怀悲愤和同情，而诗人自己因疏救房琯被逐出朝廷，所以他非常理解李白的冤屈和苦衷，有与其同病相怜之意。</p>\n<p class=\"prose\">诗人赞李白才思敏捷，风华盖世，又叹其只能一生飘零，借酒消愁。所有的叹息和怀念，最后化为深切的呼唤。匡山位于四川境内，李白年少时曾读书于此，所以是叶落归根的好去处，而这时诗人客居成都，李白归来就能相见。诗以相见的渴望结尾，首尾呼应，抒发肝胆相照的深厚感情。</p>\n<p class=\"prose\">次年，李白客死当涂，此诗遂成千古长叹。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]李生：指李白。<br>[2]佯（yánɡ）狂：故作颠狂的样子。<br>[3]怜才：爱惜有才之人。</p>", "englishHtml": "<p class=\"poem-lines\">I have not seen Li Bai for long,<br>Men of the world have done him wrong.<br>He can&#x27;t but pretend to be mad.<br>How could a talent turn so sad!<br>At once he can write line on line;<br>What he asks for is cups of wine.<br>Come back to read, oh! in the height,<br>Let age snow on your head hair white!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Longing for Li Bai,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as mountains, wine, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "063", "zhTitle": "江畔独步寻花 （七首其六）", "enTitle": "Strolling Alone among Flowers by Riverside ( VI )", "chinese": "江畔独步寻花\n（七首其六）\n黄四娘[1]家花满蹊[2]，\n千朵万朵压枝低。\n留连戏蝶时时舞，\n自在娇莺恰恰啼。\n公元760年杜甫新建草堂，春暖花开的时候，独自沿着江畔散步，写了七首绝句，这里选的是第六首。开头一句点明寻花的地点，是到黄四娘家去的路上；人名入诗，有点民歌的味道。“花满蹊”后，再说“千朵万朵”，更具体化；说“压枝低”，更形象化。蝶舞莺歌则写花的芬芳鲜艳。“留连”既是蝶恋花，也是人恋花和蝶；“自在”也既指莺，又可指人。“恰恰啼”有两说：一说是莺啼声，一说唐人口语“恰恰”是正好的意思。最后两句对仗工稳，因难见巧，和《漫兴》相同，可见杜甫诗艺。\n注释：\n[1]黄四娘：杜甫的邻居。\n[2]蹊：小路。", "english": "Strolling Alone among Flowers by Riverside\n(VI)\nAlong the Yellow Path flowers are overgrown,\nThousands of them in full blossom weigh branches down.\nButterflies linger, now and then they dance along;\nGolden orioles warble with ease their timely song.", "poemType": "古体诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">江畔独步寻花<br>（七首其六）<br>黄四娘<sup class=\"note-ref\">[1]</sup>家花满蹊<sup class=\"note-ref\">[2]</sup>，<br>千朵万朵压枝低。<br>留连戏蝶时时舞，<br>自在娇莺恰恰啼。</p>\n<p class=\"prose\">公元760年杜甫新建草堂，春暖花开的时候，独自沿着江畔散步，写了七首绝句，这里选的是第六首。开头一句点明寻花的地点，是到黄四娘家去的路上；人名入诗，有点民歌的味道。“花满蹊”后，再说“千朵万朵”，更具体化；说“压枝低”，更形象化。</p>\n<p class=\"prose\">蝶舞莺歌则写花的芬芳鲜艳。“留连”既是蝶恋花，也是人恋花和蝶；“自在”也既指莺，又可指人。“恰恰啼”有两说：一说是莺啼声，一说唐人口语“恰恰”是正好的意思。最后两句对仗工稳，因难见巧，和《漫兴》相同，可见杜甫诗艺。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]黄四娘：杜甫的邻居。<br>[2]蹊：小路。</p>", "englishHtml": "<p class=\"poem-lines\">Strolling Alone among Flowers by Riverside(VI)<br>Along the Yellow Path flowers are overgrown,<br>Thousands of them in full blossom weigh branches down.<br>Butterflies linger, now and then they dance along;<br>Golden orioles warble with ease their timely song.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Strolling Alone among Flowers by Riverside ( VI ),” the poem presents retreat or solitude as a way to stand apart from worldly pressure.</p>\n<p class=\"commentary\">As a ancient-style poem, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water, flowers, birds, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "064", "zhTitle": "戏为[1]六绝句 （其二）", "enTitle": "Six Playful Quatrains ( II )", "chinese": "戏为[1]六绝句\n（其二）\n王杨卢骆当时体，\n轻薄为文哂[2]未休。\n尔曹身与名俱灭，\n不废江河万古流。\n《戏为六绝句》是杜甫的六首文艺批评诗，这里选的是第二首。“王杨卢骆”是初唐诗人中的四杰：王勃、杨炯、卢照邻、骆宾王。“当时体”是当时的文体。“轻薄为文”一说是指批评者轻薄，一说是批评者认为四杰轻薄。“哂未休”是不断地嗤笑。“尔曹”指批评者。“江河”则比喻四杰，说他们的文名会流传万古。这首绝句别开生面，在小诗中发大议论，是前所未有的。读来情味盎然，如闻其声，如见其人，无论嬉笑怒骂，都能给人亲切之感，而又耐人寻味。\n注释：\n[1]戏为：戏作。\n[2]哂（shěn）：讥笑。", "english": "Six Playful Quatrains\n(II)\nOur four great poets write in a creative way;\nYou shallow critics may make your remarks unfair.\nBut your bodies and souls will fall into decay.\nWhile their fame will last as the river flows fore'er.", "poemType": "古体诗", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">戏为<sup class=\"note-ref\">[1]</sup>六绝句（其二）<br>王杨卢骆当时体，<br>轻薄为文哂<sup class=\"note-ref\">[2]</sup>未休。<br>尔曹身与名俱灭，<br>不废江河万古流。</p>\n<p class=\"prose\">《戏为六绝句》是杜甫的六首文艺批评诗，这里选的是第二首。“王杨卢骆”是初唐诗人中的四杰：王勃、杨炯、卢照邻、骆宾王。“当时体”是当时的文体。“轻薄为文”一说是指批评者轻薄，一说是批评者认为四杰轻薄。“哂未休”是不断地嗤笑。</p>\n<p class=\"prose\">“尔曹”指批评者。“江河”则比喻四杰，说他们的文名会流传万古。这首绝句别开生面，在小诗中发大议论，是前所未有的。读来情味盎然，如闻其声，如见其人，无论嬉笑怒骂，都能给人亲切之感，而又耐人寻味。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]戏为：戏作。<br>[2]哂（shěn）：讥笑。</p>", "englishHtml": "<p class=\"poem-lines\">Six Playful Quatrains(II)<br>Our four great poets write in a creative way;<br>You shallow critics may make your remarks unfair.<br>But your bodies and souls will fall into decay.<br>While their fame will last as the river flows fore&#x27;er.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Six Playful Quatrains ( II ),” the poem turns a natural scene into a space of movement, wonder, and emotional release.</p>\n<p class=\"commentary\">As a ancient-style poem, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as water give the poem its visual texture and emotional temperature.</p>"}, {"num": "065", "zhTitle": "闻官军收河南河北", "enTitle": "Recapture of the Regions North and South of the Yellow River", "chinese": "剑外[1]忽传收蓟北，\n初闻涕泪满衣裳。\n却看[2]妻子愁何在，\n漫卷诗书喜欲狂。\n白首放歌须[3]纵酒，\n青春[4]作伴好还乡。\n即从巴峡[5]穿巫峡，\n便下襄阳向洛阳。\n公元762年冬天，唐军在洛阳附近打败了叛军，收复了黄河以南的地区，第二年春天，又收复了黄河以北的地区。杜甫这时还在剑门关外，听到消息，悲喜交集，就写了这首“生平第一快诗”。这种又惊又喜的情感洪流，只用“涕泪满衣裳”五个字来以形写神。接着又用“却看妻子”和“漫卷诗书”两个动作，引出“喜欲狂”的主题。下面再用“放歌”“纵酒”来进一步写“喜欲狂”的具体表现。“青春作伴”是指春天全家结伴还乡的狂想。最后一联包含四个地名：巴峡和巫峡、襄阳和洛阳，既有句内上下对，又有句外前后对，形成了工整的对仗。文势、音调迅急犹如闪电，表现了想象的飞驰。仇兆鳌在《杜少陵集评注》中引王嗣奭的话说：“此诗句句有喜跃意，一气流注，而曲折尽情，绝无妆点，愈朴愈真，他人决不能道。”\n注释：\n[1]剑外：剑门关外。\n[2]却看：回头看。\n[3]须：应当。\n[4]青春：春天青葱的景色。\n[5]巴峡：推测是西陵峡。", "english": "’Tis said the Northern Gate is recaptured of late;\nWhen the news reach my ears, my gown is wet with tears.\nStaring at my wife's face, of grief I find no trace;\nRolling up my verse books, my joy like madness looks.\nThough I am white-haired, still I'd sing and drink my fill.\nWith verdure spring's aglow, 'tis time we homeward go.\nWe shall sail all the way through Three Gorges in a day.\nGoing down to Xiangyang, we'll come up to Luoyang.", "poemType": "七言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">剑外<sup class=\"note-ref\">[1]</sup>忽传收蓟北，<br>初闻涕泪满衣裳。<br>却看<sup class=\"note-ref\">[2]</sup>妻子愁何在，<br>漫卷诗书喜欲狂。<br>白首放歌须<sup class=\"note-ref\">[3]</sup>纵酒，<br>青春<sup class=\"note-ref\">[4]</sup>作伴好还乡。<br>即从巴峡<sup class=\"note-ref\">[5]</sup>穿巫峡，<br>便下襄阳向洛阳。</p>\n<p class=\"prose\">公元762年冬天，唐军在洛阳附近打败了叛军，收复了黄河以南的地区，第二年春天，又收复了黄河以北的地区。杜甫这时还在剑门关外，听到消息，悲喜交集，就写了这首“生平第一快诗”。这种又惊又喜的情感洪流，只用“涕泪满衣裳”五个字来以形写神。</p>\n<p class=\"prose\">接着又用“却看妻子”和“漫卷诗书”两个动作，引出“喜欲狂”的主题。下面再用“放歌”“纵酒”来进一步写“喜欲狂”的具体表现。“青春作伴”是指春天全家结伴还乡的狂想。最后一联包含四个地名：巴峡和巫峡、襄阳和洛阳，既有句内上下对，又有句外前后对，形成了工整的对仗。</p>\n<p class=\"prose\">文势、音调迅急犹如闪电，表现了想象的飞驰。仇兆鳌在《杜少陵集评注》中引王嗣奭的话说：“此诗句句有喜跃意，一气流注，而曲折尽情，绝无妆点，愈朴愈真，他人决不能道。”</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]剑外：剑门关外。<br>[2]却看：回头看。<br>[3]须：应当。<br>[4]青春：春天青葱的景色。<br>[5]巴峡：推测是西陵峡。</p>", "englishHtml": "<p class=\"poem-lines\">’Tis said the Northern Gate is recaptured of late;<br>When the news reach my ears, my gown is wet with tears.<br>Staring at my wife&#x27;s face, of grief I find no trace;<br>Rolling up my verse books, my joy like madness looks.<br>Though I am white-haired, still I&#x27;d sing and drink my fill.<br>With verdure spring&#x27;s aglow, &#x27;tis time we homeward go.<br>We shall sail all the way through Three Gorges in a day.<br>Going down to Xiangyang, we&#x27;ll come up to Luoyang.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Recapture of the Regions North and South of the Yellow River,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as wine, homecoming, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "066", "zhTitle": "送路六侍御入朝", "enTitle": "Seeing Secretary Lu off to Court", "chinese": "童稚[1]情亲四十年，\n中间消息两茫然。\n更为后会知何地？\n忽漫[2]相逢是别筵[3]！\n不分[4]桃花红似锦，\n生憎柳絮白于棉。\n剑南春色还无赖，\n触忤[5]愁人到酒边。\n这首诗作于公元763年春，这年正月，唐军收复幽燕，历经八年的安史之乱结束。但是动荡的时局并未因此平息，诗人早日还乡的愿望破灭。这首诗借聚合离散之情，写迟暮飘零的身世之感。儿时的旧友40年未见，又值动荡乱世，消息不通，然而孩提时的纯真友情并未归于淡忘。时间是这样的久，没能想到今生会有重新相见的一天，本是值得高兴的事，然而乍一相逢，即是別宴。转折之大，使相逢之喜尽化万千愁思。分别时都是孩提，再见面已然迟暮，又身处乱世，一切都无从说起，更知后会无期。眼前春色分明，诗人却恼春色无赖，触忤愁人。诗人将生死离别，离怀难遣表现得沉郁苍凉。\n注释：\n[1]童稚：小孩。\n[2]忽漫：忽然。\n[3]别筵（yán）：饯别的筵席。\n[4]不分：忿忿不满。\n[5]触忤（wǔ）：冒犯。", "english": "We were companions forty years ago.\nWhat happened to us since then we don't know.\nNow we meet again but only to part.\nWhere to renew our friendship grieves my heart.\nI do not like peach blossoms red and bright,\nNor willow down like cotton soft and white.\nWhy should spring annoy me with scenes so fine?\nWhat could the annoyed one do but drink wine?", "poemType": "七言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">童稚<sup class=\"note-ref\">[1]</sup>情亲四十年，<br>中间消息两茫然。<br>更为后会知何地？<br>忽漫<sup class=\"note-ref\">[2]</sup>相逢是别筵<sup class=\"note-ref\">[3]</sup>！<br>不分<sup class=\"note-ref\">[4]</sup>桃花红似锦，<br>生憎柳絮白于棉。<br>剑南春色还无赖，<br>触忤<sup class=\"note-ref\">[5]</sup>愁人到酒边。</p>\n<p class=\"prose\">这首诗作于公元763年春，这年正月，唐军收复幽燕，历经八年的安史之乱结束。但是动荡的时局并未因此平息，诗人早日还乡的愿望破灭。这首诗借聚合离散之情，写迟暮飘零的身世之感。儿时的旧友40年未见，又值动荡乱世，消息不通，然而孩提时的纯真友情并未归于淡忘。</p>\n<p class=\"prose\">时间是这样的久，没能想到今生会有重新相见的一天，本是值得高兴的事，然而乍一相逢，即是別宴。转折之大，使相逢之喜尽化万千愁思。分别时都是孩提，再见面已然迟暮，又身处乱世，一切都无从说起，更知后会无期。眼前春色分明，诗人却恼春色无赖，触忤愁人。</p>\n<p class=\"prose\">诗人将生死离别，离怀难遣表现得沉郁苍凉。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]童稚：小孩。<br>[2]忽漫：忽然。<br>[3]别筵（yán）：饯别的筵席。<br>[4]不分：忿忿不满。<br>[5]触忤（wǔ）：冒犯。</p>", "englishHtml": "<p class=\"poem-lines\">We were companions forty years ago.<br>What happened to us since then we don&#x27;t know.<br>Now we meet again but only to part.<br>Where to renew our friendship grieves my heart.<br>I do not like peach blossoms red and bright,<br>Nor willow down like cotton soft and white.<br>Why should spring annoy me with scenes so fine?<br>What could the annoyed one do but drink wine?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seeing Secretary Lu off to Court,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as flowers, trees, and wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "067", "zhTitle": "别房太尉[1]墓", "enTitle": "At the Graveyard of Former Prime Minister Fang", "chinese": "他乡复行役[2]，\n驻马别孤坟。\n近泪无干土，\n低空有断云。\n对棋陪谢傅[3]，\n把剑觅徐君。\n唯见林花落，\n莺啼送客闻。\n房太尉即房琯，唐玄宗入蜀时拜相，为人正直，后为唐肃宗所贬。杜甫曾毅然上疏力谏，结果得罪肃宗，几遭刑戮。房琯罢相后，于公元763年拜特进、刑部尚书。在路遇疾，卒于阆州。两年后杜甫经过此地，写此悼亡之作。诗人四处奔波，风尘仆仆，来到孤坟前。从侧面反映了房琯晚年的坎坷和身后的凄凉。诗人在坟前洒下许多伤悼之泪，以至于身旁周围的土都湿润了。让诗人痛哭流涕的不仅是对逝者的哀伤，也是对自身受尽苦楚而难以言表的悲痛。天低云断，空气里弥漫着愁惨凝滞之感。“对棋”句中，谢傅指东晋名将谢安，生前拜太傅，爱下围棋，借指房琯。“把剑”句用了一个典故，《说苑》载：吴季札聘晋过徐国，心知徐君爱其宝剑，等到他回来的时候，徐君已经去世，于是解剑挂在徐君坟前的树上而去。诗人以谢安的儒雅风流喻房琯，以延陵季子自比，表示对亡友的深情厚谊，虽死不忘。结尾营造一个幽静肃穆的氛围，显得余韵悠扬不尽。\n注释：\n[1]房太尉：房琯，杜甫好友。官拜刑部尚书，病逝后追赠太尉。\n[2]复行役：一再地奔波。\n[3]谢傅：指谢安。", "english": "Being on journey in a foreign land,\nI stop my steed at your tomb and still stand.\nWet with tears, no soil in the yard is dry,\nEven broken clouds would weep in the sky.\nYou might play chess with General Xie at ease;\nI'd hang my sword in your yard green with trees.\nI have only fallen flowers in view\nTo hear orioles sing their song of adieu.", "poemType": "五言律诗", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">他乡复行役<sup class=\"note-ref\">[2]</sup>，<br>驻马别孤坟。<br>近泪无干土，<br>低空有断云。<br>对棋陪谢傅<sup class=\"note-ref\">[3]</sup>，<br>把剑觅徐君。<br>唯见林花落，<br>莺啼送客闻。</p>\n<p class=\"prose\">房太尉即房琯，唐玄宗入蜀时拜相，为人正直，后为唐肃宗所贬。杜甫曾毅然上疏力谏，结果得罪肃宗，几遭刑戮。房琯罢相后，于公元763年拜特进、刑部尚书。在路遇疾，卒于阆州。两年后杜甫经过此地，写此悼亡之作。诗人四处奔波，风尘仆仆，来到孤坟前。</p>\n<p class=\"prose\">从侧面反映了房琯晚年的坎坷和身后的凄凉。诗人在坟前洒下许多伤悼之泪，以至于身旁周围的土都湿润了。让诗人痛哭流涕的不仅是对逝者的哀伤，也是对自身受尽苦楚而难以言表的悲痛。天低云断，空气里弥漫着愁惨凝滞之感。“对棋”句中，谢傅指东晋名将谢安，生前拜太傅，爱下围棋，借指房琯。</p>\n<p class=\"prose\">“把剑”句用了一个典故，《说苑》载：吴季札聘晋过徐国，心知徐君爱其宝剑，等到他回来的时候，徐君已经去世，于是解剑挂在徐君坟前的树上而去。诗人以谢安的儒雅风流喻房琯，以延陵季子自比，表示对亡友的深情厚谊，虽死不忘。结尾营造一个幽静肃穆的氛围，显得余韵悠扬不尽。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]房太尉：房琯，杜甫好友。官拜刑部尚书，病逝后追赠太尉。<br>[2]复行役：一再地奔波。<br>[3]谢傅：指谢安。</p>", "englishHtml": "<p class=\"poem-lines\">Being on journey in a foreign land,<br>I stop my steed at your tomb and still stand.<br>Wet with tears, no soil in the yard is dry,<br>Even broken clouds would weep in the sky.<br>You might play chess with General Xie at ease;<br>I&#x27;d hang my sword in your yard green with trees.<br>I have only fallen flowers in view<br>To hear orioles sing their song of adieu.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “At the Graveyard of Former Prime Minister Fang,” the poem is shaped by parting, but the farewell opens into a larger landscape of freedom and distance.</p>\n<p class=\"commentary\">As a five-character regulated verse, it makes farewell feel expansive rather than merely sad. Key images such as clouds, flowers, birds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "068", "zhTitle": "登楼", "enTitle": "On a Tower", "chinese": "花近高楼伤客心，\n万方多难此登临。\n锦江春色来天地，\n玉垒浮云变古今[1]。\n北极朝廷终不改，\n西山[2]寇盗莫相侵。\n可怜后主还祠庙，\n日暮聊为[3]梁甫吟[4]。\n公元764年十月，杜甫客居成都已有五年。那时吐蕃攻陷长安，所以诗人写《登楼》时，说到“万方多难”和“西山寇盗”，甚至连登楼看花也感到伤心了。于是诗人凭楼远望，看见锦江春水从天边汹涌而来，玉垒山上的浮云忽聚忽散，正像从古到今的人世变幻一样。这两句一句写水，向空间开阔视野；一句写云，就时间驰骋遐思。诗人不免起了忧国忧民之心，又从所见转到所想，希望大唐王朝如北极星一样永放光芒，希望西边的吐蕃不要兴兵入侵。但是皇帝昏庸，很像西蜀亡国之君刘后主，而自己却空怀济世之心，苦无献身之路，只能学诸葛亮诵《梁甫吟》了。全诗融自然景象、国家灾难、个人情思为一体，所以沈德潜说：“气象雄伟，笼盖宇宙，此杜诗之最上者。”\n注释：\n[1]变古今：与古今一同变化。\n[2]西山：和吐蕃交界处的雪山，位于今四川省西部。\n[3]聊为：不甘心这样做但还是这样做。\n[4]梁甫吟：相传为诸葛亮所作古乐府曲名。", "english": "It breaks my heart to see blooming trees near the tower.\nThe country torn apart, could I admire the flower?\nSpring comes from sky on earth and greens River Brocade,\nThe world changes now as then like white cloud o'er Mount Jade.\nO royal court, like polar star remain the same!\nInvaders from the west, don't put our land in flame!\nI'm sad to see the temple of the conquered king.\nAt dusk in praise of his minister I would sing.", "poemType": "七言律诗", "poemTheme": "登临抒怀", "chineseHtml": "<p class=\"poem-lines\">花近高楼伤客心，<br>万方多难此登临。<br>锦江春色来天地，<br>玉垒浮云变古今<sup class=\"note-ref\">[1]</sup>。<br>北极朝廷终不改，<br>西山<sup class=\"note-ref\">[2]</sup>寇盗莫相侵。<br>可怜后主还祠庙，<br>日暮聊为<sup class=\"note-ref\">[3]</sup>梁甫吟<sup class=\"note-ref\">[4]</sup>。</p>\n<p class=\"prose\">公元764年十月，杜甫客居成都已有五年。那时吐蕃攻陷长安，所以诗人写《登楼》时，说到“万方多难”和“西山寇盗”，甚至连登楼看花也感到伤心了。于是诗人凭楼远望，看见锦江春水从天边汹涌而来，玉垒山上的浮云忽聚忽散，正像从古到今的人世变幻一样。</p>\n<p class=\"prose\">这两句一句写水，向空间开阔视野；一句写云，就时间驰骋遐思。诗人不免起了忧国忧民之心，又从所见转到所想，希望大唐王朝如北极星一样永放光芒，希望西边的吐蕃不要兴兵入侵。但是皇帝昏庸，很像西蜀亡国之君刘后主，而自己却空怀济世之心，苦无献身之路，只能学诸葛亮诵《梁甫吟》了。</p>\n<p class=\"prose\">全诗融自然景象、国家灾难、个人情思为一体，所以沈德潜说：“气象雄伟，笼盖宇宙，此杜诗之最上者。”</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]变古今：与古今一同变化。<br>[2]西山：和吐蕃交界处的雪山，位于今四川省西部。<br>[3]聊为：不甘心这样做但还是这样做。<br>[4]梁甫吟：相传为诸葛亮所作古乐府曲名。</p>", "englishHtml": "<p class=\"poem-lines\">It breaks my heart to see blooming trees near the tower.<br>The country torn apart, could I admire the flower?<br>Spring comes from sky on earth and greens River Brocade,<br>The world changes now as then like white cloud o&#x27;er Mount Jade.<br>O royal court, like polar star remain the same!<br>Invaders from the west, don&#x27;t put our land in flame!<br>I&#x27;m sad to see the temple of the conquered king.<br>At dusk in praise of his minister I would sing.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On a Tower,” the poem uses the act of looking from a height to enlarge both the landscape and the speaker&#x27;s inner pressure.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, water, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "069", "zhTitle": "绝句 （二首其一）", "enTitle": "Quatrains ( I )", "chinese": "绝句\n（二首其一）\n迟日江山丽，\n春风花草香。\n泥融[1]飞燕子，\n沙暖睡鸳鸯。\n这一首五言绝句写于成都草堂。第一句“迟日”指春日，语出《诗经·七月》的“春日迟迟”，在这里可以理解为春日迟迟停留，舍不得离开秀丽的江山；春风一吹，花草生香，使江山更加秀丽。阳光普照，泥融土湿，燕子飞来衔泥筑巢；日照沙暖，鸳鸯成对成双，静卧洲上。全诗四句，通篇对仗，分写风和日暖、花草鸳鸯，是一幅色彩鲜明、生意勃发的初春景物图。\n注释：\n[1]泥融：形容泥土湿润。", "english": "Quatrains\n(I)\nOver a beautiful scene the sun is lingering,\nAlive with birds and sweet with breath of early spring.\nTo pick the thawing sod a pair of swallows fly;\nBasking on the warm sand, two by two lovebirds lie.", "poemType": "古体诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">绝句<br>（二首其一）<br>迟日江山丽，<br>春风花草香。<br>泥融<sup class=\"note-ref\">[1]</sup>飞燕子，<br>沙暖睡鸳鸯。</p>\n<p class=\"prose\">这一首五言绝句写于成都草堂。第一句“迟日”指春日，语出《诗经·七月》的“春日迟迟”，在这里可以理解为春日迟迟停留，舍不得离开秀丽的江山；春风一吹，花草生香，使江山更加秀丽。阳光普照，泥融土湿，燕子飞来衔泥筑巢；日照沙暖，鸳鸯成对成双，静卧洲上。</p>\n<p class=\"prose\">全诗四句，通篇对仗，分写风和日暖、花草鸳鸯，是一幅色彩鲜明、生意勃发的初春景物图。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]泥融：形容泥土湿润。</p>", "englishHtml": "<p class=\"poem-lines\">Quatrains(I)<br>Over a beautiful scene the sun is lingering,<br>Alive with birds and sweet with breath of early spring.<br>To pick the thawing sod a pair of swallows fly;<br>Basking on the warm sand, two by two lovebirds lie.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Quatrains ( I ),” the poem presents retreat or solitude as a way to stand apart from worldly pressure.</p>\n<p class=\"commentary\">As a ancient-style poem, it lets Du Fu&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as mountains, water, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "070", "zhTitle": "绝句 （二首其二）", "enTitle": "Quatrains ( II )", "chinese": "绝句\n（二首其二）\n江碧鸟[1]逾白，\n山青花欲燃[2]。\n今春看又过，\n何日是归年？\n这一首上联写景，下联抒情。前两句说：漫江碧波荡漾，白鸟掠水飞翔，显得羽毛更白；满山青翠欲滴，鲜花盛开，红艳如火。上联十字，写了山水花鸟四景，又分别着上碧绿、青翠、火红、洁白四色，令人赏心悦目。后两句写的是主观感受：春末夏初，风景虽好，但是岁月荏苒，归家遥遥无期，就不免引起诗人漂泊的伤感了。这是一首见景生情之作。\n注释：\n[1]鸟：指江鸥。\n[2]花欲燃：花红似火。", "english": "Quatrains\n(II)\nAgainst blue water birds appear more white;\nOn green mountains red flowers seem to burn.\nAlas! I see another spring in flight.\nO when will come the day of my return?", "poemType": "古体诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">绝句<br>（二首其二）<br>江碧鸟<sup class=\"note-ref\">[1]</sup>逾白，<br>山青花欲燃<sup class=\"note-ref\">[2]</sup>。<br>今春看又过，<br>何日是归年？</p>\n<p class=\"prose\">这一首上联写景，下联抒情。前两句说：漫江碧波荡漾，白鸟掠水飞翔，显得羽毛更白；满山青翠欲滴，鲜花盛开，红艳如火。上联十字，写了山水花鸟四景，又分别着上碧绿、青翠、火红、洁白四色，令人赏心悦目。后两句写的是主观感受：春末夏初，风景虽好，但是岁月荏苒，归家遥遥无期，就不免引起诗人漂泊的伤感了。</p>\n<p class=\"prose\">这是一首见景生情之作。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]鸟：指江鸥。<br>[2]花欲燃：花红似火。</p>", "englishHtml": "<p class=\"poem-lines\">Quatrains(II)<br>Against blue water birds appear more white;<br>On green mountains red flowers seem to burn.<br>Alas! I see another spring in flight.<br>O when will come the day of my return?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Quatrains ( II ),” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a ancient-style poem, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, flowers, and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "071", "zhTitle": "绝句 （四首其三）", "enTitle": "Quatrains ( III )", "chinese": "绝句\n（四首其三）\n两个黄鹂鸣翠柳，\n一行白鹭上青天。\n窗含西岭[1]千秋雪，\n门泊[2]东吴万里船。\n公元764年，杜甫随成都尹严武回到草堂，写了四首即景小诗，这是其中最著名的第三首。全诗是两联对仗句。上联写草堂周围新绿的柳枝上，成对的黄鹂在歌唱；在一碧如洗的晴空里，一行白鹭在自由地飞翔。两句中用了黄、翠、白、青四种鲜明的颜色，组成了一幅绚丽的图景。下联写凭窗远望西山雪岭，仿佛是画框中的一幅图画，岭上的积雪终年不化，已经积了千年万代。再开门一看，可以见到从东方来的停泊在江边的帆船，于是诗人不禁想坐船回到万里之外的故乡去了。这四句景语也是情语，表达了诗人复杂细致的内心思想活动。\n注释：\n[1]西岭：西岭雪山。\n[2]泊：停泊。", "english": "Quatrains\n(III)\nTwo golden orioles sing amid the willows green;\nA flock of white egrets flies into the blue sky.\nMy window frames the snow-crowned western mountain scene;\nMy door oft says to eastward-going ships “Goodbye!”", "poemType": "古体诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">绝句<br>（四首其三）<br>两个黄鹂鸣翠柳，<br>一行白鹭上青天。<br>窗含西岭<sup class=\"note-ref\">[1]</sup>千秋雪，<br>门泊<sup class=\"note-ref\">[2]</sup>东吴万里船。</p>\n<p class=\"prose\">公元764年，杜甫随成都尹严武回到草堂，写了四首即景小诗，这是其中最著名的第三首。全诗是两联对仗句。上联写草堂周围新绿的柳枝上，成对的黄鹂在歌唱；在一碧如洗的晴空里，一行白鹭在自由地飞翔。两句中用了黄、翠、白、青四种鲜明的颜色，组成了一幅绚丽的图景。</p>\n<p class=\"prose\">下联写凭窗远望西山雪岭，仿佛是画框中的一幅图画，岭上的积雪终年不化，已经积了千年万代。再开门一看，可以见到从东方来的停泊在江边的帆船，于是诗人不禁想坐船回到万里之外的故乡去了。这四句景语也是情语，表达了诗人复杂细致的内心思想活动。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]西岭：西岭雪山。<br>[2]泊：停泊。</p>", "englishHtml": "<p class=\"poem-lines\">Quatrains</p>\n<p class=\"stanza-marker\">(III)</p>\n<p class=\"poem-lines\">Two golden orioles sing amid the willows green;<br>A flock of white egrets flies into the blue sky.<br>My window frames the snow-crowned western mountain scene;<br>My door oft says to eastward-going ships “Goodbye!”</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Quatrains ( III ),” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a ancient-style poem, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, birds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "072", "zhTitle": "宿府", "enTitle": "Lonely Night in the Office", "chinese": "清秋幕府井梧[1]寒，\n独宿江城蜡炬残。\n永夜[2]角声悲自语，\n中天[3]月色好谁看？\n风尘荏苒音书绝，\n关塞萧条行路难。\n已忍伶俜[4]十年事，\n强移栖息一枝安[5]。\n此诗作于公元764年秋，当时作者在严武幕府中任节度参谋。前四句描叙景物，景中含情；后四句抒发情感，情触景生，全诗情景交融。首句点“府”，次句点“宿”，长夜里悲笳哀角，自道乱世凄凉；晴空中月色皎洁，无奈好与谁看。这正是诗人独宿江城，晚景凄凉的写照。战乱经久不绝，故乡音书阔别，草木变衰关塞萧条，阻隔交通无路可归。诗人从动乱开始以来，10年间离乱飘零饱尝辛酸，如今却又被强拉到这幕府里。虽然宿府非作者自愿，但是严武是杜甫友人，曾接济过杜甫，所以诗人是为着酬知己才栖身帐下，到幕府不久，就受到幕僚们的嫉妒、诽谤和排挤，日子很不好过，加上辗转流离的苦闷，共同酿成此佳作。\n注释：\n[1]井梧：梧桐。\n[2]永夜：整夜。\n[3]中天：半空中。\n[4]伶俜（pīnɡ）：流离失所。\n[5]一枝安：暂时安顿下来。指作者前往幕府担任参谋一职。", "english": "Well-side plane-trees shiver with cold in autumn clear;\nBy flickering candlelight I sleep sad and drear.\nI can but speak alone to hear sad bugle song.\nWith whom can I watch the bright moon all the night long?\nIn time of war no letter comes from far away.\nHow can I go on the frontier my lonely way?\nHaving suffered for ten long, long years without glee,\nI can't but seek a shelter on this lonely tree.", "poemType": "七言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">清秋幕府井梧<sup class=\"note-ref\">[1]</sup>寒，<br>独宿江城蜡炬残。<br>永夜<sup class=\"note-ref\">[2]</sup>角声悲自语，<br>中天<sup class=\"note-ref\">[3]</sup>月色好谁看？<br>风尘荏苒音书绝，<br>关塞萧条行路难。<br>已忍伶俜<sup class=\"note-ref\">[4]</sup>十年事，<br>强移栖息一枝安<sup class=\"note-ref\">[5]</sup>。</p>\n<p class=\"prose\">此诗作于公元764年秋，当时作者在严武幕府中任节度参谋。前四句描叙景物，景中含情；后四句抒发情感，情触景生，全诗情景交融。首句点“府”，次句点“宿”，长夜里悲笳哀角，自道乱世凄凉；晴空中月色皎洁，无奈好与谁看。这正是诗人独宿江城，晚景凄凉的写照。</p>\n<p class=\"prose\">战乱经久不绝，故乡音书阔别，草木变衰关塞萧条，阻隔交通无路可归。诗人从动乱开始以来，10年间离乱飘零饱尝辛酸，如今却又被强拉到这幕府里。虽然宿府非作者自愿，但是严武是杜甫友人，曾接济过杜甫，所以诗人是为着酬知己才栖身帐下，到幕府不久，就受到幕僚们的嫉妒、诽谤和排挤，日子很不好过，加上辗转流离的苦闷，共同酿成此佳作。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]井梧：梧桐。<br>[2]永夜：整夜。<br>[3]中天：半空中。<br>[4]伶俜（pīnɡ）：流离失所。<br>[5]一枝安：暂时安顿下来。指作者前往幕府担任参谋一职。</p>", "englishHtml": "<p class=\"poem-lines\">Well-side plane-trees shiver with cold in autumn clear;<br>By flickering candlelight I sleep sad and drear.<br>I can but speak alone to hear sad bugle song.<br>With whom can I watch the bright moon all the night long?<br>In time of war no letter comes from far away.<br>How can I go on the frontier my lonely way?<br>Having suffered for ten long, long years without glee,<br>I can&#x27;t but seek a shelter on this lonely tree.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Lonely Night in the Office,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, moonlight, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "073", "zhTitle": "倦夜", "enTitle": "Depressed Night", "chinese": "竹凉侵卧内，\n野月满庭隅[1]。\n重露成涓滴[2]，\n稀星乍有无。\n暗飞萤自照，\n水宿[3]鸟相呼[4]。\n万事干戈里，\n空悲清夜徂[5]！\n这首诗的构思布局精巧玲珑。全诗起承转合，井然有序。前六句全写自然景色，全然无倦意，但这细致入微的景物，恰恰说明诗人辗转反侧，彻夜不眠，或醒卧榻上，或披衣闲步，点明题中“倦”字意。最后两句直抒胸臆，也是对上文夜不能眠的解释：不能酣眠，皆为国事。其时，安史之乱平息未久，吐蕃又进犯中原，早已支离破碎满目疮痍的山河，再次陷入连绵战火。朝廷内奸佞当道，诗人也已年老，深感自己报国无门，只能空悲切。再回看其景，莫不饱含哀愁。\n注释：\n[1]庭隅（yú）：庭院的角落。\n[2]涓（juān）滴：水滴。\n[3]水宿：栖息在水边。\n[4]相（xiānɡ）呼：相互叫唤。\n[5]清夜徂（cú）：清静的夜晚流逝。", "english": "The cool of bamboo invades my bed,\nWild moonlight in my yard outspread.\nDrop by drop drips down heavy dew,\nFlickering starlight fades from view.\nA firefly lights its lonely way\nWhile waterbirds wait for the day.\nSee war flames outspread far and near!\nHow could the night be still and clear?", "poemType": "五言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">竹凉侵卧内，<br>野月满庭隅<sup class=\"note-ref\">[1]</sup>。<br>重露成涓滴<sup class=\"note-ref\">[2]</sup>，<br>稀星乍有无。<br>暗飞萤自照，<br>水宿<sup class=\"note-ref\">[3]</sup>鸟相呼<sup class=\"note-ref\">[4]</sup>。<br>万事干戈里，<br>空悲清夜徂<sup class=\"note-ref\">[5]</sup>！</p>\n<p class=\"prose\">这首诗的构思布局精巧玲珑。全诗起承转合，井然有序。前六句全写自然景色，全然无倦意，但这细致入微的景物，恰恰说明诗人辗转反侧，彻夜不眠，或醒卧榻上，或披衣闲步，点明题中“倦”字意。最后两句直抒胸臆，也是对上文夜不能眠的解释：不能酣眠，皆为国事。</p>\n<p class=\"prose\">其时，安史之乱平息未久，吐蕃又进犯中原，早已支离破碎满目疮痍的山河，再次陷入连绵战火。朝廷内奸佞当道，诗人也已年老，深感自己报国无门，只能空悲切。再回看其景，莫不饱含哀愁。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]庭隅（yú）：庭院的角落。<br>[2]涓（juān）滴：水滴。<br>[3]水宿：栖息在水边。<br>[4]相（xiānɡ）呼：相互叫唤。<br>[5]清夜徂（cú）：清静的夜晚流逝。</p>", "englishHtml": "<p class=\"poem-lines\">The cool of bamboo invades my bed,<br>Wild moonlight in my yard outspread.<br>Drop by drop drips down heavy dew,<br>Flickering starlight fades from view.<br>A firefly lights its lonely way<br>While waterbirds wait for the day.<br>See war flames outspread far and near!<br>How could the night be still and clear?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Depressed Night,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water, moonlight, birds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "074", "zhTitle": "禹庙", "enTitle": "The Temple of Emperor Yu", "chinese": "禹庙空山里，\n秋风落日斜[1]。\n荒庭垂桔柚，\n古屋画龙蛇。\n云气嘘青壁[2]，\n江[3]声走白沙。\n早知乘四载，\n疏凿控三巴[4]。\n公元765年，杜甫出蜀东下，途经忠州（今四川忠县），特地前去观览大禹古庙。荒凉空山之中，瑟瑟秋风正起，晚霞余晖，涂染这空旷寂静的山谷，更显古庙深幽阒寂，肃然独峙。庭中桔柚硕果垂枝，壁上古画龙蛇飞舞。这里暗含典故，据《尚书·禹贡》载，禹治洪水后，人民得以安居生产，远居东南的“岛夷”之民也“厥包桔柚”，把丰收的桔柚包裹好进贡给禹。又有传说，禹“驱龙蛇而放菹”，使龙蛇也有所归宿，不再兴风作浪。青山千仞，云吞雾吐；白浪淘沙，东奔三峡。禹乘四种载具治水，凿通三峡的故事人所共知，而眼前的景象，引人追忆千年以前的上古洪荒，大禹不畏艰险凿石开山时的磅礴气势。诗人在山河破碎，风雨飘摇的时候歌颂大禹敢于征服自然的精神，意在希望君王能像大禹那样力挽狂澜，救民于水火，重振山河。诗人一片苦心，可昭日月。\n注释：\n[1]落日斜：落日西斜。\n[2]青壁：空旷的墙壁。\n[3]江：大禹庙所在山崖下的长江。\n[4]三巴：指蜀地的巴东郡、巴郡、巴西郡一带。传说是大禹治水后浮现的陆地。", "english": "In mountains void the temple shines;\nIn autumn breeze the sun declines.\nIn dreary yard fruits hang and fall,\nDragons and snakes dance on the wall.\nThrough mossy cliffs float mist and cloud,\nThe foaming river's rolling loud.\nYu went high and low, far and nigh,\nTo conquer the flood under the sky.", "poemType": "五言律诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">禹庙空山里，<br>秋风落日斜<sup class=\"note-ref\">[1]</sup>。<br>荒庭垂桔柚，<br>古屋画龙蛇。<br>云气嘘青壁<sup class=\"note-ref\">[2]</sup>，<br>江<sup class=\"note-ref\">[3]</sup>声走白沙。<br>早知乘四载，<br>疏凿控三巴<sup class=\"note-ref\">[4]</sup>。</p>\n<p class=\"prose\">公元765年，杜甫出蜀东下，途经忠州（今四川忠县），特地前去观览大禹古庙。荒凉空山之中，瑟瑟秋风正起，晚霞余晖，涂染这空旷寂静的山谷，更显古庙深幽阒寂，肃然独峙。庭中桔柚硕果垂枝，壁上古画龙蛇飞舞。这里暗含典故，据《尚书·禹贡》载，禹治洪水后，人民得以安居生产，远居东南的“岛夷”之民也“厥包桔柚”，把丰收的桔柚包裹好进贡给禹。</p>\n<p class=\"prose\">又有传说，禹“驱龙蛇而放菹”，使龙蛇也有所归宿，不再兴风作浪。青山千仞，云吞雾吐；白浪淘沙，东奔三峡。禹乘四种载具治水，凿通三峡的故事人所共知，而眼前的景象，引人追忆千年以前的上古洪荒，大禹不畏艰险凿石开山时的磅礴气势。</p>\n<p class=\"prose\">诗人在山河破碎，风雨飘摇的时候歌颂大禹敢于征服自然的精神，意在希望君王能像大禹那样力挽狂澜，救民于水火，重振山河。诗人一片苦心，可昭日月。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]落日斜：落日西斜。<br>[2]青壁：空旷的墙壁。<br>[3]江：大禹庙所在山崖下的长江。<br>[4]三巴：指蜀地的巴东郡、巴郡、巴西郡一带。传说是大禹治水后浮现的陆地。</p>", "englishHtml": "<p class=\"poem-lines\">In mountains void the temple shines;<br>In autumn breeze the sun declines.<br>In dreary yard fruits hang and fall,<br>Dragons and snakes dance on the wall.<br>Through mossy cliffs float mist and cloud,<br>The foaming river&#x27;s rolling loud.<br>Yu went high and low, far and nigh,<br>To conquer the flood under the sky.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Temple of Emperor Yu,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, water, and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "075", "zhTitle": "旅夜书怀", "enTitle": "Mooring at Night", "chinese": "细草微风岸，\n危[1]樯[2]独夜舟。\n星垂[3]平野阔，\n月涌大江流。\n名岂文章著？\n官应老病休[4]。\n飘飘何所似？\n天地一沙鸥。\n公元765年，杜甫因为严武去世，失去依靠，携家离开成都草堂，坐船东下，在渝州一带写了这首五言律诗。诗的前半写“旅夜”。第一句写近景：微风吹拂着江岸上的细草，竖着高高桅杆的小船孤独地停泊在月光之下；自己也像细草一样渺小，像江中小船一样孤独。第三、四句写远景：明星低垂，平野广阔，月随波涌，大江东流。这两句写景雄浑阔大，反衬出诗人的孤苦伶仃和颠沛无告的心态，这是以乐景写哀情的手法。诗的后半“抒怀”。第五、六句说，有点名声，哪里是因为我的文章好？做官，倒应该年老多病就退休了。最后两句说，飘然一身像个什么呢？不过像广阔天地间的一只沙鸥罢了。这样借景抒情，表现了诗人漂泊无依的心理状态，令人感慨系之。\n注释：\n[1]危：高。\n[2]樯：桅杆。\n[3]垂：低垂。\n[4]官应老病休：一说反语，应为“老病应休官”。", "english": "Riverside grass caressed by wind so light,\nA lonely mast seems to pierce lonely night.\nThe boundless plain fringed with stars hanging low,\nThe moon surges with the river on the flow.\nWill fame ever come to a man of letters\nOld, ill, retired, no official life betters?\nWhat do I look like, drifting on so free?\nA wild gull seeking shelter on the sea.", "poemType": "五言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">细草微风岸，<br>危<sup class=\"note-ref\">[1]</sup>樯<sup class=\"note-ref\">[2]</sup>独夜舟。<br>星垂<sup class=\"note-ref\">[3]</sup>平野阔，<br>月涌大江流。<br>名岂文章著？<br>官应老病休<sup class=\"note-ref\">[4]</sup>。<br>飘飘何所似？<br>天地一沙鸥。</p>\n<p class=\"prose\">公元765年，杜甫因为严武去世，失去依靠，携家离开成都草堂，坐船东下，在渝州一带写了这首五言律诗。诗的前半写“旅夜”。第一句写近景：微风吹拂着江岸上的细草，竖着高高桅杆的小船孤独地停泊在月光之下；自己也像细草一样渺小，像江中小船一样孤独。</p>\n<p class=\"prose\">第三、四句写远景：明星低垂，平野广阔，月随波涌，大江东流。这两句写景雄浑阔大，反衬出诗人的孤苦伶仃和颠沛无告的心态，这是以乐景写哀情的手法。诗的后半“抒怀”。第五、六句说，有点名声，哪里是因为我的文章好？做官，倒应该年老多病就退休了。</p>\n<p class=\"prose\">最后两句说，飘然一身像个什么呢？不过像广阔天地间的一只沙鸥罢了。这样借景抒情，表现了诗人漂泊无依的心理状态，令人感慨系之。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]危：高。<br>[2]樯：桅杆。<br>[3]垂：低垂。<br>[4]官应老病休：一说反语，应为“老病应休官”。</p>", "englishHtml": "<p class=\"poem-lines\">Riverside grass caressed by wind so light,<br>A lonely mast seems to pierce lonely night.<br>The boundless plain fringed with stars hanging low,<br>The moon surges with the river on the flow.<br>Will fame ever come to a man of letters<br>Old, ill, retired, no official life betters?<br>What do I look like, drifting on so free?<br>A wild gull seeking shelter on the sea.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Mooring at Night,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, moonlight, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "076", "zhTitle": "八阵图", "enTitle": "The Stone Fortress", "chinese": "功盖三分国，\n名成八阵图。\n江流石不转，\n遗恨失吞吴。\n《金圣叹选批杜诗》中说：“八阵图，垒石作八行，在鱼腹浦平沙上：一天，二地，三风，四云，五飞龙，六翔鸟，七虎翼，八蛇蟠，为八阵。”八阵图的遗址在夔州西南永安宫前的平沙上，聚细石成堆，高五尺，六十围，纵横棋布，排列为六十四堆。公元766年，杜甫初到夔州，看见了八阵图，就写了这首诗。第一句说，诸葛亮的大功是使蜀和吴、魏三分天下。第二句说，他的军事贡献体现在对抗吴魏的八阵图上。第三句说，即使长江大水淹没平沙，水退之后，八阵图的石堆依然如故，600年来岿然不动。第四句说，诸葛亮的八阵图本是用来联吴抗魏的，但是刘备却要“吞吴”，于是金圣叹说：“不谓关羽奋一朝之勇，‘失’之于先；先主（刘备）又逞一击之忿，‘失’之于后。不能亲吴则亦岂能拒魏哉！”所以统一大业中途夭折，成了千古遗恨。这首绝句融议论入诗，把怀古与述怀合为一体，使人有此恨绵绵，余意不尽之感。\n注释：\n[1]八阵图：用石头垒成天、地、风、云、龙、虎、马、蛇八阵，用于操练或作战。诸葛亮曾布过此阵。", "english": "With his exploits history is crowned;\nFor his Stone Fortress he's renowned.\nThe river flows but stones still stand,\nThough he'd not taken back lost land.", "poemType": "五言绝句", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">功盖三分国，<br>名成八阵图。<br>江流石不转，<br>遗恨失吞吴。</p>\n<p class=\"prose\">《金圣叹选批杜诗》中说：“八阵图，垒石作八行，在鱼腹浦平沙上：一天，二地，三风，四云，五飞龙，六翔鸟，七虎翼，八蛇蟠，为八阵。”八阵图的遗址在夔州西南永安宫前的平沙上，聚细石成堆，高五尺，六十围，纵横棋布，排列为六十四堆。</p>\n<p class=\"prose\">公元766年，杜甫初到夔州，看见了八阵图，就写了这首诗。第一句说，诸葛亮的大功是使蜀和吴、魏三分天下。第二句说，他的军事贡献体现在对抗吴魏的八阵图上。第三句说，即使长江大水淹没平沙，水退之后，八阵图的石堆依然如故，600年来岿然不动。</p>\n<p class=\"prose\">第四句说，诸葛亮的八阵图本是用来联吴抗魏的，但是刘备却要“吞吴”，于是金圣叹说：“不谓关羽奋一朝之勇，‘失’之于先；先主（刘备）又逞一击之忿，‘失’之于后。不能亲吴则亦岂能拒魏哉！”所以统一大业中途夭折，成了千古遗恨。这首绝句融议论入诗，把怀古与述怀合为一体，使人有此恨绵绵，余意不尽之感。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]八阵图：用石头垒成天、地、风、云、龙、虎、马、蛇八阵，用于操练或作战。诸葛亮曾布过此阵。</p>", "englishHtml": "<p class=\"poem-lines\">With his exploits history is crowned;<br>For his Stone Fortress he&#x27;s renowned.<br>The river flows but stones still stand,<br>Though he&#x27;d not taken back lost land.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Stone Fortress,” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as water give the poem its visual texture and emotional temperature.</p>"}, {"num": "077", "zhTitle": "秋兴 （八首其一）", "enTitle": "Reflections in Autumn ( I )", "chinese": "秋兴\n（八首其一）\n玉露凋伤枫树林，\n巫山巫峡气萧森。\n江间波浪兼天涌，\n塞上[1]风云接地阴[2]。\n丛菊两开他日泪，\n孤舟一系故园[3]心。\n寒衣处处催刀尺[4]，\n白帝城高急暮砧[5]。\n《秋兴八首》是公元766年杜甫旅居夔州时的作品。这一首前半写所见（秋）：白露使枫叶凋残了，巫山和巫峡都是阴森森的；长江的波浪从下而上涌向天空，巫山的风云从上而下压得地面也阴暗了。这四句通过对秋色秋声的形象描绘，烘托出阴沉萧森、动荡不安的环境气氛，引起了诗人忧国之情和抑郁之感。后半接着就写所感（兴）：堆堆黄菊已经开过两次，菊上的白露就像他日的眼泪；一条孤零零的小船系住了诗人思念故园之心。家家户户都用刀尺裁剪冬衣，日暮天黑，又从白帝城传来了捣衣之声，更使人兴起了故国之思。这首诗由眼前所见萧条的秋色、所闻凄清的秋声，而引起对个人身世与国家命运的感叹，悲壮苍凉，意境深远。\n注释：\n[1]塞上：指巫山。\n[2]接地阴：风云像要压到地面上。\n[3]故园：指长安。\n[4]催刀尺：赶裁新衣。\n[5]急暮砧（zhēn）：黄昏时捣衣声急促。", "english": "Reflections in Autumn\n(I)\nThe pearllike dewdrops wither maples in red dye;\nThe Gorge and Cliffs of Witch exhale dense fog around.\nWaves of upsurging river seem to storm the sky;\nDark clouds o'er mountains touch their shadows on the ground.\nTwice full-blown, asters blown off draw tears from the eye;\nOnce tied up, lonely boat ties up my heart home-bound.\nThinking of winter robes being made far and nigh,\nI hear at dusk but nearby washing blocks fast pound.", "poemType": "七言古诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">秋兴<br>（八首其一）<br>玉露凋伤枫树林，<br>巫山巫峡气萧森。<br>江间波浪兼天涌，<br>塞上<sup class=\"note-ref\">[1]</sup>风云接地阴<sup class=\"note-ref\">[2]</sup>。<br>丛菊两开他日泪，<br>孤舟一系故园<sup class=\"note-ref\">[3]</sup>心。<br>寒衣处处催刀尺<sup class=\"note-ref\">[4]</sup>，<br>白帝城高急暮砧<sup class=\"note-ref\">[5]</sup>。</p>\n<p class=\"prose\">《秋兴八首》是公元766年杜甫旅居夔州时的作品。这一首前半写所见（秋）：白露使枫叶凋残了，巫山和巫峡都是阴森森的；长江的波浪从下而上涌向天空，巫山的风云从上而下压得地面也阴暗了。这四句通过对秋色秋声的形象描绘，烘托出阴沉萧森、动荡不安的环境气氛，引起了诗人忧国之情和抑郁之感。</p>\n<p class=\"prose\">后半接着就写所感（兴）：堆堆黄菊已经开过两次，菊上的白露就像他日的眼泪；一条孤零零的小船系住了诗人思念故园之心。家家户户都用刀尺裁剪冬衣，日暮天黑，又从白帝城传来了捣衣之声，更使人兴起了故国之思。这首诗由眼前所见萧条的秋色、所闻凄清的秋声，而引起对个人身世与国家命运的感叹，悲壮苍凉，意境深远。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]塞上：指巫山。<br>[2]接地阴：风云像要压到地面上。<br>[3]故园：指长安。<br>[4]催刀尺：赶裁新衣。<br>[5]急暮砧（zhēn）：黄昏时捣衣声急促。</p>", "englishHtml": "<p class=\"poem-lines\">Reflections in Autumn(I)<br>The pearllike dewdrops wither maples in red dye;<br>The Gorge and Cliffs of Witch exhale dense fog around.<br>Waves of upsurging river seem to storm the sky;<br>Dark clouds o&#x27;er mountains touch their shadows on the ground.<br>Twice full-blown, asters blown off draw tears from the eye;<br>Once tied up, lonely boat ties up my heart home-bound.<br>Thinking of winter robes being made far and nigh,<br>I hear at dusk but nearby washing blocks fast pound.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reflections in Autumn ( I ),” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, clouds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "078", "zhTitle": "秋兴 （八首其二）", "enTitle": "Reflections in Autumn ( II )", "chinese": "秋兴\n（八首其二）\n夔府孤城落日斜，\n每依北斗望京华[1]。\n听猿实下三声泪，\n奉使虚随八月槎[2]。\n画省[3]香炉违伏枕，\n山楼[4]粉堞[5]隐悲笳。\n请看石上藤萝月，\n已映洲前芦荻花。\n第二首写夔府秋夜北望京华。首联承接上首尾联，由薄暮入笔。夔州地处群山之间，又值落日斜照，这深秋黄昏的景色对于一个命运坎坷、沦落天涯的人来说，更会引起落寞思乡之情。于是每当金乌西坠、玉兔东升时，诗人就依北斗星的方向眺望日夜思念的长安。望而不见，焉能不悲？旧时曾知在巫峡听猿声使人哀伤落泪，现在身在夔州，听到猿声实在伤感不禁泪下。肃宗上元二年（761），严武以兵部侍郎出任为成都尹兼御史大夫。杜甫希望能有机会随严武一同入朝，回到长安，实现其政治理想。但不幸严武突然去世，八月份乘船回长安供职的心愿化为泡影。回长安如同乘浮槎至天河一般，茫茫不可达。“画省香炉”指在尚书省轮流值班，是诗人心中所向。卧病在床，不能回到朝中供职，只挂了个空衔，诗人正为没有机会报效国家遗憾愁闷，远处白帝城的城垛上隐隐约约传来凄咽的号角声，情极凄切缠绵，无限悲凉。尾联写月亮从照着藤萝移到照映着洲前芦荻花上，描写了夔州萧条的秋色，也暗示时间的推移，含有无限情思。\n注释：\n[1]京华：指长安。\n[2]槎（chá）：木筏。\n[3]画省：指尚书省。\n[4]山楼：白帝城楼。\n[5]粉堞（dié）：用白粉刷的矮墙。", "english": "Reflections in Autumn\n(II)\nThe sun on the decline sinks behind the lonely town,\nSeeing the Polar Star, I think of the Royal Crown.\nHearing the monkeys wail, can my tears not fall down?\nHow could I cross the Milky Way to find my own?\nI cannot feel the royal incense from my bed,\nBehind townwalls I hear sad bugle songs outspread.\nOh, look! With ivy on the rock the moon is fed,\nIt shines on weeds and reeds now at the riverhead.", "poemType": "七言古诗", "poemTheme": "忧国忧民", "chineseHtml": "<p class=\"poem-lines\">秋兴<br>（八首其二）<br>夔府孤城落日斜，<br>每依北斗望京华<sup class=\"note-ref\">[1]</sup>。<br>听猿实下三声泪，<br>奉使虚随八月槎<sup class=\"note-ref\">[2]</sup>。<br>画省<sup class=\"note-ref\">[3]</sup>香炉违伏枕，<br>山楼<sup class=\"note-ref\">[4]</sup>粉堞<sup class=\"note-ref\">[5]</sup>隐悲笳。<br>请看石上藤萝月，<br>已映洲前芦荻花。</p>\n<p class=\"prose\">第二首写夔府秋夜北望京华。首联承接上首尾联，由薄暮入笔。夔州地处群山之间，又值落日斜照，这深秋黄昏的景色对于一个命运坎坷、沦落天涯的人来说，更会引起落寞思乡之情。于是每当金乌西坠、玉兔东升时，诗人就依北斗星的方向眺望日夜思念的长安。</p>\n<p class=\"prose\">望而不见，焉能不悲？旧时曾知在巫峡听猿声使人哀伤落泪，现在身在夔州，听到猿声实在伤感不禁泪下。肃宗上元二年（761），严武以兵部侍郎出任为成都尹兼御史大夫。杜甫希望能有机会随严武一同入朝，回到长安，实现其政治理想。但不幸严武突然去世，八月份乘船回长安供职的心愿化为泡影。</p>\n<p class=\"prose\">回长安如同乘浮槎至天河一般，茫茫不可达。“画省香炉”指在尚书省轮流值班，是诗人心中所向。卧病在床，不能回到朝中供职，只挂了个空衔，诗人正为没有机会报效国家遗憾愁闷，远处白帝城的城垛上隐隐约约传来凄咽的号角声，情极凄切缠绵，无限悲凉。</p>\n<p class=\"prose\">尾联写月亮从照着藤萝移到照映着洲前芦荻花上，描写了夔州萧条的秋色，也暗示时间的推移，含有无限情思。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]京华：指长安。<br>[2]槎（chá）：木筏。<br>[3]画省：指尚书省。<br>[4]山楼：白帝城楼。<br>[5]粉堞（dié）：用白粉刷的矮墙。</p>", "englishHtml": "<p class=\"poem-lines\">Reflections in Autumn(II)<br>The sun on the decline sinks behind the lonely town,<br>Seeing the Polar Star, I think of the Royal Crown.<br>Hearing the monkeys wail, can my tears not fall down?<br>How could I cross the Milky Way to find my own?<br>I cannot feel the royal incense from my bed,<br>Behind townwalls I hear sad bugle songs outspread.<br>Oh, look! With ivy on the rock the moon is fed,<br>It shines on weeds and reeds now at the riverhead.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reflections in Autumn ( II ),” the poem binds private suffering to public crisis, so the speaker&#x27;s emotion becomes a witness to history.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it shows Du Fu&#x27;s gift for making personal experience bear the weight of a historical age. Key images such as mountains, moonlight, flowers, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "079", "zhTitle": "秋兴 （八首其三）", "enTitle": "Reflections in Autumn ( III)", "chinese": "秋兴\n（八首其三）\n千家山郭静朝晖，\n日日江楼坐翠微[1]。\n信宿[2]渔人还泛泛，\n清秋燕子故飞飞。\n匡衡抗疏[3]功名薄，\n刘向[4]传经心事违。\n同学少年多不贱，\n五陵衣马自轻肥[5]。\n第三首是第二首的延伸，紧接上文的暮色写晨曦中的夔州。诗人日日独坐江楼，秋色清明，江水宁静，带给诗人的却是烦扰不安。每当山城的千家百户还沉浸在朝晖中，自己却孤身一人坐在江边山楼上，看着留宿江中的渔船，总是在上下翻飞的燕子，流露出诗人烦恼的心情。颈联用典，汉元帝初时，日蚀地震，匡衡上疏，帝悦其言，迁为光禄大夫，太子少傅，建议亦常被采纳；东汉刘向，在朝历经三世，都得重用，对儒学传播起了很大的作用。诗人将自己与匡、刘对比，叹息自己一生事与愿违。尾联用同学多不贱反衬自己的落魄不得志。\n注释：\n[1]翠微：青山。\n[2]信宿：再宿，连住两夜。\n[3]抗疏：指臣子对皇帝的命令有所抵制，上疏劝谏。\n[4]刘向：字子政，汉朝经学家。\n[5]轻肥：轻裘肥马。", "english": "Reflections in Autumn\n(III)\nThousands of mountain cottages bathed in the twilight,\nEach day by riverside I gaze on verdant scene.\nFishermen come to cast their net after the night,\nAnd swallows flap their wings and flit in autumn green.\nDisposed after my proposal, I don't care for fame;\nStudying classics, I am not yet a good hand.\nMost of my young companions have made a fine name;\nSplendidly clad, they ride splendid steeds on the land.", "poemType": "七言古诗", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">秋兴<br>（八首其三）<br>千家山郭静朝晖，<br>日日江楼坐翠微<sup class=\"note-ref\">[1]</sup>。<br>信宿<sup class=\"note-ref\">[2]</sup>渔人还泛泛，<br>清秋燕子故飞飞。<br>匡衡抗疏<sup class=\"note-ref\">[3]</sup>功名薄，<br>刘向<sup class=\"note-ref\">[4]</sup>传经心事违。<br>同学少年多不贱，<br>五陵衣马自轻肥<sup class=\"note-ref\">[5]</sup>。</p>\n<p
