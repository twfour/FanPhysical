 "chineseHtml": "<p class=\"poem-lines\">太乙<sup class=\"note-ref\">[1]</sup>近天都，<br>连山到海隅<sup class=\"note-ref\">[2]</sup>。<br>白云回望合，<br>青霭<sup class=\"note-ref\">[3]</sup>入看无。<br>分野中峰变，<br>阴晴众壑殊<sup class=\"note-ref\">[4]</sup>。<br>欲投人处宿，<br>隔水问樵夫。</p>\n<p class=\"prose\">首联写远景，用夸张手法勾画了终南山的总轮廓。颔联写近景，诗人走出茫茫云海，前面是蒙蒙青霭，仿佛可以触摸到，然而走进去，不但摸不着，也看不见了，可谓可望而不可即。颈联高度概括，尺幅万里。诗人站在终南山的最高峰上四面遥望，看到了终南山地域广大，占据了几个分野，山谷中沟壑纵横，以致向阳的山谷和背阴的山谷阴晴各不相同，足见终南山地域之广大。</p>\n<p class=\"prose\">尾联“欲投人处宿，隔水问樵夫”，则山之辽阔荒远可知，意蕴深厚，令人回味无穷。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 太乙：即终南山。<br>[2] 海隅（yú）：海边。终南山并不到海，此为夸张之词。<br>[3] 霭（ǎi）：云气。<br>[4] 分野中峰变，阴晴众壑殊：形容终南山占地极广，使得中峰两侧的分野都变了，各个山谷的天气也阴晴各自不同。</p>", "englishHtml": "<p class=\"poem-lines\">The highest peak scrapes the blue sky;<br>It extends from hills to the sea.<br>When I look back,clouds veil the eye;<br>When I come near,I see mist flee.<br>Peaks change color from left to right,<br>Vales differ in shade or sunbeam.<br>Seeking a place to pass the night,<br>I ask a woodman across the stream.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Mount Eternal South,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a five-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, water, and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "035", "zhTitle": "观猎", "enTitle": "Hunting", "chinese": "风劲角弓鸣，\n将军猎渭城。\n草枯鹰眼疾\n[1]\n，\n雪尽马蹄轻。\n忽过新丰市，\n还归细柳营\n[2]\n。\n回看射雕处，\n千里暮云平\n[3]\n。\n这首诗，上篇写出猎，下篇写猎归，起得突兀，结得意远，上下篇一气流走，承转自如，有格律束缚不住的气势，又能首尾回环映带，体合五律，这是章法之妙。诗中藏三地名而使人不觉，用典浑化无迹，写景俱能传情，三、四句既穷极物理又意见于言外，这是句法之妙。“枯”“尽”“疾”“轻”“忽过”“还归”，遣词用字准确锤炼，咸能照应，这是字法之妙。所有这些手法，又都能巧妙表达诗中人生气远出的意态与豪情。所以，此诗完全当得起盛唐佳作的称誉。\n注释：\n[1]\n疾：敏锐。\n[2]\n细柳营：代指打猎将军的居所。\n[3]\n暮云平：傍晚时分云和地面连成一片的景象。", "english": "Louder than gusty winds twang horn-backed bows;\nHunting outside the town the general goes.\nKeener o’er withered grass his falcon’s eye,\nLighter on melted snow his steed trots by.\nNo sooner is New Harvest Market passed\nThan he comes back to Willow Camp at last.\nHe looks back where he shot down vultures bare\nOnly to find cloud on cloud spread o’er there.", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">风劲角弓鸣，<br>将军猎渭城。<br>草枯鹰眼疾<sup class=\"note-ref\">[1]</sup>，<br>雪尽马蹄轻。<br>忽过新丰市，<br>还归细柳营<sup class=\"note-ref\">[2]</sup>。<br>回看射雕处，<br>千里暮云平<sup class=\"note-ref\">[3]</sup>。</p>\n<p class=\"prose\">这首诗，上篇写出猎，下篇写猎归，起得突兀，结得意远，上下篇一气流走，承转自如，有格律束缚不住的气势，又能首尾回环映带，体合五律，这是章法之妙。诗中藏三地名而使人不觉，用典浑化无迹，写景俱能传情，三、四句既穷极物理又意见于言外，这是句法之妙。</p>\n<p class=\"prose\">“枯”“尽”“疾”“轻”“忽过”“还归”，遣词用字准确锤炼，咸能照应，这是字法之妙。所有这些手法，又都能巧妙表达诗中人生气远出的意态与豪情。所以，此诗完全当得起盛唐佳作的称誉。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 疾：敏锐。<br>[2] 细柳营：代指打猎将军的居所。<br>[3] 暮云平：傍晚时分云和地面连成一片的景象。</p>", "englishHtml": "<p class=\"poem-lines\">Louder than gusty winds twang horn-backed bows;<br>Hunting outside the town the general goes.<br>Keener o’er withered grass his falcon’s eye,<br>Lighter on melted snow his steed trots by.<br>No sooner is New Harvest Market passed<br>Than he comes back to Willow Camp at last.<br>He looks back where he shot down vultures bare<br>Only to find cloud on cloud spread o’er there.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Hunting,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as clouds, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "036", "zhTitle": "汉江临泛", "enTitle": "A View of the River Han", "chinese": "楚塞三湘接，\n荆门九派通。\n江流天地外，\n山色有无中。\n郡邑\n[1]\n浮前浦\n[2]\n，\n波澜动远空。\n襄阳好风日，\n留醉与山翁。\n开元二十八年（740年），王维因公务去南方，此诗便是诗人途经襄阳城，欣赏汉江景色时所作，可谓是王维融画法入诗的力作。首联，以接“三湘”、通“九派”的浩渺水势一笔勾勒出汉江雄浑壮阔的景色，诗人将不可目击之景概写总述，纳浩浩江流于画边，为整个画面渲染了气氛。颔联，“天地外”“有无中”，为诗歌平添了一种迷茫、玄远、无可穷尽的意境。这是画家的笔意和构图层次感。颈联，“浮”“动”两个动词用得极妙，使诗人笔下之景活起来，诗人泛舟江上怡然自得的心态也从中表现了出来，江水磅礴的气势亦被表现了出来。尾联诗人直抒胸臆，要与山翁共谋一醉，流露出对襄阳风物的热爱之情。\n注释：\n[1]\n郡邑：城镇。\n[2]\n浦：水边。", "english": "Three southern rivers rolling by,\nNine tributaries meeting here.\nTheir water flows from earth to sky;\nHills now appear,now disappear.\nTowns seem to float on rivershore;\nWith waves horizons rise and fall.\nSuch scenery as we adore\nWould make us drink and drunken all.", "poemType": "五言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">楚塞三湘接，<br>荆门九派通。<br>江流天地外，<br>山色有无中。<br>郡邑<sup class=\"note-ref\">[1]</sup>浮前浦<sup class=\"note-ref\">[2]</sup>，<br>波澜动远空。<br>襄阳好风日，<br>留醉与山翁。</p>\n<p class=\"prose\">开元二十八年（740年），王维因公务去南方，此诗便是诗人途经襄阳城，欣赏汉江景色时所作，可谓是王维融画法入诗的力作。首联，以接“三湘”、通“九派”的浩渺水势一笔勾勒出汉江雄浑壮阔的景色，诗人将不可目击之景概写总述，纳浩浩江流于画边，为整个画面渲染了气氛。</p>\n<p class=\"prose\">颔联，“天地外”“有无中”，为诗歌平添了一种迷茫、玄远、无可穷尽的意境。这是画家的笔意和构图层次感。颈联，“浮”“动”两个动词用得极妙，使诗人笔下之景活起来，诗人泛舟江上怡然自得的心态也从中表现了出来，江水磅礴的气势亦被表现了出来。</p>\n<p class=\"prose\">尾联诗人直抒胸臆，要与山翁共谋一醉，流露出对襄阳风物的热爱之情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 郡邑：城镇。<br>[2] 浦：水边。</p>", "englishHtml": "<p class=\"poem-lines\">Three southern rivers rolling by,<br>Nine tributaries meeting here.<br>Their water flows from earth to sky;<br>Hills now appear,now disappear.<br>Towns seem to float on rivershore;<br>With waves horizons rise and fall.<br>Such scenery as we adore<br>Would make us drink and drunken all.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A View of the River Han,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, wine, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "037", "zhTitle": "使至塞上", "enTitle": "On Mission to the Frontier", "chinese": "单车\n[2]\n欲问边，\n属国过居延。\n征蓬\n[3]\n出汉塞，\n归雁入胡天\n[4]\n。\n大漠\n[5]\n孤烟直，\n长河\n[6]\n落日圆。\n萧关\n[7]\n逢候骑\n[8]\n，\n都护在燕然。\n《使至塞上》是王维边塞诗的代表作。诗人描写了出使塞上旅程中所见的塞外风光、生活及心情。本诗的“大漠孤烟直，长河落日圆”一联是脍炙人口的名句。边疆沙漠浩瀚无边，少有奇观异景，烽火台燃起的那一股浓烟就显得格外醒目，因此称作“孤烟”。一个“孤”字写出了景物的单调，紧接一个“直”字，却又表现了它的劲拔、坚毅之美。沙漠上没有山峦林木，那横贯其间的黄河，就非用一个“长”字不能表达诗人的感觉。落日，本来容易给人以感伤的印象，这里用一“圆”字，却给人以亲切温暖而又苍茫的感觉。一个“圆”字，一个“直”字，用得可谓是“十二分力量”，不仅准确地描绘了沙漠的景象，而且表现了作者的深切感受。诗人把孤寂的情绪巧妙地融化在广阔的自然景象的描绘中。\n注释：\n[1]\n使：出使。\n[2]\n单车：一辆车。\n[3]\n征蓬：随风飞向远处的枯蓬。\n[4]\n胡天：胡人的领地，此处指被唐军占领的北方。\n[5]\n大漠：大沙漠，此处指凉州以北的沙漠。\n[6]\n长河：此处指黄河。\n[7]\n萧关：古关名，又名陇山关。\n[8]\n候骑：负责侦察和传递信息的骑兵。", "english": "A single carriage goes to the frontier;\nAn envoy crosses northwest mountains high.\nLike tumbleweed I leave the fortress drear;\nAs wild geese I come’neath Tartarian sky.\nIn boundless desert lonely smoke rises straight;\nOver endless river the sun sinks round.\nI meet a cavalier at the camp gate;\nIn northern fort the general will be found.", "poemType": "五言律诗", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">单车<sup class=\"note-ref\">[2]</sup>欲问边，<br>属国过居延。<br>征蓬<sup class=\"note-ref\">[3]</sup>出汉塞，<br>归雁入胡天<sup class=\"note-ref\">[4]</sup>。<br>大漠<sup class=\"note-ref\">[5]</sup>孤烟直，<br>长河<sup class=\"note-ref\">[6]</sup>落日圆。<br>萧关<sup class=\"note-ref\">[7]</sup>逢候骑<sup class=\"note-ref\">[8]</sup>，<br>都护在燕然。</p>\n<p class=\"prose\">《使至塞上》是王维边塞诗的代表作。诗人描写了出使塞上旅程中所见的塞外风光、生活及心情。本诗的“大漠孤烟直，长河落日圆”一联是脍炙人口的名句。边疆沙漠浩瀚无边，少有奇观异景，烽火台燃起的那一股浓烟就显得格外醒目，因此称作“孤烟”。</p>\n<p class=\"prose\">一个“孤”字写出了景物的单调，紧接一个“直”字，却又表现了它的劲拔、坚毅之美。沙漠上没有山峦林木，那横贯其间的黄河，就非用一个“长”字不能表达诗人的感觉。落日，本来容易给人以感伤的印象，这里用一“圆”字，却给人以亲切温暖而又苍茫的感觉。</p>\n<p class=\"prose\">一个“圆”字，一个“直”字，用得可谓是“十二分力量”，不仅准确地描绘了沙漠的景象，而且表现了作者的深切感受。诗人把孤寂的情绪巧妙地融化在广阔的自然景象的描绘中。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 使：出使。<br>[2] 单车：一辆车。<br>[3] 征蓬：随风飞向远处的枯蓬。<br>[4] 胡天：胡人的领地，此处指被唐军占领的北方。<br>[5] 大漠：大沙漠，此处指凉州以北的沙漠。<br>[6] 长河：此处指黄河。<br>[7] 萧关：古关名，又名陇山关。<br>[8] 候骑：负责侦察和传递信息的骑兵。</p>", "englishHtml": "<p class=\"poem-lines\">A single carriage goes to the frontier;<br>An envoy crosses northwest mountains high.<br>Like tumbleweed I leave the fortress drear;<br>As wild geese I come’neath Tartarian sky.<br>In boundless desert lonely smoke rises straight;<br>Over endless river the sun sinks round.<br>I meet a cavalier at the camp gate;<br>In northern fort the general will be found.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On Mission to the Frontier,” the poem places personal feeling against the vastness of the frontier, so distance and duty become part of its emotional force.</p>\n<p class=\"commentary\">As a five-character regulated verse, it sets Wang Wei&#x27;s restrained voice against open space and public duty. Key images such as water, clouds, birds, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "038", "zhTitle": "秋夜独坐", "enTitle": "Sitting Alone on an Autumn Night", "chinese": "独坐悲双鬓，\n空堂欲\n[1]\n二更\n[2]\n。\n雨中山果落，\n灯下草虫鸣。\n白发终难变，\n黄金不可成。\n欲知除老病\n[3]\n，\n唯有学无生\n[4]\n。\n王维中年奉佛，诗多禅意。这首诗写出一个思想觉悟即禅悟的过程。从情入理，以情证理。诗的前半篇从人生转到草木昆虫的生存，发现这无知的草木昆虫同有知的人一样，都在无情的时光、岁月的消逝中零落哀鸣。诗人由此得到启发诱导，自以为觉悟了。诗的后半篇从诗人自己嗟老的忧伤，想到了宣扬神仙长生不老的道教。诗人感叹“黄金不可成”，就是否定神仙方术之事，指明炼丹服药祈求长生的虚妄，而认为只有信奉佛教，才能从根本上消除人生的悲哀，解脱生老病死的痛苦。\n注释：\n[1]\n欲：接近。\n[2]\n二更：晚上九时至十一时。\n[3]\n老病：衰老和生病。\n[4]\n无生：佛家语，认为世本虚幻，万物实体无生无灭。", "english": "Sitting alone,I grieve over my hair white,\nIn empty room it approaches midnight.\nWhen it rains in the hill,I hear fruit fall;\nBy lamplight crickets chirp in my hall.\nI cannot blacken my white hair while old,\nNor can I turn a metal into gold.\nIf you want to get rid of ills of old age,\nYou can only learn from the Buddhist sage.", "poemType": "五言律诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">独坐悲双鬓，<br>空堂欲<sup class=\"note-ref\">[1]</sup>二更<sup class=\"note-ref\">[2]</sup>。<br>雨中山果落，<br>灯下草虫鸣。<br>白发终难变，<br>黄金不可成。<br>欲知除老病<sup class=\"note-ref\">[3]</sup>，<br>唯有学无生<sup class=\"note-ref\">[4]</sup>。</p>\n<p class=\"prose\">王维中年奉佛，诗多禅意。这首诗写出一个思想觉悟即禅悟的过程。从情入理，以情证理。诗的前半篇从人生转到草木昆虫的生存，发现这无知的草木昆虫同有知的人一样，都在无情的时光、岁月的消逝中零落哀鸣。诗人由此得到启发诱导，自以为觉悟了。</p>\n<p class=\"prose\">诗的后半篇从诗人自己嗟老的忧伤，想到了宣扬神仙长生不老的道教。诗人感叹“黄金不可成”，就是否定神仙方术之事，指明炼丹服药祈求长生的虚妄，而认为只有信奉佛教，才能从根本上消除人生的悲哀，解脱生老病死的痛苦。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 欲：接近。<br>[2] 二更：晚上九时至十一时。<br>[3] 老病：衰老和生病。<br>[4] 无生：佛家语，认为世本虚幻，万物实体无生无灭。</p>", "englishHtml": "<p class=\"poem-lines\">Sitting alone,I grieve over my hair white,<br>In empty room it approaches midnight.<br>When it rains in the hill,I hear fruit fall;<br>By lamplight crickets chirp in my hall.<br>I cannot blacken my white hair while old,<br>Nor can I turn a metal into gold.<br>If you want to get rid of ills of old age,<br>You can only learn from the Buddhist sage.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Sitting Alone on an Autumn Night,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a five-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains give the poem its visual texture and emotional temperature.</p>"}, {"num": "039", "zhTitle": "李处士山居", "enTitle": "A Scholar’s Retreat", "chinese": "君子盈天阶\n[1]\n，\n小人甘自免。\n方随炼金客，\n林上家绝巘\n[2]\n。\n背岭花未开，\n入云树深浅。\n清昼犹自眠，\n山鸟时一啭。\n处士，指有道德、学问而隐居不仕者。首联，字面是说李处士山居在山之高处，实喻其为人高洁、志存高远，而在朝的小人就没有这等志向。天阶即登天的石阶，引申指天子左右的官署。“甘自免”即指甘愿自免于朝官之列。颔联是说李处士的生活态度飘逸如神仙，安家在险绝的山岩上。炼金客意指炼丹的道士。绝巘是指陡峭的山峰。颈联，李处士的山居在阳光少的一面山坡，高居入云，花开稍迟。背岭是指李处士的山居在山岭的北面。尾联，指一大清早还在睡眠的时候，山鸟就开始了鸣叫。\n注释：\n[1]\n天阶：登天的阶梯，此处指天子左右的官署。\n[2]\n巘（yǎn）：大山上的小山。", "english": "The noble in the court may stay;\nThe common people can be free.\nYou follow Taoists on their way\nTo live on hilltop with high glee.\nYou see no flowers in full bloom\nBut trees high and low in the cloud.\nYou sleep by daylight in your room,\nHeedless of the birds singing loud.", "poemType": "五言律诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">君子盈天阶<sup class=\"note-ref\">[1]</sup>，<br>小人甘自免。<br>方随炼金客，<br>林上家绝巘<sup class=\"note-ref\">[2]</sup>。<br>背岭花未开，<br>入云树深浅。<br>清昼犹自眠，<br>山鸟时一啭。</p>\n<p class=\"prose\">处士，指有道德、学问而隐居不仕者。首联，字面是说李处士山居在山之高处，实喻其为人高洁、志存高远，而在朝的小人就没有这等志向。天阶即登天的石阶，引申指天子左右的官署。“甘自免”即指甘愿自免于朝官之列。颔联是说李处士的生活态度飘逸如神仙，安家在险绝的山岩上。</p>\n<p class=\"prose\">炼金客意指炼丹的道士。绝巘是指陡峭的山峰。颈联，李处士的山居在阳光少的一面山坡，高居入云，花开稍迟。背岭是指李处士的山居在山岭的北面。尾联，指一大清早还在睡眠的时候，山鸟就开始了鸣叫。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 天阶：登天的阶梯，此处指天子左右的官署。<br>[2] 巘（yǎn）：大山上的小山。</p>", "englishHtml": "<p class=\"poem-lines\">The noble in the court may stay;<br>The common people can be free.<br>You follow Taoists on their way<br>To live on hilltop with high glee.<br>You see no flowers in full bloom<br>But trees high and low in the cloud.<br>You sleep by daylight in your room,<br>Heedless of the birds singing loud.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Scholar’s Retreat,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a five-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, clouds, flowers, and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "040", "zhTitle": "渡河到清河", "enTitle": "Crossing the Yellow River", "chinese": "泛舟大河里，\n积水穷天涯。\n天波\n[1]\n忽开拆，\n郡邑千万家。\n行复见城市，\n宛然\n[2]\n有桑麻。\n回瞻旧乡国，\n淼漫连云霞。\n河，指黄河。清河，指唐贝州治所清河县，在今河北清河西。诗中描绘的是黄河下游的景致，深沉、壮观、气势磅礴。先是从水天一色开拆的缝中，看见“郡邑千万家”，然后看见城市，接着是城外的农田，读之令人如见如闻。结尾两句描写作者回首时，只看见河水连天，看不见故乡了，由此抒思乡之情，发人遐思，言已尽而意未穷。\n注释：\n[1]\n天波：天空的云气。\n[2]\n宛然：清晰的样子。", "english": "I cross the River when water runs high,\nIts waves surge up to the end of the sky.\nOver white-crested billows rises a town,\nWith ten thousands of houses up and down.\nFarther on stand villages amid the trees,\nIn the shade of hemp or of mulberries.\nLooking back,but my homeland can’t be seen,\nI see rainbow cloud blend with foliage green.", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">泛舟大河里，<br>积水穷天涯。<br>天波<sup class=\"note-ref\">[1]</sup>忽开拆，<br>郡邑千万家。<br>行复见城市，<br>宛然<sup class=\"note-ref\">[2]</sup>有桑麻。<br>回瞻旧乡国，<br>淼漫连云霞。</p>\n<p class=\"prose\">河，指黄河。清河，指唐贝州治所清河县，在今河北清河西。诗中描绘的是黄河下游的景致，深沉、壮观、气势磅礴。先是从水天一色开拆的缝中，看见“郡邑千万家”，然后看见城市，接着是城外的农田，读之令人如见如闻。结尾两句描写作者回首时，只看见河水连天，看不见故乡了，由此抒思乡之情，发人遐思，言已尽而意未穷。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 天波：天空的云气。<br>[2] 宛然：清晰的样子。</p>", "englishHtml": "<p class=\"poem-lines\">I cross the River when water runs high,<br>Its waves surge up to the end of the sky.<br>Over white-crested billows rises a town,<br>With ten thousands of houses up and down.<br>Farther on stand villages amid the trees,<br>In the shade of hemp or of mulberries.<br>Looking back,but my homeland can’t be seen,<br>I see rainbow cloud blend with foliage green.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Crossing the Yellow River,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, clouds, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "041", "zhTitle": "酬虞部苏员外过蓝田别业不见留之作", "enTitle": "For a Visitor Impromptu to My Blue Field", "chinese": "贫居依谷口，\n乔木带荒村。\n石路枉回驾，\n山家谁候门？\n渔舟胶冻浦，\n猎犬绕寒原。\n唯有白云外，\n疏钟闻夜猿。\n题解：虞部，工部四司之一，置员外郎一人，掌京城街巷种植、山泽苑囿及草木薪炭等事。蓝田别业即辋川别业。不见留指苏员外访王维不遇，没有在辋川停留。首联讲王维贫居在辋川谷口，高高的林木围绕着村庄。颔联讲苏员外屈尊见访却不遇而返。颈联说冬日里渔船被冻在河里，猎犬在寒冷的原野上奔跑。尾联承接颈联的描写，进一步展示了冬日荒村的薄暮凄清景象，白云外还能听到猿啼声。后四句借景表现了诗人归来后见苏员外已去的怅惘心情。", "english": "My hut’s at the mouth of the vale,\nWasteland belted with trees turning pale.\nYou care not for the rugged way\nWhere none waits on you all the day.\nOn frozen stream none fish in vain;\nNo hunter hunts on wintry plain.\nOnly beyond the freecy cloud,\nBells sparsely ring and apes wail loud.", "poemType": "五言律诗", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">贫居依谷口，<br>乔木带荒村。<br>石路枉回驾，<br>山家谁候门？<br>渔舟胶冻浦，<br>猎犬绕寒原。<br>唯有白云外，<br>疏钟闻夜猿。</p>\n<p class=\"prose\">题解：虞部，工部四司之一，置员外郎一人，掌京城街巷种植、山泽苑囿及草木薪炭等事。蓝田别业即辋川别业。不见留指苏员外访王维不遇，没有在辋川停留。首联讲王维贫居在辋川谷口，高高的林木围绕着村庄。颔联讲苏员外屈尊见访却不遇而返。</p>\n<p class=\"prose\">颈联说冬日里渔船被冻在河里，猎犬在寒冷的原野上奔跑。尾联承接颈联的描写，进一步展示了冬日荒村的薄暮凄清景象，白云外还能听到猿啼声。后四句借景表现了诗人归来后见苏员外已去的怅惘心情。</p>", "englishHtml": "<p class=\"poem-lines\">My hut’s at the mouth of the vale,<br>Wasteland belted with trees turning pale.<br>You care not for the rugged way<br>Where none waits on you all the day.<br>On frozen stream none fish in vain;<br>No hunter hunts on wintry plain.<br>Only beyond the freecy cloud,<br>Bells sparsely ring and apes wail loud.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For a Visitor Impromptu to My Blue Field,” the poem is shaped by parting, but its emotion is held back rather than overstated.</p>\n<p class=\"commentary\">As a five-character regulated verse, it keeps farewell emotion controlled, leaving much of the feeling between the lines. Key images such as mountains, clouds, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "042", "zhTitle": "酬比部杨员外暮宿琴台朝跻书阁率尔见赠之作", "enTitle": "Reply to Financier Yang on His Visit to the Lute Terrace", "chinese": "旧简拂尘看，\n鸣琴候月弹。\n桃源迷汉姓，\n松树有秦官。\n空谷归人少，\n青山背日寒。\n羡君栖隐处，\n遥望白云端。\n这首诗是王维为一位弃官归隐的好友所作。首联，看简、弹琴者“拂尘”“候月”，增添了许多情致。颔联两句对仗精工，叙事妥帖，景致之佳令人向往。颈联颇有意外，描述的与前面璀璨烂漫之景相反，此处则是一派清幽清冷意象，以此象征高士心志之卓越，罕有可及。一冷一热、一明一暗体现员外身处红尘又超越红尘之高远心志。\n注释：\n[1]\n跻：登，上升。\n[2]\n率尔：无拘无束，随意。", "english": "You read the classics,dusting old bamboo;\nYou play music on lute as moonbeams do.\nYou forget your name in Peach Blossom Land;\nYour pine has given shade to royal hand.\nFew visit a deserted vale so old;\nMountains after sunset exhale breath cold.\nYour hermitage’s an admirable sight,\nViewed from afar,it is atop cloud white.", "poemType": "五言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">旧简拂尘看，<br>鸣琴候月弹。<br>桃源迷汉姓，<br>松树有秦官。<br>空谷归人少，<br>青山背日寒。<br>羡君栖隐处，<br>遥望白云端。</p>\n<p class=\"prose\">这首诗是王维为一位弃官归隐的好友所作。首联，看简、弹琴者“拂尘”“候月”，增添了许多情致。颔联两句对仗精工，叙事妥帖，景致之佳令人向往。颈联颇有意外，描述的与前面璀璨烂漫之景相反，此处则是一派清幽清冷意象，以此象征高士心志之卓越，罕有可及。一冷一热、一明一暗体现员外身处红尘又超越红尘之高远心志。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 跻：登，上升。<br>[2] 率尔：无拘无束，随意。</p>", "englishHtml": "<p class=\"poem-lines\">You read the classics,dusting old bamboo;<br>You play music on lute as moonbeams do.<br>You forget your name in Peach Blossom Land;<br>Your pine has given shade to royal hand.<br>Few visit a deserted vale so old;<br>Mountains after sunset exhale breath cold.<br>Your hermitage’s an admirable sight,<br>Viewed from afar,it is atop cloud white.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reply to Financier Yang on His Visit to the Lute Terrace,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, moonlight, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "043", "zhTitle": "送张五归山", "enTitle": "Seeing Zhang the Fifth Back to the Mountain", "chinese": "送君尽惆怅，\n复送何人归？\n几日同携手，\n一朝先拂衣\n[1]\n。\n东山有茅屋，\n幸为扫荆扉。\n当亦谢官\n[2]\n去，\n岂令心事违？\n张五本名张諲（yīn），兄弟排行第五。官至刑部员外郎，擅长山水画，是王维的丹青之友，两人以兄弟相称，亲如手足。张諲天宝中辞官归隐，这首诗就是作于此时，表达了诗人送别张五时引发的归隐之意。天宝中后期，杨国忠把持朝政，诗人看着一个个志同道合的朋友离开朝廷，也就产生了一种拂衣而去的心态，可是直到天宝末年，王维也没有辞官。\n注释：\n[1]\n拂衣：振衣而去，此处指归隐。\n[2]\n谢官：辞官。", "english": "Back to the Mountain\nGloomy to part with you,\nWhen shall I say adieu?\nTogether a few days,\nNow you are on your way.\nTo your cot in hills green,\nWill you keep mine as clean?\nI’ll leave then for the hill\nAnd fulfil my heart’s will.", "poemType": "五言律诗", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">送君尽惆怅，<br>复送何人归？<br>几日同携手，<br>一朝先拂衣<sup class=\"note-ref\">[1]</sup>。<br>东山有茅屋，<br>幸为扫荆扉。<br>当亦谢官<sup class=\"note-ref\">[2]</sup>去，<br>岂令心事违？</p>\n<p class=\"prose\">张五本名张諲（yīn），兄弟排行第五。官至刑部员外郎，擅长山水画，是王维的丹青之友，两人以兄弟相称，亲如手足。张諲天宝中辞官归隐，这首诗就是作于此时，表达了诗人送别张五时引发的归隐之意。天宝中后期，杨国忠把持朝政，诗人看着一个个志同道合的朋友离开朝廷，也就产生了一种拂衣而去的心态，可是直到天宝末年，王维也没有辞官。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 拂衣：振衣而去，此处指归隐。<br>[2] 谢官：辞官。</p>", "englishHtml": "<p class=\"poem-lines\">Back to the Mountain<br>Gloomy to part with you,<br>When shall I say adieu?<br>Together a few days,<br>Now you are on your way.<br>To your cot in hills green,<br>Will you keep mine as clean?<br>I’ll leave then for the hill<br>And fulfil my heart’s will.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seeing Zhang the Fifth Back to the Mountain,” the poem is shaped by parting, but its emotion is held back rather than overstated.</p>\n<p class=\"commentary\">As a five-character regulated verse, it keeps farewell emotion controlled, leaving much of the feeling between the lines. Key images such as mountains and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "044", "zhTitle": "喜祖三至留宿", "enTitle": "For Zu the Third Passing the Night with Me", "chinese": "门前洛阳客，\n下马拂征衣\n[1]\n。\n不枉故人驾，\n平生多掩扉。\n行人返深巷，\n积雪带余晖。\n早岁同袍\n[2]\n者，\n高车何处归？\n祖三，即祖咏，排行第三，盛唐著名诗人。这首诗作于开元十三年（725）冬，王维在济州任上。他的老朋友祖咏及第授官后东行赴任，路过济州，王维留他在家中过夜，写了这首诗送给他。在看似平淡的诗句背后，我们读出了诗人内心的寂寞、茫然，当然也有无法掩饰的孤傲和与故旧的友情。\n注释：\n[1]\n征衣：旅行的人穿的衣服。\n[2]\n同袍：指朋友之间关系很好。", "english": "From far away you come so near,\nDismount and dust yourself off here.\nTo show you welcome of my heart,\nMy oft-closed door is kept apart.\nYou do not think my cot obscure,\nThe snow you bring makes sunlight pure.\nOh,dear friend of so long ago,\nWhere will your car tomorrow go?", "poemType": "五言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">门前洛阳客，<br>下马拂征衣<sup class=\"note-ref\">[1]</sup>。<br>不枉故人驾，<br>平生多掩扉。<br>行人返深巷，<br>积雪带余晖。<br>早岁同袍<sup class=\"note-ref\">[2]</sup>者，<br>高车何处归？</p>\n<p class=\"prose\">祖三，即祖咏，排行第三，盛唐著名诗人。这首诗作于开元十三年（725）冬，王维在济州任上。他的老朋友祖咏及第授官后东行赴任，路过济州，王维留他在家中过夜，写了这首诗送给他。在看似平淡的诗句背后，我们读出了诗人内心的寂寞、茫然，当然也有无法掩饰的孤傲和与故旧的友情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 征衣：旅行的人穿的衣服。<br>[2] 同袍：指朋友之间关系很好。</p>", "englishHtml": "<p class=\"poem-lines\">From far away you come so near,<br>Dismount and dust yourself off here.<br>To show you welcome of my heart,<br>My oft-closed door is kept apart.<br>You do not think my cot obscure,<br>The snow you bring makes sunlight pure.<br>Oh,dear friend of so long ago,<br>Where will your car tomorrow go?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For Zu the Third Passing the Night with Me,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "045", "zhTitle": "冬晚对雪忆胡居士家", "enTitle": "For a Buddhist Friend on a Snowing Night", "chinese": "寒更传晓箭\n[1]\n，\n清镜览衰颜。\n隔牖\n[2]\n风惊竹，\n开门雪满山。\n洒空深巷静，\n积素广庭闲。\n借问袁安舍，\n翛然\n[3]\n尚闭关。\n胡居士是一位虔诚信佛、安贫守道的人。此诗通过对雪怀人，流露了诗人悲天悯人的慈悲情怀。首联，凛凛寒夜，更鼓报晓，诗人起来对着清冷的镜子自照，容颜憔悴。颔联，一个“惊”字最能传大雪之神，是写雪的名句，写出了大雪的浩莽气势。颈联，亦是描写深巷、庭院雪景的名句。尾联，典出《后汉书·袁安传》。袁安贫居洛阳，一次下了一丈深的大雪，一般人家都出来扫雪，只有袁安没有。洛阳令以为他已经死在家中，命人扫雪而入，却发现他安卧在床，他说：“大雪天人们都在挨饿，不宜出来乞食。”洛阳令认为他有德行，举为孝廉。\n注释：\n[1]\n晓箭：拂晓时漏壶中指示时刻的箭。\n[2]\n牖（yǒu）：窗户。\n[3]\n翛（xiāo）然：无拘无束的样子。", "english": "The day is dawning at slow pace;\nIn mirror I see wrinkled face.\nOutside bamboos shiver in breeze;\nDoors open,snow-clad mountains freeze.\nFlakes sprinkle deep in quiet lane;\nln courtyard wide white piles remain.\nMay I ask my friend in his room\nIf he is musing in the gloom?", "poemType": "五言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">寒更传晓箭<sup class=\"note-ref\">[1]</sup>，<br>清镜览衰颜。<br>隔牖<sup class=\"note-ref\">[2]</sup>风惊竹，<br>开门雪满山。<br>洒空深巷静，<br>积素广庭闲。<br>借问袁安舍，<br>翛然<sup class=\"note-ref\">[3]</sup>尚闭关。</p>\n<p class=\"prose\">胡居士是一位虔诚信佛、安贫守道的人。此诗通过对雪怀人，流露了诗人悲天悯人的慈悲情怀。首联，凛凛寒夜，更鼓报晓，诗人起来对着清冷的镜子自照，容颜憔悴。颔联，一个“惊”字最能传大雪之神，是写雪的名句，写出了大雪的浩莽气势。颈联，亦是描写深巷、庭院雪景的名句。</p>\n<p class=\"prose\">尾联，典出《后汉书·袁安传》。袁安贫居洛阳，一次下了一丈深的大雪，一般人家都出来扫雪，只有袁安没有。洛阳令以为他已经死在家中，命人扫雪而入，却发现他安卧在床，他说：“大雪天人们都在挨饿，不宜出来乞食。”洛阳令认为他有德行，举为孝廉。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 晓箭：拂晓时漏壶中指示时刻的箭。<br>[2] 牖（yǒu）：窗户。<br>[3] 翛（xiāo）然：无拘无束的样子。</p>", "englishHtml": "<p class=\"poem-lines\">The day is dawning at slow pace;<br>In mirror I see wrinkled face.<br>Outside bamboos shiver in breeze;<br>Doors open,snow-clad mountains freeze.<br>Flakes sprinkle deep in quiet lane;<br>ln courtyard wide white piles remain.<br>May I ask my friend in his room<br>If he is musing in the gloom?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For a Buddhist Friend on a Snowing Night,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, trees, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "046", "zhTitle": "归辋川作", "enTitle": "Back to My Waterside Cottage", "chinese": "谷口疏钟动，\n渔樵稍欲稀。\n悠然远山暮，\n独向白云归。\n菱蔓弱难定，\n杨花轻易飞。\n东皋\n[1]\n春草色，\n惆怅掩柴扉。\n诗人隐退辋川，只是半官半隐。所谓“归辋川作”，是诗人下朝归来所作。首联，傍晚时谷口的钟声缓慢地敲响了，路上行走的渔夫樵子渐渐稀少了。颔联，诗人忧愁地眺望暮色苍茫的远山，独自一人向白云生处回去。颈联，看似写景，菱颈细弱、杨花轻浮，实则写朝廷里趋炎附势的小人。尾联，东皋，唐代诗人常指自己的隐居之地。看到这一片青草，诗人惆怅地回家关上了大门。\n注释：\n[1]\n皋（ɡāo）：水边高地。", "english": "The evening bell tolls parting day,\nFew fishermen on homeward way.\nFar-off hills dissolved in twilight,\nAlone I come back with cloud white.\nFrail duckweeds seem to sway and swing,\nLight willow down wafts on the wing.\nEastern fields dyed in vernal hue,\nGloomy,I close the door anew.", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">谷口疏钟动，<br>渔樵稍欲稀。<br>悠然远山暮，<br>独向白云归。<br>菱蔓弱难定，<br>杨花轻易飞。<br>东皋<sup class=\"note-ref\">[1]</sup>春草色，<br>惆怅掩柴扉。</p>\n<p class=\"prose\">诗人隐退辋川，只是半官半隐。所谓“归辋川作”，是诗人下朝归来所作。首联，傍晚时谷口的钟声缓慢地敲响了，路上行走的渔夫樵子渐渐稀少了。颔联，诗人忧愁地眺望暮色苍茫的远山，独自一人向白云生处回去。颈联，看似写景，菱颈细弱、杨花轻浮，实则写朝廷里趋炎附势的小人。</p>\n<p class=\"prose\">尾联，东皋，唐代诗人常指自己的隐居之地。看到这一片青草，诗人惆怅地回家关上了大门。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 皋（ɡāo）：水边高地。</p>", "englishHtml": "<p class=\"poem-lines\">The evening bell tolls parting day,<br>Few fishermen on homeward way.<br>Far-off hills dissolved in twilight,<br>Alone I come back with cloud white.<br>Frail duckweeds seem to sway and swing,<br>Light willow down wafts on the wing.<br>Eastern fields dyed in vernal hue,<br>Gloomy,I close the door anew.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Back to My Waterside Cottage,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, clouds, flowers, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "047", "zhTitle": "山居即事", "enTitle": "Rural Life", "chinese": "寂寞\n[1]\n掩柴扉，\n苍茫对落晖。\n鹤巢\n[2]\n松树遍，\n人访荜门\n[3]\n稀。\n绿竹含新粉\n[4]\n，\n红莲落故衣。\n渡头灯火起，\n处处采菱归。\n此首可以与上首《归辋川作》连读，不过这首写的是秋景。即事者当前的事物，类似以当前事物为题材的诗古人称为“即事诗”。首联，在秋天的傍晚，诗人寂寞地掩上大门，出来一看，眼前是一片茫茫的夕阳。颔联，松树上到处都有鹤筑的巢，而来访的朋友却不多见。颈联，当年的新竹，嫩嫩的竹节上还留有一圈白色粉末，红色的荷花花瓣却开始一片片脱落。尾联，渡口的渔船上亮起了灯火，采菱的姑娘们正从四面八方归来。\n注释：\n[1]\n寂寞：寂静无声。\n[2]\n巢：栖息。\n[3]\n荜（bì）门：荆竹编成的门，常用于形容房屋简陋。\n[4]\n新粉：指竹子刚长出来时竹节周围会带有的白色的茸粉。", "english": "Lonely,I close my thatched gate,\nAnd face the misty sunset late.\nCranes make their nests among pine trees;\nFew visit my cot as they please.\nBamboos sprinkled with powder new,\nI seem clad in red lotus hue.\nWith lanterns the ferry is bright,\nMaids come back with chestnuts at night.", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">寂寞<sup class=\"note-ref\">[1]</sup>掩柴扉，<br>苍茫对落晖。<br>鹤巢<sup class=\"note-ref\">[2]</sup>松树遍，<br>人访荜门<sup class=\"note-ref\">[3]</sup>稀。<br>绿竹含新粉<sup class=\"note-ref\">[4]</sup>，<br>红莲落故衣。<br>渡头灯火起，<br>处处采菱归。</p>\n<p class=\"prose\">此首可以与上首《归辋川作》连读，不过这首写的是秋景。即事者当前的事物，类似以当前事物为题材的诗古人称为“即事诗”。首联，在秋天的傍晚，诗人寂寞地掩上大门，出来一看，眼前是一片茫茫的夕阳。颔联，松树上到处都有鹤筑的巢，而来访的朋友却不多见。</p>\n<p class=\"prose\">颈联，当年的新竹，嫩嫩的竹节上还留有一圈白色粉末，红色的荷花花瓣却开始一片片脱落。尾联，渡口的渔船上亮起了灯火，采菱的姑娘们正从四面八方归来。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 寂寞：寂静无声。<br>[2] 巢：栖息。<br>[3] 荜（bì）门：荆竹编成的门，常用于形容房屋简陋。<br>[4] 新粉：指竹子刚长出来时竹节周围会带有的白色的茸粉。</p>", "englishHtml": "<p class=\"poem-lines\">Lonely,I close my thatched gate,<br>And face the misty sunset late.<br>Cranes make their nests among pine trees;<br>Few visit my cot as they please.<br>Bamboos sprinkled with powder new,<br>I seem clad in red lotus hue.<br>With lanterns the ferry is bright,<br>Maids come back with chestnuts at night.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Rural Life,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as flowers, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "048", "zhTitle": "辋川闲居", "enTitle": "Leisurely Life by Riverside", "chinese": "一从归白社，\n不复到青门。\n时倚檐前树，\n远看原上村。\n青菰\n[1]\n临水映，\n白鸟向山翻。\n寂寞於陵子，\n桔槔方灌园。\n开元二十四年（736），张九龄罢相，李林甫把持朝政，社会矛盾日趋尖锐。王维此时仍在朝为官。他倾向于张九龄的开明政治，对现实十分不满，于是心生归隐之意，在辋川购置别墅，过着亦官亦隐的生活。本篇便作于这段时期，是其隐逸生活的真实写照。“青菰临水映，白鸟向山翻”一句，诗人以画家的眼光来观察自然景物，抓住眼前景物最鲜明的形象来勾画：青翠的茭白掩映在清冽的水中，白鸟展翅翻飞于苍茫的山间。色彩相互映衬，景致动静结合，自然奇妙。\n注释：\n[1]\n青菰（ɡū）：俗称茭白。", "english": "Come back to my White Hermitage,\nI’ve not gone near the door of sage.\nAt times I lean on courtyard tree\nTo see rural scene before me.\nThe paddy fields turn water green;\nWhite birds whirl against mountain screen.\nThe lonely hermit tries to sprinkle\nHis garden from the pools which wrinkle.", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">一从归白社，<br>不复到青门。<br>时倚檐前树，<br>远看原上村。<br>青菰<sup class=\"note-ref\">[1]</sup>临水映，<br>白鸟向山翻。<br>寂寞於陵子，<br>桔槔方灌园。</p>\n<p class=\"prose\">开元二十四年（736），张九龄罢相，李林甫把持朝政，社会矛盾日趋尖锐。王维此时仍在朝为官。他倾向于张九龄的开明政治，对现实十分不满，于是心生归隐之意，在辋川购置别墅，过着亦官亦隐的生活。本篇便作于这段时期，是其隐逸生活的真实写照。</p>\n<p class=\"prose\">“青菰临水映，白鸟向山翻”一句，诗人以画家的眼光来观察自然景物，抓住眼前景物最鲜明的形象来勾画：青翠的茭白掩映在清冽的水中，白鸟展翅翻飞于苍茫的山间。色彩相互映衬，景致动静结合，自然奇妙。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 青菰（ɡū）：俗称茭白。</p>", "englishHtml": "<p class=\"poem-lines\">Come back to my White Hermitage,<br>I’ve not gone near the door of sage.<br>At times I lean on courtyard tree<br>To see rural scene before me.<br>The paddy fields turn water green;<br>White birds whirl against mountain screen.<br>The lonely hermit tries to sprinkle<br>His garden from the pools which wrinkle.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Leisurely Life by Riverside,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, birds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "049", "zhTitle": "春园即事", "enTitle": "Spring in My Garden", "chinese": "宿雨乘轻屐，\n春寒著弊袍。\n开畦\n[1]\n分白水，\n间柳发红桃。\n草际成棋局，\n林端举桔槔\n[2]\n。\n还持鹿皮几，\n日暮隐蓬蒿。\n诗歌流动着自然的美景和诗人安闲恬适的情怀，清新优美。红桃绿柳，桔槔（古代井上汲水的工具）起落，畦开水流，一片春意盎然的景象。在这良辰美景之中，摆棋对局，凭几蓬蒿，其乐也融融。如画般的景象，似梦般的意境，一切都是那么清幽绮丽，赏心悦目。\n注释：\n[1]\n畦（qí）：田园里分成的一块一块区域。\n[2]\n桔（jié）槔（ɡāo）：井上汲水的工具。", "english": "I put on clogs:it rained last night;\nShabby clad,I feel cold in spring.\nIn my furrows flows water white,\nAnd budding willows spread the wing.\nLike chessboard looks my meadow green;\nThe winch rises high as a tree.\nResting my elbow on deer skin,\nAt sunset amid weeds I’m free.", "poemType": "五言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">宿雨乘轻屐，<br>春寒著弊袍。<br>开畦<sup class=\"note-ref\">[1]</sup>分白水，<br>间柳发红桃。<br>草际成棋局，<br>林端举桔槔<sup class=\"note-ref\">[2]</sup>。<br>还持鹿皮几，<br>日暮隐蓬蒿。</p>\n<p class=\"prose\">诗歌流动着自然的美景和诗人安闲恬适的情怀，清新优美。红桃绿柳，桔槔（古代井上汲水的工具）起落，畦开水流，一片春意盎然的景象。在这良辰美景之中，摆棋对局，凭几蓬蒿，其乐也融融。如画般的景象，似梦般的意境，一切都是那么清幽绮丽，赏心悦目。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 畦（qí）：田园里分成的一块一块区域。<br>[2] 桔（jié）槔（ɡāo）：井上汲水的工具。</p>", "englishHtml": "<p class=\"poem-lines\">I put on clogs:it rained last night;<br>Shabby clad,I feel cold in spring.<br>In my furrows flows water white,<br>And budding willows spread the wing.<br>Like chessboard looks my meadow green;<br>The winch rises high as a tree.<br>Resting my elbow on deer skin,<br>At sunset amid weeds I’m free.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Spring in My Garden,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, flowers, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "050", "zhTitle": "淇上田园即事", "enTitle": "My Garden by Riverside", "chinese": "屏居\n[1]\n淇水上，\n东野旷无山。\n日隐桑柘\n[2]\n外，\n河明闾井\n[3]\n间。\n牧童望村去，\n猎犬随人还。\n静者\n[4]\n亦何事？\n荆扉乘昼关。\n这首诗是王维隐居淇上时所作，描绘了淇上小村傍晚时的优美恬静的田园风光。淇上，淇水边上。淇水发源于河南，流入卫河，在今河南登封市。诗人于开元十四年（726）自济州离任到淇上为官，不久即在淇上弃官隐居。屏居即指隐居。静者是指深得清静之道、超然恬静的人，此处是作者自指。\n注释：\n[1]\n屏居：隐居。\n[2]\n柘（zhè）：柘树。\n[3]\n闾（lǘ）井：村落。\n[4]\n静者：深得清静之道的人，此处为作者自指。", "english": "Living with ease by riverside,\nI see no hills in east plain wide.\nThe sun sinks beyond mulberries;\nThe stream flows between cots and trees.\nThe shepherds to the village go;\nHunters come back with hound and bow.\nWhat shall I do,looking before?\nThough it is noon,I’Il close my door.", "poemType": "五言律诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">屏居<sup class=\"note-ref\">[1]</sup>淇水上，<br>东野旷无山。<br>日隐桑柘<sup class=\"note-ref\">[2]</sup>外，<br>河明闾井<sup class=\"note-ref\">[3]</sup>间。<br>牧童望村去，<br>猎犬随人还。<br>静者<sup class=\"note-ref\">[4]</sup>亦何事？<br>荆扉乘昼关。</p>\n<p class=\"prose\">这首诗是王维隐居淇上时所作，描绘了淇上小村傍晚时的优美恬静的田园风光。淇上，淇水边上。淇水发源于河南，流入卫河，在今河南登封市。诗人于开元十四年（726）自济州离任到淇上为官，不久即在淇上弃官隐居。屏居即指隐居。静者是指深得清静之道、超然恬静的人，此处是作者自指。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 屏居：隐居。<br>[2] 柘（zhè）：柘树。<br>[3] 闾（lǘ）井：村落。<br>[4] 静者：深得清静之道的人，此处为作者自指。</p>", "englishHtml": "<p class=\"poem-lines\">Living with ease by riverside,<br>I see no hills in east plain wide.<br>The sun sinks beyond mulberries;<br>The stream flows between cots and trees.<br>The shepherds to the village go;<br>Hunters come back with hound and bow.<br>What shall I do,looking before?<br>Though it is noon,I’Il close my door.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “My Garden by Riverside,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a five-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, water, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "051", "zhTitle": "晚春与严少尹与诸公见过", "enTitle": "For Vice-Prefect Yan and Others in Late Spring", "chinese": "松菊荒三径，\n图书共五车。\n烹葵\n[2]\n邀上宾，\n看竹到贫家。\n鹊乳\n[3]\n先春草，\n莺啼过落花。\n自怜黄发暮，\n一倍惜年华。\n这首诗作于乾元元年（758）春末。严少尹，即严武。诗人隐居的地方虽然荒凉，但是长满了松树和菊花，同时家里还有很多的藏书。所谓的葵即我国古代一种重要的蔬菜，有菟葵、凫葵、楚葵等，其嫩叶皆可食。显然这样的食物不是豪门所用，而为隐士所食。诗人烹制葵菜邀请尊贵的宾客，来到贫穷简陋的家里欣赏青竹。所谓的乳，《说文》解释为“人及鸟生子曰乳”。这时候春草刚刚生长，鸟雀已经开始哺乳，鸟雀啼叫着飞过春天刚刚开败的落花。黄发指长寿老人。看着春天的美景，诗人自怜自叹自己年纪很老了，一定要加倍珍惜年华，享受这美好闲适的时光。\n注释：\n[1]\n晚春：春季第三个月。\n[2]\n葵：葵菜，嫩叶可食用。\n[3]\n乳：动词，喜鹊养育幼鸟。", "english": "My lane’d be waste without chrysanthemum and pine,\nI have five carloads of script nothing can outdo.\nFor my distinguished friends I’ve prepared greens and wine,\nYou won’t neglect my humble cot for its bamboo.\nMy magpies brood their young before spring breeds green grass;\nMy orioles sing on fallen flowers and shed tears.\nHow can I not regret my hair turns grey,alas!\nCan I make double use of my remaining years?", "poemType": "五言律诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">松菊荒三径，<br>图书共五车。<br>烹葵<sup class=\"note-ref\">[2]</sup>邀上宾，<br>看竹到贫家。<br>鹊乳<sup class=\"note-ref\">[3]</sup>先春草，<br>莺啼过落花。<br>自怜黄发暮，<br>一倍惜年华。</p>\n<p class=\"prose\">这首诗作于乾元元年（758）春末。严少尹，即严武。诗人隐居的地方虽然荒凉，但是长满了松树和菊花，同时家里还有很多的藏书。所谓的葵即我国古代一种重要的蔬菜，有菟葵、凫葵、楚葵等，其嫩叶皆可食。显然这样的食物不是豪门所用，而为隐士所食。</p>\n<p class=\"prose\">诗人烹制葵菜邀请尊贵的宾客，来到贫穷简陋的家里欣赏青竹。所谓的乳，《说文》解释为“人及鸟生子曰乳”。这时候春草刚刚生长，鸟雀已经开始哺乳，鸟雀啼叫着飞过春天刚刚开败的落花。黄发指长寿老人。看着春天的美景，诗人自怜自叹自己年纪很老了，一定要加倍珍惜年华，享受这美好闲适的时光。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 晚春：春季第三个月。<br>[2] 葵：葵菜，嫩叶可食用。<br>[3] 乳：动词，喜鹊养育幼鸟。</p>", "englishHtml": "<p class=\"poem-lines\">My lane’d be waste without chrysanthemum and pine,<br>I have five carloads of script nothing can outdo.<br>For my distinguished friends I’ve prepared greens and wine,<br>You won’t neglect my humble cot for its bamboo.<br>My magpies brood their young before spring breeds green grass;<br>My orioles sing on fallen flowers and shed tears.<br>How can I not regret my hair turns grey,alas!<br>Can I make double use of my remaining years?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For Vice-Prefect Yan and Others in Late Spring,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a five-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as flowers, birds, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "052", "zhTitle": "过感化寺昙兴上人山院", "enTitle": "For Buddhist Tanxing in His Temple", "chinese": "暮持筇竹\n[2]\n杖，\n相待虎溪头。\n催客闻山响，\n归房逐水流。\n野花丛发好，\n谷鸟一声幽。\n夜坐空林寂，\n松风直似秋。\n这首诗是王维游览寺观的诗作。上人是对长老和尚的尊称。首联引“虎溪”为句，叙述了上人手持竹杖在寺外等候诗人。筇（qiónɡ），古书上说的一种竹子，可以做手杖。虎溪，是千年古村，位于蓝田县境西北与宁远县交界之地，因村后石山如虎形，村前溪水潺流不绝，故以“虎溪”为名。颔联是说山中的泉水声仿佛在催促客人进门，诗人和上人一起顺着水流回到了山院。山响即山泉流水声。颈联描写了回到山院所见到的景致。尾联描写了诗人在山寺夜坐的景象。\n注释：\n[1]\n过：过访。\n[2]\n筇（qiónɡ）竹：一种竹子，适宜作拐杖。", "english": "You come at dusk,a bamboo cane in hand,\nTo wait for me at the creek of Tiger’s land.\nThe mountain seems to roar to hasten me\nTo go to your temple with the stream free.\nHow much we like wild flowers in full bloom!\nThe song of a bird breaks the valley’s gloom.\nAt night you muse in empty forest still,\nThe breeze brings through the pines an autumn chill.", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">暮持筇竹<sup class=\"note-ref\">[2]</sup>杖，<br>相待虎溪头。<br>催客闻山响，<br>归房逐水流。<br>野花丛发好，<br>谷鸟一声幽。<br>夜坐空林寂，<br>松风直似秋。</p>\n<p class=\"prose\">这首诗是王维游览寺观的诗作。上人是对长老和尚的尊称。首联引“虎溪”为句，叙述了上人手持竹杖在寺外等候诗人。筇（qiónɡ），古书上说的一种竹子，可以做手杖。虎溪，是千年古村，位于蓝田县境西北与宁远县交界之地，因村后石山如虎形，村前溪水潺流不绝，故以“虎溪”为名。</p>\n<p class=\"prose\">颔联是说山中的泉水声仿佛在催促客人进门，诗人和上人一起顺着水流回到了山院。山响即山泉流水声。颈联描写了回到山院所见到的景致。尾联描写了诗人在山寺夜坐的景象。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 过：过访。<br>[2] 筇（qiónɡ）竹：一种竹子，适宜作拐杖。</p>", "englishHtml": "<p class=\"poem-lines\">You come at dusk,a bamboo cane in hand,<br>To wait for me at the creek of Tiger’s land.<br>The mountain seems to roar to hasten me<br>To go to your temple with the stream free.<br>How much we like wild flowers in full bloom!<br>The song of a bird breaks the valley’s gloom.<br>At night you muse in empty forest still,<br>The breeze brings through the pines an autumn chill.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For Buddhist Tanxing in His Temple,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, flowers, and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "053", "zhTitle": "郑果州相过", "enTitle": "On Governor Zheng’s Visit", "chinese": "丽日照残春，\n初晴草木新。\n床前磨镜客，\n林里灌园人。\n五马\n[1]\n惊穷巷，\n双童\n[2]\n逐老身。\n中厨办粗饭，\n当恕阮家贫。\n这首诗以鲜明的色彩对比，用“丽日”“残春”“草木”等意象勾勒出一幅清新自然的暮春画卷，为郑果州的来访做环境烘托。接着以“磨镜客”“灌园人”自比隐士。诗人用一个“惊”字写出了巷子的幽深与清寂，与贾岛的“僧敲月下门”的“敲”有异曲同工之妙。诗的最后，以阮家贫来自谦，委婉地表达唯恐招待不周之意。整首诗隐隐地透出诗人不慕富贵的傲骨，宁静淡泊的心境以及旷达幽远的胸襟，暗含王维出仕超脱的禅心。\n注释：\n[1]\n五马：太守的车。\n[2]\n双童：指代仆人。", "english": "The sun has beautified the waning spring;\nAfter the shower grass looks fresh and green.\nA hermit cannot do a better thing\nThan water his garden and make it clean.\nYour horse and carriage have woken the lane;\nWe come to welcome you,father and son.\nBut I have only coarse food to entertain.\nExcuse me if it is not better done.", "poemType": "五言律诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">丽日照残春，<br>初晴草木新。<br>床前磨镜客，<br>林里灌园人。<br>五马<sup class=\"note-ref\">[1]</sup>惊穷巷，<br>双童<sup class=\"note-ref\">[2]</sup>逐老身。<br>中厨办粗饭，<br>当恕阮家贫。</p>\n<p class=\"prose\">这首诗以鲜明的色彩对比，用“丽日”“残春”“草木”等意象勾勒出一幅清新自然的暮春画卷，为郑果州的来访做环境烘托。接着以“磨镜客”“灌园人”自比隐士。诗人用一个“惊”字写出了巷子的幽深与清寂，与贾岛的“僧敲月下门”的“敲”有异曲同工之妙。</p>\n<p class=\"prose\">诗的最后，以阮家贫来自谦，委婉地表达唯恐招待不周之意。整首诗隐隐地透出诗人不慕富贵的傲骨，宁静淡泊的心境以及旷达幽远的胸襟，暗含王维出仕超脱的禅心。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 五马：太守的车。<br>[2] 双童：指代仆人。</p>", "englishHtml": "<p class=\"poem-lines\">The sun has beautified the waning spring;<br>After the shower grass looks fresh and green.<br>A hermit cannot do a better thing<br>Than water his garden and make it clean.<br>Your horse and carriage have woken the lane;<br>We come to welcome you,father and son.<br>But I have only coarse food to entertain.<br>Excuse me if it is not better done.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On Governor Zheng’s Visit,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a five-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as trees and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "054", "zhTitle": "送钱少府还蓝田", "enTitle": "Seeing Qian Qi Off to His Blue Field", "chinese": "草色日向好，\n桃源人去稀。\n手持平子赋，\n目送老莱衣。\n每候山樱发，\n时同海燕归。\n今年寒食酒，\n应是返柴扉。\n这首送别诗的送别地点是长安。钱少府即钱起，时任蓝田县尉。首联里提到的桃源系指蓝田辋川。颔联的平子赋系指张衡的《归田赋》，意指“仕不得志，欲归于田”。老莱子特别孝敬父母，年七十而父母犹在，经常身着五彩斑斓的花衣，学小孩儿的样子，哄逗其父母开心。颈联是说钱起总是在樱花开时就准时到辋川探视父母，好像燕子一样，每到春天时就会准时到来。尾联是说今年寒食节的时候，诗人也会回蓝田。", "english": "Grass grows more lush from day to day,\nTo Peach Bloom Land few on the way.\nWith your Home-going Song in hand,\nI see you off to your homeland.\nGo when cherries blossom with glee\nAnd swallows come back from the sea.\nYou’ll drink on Cold Food Day this year\nWhen at your door you will appear.", "poemType": "五言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">草色日向好，<br>桃源人去稀。<br>手持平子赋，<br>目送老莱衣。<br>每候山樱发，<br>时同海燕归。<br>今年寒食酒，<br>应是返柴扉。</p>\n<p class=\"prose\">这首送别诗的送别地点是长安。钱少府即钱起，时任蓝田县尉。首联里提到的桃源系指蓝田辋川。颔联的平子赋系指张衡的《归田赋》，意指“仕不得志，欲归于田”。老莱子特别孝敬父母，年七十而父母犹在，经常身着五彩斑斓的花衣，学小孩儿的样子，哄逗其父母开心。</p>\n<p class=\"prose\">颈联是说钱起总是在樱花开时就准时到辋川探视父母，好像燕子一样，每到春天时就会准时到来。尾联是说今年寒食节的时候，诗人也会回蓝田。</p>", "englishHtml": "<p class=\"poem-lines\">Grass grows more lush from day to day,<br>To Peach Bloom Land few on the way.<br>With your Home-going Song in hand,<br>I see you off to your homeland.<br>Go when cherries blossom with glee<br>And swallows come back from the sea.<br>You’ll drink on Cold Food Day this year<br>When at your door you will appear.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seeing Qian Qi Off to His Blue Field,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, flowers, wine, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "055", "zhTitle": "送杨长史赴果州", "enTitle": "Seeing Prefect Yang Off to Guozhou", "chinese": "褒斜不容幰\n[1]\n，\n之子去何之？\n鸟道\n[2]\n一千里，\n猿啼十二时。\n官桥祭酒\n[3]\n客，\n山木女郎祠。\n别后同明月，\n君应听子规。\n首联讲褒斜栈道悠长而狭窄，不知道杨长史通过这条古栈道去哪里。褒斜，古栈道，在秦岭山脉中贯穿关中平原与汉中盆地的山谷。南口曰褒，北口曰斜，长凡235公里。不容幰，是指道路狭窄。颔联继续描写道路的狭长和野外跋涉的艰难，只有小鸟可以飞过。颈联中的官桥是指官道上的桥梁。祭酒客则是指祖道登程的旅客。此联仍指蜀道的艰难，行必有祈祷。尾联，离别后联系诗人和杨长史的唯一纽带就是那同一轮明月，而子规之啼叫会更加让旅人有思归之情。\n注释：\n[1]\n幰（xiǎn）：车幔，此处代指车辆。\n[2]\n鸟道：狭窄的山路。\n[3]\n祭酒：饯别酒。", "english": "It’s difficult to pass the dale.\nWhy should you go so far away?\nThere are long miles for birds to sail\nAnd for apes to wail night and day.\nFor safety you should pray with wine;\nTo see sights you’d pass hills and streams.\nAfter we part,the moon’s still fine.\nForget not cuckoo’s song in dreams!", "poemType": "五言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">褒斜不容幰<sup class=\"note-ref\">[1]</sup>，<br>之子去何之？<br>鸟道<sup class=\"note-ref\">[2]</sup>一千里，<br>猿啼十二时。<br>官桥祭酒<sup class=\"note-ref\">[3]</sup>客，<br>山木女郎祠。<br>别后同明月，<br>君应听子规。</p>\n<p class=\"prose\">首联讲褒斜栈道悠长而狭窄，不知道杨长史通过这条古栈道去哪里。褒斜，古栈道，在秦岭山脉中贯穿关中平原与汉中盆地的山谷。南口曰褒，北口曰斜，长凡235公里。不容幰，是指道路狭窄。颔联继续描写道路的狭长和野外跋涉的艰难，只有小鸟可以飞过。</p>\n<p class=\"prose\">颈联中的官桥是指官道上的桥梁。祭酒客则是指祖道登程的旅客。此联仍指蜀道的艰难，行必有祈祷。尾联，离别后联系诗人和杨长史的唯一纽带就是那同一轮明月，而子规之啼叫会更加让旅人有思归之情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 幰（xiǎn）：车幔，此处代指车辆。<br>[2] 鸟道：狭窄的山路。<br>[3] 祭酒：饯别酒。</p>", "englishHtml": "<p class=\"poem-lines\">It’s difficult to pass the dale.<br>Why should you go so far away?<br>There are long miles for birds to sail<br>And for apes to wail night and day.<br>For safety you should pray with wine;<br>To see sights you’d pass hills and streams.<br>After we part,the moon’s still fine.<br>Forget not cuckoo’s song in dreams!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seeing Prefect Yang Off to Guozhou,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, moonlight, birds, and wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "056", "zhTitle": "送邢桂州", "enTitle": "Seeing Commissioner Xing Off", "chinese": "铙\n[1]\n吹喧京口，\n风波下洞庭。\n赭圻将赤岸，\n击汰\n[2]\n复扬舲。\n日落江湖白，\n潮来天地青。\n明珠归合浦，\n应逐使臣星。\n首联，铙吹即铙歌，本是军乐，后也在庆祝活动中使用。此两句的意思是送行的鼓乐在京口热闹异常，朋友的船只将在风波中直指湖南洞庭。颔联，船夫奋力划桨，击起水波无数，船飞一般地经过了赭圻、赤岸。颈联是王维描写江南风光的名句。“白”“青”二字最为传神，沈德潜称赞其为“奇警”。尾联用典见《后汉书·孟尝传》中“合浦还珠”的故事。诗人希望邢桂州在桂林任上，能像孟尝君那样，百废俱兴，开创“合浦还珠”的新迹象。\n注释：\n[1]\n铙（náo）吹：军中乐歌。\n[2]\n击汰：用桨击水划船。", "english": "Music is loud by riverside,\nOn the waves of the Lake you ride.\nBanners and flags redden the shore,\nWith drumbeats boatmen dip their oar.\nFrom sunset water takes its dye;\nThe tide turns earth as blue as sky.\nWhen pearls are returned from afar,\nThe envoy comes down like a star.", "poemType": "五言律诗", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">铙<sup class=\"note-ref\">[1]</sup>吹喧京口，<br>风波下洞庭。<br>赭圻将赤岸，<br>击汰<sup class=\"note-ref\">[2]</sup>复扬舲。<br>日落江湖白，<br>潮来天地青。<br>明珠归合浦，<br>应逐使臣星。</p>\n<p class=\"prose\">首联，铙吹即铙歌，本是军乐，后也在庆祝活动中使用。此两句的意思是送行的鼓乐在京口热闹异常，朋友的船只将在风波中直指湖南洞庭。颔联，船夫奋力划桨，击起水波无数，船飞一般地经过了赭圻、赤岸。颈联是王维描写江南风光的名句。“白”“青”二字最为传神，沈德潜称赞其为“奇警”。</p>\n<p class=\"prose\">尾联用典见《后汉书·孟尝传》中“合浦还珠”的故事。诗人希望邢桂州在桂林任上，能像孟尝君那样，百废俱兴，开创“合浦还珠”的新迹象。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 铙（náo）吹：军中乐歌。<br>[2] 击汰：用桨击水划船。</p>", "englishHtml": "<p class=\"poem-lines\">Music is loud by riverside,<br>On the waves of the Lake you ride.<br>Banners and flags redden the shore,<br>With drumbeats boatmen dip their oar.<br>From sunset water takes its dye;<br>The tide turns earth as blue as sky.<br>When pearls are returned from afar,<br>The envoy comes down like a star.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seeing Commissioner Xing Off,” the poem is shaped by parting, but its emotion is held back rather than overstated.</p>\n<p class=\"commentary\">As a five-character regulated verse, it keeps farewell emotion controlled, leaving much of the feeling between the lines. Key images such as water and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "057", "zhTitle": "凉州郊外游望", "enTitle": "A Rustic Scene on the Border", "chinese": "野老\n[1]\n才三户\n[2]\n，\n边村少四邻。\n婆娑依里社，\n箫鼓赛田神。\n洒酒浇刍狗，\n焚香拜木人。\n女巫纷屡舞，\n罗袜自生尘。\n凉州是唐代西部军事重镇，位于今甘肃省武威市，是古代丝绸之路河西走廊段的门户。这首诗描写唐代凉州地区赛神的民俗，颇具乡土气息。甘肃一带少数民族能歌善舞，这也是我国西部少数民族的共同特点。“赛田神”固然是一种带有迷信色彩的活动，但却是当时边地百姓“知恩图报”纯朴品性的体现。\n注释：\n[1]\n野老：村野的老人。\n[2]\n三户：此处指人很少。", "english": "A village has three cots or four,\nOn the frontier neighbors are few.\nThe shrine sees people dance before\nAnd hears drumbeats and flute songs anew.\nOn dogs of straw wine is poured out,\nIncense burned for idols of wood.\nWitches in shoes dance all about,\nTheir stockings dusted to no good.", "poemType": "五言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">野老<sup class=\"note-ref\">[1]</sup>才三户<sup class=\"note-ref\">[2]</sup>，<br>边村少四邻。<br>婆娑依里社，<br>箫鼓赛田神。<br>洒酒浇刍狗，<br>焚香拜木人。<br>女巫纷屡舞，<br>罗袜自生尘。</p>\n<p class=\"prose\">凉州是唐代西部军事重镇，位于今甘肃省武威市，是古代丝绸之路河西走廊段的门户。这首诗描写唐代凉州地区赛神的民俗，颇具乡土气息。甘肃一带少数民族能歌善舞，这也是我国西部少数民族的共同特点。“赛田神”固然是一种带有迷信色彩的活动，但却是当时边地百姓“知恩图报”纯朴品性的体现。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 野老：村野的老人。<br>[2] 三户：此处指人很少。</p>", "englishHtml": "<p class=\"poem-lines\">A village has three cots or four,<br>On the frontier neighbors are few.<br>The shrine sees people dance before<br>And hears drumbeats and flute songs anew.<br>On dogs of straw wine is poured out,<br>Incense burned for idols of wood.<br>Witches in shoes dance all about,<br>Their stockings dusted to no good.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Rustic Scene on the Border,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "058", "zhTitle": "春日上方即事", "enTitle": "For a Buddhist in His Cell", "chinese": "好读高僧传，\n时看辟谷\n[1]\n方。\n鸠形将刻杖，\n龟壳用支床。\n柳色青山映\n[2]\n，\n梨花夕鸟藏。\n北窗桃李下，\n闲坐但焚香。\n上方即山上之佛寺。本诗描写了诗人在日常生活中的学禅经历，体现出了诗人对佛学的喜爱以及深厚的佛学造诣。首联描写了寺中僧人的爱好。高僧传，泛指高僧之传记。辟谷是一种修炼方法，屏除谷食。颔联指寺僧非常老了，生活中有很多古朴之趣。颈联点出了山寺环境怡人适于修炼，柳色、青山、梨花、夕鸟相映成趣。尾联是指在如此幽雅的环境里老僧还可以闲坐焚香静修。\n注释：\n[1]\n辟谷：道教的一种修炼术，辟谷时，除药物外不食。\n[2]\n映：同“掩”，遮掩的意思。", "english": "The Buddhist History’s what you read;\nA meagre meal is what you need.\nA turtledove carved on your cane,\nTortoise shells’neath your bed remain.\nMountains are green with willow trees;\nBirds nest amid peach blooms with ease.\nBy the window beside peach flowers\nYou burn incense in leisure hours.", "poemType": "五言律诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">好读高僧传，<br>时看辟谷<sup class=\"note-ref\">[1]</sup>方。<br>鸠形将刻杖，<br>龟壳用支床。<br>柳色青山映<sup class=\"note-ref\">[2]</sup>，<br>梨花夕鸟藏。<br>北窗桃李下，<br>闲坐但焚香。</p>\n<p class=\"prose\">上方即山上之佛寺。本诗描写了诗人在日常生活中的学禅经历，体现出了诗人对佛学的喜爱以及深厚的佛学造诣。首联描写了寺中僧人的爱好。高僧传，泛指高僧之传记。辟谷是一种修炼方法，屏除谷食。颔联指寺僧非常老了，生活中有很多古朴之趣。</p>\n<p class=\"prose\">颈联点出了山寺环境怡人适于修炼，柳色、青山、梨花、夕鸟相映成趣。尾联是指在如此幽雅的环境里老僧还可以闲坐焚香静修。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 辟谷：道教的一种修炼术，辟谷时，除药物外不食。<br>[2] 映：同“掩”，遮掩的意思。</p>", "englishHtml": "<p class=\"poem-lines\">The Buddhist History’s what you read;<br>A meagre meal is what you need.<br>A turtledove carved on your cane,<br>Tortoise shells’neath your bed remain.<br>Mountains are green with willow trees;<br>Birds nest amid peach blooms with ease.<br>By the window beside peach flowers<br>You burn incense in leisure hours.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For a Buddhist in His Cell,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a five-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, flowers, birds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "059", "zhTitle": "登裴迪秀才小台", "enTitle": "On the Garden Terrace of Pei Di", "chinese": "端居不出户，\n满目望云山。\n落日鸟边下，\n秋原人外闲。\n遥知远林际，\n不见此檐间。\n好客多乘月，\n应门莫上关\n[1]\n。\n起句，王夫之评曰“拙好”。所谓的拙即是纯朴而看似平淡无奇，所谓的好则是精工而伤神。两者自然的融合实为难得。“落日鸟边下，秋原人外闲”句法倒转，尽展晚景之妙，可谓诗境最精彩处。\n注释：\n[1]\n关：门闩。", "english": "Staying at home,you needn’t go out,\nBut see clouds and hills all about.\nWhen birds alight with setting sun,\nOn autumn plain busy is none.\nMy cot’s in the woods far away,\nI can’t see the roof where you stay.\nSo I visit you by moonlight\nAnd leave my door unclosed at night.", "poemType": "五言律诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">端居不出户，<br>满目望云山。<br>落日鸟边下，<br>秋原人外闲。<br>遥知远林际，<br>不见此檐间。<br>好客多乘月，<br>应门莫上关<sup class=\"note-ref\">[1]</sup>。</p>\n<p class=\"prose\">起句，王夫之评曰“拙好”。所谓的拙即是纯朴而看似平淡无奇，所谓的好则是精工而伤神。两者自然的融合实为难得。“落日鸟边下，秋原人外闲”句法倒转，尽展晚景之妙，可谓诗境最精彩处。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 关：门闩。</p>", "englishHtml": "<p class=\"poem-lines\">Staying at home,you needn’t go out,<br>But see clouds and hills all about.<br>When birds alight with setting sun,<br>On autumn plain busy is none.<br>My cot’s in the woods far away,<br>I can’t see the roof where you stay.<br>So I visit you by moonlight<br>And leave my door unclosed at night.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On the Garden Terrace of Pei Di,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a five-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, moonlight, clouds, and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "060", "zhTitle": "千塔主人", "enTitle": "For a Hermit Under the Pagoda", "chinese": "逆旅逢佳节，\n征帆未可前。\n窗临汴河水，\n门渡楚人船。\n鸡犬散墟\n[1]\n落，\n桑榆荫远田。\n所居人不见，\n枕席生云烟。\n这首诗颇具首尾浑融之趣。诗仍是客愁他乡的旧调，但是在首联点明客情之后，即搁笔转调，远眺之处是一派闲云淡墨。这与诗人心胸的开拓、视域的延展是密不可分的。颔联的“窗临”“门渡”两句，尺幅千里之势，正见其心胸。颈联“鸡犬”“桑榆”两句，颇具五柳先生乐居田园之风范。尾联回环诗题，为点睛之妙笔。“人不见”已堪称幻境，而妙思枕席云烟之升腾，可臻于化境矣。\n注释：\n[1]\n墟（xū）落：村落。", "english": "I at an inn must pass the holiday,\nMy boat cannot go on its forward way.\nYour window looks on northern rivershore;\nEast-going ships pass by your southern door.\nHere and there dogs and chickens can be seen;\nThe plain is shaded by mulberries green.\nBut who can see the hermit living there,\nOver whose bed cloud rises in the air?", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">逆旅逢佳节，<br>征帆未可前。<br>窗临汴河水，<br>门渡楚人船。<br>鸡犬散墟<sup class=\"note-ref\">[1]</sup>落，<br>桑榆荫远田。<br>所居人不见，<br>枕席生云烟。</p>\n<p class=\"prose\">这首诗颇具首尾浑融之趣。诗仍是客愁他乡的旧调，但是在首联点明客情之后，即搁笔转调，远眺之处是一派闲云淡墨。这与诗人心胸的开拓、视域的延展是密不可分的。颔联的“窗临”“门渡”两句，尺幅千里之势，正见其心胸。颈联“鸡犬”“桑榆”两句，颇具五柳先生乐居田园之风范。</p>\n<p class=\"prose\">尾联回环诗题，为点睛之妙笔。“人不见”已堪称幻境，而妙思枕席云烟之升腾，可臻于化境矣。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 墟（xū）落：村落。</p>", "englishHtml": "<p class=\"poem-lines\">I at an inn must pass the holiday,<br>My boat cannot go on its forward way.<br>Your window looks on northern rivershore;<br>East-going ships pass by your southern door.<br>Here and there dogs and chickens can be seen;<br>The plain is shaded by mulberries green.<br>But who can see the hermit living there,<br>Over whose bed cloud rises in the air?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For a Hermit Under the Pagoda,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "061", "zhTitle": "少年行", "enTitle": "Song of Youngsters", "chinese": "（四首其一）\n新丰\n[1]\n美酒斗十千，\n咸阳游侠多少年。\n相逢意气为君饮，\n系马高楼垂柳边。\n这首诗写长安城里游侠少年意气风发的风貌和豪迈气概。“新丰美酒”与“咸阳游侠”用对举方式来写，少年游侠堪称人中之杰，新丰美酒堪称酒中之冠。新丰美酒，似乎天生就为少年游侠增色而设；少年游侠，没有新丰美酒也显不出他们的豪纵风流。第三句“相逢意气为君饮”把二者联结在一起。“意气”包含的内容很丰富，轻生报国的壮烈情怀、重义疏财的侠义性格、豪纵不羁的气质、使酒任性的作风等，都可以包含在“意气”之中。“系马高楼垂柳边”是由马、高楼、垂柳组成的一幅画面。马是侠客不可分的伴侣。高楼则正是在繁华街市上那所备有新丰美酒的华美酒楼了。高楼旁的垂柳，则与之相映成趣。它点缀了酒楼风光，使之在华美、热闹中显出雅致、飘逸，不流于市井的鄙俗。\n注释：\n[1]\n新丰：县名，古时新丰县产名酒。", "english": "(I)\nYoung heroes cannot go without good wine,\nWithout them could the capital be fine?\nWhen they meet,they will drink wine as they please,\nTheir horses tethered to the willow trees.", "poemType": "七言绝句", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">（四首其一）<br>新丰<sup class=\"note-ref\">[1]</sup>美酒斗十千，<br>咸阳游侠多少年。<br>相逢意气为君饮，<br>系马高楼垂柳边。</p>\n<p class=\"prose\">这首诗写长安城里游侠少年意气风发的风貌和豪迈气概。“新丰美酒”与“咸阳游侠”用对举方式来写，少年游侠堪称人中之杰，新丰美酒堪称酒中之冠。新丰美酒，似乎天生就为少年游侠增色而设；少年游侠，没有新丰美酒也显不出他们的豪纵风流。</p>\n<p class=\"prose\">第三句“相逢意气为君饮”把二者联结在一起。“意气”包含的内容很丰富，轻生报国的壮烈情怀、重义疏财的侠义性格、豪纵不羁的气质、使酒任性的作风等，都可以包含在“意气”之中。“系马高楼垂柳边”是由马、高楼、垂柳组成的一幅画面。</p>\n<p class=\"prose\">马是侠客不可分的伴侣。高楼则正是在繁华街市上那所备有新丰美酒的华美酒楼了。高楼旁的垂柳，则与之相映成趣。它点缀了酒楼风光，使之在华美、热闹中显出雅致、飘逸，不流于市井的鄙俗。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 新丰：县名，古时新丰县产名酒。</p>", "englishHtml": "<p class=\"stanza-marker\">(I)</p>\n<p class=\"poem-lines\">Young heroes cannot go without good wine,<br>Without them could the capital be fine?<br>When they meet,they will drink wine as they please,<br>Their horses tethered to the willow trees.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song of Youngsters,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as trees and wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "062", "zhTitle": "九月九日忆山东兄弟", "enTitle": "Thinking of My Brothers on Mountain-Climbing Day", "chinese": "独在异乡为异客，\n每逢佳节倍思亲。\n遥知兄弟登高处，\n遍插茱萸\n[1]\n少一人。\n这首诗是王维17岁时的七绝，和他后来那些富于画意、构图设色非常讲究的山水诗不同，这首抒情小诗写得非常朴素。但千百年来，人们在作客他乡的情况下读这首诗，却都强烈地感受到了它的艺术力量。诗歌的第一句用了一个“独”字，两个“异”字，分量下得很足。对亲人的思念，对自己孤孑处境的感受，都凝聚在这个“独”字里面。“异乡为异客”中的两个“异”字所造成的艺术效果，远比一般地叙说他乡作客要强烈得多。作客他乡者的思乡怀亲之情一旦遇到“佳节”——往往是家人团聚的日子——就更容易爆发出来，所以“每逢佳节倍思亲”就是十分自然的事。诗歌的后两句构思更为巧妙奇绝，诗人不说自己思乡，而是想象家乡兄弟对自己的思念。这种写离情从对方落笔的笔法在中晚唐才日渐增多。\n注释：\n[1]\n茱（zhū）萸（yú）：古时人们会在重阳节插戴茱萸。", "english": "Alone,a lonely stranger in a foreign land,\nI doubly pine for my kinsfolk on holiday.\nI know my brothers would,with dog-weed spray in hand,\nClimb up the mountain and miss me so far away.", "poemType": "七言绝句", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">独在异乡为异客，<br>每逢佳节倍思亲。<br>遥知兄弟登高处，<br>遍插茱萸<sup class=\"note-ref\">[1]</sup>少一人。</p>\n<p class=\"prose\">这首诗是王维17岁时的七绝，和他后来那些富于画意、构图设色非常讲究的山水诗不同，这首抒情小诗写得非常朴素。但千百年来，人们在作客他乡的情况下读这首诗，却都强烈地感受到了它的艺术力量。诗歌的第一句用了一个“独”字，两个“异”字，分量下得很足。</p>\n<p class=\"prose\">对亲人的思念，对自己孤孑处境的感受，都凝聚在这个“独”字里面。“异乡为异客”中的两个“异”字所造成的艺术效果，远比一般地叙说他乡作客要强烈得多。作客他乡者的思乡怀亲之情一旦遇到“佳节”——往往是家人团聚的日子——就更容易爆发出来，所以“每逢佳节倍思亲”就是十分自然的事。</p>\n<p class=\"prose\">诗歌的后两句构思更为巧妙奇绝，诗人不说自己思乡，而是想象家乡兄弟对自己的思念。这种写离情从对方落笔的笔法在中晚唐才日渐增多。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 茱（zhū）萸（yú）：古时人们会在重阳节插戴茱萸。</p>", "englishHtml": "<p class=\"poem-lines\">Alone,a lonely stranger in a foreign land,<br>I doubly pine for my kinsfolk on holiday.<br>I know my brothers would,with dog-weed spray in hand,<br>Climb up the mountain and miss me so far away.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Thinking of My Brothers on Mountain-Climbing Day,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "063", "zhTitle": "送元二使安西", "enTitle": "A Farewell Song", "chinese": "渭城朝雨浥\n[1]\n轻尘，\n客舍青青柳色新。\n劝君更尽一杯酒，\n西出阳关无故人。\n本诗是一首极负盛名、千古传诵、脍炙人口的送别诗，曾被谱入乐曲，称为“渭城曲”“阳关曲”或“阳关三叠”。安西是唐中央政府为统辖西域而设的都护府的简称。前两句分别写明送别时间是清晨，地点是渭城客舍，氛围是自东向西延伸不见尽头的驿道以及驿道两旁的柳树。这一切似乎都是极平常的景物，而读来却风光如画，抒情浓郁，构成了一幅色调清新明朗的图景，为这场送别提供了典型的自然环境。后两句是一个整体。朋友“西出阳关”免不了经历万里长途跋涉的艰辛与寂寞。因此，这临行之际“劝君更尽一杯酒”就更是浸透了诗人全部情义的琼浆玉液。这里不只有依依惜别的情谊与对远行者的体贴，还包含着对国家和平安宁的美好祝愿。\n注释：\n[1]\n浥（yì）：湿。", "english": "No dust is raised on the road wet with morning rain,\nThe willows by the hotel look so fresh and green.\nI invite you to drink a cup of wine again,\nWest of the Sunny Pass no friends will be seen.", "poemType": "七言绝句", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">渭城朝雨浥<sup class=\"note-ref\">[1]</sup>轻尘，<br>客舍青青柳色新。<br>劝君更尽一杯酒，<br>西出阳关无故人。</p>\n<p class=\"prose\">本诗是一首极负盛名、千古传诵、脍炙人口的送别诗，曾被谱入乐曲，称为“渭城曲”“阳关曲”或“阳关三叠”。安西是唐中央政府为统辖西域而设的都护府的简称。前两句分别写明送别时间是清晨，地点是渭城客舍，氛围是自东向西延伸不见尽头的驿道以及驿道两旁的柳树。</p>\n<p class=\"prose\">这一切似乎都是极平常的景物，而读来却风光如画，抒情浓郁，构成了一幅色调清新明朗的图景，为这场送别提供了典型的自然环境。后两句是一个整体。朋友“西出阳关”免不了经历万里长途跋涉的艰辛与寂寞。因此，这临行之际“劝君更尽一杯酒”就更是浸透了诗人全部情义的琼浆玉液。</p>\n<p class=\"prose\">这里不只有依依惜别的情谊与对远行者的体贴，还包含着对国家和平安宁的美好祝愿。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 浥（yì）：湿。</p>", "englishHtml": "<p class=\"poem-lines\">No dust is raised on the road wet with morning rain,<br>The willows by the hotel look so fresh and green.<br>I invite you to drink a cup of wine again,<br>West of the Sunny Pass no friends will be seen.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Farewell Song,” the poem places personal feeling against the vastness of the frontier, so distance and duty become part of its emotional force.</p>\n<p class=\"commentary\">As a seven-character quatrain, it sets Wang Wei&#x27;s restrained voice against open space and public duty. Key images such as trees, wine, frontier scenes, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "064", "zhTitle": "送沈子福之江东", "enTitle": "Seeing a Friend Off to the East", "chinese": "杨柳渡头行客稀，\n罟师\n[1]\n荡桨向临圻。\n惟有相思\n[2]\n似春色，\n江南江北送君归。\n送别诗是王维诗歌创作中的一个重要题材，几乎首首都有新意。本诗第一句的“行客稀”三字写渡口的冷落，而其中却隐隐透出诗人此时的心情。第二句写送行者站在岸头，目送友人，心逐江波，情思悠远。这时，依依惜别变为对朋友一路行程的关心。这两句点明了环境，烘托了气氛，为下面感情的抒发做了铺垫。七绝的第三句往往最能彰显诗歌创作的功力。格调的高下、笔法的工拙，都在这一句。而本诗的第三句以春色比友情，可以说是翻空出奇，化无形为有形。人们对春色的所有美好感觉和印象，乃至古往今来骚人墨客对春色的歌咏，都成了“相思”一语的丰富内涵。\n注释：\n[1]\n罟（ɡǔ）师：船夫。\n[2]\n相思：此处指好友之间的思念。", "english": "At willow-shaded ferry passengers are few;\nInto the eastward stream the boatman puts his oars.\nOnly my longing heart looks like the vernal hue,\nIt would go with you along northern and southern shores.", "poemType": "七言绝句", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">杨柳渡头行客稀，<br>罟师<sup class=\"note-ref\">[1]</sup>荡桨向临圻。<br>惟有相思<sup class=\"note-ref\">[2]</sup>似春色，<br>江南江北送君归。</p>\n<p class=\"prose\">送别诗是王维诗歌创作中的一个重要题材，几乎首首都有新意。本诗第一句的“行客稀”三字写渡口的冷落，而其中却隐隐透出诗人此时的心情。第二句写送行者站在岸头，目送友人，心逐江波，情思悠远。这时，依依惜别变为对朋友一路行程的关心。</p>\n<p class=\"prose\">这两句点明了环境，烘托了气氛，为下面感情的抒发做了铺垫。七绝的第三句往往最能彰显诗歌创作的功力。格调的高下、笔法的工拙，都在这一句。而本诗的第三句以春色比友情，可以说是翻空出奇，化无形为有形。人们对春色的所有美好感觉和印象，乃至古往今来骚人墨客对春色的歌咏，都成了“相思”一语的丰富内涵。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 罟（ɡǔ）师：船夫。<br>[2] 相思：此处指好友之间的思念。</p>", "englishHtml": "<p class=\"poem-lines\">At willow-shaded ferry passengers are few;<br>Into the eastward stream the boatman puts his oars.<br>Only my longing heart looks like the vernal hue,<br>It would go with you along northern and southern shores.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seeing a Friend Off to the East,” the poem is shaped by parting, but its emotion is held back rather than overstated.</p>\n<p class=\"commentary\">As a seven-character quatrain, it keeps farewell emotion controlled, leaving much of the feeling between the lines. Key images such as water, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "065", "zhTitle": "伊州歌", "enTitle": "Song of Lovesickness", "chinese": "清风明月苦\n[1]\n相思，\n荡子\n[2]\n从戎十载余。\n征人去日殷勤嘱，\n归雁来时数附书\n[3]\n。\n“伊州”为曲调名。王维的这首绝句是当时梨园传唱的名歌。诗的前两句，展现出一位女子在秋夜里苦苦思念远征丈夫的情景。诗的后两句运用逆挽（叙事体裁中的“倒叙”）手法，引导读者随女主人公的回忆，重睹发生在10年前动人的一幕生活场景：送行女子对即将入伍的丈夫说不出更多的话，千言万语化成一句叮咛：“当大雁南归时，你可要多多地寄家书给我啊！”然而这种叮咛真的可以让在战场上出生入死、身不由己的丈夫多寄几封家书吗？此诗艺术构思的巧妙，主要表现在“逆挽”的妙用。然而，读者只觉其平易亲切，毫不着意，娓娓动人，这正是诗艺臻于化境、炉火纯青的体现。\n注释：\n[1]\n苦：形容到了极点。\n[2]\n荡子：此处指丈夫。\n[3]\n附书：寄书信。", "english": "How much I long for you,seeing the moon in breeze!\nYou’ve gone to the frontier for more than ten long years.\nDo you remember what I said to the wild geese:\n“Bring me a letter for which I have shed vain tears!”", "poemType": "七言绝句", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">清风明月苦<sup class=\"note-ref\">[1]</sup>相思，<br>荡子<sup class=\"note-ref\">[2]</sup>从戎十载余。<br>征人去日殷勤嘱，<br>归雁来时数附书<sup class=\"note-ref\">[3]</sup>。</p>\n<p class=\"prose\">“伊州”为曲调名。王维的这首绝句是当时梨园传唱的名歌。诗的前两句，展现出一位女子在秋夜里苦苦思念远征丈夫的情景。诗的后两句运用逆挽（叙事体裁中的“倒叙”）手法，引导读者随女主人公的回忆，重睹发生在10年前动人的一幕生活场景：送行女子对即将入伍的丈夫说不出更多的话，千言万语化成一句叮咛：“当大雁南归时，你可要多多地寄家书给我啊！”</p>\n<p class=\"prose\">然而这种叮咛真的可以让在战场上出生入死、身不由己的丈夫多寄几封家书吗？此诗艺术构思的巧妙，主要表现在“逆挽”的妙用。然而，读者只觉其平易亲切，毫不着意，娓娓动人，这正是诗艺臻于化境、炉火纯青的体现。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 苦：形容到了极点。<br>[2] 荡子：此处指丈夫。<br>[3] 附书：寄书信。</p>", "englishHtml": "<p class=\"poem-lines\">How much I long for you,seeing the moon in breeze!<br>You’ve gone to the frontier for more than ten long years.<br>Do you remember what I said to the wild geese:<br>“Bring me a letter for which I have shed vain tears!”</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song of Lovesickness,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as moonlight, birds, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "066", "zhTitle": "戏题盘石", "enTitle": "Written at Random on a Rock", "chinese": "可怜\n[1]\n盘石临泉水，\n复有垂杨拂酒杯。\n若道春风不解意，\n何因\n[2]\n吹送落花来？\n这首诗写柳拂花飞的春天，诗人与朋友饮酒于大石之上的情景。全诗情绪欢畅，意境耐人寻味，充满了生机与野趣。前两句是说，真可爱啊，清泉边上卧着一块盘石，而我就坐在这盘石上饮酒，清风吹动垂杨的枝条，轻轻地抚摸着酒杯。后两句是说，如果说春风不理解人的心意，那它为什么又吹撒落花来助酒兴呢？\n注释：\n[1]\n可怜：可爱。\n[2]\n何因：也作“因何”。", "english": "By the fountainside stands a rock at ease;\nMy wine-cup is caressed by a willow tree.\nWho says the vernal breeze does not know how to please?\nWhy does it blow down flowers up to me?", "poemType": "七言绝句", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">可怜<sup class=\"note-ref\">[1]</sup>盘石临泉水，<br>复有垂杨拂酒杯。<br>若道春风不解意，<br>何因<sup class=\"note-ref\">[2]</sup>吹送落花来？</p>\n<p class=\"prose\">这首诗写柳拂花飞的春天，诗人与朋友饮酒于大石之上的情景。全诗情绪欢畅，意境耐人寻味，充满了生机与野趣。前两句是说，真可爱啊，清泉边上卧着一块盘石，而我就坐在这盘石上饮酒，清风吹动垂杨的枝条，轻轻地抚摸着酒杯。后两句是说，如果说春风不理解人的心意，那它为什么又吹撒落花来助酒兴呢？</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 可怜：可爱。<br>[2] 何因：也作“因何”。</p>", "englishHtml": "<p class=\"poem-lines\">By the fountainside stands a rock at ease;<br>My wine-cup is caressed by a willow tree.<br>Who says the vernal breeze does not know how to please?<br>Why does it blow down flowers up to me?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Written at Random on a Rock,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, flowers, and wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "067", "zhTitle": "与卢员外象过崔处士兴宗林亭", "enTitle": "Cui’s Bower in the Forest", "chinese": "绿树重阴盖四邻，\n青苔日厚自无尘。\n科头\n[1]\n箕踞\n[2]\n长松下，\n白眼\n[3]\n看他世上人。\n卢员外象，即员外郎卢象，盛唐颇有名气的诗人。崔兴宗，王维的内弟，此时尚未出仕，故称处士。前两句是说，崔兴宗的林亭有一棵好大的树，枝繁叶茂，重重覆盖着四周。而树荫下青青的苔藓一天比一天厚实，自然不见有任何尘土。后两句是说，崔兴宗坐在这棵大松树下，帽子也不戴，两腿向前伸开坐着，傲慢地翻着白眼，鄙视人世间的世俗小人。全诗描画出崔兴宗强烈的爱憎，不拘俗礼、为人正直坦荡的精神风貌。\n注释：\n[1]\n科头：不戴帽子，把头发挽成发髻。\n[2]\n箕（jī）踞（jù）：伸展两脚而坐，表示不拘束的坐姿。\n[3]\n白眼：此处指代蔑视。", "english": "Green trees cast shade on shade around;\nThere is no dust on mossy ground.\nSitting bare-headed’neath pine-trees,\nHe looks down on those who displease.", "poemType": "七言绝句", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">绿树重阴盖四邻，<br>青苔日厚自无尘。<br>科头<sup class=\"note-ref\">[1]</sup>箕踞<sup class=\"note-ref\">[2]</sup>长松下，<br>白眼<sup class=\"note-ref\">[3]</sup>看他世上人。</p>\n<p class=\"prose\">卢员外象，即员外郎卢象，盛唐颇有名气的诗人。崔兴宗，王维的内弟，此时尚未出仕，故称处士。前两句是说，崔兴宗的林亭有一棵好大的树，枝繁叶茂，重重覆盖着四周。而树荫下青青的苔藓一天比一天厚实，自然不见有任何尘土。后两句是说，崔兴宗坐在这棵大松树下，帽子也不戴，两腿向前伸开坐着，傲慢地翻着白眼，鄙视人世间的世俗小人。</p>\n<p class=\"prose\">全诗描画出崔兴宗强烈的爱憎，不拘俗礼、为人正直坦荡的精神风貌。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 科头：不戴帽子，把头发挽成发髻。<br>[2] 箕（jī）踞（jù）：伸展两脚而坐，表示不拘束的坐姿。<br>[3] 白眼：此处指代蔑视。</p>", "englishHtml": "<p class=\"poem-lines\">Green trees cast shade on shade around;<br>There is no dust on mossy ground.<br>Sitting bare-headed’neath pine-trees,<br>He looks down on those who displease.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Cui’s Bower in the Forest,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a seven-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "068", "zhTitle": "寒食汜上作", "enTitle": "Cold Food Day on River Si", "chinese": "广武城边逢暮春，\n汶阳归客\n[1]\n泪沾巾。\n落花寂寂\n[2]\n啼山鸟，\n杨柳青青渡水\n[3]\n人。\n此诗是开元十四年（726）作者自济州西归，寒食节时经广武、汜水而作。寒食，节令名，在农历清明节的前一天。相传是晋文公为悼念宁被烧死而不出山的介子推所设，这一天禁止生火煮食，只吃冷食。前两句是说，诗人自济州汶阳西归，途经河南广武城，适逢暮春时节，心情悲伤。面对暮春的衰败景色，诗人胸中既有对逝去光阴的伤感，又有对未来的迷茫。后两句是说，空山中的鸟啼反而显出落花的寂寥，更衬出诗人的孤单，只有青青的杨柳仿佛与渡水的诗人依依惜别。\n注释：\n[1]\n汶阳归客：诗人自指。\n[2]\n寂寂：形容寂静无声。\n[3]\n水：指汜水。", "english": "Spring fades when I pass by the city wall,\nHow can my homesick tears not fall?\nOver fallen flowers mountain birds cry;\nGreen willows will not say to me“Goodbye!”", "poemType": "七言绝句", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">广武城边逢暮春，<br>汶阳归客<sup class=\"note-ref\">[1]</sup>泪沾巾。<br>落花寂寂<sup class=\"note-ref\">[2]</sup>啼山鸟，<br>杨柳青青渡水<sup class=\"note-ref\">[3]</sup>人。</p>\n<p class=\"prose\">此诗是开元十四年（726）作者自济州西归，寒食节时经广武、汜水而作。寒食，节令名，在农历清明节的前一天。相传是晋文公为悼念宁被烧死而不出山的介子推所设，这一天禁止生火煮食，只吃冷食。前两句是说，诗人自济州汶阳西归，途经河南广武城，适逢暮春时节，心情悲伤。</p>\n<p class=\"prose\">面对暮春的衰败景色，诗人胸中既有对逝去光阴的伤感，又有对未来的迷茫。后两句是说，空山中的鸟啼反而显出落花的寂寥，更衬出诗人的孤单，只有青青的杨柳仿佛与渡水的诗人依依惜别。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 汶阳归客：诗人自指。<br>[2] 寂寂：形容寂静无声。<br>[3] 水：指汜水。</p>", "englishHtml": "<p class=\"poem-lines\">Spring fades when I pass by the city wall,<br>How can my homesick tears not fall?<br>Over fallen flowers mountain birds cry;<br>Green willows will not say to me“Goodbye!”</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Cold Food Day on River Si,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, flowers, and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "069", "zhTitle": "秋夜曲", "enTitle": "Song of an Autumn Night", "chinese": "桂魄\n[1]\n初生秋露微，\n轻罗\n[2]\n已薄未更衣。\n银筝\n[3]\n夜久殷勤弄\n[4]\n，\n心怯空房不忍归。\n此题属乐府《杂曲歌辞》，是一首婉转含蓄的闺怨诗，写初秋月夜少妇的怨情。起句写秋月从东方升起，露水虽生，却是淡薄微少，给人一种清凉之感，烘托出女主人公清冷孤寂的心情。第二句写女主人公在气候转凉的季节还穿着轻软细薄的罗衣，没有更换秋衣；暗示了因秋凉需要更衣而思念远方的丈夫。第三句写女主人公的弹筝行动，实际是以乐曲寄情。结句以巧妙的构思和奇特的表现方法，通过女主人公的心理活动，展示了她独守空房的哀怨。\n注释：\n[1]\n桂魄：此处指月亮。\n[2]\n轻罗：轻薄的丝织品，此处代指夏装。\n[3]\n筝：一种拨弦乐器。\n[4]\n殷勤弄：频频弹拨。", "english": "Chilled by light autumn dew beneath the crescent moon,\nShe has not changed her dress though her silk robe is thin,\nPlaying all night on silver lute an endless tune,\nAfraid of empty room,she can’t bear to go in.", "poemType": "七言绝句", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">桂魄<sup class=\"note-ref\">[1]</sup>初生秋露微，<br>轻罗<sup class=\"note-ref\">[2]</sup>已薄未更衣。<br>银筝<sup class=\"note-ref\">[3]</sup>夜久殷勤弄<sup class=\"note-ref\">[4]</sup>，<br>心怯空房不忍归。</p>\n<p class=\"prose\">此题属乐府《杂曲歌辞》，是一首婉转含蓄的闺怨诗，写初秋月夜少妇的怨情。起句写秋月从东方升起，露水虽生，却是淡薄微少，给人一种清凉之感，烘托出女主人公清冷孤寂的心情。第二句写女主人公在气候转凉的季节还穿着轻软细薄的罗衣，没有更换秋衣；</p>\n<p class=\"prose\">暗示了因秋凉需要更衣而思念远方的丈夫。第三句写女主人公的弹筝行动，实际是以乐曲寄情。结句以巧妙的构思和奇特的表现方法，通过女主人公的心理活动，展示了她独守空房的哀怨。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 桂魄：此处指月亮。<br>[2] 轻罗：轻薄的丝织品，此处代指夏装。<br>[3] 筝：一种拨弦乐器。<br>[4] 殷勤弄：频频弹拨。</p>", "englishHtml": "<p class=\"poem-lines\">Chilled by light autumn dew beneath the crescent moon,<br>She has not changed her dress though her silk robe is thin,<br>Playing all night on silver lute an endless tune,<br>Afraid of empty room,she can’t bear to go in.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song of an Autumn Night,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "070", "zhTitle": "奉和圣制从蓬莱向兴庆阁道中留春雨中春望之作应制", "enTitle": "Written in the Same Rhymes as His Majesty’s Verse on a Spring Scene in Rain Written on His Way from the Fairy Palace to the Celebration Hall", "chinese": "[1]\n渭水自萦秦塞曲，\n黄山旧绕汉宫斜。\n銮舆\n[2]\n迥出\n[3]\n千门柳，\n阁道回看上苑\n[4]\n花。\n云里帝城双凤阙，\n雨中春树万人家。\n为乘阳气\n[5]\n行时令，\n不是宸\n[6]\n游重物华\n[7]\n。\n蓬莱宫，即唐大明宫。唐代宫城位于长安东北，而大明宫又位于宫城东北。兴庆宫在宫城东南角。公元735年，从大明宫经兴庆宫，一直到城东南的风景区曲江，筑阁道相通。帝王后妃，可由阁道直达曲江。王维的这首七律，就是唐玄宗由阁道出游时在雨中春望赋诗的一首和作。所谓“应制”，指应皇帝之命而作。古代应制诗，大多是歌功颂德之词。王维这首诗也不例外，但诗歌的艺术性很高，王维善于抓住眼前的实际景物进行渲染。比如用春天作为背景，让帝城自然地染上一层春色；用雨中云雾缭绕来表现氤氲祥瑞的气氛，这些都显得真切而自然。这是因为王维兼有诗人和画家之长，在选取、再现帝城长安景物的时候，构图上既显得阔大美好，又足以传达处于兴盛时期帝都长安的风貌。\n注释：\n[1]\n应制：指应皇帝之命而作。\n[2]\n銮（luán）舆（yú）：皇帝的坐乘。\n[3]\n迥（jiǒnɡ）出：远出。\n[4]\n上苑：此处指皇家园林。\n[5]\n阳气：春天的气息。\n[6]\n宸（chén）：指代皇帝居处，后又引伸为皇帝的代称。\n[7]\n华：形容美好。", "english": "The winding River passes the capital by;\nThe Yellow Mountains surround royal palaces high.\nMagnificent carriages caressed by willow trees;\nThe broad way adorned with fragrant flowers to please.\nTwo towers pierce the cloud to scrape the azure sky,\nThe vernal trees shed crystalline tears far and nigh.\nThe royal trip is made to welcome early spring,\nSo even flowers in rain are gladdened to sing.", "poemType": "七言律诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">渭水自萦秦塞曲，<br>黄山旧绕汉宫斜。<br>銮舆<sup class=\"note-ref\">[2]</sup>迥出<sup class=\"note-ref\">[3]</sup>千门柳，<br>阁道回看上苑<sup class=\"note-ref\">[4]</sup>花。<br>云里帝城双凤阙，<br>雨中春树万人家。<br>为乘阳气<sup class=\"note-ref\">[5]</sup>行时令，<br>不是宸<sup class=\"note-ref\">[6]</sup>游重物华<sup class=\"note-ref\">[7]</sup>。</p>\n<p class=\"prose\">蓬莱宫，即唐大明宫。唐代宫城位于长安东北，而大明宫又位于宫城东北。兴庆宫在宫城东南角。公元735年，从大明宫经兴庆宫，一直到城东南的风景区曲江，筑阁道相通。帝王后妃，可由阁道直达曲江。王维的这首七律，就是唐玄宗由阁道出游时在雨中春望赋诗的一首和作。</p>\n<p class=\"prose\">所谓“应制”，指应皇帝之命而作。古代应制诗，大多是歌功颂德之词。王维这首诗也不例外，但诗歌的艺术性很高，王维善于抓住眼前的实际景物进行渲染。比如用春天作为背景，让帝城自然地染上一层春色；用雨中云雾缭绕来表现氤氲祥瑞的气氛，这些都显得真切而自然。</p>\n<p class=\"prose\">这是因为王维兼有诗人和画家之长，在选取、再现帝城长安景物的时候，构图上既显得阔大美好，又足以传达处于兴盛时期帝都长安的风貌。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 应制：指应皇帝之命而作。<br>[2] 銮（luán）舆（yú）：皇帝的坐乘。<br>[3] 迥（jiǒnɡ）出：远出。<br>[4] 上苑：此处指皇家园林。<br>[5] 阳气：春天的气息。<br>[6] 宸（chén）：指代皇帝居处，后又引伸为皇帝的代称。<br>[7] 华：形容美好。</p>", "englishHtml": "<p class=\"poem-lines\">The winding River passes the capital by;<br>The Yellow Mountains surround royal palaces high.<br>Magnificent carriages caressed by willow trees;<br>The broad way adorned with fragrant flowers to please.<br>Two towers pierce the cloud to scrape the azure sky,<br>The vernal trees shed crystalline tears far and nigh.<br>The royal trip is made to welcome early spring,<br>So even flowers in rain are gladdened to sing.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Written in the Same Rhymes as His Majesty’s Verse on a Spring Scene in Rain Written on His Way from the Fairy Palace to the Celebration Hall,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, water, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "071", "zhTitle": "和贾舍人早朝", "enTitle": "Reply to Jia Zhi’s Morning Levee", "chinese": "绛帻鸡人报晓筹，\n尚衣\n[1]\n方进翠云裘。\n九天阊阖开宫殿，\n万国衣冠拜冕旒\n[2]\n。\n日色才临仙掌动，\n香烟欲傍衮龙浮。\n朝罢须裁五色诏，\n佩声归到凤池\n[3]\n头。\n贾至写过一首《早朝大明宫》，当时颇为人注目，杜甫、岑参亦曾作诗相和。王维的这首和作，利用细节描写和场景渲染，写出了大明宫早朝时庄严华贵的气氛，别具艺术特色。首联“报晓”和“进翠云裘”两个细节，显示了宫廷中庄严、肃穆的特点，给早朝制造气氛。颔联在“万国衣冠”之后着一“拜”字，利用数量上众与寡、位置上卑与尊的对比，突出了大唐帝国的威仪。“宫殿”即贾至题中的大明宫。“冕旒”本是皇帝戴的帽子，此代指皇帝。颈联通过仙掌挡日、香烟缭绕制造了一种皇廷特有的雍容华贵氛围。“仙掌”是形状如扇的仪仗，用以挡风遮日。尾联是说“朝罢”之后，皇帝有事诏告，所以贾至要到中书省凤池去用五色纸起草诏书了。\n注释：\n[1]\n尚衣：掌管皇家衣著的官员。\n[2]\n冕旒：指皇帝。\n[3]\n凤池：指中书省。", "english": "The watchmen in red hood announce the dawning day;\nThe attendants come with green-cloud fur on the way.\nThe imperial palace opens its door on door;\nEnvoys from foreign lands bow to the throne we adore.\nYou stand beside the fan-holder at first daylight,\nAnd see the incense-sweetened dragon on the height.\nWithdrawn,you write on royal paper colorful;\nWith pendants clinking you return to Phoenix Pool.", "poemType": "七言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">绛帻鸡人报晓筹，<br>尚衣<sup class=\"note-ref\">[1]</sup>方进翠云裘。<br>九天阊阖开宫殿，<br>万国衣冠拜冕旒<sup class=\"note-ref\">[2]</sup>。<br>日色才临仙掌动，<br>香烟欲傍衮龙浮。<br>朝罢须裁五色诏，<br>佩声归到凤池<sup class=\"note-ref\">[3]</sup>头。</p>\n<p class=\"prose\">贾至写过一首《早朝大明宫》，当时颇为人注目，杜甫、岑参亦曾作诗相和。王维的这首和作，利用细节描写和场景渲染，写出了大明宫早朝时庄严华贵的气氛，别具艺术特色。首联“报晓”和“进翠云裘”两个细节，显示了宫廷中庄严、肃穆的特点，给早朝制造气氛。</p>\n<p class=\"prose\">颔联在“万国衣冠”之后着一“拜”字，利用数量上众与寡、位置上卑与尊的对比，突出了大唐帝国的威仪。“宫殿”即贾至题中的大明宫。“冕旒”本是皇帝戴的帽子，此代指皇帝。颈联通过仙掌挡日、香烟缭绕制造了一种皇廷特有的雍容华贵氛围。</p>\n<p class=\"prose\">“仙掌”是形状如扇的仪仗，用以挡风遮日。尾联是说“朝罢”之后，皇帝有事诏告，所以贾至要到中书省凤池去用五色纸起草诏书了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 尚衣：掌管皇家衣著的官员。<br>[2] 冕旒：指皇帝。<br>[3] 凤池：指中书省。</p>", "englishHtml": "<p class=\"poem-lines\">The watchmen in red hood announce the dawning day;<br>The attendants come with green-cloud fur on the way.<br>The imperial palace opens its door on door;<br>Envoys from foreign lands bow to the throne we adore.<br>You stand beside the fan-holder at first daylight,<br>And see the incense-sweetened dragon on the height.<br>Withdrawn,you write on royal paper colorful;<br>With pendants clinking you
