 return to Phoenix Pool.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reply to Jia Zhi’s Morning Levee,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as clouds and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "072", "zhTitle": "出塞作", "enTitle": "Out of the Frontier", "chinese": "居延城外猎天骄\n[1]\n，\n白草连天野火烧。\n暮云空碛\n[2]\n时驱马，\n秋日平原好射雕\n[3]\n。\n护羌校尉朝乘障\n[4]\n，\n破虏将军\n[5]\n夜渡辽。\n玉靶\n[6]\n角弓珠勒马\n[7]\n，\n汉家将赐霍嫖姚。\n这首诗以出征将士的奋勇豪情与边塞战场的旷阔肃杀氛围为直接描写对象，展现了边塞题材中最激动人心的场景与最激昂奋发的精神内容。诗的前四句写敌军的气焰，后四句写汉军的胜利。诗意完全分成两半来写，这就带有歌行铺叙转换之风。全诗读来，音调铿锵，声调响亮。其中三、四句写吐蕃狩猎的场景，常为人称道。暮云低垂、空旷无边的沙漠，秋高气爽、牧草枯黄的平原，以开阔的气势勾勒出敌兵的强悍勇猛。\n注释：\n[1]\n天骄：即“天之骄子”，汉代时匈奴恃强，自称“天之骄子”。此处借称唐朝的吐蕃。\n[2]\n碛（qì）：沙漠。\n[3]\n射雕：泛指用箭射空中的鸟类。\n[4]\n乘障：登城。\n[5]\n破虏将军：此处代指唐朝守边的将领。\n[6]\n玉靶：镶玉的剑柄。此处代指宝剑。\n[7]\n珠勒马：马络头上用珠宝做装饰，代指骏马。", "english": "The proud Tartar sons are hunting out of the town,\nWhite grass spreads to the sky,wild fire burns up and down.\nThey ride on the desert when evening clouds hang low;\nIn autumn days on the vast plain they bend their bow.\nOur officers strengthen their defense by daylight;\nOur victorious generals cross the river at night.\nThe swords,bows and bridles mounted with gems and jade\nAre awarded generals and their brave cavalcade.", "poemType": "七言律诗", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">居延城外猎天骄<sup class=\"note-ref\">[1]</sup>，<br>白草连天野火烧。<br>暮云空碛<sup class=\"note-ref\">[2]</sup>时驱马，<br>秋日平原好射雕<sup class=\"note-ref\">[3]</sup>。<br>护羌校尉朝乘障<sup class=\"note-ref\">[4]</sup>，<br>破虏将军<sup class=\"note-ref\">[5]</sup>夜渡辽。<br>玉靶<sup class=\"note-ref\">[6]</sup>角弓珠勒马<sup class=\"note-ref\">[7]</sup>，<br>汉家将赐霍嫖姚。</p>\n<p class=\"prose\">这首诗以出征将士的奋勇豪情与边塞战场的旷阔肃杀氛围为直接描写对象，展现了边塞题材中最激动人心的场景与最激昂奋发的精神内容。诗的前四句写敌军的气焰，后四句写汉军的胜利。诗意完全分成两半来写，这就带有歌行铺叙转换之风。全诗读来，音调铿锵，声调响亮。</p>\n<p class=\"prose\">其中三、四句写吐蕃狩猎的场景，常为人称道。暮云低垂、空旷无边的沙漠，秋高气爽、牧草枯黄的平原，以开阔的气势勾勒出敌兵的强悍勇猛。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 天骄：即“天之骄子”，汉代时匈奴恃强，自称“天之骄子”。此处借称唐朝的吐蕃。<br>[2] 碛（qì）：沙漠。<br>[3] 射雕：泛指用箭射空中的鸟类。<br>[4] 乘障：登城。<br>[5] 破虏将军：此处代指唐朝守边的将领。<br>[6] 玉靶：镶玉的剑柄。此处代指宝剑。<br>[7] 珠勒马：马络头上用珠宝做装饰，代指骏马。</p>", "englishHtml": "<p class=\"poem-lines\">The proud Tartar sons are hunting out of the town,<br>White grass spreads to the sky,wild fire burns up and down.<br>They ride on the desert when evening clouds hang low;<br>In autumn days on the vast plain they bend their bow.<br>Our officers strengthen their defense by daylight;<br>Our victorious generals cross the river at night.<br>The swords,bows and bridles mounted with gems and jade<br>Are awarded generals and their brave cavalcade.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Out of the Frontier,” the poem places personal feeling against the vastness of the frontier, so distance and duty become part of its emotional force.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it sets Wang Wei&#x27;s restrained voice against open space and public duty. Key images such as clouds and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "073", "zhTitle": "春日与裴迪过新昌里访吕逸人不遇", "enTitle": "Visit to an Absent Hermit", "chinese": "桃源一向\n[1]\n绝风尘，\n柳市南头访隐沦\n[2]\n。\n到门不敢题凡鸟\n[3]\n，\n看竹何须问主人？\n城外青山如屋里，\n东家流水入西邻。\n闭户著书多岁月，\n种松皆老作龙鳞。\n王维和裴迪是知交，早年一同住在终南山，常相唱和，以后，两人又在辋川山庄“浮舟往来，弹琴赋诗，啸咏终日”。新昌里在长安城内。吕逸人即吕姓隐士，事迹未详。这首诗极赞吕逸人闭户著书的隐居生活，句句流露出对吕逸人的钦羡之情，以至青山、流水、松树，都为诗人所爱慕，充分表现了诗人归隐皈依的情思。描写中虚实结合，有上下句虚实相间的，也有上下联虚实相对的，笔姿灵活，变化多端，既不空泛，又不呆滞，颇有情味。\n注释：\n[1]\n一向：从过去到现在的一段时间。\n[2]\n隐沦：隐居的人。\n[3]\n题凡鸟：典出《世说新语·简傲》。魏嵇康与吕安两人平素非常要好，只要一想念对方，便专程前去探望。有一次，吕安拜访嵇康时，嵇康不在家，嵇康的哥哥嵇喜前来迎接。吕安不进屋，只在门上写了一个“凤”字就走了，“凤”的繁体字字形可被拆为“凡”与“鸟”这两个字，这是吕安在讥讽嵇喜，认为他只不过是一只“凡鸟”而已。此处作者在“题凡鸟”前加“不敢”，一是为了说明此次来访未碰到主人，二是赞扬吕逸不俗气。", "english": "Like the Peach Blossom Land far from Vanity Fair,\nSouth of Willow Market we visit the hermit there.\nWe arrive at his door to find the phoenix out,\nIf you like the bamboo,what should you ask about?\nMountains are green viewed from without as from within;\nFrom east to west water will run out and flow in.\nBehind the door he’s been writing from year to year,\nLike dragon’s scale the bark of pine planted here.", "poemType": "七言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">桃源一向<sup class=\"note-ref\">[1]</sup>绝风尘，<br>柳市南头访隐沦<sup class=\"note-ref\">[2]</sup>。<br>到门不敢题凡鸟<sup class=\"note-ref\">[3]</sup>，<br>看竹何须问主人？<br>城外青山如屋里，<br>东家流水入西邻。<br>闭户著书多岁月，<br>种松皆老作龙鳞。</p>\n<p class=\"prose\">王维和裴迪是知交，早年一同住在终南山，常相唱和，以后，两人又在辋川山庄“浮舟往来，弹琴赋诗，啸咏终日”。新昌里在长安城内。吕逸人即吕姓隐士，事迹未详。这首诗极赞吕逸人闭户著书的隐居生活，句句流露出对吕逸人的钦羡之情，以至青山、流水、松树，都为诗人所爱慕，充分表现了诗人归隐皈依的情思。</p>\n<p class=\"prose\">描写中虚实结合，有上下句虚实相间的，也有上下联虚实相对的，笔姿灵活，变化多端，既不空泛，又不呆滞，颇有情味。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 一向：从过去到现在的一段时间。<br>[2] 隐沦：隐居的人。<br>[3] 题凡鸟：典出《世说新语·简傲》。魏嵇康与吕安两人平素非常要好，只要一想念对方，便专程前去探望。有一次，吕安拜访嵇康时，嵇康不在家，嵇康的哥哥嵇喜前来迎接。吕安不进屋，只在门上写了一个“凤”字就走了，“凤”的繁体字字形可被拆为“凡”与“鸟”这两个字，这是吕安在讥讽嵇喜，认为他只不过是一只“凡鸟”而已。此处作者在“题凡鸟”前加“不敢”，一是为了说明此次来访未碰到主人，二是赞扬吕逸不俗气。</p>", "englishHtml": "<p class=\"poem-lines\">Like the Peach Blossom Land far from Vanity Fair,<br>South of Willow Market we visit the hermit there.<br>We arrive at his door to find the phoenix out,<br>If you like the bamboo,what should you ask about?<br>Mountains are green viewed from without as from within;<br>From east to west water will run out and flow in.<br>Behind the door he’s been writing from year to year,<br>Like dragon’s scale the bark of pine planted here.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Visit to an Absent Hermit,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, moonlight, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "074", "zhTitle": "积雨辋川庄作", "enTitle": "Rainy Days in My Riverside Hermitage", "chinese": "积雨空林烟火迟，\n蒸藜\n[1]\n炊黍\n[2]\n饷\n[3]\n东菑\n[4]\n。\n漠漠水田飞白鹭，\n阴阴夏木啭黄鹂。\n山中习静观朝槿\n[5]\n，\n松下清斋折露葵。\n野老与人争席罢，\n海鸥何事更相疑？\n此诗以清新的笔触，描写了久雨之后的辋川风光。全诗将辋川庄恬淡静谧的田园景致与自己闲适安逸的禅寂生活结合起来，创造出一派人与自然和谐相处、陶然忘机的空灵境界。特别是颔联两句，写景精致，天然入妙，历来为人所称道。“漠漠”“阴阴”两组叠字，不但增加了诗的音韵，而且开拓了诗的境界。有了“漠漠”，水田就显得广阔辽远，白鹭便有了自由飞翔的空间；有了“阴阴”，才显得雨后树林的荫浓幽深，烘托出黄鹂鸣唱的婉转清丽。同时，白鹭之“白”，黄鹂之“黄”，作为两点亮色映衬于空濛的背景中，更显得鲜明。\n注释：\n[1]\n藜（lí）：一年生草本植物，嫩叶可食。\n[2]\n黍（shǔ）：一种谷物，古时为主食。\n[3]\n饷：送饭食到田头。\n[4]\n菑（zī）：已经开垦了一年的田地。\n[5]\n槿（jǐn）：植物名。花朝开夕谢，因此常被引用以感叹人生枯荣无常。", "english": "After long rain cooking fire’s made late in the village;\nMillet and greens are cooked for those doing tillage.\nOver the boundless paddy fields egrets fly;\nIn gloomy summer forest golden orioles cry.\nIn quiet hills I watch short-lived blooms as I please,\nAnd eat sunflower seeds under the green pine trees.\nWith other villagers I would not disagree;\nEven sea gulls from far away would come near me.", "poemType": "七言古诗", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">积雨空林烟火迟，<br>蒸藜<sup class=\"note-ref\">[1]</sup>炊黍<sup class=\"note-ref\">[2]</sup><br>饷<sup class=\"note-ref\">[3]</sup>东菑<sup class=\"note-ref\">[4]</sup>。<br>漠漠水田飞白鹭，<br>阴阴夏木啭黄鹂。<br>山中习静观朝槿<sup class=\"note-ref\">[5]</sup>，<br>松下清斋折露葵。<br>野老与人争席罢，<br>海鸥何事更相疑？</p>\n<p class=\"prose\">此诗以清新的笔触，描写了久雨之后的辋川风光。全诗将辋川庄恬淡静谧的田园景致与自己闲适安逸的禅寂生活结合起来，创造出一派人与自然和谐相处、陶然忘机的空灵境界。特别是颔联两句，写景精致，天然入妙，历来为人所称道。“漠漠”“阴阴”两组叠字，不但增加了诗的音韵，而且开拓了诗的境界。</p>\n<p class=\"prose\">有了“漠漠”，水田就显得广阔辽远，白鹭便有了自由飞翔的空间；有了“阴阴”，才显得雨后树林的荫浓幽深，烘托出黄鹂鸣唱的婉转清丽。同时，白鹭之“白”，黄鹂之“黄”，作为两点亮色映衬于空濛的背景中，更显得鲜明。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 藜（lí）：一年生草本植物，嫩叶可食。<br>[2] 黍（shǔ）：一种谷物，古时为主食。<br>[3] 饷：送饭食到田头。<br>[4] 菑（zī）：已经开垦了一年的田地。<br>[5] 槿（jǐn）：植物名。花朝开夕谢，因此常被引用以感叹人生枯荣无常。</p>", "englishHtml": "<p class=\"poem-lines\">After long rain cooking fire’s made late in the village;<br>Millet and greens are cooked for those doing tillage.<br>Over the boundless paddy fields egrets fly;<br>In gloomy summer forest golden orioles cry.<br>In quiet hills I watch short-lived blooms as I please,<br>And eat sunflower seeds under the green pine trees.<br>With other villagers I would not disagree;<br>Even sea gulls from far away would come near me.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Rainy Days in My Riverside Hermitage,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a seven-character ancient-style poem, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, water, clouds, and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "075", "zhTitle": "寒食城东即事", "enTitle": "Cold Food Day in the East of the Town", "chinese": "清溪一道穿桃李，\n演漾\n[1]\n绿蒲涵白芷。\n溪上人家凡\n[2]\n几家，\n落花半落东流水。\n蹴鞠\n[3]\n屡过飞鸟上，\n秋千竞出垂杨里。\n少年分日\n[4]\n作遨游，\n不用清明兼上巳。\n此诗大概是王维少年时漫游两京期间的作品。这首诗勾画出一幅唐代寒食节游春的风俗画。画面上都是年轻人，男的踢球，女的荡秋千，玩得很高兴。而桃花、李花、清溪、流水、人家、飞鸟、垂杨，都是年轻人的陪衬。整首诗传递出一派生气盎然、雀跃兴奋的景象。\n注释：\n[1]\n演漾：荡漾。\n[2]\n凡：总共。\n[3]\n蹴（cù）踘（jū）：古时候踢球的游戏。\n[4]\n分日：安排好日期。", "english": "A limpid stream threads through peach and plum trees,\nGreen duckweeds and water plants sway with ease.\nHow many people live by riverside?\nHalf of the flowers fall with ebbing tide.\nAs flying birds a ball is kicked high;\nGreen willows send the swing to kiss the sky.\nThe youngsters want to make excursions gay;\nThey need not wait until the vernal day.", "poemType": "七言律诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">清溪一道穿桃李，<br>演漾<sup class=\"note-ref\">[1]</sup>绿蒲涵白芷。<br>溪上人家凡<sup class=\"note-ref\">[2]</sup>几家，<br>落花半落东流水。<br>蹴鞠<sup class=\"note-ref\">[3]</sup>屡过飞鸟上，<br>秋千竞出垂杨里。<br>少年分日<sup class=\"note-ref\">[4]</sup>作遨游，<br>不用清明兼上巳。</p>\n<p class=\"prose\">此诗大概是王维少年时漫游两京期间的作品。这首诗勾画出一幅唐代寒食节游春的风俗画。画面上都是年轻人，男的踢球，女的荡秋千，玩得很高兴。而桃花、李花、清溪、流水、人家、飞鸟、垂杨，都是年轻人的陪衬。整首诗传递出一派生气盎然、雀跃兴奋的景象。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 演漾：荡漾。<br>[2] 凡：总共。<br>[3] 蹴（cù）踘（jū）：古时候踢球的游戏。<br>[4] 分日：安排好日期。</p>", "englishHtml": "<p class=\"poem-lines\">A limpid stream threads through peach and plum trees,<br>Green duckweeds and water plants sway with ease.<br>How many people live by riverside?<br>Half of the flowers fall with ebbing tide.<br>As flying birds a ball is kicked high;<br>Green willows send the swing to kiss the sky.<br>The youngsters want to make excursions gay;<br>They need not wait until the vernal day.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Cold Food Day in the East of the Town,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as water, flowers, birds, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "076", "zhTitle": "早秋山中作", "enTitle": "Written in the Mountain in Early Autumn", "chinese": "无才不敢累明时\n[1]\n，\n思向东溪守故篱。\n岂厌尚平婚嫁早，\n却嫌陶令去官迟。\n草间蛩响临秋急，\n山里蝉声薄暮悲。\n寂寞柴门人不到，\n空林独与白云期。\n这首诗当作于开元末年，首联写自己没有杰出的才能，不敢连累了圣明的朝代，想着要弃官回嵩山东溪隐居。当然“无才”是作者的愤激反语，流露了怀才不遇的情绪。颔联直抒胸臆：我不厌弃尚平早早办完了儿女婚嫁之事就出游山川的行为，相反，我还觉得陶渊明弃官归隐有点太迟。颈联景中寓情，一语双关。蟋蟀急叫，知了悲鸣，既写山中环境的孤寂、凄清，又暗示诗人内心的孤独、悲凉。尾联承上联而来，写柴门寂寞，人烟稀少，环境如此凄清，所以作者只好与山林为伍，与白云做伴了。\n注释：\n[1]\n明时：指政治清明的时代。", "english": "A talentless man may spoil a spring day,\nTo my cot by East Stream I’d go my way.\nFrom others’marriage I’d like to be free,\nAnd I’ve resigned my office with high glee.\nI’d welcome autumn with its crickets’song,\nBut grieve not with cicadas all day long.\nNot lonely with no visitor in sight,\nIn empty woods I’d be friend with cloud white.", "poemType": "七言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">无才不敢累明时<sup class=\"note-ref\">[1]</sup>，<br>思向东溪守故篱。<br>岂厌尚平婚嫁早，<br>却嫌陶令去官迟。<br>草间蛩响临秋急，<br>山里蝉声薄暮悲。<br>寂寞柴门人不到，<br>空林独与白云期。</p>\n<p class=\"prose\">这首诗当作于开元末年，首联写自己没有杰出的才能，不敢连累了圣明的朝代，想着要弃官回嵩山东溪隐居。当然“无才”是作者的愤激反语，流露了怀才不遇的情绪。颔联直抒胸臆：我不厌弃尚平早早办完了儿女婚嫁之事就出游山川的行为，相反，我还觉得陶渊明弃官归隐有点太迟。</p>\n<p class=\"prose\">颈联景中寓情，一语双关。蟋蟀急叫，知了悲鸣，既写山中环境的孤寂、凄清，又暗示诗人内心的孤独、悲凉。尾联承上联而来，写柴门寂寞，人烟稀少，环境如此凄清，所以作者只好与山林为伍，与白云做伴了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 明时：指政治清明的时代。</p>", "englishHtml": "<p class=\"poem-lines\">A talentless man may spoil a spring day,<br>To my cot by East Stream I’d go my way.<br>From others’marriage I’d like to be free,<br>And I’ve resigned my office with high glee.<br>I’d welcome autumn with its crickets’song,<br>But grieve not with cicadas all day long.<br>Not lonely with no visitor in sight,<br>In empty woods I’d be friend with cloud white.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Written in the Mountain in Early Autumn,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, clouds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "077", "zhTitle": "陇西行", "enTitle": "Song of the Frontier", "chinese": "十里一走\n[1]\n马，\n五里一扬鞭。\n都护军书至，\n匈奴围酒泉。\n关山正飞雪，\n烽火\n[2]\n断无烟。\n此诗作于出使凉州期间。《陇西行》是乐府古题之一，属相和歌辞瑟调曲。首两句运用夸张手法，写递送军书，驿马疾驰的情状：马鞭一扬就跑了五里，一阵狂奔就是十里。然后再补叙原因，实实在在。谋篇布局，井然有序。为什么快马传书？原因是吐蕃包围了酒泉。由于漫天飞雪，边境的烽火台无法燃烟报警，只有以快马驰报敌兵来犯的消息。\n注释：\n[1]\n走：跑，奔驰。\n[2]\n烽戍：古代用烽火和狼烟报警的土堡哨所。", "english": "A horse is galloping;\nA man flips up and down.\nWhat message does he bring?\nThe siege of border town.\nIt’s snowing on the height,\nNo beacon fire in sight.", "poemType": "乐府/古体", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">十里一走<sup class=\"note-ref\">[1]</sup>马，<br>五里一扬鞭。<br>都护军书至，<br>匈奴围酒泉。<br>关山正飞雪，<br>烽火<sup class=\"note-ref\">[2]</sup>断无烟。</p>\n<p class=\"prose\">此诗作于出使凉州期间。《陇西行》是乐府古题之一，属相和歌辞瑟调曲。首两句运用夸张手法，写递送军书，驿马疾驰的情状：马鞭一扬就跑了五里，一阵狂奔就是十里。然后再补叙原因，实实在在。谋篇布局，井然有序。为什么快马传书？原因是吐蕃包围了酒泉。</p>\n<p class=\"prose\">由于漫天飞雪，边境的烽火台无法燃烟报警，只有以快马驰报敌兵来犯的消息。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 走：跑，奔驰。<br>[2] 烽戍：古代用烽火和狼烟报警的土堡哨所。</p>", "englishHtml": "<p class=\"poem-lines\">A horse is galloping;<br>A man flips up and down.<br>What message does he bring?<br>The siege of border town.<br>It’s snowing on the height,<br>No beacon fire in sight.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song of the Frontier,” the poem places personal feeling against the vastness of the frontier, so distance and duty become part of its emotional force.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it sets Wang Wei&#x27;s restrained voice against open space and public duty. Key images such as mountains, water, clouds, and wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "078", "zhTitle": "送别", "enTitle": "At Parting", "chinese": "下马饮\n[1]\n君酒，\n问君何所之？\n君言不得意，\n归卧\n[2]\n南山陲\n[3]\n。\n但去莫复问，\n白云无尽时。\n这是首送别友人归隐的诗歌，诗歌采用问答的方式从友人口中说出归隐的原因，表现出诗人复杂的思想感情。诗人对友人关切爱护，既劝慰友人，又对友人的归隐生活流露出羡慕之情，说明诗人对自己的现实也不很满意。“不得意”三字是理解这首诗题旨的一把钥匙。全诗语言看似平淡无奇，但最后两句却顿增诗意，可谓词浅情深，蕴含着不尽的意味。\n注释：\n[1]\n饮：使……喝。\n[2]\n归卧：隐居。\n[3]\n陲：边缘。", "english": "Dismounted,I drink with you\nAnd ask what you’ve in view.\n“I can’t do what I will,\nSo I’ll go to south hill.\nBe gone,ask no more,friend,\nLet cloud driftwithoutend!”", "poemType": "古体诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">下马饮<sup class=\"note-ref\">[1]</sup>君酒，<br>问君何所之？<br>君言不得意，<br>归卧<sup class=\"note-ref\">[2]</sup>南山陲<sup class=\"note-ref\">[3]</sup>。<br>但去莫复问，<br>白云无尽时。</p>\n<p class=\"prose\">这是首送别友人归隐的诗歌，诗歌采用问答的方式从友人口中说出归隐的原因，表现出诗人复杂的思想感情。诗人对友人关切爱护，既劝慰友人，又对友人的归隐生活流露出羡慕之情，说明诗人对自己的现实也不很满意。“不得意”三字是理解这首诗题旨的一把钥匙。</p>\n<p class=\"prose\">全诗语言看似平淡无奇，但最后两句却顿增诗意，可谓词浅情深，蕴含着不尽的意味。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 饮：使……喝。<br>[2] 归卧：隐居。<br>[3] 陲：边缘。</p>", "englishHtml": "<p class=\"poem-lines\">Dismounted,I drink with you<br>And ask what you’ve in view.<br>“I can’t do what I will,<br>So I’ll go to south hill.<br>Be gone,ask no more,friend,<br>Let cloud driftwithoutend!”</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “At Parting,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a ancient-style poem, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, clouds, wine, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "079", "zhTitle": "春夜竹亭赠钱少府归蓝田", "enTitle": "Written on a Spring Night in the Pavilion of Bamboo on Qian Qi’s Return to His Blue Field", "chinese": "夜静群动息\n[1]\n，\n时闻隔林犬。\n却忆山中时，\n人家涧西远。\n羡君明发去，\n采蕨轻轩冕\n[2]\n。\n此诗约作于乾元二年（759）春，当时王维任职给事中。钱少府，指钱起，也是著名诗人，王维的朋友，他自乾元二年至宝应二年（763）任职蓝田县尉。这是一首赠别诗，诗人借此表达了自己厌弃俗世纷扰、渴望归隐的愿望。首句，夜深人静，万物都安静了下来，但树林那边的狗还在叫个不停，让人心烦意乱。三、四两句，这扰人的犬吠声，让我想起在辋川别业隐居时的清净日子。在那里，相邻最近的人家也在山涧以西很远的地方，不会像今天这样受吵。尾句，真羡慕你这黎明一去，即可脱离这是非纷扰的京都长安，在蓝田过上那超然世外的隐居生活。\n注释：\n[1]\n群动息：各种动物停止活动。\n[2]\n轩冕：古时大夫以上官员的车乘和冕服，此处借指高官厚禄。", "english": "At night all are quiet and still,\nI hear but dogs bark now and then.\nI remember life in the hill,\nWest of the brook,far from all men.\nI admire you leaving the court\nTo gather green herbs long or short.", "poemType": "古体诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">夜静群动息<sup class=\"note-ref\">[1]</sup>，<br>时闻隔林犬。<br>却忆山中时，<br>人家涧西远。<br>羡君明发去，<br>采蕨轻轩冕<sup class=\"note-ref\">[2]</sup>。</p>\n<p class=\"prose\">此诗约作于乾元二年（759）春，当时王维任职给事中。钱少府，指钱起，也是著名诗人，王维的朋友，他自乾元二年至宝应二年（763）任职蓝田县尉。这是一首赠别诗，诗人借此表达了自己厌弃俗世纷扰、渴望归隐的愿望。首句，夜深人静，万物都安静了下来，但树林那边的狗还在叫个不停，让人心烦意乱。</p>\n<p class=\"prose\">三、四两句，这扰人的犬吠声，让我想起在辋川别业隐居时的清净日子。在那里，相邻最近的人家也在山涧以西很远的地方，不会像今天这样受吵。尾句，真羡慕你这黎明一去，即可脱离这是非纷扰的京都长安，在蓝田过上那超然世外的隐居生活。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 群动息：各种动物停止活动。<br>[2] 轩冕：古时大夫以上官员的车乘和冕服，此处借指高官厚禄。</p>", "englishHtml": "<p class=\"poem-lines\">At night all are quiet and still,<br>I hear but dogs bark now and then.<br>I remember life in the hill,<br>West of the brook,far from all men.<br>I admire you leaving the court<br>To gather green herbs long or short.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Written on a Spring Night in the Pavilion of Bamboo on Qian Qi’s Return to His Blue Field,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a ancient-style poem, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "080", "zhTitle": "答张五弟", "enTitle": "Reply to Cousin Zhang the Fifth", "chinese": "终南有茅屋，\n前对终南山。\n终年无客长闭关，\n终日无心\n[1]\n长自闲。\n不妨饮酒复垂钓，\n君但能来相往还\n[2]\n。\n张五弟，即张湮，唐代书画家，官至刑部员外郎，因排行第五，故称张五弟。这首小诗表现了诗人在隐居中寂静安闲的生活情趣，又表达了对志趣相投友人的真挚感情。全篇以诗代书，写得朴实、自然、亲切。诗中有意采用重复的字眼和相同的句式。首两句连用两个“终南”，使友人加深印象，突出出门面山的优势。三、四句又巧妙地把终南山的“终”字移用来创造给人以悠长、缓慢之感的时间意象。一个“终年”再叠加一个“终日”，两个同一结构的诗句重复、排比，用以烘托寂寞、清闲的心态，使人感到诗人在山中就这么日复一日、年复一年地静静生活下去，对世事不闻不问，甚至不管岁月的流逝，唯一遗憾的是不能与张湮朝夕相处。\n注释：\n[1]\n无心：佛教语，指摆脱了邪念的真心。\n[2]\n往还：交往。", "english": "There is my hermitage\nBy Southern Mountainside.\nNo guest comes so my door is closed all the age.\nI am at leisure all day long unoccupied.\nBut you may come to drink and fish with me,\nIf you should like to keep my company.", "poemType": "古体诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">终南有茅屋，<br>前对终南山。<br>终年无客长闭关，<br>终日无心<sup class=\"note-ref\">[1]</sup>长自闲。<br>不妨饮酒复垂钓，<br>君但能来相往还<sup class=\"note-ref\">[2]</sup>。</p>\n<p class=\"prose\">张五弟，即张湮，唐代书画家，官至刑部员外郎，因排行第五，故称张五弟。这首小诗表现了诗人在隐居中寂静安闲的生活情趣，又表达了对志趣相投友人的真挚感情。全篇以诗代书，写得朴实、自然、亲切。诗中有意采用重复的字眼和相同的句式。</p>\n<p class=\"prose\">首两句连用两个“终南”，使友人加深印象，突出出门面山的优势。三、四句又巧妙地把终南山的“终”字移用来创造给人以悠长、缓慢之感的时间意象。</p>\n<p class=\"prose\">一个“终年”再叠加一个“终日”，两个同一结构的诗句重复、排比，用以烘托寂寞、清闲的心态，使人感到诗人在山中就这么日复一日、年复一年地静静生活下去，对世事不闻不问，甚至不管岁月的流逝，唯一遗憾的是不能与张湮朝夕相处。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 无心：佛教语，指摆脱了邪念的真心。<br>[2] 往还：交往。</p>", "englishHtml": "<p class=\"poem-lines\">There is my hermitage<br>By Southern Mountainside.<br>No guest comes so my door is closed all the age.<br>I am at leisure all day long unoccupied.<br>But you may come to drink and fish with me,<br>If you should like to keep my company.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reply to Cousin Zhang the Fifth,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a ancient-style poem, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, wine, frontier scenes, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "081", "zhTitle": "渭川田家", "enTitle": "Rural Scene by River Wei", "chinese": "斜光照墟落\n[1]\n，\n穷巷\n[2]\n牛羊归。\n野老念牧童，\n倚杖候荆扉。\n雉雊\n[3]\n麦苗秀，\n蚕眠桑叶稀。\n田夫荷\n[4]\n锄至，\n相见语依依。\n即此羡闲逸，\n怅然吟《式微》。\n这首五言古诗当作于开元二十四年（736）张九龄罢相后不久。诗人以白描的艺术手法，生动细致地描摹出一幅充满生活情趣的农家晚归图。诗歌尾句卒章显志，揭示出诗旨所在。《式微》是《诗经·邶风》中的一篇，诗中反复咏叹“式微，式微，胡不归”。诗人此处借用《诗经》句意，抒发了对闲适恬淡的乡村生活的向往，却又身不由己、无法归隐的惆怅之情，不仅在意境上与首句“斜光照墟落”相呼应，而且内容也落在“归”字上，使写景与抒情契合无间、浑然一体。\n注释：\n[1]\n墟落：村庄。\n[2]\n穷巷：深巷。\n[3]\n雉（zhì）雊（ɡòu）：野鸡鸣叫。\n[4]\n荷（hè）：肩扛。", "english": "The village lit by slanting rays,\nThe cattle trail on homeward ways.\nSee an old man for the herd wait,\nLeaning on staff by wicket gate.\nPheasants call in wheat field with ease;\nSilkworms sleep on sparse mulberries.\nShouldering hoe,two ploughmen meet;\nThey talk long,standing on their feet.\nFor this unhurried life I long,\nLost in singing“Home-Going Song.”", "poemType": "五言古诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">斜光照墟落<sup class=\"note-ref\">[1]</sup>，<br>穷巷<sup class=\"note-ref\">[2]</sup>牛羊归。<br>野老念牧童，<br>倚杖候荆扉。<br>雉雊<sup class=\"note-ref\">[3]</sup>麦苗秀，<br>蚕眠桑叶稀。<br>田夫荷<sup class=\"note-ref\">[4]</sup>锄至，<br>相见语依依。<br>即此羡闲逸，<br>怅然吟《式微》。</p>\n<p class=\"prose\">这首五言古诗当作于开元二十四年（736）张九龄罢相后不久。诗人以白描的艺术手法，生动细致地描摹出一幅充满生活情趣的农家晚归图。诗歌尾句卒章显志，揭示出诗旨所在。《式微》是《诗经·邶风》中的一篇，诗中反复咏叹“式微，式微，胡不归”。</p>\n<p class=\"prose\">诗人此处借用《诗经》句意，抒发了对闲适恬淡的乡村生活的向往，却又身不由己、无法归隐的惆怅之情，不仅在意境上与首句“斜光照墟落”相呼应，而且内容也落在“归”字上，使写景与抒情契合无间、浑然一体。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 墟落：村庄。<br>[2] 穷巷：深巷。<br>[3] 雉（zhì）雊（ɡòu）：野鸡鸣叫。<br>[4] 荷（hè）：肩扛。</p>", "englishHtml": "<p class=\"poem-lines\">The village lit by slanting rays,<br>The cattle trail on homeward ways.<br>See an old man for the herd wait,<br>Leaning on staff by wicket gate.<br>Pheasants call in wheat field with ease;<br>Silkworms sleep on sparse mulberries.<br>Shouldering hoe,two ploughmen meet;<br>They talk long,standing on their feet.<br>For this unhurried life I long,<br>Lost in singing“Home-Going Song.”</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Rural Scene by River Wei,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "082", "zhTitle": "奉寄韦太守陟", "enTitle": "For Governor Wei Zhi", "chinese": "荒城自萧索，\n万里山河空。\n天高秋日迥\n[2]\n，\n嘹唳\n[3]\n闻归鸿。\n寒塘映衰草，\n高馆落疏桐。\n临此岁方晏\n[4]\n，\n顾景\n[5]\n咏悲翁。\n故人不可见，\n寂寞平林东。\n这首诗首联开门见山，直接描写边塞孤城的萧条衰败。这一联中，一“自”一“空”，如神来之笔，画龙点睛。第二联，落笔于高空，秋气肃杀、高远阔大的边城景象。只孤城一座，忽城外几点孤雁，凄厉的鸣叫传入耳际，那是寻找同伴的哀鸣。鸿雁尤可展翅飞翔，而自身呢，便怕要陷身此荒凉之地了，不禁自问何时能归乡。第三联，诗人从身边的细节着眼，眼前池塘凛冽的水，岸边衰败的草，驿馆外稀疏枯干的梧桐，处处如此，又能够向何处逃呢？第四联，诗人故作刚强，似勉强还能控制住内心无限的惆怅、悲凉。尾联，忽念及自己在这偏远的边塞荒城上，竟无一好友相伴，一时所有的情感如开闸之水，奔涌出来，再也难以控制了。全诗至此，戛然而止，但那难以遣怀的悲愁，却久久不散。\n注释：\n[1]\n奉：敬词。\n[2]\n迥（jiǒnɡ）：远。\n[3]\n嘹唳（lì）：声音响亮凄清。\n[4]\n晏：晚。\n[5]\n景（yǐnɡ）：同“影”。", "english": "The town looks desolate and bleak,\nIn vain stretch out hill,rill and creek.\nThe autumn sun sinks from the sky\nTo hear returning wild geese cry.\nThe pool is chilled with withered grass,\nSparse plane trees shed their leaves,alas!\nIt’s now near the end of the year,\nHow can I not sing without cheer!\nOh,where are you,my dear old friend?\nLonely,I see the plain extend.", "poemType": "五言古诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">荒城自萧索，<br>万里山河空。<br>天高秋日迥<sup class=\"note-ref\">[2]</sup>，<br>嘹唳<sup class=\"note-ref\">[3]</sup>闻归鸿。<br>寒塘映衰草，<br>高馆落疏桐。<br>临此岁方晏<sup class=\"note-ref\">[4]</sup>，<br>顾景<sup class=\"note-ref\">[5]</sup>咏悲翁。<br>故人不可见，<br>寂寞平林东。</p>\n<p class=\"prose\">这首诗首联开门见山，直接描写边塞孤城的萧条衰败。这一联中，一“自”一“空”，如神来之笔，画龙点睛。第二联，落笔于高空，秋气肃杀、高远阔大的边城景象。只孤城一座，忽城外几点孤雁，凄厉的鸣叫传入耳际，那是寻找同伴的哀鸣。鸿雁尤可展翅飞翔，而自身呢，便怕要陷身此荒凉之地了，不禁自问何时能归乡。</p>\n<p class=\"prose\">第三联，诗人从身边的细节着眼，眼前池塘凛冽的水，岸边衰败的草，驿馆外稀疏枯干的梧桐，处处如此，又能够向何处逃呢？第四联，诗人故作刚强，似勉强还能控制住内心无限的惆怅、悲凉。尾联，忽念及自己在这偏远的边塞荒城上，竟无一好友相伴，一时所有的情感如开闸之水，奔涌出来，再也难以控制了。</p>\n<p class=\"prose\">全诗至此，戛然而止，但那难以遣怀的悲愁，却久久不散。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 奉：敬词。<br>[2] 迥（jiǒnɡ）：远。<br>[3] 嘹唳（lì）：声音响亮凄清。<br>[4] 晏：晚。<br>[5] 景（yǐnɡ）：同“影”。</p>", "englishHtml": "<p class=\"poem-lines\">The town looks desolate and bleak,<br>In vain stretch out hill,rill and creek.<br>The autumn sun sinks from the sky<br>To hear returning wild geese cry.<br>The pool is chilled with withered grass,<br>Sparse plane trees shed their leaves,alas!<br>It’s now near the end of the year,<br>How can I not sing without cheer!<br>Oh,where are you,my dear old friend?<br>Lonely,I see the plain extend.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For Governor Wei Zhi,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "083", "zhTitle": "秋夜独坐怀内弟崔兴宗", "enTitle": "Thinking of Cousin Cui on an Autumn Night", "chinese": "夜静群动息，\n蟪蛄\n[1]\n声悠悠。\n庭槐北风响，\n日夕方高秋。\n思子整羽翮，\n及时当云浮。\n吾生将白首，\n岁晏思沧州。\n高足\n[2]\n在旦暮，\n肯为南亩俦。\n崔兴宗，王维的内弟，这是作者秋夜独坐，因想念他而作的一首诗。首两句是以动写静、寓静于动的佳句，以“蟪蛄声悠悠”反衬夜的安静。“思子整羽翮，及时当云浮”一句以鸟的振翅欲飞比喻崔兴宗即将出仕。末两句是说，崔兴宗你很快就会高升，将来还会做隐居的朋友吗？夜静而思绪不宁，我静而内弟思动，在对比中显出诗人的无奈、孤单和怅然若失之情。\n注释：\n[1]\n蟪（huì）蛄（ɡū）：蝉的一种。\n[2]\n高足：此处指代快马。", "english": "All living things at night are still,\nI only hear cicada’s song.\nMy tree trembles in north wind chill,\nLate autumn is coming along.\nI think of you flapping your wing\nTo float like cloud in the sky wide.\nA white-haired man would only sing\nAt the year’s end by riverside.\nSooner or later you will fly.\nCould I follow you far and nigh?", "poemType": "五言古诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">夜静群动息，<br>蟪蛄<sup class=\"note-ref\">[1]</sup>声悠悠。<br>庭槐北风响，<br>日夕方高秋。<br>思子整羽翮，<br>及时当云浮。<br>吾生将白首，<br>岁晏思沧州。<br>高足<sup class=\"note-ref\">[2]</sup>在旦暮，<br>肯为南亩俦。</p>\n<p class=\"prose\">崔兴宗，王维的内弟，这是作者秋夜独坐，因想念他而作的一首诗。首两句是以动写静、寓静于动的佳句，以“蟪蛄声悠悠”反衬夜的安静。“思子整羽翮，及时当云浮”一句以鸟的振翅欲飞比喻崔兴宗即将出仕。末两句是说，崔兴宗你很快就会高升，将来还会做隐居的朋友吗？</p>\n<p class=\"prose\">夜静而思绪不宁，我静而内弟思动，在对比中显出诗人的无奈、孤单和怅然若失之情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 蟪（huì）蛄（ɡū）：蝉的一种。<br>[2] 高足：此处指代快马。</p>", "englishHtml": "<p class=\"poem-lines\">All living things at night are still,<br>I only hear cicada’s song.<br>My tree trembles in north wind chill,<br>Late autumn is coming along.<br>I think of you flapping your wing<br>To float like cloud in the sky wide.<br>A white-haired man would only sing<br>At the year’s end by riverside.<br>Sooner or later you will fly.<br>Could I follow you far and nigh?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Thinking of Cousin Cui on an Autumn Night,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "084", "zhTitle": "过李揖宅", "enTitle": "A Visit to Li Yi’s Cottage", "chinese": "闲门秋草色，\n终日无车马。\n客来深巷中，\n犬吠寒林下。\n散发时未簪，\n道书行尚把。\n与我同心人，\n乐道安贫者。\n一罢宜城酌，\n还归洛阳社。\n李揖，公元756年为延安太守。首联是说门扉闲闭阶草黄，难见车马来拜访。闲门系指进出往来的人不多，显得清闲的门庭。第二联讲客人自深巷出来，引得寒林里的狗叫起来。寒林系指秋冬的林木，晓霜犹凝，寒风萧瑟，吹得落叶飒飒作响。第三联是说主人李揖为人不羁，出迎时发髻还没簪上，手上拿着《道书》。《道书》是唐代上流社会时行的道家修炼之书。第四联是说李揖与诗人是志同道合的人，安贫乐道地在家乡归隐。尾联是说在李揖宅饮毕美酒，诗人就回归自己的隐居处了。", "english": "Your gate is dyed in autumn grass,\nThe way untrodden all the day.\nSeeing a visitor pass,\nThe dog in deep forest will bay.\nYou have not yet pinned up your hair\nBut come out with your book in hand.\nTo be rich or poor we don’t care,\nOur hearts feel same joy in the land.\nWhen we have drunk our cup of wine,\nI’ll go back to my cottage fine.", "poemType": "五言古诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">闲门秋草色，<br>终日无车马。<br>客来深巷中，<br>犬吠寒林下。<br>散发时未簪，<br>道书行尚把。<br>与我同心人，<br>乐道安贫者。<br>一罢宜城酌，<br>还归洛阳社。</p>\n<p class=\"prose\">李揖，公元756年为延安太守。首联是说门扉闲闭阶草黄，难见车马来拜访。闲门系指进出往来的人不多，显得清闲的门庭。第二联讲客人自深巷出来，引得寒林里的狗叫起来。寒林系指秋冬的林木，晓霜犹凝，寒风萧瑟，吹得落叶飒飒作响。第三联是说主人李揖为人不羁，出迎时发髻还没簪上，手上拿着《道书》。</p>\n<p class=\"prose\">《道书》是唐代上流社会时行的道家修炼之书。第四联是说李揖与诗人是志同道合的人，安贫乐道地在家乡归隐。尾联是说在李揖宅饮毕美酒，诗人就回归自己的隐居处了。</p>", "englishHtml": "<p class=\"poem-lines\">Your gate is dyed in autumn grass,<br>The way untrodden all the day.<br>Seeing a visitor pass,<br>The dog in deep forest will bay.<br>You have not yet pinned up your hair<br>But come out with your book in hand.<br>To be rich or poor we don’t care,<br>Our hearts feel same joy in the land.<br>When we have drunk our cup of wine,<br>I’ll go back to my cottage fine.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Visit to Li Yi’s Cottage,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as trees and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "085", "zhTitle": "送宇文太守赴宣城", "enTitle": "Seeing Governor Yuwen Off to Xuancheng", "chinese": "寥落\n[2]\n云外山，\n迢遥\n[3]\n舟中赏。\n铙\n[4]\n吹发西江，\n秋空多清响。\n地迥古城芜，\n月明寒潮广。\n时赛敬亭神\n[5]\n，\n复解罟师\n[6]\n网。\n何处寄相思？\n南风吹五两。\n公元740年，王维时任殿中侍御史，南进经夏口（今湖北武昌）写了这首五言古诗。这首诗是沿着船行进的路线来写的。前四句是倒写，实际上应是“铙吹发西江，秋空多清响。寥落云外山，迢遥舟中赏”。接下来四句“地迥古城芜，月明寒潮广。时赛敬亭神，复解罟师网”，写诗人己到夏口接近宣城地界看到与想到的。看到的是，古城荒芜，月明清辉，寒潮阵阵；想到的是，宇文太守赴宣城，宣城一定能治理好。最后两句写诗人对宇文太守的思念，表现他与宇文太守的友情。\n注释：\n[1]\n赴：这里是赴任的意思。\n[2]\n寥落：稀少，冷落。\n[3]\n迢遥：形容遥远。\n[4]\n铙（náo）：古代军中的乐器。\n[5]\n赛敬亭神：旧时的迷信活动。\n[6]\n罟（ɡǔ）师：此处代指渔夫。", "english": "Beyond the clouds few mountains stand,\nAboard,you see the far-off land.\nOn western stream the cymbals blare,\nTheir echo floats in autumn air.\nDifferent from the drear town old,\nThe moon shines on tide wide and cold.\nFishermen worship gods with laughter,\nAnd cast their net to catch fish after.\nDo you know how fast my longing grows?\nSee how fast the southern wind blows!", "poemType": "五言古诗", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">寥落<sup class=\"note-ref\">[2]</sup>云外山，<br>迢遥<sup class=\"note-ref\">[3]</sup>舟中赏。<br>铙<sup class=\"note-ref\">[4]</sup>吹发西江，<br>秋空多清响。<br>地迥古城芜，<br>月明寒潮广。<br>时赛敬亭神<sup class=\"note-ref\">[5]</sup>，<br>复解罟师<sup class=\"note-ref\">[6]</sup>网。<br>何处寄相思？<br>南风吹五两。</p>\n<p class=\"prose\">公元740年，王维时任殿中侍御史，南进经夏口（今湖北武昌）写了这首五言古诗。这首诗是沿着船行进的路线来写的。前四句是倒写，实际上应是“铙吹发西江，秋空多清响。寥落云外山，迢遥舟中赏”。接下来四句“地迥古城芜，月明寒潮广。</p>\n<p class=\"prose\">时赛敬亭神，复解罟师网”，写诗人己到夏口接近宣城地界看到与想到的。看到的是，古城荒芜，月明清辉，寒潮阵阵；想到的是，宇文太守赴宣城，宣城一定能治理好。最后两句写诗人对宇文太守的思念，表现他与宇文太守的友情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 赴：这里是赴任的意思。<br>[2] 寥落：稀少，冷落。<br>[3] 迢遥：形容遥远。<br>[4] 铙（náo）：古代军中的乐器。<br>[5] 赛敬亭神：旧时的迷信活动。<br>[6] 罟（ɡǔ）师：此处代指渔夫。</p>", "englishHtml": "<p class=\"poem-lines\">Beyond the clouds few mountains stand,<br>Aboard,you see the far-off land.<br>On western stream the cymbals blare,<br>Their echo floats in autumn air.<br>Different from the drear town old,<br>The moon shines on tide wide and cold.<br>Fishermen worship gods with laughter,<br>And cast their net to catch fish after.<br>Do you know how fast my longing grows?<br>See how fast the southern wind blows!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seeing Governor Yuwen Off to Xuancheng,” the poem is shaped by parting, but its emotion is held back rather than overstated.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it keeps farewell emotion controlled, leaving much of the feeling between the lines. Key images such as mountains, water, moonlight, and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "086", "zhTitle": "青溪", "enTitle": "The Blue Stream", "chinese": "[1]\n言\n[2]\n入黄花川，\n每逐青溪水。\n随山将万转，\n趣\n[3]\n途无百里。\n声喧乱石中，\n色静深松里。\n漾漾泛菱荇\n[4]\n，\n澄澄映葭苇。\n我心素已闲，\n清川澹\n[5]\n如此。\n请留盘石上，\n垂钓将已矣。\n这首诗的题目在《文苑英华》中作《过青溪水作》。青溪名不见经传，就在黄花川。此诗作于诗人入蜀途中。诗人借颂扬名不见经传的青溪，来印证自己的素愿。以青溪之淡泊，喻自身之素愿安闲。诗的每一句都可以独立成为一幅优美的画面，溪流随山势蜿蜓，在乱石中奔腾咆哮，在松林里静静流淌，水面微波荡漾，各种水生植物随波浮动，溪边的巨石上，垂钓老翁消闲自在。诗句自然清淡，绘声绘色，静中有动，托物寄情，韵味无穷。\n注释：\n[1]\n青溪：在今陕西勉县之东。\n[2]\n言：语气词，无义。\n[3]\n趣：同“趋”，指走过的路途。\n[4]\n菱（línɡ）荇（xìnɡ）：水草。\n[5]\n澹（dàn）：形容溪水澄净。", "english": "I follow the Blue Rill\nTo Stream of Yellow Blooms.\nIt winds from hill to hill\nTill far away it looms.\nIt roars amid pebbles white,\nAnd calms down under pines green.\nWeeds float on ripples light,\nReeds mirrored like a screen.\nMy mind carefree alone,\nThe clear stream flows with ease.\nI would sit on a stone,\nTo fish whatever I please.", "poemType": "五言古诗", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">言<sup class=\"note-ref\">[2]</sup>入黄花川，<br>每逐青溪水。<br>随山将万转，<br>趣<sup class=\"note-ref\">[3]</sup>途无百里。<br>声喧乱石中，<br>色静深松里。<br>漾漾泛菱荇<sup class=\"note-ref\">[4]</sup>，<br>澄澄映葭苇。<br>我心素已闲，<br>清川澹<sup class=\"note-ref\">[5]</sup>如此。<br>请留盘石上，<br>垂钓将已矣。</p>\n<p class=\"prose\">这首诗的题目在《文苑英华》中作《过青溪水作》。青溪名不见经传，就在黄花川。此诗作于诗人入蜀途中。诗人借颂扬名不见经传的青溪，来印证自己的素愿。以青溪之淡泊，喻自身之素愿安闲。诗的每一句都可以独立成为一幅优美的画面，溪流随山势蜿蜓，在乱石中奔腾咆哮，在松林里静静流淌，水面微波荡漾，各种水生植物随波浮动，溪边的巨石上，垂钓老翁消闲自在。</p>\n<p class=\"prose\">诗句自然清淡，绘声绘色，静中有动，托物寄情，韵味无穷。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 青溪：在今陕西勉县之东。<br>[2] 言：语气词，无义。<br>[3] 趣：同“趋”，指走过的路途。<br>[4] 菱（línɡ）荇（xìnɡ）：水草。<br>[5] 澹（dàn）：形容溪水澄净。</p>", "englishHtml": "<p class=\"poem-lines\">I follow the Blue Rill<br>To Stream of Yellow Blooms.<br>It winds from hill to hill<br>Till far away it looms.<br>It roars amid pebbles white,<br>And calms down under pines green.<br>Weeds float on ripples light,<br>Reeds mirrored like a screen.<br>My mind carefree alone,<br>The clear stream flows with ease.<br>I would sit on a stone,<br>To fish whatever I please.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Blue Stream,” the poem turns a natural scene into a quiet spiritual space, where landscape and feeling become almost inseparable.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, water, flowers, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "087", "zhTitle": "送秘书晁监还日本国", "enTitle": "Seeing Secretary Chao Back to Japan", "chinese": "积水不可极，\n安知沧海东\n[1]\n！\n九州何处远？\n万里若乘空。\n向国唯看日，\n归帆但信风。\n鳌身映天黑，\n鱼眼射波红。\n乡树扶桑外，\n主人孤岛中。\n别离方异域，\n音信若为通。\n这是王维送别诗中又一力作，也是一曲中日两国在唐朝时的友谊之歌。秘书晁监即晁衡，原名阿倍仲麻吕，开元五年（717）以遣唐使来中国，因慕中国之风，留而不去，改名为晁衡。天宝十二年（753），晁衡乘船回国探亲。王维并没有航海的经历，但从目的地的渺远和航程的艰险，诗人声声喟叹，让人感同身受地体会到了航海时的孤独感、神秘感和恐惧感。全诗充满了一种怅惘、忧愁、悬念、惜别等杂糅交织而成的至精至诚的情谊。\n注释：\n[1]\n沧海东：此处代指日本。", "english": "The sea is far and wide,\nWho knows the other side?\nHow far is it away?\nA thousand miles,you say.\nLook at the sun,oh!please.\nYour sail should trust the breeze.\nTurtles bear the dark sky;\nGiant fishes raise waves high.\nWhen you are in your isle,\nThere’re trees from mile to mile.\nThough we’re separated for long,\nWould you send me your song?", "poemType": "五言古诗", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">积水不可极，<br>安知沧海东<sup class=\"note-ref\">[1]</sup>！<br>九州何处远？<br>万里若乘空。<br>向国唯看日，<br>归帆但信风。<br>鳌身映天黑，<br>鱼眼射波红。<br>乡树扶桑外，<br>主人孤岛中。<br>别离方异域，<br>音信若为通。</p>\n<p class=\"prose\">这是王维送别诗中又一力作，也是一曲中日两国在唐朝时的友谊之歌。秘书晁监即晁衡，原名阿倍仲麻吕，开元五年（717）以遣唐使来中国，因慕中国之风，留而不去，改名为晁衡。天宝十二年（753），晁衡乘船回国探亲。王维并没有航海的经历，但从目的地的渺远和航程的艰险，诗人声声喟叹，让人感同身受地体会到了航海时的孤独感、神秘感和恐惧感。</p>\n<p class=\"prose\">全诗充满了一种怅惘、忧愁、悬念、惜别等杂糅交织而成的至精至诚的情谊。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 沧海东：此处代指日本。</p>", "englishHtml": "<p class=\"poem-lines\">The sea is far and wide,<br>Who knows the other side?<br>How far is it away?<br>A thousand miles,you say.<br>Look at the sun,oh!please.<br>Your sail should trust the breeze.<br>Turtles bear the dark sky;<br>Giant fishes raise waves high.<br>When you are in your isle,<br>There’re trees from mile to mile.<br>Though we’re separated for long,<br>Would you send me your song?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seeing Secretary Chao Back to Japan,” the poem is shaped by parting, but its emotion is held back rather than overstated.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it keeps farewell emotion controlled, leaving much of the feeling between the lines. Key images such as water, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "088", "zhTitle": "晓行巴峡", "enTitle": "Passing Through the Gorge in the Morning", "chinese": "际晓\n[1]\n投巴峡，\n余春忆帝京。\n晴江一女浣，\n朝日众鸡鸣。\n水国舟中市，\n山桥树杪\n[2]\n行。\n登高万井\n[3]\n出，\n眺迥二流明。\n人作殊方\n[4]\n语，\n莺为故国声。\n赖多山水趣，\n稍解别离情。\n巴峡，长江自巴县（今四川重庆）至涪州（今四川涪陵）一段有明月、黄葛、铜锣、石洞、鸡鸣、黄草等峡，这些峡皆在古巴县或巴郡境内，因统称为巴峡。本诗描写了巴峡周围的景色和风土人情。词句清丽，景象雄伟。水国舟市，道尽水乡的独特风貌；桥过树梢，极写山乡的奇幻景观。“登高万井出，眺迥二流明”，使人视野开阔，诗歌意境也随之宏远。不同的方言俚俗，相同的莺啼鸟叫，写尽在外流浪漂泊的异乡人的思念之情。此地虽有山水情趣，也只能稍事排解离别之情、思念之苦。\n注释：\n[1]\n际晓：黎明。\n[2]\n树杪（miǎo）：树梢。\n[3]\n万井：此处代指千家万户。\n[4]\n殊方：远方，异域。", "english": "Our boat enters the Western Gorge at dawn,\nUnlike the capital in vernal morn.\nA maiden washes her things by the stream;\nAll roasters crow to welcome the sunbeam.\nPeople bargain in the boat as they please;\nThe arching bridge seems higher than the trees.\nAll village huts emerge when you climb high;\nWhen you look far,two clear rivers flow by.\nWith a strange accent people talk along,\nBut southern orioles too sing northern song.\nBy luck the delights of mountains and streams\nWill alleviate my homesickness in dreams.", "poemType": "五言古诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">际晓<sup class=\"note-ref\">[1]</sup>投巴峡，<br>余春忆帝京。<br>晴江一女浣，<br>朝日众鸡鸣。<br>水国舟中市，<br>山桥树杪<sup class=\"note-ref\">[2]</sup>行。<br>登高万井<sup class=\"note-ref\">[3]</sup>出，<br>眺迥二流明。<br>人作殊方<sup class=\"note-ref\">[4]</sup>语，<br>莺为故国声。<br>赖多山水趣，<br>稍解别离情。</p>\n<p class=\"prose\">巴峡，长江自巴县（今四川重庆）至涪州（今四川涪陵）一段有明月、黄葛、铜锣、石洞、鸡鸣、黄草等峡，这些峡皆在古巴县或巴郡境内，因统称为巴峡。本诗描写了巴峡周围的景色和风土人情。词句清丽，景象雄伟。水国舟市，道尽水乡的独特风貌；</p>\n<p class=\"prose\">桥过树梢，极写山乡的奇幻景观。“登高万井出，眺迥二流明”，使人视野开阔，诗歌意境也随之宏远。不同的方言俚俗，相同的莺啼鸟叫，写尽在外流浪漂泊的异乡人的思念之情。此地虽有山水情趣，也只能稍事排解离别之情、思念之苦。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 际晓：黎明。<br>[2] 树杪（miǎo）：树梢。<br>[3] 万井：此处代指千家万户。<br>[4] 殊方：远方，异域。</p>", "englishHtml": "<p class=\"poem-lines\">Our boat enters the Western Gorge at dawn,<br>Unlike the capital in vernal morn.<br>A maiden washes her things by the stream;<br>All roasters crow to welcome the sunbeam.<br>People bargain in the boat as they please;<br>The arching bridge seems higher than the trees.<br>All village huts emerge when you climb high;<br>When you look far,two clear rivers flow by.<br>With a strange accent people talk along,<br>But southern orioles too sing northern song.<br>By luck the delights of mountains and streams<br>Will alleviate my homesickness in dreams.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Passing Through the Gorge in the Morning,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, birds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "089", "zhTitle": "西施咏", "enTitle": "Song of the Beauty of the West", "chinese": "艳色天下重，\n西施宁久微？\n朝为越溪女，\n暮作吴宫妃。\n贱日岂殊众\n[1]\n？\n贵来方悟稀。\n邀人傅脂粉，\n不自着罗衣。\n君宠益娇态，\n君怜无是非。\n当\n[2]\n时浣纱伴，\n莫得同车归。\n持谢\n[3]\n邻家子，\n效颦安可希！\n本诗取材于历史人物，借古讽今。诗的开首四句写西施有艳丽的姿色，终不能久处低微。诗人借西施“朝贱夕贵”而浣纱同伴中仅她一人命运发生改变的经历，感叹世态炎凉，抒发怀才不遇的不平与感慨。诗的次六句写西施一旦得到君王宠爱，就身价百倍。诗人借世人只见显贵时的西施之美，表达对势利小人的嘲讽。诗人借“朝为越溪女”的西施“暮作吴宫妃”后的骄纵，讥讽那些由于偶然机遇受到恩宠就趾高气扬、不可一世的人。诗歌最后四句写姿色太差的人，想效颦西施是不自量力。诗人借效颦的东施，劝告世人不要为了博取别人赏识而故作姿态，弄巧成拙。语虽浅显，寓意深刻。沈德潜在《唐诗别裁集》中说：“写尽炎凉人眼界，不为题缚，乃臻斯诣。”\n注释：\n[1]\n殊众：不同于众，出众。\n[2]\n当：又写作“常”。\n[3]\n持谢：奉告。", "english": "A beauty is loved far and wide.\nHow could she be unknown for long?\nAt dawn she washed by riverside;\nAt dusk to the king she’ll belong.\nPoor,she was one of lower race;\nEnnobled,she’s one of the few.\nShe has maids to powder her face\nAnd dress her up with silk dress new.\nRoyal favor adds to her charms;\nRoyal love turns wrong into right.\nHer companions wash with bare arms,\nCould they attain such royal height?\nTo washerwomen I would say:\nDon’t follow her unusual way!", "poemType": "五言古诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">艳色天下重，<br>西施宁久微？<br>朝为越溪女，<br>暮作吴宫妃。<br>贱日岂殊众<sup class=\"note-ref\">[1]</sup>？<br>贵来方悟稀。<br>邀人傅脂粉，<br>不自着罗衣。<br>君宠益娇态，<br>君怜无是非。<br>当<sup class=\"note-ref\">[2]</sup>时浣纱伴，<br>莫得同车归。<br>持谢<sup class=\"note-ref\">[3]</sup>邻家子，<br>效颦安可希！</p>\n<p class=\"prose\">本诗取材于历史人物，借古讽今。诗的开首四句写西施有艳丽的姿色，终不能久处低微。诗人借西施“朝贱夕贵”而浣纱同伴中仅她一人命运发生改变的经历，感叹世态炎凉，抒发怀才不遇的不平与感慨。诗的次六句写西施一旦得到君王宠爱，就身价百倍。</p>\n<p class=\"prose\">诗人借世人只见显贵时的西施之美，表达对势利小人的嘲讽。诗人借“朝为越溪女”的西施“暮作吴宫妃”后的骄纵，讥讽那些由于偶然机遇受到恩宠就趾高气扬、不可一世的人。诗歌最后四句写姿色太差的人，想效颦西施是不自量力。诗人借效颦的东施，劝告世人不要为了博取别人赏识而故作姿态，弄巧成拙。</p>\n<p class=\"prose\">语虽浅显，寓意深刻。沈德潜在《唐诗别裁集》中说：“写尽炎凉人眼界，不为题缚，乃臻斯诣。”</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 殊众：不同于众，出众。<br>[2] 当：又写作“常”。<br>[3] 持谢：奉告。</p>", "englishHtml": "<p class=\"poem-lines\">A beauty is loved far and wide.<br>How could she be unknown for long?<br>At dawn she washed by riverside;<br>At dusk to the king she’ll belong.<br>Poor,she was one of lower race;<br>Ennobled,she’s one of the few.<br>She has maids to powder her face<br>And dress her up with silk dress new.<br>Royal favor adds to her charms;<br>Royal love turns wrong into right.<br>Her companions wash with bare arms,<br>Could they attain such royal height?<br>To washerwomen I would say:<br>Don’t follow her unusual way!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song of the Beauty of the West,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "090", "zhTitle": "田园乐", "enTitle": "Seven Idylls", "chinese": "（七首其二）\n再见封侯万户，\n立谈\n[1]\n赐璧一双。\n讵\n[2]\n胜耦\n[3]\n耕南亩，\n何如高卧东窗！\n《田园乐》是王维的一组七首六言绝句，本书选了其中六首。该组诗为作者退隐辋川时所作，故一题作《辋川六言》。这首诗的前两句所用典故见《史记·平原君虞卿列传》，说的是虞卿游说赵孝成王，立谈而封侯，一见赐黄金百镒、白璧一双，再见为赵上卿。此处用典意在说明顷刻间即致富贵。全诗的主旨就是即使像虞卿一样立谈而封侯，也不如像长沮、桀溺一样躬耕自给，过着隐者闲适的生活。\n注释：\n[1]\n立谈：在交谈的当时。\n[2]\n讵（jù）：难道。表反问。\n[3]\n耦（ǒu）：两个人在一起耕地。", "english": "(II)\nI would not be ennobled lord,\nNor favored with a pair of jade.\nI’ll till the field I can afford,\nAnd lie on the couch in the shade.", "poemType": "六言绝句", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">（七首其二）<br>再见封侯万户，<br>立谈<sup class=\"note-ref\">[1]</sup>赐璧一双。<br>讵<sup class=\"note-ref\">[2]</sup>胜耦<sup class=\"note-ref\">[3]</sup>耕南亩，<br>何如高卧东窗！</p>\n<p class=\"prose\">《田园乐》是王维的一组七首六言绝句，本书选了其中六首。该组诗为作者退隐辋川时所作，故一题作《辋川六言》。这首诗的前两句所用典故见《史记·平原君虞卿列传》，说的是虞卿游说赵孝成王，立谈而封侯，一见赐黄金百镒、白璧一双，再见为赵上卿。</p>\n<p class=\"prose\">此处用典意在说明顷刻间即致富贵。全诗的主旨就是即使像虞卿一样立谈而封侯，也不如像长沮、桀溺一样躬耕自给，过着隐者闲适的生活。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 立谈：在交谈的当时。<br>[2] 讵（jù）：难道。表反问。<br>[3] 耦（ǒu）：两个人在一起耕地。</p>", "englishHtml": "<p class=\"stanza-marker\">(II)</p>\n<p class=\"poem-lines\">I would not be ennobled lord,<br>Nor favored with a pair of jade.<br>I’ll till the field I can afford,<br>And lie on the couch in the shade.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seven Idylls,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a six-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Its power comes from the pressure between plain language and the feeling held beneath it.</p>"}, {"num": "091", "zhTitle": "田园乐", "enTitle": "Seven Idylls", "chinese": "（七首其三）\n采菱渡头风急，\n策杖\n[1]\n林西日斜。\n杏树坛边渔父，\n桃花源里人家。\n关于《辋川六言》，顾璘曰：首首如画。此首亦是如此。策杖即扶杖之意。“杏树坛边渔父”用典见《庄子·渔父》：孔子弦歌，鼓琴奏曲未半，有渔父下船而来，须眉交白，被发揄袂，行原以上，距陆而止，左手据膝，右手持颐以听。意指此地有能听琴的高雅渔父。可以想象诗人过着“渡头采菱迎风急”“策杖于山林观日落”的如仙境般的桃源生活，又能在杏林坛边遇到知音，人生如此，夫复何求。\n注释：\n[1]\n策杖：拄着棍杖。", "english": "(III)\nI’d gather chestnuts in the breeze\nAnd see the sun sink,cane in hand.\nA fisherman amid the trees\nHears the sage in Peach Blossom Land.", "poemType": "六言绝句", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">（七首其三）<br>采菱渡头风急，<br>策杖<sup class=\"note-ref\">[1]</sup>林西日斜。<br>杏树坛边渔父，<br>桃花源里人家。</p>\n<p class=\"prose\">关于《辋川六言》，顾璘曰：首首如画。此首亦是如此。策杖即扶杖之意。“杏树坛边渔父”用典见《庄子·渔父》：孔子弦歌，鼓琴奏曲未半，有渔父下船而来，须眉交白，被发揄袂，行原以上，距陆而止，左手据膝，右手持颐以听。意指此地有能听琴的高雅渔父。</p>\n<p class=\"prose\">可以想象诗人过着“渡头采菱迎风急”“策杖于山林观日落”的如仙境般的桃源生活，又能在杏林坛边遇到知音，人生如此，夫复何求。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 策杖：拄着棍杖。</p>", "englishHtml": "<p class=\"stanza-marker\">(III)</p>\n<p class=\"poem-lines\">I’d gather chestnuts in the breeze<br>And see the sun sink,cane in hand.<br>A fisherman amid the trees<br>Hears the sage in Peach Blossom Land.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seven Idylls,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a six-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as flowers, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "092", "zhTitle": "田园乐", "enTitle": "Seven Idylls", "chinese": "（七首其四）\n萋萋芳草春绿，\n落\n[1]\n落长松夏寒。\n牛羊自归村巷，\n童稚不识衣冠\n[2]\n。\n以“萋萋”来形容芳草丰茂，以“落落”来形容松树高盛。萋萋芳草带给春天的是一片鲜绿，落落长松带给夏天的是阴凉风爽。这个“寒”字看似无理，用在此处极为精妙。牛羊也无需牧人，自己就能在放牧之后回到村庄。村里的顽童哪里认得什么身着官衣的士大夫。这样蔑视权贵、闲适安逸的山林田园生活，不正是诗人一贯的精神追求吗？\n注释：\n[1]\n落：树木高大的样子。\n[2]\n衣冠：士大夫的穿着打扮。", "english": "(IV)\nLuxuriant grass will turn the season green,\nAnd shady pines would cool the summer day.\nChildren cannot tell the rich from the mean;\nThe cattle go their backward way.", "poemType": "六言绝句", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">（七首其四）<br>萋萋芳草春绿，<br>落<sup class=\"note-ref\">[1]</sup>落长松夏寒。<br>牛羊自归村巷，<br>童稚不识衣冠<sup class=\"note-ref\">[2]</sup>。</p>\n<p class=\"prose\">以“萋萋”来形容芳草丰茂，以“落落”来形容松树高盛。萋萋芳草带给春天的是一片鲜绿，落落长松带给夏天的是阴凉风爽。这个“寒”字看似无理，用在此处极为精妙。牛羊也无需牧人，自己就能在放牧之后回到村庄。村里的顽童哪里认得什么身着官衣的士大夫。</p>\n<p class=\"prose\">这样蔑视权贵、闲适安逸的山林田园生活，不正是诗人一贯的精神追求吗？</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 落：树木高大的样子。<br>[2] 衣冠：士大夫的穿着打扮。</p>", "englishHtml": "<p class=\"stanza-marker\">(IV)</p>\n<p class=\"poem-lines\">Luxuriant grass will turn the season green,<br>And shady pines would cool the summer day.<br>Children cannot tell the rich from the mean;<br>The cattle go their backward way.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seven Idylls,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a six-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as trees and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "093", "zhTitle": "田园乐", "enTitle": "Seven Idylls", "chinese": "（七首其五）\n山下孤烟远村，\n天边独树高原。\n一瓢颜回\n[1]\n陋巷，\n五柳先生\n[2]\n对门。\n这首诗像一幅萧疏清淡的水墨画，山下与天边相呼应，就更可见其远。孤烟与独树相呼应，更衬托出人烟非常稀少。远村与高原相呼应，就更令人感到苍凉孤寂。这两句在画面上，色彩极为淡薄，可以看到那远处孤烟尚带一缕淡灰，那天边高原似有一层淡黄。在此清静的天地中，有颜回、陶潜那样的雅兴，多么恬适安闲、自由自在。倘若没有淡到极致的修养，则不能臻此妙境。如果说前两句是重在描绘冲淡的景物，那么后两句是重在抒发冲淡的情感。而冲淡的景情，又是彼此交融、相互渗透的。\n注释：\n[1]\n颜回：即颜渊。\n[2]\n五柳先生：陶渊明的别称。", "english": "(V)\nA wreath of smoke rises from far away,\nOn the horizon stands a lonely tree.\nA sage may live in shabby lane all day;\nUnder five willows a hermit is free.", "poemType": "六言绝句", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">（七首其五）<br>山下孤烟远村，<br>天边独树高原。<br>一瓢颜回<sup class=\"note-ref\">[1]</sup>陋巷，<br>五柳先生<sup class=\"note-ref\">[2]</sup>对门。</p>\n<p class=\"prose\">这首诗像一幅萧疏清淡的水墨画，山下与天边相呼应，就更可见其远。孤烟与独树相呼应，更衬托出人烟非常稀少。远村与高原相呼应，就更令人感到苍凉孤寂。这两句在画面上，色彩极为淡薄，可以看到那远处孤烟尚带一缕淡灰，那天边高原似有一层淡黄。</p>\n<p class=\"prose\">在此清静的天地中，有颜回、陶潜那样的雅兴，多么恬适安闲、自由自在。倘若没有淡到极致的修养，则不能臻此妙境。如果说前两句是重在描绘冲淡的景物，那么后两句是重在抒发冲淡的情感。而冲淡的景情，又是彼此交融、相互渗透的。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 颜回：即颜渊。<br>[2] 五柳先生：陶渊明的别称。</p>", "englishHtml": "<p class=\"stanza-marker\">(V)</p>\n<p class=\"poem-lines\">A wreath of smoke rises from far away,<br>On the horizon stands a lonely tree.<br>A sage may live in shabby lane all day;<br>Under five willows a hermit is free.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seven Idylls,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a six-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, clouds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "094", "zhTitle": "田园乐", "enTitle": "Seven Idylls", "chinese": "（七首其六）\n桃红复含宿雨，\n柳绿更带春烟\n[1]\n。\n花落家童\n[2]\n未扫，\n莺啼山客犹眠。\n春桃更带雨润，分外妖娆动人。绿柳掩映于春烟，自见其婀娜之风姿。花落处恰是满园春色，家童未及收扫，更带出了一番春天悠然之风韵。有前三句的映衬，主人飘逸之神情于莺啼酣眠之际呼之欲出。桃是妖娆，柳是嫩绿，花是满园，莺是陪侍，此一番景致，真乃天上人间耳。此时此刻，此事此景才是诗佛王维心中真正之归宿，由是才能酣然而眠。\n注释：\n[1]\n春烟：春天里因气候变暖而产生的烟雾。\n[2]\n家童：家中的仆人。", "english": "(VI)\nPeach flowers reddened by night rain,\nGreen willows veiled in mist of spring.\nThe fallen blooms unswept remain;\nThe hermit sleeps when orioles sing.", "poemType": "六言绝句", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">（七首其六）<br>桃红复含宿雨，<br>柳绿更带春烟<sup class=\"note-ref\">[1]</sup>。<br>花落家童<sup class=\"note-ref\">[2]</sup>未扫，<br>莺啼山客犹眠。</p>\n<p class=\"prose\">春桃更带雨润，分外妖娆动人。绿柳掩映于春烟，自见其婀娜之风姿。花落处恰是满园春色，家童未及收扫，更带出了一番春天悠然之风韵。有前三句的映衬，主人飘逸之神情于莺啼酣眠之际呼之欲出。桃是妖娆，柳是嫩绿，花是满园，莺是陪侍，此一番景致，真乃天上人间耳。</p>\n<p class=\"prose\">此时此刻，此事此景才是诗佛王维心中真正之归宿，由是才能酣然而眠。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 春烟：春天里因气候变暖而产生的烟雾。<br>[2] 家童：家中的仆人。</p>", "englishHtml": "<p class=\"stanza-marker\">(VI)</p>\n<p class=\"poem-lines\">Peach flowers reddened by night rain,<br>Green willows veiled in mist of spring.<br>The fallen blooms unswept remain;<br>The hermit sleeps when orioles sing.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seven Idylls,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a six-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, clouds, flowers, and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "095", "zhTitle": "田园乐", "enTitle": "Seven Idylls", "chinese": "（七首其七）\n酌酒会临泉水，\n抱琴好倚长松。\n南园露葵\n[1]\n朝折，\n东谷黄粱夜舂\n[2]\n。\n泉边饮酒，松下弹琴，这正是诗人所向往的隐者神仙般的生活。然而这种隐者生活也离不开朝折露葵，夜舂黄粱的人间生活，正是所谓的天上人间，表现出诗人隐居生活的情趣。六言体诗歌上下两句常常是对仗工整，互增意趣。与刘长卿的六言体八句一体不同，王维的六言体往往是四句一体。\n注释：\n[1]\n露葵：莼菜。\n[2]\n舂：把东西放在石臼或乳钵里捣掉皮和壳或捣碎。", "english": "(VII)\nBy fountainside I drink my wine\nAnd play my lute,leaning on pine.\nPlucking sunflowers in twilight,\nI pound eastern millet at night.", "poemType": "六言绝句", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">（七首其七）<br>酌酒会临泉水，<br>抱琴好倚长松。<br>南园露葵<sup class=\"note-ref\">[1]</sup>朝折，<br>东谷黄粱夜舂<sup class=\"note-ref\">[2]</sup>。</p>\n<p class=\"prose\">泉边饮酒，松下弹琴，这正是诗人所向往的隐者神仙般的生活。然而这种隐者生活也离不开朝折露葵，夜舂黄粱的人间生活，正是所谓的天上人间，表现出诗人隐居生活的情趣。六言体诗歌上下两句常常是对仗工整，互增意趣。与刘长卿的六言体八句一体不同，王维的六言体往往是四句一体。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 露葵：莼菜。<br>[2] 舂：把东西放在石臼或乳钵里捣掉皮和壳或捣碎。</p>", "englishHtml": "<p class=\"stanza-marker\">(VII)</p>\n<p class=\"poem-lines\">By fountainside I drink my wine<br>And play my lute,leaning on pine.<br>Plucking sunflowers in twilight,<br>I pound eastern millet at night.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seven Idylls,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a six-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, trees, and wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "096", "zhTitle": "陇头吟", "enTitle": "A Frontier Song", "chinese": "长安少年游侠客，\n夜上戍楼看太白。\n陇头明月迥临关，\n陇上行人\n[1]\n夜吹笛。\n关西老将不胜愁，\n驻马听之双泪流。\n身经大小百余战，\n麾下偏裨\n[2]\n万户侯。\n苏武才为典属国，\n节旄\n[3]\n落尽海西头。\n这是王维用乐府旧题写的一首著名边塞诗，题目一作“边情”。“陇头吟”即“陇头”，汉代乐府曲辞名，属横吹曲辞，李延年造。陇头，指陇山一带，大致在今陕西陇县到甘肃平凉一带。本诗写到“长安少年”“陇上行人”“关西老将”这三个人物，其中关西老将又引苏武与之类比，表面似乎是安慰关西老将，实际上恰恰说明了关西老将的遭遇不是偶然的。功大赏小，功小赏大，朝廷不公，古来如此，从而深化了诗的主题。而今日的长安少年，安知不是明日的陇上行人，后日的关西老将？而今日的关西老将，又安知不是昨日的陇上行人，前日的长安少年？诗的主旨是发人深省的。\n注释：\n[1]\n行人：出征的人。\n[2]\n偏裨（pí）：偏将，裨将。将佐的通称。\n[3]\n节旄（máo）：旌节上所缀的牦牛尾饰物。", "english": "A hero of the capital comes from afar,\nHe mounts the tower to watch the evening star.\nThe moon shines bright on city walls of the frontier;\nThe wayfarer at night plays his flute sad and drear.\nA sorrow-laden general stops his steed and hears,\nBut how could he stop his two flowing streams of tears!\nHe’s hardened by hundreds of battles far and nigh;\nOfficers under him are promoted to posts high.\nHe’s still in charge of the border’s petty affairs,\nLike an old shepherd by the seaside no one cares.", "poemType": "乐府/古体", "poemTheme": "边塞", "chineseHtml": "<p class=\"poem-lines\">长安少年游侠客，<br>夜上戍楼看太白。<br>陇头明月迥临关，<br>陇上行人<sup class=\"note-ref\">[1]</sup>夜吹笛。<br>关西老将不胜愁，<br>驻马听之双泪流。<br>身经大小百余战，<br>麾下偏裨<sup class=\"note-ref\">[2]</sup>万户侯。<br>苏武才为典属国，<br>节旄<sup class=\"note-ref\">[3]</sup>落尽海西头。</p>\n<p class=\"prose\">这是王维用乐府旧题写的一首著名边塞诗，题目一作“边情”。“陇头吟”即“陇头”，汉代乐府曲辞名，属横吹曲辞，李延年造。陇头，指陇山一带，大致在今陕西陇县到甘肃平凉一带。本诗写到“长安少年”“陇上行人”“关西老将”这三个人物，其中关西老将又引苏武与之类比，表面似乎是安慰关西老将，实际上恰恰说明了关西老将的遭遇不是偶然的。</p>\n<p class=\"prose\">功大赏小，功小赏大，朝廷不公，古来如此，从而深化了诗的主题。而今日的长安少年，安知不是明日的陇上行人，后日的关西老将？而今日的关西老将，又安知不是昨日的陇上行人，前日的长安少年？诗的主旨是发人深省的。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 行人：出征的人。<br>[2] 偏裨（pí）：偏将，裨将。将佐的通称。<br>[3] 节旄（máo）：旌节上所缀的牦牛尾饰物。</p>", "englishHtml": "<p class=\"poem-lines\">A hero of the capital comes from afar,<br>He mounts the tower to watch the evening star.<br>The moon shines bright on city walls of the frontier;<br>The wayfarer at night plays his flute sad and drear.<br>A sorrow-laden general stops his steed and hears,<br>But how could he stop his two flowing streams of tears!<br>He’s hardened by hundreds of battles far and nigh;<br>Officers under him are promoted to posts high.<br>He’s still in charge of the border’s petty affairs,<br>Like an old shepherd by the seaside no one cares.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Frontier Song,” the poem places personal feeling against the vastness of the frontier, so distance and duty become part of its emotional force.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it sets Wang Wei&#x27;s restrained voice against open space and public duty. Key images such as moonlight, frontier scenes, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "097", "zhTitle": "桃源行", "enTitle": "Song of Peach Blossom Land", "chinese": "渔舟逐水\n[1]\n爱山春，\n两岸桃花夹古津。\n坐\n[2]\n看红树不知远，\n行尽青溪不见人。\n山口潜行始隈\n[3]\n隩，\n山开旷望旋\n[4]\n平陆。\n遥看一处攒云树，\n近入千家散花竹。\n樵客初传汉姓名，\n居人未改秦衣服。\n居人共住武陵源，\n还从物外起田园。\n月明松下房栊\n[5]\n静，\n日出云中鸡犬喧。\n惊闻俗客争来集，\n竞引还家问都邑。\n平明闾巷扫花开，\n薄暮渔樵乘水入。\n初因避地去人间，\n乃至成仙遂不还。\n峡里谁知有人事？\n世中遥望空云山。\n不疑灵境难闻见，\n尘心未尽思乡县。\n出洞无论隔山水，\n辞家终拟长游衍\n[6]\n。\n自谓经过旧不迷，\n安知峰壑今来变。\n当时只记入山深，\n青溪几度到云林？\n春来遍是桃花水，\n不辨仙源何处寻。\n这是王维19岁时写的一首七言乐府诗，本诗以陶渊明的《桃花源记》为蓝本，取其大意，变文为诗，进行了艺术的再创造，开拓了诗的意境，具有独特的艺术价值。因而本诗能与散文《桃花源记》并传于世。《桃花源记》描写的是与世隔绝的“人境”，本诗写的是“仙境”。王维以理想的田园环境来刻画桃源仙境，这种仙凡一体的艺术手法在盛唐诗歌中具有代表性。清人王士禛说：“唐宋以来，作《桃源行》最佳者，王摩诘（维）、韩退之（愈）、王介甫（安石）三篇。观退之、介甫二诗，笔力意思甚可喜。及读摩诘诗，多少自在；二公便如努力挽强，不免面红耳热，此盛唐所以高不可及。”\n注释：\n[1]\n逐水：顺着溪水。\n[2]\n坐：因为。\n[3]\n隈（wēi）：山脉弯曲，水流拐弯的地方。\n[4]\n旋：不久。\n[5]\n房栊（lónɡ）：房屋的窗户。\n[6]\n游衍：流连忘返。", "english": "A fisherman loved vernal hills and winding stream,\nHis boat between the shores,he saw peach blossoms beam.\nHe knew not how far he’d gone,charmed by blooming scene,\nUp to the end of the stream not a man was seen.\nAt the foot of the hill he found a winding way,\nBeyond the hills a plain extended far,far away.\nViewed from afar,the forest seemed to scrape the sky;\nBamboos and flowers scattered in houses nearby.\nA woodman told him a name used long,long ago,\nPeople were dressed in a style now no one would know.\nAs they had lived together in Peach Blossom Land,\nBeyond the bustle fields were tilled with plough in hand.\nUnder moonlit pines cots looked quiet in the dark,\nUp to sunlit clouds cocks crow was heard with dogs’bark.\nCurious about the stranger,they came from up and down,\nLed him to their cottages and asked about the town.\nFallen petals on the lane were swept clean by day,\nAt dusk fishermen and woodmen on homeward way.\nTheir fathers left the war-torn land to flee from woe,\nThis fairyland was found,away they would not go.\nDeep in the vale,no one cared about world affair;\nGazing afar,they longed for cloud and mountain air.\nKnowing not such fairyland was hard to be refound,\nThe fisherman longed to go back to his native ground.\nHe left the place and passed over mountains and streams,\nBut how could he forget the scene of his dear dreams?\nHe thought,having come once,he would not go astray,\nWithout knowing peak and stream would change on the way.\nLast time he came,he only knew the mountain deep,\nBut memory of cloudy way he did not keep.\nWhen spring came,everywhere he saw peach blossoms nice.\nBut where could he find again his lost paradise!", "poemType": "乐府/古体", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">渔舟逐水<sup class=\"note-ref\">[1]</sup>爱山春，<br>两岸桃花夹古津。<br>坐<sup class=\"note-ref\">[2]</sup>看红树不知远，<br>行尽青溪不见人。<br>山口潜行始隈<sup class=\"note-ref\">[3]</sup>隩，<br>山开旷望旋<sup class=\"note-ref\">[4]</sup>平陆。<br>遥看一处攒云树，<br>近入千家散花竹。<br>樵客初传汉姓名，<br>居人未改秦衣服。<br>居人共住武陵源，<br>还从物外起田园。<br>月明松下房栊<sup class=\"note-ref\">[5]</sup>静，<br>日出云中鸡犬喧。<br>惊闻俗客争来集，<br>竞引还家问都邑。<br>平明闾巷扫花开，<br>薄暮渔樵乘水入。<br>初因避 r>The fisherman longed to go back to his native ground.<br>He left the place and passed over mountains and streams,<br>But how could he forget the scene of his dear dreams?<br>He thought,having come once,he would not go astray,<br>Without knowing peak and stream would change on the way.<br>Last time he came,he only knew the mountain deep,<br>But memory of cloudy way he did not keep.<br>When spring came,everywhere he saw peach blossoms nice.<br>But where could he find again his lost paradise!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song of Peach Blossom Land,” the poem turns a natural scene into a quiet spiritual space, where landscape and feeling become almost inseparable.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, water, moonlight, and clouds give the poem its visual texture and emotional temperature.</p>"}];

    let active = 0;
    let scale = Number(localStorage.getItem("wangwei-reader-scale") || "0");

    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const title = document.getElementById("title");
    const enTitle = document.getElementById("enTitle");
    const poemType = document.getElementById("poemType");
    const poemTheme = document.getElementById("poemTheme");
    const chinese = document.getElementById("chinese");
    const english = document.getElementById("english");
    const leftPane = document.getElementById("leftPane");
    const rightPane = document.getElementById("rightPane");
    const progress = document.getElementById("progress");
    const wordPopover = document.getElementById("wordPopover");
    const wordPopoverWord = document.getElementById("wordPopoverWord");
    const wordPopoverZh = document.getElementById("wordPopoverZh");
    const wordPopoverEn = document.getElementById("wordPopoverEn");
    const wordPopoverContext = document.getElementById("wordPopoverContext");
    const wordCambridge = document.getElementById("wordCambridge");
    const wordGoogle = document.getElementById("wordGoogle");
    const wordYoudao = document.getElementById("wordYoudao");
    const wordPopoverClose = document.getElementById("wordPopoverClose");

    function applyScale() {
      document.documentElement.style.setProperty("--body-size", `${19 + scale}px`);
      document.documentElement.style.setProperty("--poem-size", `${23 + scale}px`);
      document.documentElement.style.setProperty("--en-size", `${23 + scale}px`);
      localStorage.setItem("wangwei-reader-scale", String(scale));
    }

    function renderList(filter = "") {
      const q = filter.trim().toLowerCase();
      list.innerHTML = "";
      poems.forEach((poem, index) => {
        if (q && !`${poem.zhTitle} ${poem.enTitle} ${poem.poemType} ${poem.poemTheme}`.toLowerCase().includes(q)) return;
        const button = document.createElement("button");
        button.className = "poem-link" + (index === active ? " active" : "");
        button.innerHTML = `<span class="num">${poem.num}</span><span><span class="link-row"><span class="link-title">${poem.zhTitle}</span><span class="type-pill">${poem.poemType}</span><span class="type-pill theme-pill">${poem.poemTheme}</span></span><span class="link-en">${poem.enTitle}</span></span>`;
        button.addEventListener("click", () => showPoem(index));
        list.appendChild(button);
      });
    }

    function showPoem(index) {
      active = Math.max(0, Math.min(poems.length - 1, index));
      const poem = poems[active];
      title.textContent = `${poem.num}. ${poem.zhTitle}`;
      enTitle.textContent = poem.enTitle;
      poemType.textContent = poem.poemType;
      poemTheme.textContent = poem.poemTheme;
      chinese.innerHTML = poem.chineseHtml;
      english.innerHTML = poem.englishHtml;
      leftPane.scrollTop = 0;
      rightPane.scrollTop = 0;
      progress.style.width = `${((active + 1) / poems.length) * 100}%`;
      renderList(search.value);
      const current = list.querySelector(".active");
      if (current) current.scrollIntoView({ block: "nearest" });
      hideWordPopover();
    }

    function normalizeSelection(value) {
      return value
        .trim()
        .replace(/[“”"‘’.,;:!?()[\]{}<>]/g, "")
        .replace(/^[-—]+|[-—]+$/g, "")
        .toLowerCase();
    }

    function selectionInsideRightPane(selection) {
      if (!selection || selection.rangeCount === 0) return false;
      const range = selection.getRangeAt(0);
      const node = range.commonAncestorContainer.nodeType === Node.TEXT_NODE
        ? range.commonAncestorContainer.parentElement
        : range.commonAncestorContainer;
      return node && rightPane.contains(node);
    }

    function showWordPopover() {
      const selection = window.getSelection();
      if (!selectionInsideRightPane(selection)) {
        hideWordPopover();
        return;
      }
      const raw = selection.toString().trim();
      const word = normalizeSelection(raw);
      if (!word || word.includes(" ") || word.length > 32 || !/[a-z]/.test(word)) {
        hideWordPopover();
        return;
      }
      const range = selection.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      if (!rect || (rect.width === 0 && rect.height === 0)) return;
      const entry = literaryGlossary[word] || {
        zh: "本地词表暂无释义",
        en: "No local entry yet.",
        context: "Use the dictionary links below for a fuller explanation."
      };
      wordPopoverWord.textContent = word;
      wordPopoverZh.textContent = entry.zh;
      wordPopoverEn.textContent = entry.en;
      wordPopoverContext.textContent = entry.context;
      const encoded = encodeURIComponent(word);
      wordCambridge.href = `https://dictionary.cambridge.org/dictionary/english/${encoded}`;
      wordGoogle.href = `https://translate.google.com/?sl=en&tl=zh-CN&text=${encoded}&op=translate`;
      wordYoudao.href = `https://www.youdao.com/result?word=${encoded}&lang=en`;
      positionWordPopover(rect);
      wordPopover.classList.add("open");
    }

    function positionWordPopover(rect) {
      const gap = 10;
      const width = Math.min(340, window.innerWidth - 28);
      let left = rect.left + rect.width / 2 - width / 2;
      left = Math.max(14, Math.min(left, window.innerWidth - width - 14));
      let top = rect.bottom + gap;
      if (top + 220 > window.innerHeight) {
        top = Math.max(14, rect.top - 230);
      }
      wordPopover.style.left = `${left}px`;
      wordPopover.style.top = `${top}px`;
    }

    function hideWordPopover() {
      if (wordPopover) wordPopover.classList.remove("open");
    }

    document.getElementById("prev").addEventListener("click", () => showPoem(active - 1));
    document.getElementById("next").addEventListener("click", () => showPoem(active + 1));
    document.getElementById("smaller").addEventListener("click", () => { scale = Math.max(-4, scale - 1); applyScale(); });
    document.getElementById("larger").addEventListener("click", () => { scale = Math.min(7, scale + 1); applyScale(); });
    search.addEventListener("input", () => renderList(search.value));
    rightPane.addEventListener("mouseup", () => setTimeout(showWordPopover, 10));
    rightPane.addEventListener("touchend", () => setTimeout(showWordPopover, 220));
    wordPopoverClose.addEventListener("click", hideWordPopover);
    document.addEventListener("mousedown", (event) => {
      if (!wordPopover.contains(event.target) && !rightPane.contains(event.target)) hideWordPopover();
    });
    window.addEventListener("resize", hideWordPopover);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") hideWordPopover();
      if (event.key === "ArrowLeft") showPoem(active - 1);
      if (event.key === "ArrowRight") showPoem(active + 1);
    });

    applyScale();
    renderList();
    showPoem(2);
  </script>
