<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>许渊冲译王维诗选｜iPad 横屏对照阅读</title>
  <style>
    :root {
      --ink: #28231b;
      --muted: #756d60;
      --paper: #f8f1e4;
      --paper-deep: #eee0c7;
      --panel: rgba(255, 250, 239, .88);
      --line: rgba(80, 61, 33, .18);
      --accent: #9b3f24;
      --accent-2: #2f5d50;
      --shadow: 0 22px 70px rgba(56, 38, 16, .16);
      --body-size: 19px;
      --body-leading: 1.86;
      --poem-size: 23px;
      --en-size: calc(var(--body-size) + 4px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(155, 63, 36, .10), transparent 31%),
        radial-gradient(circle at 84% 18%, rgba(47, 93, 80, .11), transparent 28%),
        linear-gradient(135deg, #fbf5e8 0%, #f2e3c9 46%, #ead8b8 100%);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Times New Roman", serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .38;
      background-image:
        linear-gradient(rgba(72, 50, 22, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 50, 22, .035) 1px, transparent 1px);
      background-size: 28px 28px, 28px 28px;
      mix-blend-mode: multiply;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(220px, 24vw) 1fr;
      gap: 14px;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    .sidebar, .reader {
      position: relative;
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      border-radius: 14px 6px 6px 14px;
      overflow: hidden;
    }

    .brand {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0));
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-weight: 700;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: clamp(26px, 3.1vw, 42px);
      font-weight: 650;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .tool, .nav-button {
      appearance: none;
      border: 1px solid rgba(80, 61, 33, .22);
      background: rgba(255, 255, 255, .42);
      color: var(--ink);
      border-radius: 8px;
      min-height: 38px;
      font: 650 13px/1 "Avenir Next", "Helvetica Neue", sans-serif;
      cursor: pointer;
    }

    .tool:active, .nav-button:active, .poem-link:active {
      transform: translateY(1px);
    }

    .search-wrap {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: 100%;
      height: 40px;
      border: 1px solid rgba(80, 61, 33, .22);
      border-radius: 8px;
      padding: 0 12px;
      background: rgba(255, 255, 255, .58);
      color: var(--ink);
      font-size: 15px;
      outline: none;
    }

    .list {
      overflow: auto;
      padding: 8px;
    }

    .poem-link {
      width: 100%;
      border: 0;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 8px;
      align-items: start;
      padding: 10px 9px;
      margin: 2px 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .poem-link.active {
      background: #f0ddbb;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .num {
      color: var(--accent);
      font: 700 12px/1.5 "Avenir Next", sans-serif;
    }

    .link-title {
      display: block;
      font-size: 15px;
      line-height: 1.25;
      white-space: normal;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .type-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 7px;
      border: 1px solid rgba(155, 63, 36, .22);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(155, 63, 36, .07);
      font: 650 11px/1 "Avenir Next", "Helvetica Neue", sans-serif;
      white-space: nowrap;
    }

    .theme-pill {
      border-color: rgba(47, 93, 80, .24);
      color: var(--accent-2);
      background: rgba(47, 93, 80, .08);
    }

    .link-en {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font: 12px/1.25 "Georgia", serif;
    }

    .sidebar-footer {
      padding: 10px 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font: 12px/1.4 "Avenir Next", sans-serif;
    }

    .reader {
      border-radius: 6px 14px 14px 6px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .reader-header {
      min-height: 84px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(155,63,36,.09), transparent 38%),
        rgba(255,255,255,.22);
    }

    .current-title {
      margin: 0;
      font-size: clamp(25px, 3vw, 40px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .current-en {
      margin: 5px 0 0;
      color: var(--muted);
      font: italic 18px/1.25 Georgia, serif;
    }

    .current-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .nav {
      display: flex;
      gap: 8px;
    }

    .nav-button {
      min-width: 44px;
      font-size: 18px;
    }

    .columns {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .92fr);
      gap: 0;
      overflow: hidden;
    }

    .column {
      min-width: 0;
      overflow: auto;
      padding: 28px clamp(22px, 3vw, 44px) 60px;
      scroll-behavior: smooth;
    }

    .column.left {
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 239, .38);
    }

    .column.right {
      background: rgba(255, 255, 255, .28);
    }

    .column-label {
      position: sticky;
      top: -28px;
      z-index: 1;
      margin: -28px 0 22px;
      padding: 16px 0 12px;
      color: var(--accent);
      background: linear-gradient(180deg, rgba(255,250,239,.97), rgba(255,250,239,.78));
      font: 750 12px/1 "Avenir Next", sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .right .column-label {
      color: var(--accent-2);
      background: linear-gradient(180deg, rgba(250,249,243,.97), rgba(250,249,243,.76));
    }

    .poem-lines {
      margin: 0 0 24px;
      font-size: var(--poem-size);
      line-height: 1.78;
      letter-spacing: 0;
    }

    .note-ref {
      font-size: .52em;
      line-height: 0;
      vertical-align: super;
      margin: 0 .04em;
      color: var(--accent);
      font-family: "Avenir Next", sans-serif;
      font-weight: 700;
    }

    .stanza-marker {
      margin: 0 0 10px;
      color: var(--muted);
      font-family: "Avenir Next", sans-serif;
      font-size: 14px;
      letter-spacing: .12em;
      font-weight: 700;
    }

    .prose {
      margin: 0 0 18px;
      font-size: var(--body-size);
      line-height: var(--body-leading);
      text-align: justify;
    }

    .right .prose, .right .poem-lines {
      font-family: Georgia, "Times New Roman", serif;
      font-size: var(--en-size);
      line-height: 1.9;
      text-align: left;
    }

    .note-title {
      margin: 26px 0 12px;
      font-size: 15px;
      color: var(--accent);
      font-family: "Avenir Next", sans-serif;
      letter-spacing: .12em;
    }

    .commentary-title {
      margin: 30px 0 12px;
      color: var(--accent-2);
      font-family: "Avenir Next", sans-serif;
      font-size: 15px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .commentary {
      margin: 0 0 14px;
      color: #4c463d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: calc(var(--en-size) - 2px);
      line-height: 1.82;
      text-align: left;
    }

    .word-popover {
      position: fixed;
      z-index: 40;
      width: min(340px, calc(100vw - 28px));
      border: 1px solid rgba(47, 93, 80, .22);
      border-radius: 8px;
      background: rgba(255, 252, 244, .98);
      box-shadow: 0 22px 58px rgba(42, 32, 19, .24);
      padding: 14px;
      color: var(--ink);
      transform: translateY(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .word-popover.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .word-popover-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .word-popover-word {
      margin: 0;
      font: 700 22px/1.15 Georgia, "Times New Roman", serif;
      color: var(--accent-2);
    }

    .word-popover-close {
      width: 32px;
      height: 32px;
      min-width: 32px;
      padding: 0;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1;
    }

    .word-popover-label {
      margin: 0 0 4px;
      color: var(--muted);
      font: 800 11px/1 "Avenir Next", sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .word-popover p {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.58;
    }

    .word-popover-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .word-popover-links a {
      border: 1px solid rgba(47, 93, 80, .25);
      border-radius: 8px;
      background: rgba(47, 93, 80, .08);
      color: var(--accent-2);
      padding: 7px 9px;
      font: 800 12px/1 "Avenir Next", sans-serif;
      text-decoration: none;
    }

    .progress {
      height: 5px;
      background: rgba(80, 61, 33, .10);
    }

    .progress-bar {
      height: 100%;
      width: 1%;
      background: linear-gradient(90deg, var(--accent), #c99045);
      transition: width .28s ease;
    }

    .compact-toggle {
      display: none;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100dvh;
        grid-template-columns: 1fr;
      }
      .sidebar {
        max-height: 42dvh;
        border-radius: 14px;
      }
      .reader {
        min-height: 72dvh;
        border-radius: 14px;
      }
      .columns {
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .column {
        overflow: visible;
      }
      .column.left {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <section class="brand">
        <div class="eyebrow">Xu Yuanchong Reader</div>
        <h1>王维诗选</h1>
        <p class="subtitle">iPad 横屏中英对照阅读 · 97 首/组</p>
      </section>
      <section class="tools" aria-label="阅读设置">
        <button class="tool" id="smaller" title="缩小字号">A−</button>
        <button class="tool" id="larger" title="放大字号">A＋</button>
      </section>
      <section class="search-wrap">
        <input class="search" id="search" type="search" placeholder="搜索诗题 / 英文题名" />
      </section>
      <nav class="list" id="list" aria-label="诗歌目录"></nav>
      <footer class="sidebar-footer">
        左右栏可独立滚动，适合 iPad Pro 横屏阅读。
      </footer>
    </aside>

    <section class="reader">
      <header class="reader-header">
        <div>
          <h2 class="current-title" id="title"></h2>
          <p class="current-en" id="enTitle"></p>
          <div class="current-meta">
            <span class="type-pill" id="poemType"></span>
            <span class="type-pill theme-pill" id="poemTheme"></span>
          </div>
        </div>
        <div class="nav">
          <button class="nav-button" id="prev" title="上一首">‹</button>
          <button class="nav-button" id="next" title="下一首">›</button>
        </div>
      </header>
      <section class="columns">
        <article class="column left" id="leftPane">
          <div class="column-label">Chinese · 原文与赏析</div>
          <div id="chinese"></div>
        </article>
        <article class="column right" id="rightPane">
          <div class="column-label">English · Xu Yuanchong</div>
          <div id="english"></div>
        </article>
      </section>
      <div class="progress"><div class="progress-bar" id="progress"></div></div>
    </section>
    <aside class="word-popover" id="wordPopover" aria-live="polite">
      <div class="word-popover-header">
        <h3 class="word-popover-word" id="wordPopoverWord"></h3>
        <button class="word-popover-close" id="wordPopoverClose" type="button" title="关闭">×</button>
      </div>
      <div>
        <p class="word-popover-label">中文释义</p>
        <p id="wordPopoverZh"></p>
        <p class="word-popover-label">English</p>
        <p id="wordPopoverEn"></p>
        <p class="word-popover-label">In This Poem</p>
        <p id="wordPopoverContext"></p>
      </div>
      <div class="word-popover-links">
        <a id="wordCambridge" target="_blank" rel="noreferrer">Cambridge</a>
        <a id="wordGoogle" target="_blank" rel="noreferrer">Google Translate</a>
        <a id="wordYoudao" target="_blank" rel="noreferrer">有道</a>
      </div>
    </aside>
  </main>

  <script>
    const poems = [{"num": "001", "zhTitle": "息夫人", "enTitle": "A Captive Lady", "chinese": "莫以今时宠，\n能忘旧日恩。\n看花\n[1]\n满眼泪，\n不共\n[2]\n楚王言。\n息夫人本是春秋时息国君主之妻，后为楚王所掳。她虽在楚生了两个孩子，但始终没有和楚王说过一句话。诗的前两句拟息夫人口吻：不要以为你今天的宠爱，就能使我忘掉旧日的恩情。突出了旧恩的珍贵难忘，显示了淫威和富贵并不能征服弱者的心灵，而所谓的新宠实际上是一种侮辱。诗的后两句则是说息夫人在富丽华美的楚宫里，看着本来使人愉悦的花朵，却是满眼泪水，对在她身边的楚王始终不共一言。这沉默越发彰显了息夫人蓄积在心底的对楚王的灭国毁家之恨。诗人塑造了一个身受屈辱，但在沉默中反抗的妇女形象。\n注释：\n[1]\n看花：此处代指富裕的享乐生活。\n[2]\n共：与，和。", "english": "Think not the royal favor of these years\nCould efface her love for the vanquished king.\nThe sight of flowers fills her eyes with tears,\nShe won’t tell the conqueror anything.", "poemType": "五言绝句", "poemTheme": "咏史怀古", "chineseHtml": "<p class=\"poem-lines\">莫以今时宠，<br>能忘旧日恩。<br>看花<sup class=\"note-ref\">[1]</sup>满眼泪，<br>不共<sup class=\"note-ref\">[2]</sup>楚王言。</p>\n<p class=\"prose\">息夫人本是春秋时息国君主之妻，后为楚王所掳。她虽在楚生了两个孩子，但始终没有和楚王说过一句话。诗的前两句拟息夫人口吻：不要以为你今天的宠爱，就能使我忘掉旧日的恩情。突出了旧恩的珍贵难忘，显示了淫威和富贵并不能征服弱者的心灵，而所谓的新宠实际上是一种侮辱。</p>\n<p class=\"prose\">诗的后两句则是说息夫人在富丽华美的楚宫里，看着本来使人愉悦的花朵，却是满眼泪水，对在她身边的楚王始终不共一言。这沉默越发彰显了息夫人蓄积在心底的对楚王的灭国毁家之恨。诗人塑造了一个身受屈辱，但在沉默中反抗的妇女形象。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 看花：此处代指富裕的享乐生活。<br>[2] 共：与，和。</p>", "englishHtml": "<p class=\"poem-lines\">Think not the royal favor of these years<br>Could efface her love for the vanquished king.<br>The sight of flowers fills her eyes with tears,<br>She won’t tell the conqueror anything.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Captive Lady,” the poem looks back at an older story or historical memory, using the past to sharpen the feeling of the present.</p>\n<p class=\"commentary\">As a five-character quatrain, it uses historical distance to make the emotion quieter but more durable. Key images such as flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "002", "zhTitle": "孟城坳", "enTitle": "The City Gate", "chinese": "[1]\n新家\n[2]\n孟城口，\n古木余衰柳。\n来者\n[3]\n复为谁？\n空悲昔人有。\n此诗是《辋川集》里的第一首。诗人新近搬到孟城口，孟城口本是初唐诗人宋之问的别墅，而如今可叹的是那里只有疏落的古木和枯萎的柳树，呈现出一片衰败凋零的景象。此时，正值李林甫擅权，张九龄罢相，王维隐退辋川。当他看到这一衰败景象时，无法抑制忧闷的心情：如今我为“昔人”而悲，以后的“来者”是否又会为我而悲呢？\n注释：\n[1]\n坳（ào）：有低洼的地方。\n[2]\n家：住到。\n[3]\n来者：以后来的人。", "english": "I’ve moved in near the city gate\nWhere withered willow trees are left.\nShould another move here too late,\nAlas!Of trees he’d be bereft.", "poemType": "五言绝句", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">新家<sup class=\"note-ref\">[2]</sup>孟城口，<br>古木余衰柳。<br>来者<sup class=\"note-ref\">[3]</sup>复为谁？<br>空悲昔人有。</p>\n<p class=\"prose\">此诗是《辋川集》里的第一首。诗人新近搬到孟城口，孟城口本是初唐诗人宋之问的别墅，而如今可叹的是那里只有疏落的古木和枯萎的柳树，呈现出一片衰败凋零的景象。此时，正值李林甫擅权，张九龄罢相，王维隐退辋川。当他看到这一衰败景象时，无法抑制忧闷的心情：如今我为“昔人”而悲，以后的“来者”是否又会为我而悲呢？</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 坳（ào）：有低洼的地方。<br>[2] 家：住到。<br>[3] 来者：以后来的人。</p>", "englishHtml": "<p class=\"poem-lines\">I’ve moved in near the city gate<br>Where withered willow trees are left.<br>Should another move here too late,<br>Alas!Of trees he’d be bereft.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The City Gate,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as trees and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "003", "zhTitle": "鹿柴", "enTitle": "The Deer Enclosure", "chinese": "[1]\n空山不见人，\n但闻人语响。\n返景\n[2]\n入深林，\n复照青苔上。\n这首诗是王维后期山水诗的代表作。王维是诗人、画家兼音乐家。这首诗正体现出诗、画、乐的结合。无声的静寂、无光的幽暗，一般人都易于觉察；但有声的静寂，有光的幽暗，则较少为人所注意。诗人正是以他画家、音乐家对色彩、声音特有的敏感，才把握住了空山人语响和返照入深林那一刹那间所显示的特有的幽静境界。而这种敏感，又是和诗人的称号“诗佛”相关，即诗人不仅在用眼睛去细致观察大自然，更在潜心去默会这个世界。\n注释：\n[1]\n鹿柴（zhài）：王维辋川别墅之一。\n[2]\n返景（yǐnɡ）：同“返影”，太阳即将落山时，通过云反射的阳光。", "english": "In pathless hills no man’s in sight,\nBut I still hear echoing sound.\nIn gloomy forest peeps no light,\nBut sunbeams slant on mossy ground.", "poemType": "五言绝句", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">空山不见人，<br>但闻人语响。<br>返景<sup class=\"note-ref\">[2]</sup>入深林，<br>复照青苔上。</p>\n<p class=\"prose\">这首诗是王维后期山水诗的代表作。王维是诗人、画家兼音乐家。这首诗正体现出诗、画、乐的结合。无声的静寂、无光的幽暗，一般人都易于觉察；但有声的静寂，有光的幽暗，则较少为人所注意。诗人正是以他画家、音乐家对色彩、声音特有的敏感，才把握住了空山人语响和返照入深林那一刹那间所显示的特有的幽静境界。</p>\n<p class=\"prose\">而这种敏感，又是和诗人的称号“诗佛”相关，即诗人不仅在用眼睛去细致观察大自然，更在潜心去默会这个世界。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 鹿柴（zhài）：王维辋川别墅之一。<br>[2] 返景（yǐnɡ）：同“返影”，太阳即将落山时，通过云反射的阳光。</p>", "englishHtml": "<p class=\"poem-lines\">In pathless hills no man’s in sight,<br>But I still hear echoing sound.<br>In gloomy forest peeps no light,<br>But sunbeams slant on mossy ground.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Deer Enclosure,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "004", "zhTitle": "栾家濑", "enTitle": "The Rapids", "chinese": "[1]\n飒飒\n[2]\n秋雨中，\n浅浅\n[3]\n石溜\n[4]\n泻。\n跳波\n[5]\n自相溅，\n白鹭惊复下。\n这首小诗描写了这样一个有趣的情景：山谷中有一浅濑，一只鹭鸶正在全神贯注地觅食，突然“飒飒秋雨”使得急流猛然与坚石相击，溅起的水珠打在鹭鸶身上，吓得它展翅惊飞。而当鹭鸶明白这是一场虚惊之后，便又安详地飞了下来，落在原处。诗人巧妙地以宁中有惊、以惊见宁的艺术手法，通过“白鹭惊复下”的一场虚惊来反衬栾家濑的安宁和静穆。在这里，没有任何潜在的威胁，可以过着无忧无虑的宁静生活，这正是此时走出政治旋涡的诗人所追求的理想境界。\n注释：\n[1]\n濑（lài）：石沙滩上水流湍急的地方。\n[2]\n飒（sà）飒：风雨的声音。\n[3]\n浅（jiān）浅：水流的声音，形容水流很急。\n[4]\n石溜（liù）：经过石头上方的急促水流。\n[5]\n跳波：跳跃的波浪。", "english": "In rustling autumn rain\nWater on pebbles dashes,\nAnd starts the egret when\nIt sprinkles into splashes.", "poemType": "五言绝句", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">飒飒<sup class=\"note-ref\">[2]</sup>秋雨中，<br>浅浅<sup class=\"note-ref\">[3]</sup>石溜<sup class=\"note-ref\">[4]</sup>泻。<br>跳波<sup class=\"note-ref\">[5]</sup>自相溅，<br>白鹭惊复下。</p>\n<p class=\"prose\">这首小诗描写了这样一个有趣的情景：山谷中有一浅濑，一只鹭鸶正在全神贯注地觅食，突然“飒飒秋雨”使得急流猛然与坚石相击，溅起的水珠打在鹭鸶身上，吓得它展翅惊飞。而当鹭鸶明白这是一场虚惊之后，便又安详地飞了下来，落在原处。诗人巧妙地以宁中有惊、以惊见宁的艺术手法，通过“白鹭惊复下”的一场虚惊来反衬栾家濑的安宁和静穆。</p>\n<p class=\"prose\">在这里，没有任何潜在的威胁，可以过着无忧无虑的宁静生活，这正是此时走出政治旋涡的诗人所追求的理想境界。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 濑（lài）：石沙滩上水流湍急的地方。<br>[2] 飒（sà）飒：风雨的声音。<br>[3] 浅（jiān）浅：水流的声音，形容水流很急。<br>[4] 石溜（liù）：经过石头上方的急促水流。<br>[5] 跳波：跳跃的波浪。</p>", "englishHtml": "<p class=\"poem-lines\">In rustling autumn rain<br>Water on pebbles dashes,<br>And starts the egret when<br>It sprinkles into splashes.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Rapids,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as water and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "005", "zhTitle": "白石滩", "enTitle": "White-Pebbled Shallows", "chinese": "清浅白石滩，\n绿蒲\n[1]\n向\n[2]\n堪\n[3]\n把。\n家住水东西，\n浣\n[4]\n纱明月下。\n白石滩是辋水边上由一片白石形成的浅滩，是著名的辋川二十景之一。王维的山水诗非常注意表现景物的光线和色彩，这首诗就是用暗示的手法写月夜的光线。月之明，水之清，蒲之绿，石之白，相映相衬，给人造成了极其鲜明的视觉感受。本诗的前两句是静态的景物描写，后两句则给白石滩添上了众多鲜活的浣纱少女形象，使得整个画面充满了生气。\n注释：\n[1]\n蒲：一种水生草本植物。\n[2]\n向：将近，差不多。\n[3]\n堪：可以，能够。\n[4]\n浣（huàn）：洗。", "english": "Water is clear and pebbles white,\nGreen reeds can be counted in moonlight.\nMaidens east and west of the streams\nAll wash their silks by the moonbeams.", "poemType": "五言绝句", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">清浅白石滩，<br>绿蒲<sup class=\"note-ref\">[1]</sup>向<sup class=\"note-ref\">[2]</sup>堪<sup class=\"note-ref\">[3]</sup>把。<br>家住水东西，<br>浣<sup class=\"note-ref\">[4]</sup>纱明月下。</p>\n<p class=\"prose\">白石滩是辋水边上由一片白石形成的浅滩，是著名的辋川二十景之一。王维的山水诗非常注意表现景物的光线和色彩，这首诗就是用暗示的手法写月夜的光线。月之明，水之清，蒲之绿，石之白，相映相衬，给人造成了极其鲜明的视觉感受。本诗的前两句是静态的景物描写，后两句则给白石滩添上了众多鲜活的浣纱少女形象，使得整个画面充满了生气。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 蒲：一种水生草本植物。<br>[2] 向：将近，差不多。<br>[3] 堪：可以，能够。<br>[4] 浣（huàn）：洗。</p>", "englishHtml": "<p class=\"poem-lines\">Water is clear and pebbles white,<br>Green reeds can be counted in moonlight.<br>Maidens east and west of the streams<br>All wash their silks by the moonbeams.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “White-Pebbled Shallows,” the poem turns a natural scene into a quiet spiritual space, where landscape and feeling become almost inseparable.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as water, moonlight, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "006", "zhTitle": "竹里馆", "enTitle": "The Bamboo Hut", "chinese": "独坐幽篁\n[1]\n里，\n弹琴复长啸\n[2]\n。\n深林人不知，\n明月来相照。\n诗中写到景物，只用六个字：“幽篁”“深林”“明月”。诗中写人物活动，也只用六个字：“独坐”“弹琴”“长啸”。表面看来，四句诗的用字造句平淡无奇，但整体看这首小诗，却妙谛自成，境界自出，蕴含着一种特殊的艺术魅力。本诗也是《辋川集》中的一首名作，它的妙处在于所显示的是一个令人自然而然为之吸引的意境，不以字句取胜，而从整体见美。它的美在神不在貌，而其神是蕴含在意境之中的。\n注释：\n[1]\n篁：竹林。\n[2]\n啸（xiào）：吹口哨，用嘴发出长而清脆的声音，是古代文人雅士常用来抒发感情的方式。", "english": "Sitting among bamboos alone,\nI play my lute and croon carefree.\nIn the deep woods where I’m unknown,\nOnly the bright moon peeps at me.", "poemType": "五言绝句", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">独坐幽篁<sup class=\"note-ref\">[1]</sup>里，<br>弹琴复长啸<sup class=\"note-ref\">[2]</sup>。<br>深林人不知，<br>明月来相照。</p>\n<p class=\"prose\">诗中写到景物，只用六个字：“幽篁”“深林”“明月”。诗中写人物活动，也只用六个字：“独坐”“弹琴”“长啸”。表面看来，四句诗的用字造句平淡无奇，但整体看这首小诗，却妙谛自成，境界自出，蕴含着一种特殊的艺术魅力。本诗也是《辋川集》中的一首名作，它的妙处在于所显示的是一个令人自然而然为之吸引的意境，不以字句取胜，而从整体见美。</p>\n<p class=\"prose\">它的美在神不在貌，而其神是蕴含在意境之中的。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 篁：竹林。<br>[2] 啸（xiào）：吹口哨，用嘴发出长而清脆的声音，是古代文人雅士常用来抒发感情的方式。</p>", "englishHtml": "<p class=\"poem-lines\">Sitting among bamboos alone,<br>I play my lute and croon carefree.<br>In the deep woods where I’m unknown,<br>Only the bright moon peeps at me.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Bamboo Hut,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as moonlight and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "007", "zhTitle": "辛夷坞", "enTitle": "The Magnolia Dale", "chinese": "[1]\n木末芙蓉花\n[2]\n，\n山中发红萼\n[3]\n。\n涧户\n[4]\n寂无人，\n纷纷开且落。\n辛夷花的花苞结在每一根枝条的最末端，形如毛笔，所以诗歌用了“木末”二字来形容。辛夷含苞待放时，很像荷花箭，花瓣和颜色也近似之，因而称为“芙蓉”。春来到人间，辛夷欣欣然地绽开神秘的蓓蕾，是那样灿烂，好似云蒸霞蔚。而有花开就有花落，这山中的红萼，点缀着寂寞的涧户，最后又纷纷扬扬地向人间撒下片片落英。这首五绝，在描绘了辛夷花给静寂的山涧带来美好、繁华的同时，又写出了人间的一种落寞。\n注释：\n[1]\n坞：中央低四周高的谷地。\n[2]\n芙蓉花：因辛夷花颜色与形态与莲花相近，莲花又名芙蓉，而辛夷花开在树梢，故以“木末芙蓉花”借指。木末：树梢。\n[3]\n萼（è）：花萼，花开时托着花瓣的部分。\n[4]\n涧户：涧口，山溪口。", "english": "The magnolia-tipped trees\nIn mountains burst in flowers.\nThe mute brook-side house sees\nThem blow and fall in showers.", "poemType": "五言绝句", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">木末芙蓉花<sup class=\"note-ref\">[2]</sup>，<br>山中发红萼<sup class=\"note-ref\">[3]</sup>。<br>涧户<sup class=\"note-ref\">[4]</sup>寂无人，<br>纷纷开且落。</p>\n<p class=\"prose\">辛夷花的花苞结在每一根枝条的最末端，形如毛笔，所以诗歌用了“木末”二字来形容。辛夷含苞待放时，很像荷花箭，花瓣和颜色也近似之，因而称为“芙蓉”。春来到人间，辛夷欣欣然地绽开神秘的蓓蕾，是那样灿烂，好似云蒸霞蔚。而有花开就有花落，这山中的红萼，点缀着寂寞的涧户，最后又纷纷扬扬地向人间撒下片片落英。</p>\n<p class=\"prose\">这首五绝，在描绘了辛夷花给静寂的山涧带来美好、繁华的同时，又写出了人间的一种落寞。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 坞：中央低四周高的谷地。<br>[2] 芙蓉花：因辛夷花颜色与形态与莲花相近，莲花又名芙蓉，而辛夷花开在树梢，故以“木末芙蓉花”借指。木末：树梢。<br>[3] 萼（è）：花萼，花开时托着花瓣的部分。<br>[4] 涧户：涧口，山溪口。</p>", "englishHtml": "<p class=\"poem-lines\">The magnolia-tipped trees<br>In mountains burst in flowers.<br>The mute brook-side house sees<br>Them blow and fall in showers.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Magnolia Dale,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, water, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "008", "zhTitle": "漆园", "enTitle": "A Petty Officer", "chinese": "古人\n[1]\n非傲吏，\n自阙\n[2]\n经世务\n[3]\n。\n偶寄\n[4]\n一微官，\n婆娑数株树。\n漆园亦是辋川二十景之一，不过本诗着眼于与漆园有关的典故而非景物。《史记》载，庄子曾为漆园吏，楚威王遣使聘他为相，庄子却说：“子亟去，无污我！”因为庄子啸傲王侯的故事，郭璞在《游仙诗》中称庄子为“漆园有傲吏”。王维反其意而用之，借古人自喻，表明自己隐居而绝无傲世之意，做个漆园吏，正好可借漆园隐逸，以“婆娑数株树”为伴，从而表明诗人隐逸恬退的生活情趣和自甘淡泊的人生态度。\n注释：\n[1]\n古人：这里指庄子。\n[2]\n阙（quē）：欠缺。\n[3]\n经世务：经国济世的能力。\n[4]\n寄：寄身于。", "english": "A petty officer could not be proud,\nHe cannot do important jobs with ease.\nRendering service like a floating cloud,\nHe brings fresh showers for the thirsting trees.", "poemType": "五言绝句", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">古人<sup class=\"note-ref\">[1]</sup>非傲吏，<br>自阙<sup class=\"note-ref\">[2]</sup>经世务<sup class=\"note-ref\">[3]</sup>。<br>偶寄<sup class=\"note-ref\">[4]</sup>一微官，<br>婆娑数株树。</p>\n<p class=\"prose\">漆园亦是辋川二十景之一，不过本诗着眼于与漆园有关的典故而非景物。《史记》载，庄子曾为漆园吏，楚威王遣使聘他为相，庄子却说：“子亟去，无污我！”因为庄子啸傲王侯的故事，郭璞在《游仙诗》中称庄子为“漆园有傲吏”。</p>\n<p class=\"prose\">王维反其意而用之，借古人自喻，表明自己隐居而绝无傲世之意，做个漆园吏，正好可借漆园隐逸，以“婆娑数株树”为伴，从而表明诗人隐逸恬退的生活情趣和自甘淡泊的人生态度。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 古人：这里指庄子。<br>[2] 阙（quē）：欠缺。<br>[3] 经世务：经国济世的能力。<br>[4] 寄：寄身于。</p>", "englishHtml": "<p class=\"poem-lines\">A petty officer could not be proud,<br>He cannot do important jobs with ease.<br>Rendering service like a floating cloud,<br>He brings fresh showers for the thirsting trees.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Petty Officer,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "009", "zhTitle": "鸟鸣涧", "enTitle": "The Dale of Singing Birds", "chinese": "人闲\n[1]\n桂花落，\n夜静春山空。\n月出惊山鸟，\n时\n[2]\n鸣春涧中。\n王维的山水诗，偏好于创造静谧的意境，而静谧体现在这首诗中却是“花落”“月出”“鸟鸣”这些动态的景物描写。这样的描述既使诗显得富有生机而不枯寂，同时又更加突出了春涧的幽静，这正是“鸟鸣山更幽”所蕴含的艺术辩证法的体现。在这春山中，万籁都陶醉在夜的色调与宁静中了，当月亮升起，给这夜幕笼罩的空谷带来皎洁银辉的时候，竟使山鸟惊觉起来。但可以想象，明亮的月光，却给幽谷夜的宁静带来了新的境界与意味。\n注释：\n[1]\n闲：安静，闲适。\n[2]\n时：偶尔。", "english": "Sweet laurel blooms fall unenjoyed;\nVague hills dissolve into night void.\nThe moonrise startles birds to sing;\nTheir twitter fills the dale with spring.", "poemType": "五言绝句", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">人闲<sup class=\"note-ref\">[1]</sup>桂花落，<br>夜静春山空。<br>月出惊山鸟，<br>时<sup class=\"note-ref\">[2]</sup>鸣春涧中。</p>\n<p class=\"prose\">王维的山水诗，偏好于创造静谧的意境，而静谧体现在这首诗中却是“花落”“月出”“鸟鸣”这些动态的景物描写。这样的描述既使诗显得富有生机而不枯寂，同时又更加突出了春涧的幽静，这正是“鸟鸣山更幽”所蕴含的艺术辩证法的体现。在这春山中，万籁都陶醉在夜的色调与宁静中了，当月亮升起，给这夜幕笼罩的空谷带来皎洁银辉的时候，竟使山鸟惊觉起来。</p>\n<p class=\"prose\">但可以想象，明亮的月光，却给幽谷夜的宁静带来了新的境界与意味。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 闲：安静，闲适。<br>[2] 时：偶尔。</p>", "englishHtml": "<p class=\"poem-lines\">Sweet laurel blooms fall unenjoyed;<br>Vague hills dissolve into night void.<br>The moonrise startles birds to sing;<br>Their twitter fills the dale with spring.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Dale of Singing Birds,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, moonlight, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "010", "zhTitle": "山中送别", "enTitle": "Parting in the Hills", "chinese": "山中相送罢，\n日暮掩\n[1]\n柴扉\n[2]\n。\n春草明年\n[3]\n绿，\n王孙\n[4]\n归不归？\n这首诗写送别友人，构思却独具匠心，其最显著的特点是并非着眼于离亭饯别的依依不舍，而以“送罢”落笔，进一步着墨于送别后回家寂寞之情更浓更稠，表达了诗中人冀望于来年春草再绿之时，能与友人团聚的情怀。“春草明年绿，王孙归不归”从《楚辞·招隐士》“王孙游兮不归，春草生兮萋萋”句化来。但原句是因游子久去而叹其不归，而本诗的这两句则在与友人分别的当天就提出，更表达了与友人情谊的深厚。\n注释：\n[1]\n掩：关闭。\n[2]\n扉：门。\n[3]\n明年：又作“年年”。\n[4]\n王孙：贵族的子孙，在此处代指朋友。", "english": "I see off the hills my compeer;\nAt dusk I close my wicket door.\nWhen grass turns green in spring next year,\nWill my friend come with spring once more?", "poemType": "五言绝句", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">山中相送罢，<br>日暮掩<sup class=\"note-ref\">[1]</sup>柴扉<sup class=\"note-ref\">[2]</sup>。<br>春草明年<sup class=\"note-ref\">[3]</sup>绿，<br>王孙<sup class=\"note-ref\">[4]</sup>归不归？</p>\n<p class=\"prose\">这首诗写送别友人，构思却独具匠心，其最显著的特点是并非着眼于离亭饯别的依依不舍，而以“送罢”落笔，进一步着墨于送别后回家寂寞之情更浓更稠，表达了诗中人冀望于来年春草再绿之时，能与友人团聚的情怀。“春草明年绿，王孙归不归”从《楚辞·招隐士》“王孙游兮不归，春草生兮萋萋”句化来。</p>\n<p class=\"prose\">但原句是因游子久去而叹其不归，而本诗的这两句则在与友人分别的当天就提出，更表达了与友人情谊的深厚。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 掩：关闭。<br>[2] 扉：门。<br>[3] 明年：又作“年年”。<br>[4] 王孙：贵族的子孙，在此处代指朋友。</p>", "englishHtml": "<p class=\"poem-lines\">I see off the hills my compeer;<br>At dusk I close my wicket door.<br>When grass turns green in spring next year,<br>Will my friend come with spring once more?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Parting in the Hills,” the poem is shaped by parting, but its emotion is held back rather than overstated.</p>\n<p class=\"commentary\">As a five-character quatrain, it keeps farewell emotion controlled, leaving much of the feeling between the lines. Key images such as mountains and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "011", "zhTitle": "杂诗", "enTitle": "Our Native Place", "chinese": "君自故乡来，\n应知故乡事。\n来日\n[1]\n绮窗\n[2]\n前，\n寒梅\n[3]\n著花\n[4]\n未？\n本诗开篇就以一种不加修饰，近似讲话的语气表达诗中人急于向故乡人了解故乡事的心情。而关于故乡事，诗中人独问的却是：“来日绮窗前，寒梅著花未？”仿佛故乡值得怀念的就是窗前那株寒梅。这窗前的寒梅可能蕴含着当年家居生活亲切有趣的情事。因此，这株寒梅就成了故乡的一种象征，被诗化和标志化了，自然也成了诗中人思乡之情的集中寄托。古代诗歌中常有这种质朴平淡而诗味浓郁的作品，它质朴到似乎不用任何技巧，实际上却包含着最高级的技巧。\n注释：\n[1]\n来日：来的时候。\n[2]\n绮窗：雕刻着花纹的窗户。\n[3]\n寒梅：冬天开放的梅花。\n[4]\n著（zhuó）花：开花。", "english": "You come from native place;\nWhat happened there you’d know.\nDid mume blossoms in face\nOf my gauze window blow?", "poemType": "五言绝句", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">君自故乡来，<br>应知故乡事。<br>来日<sup class=\"note-ref\">[1]</sup>绮窗<sup class=\"note-ref\">[2]</sup>前，<br>寒梅<sup class=\"note-ref\">[3]</sup>著花<sup class=\"note-ref\">[4]</sup>未？</p>\n<p class=\"prose\">本诗开篇就以一种不加修饰，近似讲话的语气表达诗中人急于向故乡人了解故乡事的心情。而关于故乡事，诗中人独问的却是：“来日绮窗前，寒梅著花未？”仿佛故乡值得怀念的就是窗前那株寒梅。这窗前的寒梅可能蕴含着当年家居生活亲切有趣的情事。</p>\n<p class=\"prose\">因此，这株寒梅就成了故乡的一种象征，被诗化和标志化了，自然也成了诗中人思乡之情的集中寄托。古代诗歌中常有这种质朴平淡而诗味浓郁的作品，它质朴到似乎不用任何技巧，实际上却包含着最高级的技巧。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 来日：来的时候。<br>[2] 绮窗：雕刻着花纹的窗户。<br>[3] 寒梅：冬天开放的梅花。<br>[4] 著（zhuó）花：开花。</p>", "englishHtml": "<p class=\"poem-lines\">You come from native place;<br>What happened there you’d know.<br>Did mume blossoms in face<br>Of my gauze window blow?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Our Native Place,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as flowers and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "012", "zhTitle": "相思", "enTitle": "Love Seed", "chinese": "红豆生南国，\n春来发几枝？\n愿君多采撷\n[1]\n，\n此物最相思\n[2]\n。\n本篇堪称名篇中的名篇，脍炙人口，经乐工谱曲而广为流传，是梨园弟子最爱的歌词之一。据说安史之乱后，李龟年流落江南，经常为人演唱，听者无不动容。传说古代有一位女子，因丈夫死在边塞，哭于树下而死，化为红豆，于是人们又称红豆为“相思子”。这种“相思”却不限于男女情爱，朋友之间也有相思的。此诗题一作《江上赠李龟年》，可见诗中抒写的是眷念朋友的情思。全诗句句不离红豆，“超以象外，得其圜中”，把相思之情表达得入木三分。\n注释：\n[1]\n采撷（xié）：采摘。\n[2]\n此物最相思：它最能寄托想念的情感。", "english": "The red beans grow in Southern land.\nHow many load in spring the trees?\nGather them till full is your hand;\nThey would revive fond memories.", "poemType": "五言绝句", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">红豆生南国，<br>春来发几枝？<br>愿君多采撷<sup class=\"note-ref\">[1]</sup>，<br>此物最相思<sup class=\"note-ref\">[2]</sup>。</p>\n<p class=\"prose\">本篇堪称名篇中的名篇，脍炙人口，经乐工谱曲而广为流传，是梨园弟子最爱的歌词之一。据说安史之乱后，李龟年流落江南，经常为人演唱，听者无不动容。传说古代有一位女子，因丈夫死在边塞，哭于树下而死，化为红豆，于是人们又称红豆为“相思子”。</p>\n<p class=\"prose\">这种“相思”却不限于男女情爱，朋友之间也有相思的。此诗题一作《江上赠李龟年》，可见诗中抒写的是眷念朋友的情思。全诗句句不离红豆，“超以象外，得其圜中”，把相思之情表达得入木三分。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 采撷（xié）：采摘。<br>[2] 此物最相思：它最能寄托想念的情感。</p>", "englishHtml": "<p class=\"poem-lines\">The red beans grow in Southern land.<br>How many load in spring the trees?<br>Gather them till full is your hand;<br>They would revive fond memories.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Love Seed,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Its power comes from the pressure between plain language and the feeling held beneath it.</p>"}, {"num": "013", "zhTitle": "书事", "enTitle": "Green Moss", "chinese": "轻阴\n[1]\n阁\n[2]\n小雨，\n深院昼慵\n[3]\n开。\n坐看苍苔色，\n欲上人衣来。\n这是一首即事写景之作，所以题为“书事”。小雨初歇，天色尚还微阴，仿佛是轻阴迫使小雨停止，此处用笔别有趣味。这时诗人缓步走向深院，虽已是白昼，却还懒得去开那院门。淡淡两句，通过一种疏懒的情调把读者带进一片宁静的小天地。雨后的青苔，鲜绿、清新，充满生机，竟让诗人产生一种幻觉，仿佛“欲上人衣来”。这一神来之笔，展现了诗人好静的个性，与深院小景浑然交融，创造了一个物我相生、宁静而又充满生命活力的意境。\n注释：\n[1]\n轻阴：微微的阴天。\n[2]\n阁：同“搁”，阻止，停止。\n[3]\n慵（yōnɡ）：懒得。", "english": "Light rain dissolves in gloom;\nIn closed yard shadows loom.\nSitting by mossy side,\nI feel my robe green-dyed.", "poemType": "五言绝句", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">轻阴<sup class=\"note-ref\">[1]</sup>阁<sup class=\"note-ref\">[2]</sup>小雨，<br>深院昼慵<sup class=\"note-ref\">[3]</sup>开。<br>坐看苍苔色，<br>欲上人衣来。</p>\n<p class=\"prose\">这是一首即事写景之作，所以题为“书事”。小雨初歇，天色尚还微阴，仿佛是轻阴迫使小雨停止，此处用笔别有趣味。这时诗人缓步走向深院，虽已是白昼，却还懒得去开那院门。淡淡两句，通过一种疏懒的情调把读者带进一片宁静的小天地。雨后的青苔，鲜绿、清新，充满生机，竟让诗人产生一种幻觉，仿佛“欲上人衣来”。</p>\n<p class=\"prose\">这一神来之笔，展现了诗人好静的个性，与深院小景浑然交融，创造了一个物我相生、宁静而又充满生命活力的意境。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 轻阴：微微的阴天。<br>[2] 阁：同“搁”，阻止，停止。<br>[3] 慵（yōnɡ）：懒得。</p>", "englishHtml": "<p class=\"poem-lines\">Light rain dissolves in gloom;<br>In closed yard shadows loom.<br>Sitting by mossy side,<br>I feel my robe green-dyed.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Green Moss,” the poem turns a natural scene into a quiet spiritual space, where landscape and feeling become almost inseparable.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Its power comes from the pressure between plain language and the feeling held beneath it.</p>"}, {"num": "014", "zhTitle": "山中", "enTitle": "In the Hills", "chinese": "荆溪白石出，\n天寒红叶稀。\n山路元\n[1]\n无雨，\n空翠\n[2]\n湿人衣。\n这幅由白石磷磷的小溪、鲜艳的红叶和无边的浓翠所组成的山中冬景，色泽斑斓鲜明，富于诗情画意，毫无萧瑟枯寂的情调。首句写天寒水浅，山溪变成涓涓细流，露出磷磷白石。次句写入冬天寒，红叶变得稀少，但是在一片浓翠的山色背景上仍然很是显眼。最后两句则写林荫覆盖的山路上虽然没有下雨，但是浓翠的树林所积聚的雾气也足以沾湿游人的衣衫。\n注释：\n[1]\n元：原，原来。\n[2]\n空翠：山林间翠绿的微雨。", "english": "White pebbles feel a blue stream glide;\nRed leaves are strewn on cold hillside.\nAlong the path no rain is seen,\nMy gown is moist with drizzling green.", "poemType": "五言绝句", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">荆溪白石出，<br>天寒红叶稀。<br>山路元<sup class=\"note-ref\">[1]</sup>无雨，<br>空翠<sup class=\"note-ref\">[2]</sup>湿人衣。</p>\n<p class=\"prose\">这幅由白石磷磷的小溪、鲜艳的红叶和无边的浓翠所组成的山中冬景，色泽斑斓鲜明，富于诗情画意，毫无萧瑟枯寂的情调。首句写天寒水浅，山溪变成涓涓细流，露出磷磷白石。次句写入冬天寒，红叶变得稀少，但是在一片浓翠的山色背景上仍然很是显眼。</p>\n<p class=\"prose\">最后两句则写林荫覆盖的山路上虽然没有下雨，但是浓翠的树林所积聚的雾气也足以沾湿游人的衣衫。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 元：原，原来。<br>[2] 空翠：山林间翠绿的微雨。</p>", "englishHtml": "<p class=\"poem-lines\">White pebbles feel a blue stream glide;<br>Red leaves are strewn on cold hillside.<br>Along the path no rain is seen,<br>My gown is moist with drizzling green.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “In the Hills,” the poem turns a natural scene into a quiet spiritual space, where landscape and feeling become almost inseparable.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains and water give the poem its visual texture and emotional temperature.</p>"}, {"num": "015", "zhTitle": "莲花坞", "enTitle": "The Lotus Blooms", "chinese": "[1]\n日日采莲去，\n洲\n[2]\n长多\n[3]\n暮归。\n弄\n[4]\n篙莫溅水，\n畏湿红莲衣\n[5]\n。\n这首诗是王维题友人所居的《皇甫岳云溪杂题五首》之第二首，诗歌主要咏写对荷花的喜爱，却不正面用笔。采莲人日日早出晚归，十分辛苦地采莲劳作。然而采莲人也自有他们的生活乐趣。“弄篙莫溅水，畏湿红莲衣”形象生动地展现了采莲人对莲花的珍爱与怜惜，同时也表明他们热爱生活、珍惜美好事物的情操。畏湿是担心被水溅湿的意思。\n注释：\n[1]\n坞（wù）：周围高而中间低的地方。\n[2]\n洲：水中陆地。\n[3]\n多：常常。\n[4]\n弄：这里指撑篙。\n[5]\n红莲衣：红莲花色的衣服，此处指采莲女的服装。", "english": "You go to gather lotus blooms from day to day,\nAnd often come back late for long,long is the way.\nDon’t splash when you put into water your pole,\nWater splashed on their rosy dress will spoil the whole.", "poemType": "五言绝句", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">日日采莲去，<br>洲<sup class=\"note-ref\">[2]</sup>长多<sup class=\"note-ref\">[3]</sup>暮归。<br>弄<sup class=\"note-ref\">[4]</sup>篙莫溅水，<br>畏湿红莲衣<sup class=\"note-ref\">[5]</sup>。</p>\n<p class=\"prose\">这首诗是王维题友人所居的《皇甫岳云溪杂题五首》之第二首，诗歌主要咏写对荷花的喜爱，却不正面用笔。采莲人日日早出晚归，十分辛苦地采莲劳作。然而采莲人也自有他们的生活乐趣。“弄篙莫溅水，畏湿红莲衣”形象生动地展现了采莲人对莲花的珍爱与怜惜，同时也表明他们热爱生活、珍惜美好事物的情操。</p>\n<p class=\"prose\">畏湿是担心被水溅湿的意思。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 坞（wù）：周围高而中间低的地方。<br>[2] 洲：水中陆地。<br>[3] 多：常常。<br>[4] 弄：这里指撑篙。<br>[5] 红莲衣：红莲花色的衣服，此处指采莲女的服装。</p>", "englishHtml": "<p class=\"poem-lines\">You go to gather lotus blooms from day to day,<br>And often come back late for long,long is the way.<br>Don’t splash when you put into water your pole,<br>Water splashed on their rosy dress will spoil the whole.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Lotus Blooms,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, flowers, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "016", "zhTitle": "上平田", "enTitle": "The Upland Tillers", "chinese": "[1]\n朝耕上平田，\n暮耕上平田。\n借问问津者，\n宁知沮溺\n[2]\n贤？\n这首诗是《皇甫岳云溪杂题五首》之第四首。沮溺，即长沮、桀溺。本首诗歌借用了《论语》中的典故。长沮、桀溺二人一起耕地劳作，孔子路过看见了他们，便让子路问津（渡口）。长沮、桀溺是避世的隐者，此处以二人喻皇甫岳，言世人不知其贤能。\n注释：\n[1]\n上平田：耕田。\n[2]\n沮溺：长沮、桀溺，是两位隐者的名字。", "english": "They till the upland fields by day;\nThey till the upland fields till night.\nIf you want to ask them the way,\nDo you not know they are sages bright?", "poemType": "五言绝句", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">朝耕上平田，<br>暮耕上平田。<br>借问问津者，<br>宁知沮溺<sup class=\"note-ref\">[2]</sup>贤？</p>\n<p class=\"prose\">这首诗是《皇甫岳云溪杂题五首》之第四首。沮溺，即长沮、桀溺。本首诗歌借用了《论语》中的典故。长沮、桀溺二人一起耕地劳作，孔子路过看见了他们，便让子路问津（渡口）。长沮、桀溺是避世的隐者，此处以二人喻皇甫岳，言世人不知其贤能。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 上平田：耕田。<br>[2] 沮溺：长沮、桀溺，是两位隐者的名字。</p>", "englishHtml": "<p class=\"poem-lines\">They till the upland fields by day;<br>They till the upland fields till night.<br>If you want to ask them the way,<br>Do you not know they are sages bright?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Upland Tillers,” the poem presents retreat and quiet living as a way to recover inner balance.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Its power comes from the pressure between plain language and the feeling held beneath it.</p>"}, {"num": "017", "zhTitle": "萍池", "enTitle": "The Duckweed Pool", "chinese": "春池深且广，\n会\n[1]\n待\n[2]\n轻舟回。\n靡靡\n[3]\n绿萍合，\n垂杨扫复开。\n这首诗是《皇甫岳云溪杂题五首》之第五首。一池萍水，一株垂杨，本来平淡无奇，诗人却写得何等风趣，本来是静景，却处处在动，而愈是动，愈见其静。在这里，人、舟、水、萍、杨柳、春风和谐亲近地生活在一起，王维的山水田园诗展现了人与自然的亲密和谐美，这也正是王维诗歌的一大特色。\n注释：\n[1]\n会：应当。\n[2]\n待：须。\n[3]\n靡靡：迟缓的，慢的。", "english": "The pool seems deep and wide in spring day,\nWhen the boat is on its backward way.\nGreen duckweeds part and meet with ease,\nWhen they are caressed by willow trees.", "poemType": "五言绝句", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">春池深且广，<br>会<sup class=\"note-ref\">[1]</sup>待<sup class=\"note-ref\">[2]</sup>轻舟回。<br>靡靡<sup class=\"note-ref\">[3]</sup>绿萍合，<br>垂杨扫复开。</p>\n<p class=\"prose\">这首诗是《皇甫岳云溪杂题五首》之第五首。一池萍水，一株垂杨，本来平淡无奇，诗人却写得何等风趣，本来是静景，却处处在动，而愈是动，愈见其静。在这里，人、舟、水、萍、杨柳、春风和谐亲近地生活在一起，王维的山水田园诗展现了人与自然的亲密和谐美，这也正是王维诗歌的一大特色。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 会：应当。<br>[2] 待：须。<br>[3] 靡靡：迟缓的，慢的。</p>", "englishHtml": "<p class=\"poem-lines\">The pool seems deep and wide in spring day,<br>When the boat is on its backward way.<br>Green duckweeds part and meet with ease,<br>When they are caressed by willow trees.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Duckweed Pool,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Its power comes from the pressure between plain language and the feeling held beneath it.</p>"}, {"num": "018", "zhTitle": "华子冈", "enTitle": "The Mountain Ridge", "chinese": "飞鸟去不穷，\n连山复秋色。\n上下华子冈，\n惆怅情何极！\n这首诗是王维《辋川集》中的第二首，其于无限、深邃、悠远的时空中，探寻心灵的境界。秋天的黄昏，诗人在华子冈上下徘徊，遥望悠远的天空，一群群飞鸟飞向无边的天际，群山绵延，秋叶飘落，那“鸟之飞”“叶之落”“山之延”，正是诗人的情怀，深邃而悠远，渺小而无助。", "english": "Birds on birds fly far,far away;\nHills on hills lost in autumn hue.\nGo up and down the mountain way.\nHow much will you regret and rue!", "poemType": "五言绝句", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">飞鸟去不穷，<br>连山复秋色。<br>上下华子冈，<br>惆怅情何极！</p>\n<p class=\"prose\">这首诗是王维《辋川集》中的第二首，其于无限、深邃、悠远的时空中，探寻心灵的境界。秋天的黄昏，诗人在华子冈上下徘徊，遥望悠远的天空，一群群飞鸟飞向无边的天际，群山绵延，秋叶飘落，那“鸟之飞”“叶之落”“山之延”，正是诗人的情怀，深邃而悠远，渺小而无助。</p>", "englishHtml": "<p class=\"poem-lines\">Birds on birds fly far,far away;<br>Hills on hills lost in autumn hue.<br>Go up and down the mountain way.<br>How much will you regret and rue!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Mountain Ridge,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "019", "zhTitle": "文杏馆", "enTitle": "The Literary Hall", "chinese": "文杏裁为梁，\n香茅结为宇。\n不知栋里云，\n去作人间雨。\n这是一首禅诗，诗意颇值得玩味。文杏、香茅都是名贵珍稀之物，用作“梁”“宇”等建筑材料，当然是一种超凡脱俗的理想境界，而“栋里云”化作“人间雨”，更是佛意的象征。全诗的艺术构思都是象征化的。诗中洋溢着释情佛意，却没有一句释言佛语，这即是象征的妙用。\n注释：\n[1]\n文杏：银杏，又称白果。", "english": "The beam made of apricot tree,\nThe roof made of thatch and bamboo.\nRain falls when clouds on the beam flee,\nTo welcome happy rendezvous.", "poemType": "五言绝句", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">文杏裁为梁，<br>香茅结为宇。<br>不知栋里云，<br>去作人间雨。</p>\n<p class=\"prose\">这是一首禅诗，诗意颇值得玩味。文杏、香茅都是名贵珍稀之物，用作“梁”“宇”等建筑材料，当然是一种超凡脱俗的理想境界，而“栋里云”化作“人间雨”，更是佛意的象征。全诗的艺术构思都是象征化的。诗中洋溢着释情佛意，却没有一句释言佛语，这即是象征的妙用。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 文杏：银杏，又称白果。</p>", "englishHtml": "<p class=\"poem-lines\">The beam made of apricot tree,<br>The roof made of thatch and bamboo.<br>Rain falls when clouds on the beam flee,<br>To welcome happy rendezvous.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Literary Hall,” the poem turns a natural scene into a quiet spiritual space, where landscape and feeling become almost inseparable.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "020", "zhTitle": "木兰柴", "enTitle": "The Magnolia Valley", "chinese": "秋山敛余照\n[2]\n，\n飞鸟逐前侣。\n彩翠\n[3]\n时分明，\n夕岚\n[4]\n无处所。\n这首五绝，描写了傍晚时分的天色，活画出一幅秋山暮霭鸟归图。王维在观照景物时，特别注意对景物的光与色的捕捉。秋日的山顶衔着半轮残阳，很快只留下一抹余晖。晚霞把金光涂抹在每一片树叶上，是那么闪耀而鲜亮，展露着秋日山林的斑斓与艳丽。在夕照中，倦飞的鸟儿鼓动着翠羽，鸣叫着互相追逐，遁入山林，消失在飘忽不定的傍晚山林的雾气之中。\n注释：\n[1]\n木兰：落叶乔木。\n[2]\n敛余照：收敛了落日的余晖。\n[3]\n彩翠：色彩鲜艳的翠绿的山中风光。\n[4]\n夕岚：傍晚时山林中的雾气。", "english": "Autumn hills steeped in sinking sunlight,\nBirds fly in chase of their dear mates.\nThe mountain green’s now dark now bright,\nEven vapor evaporates.", "poemType": "五言绝句", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">秋山敛余照<sup class=\"note-ref\">[2]</sup>，<br>飞鸟逐前侣。<br>彩翠<sup class=\"note-ref\">[3]</sup>时分明，<br>夕岚<sup class=\"note-ref\">[4]</sup>无处所。</p>\n<p class=\"prose\">这首五绝，描写了傍晚时分的天色，活画出一幅秋山暮霭鸟归图。王维在观照景物时，特别注意对景物的光与色的捕捉。秋日的山顶衔着半轮残阳，很快只留下一抹余晖。晚霞把金光涂抹在每一片树叶上，是那么闪耀而鲜亮，展露着秋日山林的斑斓与艳丽。</p>\n<p class=\"prose\">在夕照中，倦飞的鸟儿鼓动着翠羽，鸣叫着互相追逐，遁入山林，消失在飘忽不定的傍晚山林的雾气之中。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 木兰：落叶乔木。<br>[2] 敛余照：收敛了落日的余晖。<br>[3] 彩翠：色彩鲜艳的翠绿的山中风光。<br>[4] 夕岚：傍晚时山林中的雾气。</p>", "englishHtml": "<p class=\"poem-lines\">Autumn hills steeped in sinking sunlight,<br>Birds fly in chase of their dear mates.<br>The mountain green’s now dark now bright,<br>Even vapor evaporates.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Magnolia Valley,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "021", "zhTitle": "临湖亭", "enTitle": "The Lakeside Pavilion", "chinese": "轻舸\n[1]\n迎上客\n[2]\n，\n悠悠湖上来。\n当\n[3]\n轩\n[4]\n对樽酒，\n四面芙蓉\n[5]\n开。\n诗人正在亭子里等待迎接客人，轻舸在湖上悠然驶来。宾主围坐临湖亭开怀畅饮，窗外就是一片盛开的莲花。这是何等美妙的人生境界！诗歌将美景、鲜花、醇酒和闲情巧妙地融为一体，在自然中寄深意，于质朴中见情趣，娟秀飘逸的意境，令人陶醉。\n注释：\n[1]\n舸（ɡě）：小船。\n[2]\n上客：尊贵的客人。\n[3]\n当：对着。\n[4]\n轩：窗户。\n[5]\n芙蓉：此指荷花，即水芙蓉。", "english": "My boat goes to welcome my guest,\nSlowly we sail on the calm lake.\nWe drink north and south,east and west,\nWhere lotus blooms smile for our sake.", "poemType": "五言绝句", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">轻舸<sup class=\"note-ref\">[1]</sup>迎上客<sup class=\"note-ref\">[2]</sup>，<br>悠悠湖上来。<br>当<sup class=\"note-ref\">[3]</sup>轩<sup class=\"note-ref\">[4]</sup>对樽酒，<br>四面芙蓉<sup class=\"note-ref\">[5]</sup>开。</p>\n<p class=\"prose\">诗人正在亭子里等待迎接客人，轻舸在湖上悠然驶来。宾主围坐临湖亭开怀畅饮，窗外就是一片盛开的莲花。这是何等美妙的人生境界！诗歌将美景、鲜花、醇酒和闲情巧妙地融为一体，在自然中寄深意，于质朴中见情趣，娟秀飘逸的意境，令人陶醉。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 舸（ɡě）：小船。<br>[2] 上客：尊贵的客人。<br>[3] 当：对着。<br>[4] 轩：窗户。<br>[5] 芙蓉：此指荷花，即水芙蓉。</p>", "englishHtml": "<p class=\"poem-lines\">My boat goes to welcome my guest,<br>Slowly we sail on the calm lake.<br>We drink north and south,east and west,<br>Where lotus blooms smile for our sake.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Lakeside Pavilion,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as wine and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "022", "zhTitle": "南垞", "enTitle": "The Southern Shore", "chinese": "[1]\n轻舟南垞去，\n北垞淼难即\n[2]\n。\n隔浦\n[3]\n望人家，\n遥遥不相识。\n诗人不直面南垞之景，却去写船上所见之北垞：那里三五人家，掩映于波光林霭之间，而一水盈盈相隔，可望而不可即。写得渺漫辽远，仿佛缥缈难寻的仙山圣域。其实此地水阔山高，正如诗人所愿，心中自然块垒皆消，连诗句也疏朗广漠起来。\n注释：\n[1]\n垞（chá）：小土丘。\n[2]\n即：靠近。\n[3]\n浦：湖水。", "english": "My light boat goes to Southern shore\nAnd leaves the Northern far away.\nLooking back,I see nothing more\nThan an unknown land misty gray.", "poemType": "五言绝句", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">轻舟南垞去，<br>北垞淼难即<sup class=\"note-ref\">[2]</sup>。<br>隔浦<sup class=\"note-ref\">[3]</sup>望人家，<br>遥遥不相识。</p>\n<p class=\"prose\">诗人不直面南垞之景，却去写船上所见之北垞：那里三五人家，掩映于波光林霭之间，而一水盈盈相隔，可望而不可即。写得渺漫辽远，仿佛缥缈难寻的仙山圣域。其实此地水阔山高，正如诗人所愿，心中自然块垒皆消，连诗句也疏朗广漠起来。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 垞（chá）：小土丘。<br>[2] 即：靠近。<br>[3] 浦：湖水。</p>", "englishHtml": "<p class=\"poem-lines\">My light boat goes to Southern shore<br>And leaves the Northern far away.<br>Looking back,I see nothing more<br>Than an unknown land misty gray.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Southern Shore,” the poem turns a natural scene into a quiet spiritual space, where landscape and feeling become almost inseparable.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "023", "zhTitle": "欹湖", "enTitle": "The Slanted Lake", "chinese": "吹箫凌\n[1]\n极浦\n[2]\n，\n日暮送夫君\n[3]\n。\n湖上一回首，\n山青卷\n[4]\n白云。\n船儿载着箫声越过长长的水边，日暮了要给行人道别。行者湖上回头再看，只见青山上舒卷着白云。箫声如诉，日暮催人，湖上回首，山静云飞，无一字说及人情，而离情已深蕴其中。这里的人间聚散，似乎也被作者看成了一道赏心悦目的风景。\n注释：\n[1]\n凌：渡过，越过。\n[2]\n极浦：远处的水边。\n[3]\n夫君：作者的朋友。\n[4]\n卷：（白云）松散的样子。", "english": "She plays on flute as far as waterside\nTo see her lord off with fading twilight.\nHe turns to look back from the lake so wide,\nBut finds hill on hill green,cloud on cloud white.", "poemType": "五言绝句", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">吹箫凌<sup class=\"note-ref\">[1]</sup>极浦<sup class=\"note-ref\">[2]</sup>，<br>日暮送夫君<sup class=\"note-ref\">[3]</sup>。<br>湖上一回首，<br>山青卷<sup class=\"note-ref\">[4]</sup>白云。</p>\n<p class=\"prose\">船儿载着箫声越过长长的水边，日暮了要给行人道别。行者湖上回头再看，只见青山上舒卷着白云。箫声如诉，日暮催人，湖上回首，山静云飞，无一字说及人情，而离情已深蕴其中。这里的人间聚散，似乎也被作者看成了一道赏心悦目的风景。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 凌：渡过，越过。<br>[2] 极浦：远处的水边。<br>[3] 夫君：作者的朋友。<br>[4] 卷：（白云）松散的样子。</p>", "englishHtml": "<p class=\"poem-lines\">She plays on flute as far as waterside<br>To see her lord off with fading twilight.<br>He turns to look back from the lake so wide,<br>But finds hill on hill green,cloud on cloud white.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Slanted Lake,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a five-character quatrain, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "024", "zhTitle": "别辋川别业", "enTitle": "Leaving My Riverside Cottage", "chinese": "[1]\n依迟\n[2]\n动车马，\n惆怅出松萝。\n忍别青山去，\n其如绿水何！\n题中所提到的别业即是开元末年购得的蓝田宋之问别墅，位于辋川谷口。乾元元年（758），王维不得不回京城长安而告别辋川，诗中充满了依依不舍的浓情。诗的大意是我缓缓催动车马，离开长满松萝的山林，是那样依依不舍，内心充满了留恋的惆怅之情。就算我勉强含悲地离开青青的山林，却又怎能割舍这潺潺的绿水呢？这首小诗“语浅情深”，作者选取了“青山”“绿水”“松萝”这些典型的景物，而这些都倾注了作者全部的感情和理想，所以能够用本色语言传递真切的感受。\n注释：\n[1]\n别业：别墅。\n[2]\n依迟：不舍的样子。", "english": "How can I drive my horse which whines\nTo leave my cot with pines and vines!\nHow can I leave my mountain screen\nAnd my river emerald green!", "poemType": "五言绝句", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">依迟<sup class=\"note-ref\">[2]</sup>动车马，<br>惆怅出松萝。<br>忍别青山去，<br>其如绿水何！</p>\n<p class=\"prose\">题中所提到的别业即是开元末年购得的蓝田宋之问别墅，位于辋川谷口。乾元元年（758），王维不得不回京城长安而告别辋川，诗中充满了依依不舍的浓情。诗的大意是我缓缓催动车马，离开长满松萝的山林，是那样依依不舍，内心充满了留恋的惆怅之情。</p>\n<p class=\"prose\">就算我勉强含悲地离开青青的山林，却又怎能割舍这潺潺的绿水呢？这首小诗“语浅情深”，作者选取了“青山”“绿水”“松萝”这些典型的景物，而这些都倾注了作者全部的感情和理想，所以能够用本色语言传递真切的感受。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 别业：别墅。<br>[2] 依迟：不舍的样子。</p>", "englishHtml": "<p class=\"poem-lines\">How can I drive my horse which whines<br>To leave my cot with pines and vines!<br>How can I leave my mountain screen<br>And my river emerald green!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Leaving My Riverside Cottage,” the poem is shaped by parting, but its emotion is held back rather than overstated.</p>\n<p class=\"commentary\">As a five-character quatrain, it keeps farewell emotion controlled, leaving much of the feeling between the lines. Key images such as mountains, water, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "025", "zhTitle": "春中田园作", "enTitle": "Rural Spring", "chinese": "屋上春鸠\n[2]\n鸣，\n村边杏花白。\n持斧伐远扬\n[3]\n，\n荷锄觇\n[4]\n泉脉\n[5]\n。\n归燕识故巢，\n旧人看新历\n[6]\n。\n临觞\n[7]\n忽不御\n[8]\n，\n惆怅思远客。\n《春中田园作》是一首春天的颂歌。本诗描绘出了春天的欣欣向荣和农民的愉快欢欣，展现了唐代前期社会的安定以及人民忙碌于生产生活的精神面貌。首联写景，鸠鸣、花白，有声有色，春意盎然。颔联写农事，农民们伐远扬、觇泉脉，既紧张又兴奋。整桑理水是经冬以后最早的一种劳动，可说是农事的序幕。颈联、尾联则表达远行者对乡土的眷恋。全诗春天的气息浓重，而诗人始终没有通过常规的万紫千红来渲染春天，而是从淡淡的色调和平静的活动中成功地表现了春天的到来。\n注释：\n[1]\n春中：仲春，农历二月。\n[2]\n春鸠（jiū）：鸟名。\n[3]\n远扬：又长又高的桑树枝。\n[4]\n觇（chān）：探测。\n[5]\n泉脉：地下泉水的流向。\n[6]\n看新历：开始新的一年。\n[7]\n觞（shānɡ）：古人饮酒用的器皿。\n[8]\n御：饮，喝。", "english": "Turtledoves cooing on the height,\nWith apricots the village’s white.\nMulberries pruned far on the mountain,\nAnd water sourced near by the fountain.\nSwallows return to their old beams;\nA new almanac brings new dreams.\nCan I drink alone,cup in hand?\nI think of you in far-off land.", "poemType": "五言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">屋上春鸠<sup class=\"note-ref\">[2]</sup>鸣，<br>村边杏花白。<br>持斧伐远扬<sup class=\"note-ref\">[3]</sup>，<br>荷锄觇<sup class=\"note-ref\">[4]</sup>泉脉<sup class=\"note-ref\">[5]</sup>。<br>归燕识故巢，<br>旧人看新历<sup class=\"note-ref\">[6]</sup>。<br>临觞<sup class=\"note-ref\">[7]</sup>忽不御<sup class=\"note-ref\">[8]</sup>，<br>惆怅思远客。</p>\n<p class=\"prose\">《春中田园作》是一首春天的颂歌。本诗描绘出了春天的欣欣向荣和农民的愉快欢欣，展现了唐代前期社会的安定以及人民忙碌于生产生活的精神面貌。首联写景，鸠鸣、花白，有声有色，春意盎然。颔联写农事，农民们伐远扬、觇泉脉，既紧张又兴奋。</p>\n<p class=\"prose\">整桑理水是经冬以后最早的一种劳动，可说是农事的序幕。颈联、尾联则表达远行者对乡土的眷恋。全诗春天的气息浓重，而诗人始终没有通过常规的万紫千红来渲染春天，而是从淡淡的色调和平静的活动中成功地表现了春天的到来。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 春中：仲春，农历二月。<br>[2] 春鸠（jiū）：鸟名。<br>[3] 远扬：又长又高的桑树枝。<br>[4] 觇（chān）：探测。<br>[5] 泉脉：地下泉水的流向。<br>[6] 看新历：开始新的一年。<br>[7] 觞（shānɡ）：古人饮酒用的器皿。<br>[8] 御：饮，喝。</p>", "englishHtml": "<p class=\"poem-lines\">Turtledoves cooing on the height,<br>With apricots the village’s white.<br>Mulberries pruned far on the mountain,<br>And water sourced near by the fountain.<br>Swallows return to their old beams;<br>A new almanac brings new dreams.<br>Can I drink alone,cup in hand?<br>I think of you in far-off land.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Rural Spring,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water, flowers, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "026", "zhTitle": "新晴野望", "enTitle": "Field View After Rain", "chinese": "新晴原野旷，\n极目\n[2]\n无氛\n[3]\n垢\n[4]\n。\n郭\n[5]\n门临渡头，\n村树连溪口。\n白水明田外，\n碧峰出山后。\n农月无闲人，倾家事\n[6]\n南亩。\n诗的首联，总述雨后初晴时的感受：经过雨水的洗刷，天空蔚蓝、原野空旷，一切是那么明净新鲜，没有一点尘埃。诗人一下子就抓住了环境的特征。颔联、颈联描绘的是纵目远眺所看到的秀丽景色：田野外面，因为雨后水涨，河水泛起粼粼波光，晴日辉映，比平时显得明亮；山脊背后，一重重青翠的峰峦突兀而出，远近相衬，比平时更富于层次感。这一组风景，紧紧扣住了雨后新晴的景物特点。尾联为这幅静态画面加上了动态的人物，给原野增添了无限生机，能让人想见初夏田间活跃的情状并感受到农忙劳动的气氛。这样一笔，整个画面都活起来了。\n注释：\n[1]\n新晴：初晴。\n[2]\n极目：穷尽目力向远处眺望。\n[3]\n氛：雾气，云气。\n[4]\n垢：污秽。\n[5]\n郭：外城。\n[6]\n事：从事。", "english": "After the rain vast looks the plain;\nAs far as I see,there’s no stain.\nThe gate stands by the riverside,\nThe village trees spread far and wide.\nBeyond the fields ripples the stream;\nBehind green hills with smiles peaks beam.\nIn summer no peasant’s at leisure,\nAll farmhands are busy with pleasure.", "poemType": "五言律诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">新晴原野旷，<br>极目<sup class=\"note-ref\">[2]</sup>无氛<sup class=\"note-ref\">[3]</sup>垢<sup class=\"note-ref\">[4]</sup>。<br>郭<sup class=\"note-ref\">[5]</sup>门临渡头，<br>村树连溪口。<br>白水明田外，<br>碧峰出山后。<br>农月无闲人，倾家事<sup class=\"note-ref\">[6]</sup><br>南亩。</p>\n<p class=\"prose\">诗的首联，总述雨后初晴时的感受：经过雨水的洗刷，天空蔚蓝、原野空旷，一切是那么明净新鲜，没有一点尘埃。诗人一下子就抓住了环境的特征。颔联、颈联描绘的是纵目远眺所看到的秀丽景色：田野外面，因为雨后水涨，河水泛起粼粼波光，晴日辉映，比平时显得明亮；</p>\n<p class=\"prose\">山脊背后，一重重青翠的峰峦突兀而出，远近相衬，比平时更富于层次感。这一组风景，紧紧扣住了雨后新晴的景物特点。尾联为这幅静态画面加上了动态的人物，给原野增添了无限生机，能让人想见初夏田间活跃的情状并感受到农忙劳动的气氛。这样一笔，整个画面都活起来了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 新晴：初晴。<br>[2] 极目：穷尽目力向远处眺望。<br>[3] 氛：雾气，云气。<br>[4] 垢：污秽。<br>[5] 郭：外城。<br>[6] 事：从事。</p>", "englishHtml": "<p class=\"poem-lines\">After the rain vast looks the plain;<br>As far as I see,there’s no stain.<br>The gate stands by the riverside,<br>The village trees spread far and wide.<br>Beyond the fields ripples the stream;<br>Behind green hills with smiles peaks beam.<br>In summer no peasant’s at leisure,<br>All farmhands are busy with pleasure.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Field View After Rain,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a five-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, water, moonlight, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "027", "zhTitle": "辋川闲居赠裴秀才迪", "enTitle": "For My Outspoken Friend Pei Di in My Hermitage", "chinese": "寒山转苍翠\n[1]\n，\n秋水日潺湲\n[2]\n。\n倚杖柴门外，\n临风听暮蝉。\n渡头余\n[3]\n落日，\n墟里\n[4]\n上孤烟。\n复值接舆\n[5]\n醉，\n狂歌五柳\n[6]\n前。\n这是一首诗、画、音乐完美结合的五律。辋川在今陕西省蓝田县南终南山下，山麓有宋之问的别墅，后归王维。王维在那里住了30多年，直至晚年。诗人裴迪是王维的好友，与王维唱和较多。首联和颈联写山水原野的深秋晚景，诗人选择富有季节和时间特征的景物：苍翠的寒山、缓缓的秋水、渡口的夕阳、墟里的炊烟，有声有色，动静结合，勾勒出一幅和谐幽静而又富有生机的田园山水画。诗的颔联和尾联写诗人与裴迪的闲居之乐。倚杖柴门，临风听蝉，把诗人安逸的神态、超然物外的情致，写得栩栩如生；醉酒狂歌，则把裴迪的狂士风度表现得淋漓尽致。\n注释：\n[1]\n转苍翠：也作“积苍翠”。\n[2]\n潺湲（yuán）：流水声。此处形容水流缓慢。\n[3]\n余：也作“馀”。\n[4]\n墟里：村落，村庄。\n[5]\n接舆：陆通先生的字，在这里以接舆比裴迪。\n[6]\n五柳：代指陶渊明。", "english": "Cold mountains turn into deepening green;\nEach day the autumn stream ripples with ease.\nOut of my wicket gate on my staff I lean\nTo hear cicadas sing in evening breeze.\nThe setting sun beyond the ferry half sunk,\nThe village smoke rises lonely and straight.\nWhat joy to see my outspoken friend drunk,\nChanting to five willows before my gate!", "poemType": "五言律诗", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">寒山转苍翠<sup class=\"note-ref\">[1]</sup>，<br>秋水日潺湲<sup class=\"note-ref\">[2]</sup>。<br>倚杖柴门外，<br>临风听暮蝉。<br>渡头余<sup class=\"note-ref\">[3]</sup>落日，<br>墟里<sup class=\"note-ref\">[4]</sup>上孤烟。<br>复值接舆<sup class=\"note-ref\">[5]</sup>醉，<br>狂歌五柳<sup class=\"note-ref\">[6]</sup>前。</p>\n<p class=\"prose\">这是一首诗、画、音乐完美结合的五律。辋川在今陕西省蓝田县南终南山下，山麓有宋之问的别墅，后归王维。王维在那里住了30多年，直至晚年。诗人裴迪是王维的好友，与王维唱和较多。</p>\n<p class=\"prose\">首联和颈联写山水原野的深秋晚景，诗人选择富有季节和时间特征的景物：苍翠的寒山、缓缓的秋水、渡口的夕阳、墟里的炊烟，有声有色，动静结合，勾勒出一幅和谐幽静而又富有生机的田园山水画。诗的颔联和尾联写诗人与裴迪的闲居之乐。倚杖柴门，临风听蝉，把诗人安逸的神态、超然物外的情致，写得栩栩如生；</p>\n<p class=\"prose\">醉酒狂歌，则把裴迪的狂士风度表现得淋漓尽致。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 转苍翠：也作“积苍翠”。<br>[2] 潺湲（yuán）：流水声。此处形容水流缓慢。<br>[3] 余：也作“馀”。<br>[4] 墟里：村落，村庄。<br>[5] 接舆：陆通先生的字，在这里以接舆比裴迪。<br>[6] 五柳：代指陶渊明。</p>", "englishHtml": "<p class=\"poem-lines\">Cold mountains turn into deepening green;<br>Each day the autumn stream ripples with ease.<br>Out of my wicket gate on my staff I lean<br>To hear cicadas sing in evening breeze.<br>The setting sun beyond the ferry half sunk,<br>The village smoke rises lonely and straight.<br>What joy to see my outspoken friend drunk,<br>Chanting to five willows before my gate!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For My Outspoken Friend Pei Di in My Hermitage,” the poem uses wine and song to release feeling, turning private emotion into open, ringing expression.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, clouds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "028", "zhTitle": "酬张少府", "enTitle": "For Subprefect Zhang", "chinese": "晚年惟好静，\n万事不关心。\n自顾\n[2]\n无长策，\n空知返旧林。\n松风吹解带\n[3]\n，\n山月照弹琴。\n君问穷\n[4]\n通\n[5]\n理，\n渔歌\n[6]\n入浦深。\n《酬张少府》是诗人酬答友人的作品。题目冠以“酬”字，当是张少府先有诗相赠，王维再写此诗为酬。首联、颔联写出了诗人伟大抱负不能实现的矛盾苦闷心情。颈联写隐逸生活的情趣。尾联是即景悟情，回到题目上来，用一问一答的形式，照应了“酬”字；同时，又妙在以不答作答，可谓“韵外之致”“味外之旨”。全诗着意自述“好静”之志趣，写自己对闲适生活的快意，并表示自己对天地间的大道理有所领悟，已经能超然物外。\n注释：\n[1]\n酬：以诗词酬答。\n[2]\n自顾：自念。\n[3]\n解带：表示闲适，不拘束。\n[4]\n穷：不能当官。\n[5]\n通：能当官。\n[6]\n渔歌：隐士之歌。", "english": "I love to be tranquil while old,\nOf world affairs my mind carefree.For long I’ve nothing to withhold,\nI know but to lean on my tree.\nMy sleeves in wind caress the pine;\nI play lute and let the moon peep.\nAs to rise and fall,rain or shine,\nHear fishing songs waft far and deep!", "poemType": "五言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">晚年惟好静，<br>万事不关心。<br>自顾<sup class=\"note-ref\">[2]</sup>无长策，<br>空知返旧林。<br>松风吹解带<sup class=\"note-ref\">[3]</sup>，<br>山月照弹琴。<br>君问穷<sup class=\"note-ref\">[4]</sup>通<sup class=\"note-ref\">[5]</sup>理，<br>渔歌<sup class=\"note-ref\">[6]</sup>入浦深。</p>\n<p class=\"prose\">《酬张少府》是诗人酬答友人的作品。题目冠以“酬”字，当是张少府先有诗相赠，王维再写此诗为酬。首联、颔联写出了诗人伟大抱负不能实现的矛盾苦闷心情。颈联写隐逸生活的情趣。尾联是即景悟情，回到题目上来，用一问一答的形式，照应了“酬”字；</p>\n<p class=\"prose\">同时，又妙在以不答作答，可谓“韵外之致”“味外之旨”。全诗着意自述“好静”之志趣，写自己对闲适生活的快意，并表示自己对天地间的大道理有所领悟，已经能超然物外。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 酬：以诗词酬答。<br>[2] 自顾：自念。<br>[3] 解带：表示闲适，不拘束。<br>[4] 穷：不能当官。<br>[5] 通：能当官。<br>[6] 渔歌：隐士之歌。</p>", "englishHtml": "<p class=\"poem-lines\">I love to be tranquil while old,<br>Of world affairs my mind carefree.For long I’ve nothing to withhold,<br>I know but to lean on my tree.<br>My sleeves in wind caress the pine;<br>I play lute and let the moon peep.<br>As to rise and fall,rain or shine,<br>Hear fishing songs waft far and deep!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For Subprefect Zhang,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, moonlight, trees, and frontier scenes give the poem its visual texture and emotional temperature.</p>"}, {"num": "029", "zhTitle": "送梓州李使君", "enTitle": "Seeing Governor Li Off to Zizhou", "chinese": "万壑树参天，\n千山响杜鹃。\n山中一夜雨\n[1]\n，\n树杪\n[2]\n百重泉。\n汉女输橦布\n[3]\n，\n巴人讼芋田。\n文翁翻\n[4]\n教授，\n敢不倚先贤。\n《送梓州李使君》是诗人为送李使君入蜀赴任而创作的一首诗。赠别之作，多从眼前景物写起，即景生情，抒发惜别之意。王维此诗，立意则不在惜别，而在劝勉，因而一上来就从悬想着笔，遥写李使君赴任之地梓州的自然风光，形象逼真，气韵生动，令人神往。诗中没有一句涉及送别之时、之地、之情、之事，全篇都是描绘巴蜀的山水、风情和民事。然而读后深思，就会发觉此诗紧紧围绕李氏即将赴任的梓州步步展开，层层深入，全诗融注着诗人对李氏欣羡、期望、劝勉的一腔真情，前后融会贯通，结构谨严缜密。全诗没有一般送别诗的感伤气氛，情绪积极开朗，格调高远明快，是唐诗中写送别的名篇之一。\n注释：\n[1]\n一夜雨：也作“一半雨”。\n[2]\n树杪（miǎo）：树梢。\n[3]\n橦（tónɡ）布：梓州特产，由橦木花织成的布。\n[4]\n翻：通“反”，转变成。", "english": "The trees in your valley scrape the sky,\nYou’ll hear in your hills cuckoos cry.\nIf it rained at night in your mountain,\nYou’d see your tree tips hang like fountain.\nYour women weave to make a suit,\nYou’d try to solve people’s dispute.\nThe sage before you opened schools,\nLike him you should carry out rules.", "poemType": "五言律诗", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">万壑树参天，<br>千山响杜鹃。<br>山中一夜雨<sup class=\"note-ref\">[1]</sup>，<br>树杪<sup class=\"note-ref\">[2]</sup>百重泉。<br>汉女输橦布<sup class=\"note-ref\">[3]</sup>，<br>巴人讼芋田。<br>文翁翻<sup class=\"note-ref\">[4]</sup>教授，<br>敢不倚先贤。</p>\n<p class=\"prose\">《送梓州李使君》是诗人为送李使君入蜀赴任而创作的一首诗。赠别之作，多从眼前景物写起，即景生情，抒发惜别之意。王维此诗，立意则不在惜别，而在劝勉，因而一上来就从悬想着笔，遥写李使君赴任之地梓州的自然风光，形象逼真，气韵生动，令人神往。</p>\n<p class=\"prose\">诗中没有一句涉及送别之时、之地、之情、之事，全篇都是描绘巴蜀的山水、风情和民事。然而读后深思，就会发觉此诗紧紧围绕李氏即将赴任的梓州步步展开，层层深入，全诗融注着诗人对李氏欣羡、期望、劝勉的一腔真情，前后融会贯通，结构谨严缜密。</p>\n<p class=\"prose\">全诗没有一般送别诗的感伤气氛，情绪积极开朗，格调高远明快，是唐诗中写送别的名篇之一。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 一夜雨：也作“一半雨”。<br>[2] 树杪（miǎo）：树梢。<br>[3] 橦（tónɡ）布：梓州特产，由橦木花织成的布。<br>[4] 翻：通“反”，转变成。</p>", "englishHtml": "<p class=\"poem-lines\">The trees in your valley scrape the sky,<br>You’ll hear in your hills cuckoos cry.<br>If it rained at night in your mountain,<br>You’d see your tree tips hang like fountain.<br>Your women weave to make a suit,<br>You’d try to solve people’s dispute.<br>The sage before you opened schools,<br>Like him you should carry out rules.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Seeing Governor Li Off to Zizhou,” the poem is shaped by parting, but its emotion is held back rather than overstated.</p>\n<p class=\"commentary\">As a five-character regulated verse, it keeps farewell emotion controlled, leaving much of the feeling between the lines. Key images such as mountains, water, flowers, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "030", "zhTitle": "过香积寺", "enTitle": "The Temple of Incense", "chinese": "不知香积寺，\n数里入云峰。\n古木无人径，\n深山何处钟？\n泉声咽\n[2]\n危\n[3]\n石，\n日色冷\n[4]\n青松。\n薄暮空潭曲\n[5]\n，\n安禅\n[6]\n制毒龙\n[7]\n。\n诗题《过香积寺》的“过”，意为“访问、探望”。诗意在写山寺，但并不正面描摹，而侧写周围景物，来烘托映衬山寺之幽胜。全诗不写寺院，而寺院已在其中。最后看到深潭已空，想到佛经中所说的其性暴烈的毒龙已经制服，喻指只有克服邪念妄想，才能悟到禅理的高深，领略宁静之幽趣。这首诗构思奇妙、炼字精巧，颈联“泉声咽危石，日色冷青松”，历来被誉为炼字典范。“咽”字形容水声之细，“冷”字形容环境之幽，极具感情色彩。诗人用“冷”来形容日色，粗看极谬，仔细玩味，这个“冷”字实在太妙。夕阳西下，昏黄的余晖涂抹在一片幽深的松林上，这情状似曾相识，不可谓不“冷”。\n注释：\n[1]\n过：到访。\n[2]\n咽：发出呜咽的声音。\n[3]\n危：高耸的。\n[4]\n冷：为……所冷。\n[5]\n曲：水边。\n[6]\n安禅：此处指佛家思想。\n[7]\n毒龙：此处指人的邪念妄想。", "english": "Where is the temple?I don’t know.\nMiles up to Cloudy Peak I go.\nThere’s pathless forest in the dell,\nWhere deep in mountain rings the bell?\nThe rockside fountain seems to freeze;\nSunlight can’t warm up green pine trees.\nI sit in twilight by the pool,\nTo curb my desire I’d be cool.", "poemType": "五言律诗", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">不知香积寺，<br>数里入云峰。<br>古木无人径，<br>深山何处钟？<br>泉声咽<sup class=\"note-ref\">[2]</sup>危<sup class=\"note-ref\">[3]</sup>石，<br>日色冷<sup class=\"note-ref\">[4]</sup>青松。<br>薄暮空潭曲<sup class=\"note-ref\">[5]</sup>，<br>安禅<sup class=\"note-ref\">[6]</sup>制毒龙<sup class=\"note-ref\">[7]</sup>。</p>\n<p class=\"prose\">诗题《过香积寺》的“过”，意为“访问、探望”。诗意在写山寺，但并不正面描摹，而侧写周围景物，来烘托映衬山寺之幽胜。全诗不写寺院，而寺院已在其中。最后看到深潭已空，想到佛经中所说的其性暴烈的毒龙已经制服，喻指只有克服邪念妄想，才能悟到禅理的高深，领略宁静之幽趣。</p>\n<p class=\"prose\">这首诗构思奇妙、炼字精巧，颈联“泉声咽危石，日色冷青松”，历来被誉为炼字典范。“咽”字形容水声之细，“冷”字形容环境之幽，极具感情色彩。诗人用“冷”来形容日色，粗看极谬，仔细玩味，这个“冷”字实在太妙。夕阳西下，昏黄的余晖涂抹在一片幽深的松林上，这情状似曾相识，不可谓不“冷”。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 过：到访。<br>[2] 咽：发出呜咽的声音。<br>[3] 危：高耸的。<br>[4] 冷：为……所冷。<br>[5] 曲：水边。<br>[6] 安禅：此处指佛家思想。<br>[7] 毒龙：此处指人的邪念妄想。</p>", "englishHtml": "<p class=\"poem-lines\">Where is the temple?I don’t know.<br>Miles up to Cloudy Peak I go.<br>There’s pathless forest in the dell,<br>Where deep in mountain rings the bell?<br>The rockside fountain seems to freeze;<br>Sunlight can’t warm up green pine trees.<br>I sit in twilight by the pool,<br>To curb my desire I’d be cool.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Temple of Incense,” the poem begins from a visible object or scene and lets precise observation suggest a larger mood.</p>\n<p class=\"commentary\">As a five-character regulated verse, it fits Wang Wei&#x27;s gift for making landscape feel meditative and exact. Key images such as mountains, water, clouds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "031", "zhTitle": "山居秋暝", "enTitle": "Autumn Evening in the Mountains", "chinese": "[1]\n空山新\n[2]\n雨后，\n天气晚来秋。\n明月松间照，\n清泉石上流。\n竹喧\n[3]\n归浣女，\n莲动下渔舟。\n随意\n[4]\n春芳歇\n[5]\n，\n王孙\n[6]\n自可留。\n《山居秋暝》是王维的山水名篇，于诗情画意之中寄托着诗人高洁的情怀和对理想境界的追求。本诗的重要艺术手法是以自然美来表现诗人的人格美和一种理想中的社会之美。全诗将空山雨后的秋凉、松间明月的光照、石上清泉的声音以及浣女归来竹林中的喧笑声，渔船穿过荷花的动态，和谐完美地融合在一起，给人一种丰富新鲜的感受。本诗像一幅清新秀丽的山水画，又像一支恬静优美的抒情乐曲，体现了王维“诗中有画”的创作特点。\n注释：\n[1]\n暝（míng）：日落时分。\n[2]\n新：刚刚。\n[3]\n喧：喧哗，此处指竹叶发出声响。\n[4]\n随意：任凭。\n[5]\n歇：消失，消歇。\n[6]\n王孙：此处泛指隐居的人。", "english": "After fresh rain in mountains bare\nAutumn permeates evening air.\nAmong pine-trees bright moonbeams peer;\nO’er crystal stones flows water clear.\nBamboos whisper of washer-maids;\nLotus stirs when fishing boat wades.\nThough fragrant spring may pass away,\nStill here’s the place for you to stay.", "poemType": "五言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">空山新<sup class=\"note-ref\">[2]</sup>雨后，<br>天气晚来秋。<br>明月松间照，<br>清泉石上流。<br>竹喧<sup class=\"note-ref\">[3]</sup>归浣女，<br>莲动下渔舟。<br>随意<sup class=\"note-ref\">[4]</sup>春芳歇<sup class=\"note-ref\">[5]</sup>，<br>王孙<sup class=\"note-ref\">[6]</sup>自可留。</p>\n<p class=\"prose\">《山居秋暝》是王维的山水名篇，于诗情画意之中寄托着诗人高洁的情怀和对理想境界的追求。本诗的重要艺术手法是以自然美来表现诗人的人格美和一种理想中的社会之美。全诗将空山雨后的秋凉、松间明月的光照、石上清泉的声音以及浣女归来竹林中的喧笑声，渔船穿过荷花的动态，和谐完美地融合在一起，给人一种丰富新鲜的感受。</p>\n<p class=\"prose\">本诗像一幅清新秀丽的山水画，又像一支恬静优美的抒情乐曲，体现了王维“诗中有画”的创作特点。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 暝（míng）：日落时分。<br>[2] 新：刚刚。<br>[3] 喧：喧哗，此处指竹叶发出声响。<br>[4] 随意：任凭。<br>[5] 歇：消失，消歇。<br>[6] 王孙：此处泛指隐居的人。</p>", "englishHtml": "<p class=\"poem-lines\">After fresh rain in mountains bare<br>Autumn permeates evening air.<br>Among pine-trees bright moonbeams peer;<br>O’er crystal stones flows water clear.<br>Bamboos whisper of washer-maids;<br>Lotus stirs when fishing boat wades.<br>Though fragrant spring may pass away,<br>Still here’s the place for you to stay.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Autumn Evening in the Mountains,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, moonlight, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "032", "zhTitle": "终南别业", "enTitle": "My Hermitage in Southern Mountain", "chinese": "中岁\n[1]\n颇好道\n[2]\n，\n晚家\n[3]\n南山陲\n[4]\n。\n兴来每独往，\n胜事空自知。\n行到水穷处，\n坐看云起时。\n偶然值\n[5]\n林叟\n[6]\n，\n谈笑无还期。\n这首《终南别业》是王维山水田园诗的代表作。诗人把退隐后自得其乐的闲适情趣写得有声有色，惟妙惟肖。“行到水穷处，坐看云起时”是流传千古的名句。诗人兴致来了就独自信步漫游，走到水的尽头，坐看行云变幻，这生动地刻画了一位隐者的形象，如见其人。同山间老人谈谈笑笑，把回家的时间也忘了，十分自由惬意，这是诗人捕捉到了典型环境中的典型事例，突出地表现了退隐者豁达的性格。诗语平白如话，却极具功力，诗味、理趣二者兼备。\n注释：\n[1]\n中岁：中年。\n[2]\n道：此处指佛教。\n[3]\n家：安家。\n[4]\n陲（chuí）：边缘，此处指南山脚。\n[5]\n值：碰到。\n[6]\n叟（sǒu）：老翁。", "english": "Following divine law after my middle age,\nI live in Southern Mountain at my hermitage.\nIn joyful mood to wander,alone I would go\nTo find delightful scenes nobody else could know.\nI’d go as far as the end of a stream or fountain\nAnd sit and gaze on cloud rising over the mountain.\nIf I happen to meet with an old forest man,\nWe’d chat and laugh endlessly,as long as we can.", "poemType": "五言律诗", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">中岁<sup class=\"note-ref\">[1]</sup>颇好道<sup class=\"note-ref\">[2]</sup>，<br>晚家<sup class=\"note-ref\">[3]</sup>南山陲<sup class=\"note-ref\">[4]</sup>。<br>兴来每独往，<br>胜事空自知。<br>行到水穷处，<br>坐看云起时。<br>偶然值<sup class=\"note-ref\">[5]</sup>林叟<sup class=\"note-ref\">[6]</sup>，<br>谈笑无还期。</p>\n<p class=\"prose\">这首《终南别业》是王维山水田园诗的代表作。诗人把退隐后自得其乐的闲适情趣写得有声有色，惟妙惟肖。“行到水穷处，坐看云起时”是流传千古的名句。诗人兴致来了就独自信步漫游，走到水的尽头，坐看行云变幻，这生动地刻画了一位隐者的形象，如见其人。</p>\n<p class=\"prose\">同山间老人谈谈笑笑，把回家的时间也忘了，十分自由惬意，这是诗人捕捉到了典型环境中的典型事例，突出地表现了退隐者豁达的性格。诗语平白如话，却极具功力，诗味、理趣二者兼备。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 中岁：中年。<br>[2] 道：此处指佛教。<br>[3] 家：安家。<br>[4] 陲（chuí）：边缘，此处指南山脚。<br>[5] 值：碰到。<br>[6] 叟（sǒu）：老翁。</p>", "englishHtml": "<p class=\"poem-lines\">Following divine law after my middle age,<br>I live in Southern Mountain at my hermitage.<br>In joyful mood to wander,alone I would go<br>To find delightful scenes nobody else could know.<br>I’d go as far as the end of a stream or fountain<br>And sit and gaze on cloud rising over the mountain.<br>If I happen to meet with an old forest man,<br>We’d chat and laugh endlessly,as long as we can.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “My Hermitage in Southern Mountain,” the poem is shaped by parting, but its emotion is held back rather than overstated.</p>\n<p class=\"commentary\">As a five-character regulated verse, it keeps farewell emotion controlled, leaving much of the feeling between the lines. Key images such as mountains, water, clouds, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "033", "zhTitle": "归嵩山作", "enTitle": "Coming Back to Mount Song", "chinese": "清川\n[1]\n带\n[2]\n长薄\n[3]\n，\n车马去闲闲。\n流水如有意，\n暮禽相与还。\n荒城临古渡，\n落日满秋山。\n迢递\n[4]\n嵩高下，\n归来且\n[5]\n闭关。\n清人沈德潜于《唐诗别裁集》评此诗说：“写人情物性，每在有意无意间。”可谓十分妥帖。诗人通过描写辞官归隐嵩山途中所见的景色，抒发了恬静淡泊的闲适心情。首联写归隐出发时的情景。嵩山，古称“中岳”，在今河南省西部。颔联写水写鸟，其实乃托物寄情，写自己归山悠然自得之情，如流水归隐之心不改，如禽鸟至暮知还。颈联写荒城古渡、落日秋山，是寓情于景，反映诗人感情上的波折变化。尾联写山之高，点明作者的归隐地点和归隐宗旨。全诗质朴清新，自然天成，尤其是中间两联，移情于物，寄情于景，意象疏朗，感情浓郁。诗人随意写来，不见斧凿之迹，却得精巧蕴藉之妙。\n注释：\n[1]\n川：河流。\n[2]\n带：环绕。\n[3]\n薄：草木丛生的地方。\n[4]\n递：遥远。\n[5]\n且：将要。", "english": "A clear stream flows along a prairie green;\nA cab and horse goes not in haste between.\nThe running water welcomes fallen bloom;\nTogether birds fly back in evening gloom.\nAn age-old ferry leads to dreary town,\nThe mountain dyed in sunset up and down.\nIts range extends east to west,far away;\nBehind closed door a hermit here would stay.", "poemType": "五言律诗", "poemTheme": "思乡羁旅", "chineseHtml": "<p class=\"poem-lines\">清川<sup class=\"note-ref\">[1]</sup>带<sup class=\"note-ref\">[2]</sup>长薄<sup class=\"note-ref\">[3]</sup>，<br>车马去闲闲。<br>流水如有意，<br>暮禽相与还。<br>荒城临古渡，<br>落日满秋山。<br>迢递<sup class=\"note-ref\">[4]</sup>嵩高下，<br>归来且<sup class=\"note-ref\">[5]</sup>闭关。</p>\n<p class=\"prose\">清人沈德潜于《唐诗别裁集》评此诗说：“写人情物性，每在有意无意间。”可谓十分妥帖。诗人通过描写辞官归隐嵩山途中所见的景色，抒发了恬静淡泊的闲适心情。首联写归隐出发时的情景。嵩山，古称“中岳”，在今河南省西部。颔联写水写鸟，其实乃托物寄情，写自己归山悠然自得之情，如流水归隐之心不改，如禽鸟至暮知还。</p>\n<p class=\"prose\">颈联写荒城古渡、落日秋山，是寓情于景，反映诗人感情上的波折变化。尾联写山之高，点明作者的归隐地点和归隐宗旨。全诗质朴清新，自然天成，尤其是中间两联，移情于物，寄情于景，意象疏朗，感情浓郁。诗人随意写来，不见斧凿之迹，却得精巧蕴藉之妙。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1] 川：河流。<br>[2] 带：环绕。<br>[3] 薄：草木丛生的地方。<br>[4] 递：遥远。<br>[5] 且：将要。</p>", "englishHtml": "<p class=\"poem-lines\">A clear stream flows along a prairie green;<br>A cab and horse goes not in haste between.<br>The running water welcomes fallen bloom;<br>Together birds fly back in evening gloom.<br>An age-old ferry leads to dreary town,<br>The mountain dyed in sunset up and down.<br>Its range extends east to west,far away;<br>Behind closed door a hermit here would stay.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Coming Back to Mount Song,” the poem speaks from travel or separation, using a small scene to open a strong sense of homesickness.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Wang Wei&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as mountains, water, frontier scenes, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "034", "zhTitle": "终南山", "enTitle": "Mount Eternal South", "chinese": "太乙\n[1]\n近天都，\n连山到海隅\n[2]\n。\n白云回望合，\n青霭\n[3]\n入看无。\n分野中峰变，\n阴晴众壑殊\n[4]\n。\n欲投人处宿，\n隔水问樵夫。\n首联写远景，用夸张手法勾画了终南山的总轮廓。颔联写近景，诗人走出茫茫云海，前面是蒙蒙青霭，仿佛可以触摸到，然而走进去，不但摸不着，也看不见了，可谓可望而不可即。颈联高度概括，尺幅万里。诗人站在终南山的最高峰上四面遥望，看到了终南山地域广大，占据了几个分野，山谷中沟壑纵横，以致向阳的山谷和背阴的山谷阴晴各不相同，足见终南山地域之广大。尾联“欲投人处宿，隔水问樵夫”，则山之辽阔荒远可知，意蕴深厚，令人回味无穷。\n注释：\n[1]\n太乙：即终南山。\n[2]\n海隅（yú）：海边。终南山并不到海，此为夸张之词。\n[3]\n霭（ǎi）：云气。\n[4]\n分野中峰变，阴晴众壑殊：形容终南山占地极广，使得中峰两侧的分野都变了，各个山谷的天气也阴晴各自不同。", "english": "The highest peak scrapes the blue sky;\nIt extends from hills to the sea.\nWhen I look back,clouds veil the eye;\nWhen I come near,I see mist flee.\nPeaks change color from left to right,\nVales differ in shade or sunbeam.\nSeeking a place to pass the night,\nI ask a woodman across the stream.", "poemType": "五言律诗", "poemTheme": "隐逸闲适",
