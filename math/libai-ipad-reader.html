\"prose\">There is no place that oftener breaks the heart<br>Than the Pavilion seeing people part.<br>The wind of early spring knows parting grieves,<br>It will not green the roadside willow leaves.[2]</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Nanjing.<br>[2]The Chinese had the custom of breaking off a green willow branch by the roadside and presenting it to the departing friend.The last line implies that the wind of early spring is unwilling to let friends sever.</p>"}, {"num": "064", "zhTitle": "丁都护歌", "enTitle": "Song of the Tow-men", "chinese": "云阳[2]上征[3]去，\n两岸饶商贾[4]。\n吴牛[5]喘月时，\n拖船一何苦！\n水浊不可饮，\n壶浆半成土。\n一唱都护歌，\n心摧泪如雨。\n万人凿磐石，\n无由达江浒[6]。\n君看石芒砀[7]，\n掩泪悲千古！\n这是李白的《伏尔加河纤夫》。所用旧题本身就是凄切哀苦的。暑热时节，纤夫们拖船运石，穿着褴褛的衣衫，饮着浑浊的水，走过两岸富商云集繁华的河。不知何处传来《都护歌》，或许只是乐坊或茶楼酒肆的客人听腻了情歌艳曲，然而在纤夫们听来，不由得催人肺腑，泪如雨下。强烈的反差，深沉的笔触，表现了诗人对劳动人民的苦难命运的深切同情。\n注释：\n[1]丁督护歌：一名“阿督护”，乐府旧题。\n[2]云阳：今江苏丹阳。\n[3]上征：指往北行舟。\n[4]饶商贾（ɡǔ）：商人很多，指商业兴隆；贾，商人。\n[5]吴牛：江淮间水牛。典故出自刘义庆《世说新语》：“臣犹吴牛，见月而喘。”刘孝标注：“今之水牛，唯生江淮间，故谓之吴牛也。南土多暑，而牛畏热，见月疑是日，所以见月则喘。”\n[6]江浒（hǔ）：江边。浒，水边。\n[7]石芒砀（dànɡ）：形容又多又大的石头。芒砀，大而多貌。", "english": "They tow a boat and upstream wade\nBetween two shores alive with trade.\nUnder the heat pants buffalo.\nO think what pain it is to tow!\nThe water’s muddy and can not\nBe drunk:thick silt fills half the pot.\nWhen tow-men sing their song’s refrain,\nWith broken heart,tears fall like rain.\nTen thousand quarry-men would groan\nTo haul to riverside rough stone.\nIf rocky mountains could have ears,\nWould they not melt into sad tears?", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">云阳[2]上征[3]去，<br>两岸饶商贾[4]。<br>吴牛[5]喘月时，<br>拖船一何苦！<br>水浊不可饮，<br>壶浆半成土。<br>一唱都护歌，<br>心摧泪如雨。<br>万人凿磐石，<br>无由达江浒[6]。<br>君看石芒砀[7]，<br>掩泪悲千古！</p>\n<p class=\"prose\">这是李白的《伏尔加河纤夫》。所用旧题本身就是凄切哀苦的。暑热时节，纤夫们拖船运石，穿着褴褛的衣衫，饮着浑浊的水，走过两岸富商云集繁华的河。不知何处传来《都护歌》，或许只是乐坊或茶楼酒肆的客人听腻了情歌艳曲，然而在纤夫们听来，不由得催人肺腑，泪如雨下。</p>\n<p class=\"prose\">强烈的反差，深沉的笔触，表现了诗人对劳动人民的苦难命运的深切同情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]丁督护歌：一名“阿督护”，乐府旧题。<br>[2]云阳：今江苏丹阳。<br>[3]上征：指往北行舟。<br>[4]饶商贾（ɡǔ）：商人很多，指商业兴隆；贾，商人。<br>[5]吴牛：江淮间水牛。典故出自刘义庆《世说新语》：“臣犹吴牛，见月而喘。”刘孝标注：“今之水牛，唯生江淮间，故谓之吴牛也。南土多暑，而牛畏热，见月疑是日，所以见月则喘。”<br>[6]江浒（hǔ）：江边。浒，水边。<br>[7]石芒砀（dànɡ）：形容又多又大的石头。芒砀，大而多貌。</p>", "englishHtml": "<p class=\"prose\">They tow a boat and upstream wade<br>Between two shores alive with trade.<br>Under the heat pants buffalo.<br>O think what pain it is to tow!<br>The water’s muddy and can not<br>Be drunk:thick silt fills half the pot.<br>When tow-men sing their song’s refrain,<br>With broken heart,tears fall like rain.<br>Ten thousand quarry-men would groan<br>To haul to riverside rough stone.<br>If rocky mountains could have ears,<br>Would they not melt into sad tears?</p>"}, {"num": "065", "zhTitle": "苏台览古", "enTitle": "The Ruin of the Gusu Palace", "chinese": "旧苑荒台杨柳新，\n菱歌[2]清唱[3]不胜春。\n只今惟有西江月，\n曾照吴王宫里人[4]。\n公元742年，李白游姑苏台时作此诗。昔日的雕梁画栋，昔日的舞榭歌台，如今都已经荒废。莎翁的十四行诗中有一句最脍炙人口：“荒芜的歌场，曾是鸟儿啁啾的地方”，与此诗可谓异曲同工，极为传神地传达繁华尽逝后的萧瑟与荒凉。见证过这里繁花似锦的，如今只剩一轮明月，依旧照着断壁残垣。此诗既是作者对时过境迁、世事难料的感慨，也是对历史的喟叹。\n注释：\n[1]苏台：即姑苏台，其旧址在今江苏省苏州市西南姑苏山上。\n[2]菱歌：东南水乡老百姓采菱时唱的民歌。\n[3]清唱：形容歌声婉转清亮。\n[4]吴王宫里人：指吴王夫差宫廷里的嫔妃。", "english": "Deserted garden,crumbling terrace,willows green,\nSweet notes of Lotus Song cannot revive old spring.\nAll are gone but the moon o’er West River that’s seen\nThe ladies fair who won the favor of the king.\n注释：\n[1]The Gusu Palace in present-day Suzhou is where the king of Wu with his beautiful Xi Shi held perpetual revelries till the king of Yue annihilated him in the fifth century B.C.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">旧苑荒台杨柳新，<br>菱歌[2]清唱[3]不胜春。<br>只今惟有西江月，<br>曾照吴王宫里人[4]。</p>\n<p class=\"prose\">公元742年，李白游姑苏台时作此诗。昔日的雕梁画栋，昔日的舞榭歌台，如今都已经荒废。莎翁的十四行诗中有一句最脍炙人口：“荒芜的歌场，曾是鸟儿啁啾的地方”，与此诗可谓异曲同工，极为传神地传达繁华尽逝后的萧瑟与荒凉。见证过这里繁花似锦的，如今只剩一轮明月，依旧照着断壁残垣。</p>\n<p class=\"prose\">此诗既是作者对时过境迁、世事难料的感慨，也是对历史的喟叹。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]苏台：即姑苏台，其旧址在今江苏省苏州市西南姑苏山上。<br>[2]菱歌：东南水乡老百姓采菱时唱的民歌。<br>[3]清唱：形容歌声婉转清亮。<br>[4]吴王宫里人：指吴王夫差宫廷里的嫔妃。</p>", "englishHtml": "<p class=\"prose\">Deserted garden,crumbling terrace,willows green,<br>Sweet notes of Lotus Song cannot revive old spring.<br>All are gone but the moon o’er West River that’s seen<br>The ladies fair who won the favor of the king.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The Gusu Palace in present-day Suzhou is where the king of Wu with his beautiful Xi Shi held perpetual revelries till the king of Yue annihilated him in the fifth century B.C.</p>"}, {"num": "066", "zhTitle": "越中览古", "enTitle": "The Ruin of the Capital of Yue", "chinese": "越王勾践破吴[2]归，\n义士还家尽锦衣。\n官女如花满春殿[3]，\n只今惟有鹧鸪[4]飞。\n唐代的越州在今天的浙江绍兴，是越王勾践建都的地方。公元前472年，越王勾践灭了吴王夫差，胜利归来，战士个个脱下盔甲，穿上锦衣，宫中美女个个如花似玉。这首诗和《苏台览古》不同，《苏台览古》两联都是兴衰对比，这首却是前三句写景，最后一句才写鹧鸪飞的荒凉景象。前面写乐景越有力，后面写哀景就一句顶三句了。\n注释：\n[1]越中：指会稽，春秋时代越国曾建都于此。故址在今浙江省绍兴市。\n[2]勾践破吴：此处指越王勾践卧薪尝胆终破吴国的故事。\n[3]春殿：宫殿。\n[4]鹧鸪：鸟名。形似母鸡，头如鹑，胸有白圆点如珍珠，背毛有紫赤浪纹，叫声凄厉。", "english": "The king of Yue[1]returned,having destroyed the foe,\nHis loyal men came home,with silken dress aglow,\nHis palace thronged with flower-like ladies fair;\nNow we see but a frock of partridges flying there.\n注释：\n[1]The king of Yue destroyed the kingdom of Wu in the 5th century B.C.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">越王勾践破吴[2]归，<br>义士还家尽锦衣。<br>官女如花满春殿[3]，<br>只今惟有鹧鸪[4]飞。</p>\n<p class=\"prose\">唐代的越州在今天的浙江绍兴，是越王勾践建都的地方。公元前472年，越王勾践灭了吴王夫差，胜利归来，战士个个脱下盔甲，穿上锦衣，宫中美女个个如花似玉。这首诗和《苏台览古》不同，《苏台览古》两联都是兴衰对比，这首却是前三句写景，最后一句才写鹧鸪飞的荒凉景象。前面写乐景越有力，后面写哀景就一句顶三句了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]越中：指会稽，春秋时代越国曾建都于此。故址在今浙江省绍兴市。<br>[2]勾践破吴：此处指越王勾践卧薪尝胆终破吴国的故事。<br>[3]春殿：宫殿。<br>[4]鹧鸪：鸟名。形似母鸡，头如鹑，胸有白圆点如珍珠，背毛有紫赤浪纹，叫声凄厉。</p>", "englishHtml": "<p class=\"prose\">The king of Yue[1]returned,having destroyed the foe,<br>His loyal men came home,with silken dress aglow,<br>His palace thronged with flower-like ladies fair;<br>Now we see but a frock of partridges flying there.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The king of Yue destroyed the kingdom of Wu in the 5th century B.C.</p>"}, {"num": "067", "zhTitle": "越女词", "enTitle": "Songs of the Southern Lass", "chinese": "（五首其一）\n长干[1]吴[2]儿女[3]，\n眉目艳星月。\n屐上足如霜，\n不着鸦头袜[4]。\n《越女词》共五首，是李白漫游吴越时的作品，描写吴越民间女子的容貌和服饰，显示出江南水乡的旖旎风光。诗的风格清新活泼，有浓厚的民歌色彩。这首诗描写吴家儿女美丽的容貌和活泼的姿态。词句不事雕琢，风格质朴，具有典型的太白诗风。\n注释：\n[1]长干：地名，在今浙江北部。\n[2]吴：吴地，在今长江下游江苏南部。\n[3]儿女：此指女儿。\n[4]鸦头袜：叉头袜。", "english": "(I)\nThe Southern lass is fair and bright,\nHer eyes and brows shame moon and stars.\nHer feet in sandals are frost-white,\nThe crow-head shoes would look like scars.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">（五首其一）<br>长干[1]吴[2]儿女[3]，<br>眉目艳星月。<br>屐上足如霜，<br>不着鸦头袜[4]。</p>\n<p class=\"prose\">《越女词》共五首，是李白漫游吴越时的作品，描写吴越民间女子的容貌和服饰，显示出江南水乡的旖旎风光。诗的风格清新活泼，有浓厚的民歌色彩。这首诗描写吴家儿女美丽的容貌和活泼的姿态。词句不事雕琢，风格质朴，具有典型的太白诗风。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]长干：地名，在今浙江北部。<br>[2]吴：吴地，在今长江下游江苏南部。<br>[3]儿女：此指女儿。<br>[4]鸦头袜：叉头袜。</p>", "englishHtml": "<p class=\"poem-lines\">(I)</p>\n<p class=\"prose\">The Southern lass is fair and bright,<br>Her eyes and brows shame moon and stars.<br>Her feet in sandals are frost-white,<br>The crow-head shoes would look like scars.</p>"}, {"num": "068", "zhTitle": "越女词", "enTitle": "Songs of the Southern Lass", "chinese": "（五首其三）\n耶溪[1]采莲女，\n见客棹歌[2]回。\n笑入荷花去，\n佯羞不出来。\n这首诗写的是天真娇羞的采莲姑娘的形象。采莲女水中采莲，忽闻有客乘舟而来，赶紧掉转方向，躲进密密麻麻的荷丛之后，仿佛是因为怕羞而不敢见客一般。诗的题材和语言受南朝民歌影响，清新自然，返璞归真，令人神驰遐想。\n注释：\n[1]耶溪：即若耶溪，在今浙江省绍兴市南。\n[2]棹歌：划船时所唱之歌。", "english": "(III)\nA maiden gathers lotus in the creek,\nSinging,she turns round,seeing passers-by.\nSmiling,she hides’mid lotus blooms her cheek\nAnd won’t appear again:she seems so shy.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">（五首其三）<br>耶溪[1]采莲女，<br>见客棹歌[2]回。<br>笑入荷花去，<br>佯羞不出来。</p>\n<p class=\"prose\">这首诗写的是天真娇羞的采莲姑娘的形象。采莲女水中采莲，忽闻有客乘舟而来，赶紧掉转方向，躲进密密麻麻的荷丛之后，仿佛是因为怕羞而不敢见客一般。诗的题材和语言受南朝民歌影响，清新自然，返璞归真，令人神驰遐想。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]耶溪：即若耶溪，在今浙江省绍兴市南。<br>[2]棹歌：划船时所唱之歌。</p>", "englishHtml": "<p class=\"poem-lines\">(III)</p>\n<p class=\"prose\">A maiden gathers lotus in the creek,<br>Singing,she turns round,seeing passers-by.<br>Smiling,she hides’mid lotus blooms her cheek<br>And won’t appear again:she seems so shy.</p>"}, {"num": "069", "zhTitle": "越女词", "enTitle": "Songs of the Southern Lass", "chinese": "（五首其五）\n镜湖[1]水如月，\n耶溪女如雪。\n新妆荡新波，\n光景[2]两奇绝。\n镜湖在今天的浙江绍兴，若耶溪相传是西施浣纱的地方。溪水流入湖中，明净如月光的湖水，照着粉妆素裹的少女，波光人影相互辉映，景使人更美，人使景更丽。本诗是李白借美景写美人的佳作。\n注释：\n[1]镜湖：又称鉴湖、庆湖，在今浙江省绍兴市会稽山北麓，周围三百里若耶溪北流入于镜湖。\n[2]景（yǐnɡ）：同“影”。", "english": "(V)\nThe waves of Mirror Lake look like moonbeams;\nThe maiden’s dress like snow on waterside.\nThe rippling dress vies with the rippling stream,\nWe know not which by which is beautified.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">（五首其五）<br>镜湖[1]水如月，<br>耶溪女如雪。<br>新妆荡新波，<br>光景[2]两奇绝。</p>\n<p class=\"prose\">镜湖在今天的浙江绍兴，若耶溪相传是西施浣纱的地方。溪水流入湖中，明净如月光的湖水，照着粉妆素裹的少女，波光人影相互辉映，景使人更美，人使景更丽。本诗是李白借美景写美人的佳作。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]镜湖：又称鉴湖、庆湖，在今浙江省绍兴市会稽山北麓，周围三百里若耶溪北流入于镜湖。<br>[2]景（yǐnɡ）：同“影”。</p>", "englishHtml": "<p class=\"poem-lines\">(V)</p>\n<p class=\"prose\">The waves of Mirror Lake look like moonbeams;<br>The maiden’s dress like snow on waterside.<br>The rippling dress vies with the rippling stream,<br>We know not which by which is beautified.</p>"}, {"num": "070", "zhTitle": "渌水曲", "enTitle": "Song of Green Water", "chinese": "渌水明秋月，\n南湖[2]采白苹[3]。\n荷花娇欲语，\n愁杀[4]荡舟人。\n这首小诗写的是思念远人带来的愁绪。开局从一个明媚的秋日写起，粼粼波光中少女荡舟采苹。见荷花粉红娇嫩，含羞欲语，恰如少女的年纪清纯，只是荷花娇嫩尚有人观赏，而自己正当盛年却无人陪伴，莫名的愁绪涌来。也有人认为诗人是在用一贯的夸张手法，写自己荡舟湖上，见荷花如少女含羞欲语，让采苹的姑娘们非常不满，犹言荷花的美。\n注释：\n[1]渌（lù）水曲：古乐府曲名；渌水：即绿水，清澈的水。\n[2]南湖：即洞庭湖。\n[3]白苹：一种水生植物，是多年生浅水草本，根茎在泥中，叶子浮在水面之上。\n[4]愁杀：即“愁煞”，愁得不堪忍受的意思；杀：用在动词后，表示极度。", "english": "O’er water green the autumn moon shines bright,\nOn Southern Lake they gather lilies white.\nThe lotus-blooms so lovely as to speak\nOutshine the bashful oarswomen’s fair cheek.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">渌水明秋月，<br>南湖[2]采白苹[3]。<br>荷花娇欲语，<br>愁杀[4]荡舟人。</p>\n<p class=\"prose\">这首小诗写的是思念远人带来的愁绪。开局从一个明媚的秋日写起，粼粼波光中少女荡舟采苹。见荷花粉红娇嫩，含羞欲语，恰如少女的年纪清纯，只是荷花娇嫩尚有人观赏，而自己正当盛年却无人陪伴，莫名的愁绪涌来。也有人认为诗人是在用一贯的夸张手法，写自己荡舟湖上，见荷花如少女含羞欲语，让采苹的姑娘们非常不满，犹言荷花的美。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]渌（lù）水曲：古乐府曲名；渌水：即绿水，清澈的水。<br>[2]南湖：即洞庭湖。<br>[3]白苹：一种水生植物，是多年生浅水草本，根茎在泥中，叶子浮在水面之上。<br>[4]愁杀：即“愁煞”，愁得不堪忍受的意思；杀：用在动词后，表示极度。</p>", "englishHtml": "<p class=\"prose\">O’er water green the autumn moon shines bright,<br>On Southern Lake they gather lilies white.<br>The lotus-blooms so lovely as to speak<br>Outshine the bashful oarswomen’s fair cheek.</p>"}, {"num": "071", "zhTitle": "闻王昌龄左迁龙标遥有此寄", "enTitle": "To Wang Changling Banished to the West", "chinese": "杨花[1]落尽子规[2]啼，\n闻道龙标[3]过五溪[4]。\n我寄愁心与明月，\n随风直到夜郎[5]西。\n王昌龄因不拘细节，被贬黜到五溪之西的龙标（今天的湖南省怀化市沅陵县）。从他的诗句“一片冰心在玉壶”来看，对他的处分是太重的，因此李白写了这首诗寄给他。暮春时节，百花凋残，杨花落尽，加上子规悲啼“不如归去”，这时李白听到王昌龄贬官的消息，见景生情，分外凄凉。但是两人一东一西，同看到的只有春风明月，于是李白就把明月人格化，托它把自己的相思之情带去千里之外，梦乡之西了。这是一首融情景、叙事于一炉的名作。\n注释：\n[1]杨花：柳絮。\n[2]子规：即杜鹃鸟，又称布谷鸟，相传其啼声哀婉凄切，甚至啼血。\n[3]龙标：诗中指王昌龄，古人常用官职或任官之地的州县名来称呼一个人。\n[4]五溪：是武溪、巫溪、酉溪、沅溪、辰溪的总称，在今湖南省西部。\n[5]夜郎：唐代夜郎县，位于今湖南省怀化市沅陵县。", "english": "All willow-down has fallen and sad cuckoos cry\nTo hear you banished southwestward beyond Five Streams.\nI would confide my sorrow to the moon on high\nFor it will follow you west of the Land of Dreams.[1]\n注释：\n[1]Present-day Guizhou Province.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">杨花[1]落尽子规[2]啼，<br>闻道龙标[3]过五溪[4]。<br>我寄愁心与明月，<br>随风直到夜郎[5]西。</p>\n<p class=\"prose\">王昌龄因不拘细节，被贬黜到五溪之西的龙标（今天的湖南省怀化市沅陵县）。从他的诗句“一片冰心在玉壶”来看，对他的处分是太重的，因此李白写了这首诗寄给他。暮春时节，百花凋残，杨花落尽，加上子规悲啼“不如归去”，这时李白听到王昌龄贬官的消息，见景生情，分外凄凉。</p>\n<p class=\"prose\">但是两人一东一西，同看到的只有春风明月，于是李白就把明月人格化，托它把自己的相思之情带去千里之外，梦乡之西了。这是一首融情景、叙事于一炉的名作。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]杨花：柳絮。<br>[2]子规：即杜鹃鸟，又称布谷鸟，相传其啼声哀婉凄切，甚至啼血。<br>[3]龙标：诗中指王昌龄，古人常用官职或任官之地的州县名来称呼一个人。<br>[4]五溪：是武溪、巫溪、酉溪、沅溪、辰溪的总称，在今湖南省西部。<br>[5]夜郎：唐代夜郎县，位于今湖南省怀化市沅陵县。</p>", "englishHtml": "<p class=\"prose\">All willow-down has fallen and sad cuckoos cry<br>To hear you banished southwestward beyond Five Streams.<br>I would confide my sorrow to the moon on high<br>For it will follow you west of the Land of Dreams.[1]</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Guizhou Province.</p>"}, {"num": "072", "zhTitle": "战城南", "enTitle": "Fighting South of the Town", "chinese": "去年战，\n桑干[1]源；\n今年战，\n葱河[2]道。\n洗兵[3]条支[4]海上波，\n放马天山雪中草。\n万里长征战，\n三军尽衰老。\n匈奴以杀戮为耕作，\n古来惟见白骨黄沙田。\n秦家筑城备胡处，\n汉家还有烽火燃。\n烽火燃不息，\n征战无已时。\n野战格斗死，\n败马号鸣向天悲。\n乌鸢[5]啄人肠，\n衔飞上挂枯树枝。\n士卒涂草莽，\n将军空尔为。\n乃知兵者是凶器，\n圣人不得已而用之。\n天宝年间（742—756），唐玄宗轻启战端，给百姓带来深重的灾难。有人说李白的写作风格是开门见山，在此诗中的确是这样，开篇即以战始，直接抨击了当权者穷兵黩武，好杀伐之功，以致连年征战。左思《魏都赋》描写曹操讨灭群雄、威震寰宇的气势时说：“洗兵海岛，刷马江洲。”李白借用其意，说明军队征讨太远。不敢想象，等这些远征万里的青壮年两鬓斑白回到家中时，家中还有几人。而比起那永远没有机会回来的人，即使“归来头白还戍边”，他们也还算幸运的。匈奴人不务耕作，专事征战掠夺。秦时防备匈奴的长城，汉代仍然烽火常燃。长久的军事斗争，使大量的青壮年白白牺牲，残尸曝烈日，流血涂野草，换来的只是“将军空尔为”，揭露了为官者为博取功名不惜“一将功成万骨枯”的残酷本性。诗以《六韬》“圣人号兵为凶器，不得已而用之”做结尾，来总结历史经验，劝当道者不要滥用武功。\n注释：\n[1]桑干：即桑干河，为今永定河之上游，于今河北省西北部和山西省北部。\n[2]葱河：葱河即葱岭河。今有南北两河。南名叶尔羌河，北名喀什噶尔河。\n[3]洗兵：洗去战斗后兵器上的污秽。\n[4]条支：汉西域古国名。在今伊拉克底格里斯河、幼发拉底河之间。此泛指西域。\n[5]鸢（yuān）：即老鹰，属于鹰科的一种小型的鹰，常啄食腐尸烂肉。", "english": "Last year we fought\nAt River’s source;\nThis year we fight\nAlong its course.\nWe’ve washed our swords in Parthian seas off bloody stains,\nAnd grazed our horses on the grass in mountain’s snow.\nFor miles and miles we made campaigns\nTill weak and old our warriors grow.\nThe Tartars live on killing as on ploughing land,\nBleach’d bones of olden times are buried in the sand.\nUnder the Qin[1]against the foe Great Wall was raised;\nUnder the Han[2]the beacon fires still blazed.\nSee beacon fires on the frontier!\nTill warriors fight from year to year.\nIn wilderness the fighters die,\nRiderless horses neigh toward the sky;\nCrows pecking human entrails flee\nAnd hang them on a withered tree.\nThe blood of soldiers smears the grass.\nWithout them what could generals do?\nWar is a fearful thing,alas!\nFor rulers wise,’twould be the last means resorted to.\n注释：\n[1]The Qin Dynasty(221–207 B.C.).\n[2]The Han Dynasty(206 B.C.–220 A.D.).", "poemType": "古体诗", "chineseHtml": "<p class=\"poem-lines\">去年战，<br>桑干[1]源；<br>今年战，<br>葱河[2]道。<br>洗兵[3]条支[4]海上波，<br>放马天山雪中草。<br>万里长征战，<br>三军尽衰老。<br>匈奴以杀戮为耕作，<br>古来惟见白骨黄沙田。<br>秦家筑城备胡处，<br>汉家还有烽火燃。<br>烽火燃不息，<br>征战无已时。<br>野战格斗死，<br>败马号鸣向天悲。<br>乌鸢[5]啄人肠，<br>衔飞上挂枯树枝。<br>士卒涂草莽，<br>将军空尔为。<br>乃知兵者是凶器，<br>圣人不得已而用之。</p>\n<p class=\"prose\">天宝年间（742—756），唐玄宗轻启战端，给百姓带来深重的灾难。有人说李白的写作风格是开门见山，在此诗中的确是这样，开篇即以战始，直接抨击了当权者穷兵黩武，好杀伐之功，以致连年征战。左思《魏都赋》描写曹操讨灭群雄、威震寰宇的气势时说：“洗兵海岛，刷马江洲。”</p>\n<p class=\"prose\">李白借用其意，说明军队征讨太远。不敢想象，等这些远征万里的青壮年两鬓斑白回到家中时，家中还有几人。而比起那永远没有机会回来的人，即使“归来头白还戍边”，他们也还算幸运的。匈奴人不务耕作，专事征战掠夺。秦时防备匈奴的长城，汉代仍然烽火常燃。</p>\n<p class=\"prose\">长久的军事斗争，使大量的青壮年白白牺牲，残尸曝烈日，流血涂野草，换来的只是“将军空尔为”，揭露了为官者为博取功名不惜“一将功成万骨枯”的残酷本性。诗以《六韬》“圣人号兵为凶器，不得已而用之”做结尾，来总结历史经验，劝当道者不要滥用武功。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]桑干：即桑干河，为今永定河之上游，于今河北省西北部和山西省北部。<br>[2]葱河：葱河即葱岭河。今有南北两河。南名叶尔羌河，北名喀什噶尔河。<br>[3]洗兵：洗去战斗后兵器上的污秽。<br>[4]条支：汉西域古国名。在今伊拉克底格里斯河、幼发拉底河之间。此泛指西域。<br>[5]鸢（yuān）：即老鹰，属于鹰科的一种小型的鹰，常啄食腐尸烂肉。</p>", "englishHtml": "<p class=\"prose\">Last year we fought<br>At River’s source;<br>This year we fight<br>Along its course.<br>We’ve washed our swords in Parthian seas off bloody stains,<br>And grazed our horses on the grass in mountain’s snow.<br>For miles and miles we made campaigns<br>Till weak and old our warriors grow.<br>The Tartars live on killing as on ploughing land,<br>Bleach’d bones of olden times are buried in the sand.<br>Under the Qin[1]against the foe Great Wall was raised;<br>Under the Han[2]the beacon fires still blazed.<br>See beacon fires on the frontier!<br>Till warriors fight from year to year.<br>In wilderness the fighters die,<br>Riderless horses neigh toward the sky;<br>Crows pecking human entrails flee<br>And hang them on a withered tree.<br>The blood of soldiers smears the grass.<br>Without them what could generals do?<br>War is a fearful thing,alas!<br>For rulers wise,’twould be the last means resorted to.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The Qin Dynasty(221–207 B.C.).<br>[2]The Han Dynasty(206 B.C.–220 A.D.).</p>"}, {"num": "073", "zhTitle": "听蜀僧濬弹琴", "enTitle": "On Hearing a Monk from ShuPlaying His Lute", "chinese": "蜀僧抱绿绮[2]，\n西下峨眉峰。\n为我一挥手，\n如听万壑松[3]。\n客心洗流水[4]，\n余响[5]入霜钟[6]。\n不觉碧山暮，\n秋云暗几重？\n《听蜀僧濬弹琴》是李白写音乐的一首五言律诗。李白是四川人，对故乡一往情深。他对峨眉山来的和尚情有独钟，一听他挥手弹起名贵的绿绮琴来，就像听到万山中松涛起伏一样。松风琴韵像流水般洗净了他的凡心俗念，余音袅袅，不绝如缕。琴声和霜降时的寺庙晚钟融合在一起，听来大有高山流水遇知音之感。不知不觉，琴声更融入了碧山秋云之中，似乎天地都在和琴声共鸣了。这是一首表现弹者和听者心灵交流的好诗。\n注释：\n[1]蜀僧濬：即蜀地名濬的僧人。\n[2]绿绮：琴名。\n[3]万壑松：指万壑松声。此处以万壑松声比喻琴声。\n[4]流水：语意双关，既是对僧濬琴声的实指，又暗用了伯牙善弹的典故。\n[5]余响：指琴的余音。\n[6]霜钟：指钟声。", "english": "A monk from Shu his green lute brings,\nComing down the west peak of Mount Brow.\nHe sweeps his fingers o’er its strings,\nI hear the wind through pine-trees sough.\nA running stream washes my heart,\nWith evening bells its echo’s loud.\nI do not feel the sun depart\nFrom mountains green and autumn cloud.\n注释：\n[1]Present-day Sichuan Province.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">蜀僧抱绿绮[2]，<br>西下峨眉峰。<br>为我一挥手，<br>如听万壑松[3]。<br>客心洗流水[4]，<br>余响[5]入霜钟[6]。<br>不觉碧山暮，<br>秋云暗几重？</p>\n<p class=\"prose\">《听蜀僧濬弹琴》是李白写音乐的一首五言律诗。李白是四川人，对故乡一往情深。他对峨眉山来的和尚情有独钟，一听他挥手弹起名贵的绿绮琴来，就像听到万山中松涛起伏一样。松风琴韵像流水般洗净了他的凡心俗念，余音袅袅，不绝如缕。琴声和霜降时的寺庙晚钟融合在一起，听来大有高山流水遇知音之感。</p>\n<p class=\"prose\">不知不觉，琴声更融入了碧山秋云之中，似乎天地都在和琴声共鸣了。这是一首表现弹者和听者心灵交流的好诗。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]蜀僧濬：即蜀地名濬的僧人。<br>[2]绿绮：琴名。<br>[3]万壑松：指万壑松声。此处以万壑松声比喻琴声。<br>[4]流水：语意双关，既是对僧濬琴声的实指，又暗用了伯牙善弹的典故。<br>[5]余响：指琴的余音。<br>[6]霜钟：指钟声。</p>", "englishHtml": "<p class=\"prose\">A monk from Shu his green lute brings,<br>Coming down the west peak of Mount Brow.<br>He sweeps his fingers o’er its strings,<br>I hear the wind through pine-trees sough.<br>A running stream washes my heart,<br>With evening bells its echo’s loud.<br>I do not feel the sun depart<br>From mountains green and autumn cloud.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Sichuan Province.</p>"}, {"num": "074", "zhTitle": "寄东鲁二稚子", "enTitle": "Written for My Two Children in East Lu", "chinese": "吴地[1]桑叶绿，\n吴蚕已三眠[2]。\n我家寄东鲁[3]，\n谁种龟阴田[4]？\n春事[5]已不及，\n江行复茫然。\n南风吹归心，\n飞堕酒楼前。\n楼东一株桃，\n枝叶拂青烟[6]。\n此树我所种，\n别来向三年[7]。\n桃今与楼齐，\n我行尚未旋。\n娇女字平阳，\n折花倚桃边。\n折花不见我，\n泪下如流泉。\n小儿名伯禽，\n与姐亦齐肩。\n双行桃树下，\n抚背复谁怜？\n念此失次第[8]，\n肝肠日忧煎。\n裂素[9]写远意，\n因之汶阳川。\n这是李白写给自己两个孩子的家书。公元748至750年，李白游金陵，思念他寄居东鲁的家人，故有此篇。诗人看到吴地春景，即景生情，想到家中春天正是农事繁忙之际，而自己浪迹江湖，一事无成，龟山北面的田园正不知该找谁代耕。念及此，不禁心生焦虑。春天的农事已来不及了，而今后仍漂泊不定，不知归期。每每思家，家里熟悉的一切都会浮现眼前：那小酒楼，那棵亲手种下的桃树。作者对家中的一切倾注了深厚的感情，为下文引出对儿女的思念营造了浓厚的氛围。诗人写对儿女的思念，先不言自己相思之情，而从儿女思父的角度入手，一片思念之情，自然流泻。最后从想象当中回归现实，将相思寄于汶水。毋庸置疑，诗人情景并茂的奇丽想象，是这首诗神韵飞动、感人至深的重要原因。\n注释：\n[1]吴地：今江苏一带，春秋时属吴国。\n[2]三眠：蚕蜕皮时，不食不动，其状如眠。蚕历经三眠，方能吐丝结茧。\n[3]东鲁：今山东一带，春秋时属鲁国。\n[4]龟阴田：此处指李白在山东的田地。\n[5]春事：春日耕种之事。\n[6]拂青烟：拂动的青烟，形容枝繁叶茂状。\n[7]向三年：快到三年了。\n[8]失次第：心绪不定，七上八下。\n[9]裂素：指准备书写工具之意；素，绢素，古代作书画的白绢。", "english": "Mulberry leaves in Southern land are green,\nThe silkworms thrice in sleep must have been.\nIn Eastern Lu my family stay still.\nWho’d help to sow our fields north of Lu Hill?\nIt’s now too late to do farmwork of spring.\nWhat then am I to do while travelling?\nThe southern wind is blowing without stop,\nMy heart flies back to my old familiar wine shop.\nEast of the shop there’s a peach tree I’ve missed,\nIts branches must be waving in bluish mist.\nIt is the tree I plant’d three years ago,\nIf it has grown to reach the roof,I don’t know.\nI have not been at home for three long years.\nI can imagine my daughter appears\nBeside the tree and plucks a flower pink.\nWithout seeing me,she must have,I think,\nShed copious tears.My younger son has grown\nUp to his sister’s shoulders.’Neath full-blown.\nPeach tree they stand side by side.But who’s there\nTo pat them on the back?I feel,whene’er\nI think of this,so painful that I write\nAnd send to them this poem on silk white.\n注释：\n[1]Present-day Shandong Province.", "poemType": "五言古诗", "chineseHtml": "<p class=\"poem-lines\">吴地[1]桑叶绿，<br>吴蚕已三眠[2]。<br>我家寄东鲁[3]，<br>谁种龟阴田[4]？<br>春事[5]已不及，<br>江行复茫然。<br>南风吹归心，<br>飞堕酒楼前。<br>楼东一株桃，<br>枝叶拂青烟[6]。<br>此树我所种，<br>别来向三年[7]。<br>桃今与楼齐，<br>我行尚未旋。<br>娇女字平阳，<br>折花倚桃边。<br>折花不见我，<br>泪下如流泉。<br>小儿名伯禽，<br>与姐亦齐肩。<br>双行桃树下，<br>抚背复谁怜？<br>念此失次第[8]，<br>肝肠日忧煎。<br>裂素[9]写远意，<br>因之汶阳川。</p>\n<p class=\"prose\">这是李白写给自己两个孩子的家书。公元748至750年，李白游金陵，思念他寄居东鲁的家人，故有此篇。诗人看到吴地春景，即景生情，想到家中春天正是农事繁忙之际，而自己浪迹江湖，一事无成，龟山北面的田园正不知该找谁代耕。念及此，不禁心生焦虑。</p>\n<p class=\"prose\">春天的农事已来不及了，而今后仍漂泊不定，不知归期。每每思家，家里熟悉的一切都会浮现眼前：那小酒楼，那棵亲手种下的桃树。作者对家中的一切倾注了深厚的感情，为下文引出对儿女的思念营造了浓厚的氛围。诗人写对儿女的思念，先不言自己相思之情，而从儿女思父的角度入手，一片思念之情，自然流泻。</p>\n<p class=\"prose\">最后从想象当中回归现实，将相思寄于汶水。毋庸置疑，诗人情景并茂的奇丽想象，是这首诗神韵飞动、感人至深的重要原因。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]吴地：今江苏一带，春秋时属吴国。<br>[2]三眠：蚕蜕皮时，不食不动，其状如眠。蚕历经三眠，方能吐丝结茧。<br>[3]东鲁：今山东一带，春秋时属鲁国。<br>[4]龟阴田：此处指李白在山东的田地。<br>[5]春事：春日耕种之事。<br>[6]拂青烟：拂动的青烟，形容枝繁叶茂状。<br>[7]向三年：快到三年了。<br>[8]失次第：心绪不定，七上八下。<br>[9]裂素：指准备书写工具之意；素，绢素，古代作书画的白绢。</p>", "englishHtml": "<p class=\"prose\">Mulberry leaves in Southern land are green,<br>The silkworms thrice in sleep must have been.<br>In Eastern Lu my family stay still.<br>Who’d help to sow our fields north of Lu Hill?<br>It’s now too late to do farmwork of spring.<br>What then am I to do while travelling?<br>The southern wind is blowing without stop,<br>My heart flies back to my old familiar wine shop.<br>East of the shop there’s a peach tree I’ve missed,<br>Its branches must be waving in bluish mist.<br>It is the tree I plant’d three years ago,<br>If it has grown to reach the roof,I don’t know.<br>I have not been at home for three long years.<br>I can imagine my daughter appears<br>Beside the tree and plucks a flower pink.<br>Without seeing me,she must have,I think,<br>Shed copious tears.My younger son has grown<br>Up to his sister’s shoulders.’Neath full-blown.<br>Peach tree they stand side by side.But who’s there<br>To pat them on the back?I feel,whene’er<br>I think of this,so painful that I write<br>And send to them this poem on silk white.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Shandong Province.</p>"}, {"num": "075", "zhTitle": "秦王扫六合", "enTitle": "The Emperor of Qin", "chinese": "虎视何雄哉！\n挥剑决浮云，\n诸侯尽西来。\n雄图发英断，\n大略驾群才。\n收兵铸[1]金人，\n函谷正东开。\n铭功会稽[2]岭，\n骋望琅玡台。\n刑徒七十万，\n起土骊山隈[3]。\n尚采不死药，\n茫然使心哀。\n连弩射海鱼，\n长鲸正崔嵬[4]。\n额鼻象五岳，\n扬波喷云雷。\n鬐鬣[5]蔽青天，\n何由睹蓬莱？\n徐市载秦女，\n楼船几时回？\n但见三泉下，\n金棺葬寒灰！\n李白对秦始皇的评价，是毁誉参半的，也是比较客观的。首先他肯定了秦始皇的历史功绩，对秦始皇的正面颂扬也很有气势，但这显然不是大诗人真正想表达的。疲弊天下，严刑峻法，期不死，筑高陵，求仙药，猎长鲸，最后却“但见三泉下，金棺葬寒灰”，这才是诗人的本意，深刻地揭露了秦始皇自私、贪婪、空虚、恐惧的内心世界。李白站在超越时间、超越客观历史的角度，用大部分的篇幅批判秦始皇，实属借古讽今：唐玄宗也和秦始皇一样，早年励精图治，开创了唐朝的极盛时期——开元盛世，后来又变得骄奢淫逸，怠慢朝政，最后迷信方士妄求长生。李白此诗，历史结合夸张想象，叙事结合抒情，批判现实主义结合浪漫主义，挥洒自如，跌宕生姿，是不可多得的佳作。\n注释：\n[1]铸：把金属熔化后倒在模子里制成器物。\n[2]会稽：中国古代郡名，位于长江下游江南一带。\n[3]隈：形容山水弯曲的地方。\n[4]崔嵬：形容物体高大的样子。\n[5]鬐（qí）鬣（liè）：鱼脊和鱼颌上的羽状部分。", "english": "The Emperor had swept the world of his foes,\nLooking around like a tiger he rose.\nHe broke the floating clouds while wielding swords,\nWestward to pay their homage came all lords.\nHe made great plans and formed decisions wise,\nIn front of him all heroes dwarfed in size.\nHe melted weapons into statues of brass,\nAnd opened to the East the frontier pass.\nHe built a monument on Eastern Hill,\nAnd rode to Southern Tower to gaze his fill.\nHe worked seven hundred thousand slaves\nTo build in deep mountain recess his graves.\nHe sought elixir of immortality,\nThese contradictory deeds puzzle me.\nHe bent his bow to shoot the monster whale\nSweeping the sea with its enormous tail.\nIts head and nose erect’d like mountains proud,\nAnd water spout’d like thunder and like cloud.\nIts dorsal fin might cover azure sky.\nCould seamen find the Fairy Islands[1]high?\nThe alchemist with maidens went to sea.\nWhen could their galleys come back?We but see\nBuried in underworld,the ashes cold\nOf Emperor of Qin in coffin made of gold!\n注释：\n[1]The Emperor of Qin(reigned 246–210 B.C.)sent an alchemist to sea to seek for the elixir of immortality in the Fairy Islands.The alchemist reported that a monster was barring the seaway and the Emperor shot dead a giant whale.", "poemType": "五言古诗", "chineseHtml": "<p class=\"poem-lines\">虎视何雄哉！<br>挥剑决浮云，<br>诸侯尽西来。<br>雄图发英断，<br>大略驾群才。<br>收兵铸[1]金人，<br>函谷正东开。<br>铭功会稽[2]岭，<br>骋望琅玡台。<br>刑徒七十万，<br>起土骊山隈[3]。<br>尚采不死药，<br>茫然使心哀。<br>连弩射海鱼，<br>长鲸正崔嵬[4]。<br>额鼻象五岳，<br>扬波喷云雷。<br>鬐鬣[5]蔽青天，<br>何由睹蓬莱？<br>徐市载秦女，<br>楼船几时回？<br>但见三泉下，<br>金棺葬寒灰！</p>\n<p class=\"prose\">李白对秦始皇的评价，是毁誉参半的，也是比较客观的。首先他肯定了秦始皇的历史功绩，对秦始皇的正面颂扬也很有气势，但这显然不是大诗人真正想表达的。疲弊天下，严刑峻法，期不死，筑高陵，求仙药，猎长鲸，最后却“但见三泉下，金棺葬寒灰”，这才是诗人的本意，深刻地揭露了秦始皇自私、贪婪、空虚、恐惧的内心世界。</p>\n<p class=\"prose\">李白站在超越时间、超越客观历史的角度，用大部分的篇幅批判秦始皇，实属借古讽今：唐玄宗也和秦始皇一样，早年励精图治，开创了唐朝的极盛时期——开元盛世，后来又变得骄奢淫逸，怠慢朝政，最后迷信方士妄求长生。李白此诗，历史结合夸张想象，叙事结合抒情，批判现实主义结合浪漫主义，挥洒自如，跌宕生姿，是不可多得的佳作。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]铸：把金属熔化后倒在模子里制成器物。<br>[2]会稽：中国古代郡名，位于长江下游江南一带。<br>[3]隈：形容山水弯曲的地方。<br>[4]崔嵬：形容物体高大的样子。<br>[5]鬐（qí）鬣（liè）：鱼脊和鱼颌上的羽状部分。</p>", "englishHtml": "<p class=\"prose\">The Emperor had swept the world of his foes,<br>Looking around like a tiger he rose.<br>He broke the floating clouds while wielding swords,<br>Westward to pay their homage came all lords.<br>He made great plans and formed decisions wise,<br>In front of him all heroes dwarfed in size.<br>He melted weapons into statues of brass,<br>And opened to the East the frontier pass.<br>He built a monument on Eastern Hill,<br>And rode to Southern Tower to gaze his fill.<br>He worked seven hundred thousand slaves<br>To build in deep mountain recess his graves.<br>He sought elixir of immortality,<br>These contradictory deeds puzzle me.<br>He bent his bow to shoot the monster whale<br>Sweeping the sea with its enormous tail.<br>Its head and nose erect’d like mountains proud,<br>And water spout’d like thunder and like cloud.<br>Its dorsal fin might cover azure sky.<br>Could seamen find the Fairy Islands[1]high?<br>The alchemist with maidens went to sea.<br>When could their galleys come back?We but see<br>Buried in underworld,the ashes cold<br>Of Emperor of Qin in coffin made of gold!</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The Emperor of Qin(reigned 246–210 B.C.)sent an alchemist to sea to seek for the elixir of immortality in the Fairy Islands.The alchemist reported that a monster was barring the seaway and the Emperor shot dead a giant whale.</p>"}, {"num": "076", "zhTitle": "登高丘而望远海", "enTitle": "Mounting a Heightand Viewing the Sea", "chinese": "登高丘，\n望远海。\n六鳌[1]骨已霜，\n三山流安在？\n扶桑[2]半摧折，\n白日沉光彩。\n银台金阙[3]如梦中，\n秦皇汉武空相待。\n精卫费木石，\n鼋鼍[4]无所凭。\n君不见，\n骊山茂陵尽灰灭，\n牧羊之子[5]来攀登！\n盗贼劫宝玉，\n精灵[6]竟何能？\n穷兵黩武今如此，\n鼎湖飞龙安可乘？\n此诗的主体部分几乎每一句都藏着一个典故。这并不是怀古之章，主旨与《秦王扫六合》一样，是用典故做隐喻，借古讽今，语言比《秦王扫六合》更加深刻露骨。诗人由登高望远点题，联想到传说神话中的仙人神物并不存在于现实世界。李白是喜爱于深山之中访仙问道的，这是因为他不被现实世界所理解，不被世俗所接收，所以他只能寻找超脱世俗之路，寻求精神上的寄托。所以他更加明白根本没有什么神仙，妄图通过求仙问道以求长生更是愚不可及。用秦皇汉武的典故类比，是对此类皇帝的讽刺和批判，是对当朝皇帝的暗示。\n注释：\n[1]六鳌：传说渤海的东面是无边无际的大海，上面浮着岱舆、员峤、方壶、瀛洲、蓬莱五座神山，山上长有长生不老药；鳌，传说中海里的大鳖。\n[2]扶桑：神话中树木名。传说太阳每天在成池沐浴后，升高到扶桑树梢的时候，刚好天微明。\n[3]银台金阙：黄金白银建成的亭台宫阙，指神仙居住的地方。\n[4]鼋（yuán）鼍（tuó）：鼋，大鳖；鼍，鼍龙，俗称猪婆龙，鳄鱼的一种。传说周穆王征越国，在九江架鼋鼍为桥渡江。\n[5]牧羊之子：《汉书·刘向传》记载，有个牧童在骊山牧羊，有一只羊进入山洞中，牧童用火照明，到洞里去寻羊，以致引起一场大火，把秦始皇的外棺烧掉了。\n[6]精灵：指秦皇、汉武的神灵。", "english": "Mounting a height,\nI gaze afar.\nSix Giant Turtles’bones emerge on sea,frost-white,\nI do not see where the Three Fairy Mountains are.[2]\nThe Tree Divine half broken,\nThe sun’s great splendours wane.\nCelestial palace is a dream unwoken\nEmperors sought in vain.\nThe sea could not be filled with stones,\nNor could the gap by Turtles’bones.\nHave we not seen imperial tombs in ruins lie,\nWhich shepherds set on fire?\nThe bandits came to rob your jewels of value high.\nWhat could you do,imperial lier?\nSuch is the end you warmongers obtained.\nCould immortality be ever gained?\n注释：\n[1]Mount Tiantai in present-day Zhejiang Province.\n[2]According to Chinese legend,elixir could be found in the Fairy Mountains borne by Giant Turtles on the sea,but six Turtles were killed and Fairy Mountains floated off we know not where.", "poemType": "古体诗", "chineseHtml": "<p class=\"poem-lines\">登高丘，<br>望远海。<br>六鳌[1]骨已霜，<br>三山流安在？<br>扶桑[2]半摧折，<br>白日沉光彩。<br>银台金阙[3]如梦中，<br>秦皇汉武空相待。<br>精卫费木石，<br>鼋鼍[4]无所凭。<br>君不见，<br>骊山茂陵尽灰灭，<br>牧羊之子[5]来攀登！<br>盗贼劫宝玉，<br>精灵[6]竟何能？<br>穷兵黩武今如此，<br>鼎湖飞龙安可乘？</p>\n<p class=\"prose\">此诗的主体部分几乎每一句都藏着一个典故。这并不是怀古之章，主旨与《秦王扫六合》一样，是用典故做隐喻，借古讽今，语言比《秦王扫六合》更加深刻露骨。诗人由登高望远点题，联想到传说神话中的仙人神物并不存在于现实世界。李白是喜爱于深山之中访仙问道的，这是因为他不被现实世界所理解，不被世俗所接收，所以他只能寻找超脱世俗之路，寻求精神上的寄托。</p>\n<p class=\"prose\">所以他更加明白根本没有什么神仙，妄图通过求仙问道以求长生更是愚不可及。用秦皇汉武的典故类比，是对此类皇帝的讽刺和批判，是对当朝皇帝的暗示。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]六鳌：传说渤海的东面是无边无际的大海，上面浮着岱舆、员峤、方壶、瀛洲、蓬莱五座神山，山上长有长生不老药；鳌，传说中海里的大鳖。<br>[2]扶桑：神话中树木名。传说太阳每天在成池沐浴后，升高到扶桑树梢的时候，刚好天微明。<br>[3]银台金阙：黄金白银建成的亭台宫阙，指神仙居住的地方。<br>[4]鼋（yuán）鼍（tuó）：鼋，大鳖；鼍，鼍龙，俗称猪婆龙，鳄鱼的一种。传说周穆王征越国，在九江架鼋鼍为桥渡江。<br>[5]牧羊之子：《汉书·刘向传》记载，有个牧童在骊山牧羊，有一只羊进入山洞中，牧童用火照明，到洞里去寻羊，以致引起一场大火，把秦始皇的外棺烧掉了。<br>[6]精灵：指秦皇、汉武的神灵。</p>", "englishHtml": "<p class=\"poem-lines\">Mounting a height,<br>I gaze afar.</p>\n<p class=\"prose\">Six Giant Turtles’bones emerge on sea,frost-white,<br>I do not see where the Three Fairy Mountains are.[2]<br>The Tree Divine half broken,<br>The sun’s great splendours wane.<br>Celestial palace is a dream unwoken<br>Emperors sought in vain.<br>The sea could not be filled with stones,<br>Nor could the gap by Turtles’bones.<br>Have we not seen imperial tombs in ruins lie,<br>Which shepherds set on fire?<br>The bandits came to rob your jewels of value high.<br>What could you do,imperial lier?<br>Such is the end you warmongers obtained.<br>Could immortality be ever gained?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Mount Tiantai in present-day Zhejiang Province.<br>[2]According to Chinese legend,elixir could be found in the Fairy Mountains borne by Giant Turtles on the sea,but six Turtles were killed and Fairy Mountains floated off we know not where.</p>"}, {"num": "077", "zhTitle": "北风行", "enTitle": "The North Wind", "chinese": "烛龙[1]栖寒门，\n光耀犹旦开。\n日月照之何不及此[2]？\n惟有北风号怒天上来。\n燕山雪花大如席，\n片片吹落轩辕台。\n幽州思妇十二月，\n停歌罢笑双蛾摧[3]。\n倚门望行人，\n念君长城[4]苦寒良可哀。\n别时提剑救边去，\n遗此虎文金鞞靫[5]。\n中有一双白羽箭，\n蜘蛛结网生尘埃。\n箭空在，\n人今战死不复回。\n不忍见此物，\n焚之已成灰。\n黄河捧土尚可塞，\n北风雨雪恨难裁！\n《北风行》是乐府调名，内容多写北风雨雪、行人不归的伤感之情。李白于公元752年秋游幽州时，目睹当地百姓饱受战火的痛苦而作此诗。诗的开头通过怪诞离奇的神话，展现一个幽冷严寒的北方世界。以此为基础，作者又进一步描写足以显示北方冬季特征的景象：“日月照之何不及此？惟有北风号怒天上来。燕山雪花大如席，片片吹落轩辕台。”落笔大气，意境雄浑壮阔，故成千古名句。接下来诗人塑造了一个忧心忡忡、愁肠百结的思妇形象，塞北苦寒，征人的困境不言自明，更引起对远在长城的丈夫的担心。“提剑救边”刻画了丈夫为国慷慨从戎的英武形象。如果说离家日久，蛛网纵横已使人黯然神伤，箭尚在，人空守则使人不忍。思妇含恨焚箭这一举动将全篇的情感酝酿到最高点，在结尾强烈地爆发出来。\n注释：\n[1]烛龙：中国古代神话传说中的龙。传说此龙住在极北的寒门，终日不见太阳，睁眼为昼，闭眼为夜。\n[2]此：指幽州，在今北京市南郊。\n[3]双蛾摧：双眉紧锁，形容悲伤、愁闷的样子。双蛾：女子的双眉。\n[4]长城：此处泛指北方前线。\n[5]鞞（bǐnɡ）靫（chá）：绘有虎纹图案的箭袋。", "english": "The candle-holding Dragon curls o’er Polar Gate,[1]\nOnly at dawn his flickering light will radiate.\nNor sun nor moon will shine there far and nigh,\nOnly the howling northern wind blows down from the sky.\nThe snowflakes from north mountains,big as pillows white,\nFall flake on flake upon Yellow Emperor’s Height.[2]\nThe twelfth moon sees the wife in lonely bower sit,\nShe will nor sing nor smile,with eyebrows tightly knit.\nShe leans against the door and looks at passers-by,\nThinking of her husband who with cold might shiver\nBeyond the Great wall and sigh.\nWhen he started,his sword in hand,\nTo save the borderland.\nHe left her two white-feathered arrows in a golden quiver.\nThe pair of arrows’mid cobwebs and dust remain.\nHer lord who fell in battle won’t come back again.\nHow could she bear to see the tiger-striped quiver?\nShe tries to burn it into ashes.\nBuilding a dam,we may stop the flow of Yellow River.\nHow could the northern wind assuage her grief that gashes?\n注释：\n[1]According to Chinese myth,the North Pole was illuminated by the candle held by a dragon whose eyes would make day when opened and night when closed.\n[2]The Yellow Emperor was believed to be an ancestor of the Chinese people and inventor of south-seeking compass.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">烛龙[1]栖寒门，<br>光耀犹旦开。<br>日月照之何不及此[2]？<br>惟有北风号怒天上来。<br>燕山雪花大如席，<br>片片吹落轩辕台。<br>幽州思妇十二月，<br>停歌罢笑双蛾摧[3]。<br>倚门望行人，<br>念君长城[4]苦寒良可哀。<br>别时提剑救边去，<br>遗此虎文金鞞靫[5]。<br>中有一双白羽箭，<br>蜘蛛结网生尘埃。<br>箭空在，<br>人今战死不复回。<br>不忍见此物，<br>焚之已成灰。<br>黄河捧土尚可塞，<br>北风雨雪恨难裁！</p>\n<p class=\"prose\">《北风行》是乐府调名，内容多写北风雨雪、行人不归的伤感之情。李白于公元752年秋游幽州时，目睹当地百姓饱受战火的痛苦而作此诗。诗的开头通过怪诞离奇的神话，展现一个幽冷严寒的北方世界。以此为基础，作者又进一步描写足以显示北方冬季特征的景象：“日月照之何不及此？</p>\n<p class=\"prose\">惟有北风号怒天上来。燕山雪花大如席，片片吹落轩辕台。”落笔大气，意境雄浑壮阔，故成千古名句。接下来诗人塑造了一个忧心忡忡、愁肠百结的思妇形象，塞北苦寒，征人的困境不言自明，更引起对远在长城的丈夫的担心。“提剑救边”刻画了丈夫为国慷慨从戎的英武形象。</p>\n<p class=\"prose\">如果说离家日久，蛛网纵横已使人黯然神伤，箭尚在，人空守则使人不忍。思妇含恨焚箭这一举动将全篇的情感酝酿到最高点，在结尾强烈地爆发出来。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]烛龙：中国古代神话传说中的龙。传说此龙住在极北的寒门，终日不见太阳，睁眼为昼，闭眼为夜。<br>[2]此：指幽州，在今北京市南郊。<br>[3]双蛾摧：双眉紧锁，形容悲伤、愁闷的样子。双蛾：女子的双眉。<br>[4]长城：此处泛指北方前线。<br>[5]鞞（bǐnɡ）靫（chá）：绘有虎纹图案的箭袋。</p>", "englishHtml": "<p class=\"prose\">The candle-holding Dragon curls o’er Polar Gate,[1]<br>Only at dawn his flickering light will radiate.<br>Nor sun nor moon will shine there far and nigh,<br>Only the howling northern wind blows down from the sky.<br>The snowflakes from north mountains,big as pillows white,<br>Fall flake on flake upon Yellow Emperor’s Height.[2]<br>The twelfth moon sees the wife in lonely bower sit,<br>She will nor sing nor smile,with eyebrows tightly knit.<br>She leans against the door and looks at passers-by,<br>Thinking of her husband who with cold might shiver<br>Beyond the Great wall and sigh.<br>When he started,his sword in hand,<br>To save the borderland.<br>He left her two white-feathered arrows in a golden quiver.<br>The pair of arrows’mid cobwebs and dust remain.<br>Her lord who fell in battle won’t come back again.<br>How could she bear to see the tiger-striped quiver?<br>She tries to burn it into ashes.<br>Building a dam,we may stop the flow of Yellow River.<br>How could the northern wind assuage her grief that gashes?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]According to Chinese myth,the North Pole was illuminated by the candle held by a dragon whose eyes would make day when opened and night when closed.<br>[2]The Yellow Emperor was believed to be an ancestor of the Chinese people and inventor of south-seeking compass.</p>"}, {"num": "078", "zhTitle": "横江词", "enTitle": "The Crosswise River", "chinese": "（六首其一）\n人道横江[1]好，\n侬道[2]横江恶。\n一风三日[3]吹倒山，\n白浪高于瓦官阁。\n横江，即横江浦，在今安徽省马鞍山市和县东南，位于长江西北岸，与东南岸的采石矶相对，形势险要。前两句颇有民歌风味，“侬”为吴人自称，“人道”“我道”一抑一扬，为引出下文做好转折。后两句作者用一贯的夸张手法，极力状写横江“阴风怒号，浊浪排空”。这首诗主要是写横江的地势险峻，气候多变，诗人以想象丰富奇伟的笔触，创造出雄伟壮阔的境界。\n注释：\n[1]横江：横江浦，是古代的长江渡口。\n[2]道：一作“言”。\n[3]三日：一作“一月”。", "english": "(I)\nThey say the Crosswise River good;\nI say the Crosswise River rude.\nIf winds should blow three days,\nE’en hills would be blown down,\nAnd waves rise higher than the Temple[1]in the town.\n注释：\n[1]The Temple was 240 feet in height,to the southwest of present-day Nanjing.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">（六首其一）<br>人道横江[1]好，<br>侬道[2]横江恶。<br>一风三日[3]吹倒山，<br>白浪高于瓦官阁。</p>\n<p class=\"prose\">横江，即横江浦，在今安徽省马鞍山市和县东南，位于长江西北岸，与东南岸的采石矶相对，形势险要。前两句颇有民歌风味，“侬”为吴人自称，“人道”“我道”一抑一扬，为引出下文做好转折。后两句作者用一贯的夸张手法，极力状写横江“阴风怒号，浊浪排空”。</p>\n<p class=\"prose\">这首诗主要是写横江的地势险峻，气候多变，诗人以想象丰富奇伟的笔触，创造出雄伟壮阔的境界。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]横江：横江浦，是古代的长江渡口。<br>[2]道：一作“言”。<br>[3]三日：一作“一月”。</p>", "englishHtml": "<p class=\"poem-lines\">(I)</p>\n<p class=\"prose\">They say the Crosswise River good;<br>I say the Crosswise River rude.<br>If winds should blow three days,<br>E’en hills would be blown down,<br>And waves rise higher than the Temple[1]in the town.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The Temple was 240 feet in height,to the southwest of present-day Nanjing.</p>"}, {"num": "079", "zhTitle": "山中问答", "enTitle": "A Dialogue in the Mountain", "chinese": "问余[1]何意栖碧山，\n笑而不答心自闲。\n桃花流水窅然[2]去，\n别有天地非人间[3]。\n公元753年，李白曾在湖北省安陆市的碧山隐居读书，这首七言绝句可能是那时写的。第一句问得突兀，第二句以不答为答，显得轻松愉快、悠闲自得。第三句再写自然景象，表明心如桃花流水，悠然远去，可见诗人热爱自由。第四句“别有天地非人间”，可见诗人热爱自然超过尘世。后来南唐李煜的名句“流水落花春去也，天上人间”，可能得益于李白。但是白诗淡远，煜词沉痛，真是一个天上，一个人间了。\n注释：\n[1]余：我，诗人自指。\n[2]窅（yǎo）然：幽深遥远的样子。\n[3]非人间：这里指诗人的隐居生活。", "english": "I dwell among green hills and someone asks me why,\nMy mind carefree,I smile and give him no reply.\nPeach blossoms fallen on running water pass by,\nThis is an earthly paradise beneath the sky.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">问余[1]何意栖碧山，<br>笑而不答心自闲。<br>桃花流水窅然[2]去，<br>别有天地非人间[3]。</p>\n<p class=\"prose\">公元753年，李白曾在湖北省安陆市的碧山隐居读书，这首七言绝句可能是那时写的。第一句问得突兀，第二句以不答为答，显得轻松愉快、悠闲自得。第三句再写自然景象，表明心如桃花流水，悠然远去，可见诗人热爱自由。第四句“别有天地非人间”，可见诗人热爱自然超过尘世。</p>\n<p class=\"prose\">后来南唐李煜的名句“流水落花春去也，天上人间”，可能得益于李白。但是白诗淡远，煜词沉痛，真是一个天上，一个人间了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]余：我，诗人自指。<br>[2]窅（yǎo）然：幽深遥远的样子。<br>[3]非人间：这里指诗人的隐居生活。</p>", "englishHtml": "<p class=\"prose\">I dwell among green hills and someone asks me why,<br>My mind carefree,I smile and give him no reply.<br>Peach blossoms fallen on running water pass by,<br>This is an earthly paradise beneath the sky.</p>"}, {"num": "080", "zhTitle": "自遣", "enTitle": "Solitude", "chinese": "对酒[1]不觉暝，\n落花盈[2]我衣。\n醉起步溪月，\n鸟还人亦稀。\n如果说《山中问答》是写山居悠闲的乐趣，这首《自遣》就是山居生活的写照。第一句“对酒不觉暝”，说的是整日读书饮酒，不知不觉天就晚了，真是神仙生活，因为神仙不就是壶中天地大，书中日月长吗？第二句“落花盈我衣”，似乎是接着《山中问答》第三句“桃花流水窅然去”而言的，说桃花不但落在流水上，而且落满我一身，这不是成了桃花仙吗？第三句“醉起步溪月”，说不但落花有意于流水，诗人和明月也是一样流连忘返。最后一句“鸟还人亦稀”，是说鸟归人归，我独不归，这就是诗人与众不同的地方。因为“真”是自然规律的需要，“善”是社会规律的需要，两者都是客观需要，只有爱“美”是人的主观需要，表达了人的自由，表达了诗人高于万物的需求。\n注释：\n[1]对酒：与朋友对饮。\n[2]盈：洒满。", "english": "I’m drunk with wine\nAnd with moonshine,\nWith flowers fallen o’er the ground\nAnd o’er me the blue-gowned.\nSobered,I stroll along the stream\nWhose ripples gleam,\nI see not a bird\nAnd hear not a word.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">对酒[1]不觉暝，<br>落花盈[2]我衣。<br>醉起步溪月，<br>鸟还人亦稀。</p>\n<p class=\"prose\">如果说《山中问答》是写山居悠闲的乐趣，这首《自遣》就是山居生活的写照。第一句“对酒不觉暝”，说的是整日读书饮酒，不知不觉天就晚了，真是神仙生活，因为神仙不就是壶中天地大，书中日月长吗？第二句“落花盈我衣”，似乎是接着《山中问答》第三句“桃花流水窅然去”而言的，说桃花不但落在流水上，而且落满我一身，这不是成了桃花仙吗？</p>\n<p class=\"prose\">第三句“醉起步溪月”，说不但落花有意于流水，诗人和明月也是一样流连忘返。最后一句“鸟还人亦稀”，是说鸟归人归，我独不归，这就是诗人与众不同的地方。因为“真”是自然规律的需要，“善”是社会规律的需要，两者都是客观需要，只有爱“美”是人的主观需要，表达了人的自由，表达了诗人高于万物的需求。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]对酒：与朋友对饮。<br>[2]盈：洒满。</p>", "englishHtml": "<p class=\"prose\">I’m drunk with wine<br>And with moonshine,<br>With flowers fallen o’er the ground<br>And o’er me the blue-gowned.<br>Sobered,I stroll along the stream<br>Whose ripples gleam,<br>I see not a bird<br>And hear not a word.</p>"}, {"num": "081", "zhTitle": "独坐敬亭山", "enTitle": "Sitting Alone in Face of Peak Jingting", "chinese": "众鸟高飞尽，\n孤云独去闲[2]。\n相看两不厌[3]，\n只有敬亭山。\n《独坐敬亭山》是李白公元753年秋游宣城时写的一首小诗。第一句“众鸟高飞尽”先写众鸟之“动”，然后一个“尽”字却是静态；第二句“孤云独去闲”也是先写孤云之动，然后一个“闲”字表示静态。前两句都是以“动”衬“静”，以物喻人，“孤”和“闲”写的是云，其实也象征诗人的孤独和悠闲。后两句“相看两不厌，只有敬亭山”却是静态，写诗人对山有情，山对诗人也有情，这就把山人格化了。山有情可以反衬出权贵对诗人无情；诗人和山互相有情则是达到情景交融、“天人合一”的境界了。\n注释：\n[1]敬亭山：在今安徽省宣城市北。\n[2]闲：形容云彩飘来飘去，悠闲自在的样子。\n[3]厌：满足。", "english": "All birds have flown away,so high;\nA lonely cloud drifts on,so free.\nWe are not tired,the Peak and I,\nNor I of him,nor he of me.\n注释：\n[1]North of Xuancheng,in present-day Anhui Province.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">众鸟高飞尽，<br>孤云独去闲[2]。<br>相看两不厌[3]，<br>只有敬亭山。</p>\n<p class=\"prose\">《独坐敬亭山》是李白公元753年秋游宣城时写的一首小诗。第一句“众鸟高飞尽”先写众鸟之“动”，然后一个“尽”字却是静态；第二句“孤云独去闲”也是先写孤云之动，然后一个“闲”字表示静态。前两句都是以“动”衬“静”，以物喻人，“孤”和“闲”写的是云，其实也象征诗人的孤独和悠闲。</p>\n<p class=\"prose\">后两句“相看两不厌，只有敬亭山”却是静态，写诗人对山有情，山对诗人也有情，这就把山人格化了。山有情可以反衬出权贵对诗人无情；诗人和山互相有情则是达到情景交融、“天人合一”的境界了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]敬亭山：在今安徽省宣城市北。<br>[2]闲：形容云彩飘来飘去，悠闲自在的样子。<br>[3]厌：满足。</p>", "englishHtml": "<p class=\"prose\">All birds have flown away,so high;<br>A lonely cloud drifts on,so free.<br>We are not tired,the Peak and I,<br>Nor I of him,nor he of me.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]North of Xuancheng,in present-day Anhui Province.</p>"}, {"num": "082", "zhTitle": "宣州谢朓楼饯别校书叔云", "enTitle": "Farewell to Uncle Yun,the Imperial Librarian,at Xie Tiao’s Pavilion in Xuanzhou", "chinese": "弃我去者，\n昨日之日不可留；\n乱我心者，\n今日之日多烦忧。\n长风[4]万里送秋雁，\n对此可以酣高楼。\n蓬莱文章建安骨，\n中间小谢又清发。\n俱怀逸兴壮思飞，\n欲上青天揽明月。\n抽刀断水水更流，\n举杯消愁愁更愁。\n人生在世不称意，\n明朝散发[5]弄扁舟[6]。\n公元753年，李白和路过宣城的叔父李云在南齐太守谢脁修建的高楼上饮酒，写下了这首饯别诗。第一句的“昨日”，可能指唐玄宗“开元盛世”；第二句的“烦忧”，可能暗示杨国忠和安禄山等当权，使诗人报国无门，只能登楼饮酒。叔侄二人目送长风万里，秋雁南飞，诗人却不能乘风破浪，为国出力，不禁感慨系之，于是二人谈起蓬莱文章和建安风骨来。蓬莱指秘书省，而李云是秘书省校书，他的文章有《吊古战场文》；建安风骨则指曹植等的文风；小谢就是谢脁，其诗文清新秀发，李白非常欣赏。诗人虽然心怀豪情壮志，梦想飞天揽月，但是抽刀不能断水，只得借酒浇愁，不料却又愁上加愁了。人生在世，不如意的事太多，只好学孔子“道不行，乘桴浮于海”。\n注释：\n[1]宣州：今安徽省宣城市一带。\n[2]饯别：以酒食送行。\n[3]叔云：李白的叔叔李云。\n[4]长风：远风，大风。\n[5]散发（fà）：去冠披发，指隐居不仕。古人习惯束发，而散发表示闲适自在。\n[6]弄扁（piān）舟：乘小舟归隐江湖。", "english": "What left me yesterday\nCan be retained no more;\nWhat troubles me today\nAre the times for which I feel sore.\nIn autumn wind for miles and miles the wild geese fly.\nLet’s drink,in face of this,in the pavilion high.\nYour writing’s forcible like ancient poets while\nMine is in Junior Xie’s clear and spirited style.\nBoth of us have an ideal high:\nWe would reach the moon in the sky.\nCut running water with a sword,’twill faster flow;\nDrink wine to drown your sorrow,it will heavier grow.\nIf we despair of all human affairs,\nLet us roam in a boat with loosened hairs!\n注释：\n[1]Xie Tiao or Junior Xie(464–499)was a poet of the Jin Dynasty,who built a pavilion or the North Tower in Xuanzhou(present-day Xuancheng in Anhui Province).", "poemType": "七言古诗", "chineseHtml": "<p class=\"poem-lines\">弃我去者，<br>昨日之日不可留；<br>乱我心者，<br>今日之日多烦忧。<br>长风[4]万里送秋雁，<br>对此可以酣高楼。<br>蓬莱文章建安骨，<br>中间小谢又清发。<br>俱怀逸兴壮思飞，<br>欲上青天揽明月。<br>抽刀断水水更流，<br>举杯消愁愁更愁。<br>人生在世不称意，<br>明朝散发[5]弄扁舟[6]。</p>\n<p class=\"prose\">公元753年，李白和路过宣城的叔父李云在南齐太守谢脁修建的高楼上饮酒，写下了这首饯别诗。第一句的“昨日”，可能指唐玄宗“开元盛世”；第二句的“烦忧”，可能暗示杨国忠和安禄山等当权，使诗人报国无门，只能登楼饮酒。叔侄二人目送长风万里，秋雁南飞，诗人却不能乘风破浪，为国出力，不禁感慨系之，于是二人谈起蓬莱文章和建安风骨来。</p>\n<p class=\"prose\">蓬莱指秘书省，而李云是秘书省校书，他的文章有《吊古战场文》；建安风骨则指曹植等的文风；小谢就是谢脁，其诗文清新秀发，李白非常欣赏。诗人虽然心怀豪情壮志，梦想飞天揽月，但是抽刀不能断水，只得借酒浇愁，不料却又愁上加愁了。人生在世，不如意的事太多，只好学孔子“道不行，乘桴浮于海”。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]宣州：今安徽省宣城市一带。<br>[2]饯别：以酒食送行。<br>[3]叔云：李白的叔叔李云。<br>[4]长风：远风，大风。<br>[5]散发（fà）：去冠披发，指隐居不仕。古人习惯束发，而散发表示闲适自在。<br>[6]弄扁（piān）舟：乘小舟归隐江湖。</p>", "englishHtml": "<p class=\"prose\">What left me yesterday<br>Can be retained no more;<br>What troubles me today<br>Are the times for which I feel sore.<br>In autumn wind for miles and miles the wild geese fly.<br>Let’s drink,in face of this,in the pavilion high.<br>Your writing’s forcible like ancient poets while<br>Mine is in Junior Xie’s clear and spirited style.<br>Both of us have an ideal high:<br>We would reach the moon in the sky.<br>Cut running water with a sword,’twill faster flow;<br>Drink wine to drown your sorrow,it will heavier grow.<br>If we despair of all human affairs,<br>Let us roam in a boat with loosened hairs!</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Xie Tiao or Junior Xie(464–499)was a poet of the Jin Dynasty,who built a pavilion or the North Tower in Xuanzhou(present-day Xuancheng in Anhui Province).</p>"}, {"num": "083", "zhTitle": "秋登宣城谢朓北楼", "enTitle": "On Ascending the North Tower One Autumn Day", "chinese": "江城[1]如画里，\n山晚望晴空。\n两水[2]夹明镜[3]，\n双桥[4]落彩虹[5]。\n人烟寒橘柚，\n秋色老梧桐。\n谁念北楼上，\n临风怀谢公？\n本诗作于公元753年秋天。李白在长安为权贵所排挤，弃官而去后，一直过着漂泊不定的生活。当秋风摇落的时节，诗人内心的抑郁和感伤是可以想象的。如诗如画的宣城，一个晴朗的秋天的傍晚，诗人独自登上了谢公楼。一片晴空之中，河水如镜，长桥如虹。橘柚在袅袅炊烟的映衬之下越发苍寒，梧桐在秋色笼罩下也显得越发苍凉。苍凉旷达的意境显现出来，更写出了诗人内心理想无法实现的惆怅、落寞。最后点明怀念谢脁，抒发了对先贤的追慕之情，同时抒发自己理想难以实现的感慨。\n注释：\n[1]江城：水边的城，这里指宣城。\n[2]两水：指宛溪与句溪。\n[3]明镜：指拱桥桥洞和与其倒影在水中合成的圆形，像明亮的镜子一样。\n[4]双桥：指凤凰桥与济川桥。\n[5]彩虹：指水中的桥影。", "english": "The scroll-like River-town’s steeped in twilight,\nIn view of mountains’neath a lucid sky.\nTwo rivers,mingling,form a mirror bright;\nTwo bridges like rainbows fallen from on high.\nThe cottage smoke has chilled the orange flower;\nThe autumn hue has oldened parasol trees.\nWho ever dreamed I’d come up Northern Tower\nTo meditate on Xie in western breeze?", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">江城[1]如画里，<br>山晚望晴空。<br>两水[2]夹明镜[3]，<br>双桥[4]落彩虹[5]。<br>人烟寒橘柚，<br>秋色老梧桐。<br>谁念北楼上，<br>临风怀谢公？</p>\n<p class=\"prose\">本诗作于公元753年秋天。李白在长安为权贵所排挤，弃官而去后，一直过着漂泊不定的生活。当秋风摇落的时节，诗人内心的抑郁和感伤是可以想象的。如诗如画的宣城，一个晴朗的秋天的傍晚，诗人独自登上了谢公楼。一片晴空之中，河水如镜，长桥如虹。</p>\n<p class=\"prose\">橘柚在袅袅炊烟的映衬之下越发苍寒，梧桐在秋色笼罩下也显得越发苍凉。苍凉旷达的意境显现出来，更写出了诗人内心理想无法实现的惆怅、落寞。最后点明怀念谢脁，抒发了对先贤的追慕之情，同时抒发自己理想难以实现的感慨。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]江城：水边的城，这里指宣城。<br>[2]两水：指宛溪与句溪。<br>[3]明镜：指拱桥桥洞和与其倒影在水中合成的圆形，像明亮的镜子一样。<br>[4]双桥：指凤凰桥与济川桥。<br>[5]彩虹：指水中的桥影。</p>", "englishHtml": "<p class=\"prose\">The scroll-like River-town’s steeped in twilight,<br>In view of mountains’neath a lucid sky.<br>Two rivers,mingling,form a mirror bright;<br>Two bridges like rainbows fallen from on high.<br>The cottage smoke has chilled the orange flower;<br>The autumn hue has oldened parasol trees.<br>Who ever dreamed I’d come up Northern Tower<br>To meditate on Xie in western breeze?</p>"}, {"num": "084", "zhTitle": "送友人", "enTitle": "Farewell to a Friend", "chinese": "青山横北郭[1]，\n白水[2]绕东城。\n此地一为别，\n孤蓬[3]万里征。\n浮云游子意，\n落日故人情。\n挥手自兹去，\n萧萧[4]班马[5]鸣。\n这是一首充满诗情画意的送别诗。第一联“青山”对“白水”，静态的“横”对动态的“绕”，“北郭”又对“东城”，对仗工丽，别开生面。第二联说友人就要像蓬草一样漂泊万里了，离情依依。第三联“浮云”象征友人行踪不定，“落日”徐徐西下，暗示诗人不忍离别之心；青山绿水，白云红日，色彩绚丽，富有画意。第四联“挥手”又以动态入画，“萧萧”马鸣之声入耳，更是有声有色，余音久久不绝。这首五言律诗有景有情，情景交融，扣人心弦。\n注释：\n[1]郭：古代在城外修筑的一种外墙。\n[2]白水：清澈的水。\n[3]孤蓬：此处诗人指远行的朋友；蓬：古书上说的一种植物，干枯后根株断开，遇风飞旋。此处比喻远行的朋友。\n[4]萧萧：马的呻吟嘶叫声。\n[5]班马：离群的马，这里指载人远离的马。", "english": "Green mountains bar the northern sky;\nWhite water girds the eastern town.\nHere is the place to say goodbye,\nYou’ll drift out,lonely thistledown.\nLike floating cloud you’ll float away;\nWith parting day I’ll part from you.\nWe wave and you start on your way,\nYour horse still neighs:“Adieu!Adieu!”", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">青山横北郭[1]，<br>白水[2]绕东城。<br>此地一为别，<br>孤蓬[3]万里征。<br>浮云游子意，<br>落日故人情。<br>挥手自兹去，<br>萧萧[4]班马[5]鸣。</p>\n<p class=\"prose\">这是一首充满诗情画意的送别诗。第一联“青山”对“白水”，静态的“横”对动态的“绕”，“北郭”又对“东城”，对仗工丽，别开生面。第二联说友人就要像蓬草一样漂泊万里了，离情依依。第三联“浮云”象征友人行踪不定，“落日”徐徐西下，暗示诗人不忍离别之心；</p>\n<p class=\"prose\">青山绿水，白云红日，色彩绚丽，富有画意。第四联“挥手”又以动态入画，“萧萧”马鸣之声入耳，更是有声有色，余音久久不绝。这首五言律诗有景有情，情景交融，扣人心弦。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]郭：古代在城外修筑的一种外墙。<br>[2]白水：清澈的水。<br>[3]孤蓬：此处诗人指远行的朋友；蓬：古书上说的一种植物，干枯后根株断开，遇风飞旋。此处比喻远行的朋友。<br>[4]萧萧：马的呻吟嘶叫声。<br>[5]班马：离群的马，这里指载人远离的马。</p>", "englishHtml": "<p class=\"prose\">Green mountains bar the northern sky;<br>White water girds the eastern town.<br>Here is the place to say goodbye,<br>You’ll drift out,lonely thistledown.<br>Like floating cloud you’ll float away;<br>With parting day I’ll part from you.<br>We wave and you start on your way,<br>Your horse still neighs:“Adieu!Adieu!”</p>"}, {"num": "085", "zhTitle": "秋浦歌", "enTitle": "Songs of Autumn Pool", "chinese": "（十七首其十四）\n炉火[2]照天地，\n红星乱紫烟。\n赧郎[3]明月夜，\n歌曲动寒川。\n李白从宣城到秋浦来游山玩水，写了17首《秋浦歌》，这里选的第14首。秋浦是唐代银和铜的产地之一，这是一首正面描写和歌颂冶炼工人的诗歌，因在古代诗歌中非常少见而极为可贵。秋浦寂静的月色中，冶炼厂的炉火燃起来了，飞溅的火星闪烁在被冲天的火光照成紫色的烟当中。炉火映红了人们的脸，照亮了周围的夜。工人的歌声震撼着寂静的大地，也震荡着寒冷的水面。在诗人如神的笔下，光、热、声、色，明与暗、冷与热、动与静交相辉映，共同交织成一幅瑰丽壮观的画面，生动地再现了热火朝天的劳动场景，绘声绘色地塑造了古代冶炼劳动者的形象。\n注释：\n[1]秋浦：县名，唐时先属宣州，后属池州，在今安徽省池州市贵池县西。秋浦因流经县城之西的秋浦河得名。\n[2]炉火：指炼铜之炉火。\n[3]赧（nǎn）郎：红脸汉。此指炼铜工人；赧：原指因羞愧而脸红，此处形容脸被炉火所映红。", "english": "(XIV)\nThe furnace fire makes bright the earth and sky,\nInto the purple smoke red sparks wild fly.\nThe blacksmiths’faces flush in moonlit night,\nTheir songs would fill the river cold with fright.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">（十七首其十四）<br>炉火[2]照天地，<br>红星乱紫烟。<br>赧郎[3]明月夜，<br>歌曲动寒川。</p>\n<p class=\"prose\">李白从宣城到秋浦来游山玩水，写了17首《秋浦歌》，这里选的第14首。秋浦是唐代银和铜的产地之一，这是一首正面描写和歌颂冶炼工人的诗歌，因在古代诗歌中非常少见而极为可贵。秋浦寂静的月色中，冶炼厂的炉火燃起来了，飞溅的火星闪烁在被冲天的火光照成紫色的烟当中。</p>\n<p class=\"prose\">炉火映红了人们的脸，照亮了周围的夜。工人的歌声震撼着寂静的大地，也震荡着寒冷的水面。在诗人如神的笔下，光、热、声、色，明与暗、冷与热、动与静交相辉映，共同交织成一幅瑰丽壮观的画面，生动地再现了热火朝天的劳动场景，绘声绘色地塑造了古代冶炼劳动者的形象。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]秋浦：县名，唐时先属宣州，后属池州，在今安徽省池州市贵池县西。秋浦因流经县城之西的秋浦河得名。<br>[2]炉火：指炼铜之炉火。<br>[3]赧（nǎn）郎：红脸汉。此指炼铜工人；赧：原指因羞愧而脸红，此处形容脸被炉火所映红。</p>", "englishHtml": "<p class=\"poem-lines\">(XIV)</p>\n<p class=\"prose\">The furnace fire makes bright the earth and sky,<br>Into the purple smoke red sparks wild fly.<br>The blacksmiths’faces flush in moonlit night,<br>Their songs would fill the river cold with fright.</p>"}, {"num": "086", "zhTitle": "秋浦歌", "enTitle": "Songs of Autumn Pool", "chinese": "（十七首其十五）\n白发三千丈，\n缘愁似个[1]长。\n不知明镜里，\n何处得秋霜[2]？\n这一首是以夸张闻名的典型。第一句“白发三千丈”劈空而来，使人如见丈二金刚，摸不着头脑。第二句“缘愁似个长”点明，原来是忧愁使白发变得这样长的。那忧愁该有多么深重啊！诗人揽镜自照，大吃一惊，这哪里是满头白发，分明是饱经风霜的衰草嘛！这秋霜又是从哪里得来的呢？全诗戛然而止，发人深思，使人想起诗人饱经风霜的一生。\n注释：\n[1]个：如此，这般。\n[2]秋霜：形容人的头发花白，宛如秋霜。", "english": "(XV)\nMy whitened hair would make a long,long cord,\nAs long as I am often bored.\nI know not how the mirror bright\nReflects a head with hoarfrost white.[1]\n注释：\n[1]with hoarfrost white=white with hoarfrost.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">（十七首其十五）<br>白发三千丈，<br>缘愁似个[1]长。<br>不知明镜里，<br>何处得秋霜[2]？</p>\n<p class=\"prose\">这一首是以夸张闻名的典型。第一句“白发三千丈”劈空而来，使人如见丈二金刚，摸不着头脑。第二句“缘愁似个长”点明，原来是忧愁使白发变得这样长的。那忧愁该有多么深重啊！诗人揽镜自照，大吃一惊，这哪里是满头白发，分明是饱经风霜的衰草嘛！</p>\n<p class=\"prose\">这秋霜又是从哪里得来的呢？全诗戛然而止，发人深思，使人想起诗人饱经风霜的一生。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]个：如此，这般。<br>[2]秋霜：形容人的头发花白，宛如秋霜。</p>", "englishHtml": "<p class=\"poem-lines\">(XV)</p>\n<p class=\"prose\">My whitened hair would make a long,long cord,<br>As long as I am often bored.<br>I know not how the mirror bright<br>Reflects a head with hoarfrost white.[1]</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]with hoarfrost white=white with hoarfrost.</p>"}, {"num": "087", "zhTitle": "赠汪伦", "enTitle": "To Wang Lun Who Comes to Bid Me Farewell", "chinese": "李白乘舟将欲行，\n忽闻岸上踏歌[1]声。\n桃花潭[2]水深千尺[3]，\n不及汪伦送我情。\n《赠汪伦》是李白赠别诗中传诵最广的一首。据说汪伦写信给李白说：“先生好游乎？此地有十里桃花；先生好酒乎？此地有万家酒店。”李白欣然而来，汪伦却笑着说：“十里桃花是十里外的桃花潭，万家酒店是姓万的人开的酒店。”李白听了大笑。游完桃花潭后，李白正要离去，忽然汪伦同村人手拉着手，脚步踏着拍子来送行了。于是李白又用夸张手法，写下了这首像说话一般自然的好诗。\n注释：\n[1]踏歌：唐代民间流行的一种手拉手、边走边唱的歌舞形式。\n[2]桃花潭：在今安徽省宣城市泾县西南一百里。\n[3]深千尺：诗人用深千尺的潭水比喻汪伦与他的友情，运用了夸张的手法。", "english": "I,Li Bai sit aboard a ship about to go,\nWhen suddenly on shore footsteps and songs o’erflow.\nThe Lake of Peach Blossom is a thousand fathoms deep,\nBut not so deep as the friendship Wang Lun and I keep.", "poemType": "诗", "chineseHtml": "<p class=\"prose\">李白乘舟将欲行，忽闻岸上踏歌[1]声。桃花潭[2]水深千尺[3]，不及汪伦送我情。《赠汪伦》是李白赠别诗中传诵最广的一首。据说汪伦写信给李白说：“先生好游乎？此地有十里桃花；先生好酒乎？此地有万家酒店。”李白欣然而来，汪伦却笑着说：“十里桃花是十里外的桃花潭，万家酒店是姓万的人开的酒店。”</p>\n<p class=\"prose\">李白听了大笑。游完桃花潭后，李白正要离去，忽然汪伦同村人手拉着手，脚步踏着拍子来送行了。于是李白又用夸张手法，写下了这首像说话一般自然的好诗。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]踏歌：唐代民间流行的一种手拉手、边走边唱的歌舞形式。<br>[2]桃花潭：在今安徽省宣城市泾县西南一百里。<br>[3]深千尺：诗人用深千尺的潭水比喻汪伦与他的友情，运用了夸张的手法。</p>", "englishHtml": "<p class=\"prose\">I,Li Bai sit aboard a ship about to go,<br>When suddenly on shore footsteps and songs o’erflow.<br>The Lake of Peach Blossom is a thousand fathoms deep,<br>But not so deep as the friendship Wang Lun and I keep.</p>"}, {"num": "088", "zhTitle": "哭晁卿衡", "enTitle": "Elegy on Abe Nakamaro", "chinese": "日本晁卿辞帝都，\n征帆一片绕蓬壶[2]。\n明月[3]不归沉碧海[4]，\n白云愁色满苍梧[5]。\n此诗是公元754年，李白听闻晁衡（日本人阿倍仲麻吕）归国时遇暴风失事的消息后所作。诗人以友人的身份，听闻晁卿如同明月沉大海一去不返，顿觉连苍梧山都被愁云笼罩。此诗虽因误传噩耗而作，但悲痛之情是真实而且深挚的，表现了两人超越国界的深厚友谊。\n注释：\n[1]晁卿衡：即晁衡，日本人，原名阿倍仲麻吕（又作安倍仲麻吕）。公元717年（日本灵龟二年，唐开元五年），来中国求学，后改名为晁衡。\n[2]蓬壶：指蓬莱、方壶，都是神话传说中东方大海上的仙山。此处喻为晁衡在东海中航行。\n[3]明月：形容品德高洁才华出众之士。\n[4]沉碧海：此处指溺死海中。\n[5]苍梧：九嶷山，此指传说中东北海中的郁州山（郁洲山）。", "english": "My Japanese friend Abe left the imperial shore,\nHis single sail turned round for the three Fairy Isles.\nThe moon has sunk in the sea to return no more,\nThe land’s o’erspread with gloomy clouds for miles and miles.\n注释：\n[1]Abe Nakamaro came to China(referred to as the imperial shore in this poem)in 717 at the age of 20 and did not return to Japan(referred to as the three Fairy Isles)till the winter of 753.It was rumoured that he(referred to as the moon)was drowned in the sea and Li Bai wrote this poem.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">日本晁卿辞帝都，<br>征帆一片绕蓬壶[2]。<br>明月[3]不归沉碧海[4]，<br>白云愁色满苍梧[5]。</p>\n<p class=\"prose\">此诗是公元754年，李白听闻晁衡（日本人阿倍仲麻吕）归国时遇暴风失事的消息后所作。诗人以友人的身份，听闻晁卿如同明月沉大海一去不返，顿觉连苍梧山都被愁云笼罩。此诗虽因误传噩耗而作，但悲痛之情是真实而且深挚的，表现了两人超越国界的深厚友谊。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]晁卿衡：即晁衡，日本人，原名阿倍仲麻吕（又作安倍仲麻吕）。公元717年（日本灵龟二年，唐开元五年），来中国求学，后改名为晁衡。<br>[2]蓬壶：指蓬莱、方壶，都是神话传说中东方大海上的仙山。此处喻为晁衡在东海中航行。<br>[3]明月：形容品德高洁才华出众之士。<br>[4]沉碧海：此处指溺死海中。<br>[5]苍梧：九嶷山，此指传说中东北海中的郁州山（郁洲山）。</p>", "englishHtml": "<p class=\"prose\">My Japanese friend Abe left the imperial shore,<br>His single sail turned round for the three Fairy Isles.<br>The moon has sunk in the sea to return no more,<br>The land’s o’erspread with gloomy clouds for miles and miles.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Abe Nakamaro came to China(referred to as the imperial shore in this poem)in 717 at the age of 20 and did not return to Japan(referred to as the three Fairy Isles)till the winter of 753.It was rumoured that he(referred to as the moon)was drowned in the sea and Li Bai wrote this poem.</p>"}, {"num": "089", "zhTitle": "永王东巡歌", "enTitle": "Song of Eastern Expedition of Prince Yong", "chinese": "（十一首其二）\n三川[1]北虏[2]乱如麻，\n四海南奔似永嘉。\n但用东山[3]谢安石，\n为君谈笑静胡沙。\n《永王东巡歌》作于公元757年，李白随永王李璘水师东下浔阳之时，现存11首。洛阳沦陷后一片混乱，士人争相躲避江东。诗人以谢安自居，自谓在国家大难当头时，希望像谢安一样从容镇静地破敌除患，希望永王重用自己。诗人在诗中表现的是爱国志士的热诚，对遭受战火的百姓的同情。虽然，他想做谢安那样的儒将，从容应敌，决胜千里，是不现实的，甚至是幼稚的，却成就了他豪迈的浪漫主义风格。\n注释：\n[1]三川：指河、洛、伊三川，于今河南省洛阳市。\n[2]北虏：指安禄山叛军。\n[3]东山：谢安隐居处。", "english": "(II)\nThree River Valleys overrun by Northern foes,\nPeople within four seas flee to the Southern land.\nIf Master Xie[1]again from Eastern Mountain rose,\nHe’d quell with ease the rebels as he’d sprinkle sand.\n注释：\n[1]Xie An fought against heavy odds and won victory in 382.Here the poet alluded to him self.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">（十一首其二）<br>三川[1]北虏[2]乱如麻，<br>四海南奔似永嘉。<br>但用东山[3]谢安石，<br>为君谈笑静胡沙。</p>\n<p class=\"prose\">《永王东巡歌》作于公元757年，李白随永王李璘水师东下浔阳之时，现存11首。洛阳沦陷后一片混乱，士人争相躲避江东。诗人以谢安自居，自谓在国家大难当头时，希望像谢安一样从容镇静地破敌除患，希望永王重用自己。诗人在诗中表现的是爱国志士的热诚，对遭受战火的百姓的同情。</p>\n<p class=\"prose\">虽然，他想做谢安那样的儒将，从容应敌，决胜千里，是不现实的，甚至是幼稚的，却成就了他豪迈的浪漫主义风格。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]三川：指河、洛、伊三川，于今河南省洛阳市。<br>[2]北虏：指安禄山叛军。<br>[3]东山：谢安隐居处。</p>", "englishHtml": "<p class=\"poem-lines\">(II)</p>\n<p class=\"prose\">Three River Valleys overrun by Northern foes,<br>People within four seas flee to the Southern land.<br>If Master Xie[1]again from Eastern Mountain rose,<br>He’d quell with ease the rebels as he’d sprinkle sand.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Xie An fought against heavy odds and won victory in 382.Here the poet alluded to him self.</p>"}, {"num": "090", "zhTitle": "与史郎中钦听黄鹤楼上吹笛", "enTitle": "On Hearing the Flute in Yellow Crane Tower", "chinese": "一为迁客[2]去长沙[3]，\n西望长安不见家。\n黄鹤楼中吹玉笛，\n江城[4]五月落梅花。\n李白于公元758年流放夜郎经过武昌时，游黄鹤楼，写下此诗。诗人先引贾谊为同调，用贾谊的不幸来比喻自身的遭遇，对自己的无辜受害表示忧愤。长安远在万里之外，那里已经没有家了，去路茫茫，不知前方有什么在等待着，诗人不免感到惆怅，这时响起的笛声使他感到格外凄凉，仿佛五月的江城落满了梅花。诗人巧借笛声来渲染愁情。时值初夏，诗人听见《梅花落》犹如置身漫天飘落的梅花之中，不觉寒气凛凛，正是诗人心情冷落的写照，传神地表达了怀念帝都之情和“望”而“不见”的愁苦。\n注释：\n[1]郎中：官名，为朝廷各部所属的高级部员。\n[2]迁客：被贬谪之人。\n[3]去长沙：此处指贾谊因受权臣谗毁，贬为长沙王太傅之事。\n[4]江城：指江夏（今湖北省武汉市武昌区），因在长江、汉水滨，故称江城。", "english": "Since I was banished to the riverside town,\nLooking westward,I’ve found no house I’d call my own.\nHearing in Yellow Crane Tower the flute’s sad tune,\nI seem to see mume blossoms fall in the fifth moon.[1]\n注释：\n[1]The mume blossoms blow in winter or spring,not in summer(the fifth moon).Hearing the flute,the poet became so sad as to take summer for winter.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">一为迁客[2]去长沙[3]，<br>西望长安不见家。<br>黄鹤楼中吹玉笛，<br>江城[4]五月落梅花。</p>\n<p class=\"prose\">李白于公元758年流放夜郎经过武昌时，游黄鹤楼，写下此诗。诗人先引贾谊为同调，用贾谊的不幸来比喻自身的遭遇，对自己的无辜受害表示忧愤。长安远在万里之外，那里已经没有家了，去路茫茫，不知前方有什么在等待着，诗人不免感到惆怅，这时响起的笛声使他感到格外凄凉，仿佛五月的江城落满了梅花。</p>\n<p class=\"prose\">诗人巧借笛声来渲染愁情。时值初夏，诗人听见《梅花落》犹如置身漫天飘落的梅花之中，不觉寒气凛凛，正是诗人心情冷落的写照，传神地表达了怀念帝都之情和“望”而“不见”的愁苦。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]郎中：官名，为朝廷各部所属的高级部员。<br>[2]迁客：被贬谪之人。<br>[3]去长沙：此处指贾谊因受权臣谗毁，贬为长沙王太傅之事。<br>[4]江城：指江夏（今湖北省武汉市武昌区），因在长江、汉水滨，故称江城。</p>", "englishHtml": "<p class=\"prose\">Since I was banished to the riverside town,<br>Looking westward,I’ve found no house I’d call my own.<br>Hearing in Yellow Crane Tower the flute’s sad tune,<br>I seem to see mume blossoms fall in the fifth moon.[1]</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The mume blossoms blow in winter or spring,not in summer(the fifth moon).Hearing the flute,the poet became so sad as to take summer for winter.</p>"}, {"num": "091", "zhTitle": "早发白帝城", "enTitle": "Leaving the White Emperor Townfor Jiangling", "chinese": "朝辞白帝彩云间[2]，\n千里江陵[3]一日还。\n两岸猿声啼不住，\n轻舟已过万重山[4]。\n公元758年，李白因为支持永王而被流放夜郎，船在长江逆流而上，几乎走了一年。他到白帝城时，忽然遇赦返回江陵，喜出望外，写了这首快诗：一是船快，二是心情愉快。“朝辞白帝”是和白帝城告别，也是和过去告别，心情舒畅；“彩云间”既写城高，又写心情好，看云也美，白帝城成了“仙居”。“千里江陵一日还”用空间之远和时间之短对比，显得船行“神速”。猿鹤本是“仙侣”，原为沉船哀啼，李白遇赦听来，却似乎是在和过去告别。最后一句的“轻舟”暗示卸下心头重担，“万重山”一过，前途就是“天路”般的康庄大道了。“仙居”“神速”“仙侣”“天路”，使这首七言绝句成了仙气洋溢的“谪仙诗”。\n注释：\n[1]发：启程。\n[2]彩云间：因白帝城在白帝山上，地势高耸，从山下江中仰望，仿佛耸入云间。\n[3]江陵：今湖北荆州市。\n[4]万重山：层层叠叠的山；万重：形容数目之多。", "english": "Leaving at dawn the White Emperor crowned with cloud,\nI’ve sailed a thousand li through Canyons in a day.\nWith monkeys’sad adieux the riverbanks are loud;\nMy skiff has left ten thousand mountains far away.\n注释：\n[1]In present-day Sichuan Province.\n[2]In present-day Hubei Province.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">朝辞白帝彩云间[2]，<br>千里江陵[3]一日还。<br>两岸猿声啼不住，<br>轻舟已过万重山[4]。</p>\n<p class=\"prose\">公元758年，李白因为支持永王而被流放夜郎，船在长江逆流而上，几乎走了一年。他到白帝城时，忽然遇赦返回江陵，喜出望外，写了这首快诗：一是船快，二是心情愉快。“朝辞白帝”是和白帝城告别，也是和过去告别，心情舒畅；“彩云间”既写城高，又写心情好，看云也美，白帝城成了“仙居”。</p>\n<p class=\"prose\">“千里江陵一日还”用空间之远和时间之短对比，显得船行“神速”。猿鹤本是“仙侣”，原为沉船哀啼，李白遇赦听来，却似乎是在和过去告别。最后一句的“轻舟”暗示卸下心头重担，“万重山”一过，前途就是“天路”般的康庄大道了。“仙居”“神速”“仙侣”“天路”，使这首七言绝句成了仙气洋溢的“谪仙诗”。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]发：启程。<br>[2]彩云间：因白帝城在白帝山上，地势高耸，从山下江中仰望，仿佛耸入云间。<br>[3]江陵：今湖北荆州市。<br>[4]万重山：层层叠叠的山；万重：形容数目之多。</p>", "englishHtml": "<p class=\"prose\">Leaving at dawn the White Emperor crowned with cloud,<br>I’ve sailed a thousand li through Canyons in a day.<br>With monkeys’sad adieux the riverbanks are loud;<br>My skiff has left ten thousand mountains far away.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Sichuan Province.<br>[2]In present-day Hubei Province.</p>"}, {"num": "092", "zhTitle": "与夏十二登岳阳楼", "enTitle": "Ascending the Tower of Yueyangwith Xia the Twelfth", "chinese": "楼观岳阳[2]尽，\n川迥洞庭开。\n雁引愁心去，\n山衔好月来。\n云间连下榻，\n天上接行杯。\n醉后凉风起，\n吹人舞袖回[3]。\n公元759年，李白到江陵后，南游岳阳，同他的朋友夏十二（排行十二）登上了岳阳楼。凭栏远望，天岳山南无边景色尽收眼底，河水流向洞庭湖，浩荡开阔，汪洋无际。秋雁高飞，带走了诗人忧愁之心；月出山口，仿佛是高山吐出了明月。在岳阳楼上饮酒，潇洒自如！全诗没写一个高字，只从周围景物的浩渺、开阔、高耸落笔，无处不显得楼高，同时写出了诗人的超脱豁达、豪情逸志。\n注释：\n[1]夏十二：李白的朋友，因在家中排行十二，故称夏十二。\n[2]岳阳：今湖南省岳阳市，以在天岳山之南，故名。\n[3]回：回荡，摆动。", "english": "On scenes so vast the Tower feasts our eye;\nThe river stretches into the Lake of South.[2]\nTaking away our sorrow,wild geese fly;\nGreen mountains throw the moon up from their mouth.\nMake of white cloud a comfortable bed,\nAnd pass around wine cups in azure skies.\nDrunken,let cooling breezes blow and spread\nOur dancing sleeves which flap like butterflies.\n注释：\n[1]In Hunan Province.\n[2]The Dongting Lake.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">楼观岳阳[2]尽，<br>川迥洞庭开。<br>雁引愁心去，<br>山衔好月来。<br>云间连下榻，<br>天上接行杯。<br>醉后凉风起，<br>吹人舞袖回[3]。</p>\n<p class=\"prose\">公元759年，李白到江陵后，南游岳阳，同他的朋友夏十二（排行十二）登上了岳阳楼。凭栏远望，天岳山南无边景色尽收眼底，河水流向洞庭湖，浩荡开阔，汪洋无际。秋雁高飞，带走了诗人忧愁之心；月出山口，仿佛是高山吐出了明月。在岳阳楼上饮酒，潇洒自如！</p>\n<p class=\"prose\">全诗没写一个高字，只从周围景物的浩渺、开阔、高耸落笔，无处不显得楼高，同时写出了诗人的超脱豁达、豪情逸志。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]夏十二：李白的朋友，因在家中排行十二，故称夏十二。<br>[2]岳阳：今湖南省岳阳市，以在天岳山之南，故名。<br>[3]回：回荡，摆动。</p>", "englishHtml": "<p class=\"prose\">On scenes so vast the Tower feasts our eye;<br>The river stretches into the Lake of South.[2]<br>Taking away our sorrow,wild geese fly;<br>Green mountains throw the moon up from their mouth.<br>Make of white cloud a comfortable bed,<br>And pass around wine cups in azure skies.<br>Drunken,let cooling breezes blow and spread<br>Our dancing sleeves which flap like butterflies.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In Hunan Province.<br>[2]The Dongting Lake.</p>"}, {"num": "093", "zhTitle": "陪族叔刑部侍郎晔及中书贾舍人至游洞庭", "enTitle": "On Lake Dongting", "chinese": "（五首其二）\n南湖[1]秋水夜无烟，\n耐可[2]乘流直上天？\n且[3]就洞庭赊月色，\n将船买酒白云边。\n此诗为公元759年李白与李晔和贾至同游洞庭时所作。全组共五首，这一首最为出色。清澈的夜里，湖光山色，粼粼水波似乎直通天上银河。丰富浪漫的想象，夸张的表述，好一幅洞庭秋夜。月色如许，这样的境界下，最易使人忘怀。暂且就着湖里的月色倒影，当作是泛舟天上，像神仙一样在云边沽酒。诗人即景发兴，酣畅淋漓，好似一幅浓墨泼就的山水画。\n注释：\n[1]南湖：指洞庭湖。因在长江之南，故称南湖。\n[2]耐可：哪可，怎么能够。\n[3]且：姑且。", "english": "(II)\nVaporless is the Southern Lake on autumn night.\nCould we be borne to Heaven by the rising tide?\nIf we could borrow from Lake Dongting the moonlight\nTo guide us skyward,we’d drink with clouds by our side.\n注释：\n[1]In Hunan Province.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">（五首其二）<br>南湖[1]秋水夜无烟，<br>耐可[2]乘流直上天？<br>且[3]就洞庭赊月色，<br>将船买酒白云边。</p>\n<p class=\"prose\">此诗为公元759年李白与李晔和贾至同游洞庭时所作。全组共五首，这一首最为出色。清澈的夜里，湖光山色，粼粼水波似乎直通天上银河。丰富浪漫的想象，夸张的表述，好一幅洞庭秋夜。月色如许，这样的境界下，最易使人忘怀。暂且就着湖里的月色倒影，当作是泛舟天上，像神仙一样在云边沽酒。</p>\n<p class=\"prose\">诗人即景发兴，酣畅淋漓，好似一幅浓墨泼就的山水画。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]南湖：指洞庭湖。因在长江之南，故称南湖。<br>[2]耐可：哪可，怎么能够。<br>[3]且：姑且。</p>", "englishHtml": "<p class=\"poem-lines\">(II)</p>\n<p class=\"prose\">Vaporless is the Southern Lake on autumn night.<br>Could we be borne to Heaven by the rising tide?<br>If we could borrow from Lake Dongting the moonlight<br>To guide us skyward,we’d drink with clouds by our side.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In Hunan Province.</p>"}, {"num": "094", "zhTitle": "江上吟", "enTitle": "Song on the River", "chinese": "木兰[1]之枻[2]沙棠舟，\n玉箫金管坐两头。\n美酒樽[3]中置千斛[4]，\n载妓随波任去留。\n仙人有待乘黄鹤，\n海客[5]无心随白鸥。\n屈平[6]词赋悬日月，\n楚王台榭空山丘。\n兴酣[7]落笔摇五岳，\n诗成笑傲凌沧洲。\n功名富贵若长在，\n汉水[8]亦应西北流。\n此诗为公元743年李白游江夏时所作。这首诗以江上的遨游起兴，表现了诗人对庸俗、局促的现实的蔑弃，和对自由、美好的生活理想的追求。诗人以屈原自比，抒发胸臆，末尾带着嘲弄的意味，说明富贵功名都是尘俗之物不可能长久。诗人追求的是一种自由的、超脱了世俗功利的生活。\n注释：\n[1]木兰：即辛夷，香木名。\n[2]枻（yì）：同“楫”，舟旁划水的工具，即船桨。\n[3]樽：盛酒的器具。\n[4]千斛：形容船中置酒极多；斛：古时十斗为一斛。\n[5]海客：海边的人。\n[6]屈平：指屈原，名平，战国末期楚国大诗人。\n[7]兴酣：诗兴浓烈。\n[8]汉水：发源于陕西省汉中市宁强县，东南流经湖北省襄阳市，至汉口汇入长江。汉水向西北倒流。此处比喻不可能的事情。", "english": "In a ship of spice-wood with unsinkable oars,\nMusicians at both ends,we drift along the shores.\nWe have sweet wine with singing girls to drink our fill,\nAnd so the waves may carry us where’er they will.\nImmortals could not fly without their yellow crane;\nUnselfish men might follow white gulls to the main.\nThe verse ofQ u Ping[2]shines as bright as sun and moon,\nWhile palaces of Chu vanish like dreams at noon.\nSeeing my pen in verve,even the mountains shake;\nHearing my laughter proud,the seaside hermits wake.\nIf worldly fame and wealth were things to last forever,\nThen northwestward would turn the eastward-flowing river.\n注释：\n[1]In Hubei Province.\n[2]Qu Yuan(340–270 B.C.)was a loyal minister and great poet in the state of Chu.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">木兰[1]之枻[2]沙棠舟，<br>玉箫金管坐两头。<br>美酒樽[3]中置千斛[4]，<br>载妓随波任去留。<br>仙人有待乘黄鹤，<br>海客[5]无心随白鸥。<br>屈平[6]词赋悬日月，<br>楚王台榭空山丘。<br>兴酣[7]落笔摇五岳，<br>诗成笑傲凌沧洲。<br>功名富贵若长在，<br>汉水[8]亦应西北流。</p>\n<p class=\"prose\">此诗为公元743年李白游江夏时所作。这首诗以江上的遨游起兴，表现了诗人对庸俗、局促的现实的蔑弃，和对自由、美好的生活理想的追求。诗人以屈原自比，抒发胸臆，末尾带着嘲弄的意味，说明富贵功名都是尘俗之物不可能长久。诗人追求的是一种自由的、超脱了世俗功利的生活。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]木兰：即辛夷，香木名。<br>[2]枻（yì）：同“楫”，舟旁划水的工具，即船桨。<br>[3]樽：盛酒的器具。<br>[4]千斛：形容船中置酒极多；斛：古时十斗为一斛。<br>[5]海客：海边的人。<br>[6]屈平：指屈原，名平，战国末期楚国大诗人。<br>[7]兴酣：诗兴浓烈。<br>[8]汉水：发源于陕西省汉中市宁强县，东南流经湖北省襄阳市，至汉口汇入长江。汉水向西北倒流。此处比喻不可能的事情。</p>", "englishHtml": "<p class=\"prose\">In a ship of spice-wood with unsinkable oars,<br>Musicians at both ends,we drift along the shores.<br>We have sweet wine with singing girls to drink our fill,<br>And so the waves may carry us where’er they will.<br>Immortals could not fly without their yellow crane;<br>Unselfish men might follow white gulls to the main.<br>The verse ofQ u Ping[2]shines as bright as sun and moon,<br>While palaces of Chu vanish like dreams at noon.<br>Seeing my pen in verve,even the mountains shake;<br>Hearing my laughter proud,the seaside hermits wake.<br>If worldly fame and wealth were things to last forever,<br>Then northwestward would turn the eastward-flowing river.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In Hubei Province.<br>[2]Qu Yuan(340–270 B.C.)was a loyal minister and great poet in the state of Chu.</p>"}, {"num": "095", "zhTitle": "夜宿山寺", "enTitle": "The Summit Temple", "chinese": "危楼[2]高百尺，\n手可摘星辰。\n不敢高声语，\n恐惊天上人。\n如果说《与夏十二登岳阳楼》是写景抒情之作，那《夜宿山寺》就是一首想象丰富的浪漫主义小诗。前者不说楼高，只写周边景物，却用烘云托月法衬出楼高；后者直说“危楼高百尺”，而用想象“手可摘星辰”的夸张手法来充实叙述。这样虚中有实、实中有虚的写法，使人虚实不分，模模糊糊，更会觉得寺高。接着“不敢高声语”又是实写，“恐惊天上人”却是虚假的想象。前两句写所见所感，后两句写所听所闻，这样虚虚实实，有声有色，就使人如见“山外青山楼外楼”了。\n注释：\n[1]宿：住，过夜。\n[2]危楼：高楼，这里指山顶的寺庙。", "english": "Hundred feet high the Summit Temple stands,\nWhere I could pluck the stars with my own hands.\nAt dead of night I dare not speak aloud\nFor fear of waking dwellers in the cloud.\n注释：\n[1]In present-day Hubei Province.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">危楼[2]高百尺，<br>手可摘星辰。<br>不敢高声语，<br>恐惊天上人。</p>\n<p class=\"prose\">如果说《与夏十二登岳阳楼》是写景抒情之作，那《夜宿山寺》就是一首想象丰富的浪漫主义小诗。前者不说楼高，只写周边景物，却用烘云托月法衬出楼高；后者直说“危楼高百尺”，而用想象“手可摘星辰”的夸张手法来充实叙述。这样虚中有实、实中有虚的写法，使人虚实不分，模模糊糊，更会觉得寺高。</p>\n<p class=\"prose\">接着“不敢高声语”又是实写，“恐惊天上人”却是虚假的想象。前两句写所见所感，后两句写所听所闻，这样虚虚实实，有声有色，就使人如见“山外青山楼外楼”了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]宿：住，过夜。<br>[2]危楼：高楼，这里指山顶的寺庙。</p>", "englishHtml": "<p class=\"prose\">Hundred feet high the Summit Temple stands,<br>Where I could pluck the stars with my own hands.<br>At dead of night I dare not speak aloud<br>For fear of waking dwellers in the cloud.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Hubei Province.</p>"}, {"num": "096", "zhTitle": "庐山谣寄卢侍御虚舟", "enTitle": "Song of Mount Lu—To Censor Lu Xuzhou", "chinese": "我本楚狂人[1]，\n凤歌笑孔丘。\n手持绿玉杖[2]，\n朝别黄鹤楼。\n五岳寻仙不辞远，\n一生好入名山游。\n庐山秀出南斗傍，\n屏风九叠云锦张，\n影落明湖青黛光。\n金阙[3]前开二峰长，\n银河[4]倒挂三石梁。\n香炉瀑布遥相望，\n回崖沓嶂[5]凌苍苍。\n翠影红霞映朝日，\n鸟飞不到吴天长。\n登高壮观天地间，\n大江茫茫去不还。\n黄云[6]万里动风色，\n白波九道流雪山。\n好为庐山谣，\n兴因庐山发。\n闲窥石镜清我心，\n谢公行处苍苔没。\n早服还丹[7]无世情，\n琴心三叠[8]道初成。\n遥见仙人彩云里，\n手把芙蓉朝玉京。\n先期汗漫九垓[9]上，\n愿接卢敖游太清[10]。\n公元760年，李白60岁的时候和卢虚舟同游庐山。他遇赦归来后，看破红尘，想要修仙学道，写这首诗给卢虚舟，劝他不要做官。诗人把自己比作楚国狂人，唱《凤歌》劝孔子仕途知返，退隐深山。接着，他就描写庐山在南斗星座之下，好像张开了云锦做的九叠屏风，倒影映在鄱阳湖里，闪烁着墨绿色的反光。石门好像仙人打开的金阙，两旁双峰耸立，中间有瀑布流出，犹如银河倒挂在三道石梁上，那就是三叠泉。遥遥相对的是香炉峰瀑布。这些重峦叠嶂，仿佛要飞上青天。庐山翠影和朝阳彩霞相映成趣，吴地天空辽阔，连鸟也飞不到边。登上庐山观望天地之间，只见茫茫长江一去不还；万里黄云飘浮，天色瞬息变幻；长江九条支流已经涌起雪山般的波涛，令人触目惊心。因此，诗人就对着石镜来清除尘心，看见谢灵运的足迹已被苍苔埋没，幸亏自己早已服了九转金丹，没有留恋尘世的感情；心如琴弦，修炼已有初步成效，可以遥望手拿莲花的仙人去天宫了。诗人已和“汗漫”仙约好同游太空，他问卢虚舟愿不愿同游。这首诗反映了李白不满现实、逃避现实的出世思想。\n注释：\n[1]楚狂人：春秋时楚人陆通因不满楚昭王的政治，佯狂不仕，故称“楚狂”。此处李白以陆通自比，表现对政治的不满，要像楚狂那样游览名山过隐居的生活。\n[2]绿玉杖：镶有绿玉的杖，传说为仙人所用。\n[3]金阙指黄金的门楼，这里借指庐山的石门。阙：皇宫门外的左右望楼。\n[4]银河：指瀑布。\n[5]回崖沓嶂：曲折的山崖，重叠的山峰。\n[6]黄云：昏暗的云色。\n[7]还丹：道家炼丹，将丹烧成水银，积久又还成丹，故谓“还丹”。\n[8]琴心三叠：道家修炼术语，指一种心神宁静的境界。\n[9]九垓：九天之外。\n[10]太清：天空。", "english": "I’m just a freak come from the South,\nWith frank advice e’er in my mouth.\nHolding at dawn a green-jade cane,\nI leave the Tower of Yellow Crane.\nOf the long trips to Sacred Mountains I make light,\nAll my life I have loved to visit famous height.\nLu Mountains tower high beside the wain stars bright\nLike a nine-panelled screen embroidered with clouds white.\nTheir shadows fall into the lake like emerald;\nTwo peaks stand face to face above the Gate of Gold.\nA waterfall is hanging down from Three Stone Beams,\nCascades of Censer Peak like upended silver streams.\nCliff on cliff,ridge on ridge lead to the azure skies,\nTheir green shapes kindled by flaming clouds at sunrise\nBarring the boundless Heaven’s vault where no bird flies.\nI climb to view the sky o’erhead and earth below,\nThe ne’er-returning waves of the River onward go.\nIn yellow clouds outspread for miles I see wind blow,\nNine foaming tributaries splash like mountain snow.\nOf Mountain Lu I love to sing,\nOf my poetry it is the spring.\nI gaze at the Stone Mirror,my heart purified,\nI seek the poet Xie’s path which green mosses hide.\nElixir swallowed,I care not what people say;\nThe zither played thrice,I begin to know the Way.\nI see from afar immortals in the cloudy land,\nThey come to celestial city,lotus-bloom in hand.\nI’ll go before you somewhere beyond the ninth sphere\nAnd wait for you to wander in the Zenith Clear.\n注释：\n[1]In present-day Jiangxi Province.", "poemType": "七言古诗", "chineseHtml": "<p class=\"poem-lines\">我本楚狂人[1]，<br>凤歌笑孔丘。<br>手持绿玉杖[2]，<br>朝别黄鹤楼。<br>五岳寻仙不辞远，<br>一生好入名山游。<br>庐山秀出南斗傍，<br>屏风九叠云锦张，<br>影落明湖青黛光。<br>金阙[3]前开二峰长，<br>银河[4]倒挂三石梁。<br>香炉瀑布遥相望，<br>回崖沓嶂[5]凌苍苍。<br>翠影红霞映朝日，<br>鸟飞不到吴天长。<br>登高壮观天地间，<br>大江茫茫去不还。<br>黄云[6]万里动风色，<br>白波九道流雪山。<br>好为庐山谣，<br>兴因庐山发。<br>闲窥石镜清我心，<br>谢公行处苍苔没。<br>早服还丹[7]无世情，<br>琴心三叠[8]道初成。<br>遥见仙人彩云里，<br>手把芙蓉朝玉京。<br>先期汗漫九垓[9]上，<br>愿接卢敖游太清[10]。</p>\n<p class=\"prose\">公元760年，李白60岁的时候和卢虚舟同游庐山。他遇赦归来后，看破红尘，想要修仙学道，写这首诗给卢虚舟，劝他不要做官。诗人把自己比作楚国狂人，唱《凤歌》劝孔子仕途知返，退隐深山。接着，他就描写庐山在南斗星座之下，好像张开了云锦做的九叠屏风，倒影映在鄱阳湖里，闪烁着墨绿色的反光。</p>\n<p class=\"prose\">石门好像仙人打开的金阙，两旁双峰耸立，中间有瀑布流出，犹如银河倒挂在三道石梁上，那就是三叠泉。遥遥相对的是香炉峰瀑布。这些重峦叠嶂，仿佛要飞上青天。庐山翠影和朝阳彩霞相映成趣，吴地天空辽阔，连鸟也飞不到边。登上庐山观望天地之间，只见茫茫长江一去不还；</p>\n<p class=\"prose\">万里黄云飘浮，天色瞬息变幻；长江九条支流已经涌起雪山般的波涛，令人触目惊心。因此，诗人就对着石镜来清除尘心，看见谢灵运的足迹已被苍苔埋没，幸亏自己早已服了九转金丹，没有留恋尘世的感情；心如琴弦，修炼已有初步成效，可以遥望手拿莲花的仙人去天宫了。</p>\n<p class=\"prose\">诗人已和“汗漫”仙约好同游太空，他问卢虚舟愿不愿同游。这首诗反映了李白不满现实、逃避现实的出世思想。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]楚狂人：春秋时楚人陆通因不满楚昭王的政治，佯狂不仕，故称“楚狂”。此处李白以陆通自比，表现对政治的不满，要像楚狂那样游览名山过隐居的生活。<br>[2]绿玉杖：镶有绿玉的杖，传说为仙人所用。<br>[3]金阙指黄金的门楼，这里借指庐山的石门。阙：皇宫门外的左右望楼。<br>[4]银河：指瀑布。<br>[5]回崖沓嶂：曲折的山崖，重叠的山峰。<br>[6]黄云：昏暗的云色。<br>[7]还丹：道家炼丹，将丹烧成水银，积久又还成丹，故谓“还丹”。<br>[8]琴心三叠：道家修炼术语，指一种心神宁静的境界。<br>[9]九垓：九天之外。<br>[10]太清：天空。</p>", "englishHtml": "<p class=\"prose\">I’m just a freak come from the South,<br>With frank advice e’er in my mouth.<br>Holding at dawn a green-jade cane,<br>I leave the Tower of Yellow Crane.<br>Of the long trips to Sacred Mountains I make light,<br>All my life I have loved to visit famous height.<br>Lu Mountains tower high beside the wain stars bright<br>Like a nine-panelled screen embroidered with clouds white.<br>Their shadows fall into the lake like emerald;<br>Two peaks stand face to face above the Gate of Gold.<br>A waterfall is hanging down from Three Stone Beams,<br>Cascades of Censer Peak like upended silver streams.<br>Cliff on cliff,ridge on ridge lead to the azure skies,<br>Their green shapes kindled by flaming clouds at sunrise<br>Barring the boundless Heaven’s vault where no bird flies.<br>I climb to view the sky o’erhead and earth below,<br>The ne’er-returning waves of the River onward go.<br>In yellow clouds outspread for miles I see wind blow,<br>Nine foaming tributaries splash like mountain snow.<br>Of Mountain Lu I love to sing,<br>Of my poetry it is the spring.<br>I gaze at the Stone Mirror,my heart purified,<br>I seek the poet Xie’s path which green mosses hide.<br>Elixir swallowed,I care not what people say;<br>The zither played thrice,I begin to know the Way.<br>I see from afar immortals in the cloudy land,<br>They come to celestial city,lotus-bloom in hand.<br>I’ll go before you somewhere beyond the ninth sphere<br>And wait for you to wander in the Zenith Clear.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Jiangxi Province.</p>"}, {"num": "097", "zhTitle": "豫章行", "enTitle": "Song of Yuzhang", "chinese": "胡风[1]吹代马[2]，\n北拥鲁阳关[3]。\n吴兵[4]照海[5]雪，\n西讨何时还？\n半渡上辽津，\n黄云惨无颜。\n老母与子别，\n呼天野草间。\n白马绕旌旗，\n悲鸣相追攀。\n白杨秋月苦，\n早落豫章山。\n本为休明人[6]，\n斩虏素不闲。\n岂惜战斗死，\n为君扫凶顽[7]。\n精感石没羽，\n岂云惮险艰？\n楼船若鲸飞，\n波荡落星湾。\n此曲不可奏，\n三军发成斑。\n《豫章行》为乐府《清调曲》调名，古辞写豫章山上白杨变为洛阳宫中栋梁，述其与根株分离之苦。李白借用旧题，描写行军作战的悲壮情景。诗人是矛盾的，朝廷的征兵，造成了多少亲人的生离死别和家庭的破碎，给人民带来多大的苦难，诗人看在眼里。而征兵对朝廷来说实属无奈之举，为了维持国家的和平，必须做出牺牲。所以诗人更多的流露出来的是同情和祝愿，这正是诗人忧国忧民的写照。\n注释：\n[1]胡风：北风。\n[2]代马：代地（今山西省东北与河北省张家口市蔚县一带）所产的良马。此处指胡马。\n[3]鲁阳关：战国时称鲁关，汉称鲁阳，在今河南省平顶山市鲁山县西南。\n[4]吴兵：吴越之地的征调之兵士，泛指江南之兵。\n[5]海：指鄱阳湖。\n[6]休明人：太平盛世时期的人。休明：形容生活美好清闲。\n[7]凶顽：凶暴愚顽之人。", "english": "The horses neigh to hear the north wind blow,\nThe rebels[2]occupy the Northern Pass.\nThe Southern armour bright as lake-side snow,\nWhen will our men be back from war?Alas!\nHalf of them are aboard,ready to part,\nE’en yellow clouds look gloomy and turn pale.\nOld mothers see their sons off,sad at heart,\nCrawling amid wild grass,they weep and wail.\nAround the flags turn steeds which parting grieves,\nThey chase each other,foaming at the mouth.\n’Neath autumn moon the poplars shed their leaves\nEarly which cover mountains of the South.\nI am a man living in time of peace,\nNot used to fighting or exchanging blows.\nBut I am not afraid to fight without cease,\nAnd sweep away our formidable foes.\nOur concentrated efforts could break stone\nAnd enemy however hard they are.\nOur galleons swift like whales which might have flown\nO’er waves which surge in the Bay of Falling Star.[5]\nThis isn’t a tune for army-men to play:\nOn hearing it,their hair would soon turn grey!\n注释：\n[1]Present-day Nanchang,capital of Jiangxi Province.\n[2]An Lushan who rebelled in 755.\n[5]Present-day Poyang Lake of Jiangxi Province.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">胡风[1]吹代马[2]，<br>北拥鲁阳关[3]。<br>吴兵[4]照海[5]雪，<br>西讨何时还？<br>半渡上辽津，<br>黄云惨无颜。<br>老母与子别，<br>呼天野草间。<br>白马绕旌旗，<br>悲鸣相追攀。<br>白杨秋月苦，<br>早落豫章山。<br>本为休明人[6]，<br>斩虏素不闲。<br>岂惜战斗死，<br>为君扫凶顽[7]。<br>精感石没羽，<br>岂云惮险艰？<br>楼船若鲸飞，<br>波荡落星湾。<br>此曲不可奏，<br>三军发成斑。</p>\n<p class=\"prose\">《豫章行》为乐府《清调曲》调名，古辞写豫章山上白杨变为洛阳宫中栋梁，述其与根株分离之苦。李白借用旧题，描写行军作战的悲壮情景。诗人是矛盾的，朝廷的征兵，造成了多少亲人的生离死别和家庭的破碎，给人民带来多大的苦难，诗人看在眼里。</p>\n<p class=\"prose\">而征兵对朝廷来说实属无奈之举，为了维持国家的和平，必须做出牺牲。所以诗人更多的流露出来的是同情和祝愿，这正是诗人忧国忧民的写照。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]胡风：北风。<br>[2]代马：代地（今山西省东北与河北省张家口市蔚县一带）所产的良马。此处指胡马。<br>[3]鲁阳关：战国时称鲁关，汉称鲁阳，在今河南省平顶山市鲁山县西南。<br>[4]吴兵：吴越之地的征调之兵士，泛指江南之兵。<br>[5]海：指鄱阳湖。<br>[6]休明人：太平盛世时期的人。休明：形容生活美好清闲。<br>[7]凶顽：凶暴愚顽之人。</p>", "englishHtml": "<p class=\"prose\">The horses neigh to hear the north wind blow,<br>The rebels[2]occupy the Northern Pass.<br>The Southern armour bright as lake-side snow,<br>When will our men be back from war?Alas!<br>Half of them are aboard,ready to part,<br>E’en yellow clouds look gloomy and turn pale.<br>Old mothers see their sons off,sad at heart,<br>Crawling amid wild grass,they weep and wail.<br>Around the flags turn steeds which parting grieves,<br>They chase each other,foaming at the mouth.<br>’Neath autumn moon the poplars shed their leaves<br>Early which cover mountains of the South.<br>I am a man living in time of peace,<br>Not used to fighting or exchanging blows.<br>But I am not afraid to fight without cease,<br>And sweep away our formidable foes.<br>Our concentrated efforts could break stone<br>And enemy however hard they are.<br>Our galleons swift like whales which might have flown<br>O’er waves which surge in the Bay of Falling Star.[5]<br>This isn’t a tune for army-men to play:<br>On hearing it,their hair would soon turn grey!</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Nanchang,capital of Jiangxi Province.<br>[2]An Lushan who rebelled in 755.<br>[5]Present-day Poyang Lake of Jiangxi Province.</p>"}, {"num": "098", "zhTitle": "哭宣城善酿纪叟", "enTitle": "Elegy on Master Brewer Ji of Xuancheng", "chinese": "纪叟黄泉里，\n还应酿老春[2]。\n夜台[3]无李白，\n沽酒与何人？\n李白在宣城为悼念一位善于酿酒的纪师傅，写下了这首纸短情长的悼亡诗。句句写的都是虚拟中的纪叟死后之事，这是一个特殊的抒情角度。诗人说纪叟在黄泉下，还应该在酿老春酒，这就等于说明了纪叟生前是酿酒的。说“夜台无李白，沽酒与何人”，等于说明李白是纪叟生前的老主顾。这样写就是以简驭繁了。第二个特殊的角度，诗中又幻想纪叟还活着，依旧在黄泉下酿酒。纪叟怎么能不死呢？因为诗人不相信他死了，也不忍心让他死去。这里写的不是客观的事实，而是主观的感情。这样表达出来的悲痛和友情，比一般的友情要深得多。第三个特殊的角度，诗人不说自己如何怀念纪叟，反说纪叟在怀念自己。这样从对方的角度写，等于把两个人的感情加在一个人身上，感情的分量和抒情的效果都增加了一倍。李白诗的本色，正是用天然的语言，表示最深挚的感情。这首小诗可以说是他最后的代表作，因为不久之后，他就离开了人世。译诗中写虚拟之事，没有用虚拟语态，而是用了陈述语气，仿佛纪叟真没有死，这样表示的友情，比用虚拟式又更深了一层。\n注释：\n[1]宣城：在今安徽省东南。\n[2]老春：唐人称酒多有“春”字，此处指纪叟所酿酒名。\n[3]夜台：坟墓。亦借指阴间。", "english": "For thirsty souls are you still brewing\nGood wine of Old Spring,Master Ji?\nIn underworld are you not ruing\nTo lose a connoisseur like me?\n注释：\n[1]In present-day Anhui Province.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">纪叟黄泉里，<br>还应酿老春[2]。<br>夜台[3]无李白，<br>沽酒与何人？</p>\n<p class=\"prose\">李白在宣城为悼念一位善于酿酒的纪师傅，写下了这首纸短情长的悼亡诗。句句写的都是虚拟中的纪叟死后之事，这是一个特殊的抒情角度。诗人说纪叟在黄泉下，还应该在酿老春酒，这就等于说明了纪叟生前是酿酒的。说“夜台无李白，沽酒与何人”，等于说明李白是纪叟生前的老主顾。</p>\n<p class=\"prose\">这样写就是以简驭繁了。第二个特殊的角度，诗中又幻想纪叟还活着，依旧在黄泉下酿酒。纪叟怎么能不死呢？因为诗人不相信他死了，也不忍心让他死去。这里写的不是客观的事实，而是主观的感情。这样表达出来的悲痛和友情，比一般的友情要深得多。</p>\n<p class=\"prose\">第三个特殊的角度，诗人不说自己如何怀念纪叟，反说纪叟在怀念自己。这样从对方的角度写，等于把两个人的感情加在一个人身上，感情的分量和抒情的效果都增加了一倍。李白诗的本色，正是用天然的语言，表示最深挚的感情。这首小诗可以说是他最后的代表作，因为不久之后，他就离开了人世。</p>\n<p class=\"prose\">译诗中写虚拟之事，没有用虚拟语态，而是用了陈述语气，仿佛纪叟真没有死，这样表示的友情，比用虚拟式又更深了一层。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]宣城：在今安徽省东南。<br>[2]老春：唐人称酒多有“春”字，此处指纪叟所酿酒名。<br>[3]夜台：坟墓。亦借指阴间。</p>", "englishHtml": "<p class=\"prose\">For thirsty souls are you still brewing<br>Good wine of Old Spring,Master Ji?<br>In underworld are you not ruing<br>To lose a connoisseur like me?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Anhui Province.</p>"}, {"num": "099", "zhTitle": "宣城见杜鹃花", "enTitle": "Azalea Blooms Viewed in Xuancheng", "chinese": "蜀国[1]曾闻子规鸟[2]，\n宣城还见杜鹃花[3]。\n一叫一回肠一断，\n三春三月忆三巴[4]。\n写这首诗的时候，李白已是迟暮之年。流放途中遇赦的他，流落江南，晚景凄凉。看见杜鹃花开，想起蜀中这时节，杜鹃也开始啼叫了，可是这杜鹃啼血是最听不得的呀，诗人的思乡情肠被触动了，况且当年他仗剑去国，辞亲远游，正待施展雄才大略，何等潇洒，如今功业未成，岁月蹉跎，缠绵病榻，不知能否再见故乡，满心的悲戚和浓浓的乡愁不觉涌上心头。\n注释：\n[1]蜀国：指四川。\n[2]子规鸟：又名杜鹃，因鸣声凄厉，动人乡思，故俗称断肠鸟，传说是古蜀王杜宇死后幻化而成。\n[3]杜鹃花：即映山红，因每年春末盛开，恰逢杜鹃鸟啼之时，故名杜鹃花。\n[4]三巴：巴郡、巴东、巴西三郡，即指蜀国，今四川。", "english": "I’ve heard home-going cuckoos sing in Western Towers[1],\nAnd here and now I see the blooming cuckoo flowers[2],\nI turn away:my heart will break to hear them sing,\nFor they remind me of my homeland in late spring.\n注释：\n[1]In present-day Sichuan Province,homeland of the poet.\n[2]Chinese name for azalea flowers which bloom when cuckoos cry“Go home!”and accord ing to Chinese legend,shed bloody tears.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">蜀国[1]曾闻子规鸟[2]，<br>宣城还见杜鹃花[3]。<br>一叫一回肠一断，<br>三春三月忆三巴[4]。</p>\n<p class=\"prose\">写这首诗的时候，李白已是迟暮之年。流放途中遇赦的他，流落江南，晚景凄凉。看见杜鹃花开，想起蜀中这时节，杜鹃也开始啼叫了，可是这杜鹃啼血是最听不得的呀，诗人的思乡情肠被触动了，况且当年他仗剑去国，辞亲远游，正待施展雄才大略，何等潇洒，如今功业未成，岁月蹉跎，缠绵病榻，不知能否再见故乡，满心的悲戚和浓浓的乡愁不觉涌上心头。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]蜀国：指四川。<br>[2]子规鸟：又名杜鹃，因鸣声凄厉，动人乡思，故俗称断肠鸟，传说是古蜀王杜宇死后幻化而成。<br>[3]杜鹃花：即映山红，因每年春末盛开，恰逢杜鹃鸟啼之时，故名杜鹃花。<br>[4]三巴：巴郡、巴东、巴西三郡，即指蜀国，今四川。</p>", "englishHtml": "<p class=\"prose\">I’ve heard home-going cuckoos sing in Western Towers[1],<br>And here and now I see the blooming cuckoo flowers[2],<br>I turn away:my heart will break to hear them sing,<br>For they remind me of my homeland in late spring.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Sichuan Province,homeland of the poet.<br>[2]Chinese name for azalea flowers which bloom when cuckoos cry“Go home!”and accord ing to Chinese legend,shed bloody tears.</p>"}, {"num": "100", "zhTitle": "临终歌", "enTitle": "On Death-Bed", "chinese": "大鹏飞兮振八裔[1]，\n中天[2]摧兮力不济。\n余风[3]激兮万世，\n游扶桑[4]兮挂[5]左袂[6]。\n后人得之传此，\n仲尼亡兮谁为出涕[7]？\n这是李白为自己撰写的墓志铭。李白终其一生都在为实现自己的理想和远大抱负而奋斗，他视自己为大鹏的化身，大鹏永远是振翅翱翔的形象。但这只大鹏再也飞不动了，他觉得自己这样一只大鹏已经飞到不能再飞的时候了，他便长歌当哭，为大鹏唱一支悲壮的《临终歌》。李白在诗中回顾自己一生的时候，流露的是对人生无比眷念和未能才尽其用的深沉惋惜。或许，在他生命的尽头，一只振翅高翔的大鹏永远定格在了他的心中。\n注释：\n[1]八裔（yì）：八方荒原之地。\n[2]中天：半空。\n[3]余风：遗风。\n[4]扶桑：古代神话传说中的大树，生在太阳升起的地方。古代把太阳作为君主的象征。此处暗喻到了皇帝身边。\n[5]挂：喻腐朽势力阻挠。\n[6]左袂：左边衣袖。\n[7]仲尼亡兮谁为出涕：指孔子泣麟的典故。传说麒麟是一种祥瑞的异兽。鲁哀公十四年（前481年），鲁国猎获一只麒麟，孔子认为麒麟出非其时，而被捕获，非常难受。", "english": "When flies the roc,he shakes the world.\nIn mid-air his weakened wings are furled.\nThe wind he’s raised still stirs the sea,\nHe hangs his left wing on sun-side tree.\nPosterity mine,hear,O,hear!\nConfucius dead,who’ll shed a tear?", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">大鹏飞兮振八裔[1]，<br>中天[2]摧兮力不济。<br>余风[3]激兮万世，<br>游扶桑[4]兮挂[5]左袂[6]。<br>后人得之传此，<br>仲尼亡兮谁为出涕[7]？</p>\n<p class=\"prose\">这是李白为自己撰写的墓志铭。李白终其一生都在为实现自己的理想和远大抱负而奋斗，他视自己为大鹏的化身，大鹏永远是振翅翱翔的形象。但这只大鹏再也飞不动了，他觉得自己这样一只大鹏已经飞到不能再飞的时候了，他便长歌当哭，为大鹏唱一支悲壮的《临终歌》。</p>\n<p class=\"prose\">李白在诗中回顾自己一生的时候，流露的是对人生无比眷念和未能才尽其用的深沉惋惜。或许，在他生命的尽头，一只振翅高翔的大鹏永远定格在了他的心中。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]八裔（yì）：八方荒原之地。<br>[2]中天：半空。<br>[3]余风：遗风。<br>[4]扶桑：古代神话传说中的大树，生在太阳升起的地方。古代把太阳作为君主的象征。此处暗喻到了皇帝身边。<br>[5]挂：喻腐朽势力阻挠。<br>[6]左袂：左边衣袖。<br>[7]仲尼亡兮谁为出涕：指孔子泣麟的典故。传说麒麟是一种祥瑞的异兽。鲁哀公十四年（前481年），鲁国猎获一只麒麟，孔子认为麒麟出非其时，而被捕获，非常难受。</p>", "englishHtml": "<p class=\"prose\">When flies the roc,he shakes the world.<br>In mid-air his weakened wings are furled.<br>The wind he’s raised still stirs the sea,<br>He hangs his left wing on sun-side tree.<br>Posterity mine,hear,O,hear!<br>Confucius dead,who’ll shed a tear?</p>"}];

      list.innerHTML = "";
      poems.forEach((poem, index) => {
        if (q && !`${poem.zhTitle} ${poem.enTitle} ${poem.poemType}`.toLowerCase().includes(q)) return;
        const button = document.createElement("button");
        button.className = "poem-link" + (index === active ? " active" : "");
        button.innerHTML = `<span class="num">${poem.num}</span><span><span class="link-row"><span class="link-title">${poem.zhTitle}</span><span class="type-pill">${poem.poemType}</span></span><span class="link-en">${poem.enTitle}</span></span>`;
        button.addEventListener("click", () => showPoem(index));
        list.appendChild(button);
      });
    }

    function showPoem(index) {
      active = Math.max(0, Math.min(poems.length - 1, index));
      const poem = poems[active];
      title.textContent = `${poem.num}. ${poem.zhTitle}`;
      enTitle.textContent = poem.enTitle;
      poemType.textContent = poem.poemType;
      chinese.innerHTML = poem.chineseHtml;
      english.innerHTML = poem.englishHtml;
      leftPane.scrollTop = 0;
      rightPane.scrollTop = 0;
      progress.style.width = `${((active + 1) / poems.length) * 100}%`;
      renderList(search.value);
      const current = list.querySelector(".active");
      if (current) current.scrollIntoView({ block: "nearest" });
    }

    document.getElementById("prev").addEventListener("click", () => showPoem(active - 1));
    document.getElementById("next").addEventListener("click", () => showPoem(active + 1));
    document.getElementById("smaller").addEventListener("click", () => { scale = Math.max(-4, scale - 1); applyScale(); });
    document.getElementById("larger").addEventListener("click", () => { scale = Math.min(7, scale + 1); applyScale(); });
    search.addEventListener("input", () => renderList(search.value));
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") showPoem(active - 1);
      if (event.key === "ArrowRight") showPoem(active + 1);
    });

    applyScale();
    renderList();
    showPoem(2);
  </script>
</body>
</html>
