。\n笛中闻《折柳》，\n春色未曾看。\n晓战随金鼓[2]，\n宵眠抱玉鞍。\n愿将腰下剑，\n直为斩楼兰。\n李白所作《塞下曲》共六首，此为其第一首。五月，在中原本是盛夏时节，李白所写五月在塞下，在天山，地域的差异带来的是所见所感的迥然有别。天山孤拔，终年积雪。同一季节景物上的巨大反差，在诗人的笔下并未显得波澜壮阔，只是淡淡地道出“无花只有寒”，透着一丝苍凉。因为在边疆，将士们对苦寒习以为常，这里看不到春天，只能从笛曲之中，去感受，去回忆，何况又是《折柳》这样的“天涯人断肠”之曲，极力烘托渲染苍凉肃杀的气氛。后四句则是对军营生活的反映，以及对戍边将士们人人奋勇、争为功先的情感流露。朝，闻鼓搏战；暮，枕鞍而眠，极写军旅生活的紧张。尾联用了西汉傅介子的故事，借此表达了边塞将士的爱国激情。全篇苍凉雄浑，意境天成，是别具一格的边塞佳作。\n注释：\n[1]天山：指祁连山。\n[2]金鼓：指锣，进军时击鼓，退军时鸣金。", "english": "(I)\nIn summer sky-high mountains white with snow,\nIn bitter cold no fragrant flowers blow.\nSongs on the flute are heard of Willows Green,\nBut nowhere is the vernal color seen.\nFrom dawn till dusk to beats of drum they fight;\nWith saddle in their arms they rest at night.\nFrom scabbard at my waist I’d draw my sword\nTo killthe chieftain oftheTurki horde.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">（六首其一）<br>五月天山[1]雪，<br>无花只有寒。<br>笛中闻《折柳》，<br>春色未曾看。<br>晓战随金鼓[2]，<br>宵眠抱玉鞍。<br>愿将腰下剑，<br>直为斩楼兰。</p>\n<p class=\"prose\">李白所作《塞下曲》共六首，此为其第一首。五月，在中原本是盛夏时节，李白所写五月在塞下，在天山，地域的差异带来的是所见所感的迥然有别。天山孤拔，终年积雪。同一季节景物上的巨大反差，在诗人的笔下并未显得波澜壮阔，只是淡淡地道出“无花只有寒”，透着一丝苍凉。</p>\n<p class=\"prose\">因为在边疆，将士们对苦寒习以为常，这里看不到春天，只能从笛曲之中，去感受，去回忆，何况又是《折柳》这样的“天涯人断肠”之曲，极力烘托渲染苍凉肃杀的气氛。后四句则是对军营生活的反映，以及对戍边将士们人人奋勇、争为功先的情感流露。</p>\n<p class=\"prose\">朝，闻鼓搏战；暮，枕鞍而眠，极写军旅生活的紧张。尾联用了西汉傅介子的故事，借此表达了边塞将士的爱国激情。全篇苍凉雄浑，意境天成，是别具一格的边塞佳作。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]天山：指祁连山。<br>[2]金鼓：指锣，进军时击鼓，退军时鸣金。</p>", "englishHtml": "<p class=\"poem-lines\">(I)</p>\n<p class=\"prose\">In summer sky-high mountains white with snow,<br>In bitter cold no fragrant flowers blow.<br>Songs on the flute are heard of Willows Green,<br>But nowhere is the vernal color seen.<br>From dawn till dusk to beats of drum they fight;<br>With saddle in their arms they rest at night.<br>From scabbard at my waist I’d draw my sword<br>To killthe chieftain oftheTurki horde.</p>"}, {"num": "028", "zhTitle": "关山月", "enTitle": "The Moon over the Mountain Pass", "chinese": "明月出天山，\n苍茫云海间。\n长风几万里，\n吹度玉门关[2]。\n汉下[3]白登道，\n胡[4]窥[5]青海湾。\n由来[6]征战地，\n不见有人还。\n戍客[7]望边色，\n思归多苦颜。\n高楼[8]当此夜，\n叹息未应闲。\n《关山月》是乐府旧题，作品很多，但都不如李白这首雄浑壮阔。前四句写驻扎在玉门关外的士兵，看见明月从天山上出来，徘徊在云海间，又经风吹万里，照到玉门关外，这是一幅动的图画。中四句的“白登”和“青海湾”分别是汉唐时代的战场，战士都是有去无返，可见诗人同情他们，景语也是情语。后四句写士兵思家，不说他们思念妻子，反说妻子思念他们，可见相互体贴感情之深。\n注释：\n[1]关山月：乐府旧题，属横吹曲辞，多抒离别哀伤之情。\n[2]玉门关：故址在今甘肃敦煌西北，旧时通向西域的交通要塞。\n[3]下：指出兵。\n[4]胡：指吐蕃。\n[5]窥：觊觎，有所企图，窥伺，侵扰。\n[6]由来：自古以来。\n[7]戍客：戍守边疆的战士。\n[8]高楼：古诗中多以高楼指闺阁，这里理解为戍边兵士的妻子。", "english": "From Heaven’s Peak the moon rises bright,\nOver a boundless sea of cloud.\nWinds blow for miles with main and might\nPast the Jade Gate which stands so proud.\nOur warriors march down the frontier\nWhile Tartars peer across Blue Bays.\nFrom the battlefield outstretched here,\nNone have come back since olden days.\nGuards watch the scene of borderland,\nThinking of home,with wistful eyes.\nTonight upstairs their wives would stand,\nLooking afarwith longing sighs.", "poemType": "五言古诗", "chineseHtml": "<p class=\"poem-lines\">明月出天山，<br>苍茫云海间。<br>长风几万里，<br>吹度玉门关[2]。<br>汉下[3]白登道，<br>胡[4]窥[5]青海湾。<br>由来[6]征战地，<br>不见有人还。<br>戍客[7]望边色，<br>思归多苦颜。<br>高楼[8]当此夜，<br>叹息未应闲。</p>\n<p class=\"prose\">《关山月》是乐府旧题，作品很多，但都不如李白这首雄浑壮阔。前四句写驻扎在玉门关外的士兵，看见明月从天山上出来，徘徊在云海间，又经风吹万里，照到玉门关外，这是一幅动的图画。中四句的“白登”和“青海湾”分别是汉唐时代的战场，战士都是有去无返，可见诗人同情他们，景语也是情语。</p>\n<p class=\"prose\">后四句写士兵思家，不说他们思念妻子，反说妻子思念他们，可见相互体贴感情之深。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]关山月：乐府旧题，属横吹曲辞，多抒离别哀伤之情。<br>[2]玉门关：故址在今甘肃敦煌西北，旧时通向西域的交通要塞。<br>[3]下：指出兵。<br>[4]胡：指吐蕃。<br>[5]窥：觊觎，有所企图，窥伺，侵扰。<br>[6]由来：自古以来。<br>[7]戍客：戍守边疆的战士。<br>[8]高楼：古诗中多以高楼指闺阁，这里理解为戍边兵士的妻子。</p>", "englishHtml": "<p class=\"prose\">From Heaven’s Peak the moon rises bright,<br>Over a boundless sea of cloud.<br>Winds blow for miles with main and might<br>Past the Jade Gate which stands so proud.<br>Our warriors march down the frontier<br>While Tartars peer across Blue Bays.<br>From the battlefield outstretched here,<br>None have come back since olden days.<br>Guards watch the scene of borderland,<br>Thinking of home,with wistful eyes.<br>Tonight upstairs their wives would stand,<br>Looking afarwith longing sighs.</p>"}, {"num": "029", "zhTitle": "乌夜啼", "enTitle": "The Crows Crying at Night", "chinese": "黄云城边乌欲栖，\n归飞哑哑[2]枝上啼。\n机中织锦[3]秦川女[4]，\n碧纱如烟[5]隔窗语。\n停梭[6]怅然忆远人，\n独宿孤房泪如雨。\n这是一首离别相思之作，在主人公的塑造上，郑愁予的《错误》采用了同样的写作手法。乌鸦向来代表衰败荒凉，而黄昏时候，乌鸦尚且归巢，不能不让人“忧从中来”。首句就奠定了全诗的哀伤基调。诗人并未给出一个完整的等待征夫归来的女子的形象。我们只能推测“那等在季节里的容颜如莲花的开落”；我们也可以推测“足音不响，三月的春帷不揭”。但有一点是肯定的，窗后的女子的心，是“小小的窗扉紧掩”。透过纱窗，她的低语依稀可辨，织梭一停，一场泪雨。不由得使人怜惜感叹，可惜“我不是归人，是个过客”。\n注释：\n[1]乌夜啼：乐府旧题，多写男女离别相思之苦。\n[2]哑哑：乌鸦啼叫声。\n[3]机中织锦：一作“闺中织妇”。\n[4]秦川女：指晋朝苏蕙。《晋书·列女传》载，窦滔妻苏氏，始平人，名蕙，字若兰，善属文。窦滔原本是秦川刺史，后被苻坚徙流沙。苏蕙把思念织成回文璇玑图，题诗二百余，计八百余言，纵横反复皆成章句。泛指织锦女子。\n[5]碧纱如烟：指黄昏映着碧绿的窗纱朦胧似烟。\n[6]梭：织布用的织梭。形状似船，两头尖尖。远人，指遥远在外的丈夫。", "english": "’Neath yellow clouds the crows fly home by city wall,\nThey caw amid the leaves in treetops at night-fall.\nThe wife of Western Plain weaves brocade at her loom,\nBehind the misty screen she murmurs—but to whom?\nShe stops her shuttle,thinking of him far away,\nAnd weeps,so lonely in her bower night and day.", "poemType": "古体诗", "chineseHtml": "<p class=\"poem-lines\">黄云城边乌欲栖，<br>归飞哑哑[2]枝上啼。<br>机中织锦[3]秦川女[4]，<br>碧纱如烟[5]隔窗语。<br>停梭[6]怅然忆远人，<br>独宿孤房泪如雨。</p>\n<p class=\"prose\">这是一首离别相思之作，在主人公的塑造上，郑愁予的《错误》采用了同样的写作手法。乌鸦向来代表衰败荒凉，而黄昏时候，乌鸦尚且归巢，不能不让人“忧从中来”。首句就奠定了全诗的哀伤基调。诗人并未给出一个完整的等待征夫归来的女子的形象。</p>\n<p class=\"prose\">我们只能推测“那等在季节里的容颜如莲花的开落”；我们也可以推测“足音不响，三月的春帷不揭”。但有一点是肯定的，窗后的女子的心，是“小小的窗扉紧掩”。透过纱窗，她的低语依稀可辨，织梭一停，一场泪雨。不由得使人怜惜感叹，可惜“我不是归人，是个过客”。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]乌夜啼：乐府旧题，多写男女离别相思之苦。<br>[2]哑哑：乌鸦啼叫声。<br>[3]机中织锦：一作“闺中织妇”。<br>[4]秦川女：指晋朝苏蕙。《晋书·列女传》载，窦滔妻苏氏，始平人，名蕙，字若兰，善属文。窦滔原本是秦川刺史，后被苻坚徙流沙。苏蕙把思念织成回文璇玑图，题诗二百余，计八百余言，纵横反复皆成章句。泛指织锦女子。<br>[5]碧纱如烟：指黄昏映着碧绿的窗纱朦胧似烟。<br>[6]梭：织布用的织梭。形状似船，两头尖尖。远人，指遥远在外的丈夫。</p>", "englishHtml": "<p class=\"prose\">’Neath yellow clouds the crows fly home by city wall,<br>They caw amid the leaves in treetops at night-fall.<br>The wife of Western Plain weaves brocade at her loom,<br>Behind the misty screen she murmurs—but to whom?<br>She stops her shuttle,thinking of him far away,<br>And weeps,so lonely in her bower night and day.</p>"}, {"num": "030", "zhTitle": "春思", "enTitle": "A Faithful Wife Longing for Her Husband in Spring", "chinese": "燕[1]草如碧丝，\n秦[2]桑低绿枝。\n当君[3]怀归日，\n是妾[4]断肠时。\n春风不相识，\n何事入罗帏[5]？\n《春思》是李白描写妻子思念丈夫的一首小诗。仲春时节，桑叶繁茂，独处秦地的妻子见景生情，终日盼望驻扎在北方边境的丈夫早日归来，料想他看到碧丝般的春草，也会萌生对妻子的怀念。燕北地寒，春草生迟。当秦地柔桑低绿枝时，燕草方生，丈夫刚萌怀归之意，妻子思夫已经很久了。忽然春风吹开罗帐，妻子喜出望外以为丈夫回来，不料欢喜成空，于是转喜为悲，反而责怪春风不该闯入房中。这种想象中的责备之词，活画出了妻子思念丈夫的深情。\n注释：\n[1]燕：今河北省北部一带，此处泛指北疆地区，征夫所在之处。\n[2]秦：今陕西省一带，此指思妇所在之地。\n[3]君：指征夫。\n[4]妾：古代妇女自称。这里是思妇自指。\n[5]罗帏：丝织的帷帐。", "english": "Your Northern grass must be like green silk thread;\nOur Western mulberries have bent their head.\nWhen your thoughts begin to turn homeward way,\nMy heart has long been breaking night and day.\nTo the intruding vernal wind I say:\n“How dare you part the curtain of my bed!”", "poemType": "古体诗", "chineseHtml": "<p class=\"poem-lines\">燕[1]草如碧丝，<br>秦[2]桑低绿枝。<br>当君[3]怀归日，<br>是妾[4]断肠时。<br>春风不相识，<br>何事入罗帏[5]？</p>\n<p class=\"prose\">《春思》是李白描写妻子思念丈夫的一首小诗。仲春时节，桑叶繁茂，独处秦地的妻子见景生情，终日盼望驻扎在北方边境的丈夫早日归来，料想他看到碧丝般的春草，也会萌生对妻子的怀念。燕北地寒，春草生迟。当秦地柔桑低绿枝时，燕草方生，丈夫刚萌怀归之意，妻子思夫已经很久了。</p>\n<p class=\"prose\">忽然春风吹开罗帐，妻子喜出望外以为丈夫回来，不料欢喜成空，于是转喜为悲，反而责怪春风不该闯入房中。这种想象中的责备之词，活画出了妻子思念丈夫的深情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]燕：今河北省北部一带，此处泛指北疆地区，征夫所在之处。<br>[2]秦：今陕西省一带，此指思妇所在之地。<br>[3]君：指征夫。<br>[4]妾：古代妇女自称。这里是思妇自指。<br>[5]罗帏：丝织的帷帐。</p>", "englishHtml": "<p class=\"prose\">Your Northern grass must be like green silk thread;<br>Our Western mulberries have bent their head.<br>When your thoughts begin to turn homeward way,<br>My heart has long been breaking night and day.<br>To the intruding vernal wind I say:<br>“How dare you part the curtain of my bed!”</p>"}, {"num": "031", "zhTitle": "三五七言", "enTitle": "Yearning", "chinese": "秋风清，\n秋月明。\n落叶聚还散，\n寒鸦栖复惊。\n相思相见知何日？\n此时此夜难为情！\n《三五七言》写的是秋思。前二句每句三字，点明时间是个月白风清的秋夜。中二句每句五字，看得出地点是在树下，满地落叶堆积，被秋风吹到一起，又吹散了；树上的乌鸦感到秋凉，已经栖息，却被秋风秋月惊醒，象征着离散的情人不能入眠。后二句每句七字，写不能入眠的女子思念情人，何时能再见呢？如何度过这冷冷清清、孤孤单单的漫漫长夜呢？这种相思之情真是剪不断，理还乱，别是一般滋味在心头。《三五七言》的句型前短后长，也象征着秋思和秋夜一样越来越深。\n注释：\n[1]三五七言：一种诗歌体式，全诗三言、五言、七言各两句，因而得名。", "english": "Fresh autumn breeze,\nBright autumn moon.\nFallen leaves gather and scatter around the trees;\nCold-stricken crows soon fall asleep and wake as soon.\nI long for you.When can I see your longing look?\nHow can I bearthis lonely night,this lonely nook?", "poemType": "古体诗", "chineseHtml": "<p class=\"poem-lines\">秋风清，<br>秋月明。<br>落叶聚还散，<br>寒鸦栖复惊。<br>相思相见知何日？<br>此时此夜难为情！</p>\n<p class=\"prose\">《三五七言》写的是秋思。前二句每句三字，点明时间是个月白风清的秋夜。中二句每句五字，看得出地点是在树下，满地落叶堆积，被秋风吹到一起，又吹散了；树上的乌鸦感到秋凉，已经栖息，却被秋风秋月惊醒，象征着离散的情人不能入眠。后二句每句七字，写不能入眠的女子思念情人，何时能再见呢？</p>\n<p class=\"prose\">如何度过这冷冷清清、孤孤单单的漫漫长夜呢？这种相思之情真是剪不断，理还乱，别是一般滋味在心头。《三五七言》的句型前短后长，也象征着秋思和秋夜一样越来越深。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]三五七言：一种诗歌体式，全诗三言、五言、七言各两句，因而得名。</p>", "englishHtml": "<p class=\"prose\">Fresh autumn breeze,<br>Bright autumn moon.<br>Fallen leaves gather and scatter around the trees;<br>Cold-stricken crows soon fall asleep and wake as soon.<br>I long for you.When can I see your longing look?<br>How can I bearthis lonely night,this lonely nook?</p>"}, {"num": "032", "zhTitle": "怨情", "enTitle": "Waiting in Vain", "chinese": "美人卷珠帘[1]，\n深坐[2]颦[3]蛾眉[4]。\n但看泪痕湿，\n不知心恨谁。\n在中国古代的爱情诗中，写怨情的居多，李白这首五言绝句就是一个例子。如果说《春思》写了女性的内心，这首小诗却只写了美人的外形。第一句写她卷帘，可见有所期待；第二句写她皱眉，可见期待成空；第三句写泪痕，可见她由怨而哭；第四句并不点破她怨谁，是“忽见陌头杨柳色，悔教夫婿觅封侯”呢？还是“感此伤妾心，坐愁红颜老”呢？作者给读者留下了想象的空间，使人觉得语短情长。\n注释：\n[1]卷珠帘：指卷起帷帘望向窗外。\n[2]深坐：长久的坐。\n[3]颦（pín）：皱眉。\n[4]蛾眉：蚕蛾触须弯而细长，因此以此借称女子之眉。", "english": "A lady fair uprolls the screen,\nWith eyebrows knit she waits in vain.\nWet stains of tears can still be seen.\nWho,heartless,has caused her the pain?", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">美人卷珠帘[1]，<br>深坐[2]颦[3]蛾眉[4]。<br>但看泪痕湿，<br>不知心恨谁。</p>\n<p class=\"prose\">在中国古代的爱情诗中，写怨情的居多，李白这首五言绝句就是一个例子。如果说《春思》写了女性的内心，这首小诗却只写了美人的外形。第一句写她卷帘，可见有所期待；第二句写她皱眉，可见期待成空；第三句写泪痕，可见她由怨而哭；第四句并不点破她怨谁，是“忽见陌头杨柳色，悔教夫婿觅封侯”呢？</p>\n<p class=\"prose\">还是“感此伤妾心，坐愁红颜老”呢？作者给读者留下了想象的空间，使人觉得语短情长。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]卷珠帘：指卷起帷帘望向窗外。<br>[2]深坐：长久的坐。<br>[3]颦（pín）：皱眉。<br>[4]蛾眉：蚕蛾触须弯而细长，因此以此借称女子之眉。</p>", "englishHtml": "<p class=\"prose\">A lady fair uprolls the screen,<br>With eyebrows knit she waits in vain.<br>Wet stains of tears can still be seen.<br>Who,heartless,has caused her the pain?</p>"}, {"num": "033", "zhTitle": "玉阶怨", "enTitle": "Waiting in Vain on Marble Steps", "chinese": "玉阶生白露，\n夜久侵罗袜[2]。\n却下[3]水晶帘，\n玲珑望秋月。\n如果说《怨情》通过写美人的外形来揭露内心的感情，那么《玉阶怨》却连外形都没有写，只是通过动作来暗示怨情。第一句“起”，“玉阶”表明地点是在宫内，“生白露”表明时间是在深夜。第二句“承”，“罗袜”表明宫女的身份，“侵罗袜”说明伫立时间已久。第三句“转”，“下水晶帘”表明失望。第四句“合”，“玲珑望月”却又表示还不死心，仿佛也要把一片痴情托付给明月，飞到所思念的人身边去。这样“起承转合”，使人从动作中看到宫女的内心，是不言怨而怨自见的写法。\n注释：\n[1]玉阶怨：乐府古题，是专写“宫怨”的曲题。\n[2]罗袜：丝织的袜子。\n[3]却下：回房放下。却：还。", "english": "The marble steps with dew turn cold,\nSilk soles are wet when night grows old.\nShe comes in,lowers crystal screen,\nStill gazing atthe moon serene.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">玉阶生白露，<br>夜久侵罗袜[2]。<br>却下[3]水晶帘，<br>玲珑望秋月。</p>\n<p class=\"prose\">如果说《怨情》通过写美人的外形来揭露内心的感情，那么《玉阶怨》却连外形都没有写，只是通过动作来暗示怨情。第一句“起”，“玉阶”表明地点是在宫内，“生白露”表明时间是在深夜。第二句“承”，“罗袜”表明宫女的身份，“侵罗袜”说明伫立时间已久。</p>\n<p class=\"prose\">第三句“转”，“下水晶帘”表明失望。第四句“合”，“玲珑望月”却又表示还不死心，仿佛也要把一片痴情托付给明月，飞到所思念的人身边去。这样“起承转合”，使人从动作中看到宫女的内心，是不言怨而怨自见的写法。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]玉阶怨：乐府古题，是专写“宫怨”的曲题。<br>[2]罗袜：丝织的袜子。<br>[3]却下：回房放下。却：还。</p>", "englishHtml": "<p class=\"prose\">The marble steps with dew turn cold,<br>Silk soles are wet when night grows old.<br>She comes in,lowers crystal screen,<br>Still gazing atthe moon serene.</p>"}, {"num": "034", "zhTitle": "长门怨", "enTitle": "Sorrow of the Long Gate Palace", "chinese": "（二首其一）\n天回北斗[2]挂西楼，\n金屋无人萤火流。\n月光欲到长门殿，\n别作深宫一段愁。\n长门宫是汉武帝的陈皇后居住的冷宫。陈皇后小名阿娇，汉武帝小时曾说：“若得阿娇为妇，当作金屋贮之。”所以后世就有“金屋藏娇”之说。不料阿娇从金屋打入了冷宫，长门怨也就变成了冷宫怨。这一首写景不写人，金屋景色凄清，天上只有北斗横斜，地上只见萤火流动，明月洒下幽光，照着长门深宫，显得愁上加愁，分外凄凉。\n注释：\n[1]长门怨：古乐府诗题。\n[2]天回北斗：北斗七星。古人往往据初昏时斗柄所指方向以定季节。《鹖冠子·环流》：“斗柄东指，天下皆春；斗柄南指，天下皆夏；斗柄西指，天下皆秋；斗柄北指，天下皆冬。”此句指此时节为秋。", "english": "(I)\nThe plough has turned around and hangs o’er Western Tower,\nNone but the fireflies sail the gloom of Golden Bower.\nThe lonely moon which peeps in Palace of Long Gate\nWill shed more sorrow on the dweller desolate.\n注释：\n[1]The Long Gate Palace was the dwelling of a disfavored queen of the Han Dynasty.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">（二首其一）<br>天回北斗[2]挂西楼，<br>金屋无人萤火流。<br>月光欲到长门殿，<br>别作深宫一段愁。</p>\n<p class=\"prose\">长门宫是汉武帝的陈皇后居住的冷宫。陈皇后小名阿娇，汉武帝小时曾说：“若得阿娇为妇，当作金屋贮之。”所以后世就有“金屋藏娇”之说。不料阿娇从金屋打入了冷宫，长门怨也就变成了冷宫怨。这一首写景不写人，金屋景色凄清，天上只有北斗横斜，地上只见萤火流动，明月洒下幽光，照着长门深宫，显得愁上加愁，分外凄凉。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]长门怨：古乐府诗题。<br>[2]天回北斗：北斗七星。古人往往据初昏时斗柄所指方向以定季节。《鹖冠子·环流》：“斗柄东指，天下皆春；斗柄南指，天下皆夏；斗柄西指，天下皆秋；斗柄北指，天下皆冬。”此句指此时节为秋。</p>", "englishHtml": "<p class=\"poem-lines\">(I)</p>\n<p class=\"prose\">The plough has turned around and hangs o’er Western Tower,<br>None but the fireflies sail the gloom of Golden Bower.<br>The lonely moon which peeps in Palace of Long Gate<br>Will shed more sorrow on the dweller desolate.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The Long Gate Palace was the dwelling of a disfavored queen of the Han Dynasty.</p>"}, {"num": "035", "zhTitle": "长门怨", "enTitle": "Sorrow of the Long Gate Palace", "chinese": "（二首其二）\n桂殿[1]长愁不记春，\n黄金四屋[2]起秋尘。\n夜悬明镜[3]青天上，\n独照长门宫里人。\n这首着重写情，桂殿似乎成了秋天的一统天下，冷宫似乎没有见过春天，金屋的灰尘也没人打扫，留下了永恒的秋色。夜里，秋月犹如明镜照着冷宫里孤独的陈皇后，仿佛月宫里冷冷清清的嫦娥也向她洒下了同情之泪。如果说《玉阶怨》写的是宫女之怨，那《长门怨》写的就是后妃之怨了。\n注释：\n[1]桂殿：指长门殿。\n[2]四屋：四壁。\n[3]明镜：指月亮。", "english": "(II)\nDoes Laurel Bower where grief reigns remember spring?\nOn the four golden walls the dusts of autumn cling.\nThe night holds up a mirror bright in azure sky\nTo show the fair on earth as lonely as on high.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">（二首其二）<br>桂殿[1]长愁不记春，<br>黄金四屋[2]起秋尘。<br>夜悬明镜[3]青天上，<br>独照长门宫里人。</p>\n<p class=\"prose\">这首着重写情，桂殿似乎成了秋天的一统天下，冷宫似乎没有见过春天，金屋的灰尘也没人打扫，留下了永恒的秋色。夜里，秋月犹如明镜照着冷宫里孤独的陈皇后，仿佛月宫里冷冷清清的嫦娥也向她洒下了同情之泪。如果说《玉阶怨》写的是宫女之怨，那《长门怨》写的就是后妃之怨了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]桂殿：指长门殿。<br>[2]四屋：四壁。<br>[3]明镜：指月亮。</p>", "englishHtml": "<p class=\"poem-lines\">(II)</p>\n<p class=\"prose\">Does Laurel Bower where grief reigns remember spring?<br>On the four golden walls the dusts of autumn cling.<br>The night holds up a mirror bright in azure sky<br>To show the fair on earth as lonely as on high.</p>"}, {"num": "036", "zhTitle": "子夜吴歌", "enTitle": "Ballads of Four Seasons", "chinese": "（春歌）\n秦地[1]罗敷女[2]，\n采桑绿水边。\n素手青条上，\n红妆白日鲜。\n蚕饥妾[3]欲去，\n五马莫留连！\n《子夜吴歌》共四首，分咏春、夏、秋、冬四季。六朝乐府有《子夜四时歌》，诗人依前人所创做了革新，将诗体由四句加为六句，手法也更胜一筹。此一首为春歌，这首诗吟咏罗敷女的故事，赞扬她不为富贵动心，不仅有美貌，更有美丽的心灵，她的勤劳品质在“蚕饥妾欲去，五马莫留连”一句中得到了很好的阐述。《汉官仪》：“四马载车，此常礼也，惟太守出，则增一马。”故称五马，这里指达官贵人。\n注释：\n[1]秦地：现今陕西省关中地区。\n[2]罗敷（fū）女：乐府诗《陌上桑》有“日出东南隅，照我秦氏楼。秦氏有好女，自言名罗敷。罗敷善蚕桑，采桑城南隅”的诗句。\n[3]妾：古代女子用以自称的谦词。", "english": "(Spring)\nThe lovely Lo Fo[1]of the western land\nPlucks mulberry leaves by the waterside.\nAcross the green boughs stretches out her white hand;\nIn golden sunshine her rosy robe is dyed.\n“My silkworms are hungry,I cannot stay.\nTarry not with your five-horse cab,I pray.”\n注释：\n[1]Lo Fo and below-mentioned Xi Shi were beautiful ladies.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">（春歌）秦地[1]罗敷女[2]，<br>采桑绿水边。<br>素手青条上，<br>红妆白日鲜。<br>蚕饥妾[3]欲去，<br>五马莫留连！</p>\n<p class=\"prose\">《子夜吴歌》共四首，分咏春、夏、秋、冬四季。六朝乐府有《子夜四时歌》，诗人依前人所创做了革新，将诗体由四句加为六句，手法也更胜一筹。此一首为春歌，这首诗吟咏罗敷女的故事，赞扬她不为富贵动心，不仅有美貌，更有美丽的心灵，她的勤劳品质在“蚕饥妾欲去，五马莫留连”一句中得到了很好的阐述。</p>\n<p class=\"prose\">《汉官仪》：“四马载车，此常礼也，惟太守出，则增一马。”故称五马，这里指达官贵人。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]秦地：现今陕西省关中地区。<br>[2]罗敷（fū）女：乐府诗《陌上桑》有“日出东南隅，照我秦氏楼。秦氏有好女，自言名罗敷。罗敷善蚕桑，采桑城南隅”的诗句。<br>[3]妾：古代女子用以自称的谦词。</p>", "englishHtml": "<p class=\"poem-lines\">(Spring)</p>\n<p class=\"prose\">The lovely Lo Fo[1]of the western land<br>Plucks mulberry leaves by the waterside.<br>Across the green boughs stretches out her white hand;<br>In golden sunshine her rosy robe is dyed.<br>“My silkworms are hungry,I cannot stay.<br>Tarry not with your five-horse cab,I pray.”</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Lo Fo and below-mentioned Xi Shi were beautiful ladies.</p>"}, {"num": "037", "zhTitle": "子夜吴歌", "enTitle": "Ballads of Four Seasons", "chinese": "（夏歌）\n镜湖[1]三百里，\n菡萏[2]发荷花。\n五月西施采，\n人看隘若耶[3]。\n回舟不待月，\n归去越王[4]家！\n《夏歌》写的是西施，她具有更深一层的美丽。她的美就像是湖中竞开的荷花，明明镜湖三百里，却因她太美，以致前来看她的人群使若耶都变得狭隘。然而西施的命运却是如此令人感慨，同样是由于她倾国倾城的美，“回舟不待月，归去越王家”。\n注释：\n[1]镜湖：位于今浙江省绍兴市东南。\n[2]菡（hàn）萏（dàn）：荷花的别称。古人将未开的荷花称为“菡萏”，即花苞。\n[3]若耶（yē）：若耶溪，今浙江省绍兴市境内。溪边原有浣纱石古迹，相传西施曾在此浣纱，又名“浣纱溪”。\n[4]越王：即越王勾践。", "english": "(Summer)\nOn Mirror Lake outspread for miles and miles,\nThe lotus lilies in full blossom teem.\nIn fifth moon Xi Shi gathers them with smiles,\nWatchers o’erwhelm the bank of Yoya Stream.\nHer boat turns back without waiting moonrise\nTo royal house amid amorous sighs.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">（夏歌）镜湖[1]三百里，<br>菡萏[2]发荷花。<br>五月西施采，<br>人看隘若耶[3]。<br>回舟不待月，<br>归去越王[4]家！</p>\n<p class=\"prose\">《夏歌》写的是西施，她具有更深一层的美丽。她的美就像是湖中竞开的荷花，明明镜湖三百里，却因她太美，以致前来看她的人群使若耶都变得狭隘。然而西施的命运却是如此令人感慨，同样是由于她倾国倾城的美，“回舟不待月，归去越王家”。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]镜湖：位于今浙江省绍兴市东南。<br>[2]菡（hàn）萏（dàn）：荷花的别称。古人将未开的荷花称为“菡萏”，即花苞。<br>[3]若耶（yē）：若耶溪，今浙江省绍兴市境内。溪边原有浣纱石古迹，相传西施曾在此浣纱，又名“浣纱溪”。<br>[4]越王：即越王勾践。</p>", "englishHtml": "<p class=\"poem-lines\">(Summer)</p>\n<p class=\"prose\">On Mirror Lake outspread for miles and miles,<br>The lotus lilies in full blossom teem.<br>In fifth moon Xi Shi gathers them with smiles,<br>Watchers o’erwhelm the bank of Yoya Stream.<br>Her boat turns back without waiting moonrise<br>To royal house amid amorous sighs.</p>"}, {"num": "038", "zhTitle": "子夜吴歌", "enTitle": "Ballads of Four Seasons", "chinese": "（秋歌）\n长安一片月，\n万户捣衣声。\n秋风吹不尽，\n总是玉关[1]情。\n何日平胡虏[2]？\n良人[3]罢远征！\n这首写的是妻子对边防士兵的怀念，开拓了吴歌的境界。诗从客观的写景入手，首先展现出月下万户捣衣的情景。捣衣是将衣料放在石砧上用木杵捶打，使之柔软，便于裁缝，制成衣服可以寄去边关。诗人听到风吹捣衣之声，仿佛是捣衣女对驻守玉门关外的丈夫的思念之情。西风吹不尽，思念之情也就不尽。最后，诗人设身处地为捣衣女着想，希望早日战胜边境的敌人，罢战之后，丈夫可以回到家乡。这样剥茧抽丝，先景后情，由远及近，由外到内，丝越抽越细，情越转越深，无怪乎王夫之说“前四句是天壤间生成好句，被太白拾得”了。\n注释：\n[1]玉关：玉门关，故址在今甘肃省敦煌市西北，此处代指良人戍边之地。\n[2]平胡虏：平定侵扰边境的敌人。\n[3]良人：古时妇女称呼丈夫“良人”。", "english": "(Autumn)\nMoonlight is spread all o’er the capital,\nThe sound of beating clothes far and near\nIs brought by autumn wind which can’t blow all\nThe longings away for far-off frontier.\nWhen can we vanquish the barbarian foe\nSo that our men no longer into battle go?", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">（秋歌）长安一片月，<br>万户捣衣声。<br>秋风吹不尽，<br>总是玉关[1]情。<br>何日平胡虏[2]？<br>良人[3]罢远征！</p>\n<p class=\"prose\">这首写的是妻子对边防士兵的怀念，开拓了吴歌的境界。诗从客观的写景入手，首先展现出月下万户捣衣的情景。捣衣是将衣料放在石砧上用木杵捶打，使之柔软，便于裁缝，制成衣服可以寄去边关。诗人听到风吹捣衣之声，仿佛是捣衣女对驻守玉门关外的丈夫的思念之情。</p>\n<p class=\"prose\">西风吹不尽，思念之情也就不尽。最后，诗人设身处地为捣衣女着想，希望早日战胜边境的敌人，罢战之后，丈夫可以回到家乡。这样剥茧抽丝，先景后情，由远及近，由外到内，丝越抽越细，情越转越深，无怪乎王夫之说“前四句是天壤间生成好句，被太白拾得”了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]玉关：玉门关，故址在今甘肃省敦煌市西北，此处代指良人戍边之地。<br>[2]平胡虏：平定侵扰边境的敌人。<br>[3]良人：古时妇女称呼丈夫“良人”。</p>", "englishHtml": "<p class=\"poem-lines\">(Autumn)</p>\n<p class=\"prose\">Moonlight is spread all o’er the capital,<br>The sound of beating clothes far and near<br>Is brought by autumn wind which can’t blow all<br>The longings away for far-off frontier.<br>When can we vanquish the barbarian foe<br>So that our men no longer into battle go?</p>"}, {"num": "039", "zhTitle": "子夜吴歌", "enTitle": "Ballads of Four Seasons", "chinese": "（冬歌）\n明朝驿使[1]发，\n一夜絮征袍。\n素手[2]抽针冷，\n那堪把剪刀！\n裁缝寄远道，\n几日到临洮[3]？\n《冬歌》采用的是另一种写法。没有景物描写，代以叙事。事件被安排在一个有意味的时刻——传送征衣的驿使即将出发的前夜，大大增强了此诗的情节性和戏剧味。此诗的中心围绕着一个矛盾展开，天气寒冷，“素手抽针冷，那堪把剪刀”，而驿使明天就要出发，时间太紧迫，由此看来，诗中女子是想多些时间将征袍细细做来的，但又想到“裁缝寄远道，几日到临洮”，又恨不得马上完成，好让驿使赶紧出发。这种矛盾，塑造出一个活生生的思妇形象，成功表达了诗歌的主题。\n注释：\n[1]驿使：驿站里负责传送文书、物件的人；驿：驿站、驿管。\n[2]素手：指妇女白皙的双手。\n[3]临洮：在今甘肃省定西市，此泛指边地。", "english": "(Winter)\nThe courier will depart next day,she’s told,\nShe sews a warrior’s gown all night.\nHer fingers feel the needle cold.\nHow can she hold the scissors tight?\nThe work is done,she sends it far away.\nWhen will it reach the town where warriors stay?", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">（冬歌）明朝驿使[1]发，<br>一夜絮征袍。<br>素手[2]抽针冷，<br>那堪把剪刀！<br>裁缝寄远道，<br>几日到临洮[3]？</p>\n<p class=\"prose\">《冬歌》采用的是另一种写法。没有景物描写，代以叙事。事件被安排在一个有意味的时刻——传送征衣的驿使即将出发的前夜，大大增强了此诗的情节性和戏剧味。</p>\n<p class=\"prose\">此诗的中心围绕着一个矛盾展开，天气寒冷，“素手抽针冷，那堪把剪刀”，而驿使明天就要出发，时间太紧迫，由此看来，诗中女子是想多些时间将征袍细细做来的，但又想到“裁缝寄远道，几日到临洮”，又恨不得马上完成，好让驿使赶紧出发。</p>\n<p class=\"prose\">这种矛盾，塑造出一个活生生的思妇形象，成功表达了诗歌的主题。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]驿使：驿站里负责传送文书、物件的人；驿：驿站、驿管。<br>[2]素手：指妇女白皙的双手。<br>[3]临洮：在今甘肃省定西市，此泛指边地。</p>", "englishHtml": "<p class=\"poem-lines\">(Winter)</p>\n<p class=\"prose\">The courier will depart next day,she’s told,<br>She sews a warrior’s gown all night.<br>Her fingers feel the needle cold.<br>How can she hold the scissors tight?<br>The work is done,she sends it far away.<br>When will it reach the town where warriors stay?</p>"}, {"num": "040", "zhTitle": "将进酒", "enTitle": "Invitation to Wine", "chinese": "君不见黄河之水天上来，\n奔流到海不复回！\n君不见高堂[2]明镜悲白发，\n朝如青丝暮成雪！\n人生得意须尽欢，\n莫使金樽空对月。\n天生我材必有用，\n千金散尽还复来。\n烹羊宰牛且为乐，\n会须一饮三百杯。\n岑夫子，\n丹丘生[3]，\n将进酒，\n杯莫停。\n与君歌一曲，\n请君为我侧耳听。\n钟鼓[4]馔玉[5]不足贵，\n但愿长醉不复醒。\n古来圣贤皆寂寞，\n惟有饮者留其名。\n陈王[6]昔时宴平乐，\n斗酒十千恣[7]欢谑。\n主人何为言少钱，\n径须沽[8]取对君酌。\n五花马，千金裘，\n呼儿将出换美酒，\n与尔同销万古愁。\n《将进酒》是李白奉诏上长安，又被“赐金还山”后的作品。他在洛阳遇到两位朋友，三人开怀畅饮，就写下了这首劝酒诗。开始他写黄金岁月犹如黄河流水一样一去不返，满头青丝已有白发，而自己却壮志未酬，不禁悲从中来。但是悲中有壮，因为道路虽然坎坷，失望还没变成绝望，所以发出了“天生我材必有用”的呼声。但一想到荣华富贵转眼消逝，古代圣贤也不得志，如才华绝代的曹植都被闲置不用，只靠饮酒作乐来打发日子。自己也只好学他那样，卖马换酒，尽情一醉，把自己积郁千年的忧愁设法一扫而光。诗中忽悲忽乐，忽乐忽悲，悲中有乐，乐中有悲，这样波澜起伏，曲折多姿，反映了李白的矛盾心理，也反映了唐代社会光明与阴暗交错、光明还掩盖着黑暗的现实。\n注释：\n[1]将（qiānɡ）：请、愿。\n[2]高堂：高大的厅堂上。\n[3]岑（cén）夫子，丹丘生：指岑勋和元丹丘，二人均为李白的好友。\n[4]钟鼓：富贵人家宴会时奏乐使用的乐器。\n[5]馔玉：形容如玉石一样精美的食物。\n[6]陈王：指陈思王曹植。\n[7]恣：纵情任意、无拘无束。\n[8]沽：通“酤”，买或卖，这里指买。", "english": "Do you not see the Yellow River come from the sky,\nRushing into the sea and ne’er come back?\nDo you not see the mirrors bright in chambers high\nGrieve o’er your snow-white hair though once it was silk-black?\nWhen hopes are won,oh!Drink your fill in high delight,\nAnd never leave your wine cup empty in moonlight!\nHeaven has made us talents,we’re not made in vain.\nA thousand gold coins spent,more will turn up again.\nKill a cow,cook a sheep and let us merry be,\nAnd drink three hundred cupfuls of wine in high glee!\nDear friends of mine,\nCheer up,cheer up!\nI invite you to wine.\nDo not put down your cup!\nI will sing you a song,please hear,\nO hear!Lend me a willing ear!\nWhat difference will rare and costly dishes make?\nI only want to get drunk and never to wake.\nHow many great men were forgotten through the ages?\nBut great drinkers are more famous than sober sages.\nThe Prince of Poets feast’d in his palace at will,\nDrank wine at ten thousand a cask and laughed his fill.\nA host should not complain of money he is short,\nTo drink with you I will sell things of any sort.\nMy fur coat worth a thousand coins of gold\nAnd my flower-dappled horse may be sold\nTo buy good wine that we may drown the woe age-old.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">君不见黄河之水天上来，<br>奔流到海不复回！<br>君不见高堂[2]明镜悲白发，<br>朝如青丝暮成雪！<br>人生得意须尽欢，<br>莫使金樽空对月。<br>天生我材必有用，<br>千金散尽还复来。<br>烹羊宰牛且为乐，<br>会须一饮三百杯。<br>岑夫子，<br>丹丘生[3]，<br>将进酒，<br>杯莫停。<br>与君歌一曲，<br>请君为我侧耳听。<br>钟鼓[4]馔玉[5]不足贵，<br>但愿长醉不复醒。<br>古来圣贤皆寂寞，<br>惟有饮者留其名。<br>陈王[6]昔时宴平乐，<br>斗酒十千恣[7]欢谑。<br>主人何为言少钱，<br>径须沽[8]取对君酌。<br>五花马，千金裘，<br>呼儿将出换美酒，<br>与尔同销万古愁。</p>\n<p class=\"prose\">《将进酒》是李白奉诏上长安，又被“赐金还山”后的作品。他在洛阳遇到两位朋友，三人开怀畅饮，就写下了这首劝酒诗。开始他写黄金岁月犹如黄河流水一样一去不返，满头青丝已有白发，而自己却壮志未酬，不禁悲从中来。但是悲中有壮，因为道路虽然坎坷，失望还没变成绝望，所以发出了“天生我材必有用”的呼声。</p>\n<p class=\"prose\">但一想到荣华富贵转眼消逝，古代圣贤也不得志，如才华绝代的曹植都被闲置不用，只靠饮酒作乐来打发日子。自己也只好学他那样，卖马换酒，尽情一醉，把自己积郁千年的忧愁设法一扫而光。诗中忽悲忽乐，忽乐忽悲，悲中有乐，乐中有悲，这样波澜起伏，曲折多姿，反映了李白的矛盾心理，也反映了唐代社会光明与阴暗交错、光明还掩盖着黑暗的现实。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]将（qiānɡ）：请、愿。<br>[2]高堂：高大的厅堂上。<br>[3]岑（cén）夫子，丹丘生：指岑勋和元丹丘，二人均为李白的好友。<br>[4]钟鼓：富贵人家宴会时奏乐使用的乐器。<br>[5]馔玉：形容如玉石一样精美的食物。<br>[6]陈王：指陈思王曹植。<br>[7]恣：纵情任意、无拘无束。<br>[8]沽：通“酤”，买或卖，这里指买。</p>", "englishHtml": "<p class=\"prose\">Do you not see the Yellow River come from the sky,<br>Rushing into the sea and ne’er come back?<br>Do you not see the mirrors bright in chambers high<br>Grieve o’er your snow-white hair though once it was silk-black?<br>When hopes are won,oh!Drink your fill in high delight,<br>And never leave your wine cup empty in moonlight!<br>Heaven has made us talents,we’re not made in vain.<br>A thousand gold coins spent,more will turn up again.<br>Kill a cow,cook a sheep and let us merry be,<br>And drink three hundred cupfuls of wine in high glee!<br>Dear friends of mine,<br>Cheer up,cheer up!<br>I invite you to wine.<br>Do not put down your cup!<br>I will sing you a song,please hear,<br>O hear!Lend me a willing ear!<br>What difference will rare and costly dishes make?<br>I only want to get drunk and never to wake.<br>How many great men were forgotten through the ages?<br>But great drinkers are more famous than sober sages.<br>The Prince of Poets feast’d in his palace at will,<br>Drank wine at ten thousand a cask and laughed his fill.<br>A host should not complain of money he is short,<br>To drink with you I will sell things of any sort.<br>My fur coat worth a thousand coins of gold<br>And my flower-dappled horse may be sold<br>To buy good wine that we may drown the woe age-old.</p>"}, {"num": "041", "zhTitle": "赠孟浩然", "enTitle": "To Meng Haoran", "chinese": "吾爱孟夫子[1]，\n风流[2]天下闻。\n红颜弃轩冕，\n白首卧松云。\n醉月频中圣[3]，\n迷花不事君[4]。\n高山[5]安可仰？\n徒此揖清芬。\n孟浩然是比李白年长12岁的诗人，这首诗大约是公元739年写的。第一联开门见山，写孟浩然潇洒的风度和不凡的才华。第二联说他年轻时不羡慕车马官服，后来又热爱松风白云，从反面说到正面。第三联却从正面到反面，说他宁可做月下饮酒的圣人，不做侍奉君王的大臣。最后用《诗经》中“高山仰止”的形象，把自己的爱慕具体化。这是一首用飘逸风格来写飘逸诗人，不为格律所拘的五言律诗。\n注释：\n[1]孟夫子：指孟浩然。夫子，一般的尊称。\n[2]风流：古人以风流赞美文人，主要是指有文采，善词章，风度潇洒，不钻营苟且等。\n[3]中圣：“中圣人”的简称，即醉酒。中：读去声，动词，“中暑”之“中”，此为饮清酒而醉，故曰中圣。\n[4]事君：侍奉皇帝。\n[5]高山：形容孟浩然品格高尚，令人敬仰。另有《经·小雅·车舝》：“高山仰止，景行行止”。", "english": "Dear Master Meng,I hail you from the heart,\nOf your high value all the world is proud.\nRed-cheek’d,from cap to cab you kept apart;\nWhite-haired,you lie beneath the pine and cloud.\nDrunken with wine as oft as with moonlight,\nYou love the blooms too much to serve the crown.\nOf lofty mountain how to reach the height?\nWe can but breathe your fragrance the wind brings down.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">吾爱孟夫子[1]，<br>风流[2]天下闻。<br>红颜弃轩冕，<br>白首卧松云。<br>醉月频中圣[3]，<br>迷花不事君[4]。<br>高山[5]安可仰？<br>徒此揖清芬。</p>\n<p class=\"prose\">孟浩然是比李白年长12岁的诗人，这首诗大约是公元739年写的。第一联开门见山，写孟浩然潇洒的风度和不凡的才华。第二联说他年轻时不羡慕车马官服，后来又热爱松风白云，从反面说到正面。第三联却从正面到反面，说他宁可做月下饮酒的圣人，不做侍奉君王的大臣。</p>\n<p class=\"prose\">最后用《诗经》中“高山仰止”的形象，把自己的爱慕具体化。这是一首用飘逸风格来写飘逸诗人，不为格律所拘的五言律诗。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]孟夫子：指孟浩然。夫子，一般的尊称。<br>[2]风流：古人以风流赞美文人，主要是指有文采，善词章，风度潇洒，不钻营苟且等。<br>[3]中圣：“中圣人”的简称，即醉酒。中：读去声，动词，“中暑”之“中”，此为饮清酒而醉，故曰中圣。<br>[4]事君：侍奉皇帝。<br>[5]高山：形容孟浩然品格高尚，令人敬仰。另有《经·小雅·车舝》：“高山仰止，景行行止”。</p>", "englishHtml": "<p class=\"prose\">Dear Master Meng,I hail you from the heart,<br>Of your high value all the world is proud.<br>Red-cheek’d,from cap to cab you kept apart;<br>White-haired,you lie beneath the pine and cloud.<br>Drunken with wine as oft as with moonlight,<br>You love the blooms too much to serve the crown.<br>Of lofty mountain how to reach the height?<br>We can but breathe your fragrance the wind brings down.</p>"}, {"num": "042", "zhTitle": "夜泊牛渚怀古", "enTitle": "Thoughts on Old Time from a Night-Mooring near Cattle Hill", "chinese": "牛渚[1]西江[2]夜，\n青天无片云。\n登舟望秋月，\n空忆谢将军[3]。\n余亦能高咏，\n斯人[4]不可闻。\n明朝挂帆席，\n枫叶落纷纷。\n牛渚在安徽马鞍山，山脚插入长江，就是著名的采石矶。李白月夜泊舟牛渚，不禁想起了晋朝镇守牛渚的谢将军，将军赞赏袁宏在船上朗诵的咏史诗，使袁宏声名大振。而李白和袁宏同病相怜，却没有人扶持。最后诗人又想象离开时的落叶秋色，用写景来衬托不遇知音的寂寞情怀。王夫之说这首诗是“不着一字，尽得风流”的典型。李白死后就葬在采石矶。\n注释：\n[1]牛渚：山名，在今安徽省马鞍山市西南。\n[2]西江：从南京以西到江西境内的一段长江，古代称西江。\n[3]谢将军：东晋谢尚，今河南省周口市太康县人，官镇西将军。\n[4]斯人：指谢尚。", "english": "I moor near Cattle Hill at night\nWhen there’s no cloud to fleck the sky.\nOn deck I gaze at the moon so bright,\nThinking of General Xie[1]with a sigh.\nI too can chant—to what avail?\nNone has like him a listening ear.\nTomorrow I shall hoist my sail,\n’Mid fallen maple leaves I’ll leave here.\n注释：\n[1]General Xie of the Jin Dynasty(265–420)praised a young poet who chanted his poem one moonlit night on the river by Cattle Hill(in present-day Anhui Province).", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">牛渚[1]西江[2]夜，<br>青天无片云。<br>登舟望秋月，<br>空忆谢将军[3]。<br>余亦能高咏，<br>斯人[4]不可闻。<br>明朝挂帆席，<br>枫叶落纷纷。</p>\n<p class=\"prose\">牛渚在安徽马鞍山，山脚插入长江，就是著名的采石矶。李白月夜泊舟牛渚，不禁想起了晋朝镇守牛渚的谢将军，将军赞赏袁宏在船上朗诵的咏史诗，使袁宏声名大振。而李白和袁宏同病相怜，却没有人扶持。最后诗人又想象离开时的落叶秋色，用写景来衬托不遇知音的寂寞情怀。</p>\n<p class=\"prose\">王夫之说这首诗是“不着一字，尽得风流”的典型。李白死后就葬在采石矶。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]牛渚：山名，在今安徽省马鞍山市西南。<br>[2]西江：从南京以西到江西境内的一段长江，古代称西江。<br>[3]谢将军：东晋谢尚，今河南省周口市太康县人，官镇西将军。<br>[4]斯人：指谢尚。</p>", "englishHtml": "<p class=\"prose\">I moor near Cattle Hill at night<br>When there’s no cloud to fleck the sky.<br>On deck I gaze at the moon so bright,<br>Thinking of General Xie[1]with a sigh.<br>I too can chant—to what avail?<br>None has like him a listening ear.<br>Tomorrow I shall hoist my sail,<br>’Mid fallen maple leaves I’ll leave here.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]General Xie of the Jin Dynasty(265–420)praised a young poet who chanted his poem one moonlit night on the river by Cattle Hill(in present-day Anhui Province).</p>"}, {"num": "043", "zhTitle": "客中行", "enTitle": "While Journeying", "chinese": "兰陵[2]美酒郁金香，\n玉碗[3]盛来琥珀光。\n但使[4]主人能醉客[5]，\n不知何处是他乡。\n李白曾在开元年间移居东鲁，这首诗作于东鲁的兰陵，而称兰陵为“客中”，因此当作于移居东鲁之前。兰陵虽是做客之地，但和美酒联系起来，就带有留恋的感情色彩；加上美酒是用郁金香加工浸制的，有醇浓的香味，盛在晶莹的玉碗里，看起来就像琥珀一般光艳。这样的美酒还有好客的主人作陪，所以诗人虽然身在客中，却乐而忘忧，不觉得是在他乡了。这首诗被法国女诗人戈谢译成法文，又被德国作曲家马勒编为《大地之歌》第三乐章，在全世界广为流传。\n注释：\n[1]客中：指旅居他乡。\n[2]兰陵：今山东省临沂市苍山县兰陵镇。\n[3]玉碗：玉制的食具，亦泛指精美的碗。\n[4]但使：只要。\n[5]醉客：让客人喝醉酒；醉，使动用法。", "english": "How flavorous is golden-tuliped Lanling[1]wine!\nFilling my bowl of jade,in amber it will glow.\nIt is enough if you can make me drunk,host mine,\nNo more nostalgia in foreign land shall I know.\n注释：\n[1]In present-day Shandong Province.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">兰陵[2]美酒郁金香，<br>玉碗[3]盛来琥珀光。<br>但使[4]主人能醉客[5]，<br>不知何处是他乡。</p>\n<p class=\"prose\">李白曾在开元年间移居东鲁，这首诗作于东鲁的兰陵，而称兰陵为“客中”，因此当作于移居东鲁之前。兰陵虽是做客之地，但和美酒联系起来，就带有留恋的感情色彩；加上美酒是用郁金香加工浸制的，有醇浓的香味，盛在晶莹的玉碗里，看起来就像琥珀一般光艳。</p>\n<p class=\"prose\">这样的美酒还有好客的主人作陪，所以诗人虽然身在客中，却乐而忘忧，不觉得是在他乡了。这首诗被法国女诗人戈谢译成法文，又被德国作曲家马勒编为《大地之歌》第三乐章，在全世界广为流传。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]客中：指旅居他乡。<br>[2]兰陵：今山东省临沂市苍山县兰陵镇。<br>[3]玉碗：玉制的食具，亦泛指精美的碗。<br>[4]但使：只要。<br>[5]醉客：让客人喝醉酒；醉，使动用法。</p>", "englishHtml": "<p class=\"prose\">How flavorous is golden-tuliped Lanling[1]wine!<br>Filling my bowl of jade,in amber it will glow.<br>It is enough if you can make me drunk,host mine,<br>No more nostalgia in foreign land shall I know.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Shandong Province.</p>"}, {"num": "044", "zhTitle": "陌上赠美人", "enTitle": "To a Fair Lady Encountered on the Road", "chinese": "骏马骄[1]行踏落花，\n垂鞭直[2]拂五云车[3]。\n美人一笑褰[4]珠箔，\n遥指红楼[5]是妾家。\n芳草鲜美、落英缤纷的季节，骑着高大骏马的英姿勃发的男子，潇洒地走在路上，完全是一个“白马王子”的形象。五云车是传说中神仙乘的车，这样华丽的香车中乘坐的是怎样的女子呢？于是拍马上前，挥鞭拂车。纤纤玉手掀起珠帘，珠帘后是如花笑靥，指着不远的红楼道，那是我的家。这是一首爱情诗，诗的画面感很强，诗人绘声绘色地勾勒了一幅浪漫唯美的画面。\n注释：\n[1]骄：指高大健壮的骏马。\n[2]直：特地，故意。\n[3]五云车：传说中神仙的座驾。这里指华美的车驾。\n[4]褰：提起，撩起。\n[5]红楼：一作青楼。", "english": "I trample fallen flowers on a steed so proud,\nAnd flick my whip at a cab of five-colored cloud.\nThe jewelled curtain drawn reveals a lady fair.\nSmiling,she points to a mansion red,“My house is there.”", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">骏马骄[1]行踏落花，<br>垂鞭直[2]拂五云车[3]。<br>美人一笑褰[4]珠箔，<br>遥指红楼[5]是妾家。</p>\n<p class=\"prose\">芳草鲜美、落英缤纷的季节，骑着高大骏马的英姿勃发的男子，潇洒地走在路上，完全是一个“白马王子”的形象。五云车是传说中神仙乘的车，这样华丽的香车中乘坐的是怎样的女子呢？于是拍马上前，挥鞭拂车。纤纤玉手掀起珠帘，珠帘后是如花笑靥，指着不远的红楼道，那是我的家。</p>\n<p class=\"prose\">这是一首爱情诗，诗的画面感很强，诗人绘声绘色地勾勒了一幅浪漫唯美的画面。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]骄：指高大健壮的骏马。<br>[2]直：特地，故意。<br>[3]五云车：传说中神仙的座驾。这里指华美的车驾。<br>[4]褰：提起，撩起。<br>[5]红楼：一作青楼。</p>", "englishHtml": "<p class=\"prose\">I trample fallen flowers on a steed so proud,<br>And flick my whip at a cab of five-colored cloud.<br>The jewelled curtain drawn reveals a lady fair.<br>Smiling,she points to a mansion red,“My house is there.”</p>"}, {"num": "045", "zhTitle": "登太白峰", "enTitle": "Ascending the Snow-White Peak", "chinese": "西上太白[2]峰，\n夕阳穷登攀。\n太白与我语，\n为我开天关[3]。\n愿乘泠风[4]去，\n直出浮云间。\n举手可近月，\n前行若无山。\n一别武功[5]去，\n何时复更还？\n李白于公元742年应诏入京时，踌躇满志。但是，由于朝廷昏庸，权贵排斥，他的政治抱负根本无法实现，这使他感到惆怅与苦闷。此诗即作于这个时期。即使是李白遍访名山求仙问道，在他的想象中，也应该是神仙主动搭话。因为他不被凡夫俗子所理解，只能想象具有更高深的思想意识的神仙来理解他、抚慰他。所以诗中太白星来同他攀谈，为他打开天门，而诗人自己也表示愿意随他同往仙境，从侧面显示了诗人仕途的失意和对现实的不满。正当诗人于想象中徜徉时，回头看见人间，此一别，何时还？一丝留恋，萦绕心间。\n注释：\n[1]太白峰：太白山，又名太乙山、太一山。山峰极高，常有积雪。\n[2]太白：指太白星，即金星。这里喻指仙人。\n[3]天关：古星名，又名天门。《晋书·天文志》：“东方，角宿二星为天关，其间天门也，其内天庭也。故黄道经其中，七曜之所行也。”这里指想象中的天界门户。\n[4]泠（línɡ）风：和煦轻微之风。\n[5]武功：古代武功县。", "english": "Ascending from the west the Peak Snow-White,\nNot till the sun goes down I reach its height.\nThe snow-white Morning Star tells me to wait\nUntil he opens the Celestial Gate.\nI wish to ride cold wind and floating cloud\nTo touch the moon and dwarf all mountains proud.\nBut once I left behind the Western land,\nCould I return to the summit where I stand?\n注释：\n[1]Or the Great White Mountain in Shaanxi Province.", "poemType": "五言古诗", "chineseHtml": "<p class=\"poem-lines\">西上太白[2]峰，<br>夕阳穷登攀。<br>太白与我语，<br>为我开天关[3]。<br>愿乘泠风[4]去，<br>直出浮云间。<br>举手可近月，<br>前行若无山。<br>一别武功[5]去，<br>何时复更还？</p>\n<p class=\"prose\">李白于公元742年应诏入京时，踌躇满志。但是，由于朝廷昏庸，权贵排斥，他的政治抱负根本无法实现，这使他感到惆怅与苦闷。此诗即作于这个时期。即使是李白遍访名山求仙问道，在他的想象中，也应该是神仙主动搭话。因为他不被凡夫俗子所理解，只能想象具有更高深的思想意识的神仙来理解他、抚慰他。</p>\n<p class=\"prose\">所以诗中太白星来同他攀谈，为他打开天门，而诗人自己也表示愿意随他同往仙境，从侧面显示了诗人仕途的失意和对现实的不满。正当诗人于想象中徜徉时，回头看见人间，此一别，何时还？一丝留恋，萦绕心间。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]太白峰：太白山，又名太乙山、太一山。山峰极高，常有积雪。<br>[2]太白：指太白星，即金星。这里喻指仙人。<br>[3]天关：古星名，又名天门。《晋书·天文志》：“东方，角宿二星为天关，其间天门也，其内天庭也。故黄道经其中，七曜之所行也。”这里指想象中的天界门户。<br>[4]泠（línɡ）风：和煦轻微之风。<br>[5]武功：古代武功县。</p>", "englishHtml": "<p class=\"prose\">Ascending from the west the Peak Snow-White,<br>Not till the sun goes down I reach its height.<br>The snow-white Morning Star tells me to wait<br>Until he opens the Celestial Gate.<br>I wish to ride cold wind and floating cloud<br>To touch the moon and dwarf all mountains proud.<br>But once I left behind the Western land,<br>Could I return to the summit where I stand?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Or the Great White Mountain in Shaanxi Province.</p>"}, {"num": "046", "zhTitle": "登广武古战场怀古", "enTitle": "Reflections on the Ancient Battlefield at Guangwu", "chinese": "秦鹿[1]奔野草，\n逐之若飞蓬。\n项王气盖世，\n紫电明双瞳[2]。\n呼吸[3]八千人，\n横行起江东。\n赤精斩白帝，\n叱咤入关中。\n两龙[4]不并跃，\n五纬与天同。\n楚灭无英图，\n汉兴有成功。\n这是一首大气磅礴的诗，读来令人荡气回肠。前半部分概括从秦末到汉初的历史，但写得非常生动，人物描写各具特色，形象丰满，活灵活现。后半部分则是站在今者的角度去思考去想象，“拨乱属豪圣，俗儒安可通”，拨乱反正、力挽狂澜从来都需要英雄豪杰，凡夫俗子能干些什么呢？结尾更是借阮籍讽刺庸俗的儒生无用，只会诋毁英雄。这首诗显示了作者对建功立业的向往，也从侧面反映了现实中诗人的处境。\n注释：\n[1]秦鹿：出自“逐鹿”典故。《史记》：蒯通曰：“秦失其鹿，天下共逐之，于是高材捷足者先得焉。”张晏曰：“以鹿喻帝位也。”\n[2]双瞳：传说项羽眼球有两个瞳孔。《史记·项羽本纪》：“闻项羽亦重瞳子。”\n[3]呼吸：一呼即来。\n[4]两龙：指刘邦和项羽。", "english": "The Emperor of Qin had lost his deer[2],\nAnd heroes chased it as thistle-down flies.\nThe Prince of Chu was brave without a peer,\nWith purple flashes in double-pupiled eyes.\nHe called eight thousand Southern youths to fight,\nFrom eastern River shore they swept the foes.\nThe Duke of Han had killed the Serpent white,\nAnd breaking through the Pass,his war cries rose.\nTwo rival Dragons reigned not at same time,\nAnd five propitious stars appeared on high.\nChu perished for lack of ideal sublime;\nThe Duke expanded his realm beneath the sky.\n按剑清八极[3]，\n归酣歌《大风》。\n伊昔临广武，\n连兵[4]决雌雄。\n分我一杯羹，\n太皇乃汝翁。\n战争有古迹，\n壁垒颓层穹。\n猛虎啸洞壑，\n饥鹰鸣秋空。\n翔云列晓阵，\n杀气赫长虹。\n拨乱属豪圣，\n俗儒安可通？\n沉湎呼竖子，\n狂言非至公。\n抚掌黄河曲，\n嗤嗤阮嗣宗。\nHe cleared eight borders with the sword he did wield,\nAnd came back drunk and sang The Great Wind Song[5].\nHis army once came to this battlefield,\nAnd fought the Prince to see who was the strong.\nHis father,captured,would be boiled alive,\n“My father’s yours,”he said,“in weal and woe.”\nOf ancient war few relics still survive,\nThe ramparts crumble to mounds high and low.\nFierce growling tigers fill the caves with dismay,\nAnd hungry eagles cleave the autumn sky.\nThe morning clouds still make a battle array,\nAnd war cries seem to pelt the rainbow on high.\nTo end disorder is the deed of sage.\nPedantic scholar[6],how dare you declare,\nDrunken,the Duke was fellow of village?\nYou’re mad and frenzy,unjust and unfair.\nI clap my hands in view of this battleground,\nAnd laugh away your ignorance profound.\n注释：\n[1]The battlefield in present-day Henan Province where Xiang Yu,Prince of Chu,fought against Liu Bang,Duke of Han,who won and became the first emperor of the Han Dynas ty in 206 B.C.\n[2]His throne.\n[3]八极：指最边远的地方。\n[4]连兵：兵刃相连，正面交锋。\n[5]The first seven-charactered poem written by Liu Bang.\n[6]Ruan Ji,scholar of the Jin Dynasty(265–420),who said on his visit to the battlefield at Guangwu that there was no hero in the world and a village fellow like Liu Bang had risen to fame.", "poemType": "五言古诗", "chineseHtml": "<p class=\"poem-lines\">秦鹿[1]奔野草，<br>逐之若飞蓬。<br>项王气盖世，<br>紫电明双瞳[2]。<br>呼吸[3]八千人，<br>横行起江东。<br>赤精斩白帝，<br>叱咤入关中。<br>两龙[4]不并跃，<br>五纬与天同。<br>楚灭无英图，<br>汉兴有成功。</p>\n<p class=\"prose\">这是一首大气磅礴的诗，读来令人荡气回肠。前半部分概括从秦末到汉初的历史，但写得非常生动，人物描写各具特色，形象丰满，活灵活现。后半部分则是站在今者的角度去思考去想象，“拨乱属豪圣，俗儒安可通”，拨乱反正、力挽狂澜从来都需要英雄豪杰，凡夫俗子能干些什么呢？</p>\n<p class=\"prose\">结尾更是借阮籍讽刺庸俗的儒生无用，只会诋毁英雄。这首诗显示了作者对建功立业的向往，也从侧面反映了现实中诗人的处境。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]秦鹿：出自“逐鹿”典故。《史记》：蒯通曰：“秦失其鹿，天下共逐之，于是高材捷足者先得焉。”张晏曰：“以鹿喻帝位也。”<br>[2]双瞳：传说项羽眼球有两个瞳孔。《史记·项羽本纪》：“闻项羽亦重瞳子。”<br>[3]呼吸：一呼即来。<br>[4]两龙：指刘邦和项羽。</p>", "englishHtml": "<p class=\"prose\">The Emperor of Qin had lost his deer[2],<br>And heroes chased it as thistle-down flies.<br>The Prince of Chu was brave without a peer,<br>With purple flashes in double-pupiled eyes.<br>He called eight thousand Southern youths to fight,<br>From eastern River shore they swept the foes.<br>The Duke of Han had killed the Serpent white,<br>And breaking through the Pass,his war cries rose.<br>Two rival Dragons reigned not at same time,<br>And five propitious stars appeared on high.<br>Chu perished for lack of ideal sublime;<br>The Duke expanded his realm beneath the sky.<br>按剑清八极[3]，<br>归酣歌《大风》。<br>伊昔临广武，<br>连兵[4]决雌雄。<br>分我一杯羹，<br>太皇乃汝翁。<br>战争有古迹，<br>壁垒颓层穹。<br>猛虎啸洞壑，<br>饥鹰鸣秋空。<br>翔云列晓阵，<br>杀气赫长虹。<br>拨乱属豪圣，<br>俗儒安可通？<br>沉湎呼竖子，<br>狂言非至公。<br>抚掌黄河曲，<br>嗤嗤阮嗣宗。<br>He cleared eight borders with the sword he did wield,<br>And came back drunk and sang The Great Wind Song[5].<br>His army once came to this battlefield,<br>And fought the Prince to see who was the strong.<br>His father,captured,would be boiled alive,<br>“My father’s yours,”he said,“in weal and woe.”<br>Of ancient war few relics still survive,<br>The ramparts crumble to mounds high and low.<br>Fierce growling tigers fill the caves with dismay,<br>And hungry eagles cleave the autumn sky.<br>The morning clouds still make a battle array,<br>And war cries seem to pelt the rainbow on high.<br>To end disorder is the deed of sage.<br>Pedantic scholar[6],how dare you declare,<br>Drunken,the Duke was fellow of village?<br>You’re mad and frenzy,unjust and unfair.<br>I clap my hands in view of this battleground,<br>And laugh away your ignorance profound.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The battlefield in present-day Henan Province where Xiang Yu,Prince of Chu,fought against Liu Bang,Duke of Han,who won and became the first emperor of the Han Dynas ty in 206 B.C.<br>[2]His throne.<br>[3]八极：指最边远的地方。<br>[4]连兵：兵刃相连，正面交锋。<br>[5]The first seven-charactered poem written by Liu Bang.<br>[6]Ruan Ji,scholar of the Jin Dynasty(265–420),who said on his visit to the battlefield at Guangwu that there was no hero in the world and a village fellow like Liu Bang had risen to fame.</p>"}, {"num": "047", "zhTitle": "南陵别儿童入京", "enTitle": "Parting from My Children at Nanlingfor the Capital", "chinese": "白酒新熟山中归，\n黄鸡啄黍[2]秋正肥。\n呼童烹鸡酌白酒，\n儿女嬉笑牵人衣。\n高歌取醉欲自慰，\n起舞落日争光辉。\n游说[3]万乘[4]苦不早，\n著鞭跨马涉远道。\n会稽愚妇轻买臣[5]，\n余亦辞家西入秦。\n仰天大笑出门去，\n我辈岂是蓬蒿人[6]？\n公元742年，李白接到入京的诏书。他以为自己的政治理想终于得以实现，遂与儿女告别，并写下此诗。山中游玩归来，时值浅秋，仓满黍黄，肥鸡新酒，一派丰收景象，开篇为全诗的情感基调做了铺垫。接下来的四句，则表现力十足地渲染这股欢愉的氛围，“嬉笑”“歌”“醉”“起舞”，欢欣鼓舞之情溢于言表。“游说万乘苦不早，著鞭跨马涉远道”表现诗人高兴之余，又有些“恨晚”，更巴不得马上踏上仕途，表达自己的政治主张。作者以晚年得志的朱买臣自比，以会稽愚妇讽刺轻视自己的世俗小人。末尾两句是诗人情感的宣泄，把诗人踌躇满志的形象表现得淋漓尽致。\n注释：\n[1]南陵：位于今安徽省芜湖市南陵县。\n[2]黍：古代专指一种子实叫黍子的一年生草本植物。\n[3]游说：战国时，有才之人以口辩舌战打动诸侯，获取官位，称为游说。\n[4]万乘（shènɡ）：此处指君主、皇帝。周朝制度，天子地方千里，车万乘。后来称皇帝为万乘。\n[5]买臣：即朱买臣，西汉会稽郡吴（今江苏省苏州市境内）人。\n[6]蓬蒿人：草野之人，即无官职的平民百姓。", "english": "I come to hillside home when wine is newly brewed,\nAnd yellow chicken feed on grains which autumn’s strewed.\nI call my lad to boil the fowl and pour the wine,\nMy children tug me by the sleeve,their faces shine.\nI sing away to show my joy when wine is drunk;\nI dance to vie in splendor with the sun half sunk.\nThough it is late to offer service to the crown,\nStill I will spur my horse on my way to renown.\nThe silly wife despised the talent not yet blest,\nI’ll leave my family and journey to the west.\nLooking up at the sky,I laugh aloud and go.\nAm I a man to crawl amid the brambles low?\n注释：\n[1]In present-day Anhui Province.", "poemType": "七言古诗", "chineseHtml": "<p class=\"poem-lines\">白酒新熟山中归，<br>黄鸡啄黍[2]秋正肥。<br>呼童烹鸡酌白酒，<br>儿女嬉笑牵人衣。<br>高歌取醉欲自慰，<br>起舞落日争光辉。<br>游说[3]万乘[4]苦不早，<br>著鞭跨马涉远道。<br>会稽愚妇轻买臣[5]，<br>余亦辞家西入秦。<br>仰天大笑出门去，<br>我辈岂是蓬蒿人[6]？</p>\n<p class=\"prose\">公元742年，李白接到入京的诏书。他以为自己的政治理想终于得以实现，遂与儿女告别，并写下此诗。山中游玩归来，时值浅秋，仓满黍黄，肥鸡新酒，一派丰收景象，开篇为全诗的情感基调做了铺垫。接下来的四句，则表现力十足地渲染这股欢愉的氛围，“嬉笑”“歌”“醉”“起舞”，欢欣鼓舞之情溢于言表。</p>\n<p class=\"prose\">“游说万乘苦不早，著鞭跨马涉远道”表现诗人高兴之余，又有些“恨晚”，更巴不得马上踏上仕途，表达自己的政治主张。作者以晚年得志的朱买臣自比，以会稽愚妇讽刺轻视自己的世俗小人。末尾两句是诗人情感的宣泄，把诗人踌躇满志的形象表现得淋漓尽致。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]南陵：位于今安徽省芜湖市南陵县。<br>[2]黍：古代专指一种子实叫黍子的一年生草本植物。<br>[3]游说：战国时，有才之人以口辩舌战打动诸侯，获取官位，称为游说。<br>[4]万乘（shènɡ）：此处指君主、皇帝。周朝制度，天子地方千里，车万乘。后来称皇帝为万乘。<br>[5]买臣：即朱买臣，西汉会稽郡吴（今江苏省苏州市境内）人。<br>[6]蓬蒿人：草野之人，即无官职的平民百姓。</p>", "englishHtml": "<p class=\"prose\">I come to hillside home when wine is newly brewed,<br>And yellow chicken feed on grains which autumn’s strewed.<br>I call my lad to boil the fowl and pour the wine,<br>My children tug me by the sleeve,their faces shine.<br>I sing away to show my joy when wine is drunk;<br>I dance to vie in splendor with the sun half sunk.<br>Though it is late to offer service to the crown,<br>Still I will spur my horse on my way to renown.<br>The silly wife despised the talent not yet blest,<br>I’ll leave my family and journey to the west.<br>Looking up at the sky,I laugh aloud and go.<br>Am I a man to crawl amid the brambles low?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Anhui Province.</p>"}, {"num": "048", "zhTitle": "清平调词", "enTitle": "The Beautiful Lady Yang", "chinese": "（三首其一）\n云想衣裳花想容，\n春风拂槛[2]露华浓[3]。\n若非群玉[4]山头见，\n会[5]向瑶台[6]月下逢。\n《清平调词》是李白写杨贵妃的名篇。他把杨贵妃和牡丹花合在一起写，写花也是写人。第一句说：见云可以想到美人的衣裳，见花可以想到她的美貌；也可以说是把衣裳想象为云，把美貌想象为花。第二句的春风可以暗喻君王的恩宠，说牡丹花在晶莹的露水中更显得浓艳。接着，第三句把杨贵妃比作群玉山头的仙女，第四句又比作月中瑶台前的嫦娥，这都是从空间上把她比作天仙的。\n注释：\n[1]清平调：唐大曲名，后用为词牌。\n[2]槛：栏杆。\n[3]露华浓：牡丹花沾着晶莹的露珠更显得颜色艳丽。\n[4]群玉：山名，中西王母所住之地。\n[5]会：应。\n[6]瑶台：亦指西王母所居宫殿。", "english": "(I)\nHer face is seen in flower and her dress in cloud,\nA beauty by the rails caressed by vernal breeze.\nIf not a Fairy Queen from Jade-Green Mountains proud,\nShe’s Goddess of the Moon in Crystal Hall one sees.\n注释：\n[1]Lady Yang Yuhuan was the favorite concubine of Tang Emperor Xuanzong(reigned 725–768).", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">（三首其一）<br>云想衣裳花想容，<br>春风拂槛[2]露华浓[3]。<br>若非群玉[4]山头见，<br>会[5]向瑶台[6]月下逢。</p>\n<p class=\"prose\">《清平调词》是李白写杨贵妃的名篇。他把杨贵妃和牡丹花合在一起写，写花也是写人。第一句说：见云可以想到美人的衣裳，见花可以想到她的美貌；也可以说是把衣裳想象为云，把美貌想象为花。第二句的春风可以暗喻君王的恩宠，说牡丹花在晶莹的露水中更显得浓艳。</p>\n<p class=\"prose\">接着，第三句把杨贵妃比作群玉山头的仙女，第四句又比作月中瑶台前的嫦娥，这都是从空间上把她比作天仙的。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]清平调：唐大曲名，后用为词牌。<br>[2]槛：栏杆。<br>[3]露华浓：牡丹花沾着晶莹的露珠更显得颜色艳丽。<br>[4]群玉：山名，中西王母所住之地。<br>[5]会：应。<br>[6]瑶台：亦指西王母所居宫殿。</p>", "englishHtml": "<p class=\"poem-lines\">(I)</p>\n<p class=\"prose\">Her face is seen in flower and her dress in cloud,<br>A beauty by the rails caressed by vernal breeze.<br>If not a Fairy Queen from Jade-Green Mountains proud,<br>She’s Goddess of the Moon in Crystal Hall one sees.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Lady Yang Yuhuan was the favorite concubine of Tang Emperor Xuanzong(reigned 725–768).</p>"}, {"num": "049", "zhTitle": "清平调词", "enTitle": "The Beautiful Lady Yang", "chinese": "（三首其二）\n一枝红艳露凝香，\n云雨巫山枉断肠。\n借问汉宫谁得似？\n可怜飞燕[1]倚新妆[2]。\n第二首第一句再把美人比花，不但写色，而且写香。然后从时间上来比，先比作楚襄王为之断肠的、朝为行云暮为雨的巫山神女，后比作汉成帝的宠妃，能做掌上舞的赵飞燕。不过飞燕倚仗新妆，杨妃却是天姿国色，这样借古喻今，又是抑古扬今了。\n注释：\n[1]飞燕：指西汉皇后赵飞燕。\n[2]妆：梳妆打扮。", "english": "(II)\nShe is a peony sweetened by dew impearled,\nFar fairer than the Goddess[1]bringing showers in dreams.\nWho could equal her in palace of ancient world?\nNot e’en the newly-dressed“Flying Swallow”[2],it seems.\n注释：\n[1]The legend said that the king of a Southern Kingdom dreamed of the Goddess of Wushan Mountains with whom he made love and who would come out in the morning in the form of a cloud and in the evening in the form of a shower.\n[2]“Flying Swallow”was the favorite concubine of Han Emperor Chengdi(reigned 32–6 B.C.)", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">（三首其二）<br>一枝红艳露凝香，<br>云雨巫山枉断肠。<br>借问汉宫谁得似？<br>可怜飞燕[1]倚新妆[2]。</p>\n<p class=\"prose\">第二首第一句再把美人比花，不但写色，而且写香。然后从时间上来比，先比作楚襄王为之断肠的、朝为行云暮为雨的巫山神女，后比作汉成帝的宠妃，能做掌上舞的赵飞燕。不过飞燕倚仗新妆，杨妃却是天姿国色，这样借古喻今，又是抑古扬今了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]飞燕：指西汉皇后赵飞燕。<br>[2]妆：梳妆打扮。</p>", "englishHtml": "<p class=\"poem-lines\">(II)</p>\n<p class=\"prose\">She is a peony sweetened by dew impearled,<br>Far fairer than the Goddess[1]bringing showers in dreams.<br>Who could equal her in palace of ancient world?<br>Not e’en the newly-dressed“Flying Swallow”[2],it seems.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The legend said that the king of a Southern Kingdom dreamed of the Goddess of Wushan Mountains with whom he made love and who would come out in the morning in the form of a cloud and in the evening in the form of a shower.<br>[2]“Flying Swallow”was the favorite concubine of Han Emperor Chengdi(reigned 32–6 B.C.)</p>"}, {"num": "050", "zhTitle": "清平调词", "enTitle": "The Beautiful Lady Yang", "chinese": "（三首其三）\n名花[1]倾国[2]两相欢，\n长得[3]君王带笑看。\n解释春风无限恨，\n沉香亭北倚阑干。\n第三首从仙境和古代回到现实中来，写倾国倾城的美人在沉香亭北倚栏赏花，使得君王百看不厌，解除了他的无限忧恨。语语浓艳，字字流芳，使美人名花融合为一，流传千古。\n注释：\n[1]名花：指牡丹花。\n[2]倾国：指杨贵妃。\n[3]得：使。", "english": "(III)\nThe lady fair admires and is admired by the flower,\nThe sovereign would gaze upon her with a smile.\nShe leans on balustrade north of the Fragrant Bower,\nThe longing of spring wind she knows how to beguile.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">（三首其三）<br>名花[1]倾国[2]两相欢，<br>长得[3]君王带笑看。<br>解释春风无限恨，<br>沉香亭北倚阑干。</p>\n<p class=\"prose\">第三首从仙境和古代回到现实中来，写倾国倾城的美人在沉香亭北倚栏赏花，使得君王百看不厌，解除了他的无限忧恨。语语浓艳，字字流芳，使美人名花融合为一，流传千古。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]名花：指牡丹花。<br>[2]倾国：指杨贵妃。<br>[3]得：使。</p>", "englishHtml": "<p class=\"poem-lines\">(III)</p>\n<p class=\"prose\">The lady fair admires and is admired by the flower,<br>The sovereign would gaze upon her with a smile.<br>She leans on balustrade north of the Fragrant Bower,<br>The longing of spring wind she knows how to beguile.</p>"}, {"num": "051", "zhTitle": "忆东山", "enTitle": "The Eastern Hill", "chinese": "（二首其一）\n不向东山久，\n蔷薇几度花[2]？\n白云还自散，\n明月落谁家？\n东山是东晋著名政治家谢安曾经隐居的地方。李白写这首诗的时候，大约正在长安。接到诏书入京之后，李白并没有得到谢安那样大展雄才的机会，反而由于放浪不羁，招致权贵的忌恨。他开始怀念以前的隐居了，他沉吟在流逝的时光中，感叹岁月蹉跎，他有些想离开了。诗中充满了何去何从的疑惑，透过这白云明月，诗人的情怀展露无遗。\n注释：\n[1]东山：在今浙江省绍兴市上虞区西南，相传是谢安曾游宴的地方。山上有谢安所建的白云、明月二堂。\n[2]花：此处为动词，意为开花。", "english": "(I)\nOnce more I come to Eastern Hill.\nHow many times has blown the rose?\nWhite clouds gather and scatter still.\nWhere sinks the moon of yore?Who knows?\n注释：\n[1]Xie An,poet-governor of the 4th century,resided in the Eastern Hill where there was a Cave of Roses,and he built the Hall of White Cloud and the Hall of Bright Moon on top of the hill(in present-day Zhejiang Province).", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">（二首其一）<br>不向东山久，<br>蔷薇几度花[2]？<br>白云还自散，<br>明月落谁家？</p>\n<p class=\"prose\">东山是东晋著名政治家谢安曾经隐居的地方。李白写这首诗的时候，大约正在长安。接到诏书入京之后，李白并没有得到谢安那样大展雄才的机会，反而由于放浪不羁，招致权贵的忌恨。他开始怀念以前的隐居了，他沉吟在流逝的时光中，感叹岁月蹉跎，他有些想离开了。</p>\n<p class=\"prose\">诗中充满了何去何从的疑惑，透过这白云明月，诗人的情怀展露无遗。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]东山：在今浙江省绍兴市上虞区西南，相传是谢安曾游宴的地方。山上有谢安所建的白云、明月二堂。<br>[2]花：此处为动词，意为开花。</p>", "englishHtml": "<p class=\"poem-lines\">(I)</p>\n<p class=\"prose\">Once more I come to Eastern Hill.<br>How many times has blown the rose?<br>White clouds gather and scatter still.<br>Where sinks the moon of yore?Who knows?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Xie An,poet-governor of the 4th century,resided in the Eastern Hill where there was a Cave of Roses,and he built the Hall of White Cloud and the Hall of Bright Moon on top of the hill(in present-day Zhejiang Province).</p>"}, {"num": "052", "zhTitle": "乌栖曲", "enTitle": "Crows Going Back to Their Nest—Satire on the King of Wu", "chinese": "姑苏台上乌栖时，\n吴王宫里醉西施。\n吴歌楚舞[2]欢未毕，\n青山欲衔半边日。\n银箭金壶[3]漏水多，\n起看秋月坠江波，\n东方渐高[4]奈乐何！\n《乌栖曲》是乐府旧题，但李白写的却非情歌艳曲。开篇写得虽是奢靡之境，却极简练，寥寥数笔，就勾画出日落时分姑苏台上吴宫的轮廓和宫中美人醉态朦胧的剪影，且更具象征意义。乌鸦代表衰败，夕阳下昏暗的吴宫，没有一丝帝王将相该有的文治武功之象，使人联想到吴国正在走向没落。在这样的氛围中，却有不合时宜的豪歌痛饮，欢未毕而时已暮。滴漏声声，长夜消逝，欢乐难继，好梦不再。享乐者的夜未央之梦，也必将破碎。诡异的表象下是鲜明的对照，诗人揭示了贪图享受的统治者的内心，讽刺当权者荒淫无道，不问国政。\n注释：\n[1]乌栖曲：乐府《清商曲辞》西曲歌调名。\n[2]吴歌楚舞：吴楚两国的歌舞。\n[3]银箭金壶：指刻漏，古时候的计时工具。\n[4]东方渐高（hào）：东方渐晓；高，同“皜”，白色，这里指晓色。", "english": "O’er Royal Terrace when crows flew back to their nest,\nThe king in Royal Palace feast’d his mistress drunk.\nThe Southern maidens sang and danced without a rest\nTill beak-like mountain-peaks would peck the sun half sunk.\nThe golden clepsydra could not stop water’s flow,\nO’er river waves the autumn moon was hanging low.\nBut wouldn’t the king enjoy his fill in Eastern glow?\n注释：\n[1]The king of Wu held perpetual revelries with his favorite mistress Xi Shi in his Royal Palace in the 5th century B.C.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">姑苏台上乌栖时，<br>吴王宫里醉西施。<br>吴歌楚舞[2]欢未毕，<br>青山欲衔半边日。<br>银箭金壶[3]漏水多，<br>起看秋月坠江波，<br>东方渐高[4]奈乐何！</p>\n<p class=\"prose\">《乌栖曲》是乐府旧题，但李白写的却非情歌艳曲。开篇写得虽是奢靡之境，却极简练，寥寥数笔，就勾画出日落时分姑苏台上吴宫的轮廓和宫中美人醉态朦胧的剪影，且更具象征意义。乌鸦代表衰败，夕阳下昏暗的吴宫，没有一丝帝王将相该有的文治武功之象，使人联想到吴国正在走向没落。</p>\n<p class=\"prose\">在这样的氛围中，却有不合时宜的豪歌痛饮，欢未毕而时已暮。滴漏声声，长夜消逝，欢乐难继，好梦不再。享乐者的夜未央之梦，也必将破碎。诡异的表象下是鲜明的对照，诗人揭示了贪图享受的统治者的内心，讽刺当权者荒淫无道，不问国政。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]乌栖曲：乐府《清商曲辞》西曲歌调名。<br>[2]吴歌楚舞：吴楚两国的歌舞。<br>[3]银箭金壶：指刻漏，古时候的计时工具。<br>[4]东方渐高（hào）：东方渐晓；高，同“皜”，白色，这里指晓色。</p>", "englishHtml": "<p class=\"prose\">O’er Royal Terrace when crows flew back to their nest,<br>The king in Royal Palace feast’d his mistress drunk.<br>The Southern maidens sang and danced without a rest<br>Till beak-like mountain-peaks would peck the sun half sunk.<br>The golden clepsydra could not stop water’s flow,<br>O’er river waves the autumn moon was hanging low.<br>But wouldn’t the king enjoy his fill in Eastern glow?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The king of Wu held perpetual revelries with his favorite mistress Xi Shi in his Royal Palace in the 5th century B.C.</p>"}, {"num": "053", "zhTitle": "下终南山过斛斯山人宿置酒", "enTitle": "Descending Zhongnan Mountainand Meeting Husi the Hermit", "chinese": "暮从碧山[1]下，\n山月随人归。\n却顾所来径[2]，\n苍苍横翠微[3]。\n相携及田家，\n童稚开荆扉[4]。\n绿竹入幽径，\n青萝拂行衣。\n欢言得所憩，\n美酒聊共挥。\n长歌吟松风，\n曲尽河星稀。\n我醉君复乐，\n陶然共忘机[5]。\n终南山在长安以南，唐代有士人在山中隐居，斛斯山人就是其中一个。李白游终南山下来，月亮似乎也随着他下山了，小路仿佛融进了一片苍翠的山色中。“相携”指斛斯山人，如果说是指月，那倒别有风趣。诗人与山人欢聚畅谈，饮酒挥洒自如，其乐融融，两人都甘于恬淡，与世无争。全诗平平淡淡，随随便便，浑不着力，并无惊人之句，然而诗中充溢着的是大自然的纯朴之美和诗人的真率之情。\n注释：\n[1]碧山：指终南山。\n[2]所来径：下山的小路。\n[3]翠微：青翠的山坡，此处亦指终南山。\n[4]荆扉：荆条编扎的小门。\n[5]忘机：忘记世俗、不谋虚名；机：世俗的心机。", "english": "At dusk I leave the hills behind,\nThe moon escorts me all the way.\nLooking back,I see the path wind\nAcross the woods so green and grey.\nWe come to your cot hand in hand,\nYour lad opens the gate for me.\nBamboos along the alley stand\nAnd vines caress my cloak with glee.\nI’m glad to talk and drink good wine\nTogether with my hermit friend.\nWe sing the songs of wind and pine,\nAnd stars are set when singings end.\nI’m drunk and you’re merry and glad:\nWe both forget the world is sad.\n注释：\n[1]South of Chang’an,the Tang capital.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">暮从碧山[1]下，<br>山月随人归。<br>却顾所来径[2]，<br>苍苍横翠微[3]。<br>相携及田家，<br>童稚开荆扉[4]。<br>绿竹入幽径，<br>青萝拂行衣。<br>欢言得所憩，<br>美酒聊共挥。<br>长歌吟松风，<br>曲尽河星稀。<br>我醉君复乐，<br>陶然共忘机[5]。</p>\n<p class=\"prose\">终南山在长安以南，唐代有士人在山中隐居，斛斯山人就是其中一个。李白游终南山下来，月亮似乎也随着他下山了，小路仿佛融进了一片苍翠的山色中。“相携”指斛斯山人，如果说是指月，那倒别有风趣。诗人与山人欢聚畅谈，饮酒挥洒自如，其乐融融，两人都甘于恬淡，与世无争。</p>\n<p class=\"prose\">全诗平平淡淡，随随便便，浑不着力，并无惊人之句，然而诗中充溢着的是大自然的纯朴之美和诗人的真率之情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]碧山：指终南山。<br>[2]所来径：下山的小路。<br>[3]翠微：青翠的山坡，此处亦指终南山。<br>[4]荆扉：荆条编扎的小门。<br>[5]忘机：忘记世俗、不谋虚名；机：世俗的心机。</p>", "englishHtml": "<p class=\"prose\">At dusk I leave the hills behind,<br>The moon escorts me all the way.<br>Looking back,I see the path wind<br>Across the woods so green and grey.<br>We come to your cot hand in hand,<br>Your lad opens the gate for me.<br>Bamboos along the alley stand<br>And vines caress my cloak with glee.<br>I’m glad to talk and drink good wine<br>Together with my hermit friend.<br>We sing the songs of wind and pine,<br>And stars are set when singings end.<br>I’m drunk and you’re merry and glad:<br>We both forget the world is sad.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]South of Chang’an,the Tang capital.</p>"}, {"num": "054", "zhTitle": "月下独酌", "enTitle": "Drinking Alone under the Moon", "chinese": "（四首其一）\n花间一壶酒，\n独酌无相亲[1]。\n举杯邀明月，\n对影成三人。\n月既不解饮，\n影徒随我身。\n暂伴月将[2]影，\n行乐须及春。\n我歌月徘徊，\n我舞影零乱。\n醒时同交欢[3]，\n醉后各分散。\n永结无情游，\n相期邈云汉[4]。\n公元744年，李白对“珠玉买歌笑，糟糠养贤才”的长安生活不满，感到寂寞，就去花间饮酒，写下了这首名作。开始两句写他孤独，“举杯”两句显得旷达，“月既”两句又写孤独，“暂伴”两句又似旷达。前八句是起伏相间，一抑一扬。接着四句不但旷达，而且俊逸。最后两句把想象引向高远，真是“飘然思不群”了。但孤独是现实，旷达是幻想。诗写得越旷达，越显得诗人孤独。不过幻想是对现实的否定和批判，所以旷达显示了积极的精神力量，造就了诗的美感。\n注释：\n[1]无相亲：没有亲近的人。\n[2]将：共，伴同。\n[3]同交欢：一起欢乐。\n[4]相期邈云汉：约定在天上相见；期：约会；邈：遥远；云汉：银河，这里指仙境。", "english": "(I)\nAmid the flowers,from a pot of wine\nI drink alone beneath the bright moonshine.\nI raise my cup to invite the Moon who blends\nHer light with my Shadow and we’re three friends.\nThe Moon does not know how to drink her share;\nIn vain my Shadow follows me here and there.\nTogether with them for the time I stay\nAnd make merry before spring’s spent away.\nI sing and the Moon lingers to hear my song;\nMy Shadow’s a mess while I dance along.\nSober,we three remain cheerful and gay;\nDrunken,we part and each may go his way.\nOur friendship will outshine all earthly love,\nNext time we’ll meet beyond the stars above.", "poemType": "五言古诗", "chineseHtml": "<p class=\"poem-lines\">（四首其一）<br>花间一壶酒，<br>独酌无相亲[1]。<br>举杯邀明月，<br>对影成三人。<br>月既不解饮，<br>影徒随我身。<br>暂伴月将[2]影，<br>行乐须及春。<br>我歌月徘徊，<br>我舞影零乱。<br>醒时同交欢[3]，<br>醉后各分散。<br>永结无情游，<br>相期邈云汉[4]。</p>\n<p class=\"prose\">公元744年，李白对“珠玉买歌笑，糟糠养贤才”的长安生活不满，感到寂寞，就去花间饮酒，写下了这首名作。开始两句写他孤独，“举杯”两句显得旷达，“月既”两句又写孤独，“暂伴”两句又似旷达。前八句是起伏相间，一抑一扬。接着四句不但旷达，而且俊逸。</p>\n<p class=\"prose\">最后两句把想象引向高远，真是“飘然思不群”了。但孤独是现实，旷达是幻想。诗写得越旷达，越显得诗人孤独。不过幻想是对现实的否定和批判，所以旷达显示了积极的精神力量，造就了诗的美感。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]无相亲：没有亲近的人。<br>[2]将：共，伴同。<br>[3]同交欢：一起欢乐。<br>[4]相期邈云汉：约定在天上相见；期：约会；邈：遥远；云汉：银河，这里指仙境。</p>", "englishHtml": "<p class=\"poem-lines\">(I)</p>\n<p class=\"prose\">Amid the flowers,from a pot of wine<br>I drink alone beneath the bright moonshine.<br>I raise my cup to invite the Moon who blends<br>Her light with my Shadow and we’re three friends.<br>The Moon does not know how to drink her share;<br>In vain my Shadow follows me here and there.<br>Together with them for the time I stay<br>And make merry before spring’s spent away.<br>I sing and the Moon lingers to hear my song;<br>My Shadow’s a mess while I dance along.<br>Sober,we three remain cheerful and gay;<br>Drunken,we part and each may go his way.<br>Our friendship will outshine all earthly love,<br>Next time we’ll meet beyond the stars above.</p>"}, {"num": "055", "zhTitle": "把酒问月", "enTitle": "Reflections on the Moon While Drinking", "chinese": "青天有月来几时？\n我今停杯一问之。\n人攀明月不可得，\n月行却与人相随。\n皎如飞镜临丹阙[1]，\n绿烟[2]灭尽清辉发。\n但见宵从海上来，\n宁知晓向云间没[3]？\n白兔捣药秋复春，\n嫦娥孤栖与谁邻？\n今人不见古时月，\n今月曾经照古人。\n古人今人若流水，\n共看明月皆如此。\n唯愿当歌对酒时，\n月光长照金樽[4]里。\n这是一首咏月抒怀诗。酒酣之际，诗人抬头看到亘古不变的月亮，对宇宙的冥冥发出了饱含哲理的疑问，这一对宇宙本源的求索与困惑，实际上是对自身的生命价值的思索和探寻。古往今来，人类从未停止有关月亮的遐想，多少人曾经梦想登上月亮，而月亮始终高不可攀地用万里清辉普照尘世，伴随着无尽的时光。诗人将月亮比作明镜，夜出沧海，昼隐西山，昼夜交替，历史便在这交替中演变，表达了诗人对前进不息的时光的留恋和珍惜。在对神物和仙女寂寞命运的同情中，流露出诗人自己孤苦高洁的情怀。“今人不见古时月，今月曾经照古人”是在讲“前不见古人”，而古月依旧，人生有限宇宙无穷，明月万古如一，而人类世代更替，同明月比起来，人类的有限生命真如沧海一粟。古人已流水一般逝去，今人的宿命也将如此，对着同一轮明月，古人今人关于人生和宇宙的意识得到统一。全诗意味深邃，诗人将明月与人生反复对照，在时间和空间的主观感受中，表达了对宇宙和人生哲理的深层思索。\n注释：\n[1]丹阙：朱红色的宫殿。\n[2]绿烟：遮蔽月光的浓重云雾。\n[3]没（mò）：隐没。\n[4]金樽：精美的酒具。", "english": "When did the moon first come on high?\nI stop drinking to ask the sky.\nThe moon’s beyond the reach of man;\nIt follows us where’er it can.\nLike mirror bright o’er palace wall,\nWhen clouds disperse,it’s seen by all.\nAt night,it rises out of the sea;\nAt dawn,who knows where it can be?\nJade Hare[1]is not companion boon\nFor lonely Goddess of the Moon.\nWe see the ancient moon no more,\nBut it has shone on men of yore.\nLike flowing stream,they passed away;\nThey saw the moon as we do today.\nI only wish when I drink wine,\nMoonlight dissolve in goblet mine.\n注释：\n[1]According to Chinese legend,the Jade Hare keeps company with the lonely Goddess of the Moon.", "poemType": "七言古诗", "chineseHtml": "<p class=\"poem-lines\">青天有月来几时？<br>我今停杯一问之。<br>人攀明月不可得，<br>月行却与人相随。<br>皎如飞镜临丹阙[1]，<br>绿烟[2]灭尽清辉发。<br>但见宵从海上来，<br>宁知晓向云间没[3]？<br>白兔捣药秋复春，<br>嫦娥孤栖与谁邻？<br>今人不见古时月，<br>今月曾经照古人。<br>古人今人若流水，<br>共看明月皆如此。<br>唯愿当歌对酒时，<br>月光长照金樽[4]里。</p>\n<p class=\"prose\">这是一首咏月抒怀诗。酒酣之际，诗人抬头看到亘古不变的月亮，对宇宙的冥冥发出了饱含哲理的疑问，这一对宇宙本源的求索与困惑，实际上是对自身的生命价值的思索和探寻。古往今来，人类从未停止有关月亮的遐想，多少人曾经梦想登上月亮，而月亮始终高不可攀地用万里清辉普照尘世，伴随着无尽的时光。</p>\n<p class=\"prose\">诗人将月亮比作明镜，夜出沧海，昼隐西山，昼夜交替，历史便在这交替中演变，表达了诗人对前进不息的时光的留恋和珍惜。在对神物和仙女寂寞命运的同情中，流露出诗人自己孤苦高洁的情怀。“今人不见古时月，今月曾经照古人”是在讲“前不见古人”，而古月依旧，人生有限宇宙无穷，明月万古如一，而人类世代更替，同明月比起来，人类的有限生命真如沧海一粟。</p>\n<p class=\"prose\">古人已流水一般逝去，今人的宿命也将如此，对着同一轮明月，古人今人关于人生和宇宙的意识得到统一。全诗意味深邃，诗人将明月与人生反复对照，在时间和空间的主观感受中，表达了对宇宙和人生哲理的深层思索。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]丹阙：朱红色的宫殿。<br>[2]绿烟：遮蔽月光的浓重云雾。<br>[3]没（mò）：隐没。<br>[4]金樽：精美的酒具。</p>", "englishHtml": "<p class=\"prose\">When did the moon first come on high?<br>I stop drinking to ask the sky.<br>The moon’s beyond the reach of man;<br>It follows us where’er it can.<br>Like mirror bright o’er palace wall,<br>When clouds disperse,it’s seen by all.<br>At night,it rises out of the sea;<br>At dawn,who knows where it can be?<br>Jade Hare[1]is not companion boon<br>For lonely Goddess of the Moon.<br>We see the ancient moon no more,<br>But it has shone on men of yore.<br>Like flowing stream,they passed away;<br>They saw the moon as we do today.<br>I only wish when I drink wine,<br>Moonlight dissolve in goblet mine.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]According to Chinese legend,the Jade Hare keeps company with the lonely Goddess of the Moon.</p>"}, {"num": "056", "zhTitle": "白云歌送刘十六归山", "enTitle": "Song of White Cloud—Farewell Song to Liu the Recluse", "chinese": "楚山[2]秦山[3]皆白云，\n白云处处长随君。\n长随君，\n君入楚山里，\n云亦随君渡湘水。\n湘水上，\n女萝衣[4]，\n白云堪[5]卧君早归。\n《白云歌送刘十六归山》是公元744年李白在长安为刘十六从终南山去楚山归隐而写的送别诗。诗写白云，也是写刘十六，因为白云是和隐士联系在一起的。白云自由不羁，高飞远走，清白无瑕，正是隐士品格的象征。刘十六归隐楚山湘水，湘水上的“女萝衣”就是屈原的“山鬼”准备送给隐士的。李白送别刘十六，其实是借他人酒杯浇自己胸中块垒，因为他对朝廷失望，也打算归山了。这首诗不少词语重叠，声韵流转，情怀摇漾，意境深远，是歌行中的上品。\n注释：\n[1]刘十六：李白友人。唐朝时，人们常用兄弟间排列次序来称呼人。\n[2]楚山：这里指今湖南地区，古时隶属于楚疆。\n[3]秦山：这里指唐都长安，古时隶属于秦地。\n[4]女萝衣：指的是屈原《九歌·山鬼》中的山中女神。\n[5]堪：能，可以。", "english": "From the mountains you come;to the mountains you go,\nWhite clouds will follow you high and low,high and low.\nWhen you come into Southern mountains high,\nFollowing you,o’er Southern streams white clouds will fly.\nO’er Southern water blue,\nThere’s ivy cloak for you,\nYou should go back and lie on cloud as white clouds do.", "poemType": "古体诗", "chineseHtml": "<p class=\"poem-lines\">楚山[2]秦山[3]皆白云，<br>白云处处长随君。<br>长随君，<br>君入楚山里，<br>云亦随君渡湘水。<br>湘水上，<br>女萝衣[4]，<br>白云堪[5]卧君早归。</p>\n<p class=\"prose\">《白云歌送刘十六归山》是公元744年李白在长安为刘十六从终南山去楚山归隐而写的送别诗。诗写白云，也是写刘十六，因为白云是和隐士联系在一起的。白云自由不羁，高飞远走，清白无瑕，正是隐士品格的象征。刘十六归隐楚山湘水，湘水上的“女萝衣”就是屈原的“山鬼”准备送给隐士的。</p>\n<p class=\"prose\">李白送别刘十六，其实是借他人酒杯浇自己胸中块垒，因为他对朝廷失望，也打算归山了。这首诗不少词语重叠，声韵流转，情怀摇漾，意境深远，是歌行中的上品。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]刘十六：李白友人。唐朝时，人们常用兄弟间排列次序来称呼人。<br>[2]楚山：这里指今湖南地区，古时隶属于楚疆。<br>[3]秦山：这里指唐都长安，古时隶属于秦地。<br>[4]女萝衣：指的是屈原《九歌·山鬼》中的山中女神。<br>[5]堪：能，可以。</p>", "englishHtml": "<p class=\"prose\">From the mountains you come;to the mountains you go,<br>White clouds will follow you high and low,high and low.<br>When you come into Southern mountains high,<br>Following you,o’er Southern streams white clouds will fly.<br>O’er Southern water blue,<br>There’s ivy cloak for you,<br>You should go back and lie on cloud as white clouds do.</p>"}, {"num": "057", "zhTitle": "秋日鲁郡尧祠亭上宴别杜补阙范侍御", "enTitle": "Farewell to Two Friends in Luon an Autumn Day", "chinese": "我觉秋兴[1]逸，\n谁云秋兴悲？\n山将落日去，\n水与晴空宜。\n鲁酒白玉壶，\n送行驻金羁[2]。\n歇鞍憩古木，\n解带挂横枝。\n歌鼓川上亭[3]，\n曲度神飙[4]吹。\n云归碧海夕，\n雁没青天时。\n相失各万里，\n茫然空尔思[5]。\n这是一首送别诗。诗一开头因秋起兴，一扫逢秋悲寂寥的传统，抒发豪情逸致，展现了诗人旷达自适的宽广胸怀。在这样的逸兴中，秋日的景色，上下一体，浑然天成。眼前的景色被诗人赋予意识，有了个性和活力，视觉效果和宴会欢歌笑语的听觉效果融合在一起，营造出强烈的情感氛围。宴席的尾声，友人们依依惜别，从此天各一方，留下的是无尽的惆怅。\n注释：\n[1]秋兴：因秋起兴。\n[2]驻金羁：犹停马；金羁，金镶的马络头，这里指马。\n[3]川上亭：水上的亭子，指尧祠亭。\n[4]神飙：疾风。\n[5]空尔思：徒然思念你们；尔，指李白好友杜补阙、范侍御二人。", "english": "I feel that autumn’s glad.\nWho says that autumn’s sad?\nHills bring down setting sun;\nWater and sky seem one.\nDrink wine from pot jade-white;\nFrom golden horse alight.\nRepose and set it free;\nHang belt upon old tree.\nChant by the stream aloud!\nSongs soar into the cloud.\nBack to blue sea clouds fly,\nWild geese lost in blue sky.\nLike them we’ll sever too,\nIn vain I’ll long for you.\n注释：\n[1]Present-day Shandong Province.", "poemType": "五言古诗", "chineseHtml": "<p class=\"poem-lines\">我觉秋兴[1]逸，<br>谁云秋兴悲？<br>山将落日去，<br>水与晴空宜。<br>鲁酒白玉壶，<br>送行驻金羁[2]。<br>歇鞍憩古木，<br>解带挂横枝。<br>歌鼓川上亭[3]，<br>曲度神飙[4]吹。<br>云归碧海夕，<br>雁没青天时。<br>相失各万里，<br>茫然空尔思[5]。</p>\n<p class=\"prose\">这是一首送别诗。诗一开头因秋起兴，一扫逢秋悲寂寥的传统，抒发豪情逸致，展现了诗人旷达自适的宽广胸怀。在这样的逸兴中，秋日的景色，上下一体，浑然天成。眼前的景色被诗人赋予意识，有了个性和活力，视觉效果和宴会欢歌笑语的听觉效果融合在一起，营造出强烈的情感氛围。</p>\n<p class=\"prose\">宴席的尾声，友人们依依惜别，从此天各一方，留下的是无尽的惆怅。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]秋兴：因秋起兴。<br>[2]驻金羁：犹停马；金羁，金镶的马络头，这里指马。<br>[3]川上亭：水上的亭子，指尧祠亭。<br>[4]神飙：疾风。<br>[5]空尔思：徒然思念你们；尔，指李白好友杜补阙、范侍御二人。</p>", "englishHtml": "<p class=\"prose\">I feel that autumn’s glad.<br>Who says that autumn’s sad?<br>Hills bring down setting sun;<br>Water and sky seem one.<br>Drink wine from pot jade-white;<br>From golden horse alight.<br>Repose and set it free;<br>Hang belt upon old tree.<br>Chant by the stream aloud!<br>Songs soar into the cloud.<br>Back to blue sea clouds fly,<br>Wild geese lost in blue sky.<br>Like them we’ll sever too,<br>In vain I’ll long for you.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Shandong Province.</p>"}, {"num": "058", "zhTitle": "鲁郡东石门送杜二甫", "enTitle": "Farewell to Du Fu at Stone Gate", "chinese": "醉别复几日，\n登临遍池台。\n何时石门路，\n重有金樽开？\n秋波落泗水[3]，\n海色明徂徕[4]。\n飞蓬[5]各自远，\n且尽手中杯。\n公元744年，李白与杜甫相识，两人一见如故。公元745年，李杜重逢，同游齐鲁。深秋，杜甫西去长安，李白再游江东，两人在鲁郡东石门分手，故有此篇。没有几天便要分别，不多的时间，用来痛饮，亭台楼阁都游览遍了，再也找不到留下的理由，不知何时能重聚，杜甫也说“何时一樽酒，重与细论文”，字里行间充满了两位大诗人惺惺相惜的不舍之情。徂徕泗水，秋色连波。在如诗如画的背景中，两位有着深厚情谊的友人似有千言万语，无尽的友谊化作一杯甘醇，结尾简洁干练，言有尽而意无穷。\n注释：\n[1]石门：山名，在今山东省曲阜市东北。\n[2]杜二甫：即诗人杜甫，因排行第二，故称他为杜二甫。\n[3]泗水：水名，今在山东省东部。\n[4]徂（cú）徕（lái）：山名，在今山东泰安市东南。\n[5]飞蓬：一种植物，茎高尺余，叶如柳，花如球，因常随风飞扬旋转，名为飞蓬。", "english": "Before we part we’ve drunk for many days\nAnd visit’d all the scenic spots and bays.\nWhen at the Gate of Stone shall we meet and drain\nOur brimming golden cups of wine again?\nThe autumn waves of River Si still flow;\nThe seaside mountains stand in morning glow.\nYou’ll go away as thistle-down will fly,\nSo let us fill our cups and drink them dry.\n注释：\n[1]In present-day Shandong Province.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">醉别复几日，<br>登临遍池台。<br>何时石门路，<br>重有金樽开？<br>秋波落泗水[3]，<br>海色明徂徕[4]。<br>飞蓬[5]各自远，<br>且尽手中杯。</p>\n<p class=\"prose\">公元744年，李白与杜甫相识，两人一见如故。公元745年，李杜重逢，同游齐鲁。深秋，杜甫西去长安，李白再游江东，两人在鲁郡东石门分手，故有此篇。没有几天便要分别，不多的时间，用来痛饮，亭台楼阁都游览遍了，再也找不到留下的理由，不知何时能重聚，杜甫也说“何时一樽酒，重与细论文”，字里行间充满了两位大诗人惺惺相惜的不舍之情。</p>\n<p class=\"prose\">徂徕泗水，秋色连波。在如诗如画的背景中，两位有着深厚情谊的友人似有千言万语，无尽的友谊化作一杯甘醇，结尾简洁干练，言有尽而意无穷。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]石门：山名，在今山东省曲阜市东北。<br>[2]杜二甫：即诗人杜甫，因排行第二，故称他为杜二甫。<br>[3]泗水：水名，今在山东省东部。<br>[4]徂（cú）徕（lái）：山名，在今山东泰安市东南。<br>[5]飞蓬：一种植物，茎高尺余，叶如柳，花如球，因常随风飞扬旋转，名为飞蓬。</p>", "englishHtml": "<p class=\"prose\">Before we part we’ve drunk for many days<br>And visit’d all the scenic spots and bays.<br>When at the Gate of Stone shall we meet and drain<br>Our brimming golden cups of wine again?<br>The autumn waves of River Si still flow;<br>The seaside mountains stand in morning glow.<br>You’ll go away as thistle-down will fly,<br>So let us fill our cups and drink them dry.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Shandong Province.</p>"}, {"num": "059", "zhTitle": "沙丘城下寄杜甫", "enTitle": "To Du Fu from Sand Hill Town", "chinese": "我来竟何事？\n高卧[2]沙丘城。\n城边有古树，\n日夕连[3]秋声。\n鲁酒不可醉，\n齐歌空复情。\n思君若汶水，\n浩荡寄南征。\n这首诗大概是李白在鲁郡东石门送别杜甫后不久所作。开篇直言与杜甫分别后诗人生活的百无聊赖，不过终日高卧。所见不过城边的古树，在秋风中日夜发出瑟瑟之声。诗人通过萧瑟的秋风，诉说自己的苦闷孤寂，从而寄托自己的相思之意。没有知音，对从不离手的酒也失去了兴味，歌舞也徒有其声色。这两句的抒情大大加重了前句的情感，并为引出下文做足了铺衬。结尾诗人寄情于流水，河水奔腾不息，相思之意不绝，更好地抒发了诗人纯真而深沉的感情。\n注释：\n[1]沙丘：指唐代兖州治城瑕丘。\n[2]高卧：高枕而卧，这里指闲居。\n[3]连：连续不断。", "english": "Why have I come here after all\nTo live alone the whole day long?\nThere’re but old trees by city wall,\nFrom dawn till dusk but Autumn’s song.\nI can’t be soothed by wine of Lu,\nNor moved by local melody.\nLike River Wen I think of you,\nWhose waves roll southward endlessly.\n注释：\n[1]In present-day Shandong Province.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">我来竟何事？<br>高卧[2]沙丘城。<br>城边有古树，<br>日夕连[3]秋声。<br>鲁酒不可醉，<br>齐歌空复情。<br>思君若汶水，<br>浩荡寄南征。</p>\n<p class=\"prose\">这首诗大概是李白在鲁郡东石门送别杜甫后不久所作。开篇直言与杜甫分别后诗人生活的百无聊赖，不过终日高卧。所见不过城边的古树，在秋风中日夜发出瑟瑟之声。诗人通过萧瑟的秋风，诉说自己的苦闷孤寂，从而寄托自己的相思之意。没有知音，对从不离手的酒也失去了兴味，歌舞也徒有其声色。</p>\n<p class=\"prose\">这两句的抒情大大加重了前句的情感，并为引出下文做足了铺衬。结尾诗人寄情于流水，河水奔腾不息，相思之意不绝，更好地抒发了诗人纯真而深沉的感情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]沙丘：指唐代兖州治城瑕丘。<br>[2]高卧：高枕而卧，这里指闲居。<br>[3]连：连续不断。</p>", "englishHtml": "<p class=\"prose\">Why have I come here after all<br>To live alone the whole day long?<br>There’re but old trees by city wall,<br>From dawn till dusk but Autumn’s song.<br>I can’t be soothed by wine of Lu,<br>Nor moved by local melody.<br>Like River Wen I think of you,<br>Whose waves roll southward endlessly.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Shandong Province.</p>"}, {"num": "060", "zhTitle": "戏赠杜甫", "enTitle": "Addressed Humorously to Du Fu", "chinese": "饭颗山[1]头逢杜甫，\n头戴笠子日卓午[2]。\n借问别来太瘦生[3]，\n总为[4]从前作诗苦[5]。\n李白赠杜甫的诗现存三首：一首是《鲁郡东石门送杜二甫》，名句如“秋波落泗水，海色明徂徕”，主要写二人的交游；一首是《沙丘城下寄杜甫》，名句如“思君若汶水，浩荡寄南征”，主要写二人的交情，但都没有写出杜甫的特征。这首《戏赠杜甫》虽只短短四句，但却语言生动，使人如见烈日之下头戴竹笠形容消瘦的诗人，因为锤炼字句而搜索枯肠的形象，写出了诗人苦吟的精神，和杜甫《饮中八仙歌》描写的李白，形成了鲜明的对比。\n注释：\n[1]饭颗山：山名。相传在长安一带。\n[2]日卓午：指正午太阳当顶。\n[3]太瘦生：消瘦、瘦弱。生为语助词，唐时习语。\n[4]总为：恐怕是因为。\n[5]作诗苦：这里指杜甫一丝不苟的创作精神。", "english": "On top of Hill of Boiled Rice I met Du Fu,\nWho in the noonday sun wore a hat of bamboo.\nPray,how could you have grown so thin since we did part?\nIs it because the verse-composing wrung your heart?", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">饭颗山[1]头逢杜甫，<br>头戴笠子日卓午[2]。<br>借问别来太瘦生[3]，<br>总为[4]从前作诗苦[5]。</p>\n<p class=\"prose\">李白赠杜甫的诗现存三首：一首是《鲁郡东石门送杜二甫》，名句如“秋波落泗水，海色明徂徕”，主要写二人的交游；一首是《沙丘城下寄杜甫》，名句如“思君若汶水，浩荡寄南征”，主要写二人的交情，但都没有写出杜甫的特征。</p>\n<p class=\"prose\">这首《戏赠杜甫》虽只短短四句，但却语言生动，使人如见烈日之下头戴竹笠形容消瘦的诗人，因为锤炼字句而搜索枯肠的形象，写出了诗人苦吟的精神，和杜甫《饮中八仙歌》描写的李白，形成了鲜明的对比。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]饭颗山：山名。相传在长安一带。<br>[2]日卓午：指正午太阳当顶。<br>[3]太瘦生：消瘦、瘦弱。生为语助词，唐时习语。<br>[4]总为：恐怕是因为。<br>[5]作诗苦：这里指杜甫一丝不苟的创作精神。</p>", "englishHtml": "<p class=\"prose\">On top of Hill of Boiled Rice I met Du Fu,<br>Who in the noonday sun wore a hat of bamboo.<br>Pray,how could you have grown so thin since we did part?<br>Is it because the verse-composing wrung your heart?</p>"}, {"num": "061", "zhTitle": "梦游天姥吟留别", "enTitle": "Mount SkylandAscended in a Dream—A Song of Farewell", "chinese": "海客谈瀛洲[2]，\n烟涛微茫信难求。\n越人[3]语天姥，\n云霞明灭或可睹。\n天姥连天向天横，\n势拔五岳掩赤城。\n天台一万八千丈，\n对此欲倒东南倾。\n我欲因之梦吴越，\n一夜飞渡镜湖月。\n湖月照我影，\n送我至剡溪[4]。\n谢公[5]宿处今尚在，\n渌[6]水荡漾清猿啼。\n脚着谢公屐[7]，\n身登青云梯[8]。\n半壁见海日，\n空中闻天鸡。\n千岩万转路不定，\n迷花倚石忽已暝。\n熊咆龙吟殷岩泉，\n栗深林兮惊层巅。\n云青青[9]兮欲雨，\n水澹澹[10]兮生烟。\n列缺[11]霹雳，\n丘峦崩摧。\n洞天石扉，\n訇然[12]中开。\n青冥浩荡不见底，\n日月照耀金银台[13]。\n霓为衣兮风为马，\n云之君兮纷纷而来下。\n虎鼓瑟兮鸾回车，\n仙之人兮列如麻。\n忽魂悸[14]以魄动，\n恍惊起而长嗟。\n唯觉时之枕席，\n失向来之烟霞。\n世间行乐亦如此，\n古来万事东流水。\n别君去兮何时还？\n且放白鹿青崖间，\n须行即骑访名山。\n安能摧眉折腰事权贵，\n使我不得开心颜！\n《梦游天姥吟留别》是李白最重要的作品之一，作于公元746年他离开长安之后。诗人回首蓬莱宫殿，犹如梦游，就托天姥以寄意了。他因越人之语而幻想天姥，其实是因友人之荐而神往朝廷。诗中用夸张的手法写天姥山，因为它是朝廷的象征，入梦就象征入朝，“身登青云”。至于“半壁见海日，空中闻天鸡”，就是召见金銮，侍诏翰林的景象了。他入朝以后发现朝中可惊可怖的现象，“熊咆龙吟”“丘峦崩摧”。天姥山中的神仙洞府可能象征皇宫内院，自空而降的神仙就是贵族出游，场面富丽堂皇，却又使人感到可怕，可见含有揭露之意。梦醒象征李白对朝廷幻想的破灭，所以才说：“世间行乐亦如此，古来万事东流水。”最后两句“安能摧眉折腰事权贵，使我不得开心颜！”说明这不是山水诗，不是游仙诗，不是留别诗，而是用比兴言志的手法，借梦游来抒发心中的愤懑，而诗人的形象和性格也在诗中显现出来了。\n注释：\n[1]天姥山：在浙江省绍兴市新昌县东面。传说登山的人能听到仙人天姥唱歌的声音，天姥山因此得名。\n[2]瀛洲：古代传说中的东海三座仙山之一（另两座叫蓬莱和方丈）。\n[3]越人：指浙江一带的人。\n[4]剡（shàn）溪：水名，在浙江省绍兴市嵊州市南面。\n[5]谢公：指南朝诗人谢灵运。\n[6]渌（lù）：清。\n[7]谢公屐（jī）：谢灵运穿的那种木屐。\n[8]青云梯：指直上云霄的山路。\n[9]青青：黑沉沉的。\n[10]澹澹：波浪起伏的样子。\n[11]列缺：指闪电。\n[12]訇（hōnɡ）然：形容声音很大。\n[12]金银台：金银铸成的宫阙，指神仙居住的地方。\n[14]魂悸：心跳。", "english": "Of fairy isles seafarers speak,\n’Mid dimming mist and surging waves,so hard to seek;\nOf Skyland Southerners are proud,\nPerceivable through fleeting or dispersing cloud.\nMount Skyland threatens heaven,massed against the sky,\nSurpassing the Five Peaks and dwarfing Mount Red Town.\nMount Heaven’s Terrace,five hundred thousand feet high,\nNearby to the southeast,appears to crumble down.\nLonging in dreams for Southern land,one night\nI flew o’er Mirror Lake in moonlight.\nMy shadow’s followed by moonbeams\nUntil I reach Shimmering Streams,\nWhere Hermitage of Master Xie[2]can still be seen,\nAnd clearly gibbons wail o’er rippling water green.\nI put Xie’s pegged boot\nEach on one foot,\nAnd scale the mountain ladder to blue cloud.\nOn eastern cliff I see\nSunrise at sea,\nAnd in mid-air I hear sky-cock crow loud.\nThe footpath meanders’mid a thousand crags in the vale,\nI’m lured by rocks and flowers when the day turns pale.\nBears roar and dragons howl and thunders the cascade,\nDeep forests quake and ridges tremble,they’re afraid!\nFrom dark,dark cloud comes rain;\nOn pale,pale waves mists plane.\nOh!Lightning flashes\nAnd thunder rumbles,\nWith stunning crashes\nPeak on peak crumbles.\nThe stone gate of a fairy cavern under\nSuddenly breaks asunder.\nSo blue,so deep,so vast appears an endless sky,\nWhere sun and moon shine on gold and silver terraces high.\nClad in the rainbow,riding on the wind,\nThe Lords of Clouds descend in a procession long.\nTheir chariots drawn by phoenix disciplined,\nAnd tigers playing for them a zither song,\nRow upon row,like fields of hemp,immortals throng.\nSuddenly my heart and soul stirred,I\nAwake with a long,long sigh.\nI find my head on pillow lie\nAnd fair visions gone by.\nLikewise all human joys will pass away\nJust as east-flowing water of olden day.\nI’ll take my leave of you,not knowing for how long.\nI’ll tend a white deer among\nThe grassy slopes of the green hill\nSo that I may ride it to famous mountains at will.\nHow can I stoop and bow before the men in power\nAnd so deny myself a happy hour?\n注释：\n[1]Or Sky-Mother Mountains in present-day Zhejiang Province.\n[2]Master Xie was a Jin-Dynasty poet who was fond of mountaineering and made himself spe cial pegged boots for climbing.", "poemType": "古体诗", "chineseHtml": "<p class=\"poem-lines\">海客谈瀛洲[2]，<br>烟涛微茫信难求。<br>越人[3]语天姥，<br>云霞明灭或可睹。<br>天姥连天向天横，<br>势拔五岳掩赤城。<br>天台一万八千丈，<br>对此欲倒东南倾。<br>我欲因之梦吴越，<br>一夜飞渡镜湖月。<br>湖月照我影，<br>送我至剡溪[4]。<br>谢公[5]宿处今尚在，<br>渌[6]水荡漾清猿啼。<br>脚着谢公屐[7]，<br>身登青云梯[8]。<br>半壁见海日，<br>空中闻天鸡。<br>千岩万转路不定，<br>迷花倚石忽已暝。<br>熊咆龙吟殷岩泉，<br>栗深林兮惊层巅。<br>云青青[9]兮欲雨，<br>水澹澹[10]兮生烟。<br>列缺[11]霹雳，<br>丘峦崩摧。<br>洞天石扉，<br>訇然[12]中开。<br>青冥浩荡不见底，<br>日月照耀金银台[13]。<br>霓为衣兮风为马，<br>云之君兮纷纷而来下。<br>虎鼓瑟兮鸾回车，<br>仙之人兮列如麻。<br>忽魂悸[14]以魄动，<br>恍惊起而长嗟。<br>唯觉时之枕席，<br>失向来之烟霞。<br>世间行乐亦如此，<br>古来万事东流水。<br>别君去兮何时还？<br>且放白鹿青崖间，<br>须行即骑访名山。<br>安能摧眉折腰事权贵，<br>使我不得开心颜！</p>\n<p class=\"prose\">《梦游天姥吟留别》是李白最重要的作品之一，作于公元746年他离开长安之后。诗人回首蓬莱宫殿，犹如梦游，就托天姥以寄意了。他因越人之语而幻想天姥，其实是因友人之荐而神往朝廷。诗中用夸张的手法写天姥山，因为它是朝廷的象征，入梦就象征入朝，“身登青云”。</p>\n<p class=\"prose\">至于“半壁见海日，空中闻天鸡”，就是召见金銮，侍诏翰林的景象了。他入朝以后发现朝中可惊可怖的现象，“熊咆龙吟”“丘峦崩摧”。天姥山中的神仙洞府可能象征皇宫内院，自空而降的神仙就是贵族出游，场面富丽堂皇，却又使人感到可怕，可见含有揭露之意。</p>\n<p class=\"prose\">梦醒象征李白对朝廷幻想的破灭，所以才说：“世间行乐亦如此，古来万事东流水。”最后两句“安能摧眉折腰事权贵，使我不得开心颜！”说明这不是山水诗，不是游仙诗，不是留别诗，而是用比兴言志的手法，借梦游来抒发心中的愤懑，而诗人的形象和性格也在诗中显现出来了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]天姥山：在浙江省绍兴市新昌县东面。传说登山的人能听到仙人天姥唱歌的声音，天姥山因此得名。<br>[2]瀛洲：古代传说中的东海三座仙山之一（另两座叫蓬莱和方丈）。<br>[3]越人：指浙江一带的人。<br>[4]剡（shàn）溪：水名，在浙江省绍兴市嵊州市南面。<br>[5]谢公：指南朝诗人谢灵运。<br>[6]渌（lù）：清。<br>[7]谢公屐（jī）：谢灵运穿的那种木屐。<br>[8]青云梯：指直上云霄的山路。<br>[9]青青：黑沉沉的。<br>[10]澹澹：波浪起伏的样子。<br>[11]列缺：指闪电。<br>[12]訇（hōnɡ）然：形容声音很大。<br>[12]金银台：金银铸成的宫阙，指神仙居住的地方。<br>[14]魂悸：心跳。</p>", "englishHtml": "<p class=\"prose\">Of fairy isles seafarers speak,<br>’Mid dimming mist and surging waves,so hard to seek;<br>Of Skyland Southerners are proud,<br>Perceivable through fleeting or dispersing cloud.<br>Mount Skyland threatens heaven,massed against the sky,<br>Surpassing the Five Peaks and dwarfing Mount Red Town.<br>Mount Heaven’s Terrace,five hundred thousand feet high,<br>Nearby to the southeast,appears to crumble down.<br>Longing in dreams for Southern land,one night<br>I flew o’er Mirror Lake in moonlight.<br>My shadow’s followed by moonbeams<br>Until I reach Shimmering Streams,<br>Where Hermitage of Master Xie[2]can still be seen,<br>And clearly gibbons wail o’er rippling water green.<br>I put Xie’s pegged boot<br>Each on one foot,<br>And scale the mountain ladder to blue cloud.<br>On eastern cliff I see<br>Sunrise at sea,<br>And in mid-air I hear sky-cock crow loud.<br>The footpath meanders’mid a thousand crags in the vale,<br>I’m lured by rocks and flowers when the day turns pale.<br>Bears roar and dragons howl and thunders the cascade,<br>Deep forests quake and ridges tremble,they’re afraid!<br>From dark,dark cloud comes rain;<br>On pale,pale waves mists plane.<br>Oh!Lightning flashes<br>And thunder rumbles,<br>With stunning crashes<br>Peak on peak crumbles.<br>The stone gate of a fairy cavern under<br>Suddenly breaks asunder.<br>So blue,so deep,so vast appears an endless sky,<br>Where sun and moon shine on gold and silver terraces high.<br>Clad in the rainbow,riding on the wind,<br>The Lords of Clouds descend in a procession long.<br>Their chariots drawn by phoenix disciplined,<br>And tigers playing for them a zither song,<br>Row upon row,like fields of hemp,immortals throng.<br>Suddenly my heart and soul stirred,I<br>Awake with a long,long sigh.<br>I find my head on pillow lie<br>And fair visions gone by.<br>Likewise all human joys will pass away<br>Just as east-flowing water of olden day.<br>I’ll take my leave of you,not knowing for how long.<br>I’ll tend a white deer among<br>The grassy slopes of the green hill<br>So that I may ride it to famous mountains at will.<br>How can I stoop and bow before the men in power<br>And so deny myself a happy hour?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Or Sky-Mother Mountains in present-day Zhejiang Province.<br>[2]Master Xie was a Jin-Dynasty poet who was fond of mountaineering and made himself spe cial pegged boots for climbing.</p>"}, {"num": "062", "zhTitle": "登金陵凤凰台", "enTitle": "On Phoenix Terrace at Jinling", "chinese": "凤凰台上凤凰游，\n凤去台空江自流。\n吴宫[2]花草埋幽径，\n晋代衣冠[3]成古丘。\n三山[4]半落青天外，\n二水[5]中分白鹭洲。\n总为浮云能蔽日[6]，\n长安[7]不见使人愁。\n《登金陵凤凰台》是李白不多的七律中传诵最广的一首。凤凰形如孔雀，凤的出现表示祥瑞。现在凤去台空，引起了诗人怅然若失的感觉。第三、四句怀古：东吴和东晋都建都金陵，吴国的繁华宫苑只剩下了废墟小径，晋代的风流人物也进入了坟墓，令人顿生兴衰之感。第五、六句写景：三山半隐半现，若有若无，白鹭洲却把滔滔长江一分为二。这两句气势壮丽，对仗工整，是难得的佳句。最后两句抒怀：浮云蔽日暗示奸佞当道，皇帝受到蒙蔽，使自己报国无门。这样把典故、景物、感受交织在一起，抒发了诗人忧国忧时的怀抱，意旨深远。\n注释：\n[1]凤凰台：在金陵凤凰山上。\n[2]吴宫：指三国时孙吴于金陵建都筑宫。\n[3]衣冠：原指衣服和礼帽，这里借指世族士绅、达官贵人、社会名流。\n[4]三山：山名，在金陵西南长江边上，三峰并列，南北相连。\n[5]二水：指秦淮河流经南京后，西入长江，被横截其间的白鹭洲分为二支。\n[6]浮云蔽日：比喻谗臣当道，障蔽贤良。\n[7]长安：这里指代朝廷和皇帝。", "english": "On Phoenix Terrace once phoenixes came to sing,\nThe birds are gone but still roll on the river’s waves.\nThe ruined palace’s buried’neath the weeds in spring;\nThe ancient sages in caps and gowns all lie in graves.\nThe three-peak’d mountain is half lost in azure sky;\nThe two-fork’d stream by Egret Isle is kept apart.\nAs floating clouds can veil the bright sun from the eye,\nImperial Court now out of sight saddens my heart.\n注释：\n[1]Present-day Nanjing,capital of Jiangsu Province.", "poemType": "七言律诗", "chineseHtml": "<p class=\"poem-lines\">凤凰台上凤凰游，<br>凤去台空江自流。<br>吴宫[2]花草埋幽径，<br>晋代衣冠[3]成古丘。<br>三山[4]半落青天外，<br>二水[5]中分白鹭洲。<br>总为浮云能蔽日[6]，<br>长安[7]不见使人愁。</p>\n<p class=\"prose\">《登金陵凤凰台》是李白不多的七律中传诵最广的一首。凤凰形如孔雀，凤的出现表示祥瑞。现在凤去台空，引起了诗人怅然若失的感觉。第三、四句怀古：东吴和东晋都建都金陵，吴国的繁华宫苑只剩下了废墟小径，晋代的风流人物也进入了坟墓，令人顿生兴衰之感。</p>\n<p class=\"prose\">第五、六句写景：三山半隐半现，若有若无，白鹭洲却把滔滔长江一分为二。这两句气势壮丽，对仗工整，是难得的佳句。最后两句抒怀：浮云蔽日暗示奸佞当道，皇帝受到蒙蔽，使自己报国无门。这样把典故、景物、感受交织在一起，抒发了诗人忧国忧时的怀抱，意旨深远。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]凤凰台：在金陵凤凰山上。<br>[2]吴宫：指三国时孙吴于金陵建都筑宫。<br>[3]衣冠：原指衣服和礼帽，这里借指世族士绅、达官贵人、社会名流。<br>[4]三山：山名，在金陵西南长江边上，三峰并列，南北相连。<br>[5]二水：指秦淮河流经南京后，西入长江，被横截其间的白鹭洲分为二支。<br>[6]浮云蔽日：比喻谗臣当道，障蔽贤良。<br>[7]长安：这里指代朝廷和皇帝。</p>", "englishHtml": "<p class=\"prose\">On Phoenix Terrace once phoenixes came to sing,<br>The birds are gone but still roll on the river’s waves.<br>The ruined palace’s buried’neath the weeds in spring;<br>The ancient sages in caps and gowns all lie in graves.<br>The three-peak’d mountain is half lost in azure sky;<br>The two-fork’d stream by Egret Isle is kept apart.<br>As floating clouds can veil the bright sun from the eye,<br>Imperial Court now out of sight saddens my heart.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Nanjing,capital of Jiangsu Province.</p>"}, {"num": "063", "zhTitle": "劳劳亭", "enTitle": "Pavilion Laolao", "chinese": "天下伤心处，\n劳劳送客亭。\n春风知[2]别苦，\n不遣[3]柳条青。\n劳劳亭在南京，是古代送别的地方。李白不说天下伤心事是离别，只说天下伤心处是离亭，这样直中有曲，使读者会因地及事、由亭及人。因为送别时是早春，杨柳还没发青，不能折柳送别，于是诗人忽发奇想，说是春风深知离别之苦，不忍看到人折柳送别，所以故意不让杨柳发青了。这样把无情的杨柳说成有知有情，有伤别之心，这是化物为我，使春风成了诗人感情的化身，无怪乎古人说这两句诗“奇警无伦”了。\n注释：\n[1]劳劳亭：在今江苏省南京市西南，为古时送别之所。\n[2]知：理解。\n[3]遣：让。", "english": "There is no place that oftener breaks the heart\nThan the Pavilion seeing people part.\nThe wind of early spring knows parting grieves,\nIt will not green the roadside willow leaves.[2]\n注释：\n[1]In present-day Nanjing.\n[2]The Chinese had the custom of breaking off a green willow branch by the roadside and presenting it to the departing friend.The last line implies that the wind of early spring is unwilling to let friends sever.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">天下伤心处，<br>劳劳送客亭。<br>春风知[2]别苦，<br>不遣[3]柳条青。</p>\n<p class=\"prose\">劳劳亭在南京，是古代送别的地方。李白不说天下伤心事是离别，只说天下伤心处是离亭，这样直中有曲，使读者会因地及事、由亭及人。因为送别时是早春，杨柳还没发青，不能折柳送别，于是诗人忽发奇想，说是春风深知离别之苦，不忍看到人折柳送别，所以故意不让杨柳发青了。</p>\n<p class=\"prose\">这样把无情的杨柳说成有知有情，有伤别之心，这是化物为我，使春风成了诗人感情的化身，无怪乎古人说这两句诗“奇警无伦”了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]劳劳亭：在今江苏省南京市西南，为古时送别之所。<br>[2]知：理解。<br>[3]遣：让。</p>", "englishHtml": "<p class=
