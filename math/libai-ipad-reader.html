<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>许渊冲译李白诗选｜iPad 横屏对照阅读</title>
  <style>
    :root {
      --ink: #28231b;
      --muted: #756d60;
      --paper: #f8f1e4;
      --paper-deep: #eee0c7;
      --panel: rgba(255, 250, 239, .88);
      --line: rgba(80, 61, 33, .18);
      --accent: #9b3f24;
      --accent-2: #2f5d50;
      --shadow: 0 22px 70px rgba(56, 38, 16, .16);
      --body-size: 19px;
      --body-leading: 1.86;
      --poem-size: 23px;
      --en-size: calc(var(--body-size) + 4px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(155, 63, 36, .10), transparent 31%),
        radial-gradient(circle at 84% 18%, rgba(47, 93, 80, .11), transparent 28%),
        linear-gradient(135deg, #fbf5e8 0%, #f2e3c9 46%, #ead8b8 100%);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Times New Roman", serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .38;
      background-image:
        linear-gradient(rgba(72, 50, 22, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 50, 22, .035) 1px, transparent 1px);
      background-size: 28px 28px, 28px 28px;
      mix-blend-mode: multiply;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(220px, 24vw) 1fr;
      gap: 14px;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    .sidebar, .reader {
      position: relative;
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      border-radius: 14px 6px 6px 14px;
      overflow: hidden;
    }

    .brand {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0));
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-weight: 700;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: clamp(26px, 3.1vw, 42px);
      font-weight: 650;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .tool, .nav-button {
      appearance: none;
      border: 1px solid rgba(80, 61, 33, .22);
      background: rgba(255, 255, 255, .42);
      color: var(--ink);
      border-radius: 8px;
      min-height: 38px;
      font: 650 13px/1 "Avenir Next", "Helvetica Neue", sans-serif;
      cursor: pointer;
    }

    .tool:active, .nav-button:active, .poem-link:active {
      transform: translateY(1px);
    }

    .search-wrap {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: 100%;
      height: 40px;
      border: 1px solid rgba(80, 61, 33, .22);
      border-radius: 8px;
      padding: 0 12px;
      background: rgba(255, 255, 255, .58);
      color: var(--ink);
      font-size: 15px;
      outline: none;
    }

    .list {
      overflow: auto;
      padding: 8px;
    }

    .poem-link {
      width: 100%;
      border: 0;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 8px;
      align-items: start;
      padding: 10px 9px;
      margin: 2px 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .poem-link.active {
      background: #f0ddbb;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .num {
      color: var(--accent);
      font: 700 12px/1.5 "Avenir Next", sans-serif;
    }

    .link-title {
      display: block;
      font-size: 15px;
      line-height: 1.25;
      white-space: normal;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .type-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 7px;
      border: 1px solid rgba(155, 63, 36, .22);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(155, 63, 36, .07);
      font: 650 11px/1 "Avenir Next", "Helvetica Neue", sans-serif;
      white-space: nowrap;
    }

    .link-en {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font: 12px/1.25 "Georgia", serif;
    }

    .sidebar-footer {
      padding: 10px 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font: 12px/1.4 "Avenir Next", sans-serif;
    }

    .reader {
      border-radius: 6px 14px 14px 6px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .reader-header {
      min-height: 84px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(155,63,36,.09), transparent 38%),
        rgba(255,255,255,.22);
    }

    .current-title {
      margin: 0;
      font-size: clamp(25px, 3vw, 40px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .current-en {
      margin: 5px 0 0;
      color: var(--muted);
      font: italic 18px/1.25 Georgia, serif;
    }

    .current-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .nav {
      display: flex;
      gap: 8px;
    }

    .nav-button {
      min-width: 44px;
      font-size: 18px;
    }

    .columns {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .92fr);
      gap: 0;
      overflow: hidden;
    }

    .column {
      min-width: 0;
      overflow: auto;
      padding: 28px clamp(22px, 3vw, 44px) 60px;
      scroll-behavior: smooth;
    }

    .column.left {
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 239, .38);
    }

    .column.right {
      background: rgba(255, 255, 255, .28);
    }

    .column-label {
      position: sticky;
      top: -28px;
      z-index: 1;
      margin: -28px 0 22px;
      padding: 16px 0 12px;
      color: var(--accent);
      background: linear-gradient(180deg, rgba(255,250,239,.97), rgba(255,250,239,.78));
      font: 750 12px/1 "Avenir Next", sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .right .column-label {
      color: var(--accent-2);
      background: linear-gradient(180deg, rgba(250,249,243,.97), rgba(250,249,243,.76));
    }

    .poem-lines {
      margin: 0 0 24px;
      font-size: var(--poem-size);
      line-height: 1.78;
      letter-spacing: 0;
    }

    .prose {
      margin: 0 0 18px;
      font-size: var(--body-size);
      line-height: var(--body-leading);
      text-align: justify;
    }

    .right .prose, .right .poem-lines {
      font-family: Georgia, "Times New Roman", serif;
      font-size: var(--en-size);
      line-height: 1.9;
      text-align: left;
    }

    .note-title {
      margin: 26px 0 12px;
      font-size: 15px;
      color: var(--accent);
      font-family: "Avenir Next", sans-serif;
      letter-spacing: .12em;
    }

    .progress {
      height: 5px;
      background: rgba(80, 61, 33, .10);
    }

    .progress-bar {
      height: 100%;
      width: 1%;
      background: linear-gradient(90deg, var(--accent), #c99045);
      transition: width .28s ease;
    }

    .compact-toggle {
      display: none;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100dvh;
        grid-template-columns: 1fr;
      }
      .sidebar {
        max-height: 42dvh;
        border-radius: 14px;
      }
      .reader {
        min-height: 72dvh;
        border-radius: 14px;
      }
      .columns {
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .column {
        overflow: visible;
      }
      .column.left {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <section class="brand">
        <div class="eyebrow">Xu Yuanchong Reader</div>
        <h1>李白诗选</h1>
        <p class="subtitle">iPad 横屏中英对照阅读 · 100 首/组</p>
      </section>
      <section class="tools" aria-label="阅读设置">
        <button class="tool" id="smaller" title="缩小字号">A−</button>
        <button class="tool" id="larger" title="放大字号">A＋</button>
      </section>
      <section class="search-wrap">
        <input class="search" id="search" type="search" placeholder="搜索诗题 / 英文题名" />
      </section>
      <nav class="list" id="list" aria-label="诗歌目录"></nav>
      <footer class="sidebar-footer">
        左右栏可独立滚动，适合 iPad Pro 横屏阅读。
      </footer>
    </aside>

    <section class="reader">
      <header class="reader-header">
        <div>
          <h2 class="current-title" id="title"></h2>
          <p class="current-en" id="enTitle"></p>
          <div class="current-meta"><span class="type-pill" id="poemType"></span></div>
        </div>
        <div class="nav">
          <button class="nav-button" id="prev" title="上一首">‹</button>
          <button class="nav-button" id="next" title="下一首">›</button>
        </div>
      </header>
      <section class="columns">
        <article class="column left" id="leftPane">
          <div class="column-label">Chinese · 原文与赏析</div>
          <div id="chinese"></div>
        </article>
        <article class="column right" id="rightPane">
          <div class="column-label">English · Xu Yuanchong</div>
          <div id="english"></div>
        </article>
      </section>
      <div class="progress"><div class="progress-bar" id="progress"></div></div>
    </section>
  </main>

  <script>
    const poems = [{"num": "001", "zhTitle": "访戴天山道士不遇", "enTitle": "Calling on a Taoist Recluse in Daitian Mountainwithout Meeting Him", "chinese": "犬吠[2]水声中，\n桃花带露浓[3]。\n树深时[4]见鹿，\n溪午不闻钟。\n野竹分青霭[5]，\n飞泉挂碧峰。\n无人知所去，\n愁倚[6]两三松。\n戴天山位于今四川省江油市西北，是李白青少年时期生活的地方，李白作此诗时大概还不满20岁。本诗题目虽为访人不遇，然前三联均写途中所见自然景色，最后一联才点明主旨，但细细品来，前面却又埋有“不遇”的伏笔，如“时见鹿”反衬不见人，“不闻钟”暗示道观无人。王夫之评此诗说：“全不添入情事，只拈死‘不遇’二字作，愈死愈活。”（《唐诗评选》）而清代吴大受则说：“无一字说道士，无一字说不遇，却句句是不遇，句句是访道士不遇。”（《诗筏》）\n注释：\n[1]戴天山：位于今四川省江油市西北，青年李白曾在该山中的大明寺读书。\n[2]吠：狗叫。\n[3]带露浓：挂满了露珠。\n[4]时：有时、偶尔。\n[5]青霭：紫色的云气。\n[6]倚：靠着。", "english": "Dogs’barks are muffled by the rippling brook,\nPeach blossoms tinged by dew much redder look.\nIn the thick woods a deer is seen at times;\nAlong the stream I hear no noonday chimes.\nIn the blue haze which wild bamboos divide,\nTumbling cascades hang on green mountainside.\nWhere has the Taoist gone?No one can tell me.\nSaddened,I lean on this or that pine tree.\n注释：\n[1]In present-day Sichuan Province.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">犬吠[2]水声中，<br>桃花带露浓[3]。<br>树深时[4]见鹿，<br>溪午不闻钟。<br>野竹分青霭[5]，<br>飞泉挂碧峰。<br>无人知所去，<br>愁倚[6]两三松。</p>\n<p class=\"prose\">戴天山位于今四川省江油市西北，是李白青少年时期生活的地方，李白作此诗时大概还不满20岁。本诗题目虽为访人不遇，然前三联均写途中所见自然景色，最后一联才点明主旨，但细细品来，前面却又埋有“不遇”的伏笔，如“时见鹿”反衬不见人，“不闻钟”暗示道观无人。</p>\n<p class=\"prose\">王夫之评此诗说：“全不添入情事，只拈死‘不遇’二字作，愈死愈活。”（《唐诗评选》）而清代吴大受则说：“无一字说道士，无一字说不遇，却句句是不遇，句句是访道士不遇。”（《诗筏》）</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]戴天山：位于今四川省江油市西北，青年李白曾在该山中的大明寺读书。<br>[2]吠：狗叫。<br>[3]带露浓：挂满了露珠。<br>[4]时：有时、偶尔。<br>[5]青霭：紫色的云气。<br>[6]倚：靠着。</p>", "englishHtml": "<p class=\"prose\">Dogs’barks are muffled by the rippling brook,<br>Peach blossoms tinged by dew much redder look.<br>In the thick woods a deer is seen at times;<br>Along the stream I hear no noonday chimes.<br>In the blue haze which wild bamboos divide,<br>Tumbling cascades hang on green mountainside.<br>Where has the Taoist gone?No one can tell me.<br>Saddened,I lean on this or that pine tree.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Sichuan Province.</p>"}, {"num": "002", "zhTitle": "登锦城散花楼", "enTitle": "On the Flowery Tower in the Town of Silk", "chinese": "日照锦城[1]头，\n朝光散花楼。\n金窗[2]夹绣户[3]，\n珠箔[4]悬银钩。\n飞梯[5]绿云中，\n极目[6]散我忧。\n暮雨向三峡[7]，\n春江绕双流[8]。\n今来一登望，\n如上九天游。\n这首诗是李白早年初游成都时所作。锦城为成都别称，散花楼为隋末蜀王杨秀所建。作者没有着重于客观事物的描写，而是通过感官的主观感受，显现出散花楼的高雅别致，宏伟壮观。“飞梯绿云中，极目散我忧”，这两句看似不合格律，如果去掉这两句，此诗就相当于一首五言律诗了。然而这两句在诗中却起到了很微妙的作用，可以说是“诗眼”。以此为承接点，前半部的意象构成一幅十分鲜明的画面，后半部写出了诗人的快意之感，这两句显示了作者极端夸张笔法的感染力。末句“如上九天游”则是抒发登楼的愉悦之情。全诗以时间为主轴展开描述，从朝光到暮雨，并且向四周扩散，南到双流城，东至三峡，形象鲜明，意境飘逸，情景真切，开合自然。\n注释：\n[1]锦城：一般指今四川省成都市。此处驻扎三国蜀汉时管理织锦之官，因此得名。后人也别称成都“锦城”，又称锦里。\n[2]金窗：华美的窗。\n[3]绣户：雕饰华美的门户。\n[4]珠箔（bó）：即珠帘。由珍珠串成或以珍珠作装饰的帘子。\n[5]飞梯：指往高处攀登的一步步台阶。\n[6]极目：尽力往目之所及之处远远眺望。\n[7]三峡：指长江三峡。说法众多，今以瞿塘峡、巫峡、西陵峡为三峡。\n[8]双流：县名，隶属成都府。其位置位于县在二江（郸江、流江）之间，因而名为双流，即今四川省成都市双流区。", "english": "The sun shines on the Town of Silk,the Tower\nIs steeped in morning glow as strewn with flowers.\nBy golden windows and embroidered doors,\nThe pearly curtains hang on silver hooks.\nInto green clouds a flight of stairways soars;\nThe gloom’s dispelled at such sunny outlooks.\nThe evening rain towards Three Canyons flies;\nAround the town wind rivers crystal-clear.\nToday I come to feast on this my eyes\nAs if I visited Celestial Sphere.\n注释：\n[1]Present-day Chengdu,capital of Sichuan Province.", "poemType": "五言古诗", "chineseHtml": "<p class=\"poem-lines\">日照锦城[1]头，<br>朝光散花楼。<br>金窗[2]夹绣户[3]，<br>珠箔[4]悬银钩。<br>飞梯[5]绿云中，<br>极目[6]散我忧。<br>暮雨向三峡[7]，<br>春江绕双流[8]。<br>今来一登望，<br>如上九天游。</p>\n<p class=\"prose\">这首诗是李白早年初游成都时所作。锦城为成都别称，散花楼为隋末蜀王杨秀所建。作者没有着重于客观事物的描写，而是通过感官的主观感受，显现出散花楼的高雅别致，宏伟壮观。“飞梯绿云中，极目散我忧”，这两句看似不合格律，如果去掉这两句，此诗就相当于一首五言律诗了。</p>\n<p class=\"prose\">然而这两句在诗中却起到了很微妙的作用，可以说是“诗眼”。以此为承接点，前半部的意象构成一幅十分鲜明的画面，后半部写出了诗人的快意之感，这两句显示了作者极端夸张笔法的感染力。末句“如上九天游”则是抒发登楼的愉悦之情。全诗以时间为主轴展开描述，从朝光到暮雨，并且向四周扩散，南到双流城，东至三峡，形象鲜明，意境飘逸，情景真切，开合自然。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]锦城：一般指今四川省成都市。此处驻扎三国蜀汉时管理织锦之官，因此得名。后人也别称成都“锦城”，又称锦里。<br>[2]金窗：华美的窗。<br>[3]绣户：雕饰华美的门户。<br>[4]珠箔（bó）：即珠帘。由珍珠串成或以珍珠作装饰的帘子。<br>[5]飞梯：指往高处攀登的一步步台阶。<br>[6]极目：尽力往目之所及之处远远眺望。<br>[7]三峡：指长江三峡。说法众多，今以瞿塘峡、巫峡、西陵峡为三峡。<br>[8]双流：县名，隶属成都府。其位置位于县在二江（郸江、流江）之间，因而名为双流，即今四川省成都市双流区。</p>", "englishHtml": "<p class=\"prose\">The sun shines on the Town of Silk,the Tower<br>Is steeped in morning glow as strewn with flowers.<br>By golden windows and embroidered doors,<br>The pearly curtains hang on silver hooks.<br>Into green clouds a flight of stairways soars;<br>The gloom’s dispelled at such sunny outlooks.<br>The evening rain towards Three Canyons flies;<br>Around the town wind rivers crystal-clear.<br>Today I come to feast on this my eyes<br>As if I visited Celestial Sphere.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Chengdu,capital of Sichuan Province.</p>"}, {"num": "003", "zhTitle": "峨眉山月歌", "enTitle": "The Moon over the Eyebrow Mountains", "chinese": "峨眉山[1]月半轮秋[2]，\n影[3]入平羌[4]江水流。\n夜发[5]清溪[6]向三峡，\n思君不见下[7]渝州[8]。\n这首诗是公元724年李白第一次离开故乡时写的七言绝句。第一句中峨眉山月象征金黄的秋天，一弯新月有如金秋的眉毛。第二句写月影随江水东流，是顺流而下才看得到的景色。第三句写人写地，用地名来叙事。第四句抒情，句中的“君”指山月，因为山高蔽月，所以就见山不见月了。诗中把月拟人化，形象很美；离情不断如水，意境深远。这首诗的特点是用了五个地名：峨眉、平羌、清溪、三峡、渝州，“四句入地名者五，古今目为绝唱，殊不厌重”（王麟洲语）。如果把前两句的地名删掉，改成“山月半轮秋，影入江水流”，没有地方色彩，不能融景入情，反而会显得一般化。而李白的长处正是把地名化在叙事、写景、抒情之中，化腐朽为神奇。\n注释：\n[1]峨眉山：位于今四川省乐山市。\n[2]半轮秋：半圆的秋月，即上弦月或下弦月。\n[3]影：月光的影子。\n[4]平羌：一指青衣江，处于峨眉山东北。其源头出于四川芦山，流经乐山汇入岷江。\n[5]发：出发。\n[6]清溪：指清溪驿，在峨眉山附近。\n[7]下：顺流而下。\n[8]渝州：治所在巴县，今重庆一带。", "english": "The crescent moon looks like old Autumn’s golden brow,\nIts deep reflection flows with limpid water blue.\nI’ll leave the town on Clear Stream for Three Canyons now.\nO Moon,how I miss you when you are out of view![2]\n注释：\n[1]In present-day Sichuan Province.\n[2]The moon was screened from view by the riverside cliffs.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">峨眉山[1]月半轮秋[2]，<br>影[3]入平羌[4]江水流。<br>夜发[5]清溪[6]向三峡，<br>思君不见下[7]渝州[8]。</p>\n<p class=\"prose\">这首诗是公元724年李白第一次离开故乡时写的七言绝句。第一句中峨眉山月象征金黄的秋天，一弯新月有如金秋的眉毛。第二句写月影随江水东流，是顺流而下才看得到的景色。第三句写人写地，用地名来叙事。第四句抒情，句中的“君”指山月，因为山高蔽月，所以就见山不见月了。</p>\n<p class=\"prose\">诗中把月拟人化，形象很美；离情不断如水，意境深远。这首诗的特点是用了五个地名：峨眉、平羌、清溪、三峡、渝州，“四句入地名者五，古今目为绝唱，殊不厌重”（王麟洲语）。如果把前两句的地名删掉，改成“山月半轮秋，影入江水流”，没有地方色彩，不能融景入情，反而会显得一般化。</p>\n<p class=\"prose\">而李白的长处正是把地名化在叙事、写景、抒情之中，化腐朽为神奇。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]峨眉山：位于今四川省乐山市。<br>[2]半轮秋：半圆的秋月，即上弦月或下弦月。<br>[3]影：月光的影子。<br>[4]平羌：一指青衣江，处于峨眉山东北。其源头出于四川芦山，流经乐山汇入岷江。<br>[5]发：出发。<br>[6]清溪：指清溪驿，在峨眉山附近。<br>[7]下：顺流而下。<br>[8]渝州：治所在巴县，今重庆一带。</p>", "englishHtml": "<p class=\"prose\">The crescent moon looks like old Autumn’s golden brow,<br>Its deep reflection flows with limpid water blue.<br>I’ll leave the town on Clear Stream for Three Canyons now.<br>O Moon,how I miss you when you are out of view![2]</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Sichuan Province.<br>[2]The moon was screened from view by the riverside cliffs.</p>"}, {"num": "004", "zhTitle": "巴女词", "enTitle": "Song of a Woman of Ba", "chinese": "巴水[2]急如箭，\n巴船去若飞。\n十月三千里，\n郎行几岁归？\n此诗是李白第一次出川在嘉陵江流域游历时模仿当地民歌所作，故颇有民谣风格。诗从巴水写起，转而抒发思念之苦，眼见巴水急如箭，眼见巴船去如飞，而所念之人仍在天涯。出行已是过了十月，叹逝者如斯之快；行程则三千里了，叹沧海碣石之远。一快一远，无解的一问，留给读者的是无尽的思念和遐想。\n注释：\n[1]巴：今四川巴江一带，旧时为巴国。巴女，巴地的女子。\n[2]巴水：水名，在湖北省境内。巴水：指三峡中的长江水，因处在三巴之地，因而得名。王墒注：“唐之渝州、涪州、忠州、万州等处，皆古时巴郡。其水流经三峡下至夷陵。当盛涨时，箭飞之速，不足过矣。”", "english": "The River fast like arrow flows;\nYour boat as if on wings swift goes.\nTen months,a thousand miles away.\nWhen will you come back?On whatday?\n注释：\n[1]Present-day Sichuan Province.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">巴水[2]急如箭，<br>巴船去若飞。<br>十月三千里，<br>郎行几岁归？</p>\n<p class=\"prose\">此诗是李白第一次出川在嘉陵江流域游历时模仿当地民歌所作，故颇有民谣风格。诗从巴水写起，转而抒发思念之苦，眼见巴水急如箭，眼见巴船去如飞，而所念之人仍在天涯。出行已是过了十月，叹逝者如斯之快；行程则三千里了，叹沧海碣石之远。一快一远，无解的一问，留给读者的是无尽的思念和遐想。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]巴：今四川巴江一带，旧时为巴国。巴女，巴地的女子。<br>[2]巴水：水名，在湖北省境内。巴水：指三峡中的长江水，因处在三巴之地，因而得名。王墒注：“唐之渝州、涪州、忠州、万州等处，皆古时巴郡。其水流经三峡下至夷陵。当盛涨时，箭飞之速，不足过矣。”</p>", "englishHtml": "<p class=\"prose\">The River fast like arrow flows;<br>Your boat as if on wings swift goes.<br>Ten months,a thousand miles away.<br>When will you come back?On whatday?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Sichuan Province.</p>"}, {"num": "005", "zhTitle": "荆州歌", "enTitle": "The Silk Spinner", "chinese": "白帝城边足[2]风波，\n瞿塘[3]五月谁敢过？\n荆州麦熟茧[4]成蛾，\n缲丝[5]忆君头绪[6]多。\n拨谷飞鸣奈妾何[7]？\n此作中民间生活气息很浓，“足风波”“谁敢过”“头绪多”“奈妾何”，就是民间口语的直接化用。全诗写的是一位农村妇女辛勤劳作之时思念远方丈夫的愁苦情景。白帝城边的江面上满是狂风掀起的惊涛骇浪，五月的瞿塘峡，江流湍急，暗礁丛生，归路受阻。思妇在家，眼看麦已成熟，春蚕也已经破茧成蛾，忙碌地缫着丝，触景生情涌起心中的“思”，叫人千头万绪。布谷鸟飞来飞去，在头上叫个不停。诗人以敏锐的笔触，生动形象地刻画了这丰富、复杂、微妙的情感，恰到好处地勾画出了女主人公复杂而又强烈的思念之情。\n注释：\n[1]荆州歌：古题乐府杂曲歌辞。《乐府诗集》卷七十二列于《杂曲歌辞》，又名“荆州乐”“江陵乐”。《乐府诗集·杂曲歌辞十二·荆州乐》郭茂倩题解：《荆州乐》盖出于《清商曲·江陵乐》，荆州即江陵也。有纪南城，在江陵县东。梁建文帝《荆州歌》云“纪城南里望朝云，雉飞麦熟妾思君”是也。\n[2]足：充足，诗中理解为满是，都是。\n[3]瞿（qú）塘：即瞿塘峡，与巫峡、西陵峡共称长江三峡。\n[4]茧（jiǎn）：指蚕茧。\n[5]缲（sāo）丝：即缫丝，将蚕茧抽出蚕丝的工艺。在南朝乐府中“丝”“思”为双关语。\n[6]头绪：也说思绪。\n[7]拨谷飞鸣奈妾何：写思妇默念：拨谷鸟已鸣，春天将尽，不见夫回，使人无可奈何。拨谷：即布谷鸟。布谷叫，也表明农忙季节已到。", "english": "The White King[1]Town’s seen many shipwrecks on the sands.\nWho dare to sail through Three Canyons in the fifth moon?\nThe wheat is ripe;the silkworm has made its cocoon.\nMy thoughts of you are endless as the silken strands.\nThe cuckoos sing:“Go Home!”\nWhen will you cometo homeland?\n注释：\n[1]Or the White Emperor Town in present-day Sichuan Province,situated on the northern shore of the Changjiang(Yangtze)River.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">白帝城边足[2]风波，<br>瞿塘[3]五月谁敢过？<br>荆州麦熟茧[4]成蛾，<br>缲丝[5]忆君头绪[6]多。<br>拨谷飞鸣奈妾何[7]？</p>\n<p class=\"prose\">此作中民间生活气息很浓，“足风波”“谁敢过”“头绪多”“奈妾何”，就是民间口语的直接化用。全诗写的是一位农村妇女辛勤劳作之时思念远方丈夫的愁苦情景。白帝城边的江面上满是狂风掀起的惊涛骇浪，五月的瞿塘峡，江流湍急，暗礁丛生，归路受阻。</p>\n<p class=\"prose\">思妇在家，眼看麦已成熟，春蚕也已经破茧成蛾，忙碌地缫着丝，触景生情涌起心中的“思”，叫人千头万绪。布谷鸟飞来飞去，在头上叫个不停。诗人以敏锐的笔触，生动形象地刻画了这丰富、复杂、微妙的情感，恰到好处地勾画出了女主人公复杂而又强烈的思念之情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]荆州歌：古题乐府杂曲歌辞。《乐府诗集》卷七十二列于《杂曲歌辞》，又名“荆州乐”“江陵乐”。《乐府诗集·杂曲歌辞十二·荆州乐》郭茂倩题解：《荆州乐》盖出于《清商曲·江陵乐》，荆州即江陵也。有纪南城，在江陵县东。梁建文帝《荆州歌》云“纪城南里望朝云，雉飞麦熟妾思君”是也。<br>[2]足：充足，诗中理解为满是，都是。<br>[3]瞿（qú）塘：即瞿塘峡，与巫峡、西陵峡共称长江三峡。<br>[4]茧（jiǎn）：指蚕茧。<br>[5]缲（sāo）丝：即缫丝，将蚕茧抽出蚕丝的工艺。在南朝乐府中“丝”“思”为双关语。<br>[6]头绪：也说思绪。<br>[7]拨谷飞鸣奈妾何：写思妇默念：拨谷鸟已鸣，春天将尽，不见夫回，使人无可奈何。拨谷：即布谷鸟。布谷叫，也表明农忙季节已到。</p>", "englishHtml": "<p class=\"prose\">The White King[1]Town’s seen many shipwrecks on the sands.<br>Who dare to sail through Three Canyons in the fifth moon?<br>The wheat is ripe;the silkworm has made its cocoon.<br>My thoughts of you are endless as the silken strands.<br>The cuckoos sing:“Go Home!”<br>When will you cometo homeland?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Or the White Emperor Town in present-day Sichuan Province,situated on the northern shore of the Changjiang(Yangtze)River.</p>"}, {"num": "006", "zhTitle": "渡荆门送别", "enTitle": "Farewell Beyond the Thorn-Gate Gorge", "chinese": "渡远[2]荆门外，\n来从楚国[3]游。\n山随平野[4]尽，\n江[5]入大荒[6]流。\n月下飞天镜[7]，\n云生结海楼[8]。\n仍怜故乡水，\n万里送行舟。\n《渡荆门送别》是公元725年李白乘船出三峡时写的五言律诗。诗人离开了荆门山，看见三峡的高山峻岭换成了广阔的平原，滚滚的江水流向茫茫的远方。到了夜间，一轮明月飞下天空，犹如明镜，片片白云升起，仿佛海市蜃楼，这和故乡的峨眉山月大异其趣。但是长江之波还是故乡流来的水，水波依依不舍地追随着诗人远行万里。这样，年轻的诗人就使无情的山水也富有诗情画意。李白诗的特点正是借景写情，使景语都变成情语了。\n注释：\n[1]荆门：山名，现今湖北省宜昌市宜都市西北长江南岸，与北岸虎牙山对峙，地势险要，自古以来被称为楚蜀咽喉。\n[2]远：远自。\n[3]楚国：楚地，指湖北一带，春秋时期属楚国。\n[4]平野：平坦开阔的原野。\n[5]江：长江。\n[6]大荒：广阔无垠的田野。\n[7]月下飞天镜：月光洒在江水上，如同飞下的天镜。\n[8]海楼：即海市蜃楼，这里形容江上的云霞异常美丽。", "english": "Leaving Mount Thorn-Gate far away,\nMy boat pursues its eastward way.\nWhere mountains end begins the plain;\nThe river rolls to boundless main.\nThe moon,celestial mirror,flies;\nThe clouds like miraged towers rise.\nThe water that from homeland flows\nWill follow me where my boat goes.\n注释：\n[1]In present-day Hubei Province.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">渡远[2]荆门外，<br>来从楚国[3]游。<br>山随平野[4]尽，<br>江[5]入大荒[6]流。<br>月下飞天镜[7]，<br>云生结海楼[8]。<br>仍怜故乡水，<br>万里送行舟。</p>\n<p class=\"prose\">《渡荆门送别》是公元725年李白乘船出三峡时写的五言律诗。诗人离开了荆门山，看见三峡的高山峻岭换成了广阔的平原，滚滚的江水流向茫茫的远方。到了夜间，一轮明月飞下天空，犹如明镜，片片白云升起，仿佛海市蜃楼，这和故乡的峨眉山月大异其趣。</p>\n<p class=\"prose\">但是长江之波还是故乡流来的水，水波依依不舍地追随着诗人远行万里。这样，年轻的诗人就使无情的山水也富有诗情画意。李白诗的特点正是借景写情，使景语都变成情语了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]荆门：山名，现今湖北省宜昌市宜都市西北长江南岸，与北岸虎牙山对峙，地势险要，自古以来被称为楚蜀咽喉。<br>[2]远：远自。<br>[3]楚国：楚地，指湖北一带，春秋时期属楚国。<br>[4]平野：平坦开阔的原野。<br>[5]江：长江。<br>[6]大荒：广阔无垠的田野。<br>[7]月下飞天镜：月光洒在江水上，如同飞下的天镜。<br>[8]海楼：即海市蜃楼，这里形容江上的云霞异常美丽。</p>", "englishHtml": "<p class=\"prose\">Leaving Mount Thorn-Gate far away,<br>My boat pursues its eastward way.<br>Where mountains end begins the plain;<br>The river rolls to boundless main.<br>The moon,celestial mirror,flies;<br>The clouds like miraged towers rise.<br>The water that from homeland flows<br>Will follow me where my boat goes.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Hubei Province.</p>"}, {"num": "007", "zhTitle": "望庐山瀑布水", "enTitle": "The Waterfall in Mount LuViewed from Afar", "chinese": "（二首其二）\n日照香炉[1]生紫烟，\n遥看[2]瀑布挂[3]前川[4]。\n飞流直[5]下三千尺[6]，\n疑[7]是银河落九天[8]。\n这是公元726年李白游庐山时的作品。巍巍的香炉峰上白云缭绕，在红日照耀下形成一片紫霞，仿佛冉冉上升的烟雾。远远看去，瀑布像一匹巨大的白练高挂在山川之间。在青山的衬托之下，云烟似乎也成了四溅的水珠，瀑布显得更高更陡，喷涌而出，飞奔而下，简直就像银河从天而降。这种浪漫主义的想象使这首小诗令人神往。宋人魏庆之说：“七言诗第五字要响。”这首诗第一句的“生”、第二句的“挂”、第四句的“落”都是动词，非常响亮，如果换掉这三个字，气势就没有这样磅礴了。\n注释：\n[1]香炉，指香炉峰，庐山北部名峰。紫烟，指日光穿过云雾，远远望去像紫色的烟云。\n[2]遥看：远看。\n[3]挂：悬挂。\n[4]川：河流，这里指瀑布。\n[5]直：笔直。\n[6]三千尺：形容山高。这里使用了夸张的手法。\n[7]疑：怀疑。\n[8]九天：形容天高。古人认为天有九重，九天是天的最高层，九重天，即天空最高处。", "english": "(II)\nThe sunlit Censer Peak exhales incense-like cloud,\nThe cataract hangs like upended stream sounding loud.\nIts torrent dashes down three thousand feet from high\nAs if the Silver River[2]fell from azure sky.\n注释：\n[1]Or the Lu Mountains in present-day Jiangxi Province.\n[2]The Chinese name for the Milky Way.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">（二首其二）<br>日照香炉[1]生紫烟，<br>遥看[2]瀑布挂[3]前川[4]。<br>飞流直[5]下三千尺[6]，<br>疑[7]是银河落九天[8]。</p>\n<p class=\"prose\">这是公元726年李白游庐山时的作品。巍巍的香炉峰上白云缭绕，在红日照耀下形成一片紫霞，仿佛冉冉上升的烟雾。远远看去，瀑布像一匹巨大的白练高挂在山川之间。在青山的衬托之下，云烟似乎也成了四溅的水珠，瀑布显得更高更陡，喷涌而出，飞奔而下，简直就像银河从天而降。</p>\n<p class=\"prose\">这种浪漫主义的想象使这首小诗令人神往。宋人魏庆之说：“七言诗第五字要响。”这首诗第一句的“生”、第二句的“挂”、第四句的“落”都是动词，非常响亮，如果换掉这三个字，气势就没有这样磅礴了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]香炉，指香炉峰，庐山北部名峰。紫烟，指日光穿过云雾，远远望去像紫色的烟云。<br>[2]遥看：远看。<br>[3]挂：悬挂。<br>[4]川：河流，这里指瀑布。<br>[5]直：笔直。<br>[6]三千尺：形容山高。这里使用了夸张的手法。<br>[7]疑：怀疑。<br>[8]九天：形容天高。古人认为天有九重，九天是天的最高层，九重天，即天空最高处。</p>", "englishHtml": "<p class=\"poem-lines\">(II)</p>\n<p class=\"prose\">The sunlit Censer Peak exhales incense-like cloud,<br>The cataract hangs like upended stream sounding loud.<br>Its torrent dashes down three thousand feet from high<br>As if the Silver River[2]fell from azure sky.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Or the Lu Mountains in present-day Jiangxi Province.<br>[2]The Chinese name for the Milky Way.</p>"}, {"num": "008", "zhTitle": "望庐山五老峰", "enTitle": "The Five Greybeard-like Peaks of Mount Lu Viewed from Afar", "chinese": "庐山东南五老峰，\n青天削出金芙蓉[2]。\n九江秀色[3]可揽结[4]，\n吾将此地巢云松[5]。\n此作体现了诗人一贯的浪漫主义情怀。这首诗是一首吟咏美景的佳作，五老峰坐落在庐山的东南面，因山势险峻，五峰相连，形似五位老人，因而得名。起句“庐山东南五老峰”，一下笔就触及题旨，第二句的“削”字极妙，极言山峰的耸立险峻之状。登山俯瞰山下九江秀丽景色，似乎可以随手采到一样，难怪诗人触动情肠不忍离去，有了避世隐居的想法。纵览全诗，浪漫色彩的想象、趣味的夸张，使一幅美景跃然纸上，所以说这不仅是一首写景诗，更是作者对自然的热爱之情的流露。\n注释：\n[1]五老峰：庐山东南部由五座形似老人的雄奇峰岭连结而成的山峰，山势险峻，是庐山胜景之一。李白曾在此地筑舍读书。\n[2]金芙蓉：莲花的美称。\n[3]秀色：秀丽的风景。\n[4]揽结：收集，拮取。\n[5]巢云松：隐居此处。", "english": "Southeast of Mountain Lu,Five Peaks of Greybeard stand\nAs golden lotus carved by Heaven’s azure hand.\nIf I could drink in beauty of the Rivers Nine[1],\nHere I would build my nest amid the cloud and pine.\n注释：\n[1]Jiujiang meaning nine rivers in present-day Jiangxi Province.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">庐山东南五老峰，<br>青天削出金芙蓉[2]。<br>九江秀色[3]可揽结[4]，<br>吾将此地巢云松[5]。</p>\n<p class=\"prose\">此作体现了诗人一贯的浪漫主义情怀。这首诗是一首吟咏美景的佳作，五老峰坐落在庐山的东南面，因山势险峻，五峰相连，形似五位老人，因而得名。起句“庐山东南五老峰”，一下笔就触及题旨，第二句的“削”字极妙，极言山峰的耸立险峻之状。</p>\n<p class=\"prose\">登山俯瞰山下九江秀丽景色，似乎可以随手采到一样，难怪诗人触动情肠不忍离去，有了避世隐居的想法。纵览全诗，浪漫色彩的想象、趣味的夸张，使一幅美景跃然纸上，所以说这不仅是一首写景诗，更是作者对自然的热爱之情的流露。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]五老峰：庐山东南部由五座形似老人的雄奇峰岭连结而成的山峰，山势险峻，是庐山胜景之一。李白曾在此地筑舍读书。<br>[2]金芙蓉：莲花的美称。<br>[3]秀色：秀丽的风景。<br>[4]揽结：收集，拮取。<br>[5]巢云松：隐居此处。</p>", "englishHtml": "<p class=\"prose\">Southeast of Mountain Lu,Five Peaks of Greybeard stand<br>As golden lotus carved by Heaven’s azure hand.<br>If I could drink in beauty of the Rivers Nine[1],<br>Here I would build my nest amid the cloud and pine.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Jiujiang meaning nine rivers in present-day Jiangxi Province.</p>"}, {"num": "009", "zhTitle": "望天门山", "enTitle": "Mount Heaven’s GateViewed from Afar", "chinese": "天门中断[2]楚江[3]开[4]，\n碧水东流至此[5]回[6]。\n两岸青山[7]相对出，\n孤帆一片日边来[8]。\n天门山是安徽东西梁山的合称，两山隔江对峙，好像天开的门户，所以叫天门山。山居然给长江冲断了，可见水势汹涌；水势虽猛，到此还是不得不改变流向，可见山势险峻。诗人乘船顺流而下，峰回路转，仿佛两岸青山争相迎接。一个“出”字，把山都写活了。“孤帆一片”，究竟是望中的孤舟，还是诗人坐的船呢？如是望中，那么，“日”应该是朝阳；如指诗人的船，则是夕阳。从全诗来看，还是青山迎接诗人更好。如果诗中无人，这首诗就纯粹是写景；如果有人，那才更能融景入情。\n注释：\n[1]天门山：在今安徽省马鞍山市当涂县西南长江两岸，东为东梁山（也称博望山），西为西梁山（又也称梁山）。两山隔江对立，仿佛天设的门户一般，故名。\n[2]中断：江水从中间隔断两山。\n[3]楚江：长江流经旧楚地故称楚江。\n[4]开：横断开来。\n[5]至此：意为东流的江水流至此处转向北流。\n[6]回：回漩，回转。指水流由于流向突变湍急起来。\n[7]两岸青山：分别指东梁山和西梁山。\n[8]日边来：指孤舟从天水相接处的远方驶来，远远望去，仿佛来自日边。", "english": "Breaking Mount Heaven’s Gate,the great River rolls through,\nIts east-flowing green billows,hurled back here,turn north.\nFrom the two river banks thrust out the mountains blue,\nLeaving the sun behind,a lonely sail comes forth.\n注释：\n[1]In present-day Anhui Province.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">天门中断[2]楚江[3]开[4]，<br>碧水东流至此[5]回[6]。<br>两岸青山[7]相对出，<br>孤帆一片日边来[8]。</p>\n<p class=\"prose\">天门山是安徽东西梁山的合称，两山隔江对峙，好像天开的门户，所以叫天门山。山居然给长江冲断了，可见水势汹涌；水势虽猛，到此还是不得不改变流向，可见山势险峻。诗人乘船顺流而下，峰回路转，仿佛两岸青山争相迎接。一个“出”字，把山都写活了。</p>\n<p class=\"prose\">“孤帆一片”，究竟是望中的孤舟，还是诗人坐的船呢？如是望中，那么，“日”应该是朝阳；如指诗人的船，则是夕阳。从全诗来看，还是青山迎接诗人更好。如果诗中无人，这首诗就纯粹是写景；如果有人，那才更能融景入情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]天门山：在今安徽省马鞍山市当涂县西南长江两岸，东为东梁山（也称博望山），西为西梁山（又也称梁山）。两山隔江对立，仿佛天设的门户一般，故名。<br>[2]中断：江水从中间隔断两山。<br>[3]楚江：长江流经旧楚地故称楚江。<br>[4]开：横断开来。<br>[5]至此：意为东流的江水流至此处转向北流。<br>[6]回：回漩，回转。指水流由于流向突变湍急起来。<br>[7]两岸青山：分别指东梁山和西梁山。<br>[8]日边来：指孤舟从天水相接处的远方驶来，远远望去，仿佛来自日边。</p>", "englishHtml": "<p class=\"prose\">Breaking Mount Heaven’s Gate,the great River rolls through,<br>Its east-flowing green billows,hurled back here,turn north.<br>From the two river banks thrust out the mountains blue,<br>Leaving the sun behind,a lonely sail comes forth.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Anhui Province.</p>"}, {"num": "010", "zhTitle": "杨叛儿", "enTitle": "A Love Song", "chinese": "君歌[2]杨叛儿，\n妾劝新丰酒[3]。\n何许[4]最关人[5]？\n乌啼白门[6]柳。\n乌啼隐[7]杨花，\n君醉留妾家。\n博山炉[8]中沉香[9]火，\n双烟一气[10]凌紫霞[11]。\n这首诗取材于乐府《杨叛儿》。一对青年男女，君唱歌，妾劝酒，一开头就呈现出一对恋人互相爱慕的美好画面，愉悦的气氛贯穿全诗。白门即刘宋都城建康（今南京）城门。南朝民间情歌常常提到白门，后代指男女欢会之地。对热恋之中的人来说，最牵动人心的自然是约会的时间和地点，“乌啼”即指日暮，对“何许最关人”这一设问，无疑“乌啼白门柳”道出了所有恋人的心声。乌啼是薄暮，乌隐是迟暮，恋人陶醉在甜情蜜意中，一醉一留间，将爱情表现得尤为炽烈。此句意境动人，与“月上柳梢头，人约黄昏后”有异曲同工之妙。最后两句蕴含道教哲学的绝妙比喻，使全诗得到升华，这是一首唯美的爱情之诗。\n注释：\n[1]杨叛儿：一作“阳叛儿”，原为南北朝时的童谣，后来成为乐府诗题。《乐府诗集》卷四十九列为《清商曲辞》。\n[2]君歌：即“君家”。\n[3]新丰酒：原指在长安新丰镇生产的酒。此指江南之新丰酒。\n[4]何许：何处，哪里。\n[5]关人：牵动人的情思。\n[6]白门：刘宋都城建康（今南京）城门。\n[7]隐：隐没，这里指乌鸦栖息在杨花丛中。\n[8]博山炉：古香炉名。\n[9]沉香：又名沉水香，一种可燃的名贵香料。\n[10]双烟一气：两股烟缭绕在一起，用以形容男女两情之合好如一。\n[11] 紫霞：指天空云霞。", "english": "You sing a lover’s lore;\nI urge you to drink more.\nWhat touches you and me?\nCrow’s nest in willow tree.\nCrows hide mid poplar flowers;\nDrunk,you stay in my bowers.\nBehold the censer and the sandalwood in fire!\nTwo wreaths of smoke combine and rise higher and higher.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">君歌[2]杨叛儿，<br>妾劝新丰酒[3]。<br>何许[4]最关人[5]？<br>乌啼白门[6]柳。<br>乌啼隐[7]杨花，<br>君醉留妾家。<br>博山炉[8]中沉香[9]火，<br>双烟一气[10]凌紫霞[11]。</p>\n<p class=\"prose\">这首诗取材于乐府《杨叛儿》。一对青年男女，君唱歌，妾劝酒，一开头就呈现出一对恋人互相爱慕的美好画面，愉悦的气氛贯穿全诗。白门即刘宋都城建康（今南京）城门。南朝民间情歌常常提到白门，后代指男女欢会之地。对热恋之中的人来说，最牵动人心的自然是约会的时间和地点，“乌啼”即指日暮，对“何许最关人”这一设问，无疑“乌啼白门柳”道出了所有恋人的心声。</p>\n<p class=\"prose\">乌啼是薄暮，乌隐是迟暮，恋人陶醉在甜情蜜意中，一醉一留间，将爱情表现得尤为炽烈。此句意境动人，与“月上柳梢头，人约黄昏后”有异曲同工之妙。最后两句蕴含道教哲学的绝妙比喻，使全诗得到升华，这是一首唯美的爱情之诗。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]杨叛儿：一作“阳叛儿”，原为南北朝时的童谣，后来成为乐府诗题。《乐府诗集》卷四十九列为《清商曲辞》。<br>[2]君歌：即“君家”。<br>[3]新丰酒：原指在长安新丰镇生产的酒。此指江南之新丰酒。<br>[4]何许：何处，哪里。<br>[5]关人：牵动人的情思。<br>[6]白门：刘宋都城建康（今南京）城门。<br>[7]隐：隐没，这里指乌鸦栖息在杨花丛中。<br>[8]博山炉：古香炉名。<br>[9]沉香：又名沉水香，一种可燃的名贵香料。<br>[10]双烟一气：两股烟缭绕在一起，用以形容男女两情之合好如一。<br>[11] 紫霞：指天空云霞。</p>", "englishHtml": "<p class=\"prose\">You sing a lover’s lore;<br>I urge you to drink more.<br>What touches you and me?<br>Crow’s nest in willow tree.<br>Crows hide mid poplar flowers;<br>Drunk,you stay in my bowers.<br>Behold the censer and the sandalwood in fire!<br>Two wreaths of smoke combine and rise higher and higher.</p>"}, {"num": "011", "zhTitle": "长干行", "enTitle": "Ballads of a Merchant’s Wife", "chinese": "（二首其一）\n妾发初覆额，\n折花门前剧。\n郎骑竹马来，\n绕床[2]弄青梅。\n同居长干里[3]，\n两小无嫌猜。\n十四为君妇，\n羞颜未尝开。\n低头向暗壁，\n千唤不一回。\n十五始展眉，\n愿同尘与灰。\n常存抱柱信[4]，\n岂上望夫台！\n十六君远行，\n瞿塘滟滪堆[5]。\n五月不可触，\n猿声天上哀。\n门前迟行迹，\n一一生绿苔。\n苔深不能扫，\n落叶秋风早。\n八月蝴蝶黄，\n双飞西园草。\n感此伤妾心，\n坐愁红颜老。\n早晚[6]下三巴[7]，\n预将书报家。\n相迎不道远，\n直至长风沙[8]。\n《长干行》是李白爱情诗的代表作，写长干里的少年儿女青梅竹马，后来结为夫妇，但愿共甘苦同生死。丈夫愿学在桥下约会的情人，等到水涨女方还没来时，宁愿抱着桥柱淹死也不离开。现在丈夫出外经商，三峡水急滩险，经常船沉人亡，连猿猴都悲啼哀鸣了。妻子在门前等候，像在望夫台上，一直等到台阶上长满了绿苔，蝴蝶也变老了，丈夫还没回家。她不免感到悲哀，希望他能早从三峡归来，先寄一封家信，她会不怕路远，到几百里外的长风沙去接他。这是古代借相思写爱情的代表作。\n注释：\n[1]长干行：属乐府《杂曲歌辞》调名。\n[2]床：井栏，即后院围住水井的栅栏。\n[3]长干里：位于今南京市，旧时船民多聚居于此，因而《长干曲》多抒发船家女子的感情。\n[4]抱柱信：典出《庄子·盗跖篇》，写尾生与一女子相约于桥下见面，女子未到却突然涨水，尾生因守信不愿离去，抱着柱子被水淹死。\n[5]滟（yàn）滪（yù）堆：三峡之一瞿塘峡峡口的一块大礁石，农历五月涨水没礁，过往船只极易触礁沉没。\n[6]早晚：什么时候。\n[7]三巴：地名。即巴郡、巴东、巴西。在今四川东部地区。\n[8]长风沙：地名，在今安徽省安庆市的长江沿岸，距南京约700里。", "english": "(I)\nMy forehead covered by my hair cut straight,\nI played with flowers plucked before the gate.\nOn a hobbyhorse you came upon the scene,\nAround the well we played with mumes still green.\nWe lived close neighbors on riverside lane.\nCarefree and innocent,we children twain.\nI was fourteen when I became your bride;\nI’d often turn my bashful face aside.\nHanging my head,I’d look towards the wall;\nA thousand times I’d not answer your call.\nI was fifteen when I composed my brows;\nTo mix my dust with yours were my dear vows.\nRather than break faith,you declared you’d die.\nWho knew I’d live alone in a tower high?\nI was sixteen when you went far away,\nPassing Three Canyons studded with rocks grey,\nWhere ships were wrecked when spring flood ran high,\nWhere gibbons’wails seemed coming from the sky.\nGreen moss now overgrows before our door;\nYour footprints,hidden,can be seen no more.\nMoss can’t be swept away:so thick it grows,\nAnd leaves fall early when the west wind blows.\nThe yellow butterflies in autumn pass\nTwo by two o’er our western garden grass.\nThis sight would break my heart,and I’m afraid,\nSitting alone,my rosy cheeks would fade.\nSooner or later,you’ll leave the western land.\nDo not forget to let me know beforehand.\nI’ll walk to meet you and not call it far\nTo go to Long Wind Sands or where you are.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">（二首其一）<br>妾发初覆额，<br>折花门前剧。<br>郎骑竹马来，<br>绕床[2]弄青梅。<br>同居长干里[3]，<br>两小无嫌猜。<br>十四为君妇，<br>羞颜未尝开。<br>低头向暗壁，<br>千唤不一回。<br>十五始展眉，<br>愿同尘与灰。<br>常存抱柱信[4]，<br>岂上望夫台！<br>十六君远行，<br>瞿塘滟滪堆[5]。<br>五月不可触，<br>猿声天上哀。<br>门前迟行迹，<br>一一生绿苔。<br>苔深不能扫，<br>落叶秋风早。<br>八月蝴蝶黄，<br>双飞西园草。<br>感此伤妾心，<br>坐愁红颜老。<br>早晚[6]下三巴[7]，<br>预将书报家。<br>相迎不道远，<br>直至长风沙[8]。</p>\n<p class=\"prose\">《长干行》是李白爱情诗的代表作，写长干里的少年儿女青梅竹马，后来结为夫妇，但愿共甘苦同生死。丈夫愿学在桥下约会的情人，等到水涨女方还没来时，宁愿抱着桥柱淹死也不离开。现在丈夫出外经商，三峡水急滩险，经常船沉人亡，连猿猴都悲啼哀鸣了。</p>\n<p class=\"prose\">妻子在门前等候，像在望夫台上，一直等到台阶上长满了绿苔，蝴蝶也变老了，丈夫还没回家。她不免感到悲哀，希望他能早从三峡归来，先寄一封家信，她会不怕路远，到几百里外的长风沙去接他。这是古代借相思写爱情的代表作。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]长干行：属乐府《杂曲歌辞》调名。<br>[2]床：井栏，即后院围住水井的栅栏。<br>[3]长干里：位于今南京市，旧时船民多聚居于此，因而《长干曲》多抒发船家女子的感情。<br>[4]抱柱信：典出《庄子·盗跖篇》，写尾生与一女子相约于桥下见面，女子未到却突然涨水，尾生因守信不愿离去，抱着柱子被水淹死。<br>[5]滟（yàn）滪（yù）堆：三峡之一瞿塘峡峡口的一块大礁石，农历五月涨水没礁，过往船只极易触礁沉没。<br>[6]早晚：什么时候。<br>[7]三巴：地名。即巴郡、巴东、巴西。在今四川东部地区。<br>[8]长风沙：地名，在今安徽省安庆市的长江沿岸，距南京约700里。</p>", "englishHtml": "<p class=\"poem-lines\">(I)</p>\n<p class=\"prose\">My forehead covered by my hair cut straight,<br>I played with flowers plucked before the gate.<br>On a hobbyhorse you came upon the scene,<br>Around the well we played with mumes still green.<br>We lived close neighbors on riverside lane.<br>Carefree and innocent,we children twain.<br>I was fourteen when I became your bride;<br>I’d often turn my bashful face aside.<br>Hanging my head,I’d look towards the wall;<br>A thousand times I’d not answer your call.<br>I was fifteen when I composed my brows;<br>To mix my dust with yours were my dear vows.<br>Rather than break faith,you declared you’d die.<br>Who knew I’d live alone in a tower high?<br>I was sixteen when you went far away,<br>Passing Three Canyons studded with rocks grey,<br>Where ships were wrecked when spring flood ran high,<br>Where gibbons’wails seemed coming from the sky.<br>Green moss now overgrows before our door;<br>Your footprints,hidden,can be seen no more.<br>Moss can’t be swept away:so thick it grows,<br>And leaves fall early when the west wind blows.<br>The yellow butterflies in autumn pass<br>Two by two o’er our western garden grass.<br>This sight would break my heart,and I’m afraid,<br>Sitting alone,my rosy cheeks would fade.<br>Sooner or later,you’ll leave the western land.<br>Do not forget to let me know beforehand.<br>I’ll walk to meet you and not call it far<br>To go to Long Wind Sands or where you are.</p>"}, {"num": "012", "zhTitle": "长干行", "enTitle": "Ballads of a Merchant’s Wife", "chinese": "（二首其二）\n忆妾[1]深闺里，\n烟尘不曾识。\n嫁与长干人，\n沙头[2]候风色。\n五月南风兴，\n思君下[3]巴陵。\n八月西风起，\n想君发[4]扬子。\n去来悲如何，\n见少离别多。\n湘潭[5]几日到？\n妾梦越风波！\n昨夜狂风度，\n吹折江头树。\n淼淼[6]暗无边，\n行人在何处？\n好乘浮云骢[7]，\n佳期兰渚[8]东。\n鸳鸯绿蒲上，\n翡翠[9]锦屏中。\n自怜十五余，\n颜色桃花红。\n那作商人妇，\n愁水复愁风！\n如果说第一首诗从各个生活阶段的各个生活侧面着手，塑造出一个对理想生活执着追求和热切向往的商贾思妇的艺术形象，那么第二首则从商妇望夫说起，感情层层深入，直至自怜自恨而止，抒写妻子对外出远商的丈夫的挚爱和思念，凄切幽怨，缠绵感人。评论界普遍认为，第二首比第一首稍逊一筹，第二首与其他闺怨诗一样直接从幽怨的少妇下笔，第一首自出机杼从童年时两小无猜写起。其实，第一首呈现的是一幅幅生活场景，着重刻画人物性格，满腹相思还未倾诉，这就引出了第二首。如果说第一首是清水出芙蓉的水墨画，那么第二首就是色彩浓得化不开的油画，满纸都是浓浓的相思。\n注释：\n[1]妾：作“昔”。\n[2]沙头：沙岸。\n[3]下：作“在”。\n[4]发：出发。\n[5]湘潭：泛指湖南一带。\n[6]淼淼：形容水势浩大。\n[7]浮云骢（cōnɡ）：骏马。西汉文帝有骏马名浮云。\n[8]兰渚：长有兰草的小洲。\n[9]翡翠：水鸟名。", "english": "(II)\nBrought up while young in inner room,\nI knew nor wind nor dust that rose.\nSince you became my dear bridegroom,\nI’ve learned on Sands from where wind blows.\nIn the fifth moon south wind is high,\nI know you’re sailing the river down;\nIn the eighth moon west wind comes nigh,\nI think you’ll leave the river town.\nI’m grieved to see you come and go:\nWe sever longer than we meet.\nWhen will you come home?Let me know!\nTo cross the waves my dream is fleet.\nLast night a violent wind blew,\nBreaking the trees by riverside.\nSo dark the boundless waters grew!\nWhere could your roving ship abide?\nI’d ride upon a cloud-like steed\nTo meet you east of River Green\nLike two love birds amid the reed\nOr kingfishers on silken screen.\nI pity my fifteen odd years,\nLike blooming peach my face is warm.\nBut I’m a merchant’s wife in tears,\nWho worries over wind and storm.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">（二首其二）<br>忆妾[1]深闺里，<br>烟尘不曾识。<br>嫁与长干人，<br>沙头[2]候风色。<br>五月南风兴，<br>思君下[3]巴陵。<br>八月西风起，<br>想君发[4]扬子。<br>去来悲如何，<br>见少离别多。<br>湘潭[5]几日到？<br>妾梦越风波！<br>昨夜狂风度，<br>吹折江头树。<br>淼淼[6]暗无边，<br>行人在何处？<br>好乘浮云骢[7]，<br>佳期兰渚[8]东。<br>鸳鸯绿蒲上，<br>翡翠[9]锦屏中。<br>自怜十五余，<br>颜色桃花红。<br>那作商人妇，<br>愁水复愁风！</p>\n<p class=\"prose\">如果说第一首诗从各个生活阶段的各个生活侧面着手，塑造出一个对理想生活执着追求和热切向往的商贾思妇的艺术形象，那么第二首则从商妇望夫说起，感情层层深入，直至自怜自恨而止，抒写妻子对外出远商的丈夫的挚爱和思念，凄切幽怨，缠绵感人。</p>\n<p class=\"prose\">评论界普遍认为，第二首比第一首稍逊一筹，第二首与其他闺怨诗一样直接从幽怨的少妇下笔，第一首自出机杼从童年时两小无猜写起。其实，第一首呈现的是一幅幅生活场景，着重刻画人物性格，满腹相思还未倾诉，这就引出了第二首。如果说第一首是清水出芙蓉的水墨画，那么第二首就是色彩浓得化不开的油画，满纸都是浓浓的相思。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]妾：作“昔”。<br>[2]沙头：沙岸。<br>[3]下：作“在”。<br>[4]发：出发。<br>[5]湘潭：泛指湖南一带。<br>[6]淼淼：形容水势浩大。<br>[7]浮云骢（cōnɡ）：骏马。西汉文帝有骏马名浮云。<br>[8]兰渚：长有兰草的小洲。<br>[9]翡翠：水鸟名。</p>", "englishHtml": "<p class=\"poem-lines\">(II)</p>\n<p class=\"prose\">Brought up while young in inner room,<br>I knew nor wind nor dust that rose.<br>Since you became my dear bridegroom,<br>I’ve learned on Sands from where wind blows.<br>In the fifth moon south wind is high,<br>I know you’re sailing the river down;<br>In the eighth moon west wind comes nigh,<br>I think you’ll leave the river town.<br>I’m grieved to see you come and go:<br>We sever longer than we meet.<br>When will you come home?Let me know!<br>To cross the waves my dream is fleet.<br>Last night a violent wind blew,<br>Breaking the trees by riverside.<br>So dark the boundless waters grew!<br>Where could your roving ship abide?<br>I’d ride upon a cloud-like steed<br>To meet you east of River Green<br>Like two love birds amid the reed<br>Or kingfishers on silken screen.<br>I pity my fifteen odd years,<br>Like blooming peach my face is warm.<br>But I’m a merchant’s wife in tears,<br>Who worries over wind and storm.</p>"}, {"num": "013", "zhTitle": "金陵酒肆留别", "enTitle": "Parting at a Tavern in Jinling", "chinese": "风吹柳花满店香，\n吴姬压酒劝客尝。\n金陵子弟[2]来相送，\n欲行[3]不行[4]各尽觞[5]。\n请君试问东流水，\n别意与之谁短长？\n公元726年暮春时节，柳絮飘飞，李白离开金陵到扬州去。青年朋友到酒店来送行，店中女郎从酒糟中压出酒来，劝客人多喝几杯。将行的人和送行的人都开怀畅饮，于是李白就写下了这首小诗。他要问问长江的流水，到底是江水更高兴流走，还是他更高兴留下呢？全诗没有一个“愁”字，因为生活中没有愁，所以诗中就只有别情，无怪乎沈德潜说“语不必深，写情已足”。\n注释：\n[1]酒肆：酒店。\n[2]子弟：指李白的朋友。\n[3]欲行：即将离开的人，指诗人自己。\n[4]不行：不走的人，指送别的人。\n[5]尽觞（shānɡ）：一口喝完杯中的酒。觞，酒杯。", "english": "The tavern’s sweetened when wind blows in willow-down;\nA Southern maiden bids the guests to taste the wine.\nMy dear young friends have come to see me leave the town;\nThey drink their cups and I,still tarrying,drink mine.\nOh!Ask the river flowing to the east,I pray,\nIf he is happier to go than I to stay!\n注释：\n[1]Present-day Nanjing,capital of Jiangsu Province.", "poemType": "古体诗", "chineseHtml": "<p class=\"poem-lines\">风吹柳花满店香，<br>吴姬压酒劝客尝。<br>金陵子弟[2]来相送，<br>欲行[3]不行[4]各尽觞[5]。<br>请君试问东流水，<br>别意与之谁短长？</p>\n<p class=\"prose\">公元726年暮春时节，柳絮飘飞，李白离开金陵到扬州去。青年朋友到酒店来送行，店中女郎从酒糟中压出酒来，劝客人多喝几杯。将行的人和送行的人都开怀畅饮，于是李白就写下了这首小诗。他要问问长江的流水，到底是江水更高兴流走，还是他更高兴留下呢？</p>\n<p class=\"prose\">全诗没有一个“愁”字，因为生活中没有愁，所以诗中就只有别情，无怪乎沈德潜说“语不必深，写情已足”。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]酒肆：酒店。<br>[2]子弟：指李白的朋友。<br>[3]欲行：即将离开的人，指诗人自己。<br>[4]不行：不走的人，指送别的人。<br>[5]尽觞（shānɡ）：一口喝完杯中的酒。觞，酒杯。</p>", "englishHtml": "<p class=\"prose\">The tavern’s sweetened when wind blows in willow-down;<br>A Southern maiden bids the guests to taste the wine.<br>My dear young friends have come to see me leave the town;<br>They drink their cups and I,still tarrying,drink mine.<br>Oh!Ask the river flowing to the east,I pray,<br>If he is happier to go than I to stay!</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Nanjing,capital of Jiangsu Province.</p>"}, {"num": "014", "zhTitle": "夜下征虏亭", "enTitle": "Passing by the Triumphal Tower at Night", "chinese": "船下广陵去，\n月明征虏亭。\n山花如绣颊[2]，\n江火[3]似流萤[4]。\n这首诗应该是李白写了《金陵酒肆留别》之后，上船到扬州去，在月下经过征虏亭时写的。诗人把烂漫的山花比作天真烂漫、巧妆打扮的妙龄少女的脸颊，把长江两岸星星点点的万家灯火比作闪闪烁烁的万点萤光，画出了一幅令人心醉神迷的春江花月图。英译文把每句诗的五个字译成八个音节（四个抑扬格的音步），来传达这首小诗的意美、音美和形美。\n注释：\n[1]征虏亭：东晋时征虏将军谢石所建，故址在今江苏省南京市南郊。此诗题下原注：”《丹阳记》：亭是太安中征虏将军谢安所立，因以为名。“据《晋书·谢安传》等史料，谢安从未有过征虏将军的封号，这里“谢安”应是“谢石”之误。\n[2]绣颊（jiá）：女子脸颊涂上胭脂后，色如锦绣，因称绣颊。此处借喻岸上山花的娇艳。\n[3]江火：江上的渔火。\n[4]流萤：飞舞的萤火虫。", "english": "My boat sails down to River Town[1],\nThe Tower’s bright in the moonlight.\nThe flowers blow like cheeks that glow,\nAnd lanterns beam as fireflies gleam.\n注释：\n[1]Yangzhou in Jiangsu Province.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">船下广陵去，<br>月明征虏亭。<br>山花如绣颊[2]，<br>江火[3]似流萤[4]。</p>\n<p class=\"prose\">这首诗应该是李白写了《金陵酒肆留别》之后，上船到扬州去，在月下经过征虏亭时写的。诗人把烂漫的山花比作天真烂漫、巧妆打扮的妙龄少女的脸颊，把长江两岸星星点点的万家灯火比作闪闪烁烁的万点萤光，画出了一幅令人心醉神迷的春江花月图。</p>\n<p class=\"prose\">英译文把每句诗的五个字译成八个音节（四个抑扬格的音步），来传达这首小诗的意美、音美和形美。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]征虏亭：东晋时征虏将军谢石所建，故址在今江苏省南京市南郊。此诗题下原注：”《丹阳记》：亭是太安中征虏将军谢安所立，因以为名。“据《晋书·谢安传》等史料，谢安从未有过征虏将军的封号，这里“谢安”应是“谢石”之误。<br>[2]绣颊（jiá）：女子脸颊涂上胭脂后，色如锦绣，因称绣颊。此处借喻岸上山花的娇艳。<br>[3]江火：江上的渔火。<br>[4]流萤：飞舞的萤火虫。</p>", "englishHtml": "<p class=\"prose\">My boat sails down to River Town[1],<br>The Tower’s bright in the moonlight.<br>The flowers blow like cheeks that glow,<br>And lanterns beam as fireflies gleam.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Yangzhou in Jiangsu Province.</p>"}, {"num": "015", "zhTitle": "上李邕", "enTitle": "The Roc—to Li Yong", "chinese": "大鹏一日同风起，\n扶摇[2]直上九万里。\n假令[3]风歇时下来，\n犹能簸却[4]沧溟水。\n世人见我恒[5]殊调[6]，\n闻[7]余大言皆冷笑。\n宣父[8]犹能畏后生，\n丈夫[9]未可轻年少。\n这首诗是李白青年时期的作品。李邕于开元七至九年（719—721）前后任渝州（今重庆）刺史，李白游渝州拜见李邕，希望通过李邕引荐找到政治出路，却因不拘俗礼，且谈论间放言高论，纵谈王霸，使李邕不悦，受到冷遇，愤激之余写下此诗，以示回敬。但由于李邕年辈长于李白，故诗题云“上”。前四句中李白以大鹏自比，大鹏鸟是庄子哲学中自由的象征、理想的图腾。观李白诗作，不难发现其受道家哲学影响之深，而正是由于道教哲学的影响，才造就了李白的旷达飘逸、奇思妙想。诗的前四句既勾画出了一个力簸沧海的大鹏形象，也是诗人对自己形象的描述。后四句则是对李邕的傲慢态度的直接回敬，不同凡响的言论不被凡夫俗子理解，孔子尚且说过“后生可畏”，谁又能轻视年轻人呢？这是揶揄，是讽刺，青年李白就已展示了过人的胆识。\n注释：\n[1]上：呈上。\n[2]扶摇：乘风。摇，由下而上的大风。\n[3]假令：假使，即使。\n[4]簸却：激起。\n[5]恒：总，经常。\n[6]殊调：不寻常的论调，不同世俗的言行。\n[7]闻：作“见”。\n[8]宣父：即孔子，唐太宗贞观十一年（637年）诏尊孔子为宣父。\n[9]丈夫：古代男子的通称，这里指李邕。", "english": "If once together with the wind the roc could rise,\nHe would fly ninety thousand miles up to the skies.\nE’en if he must descend when the wind has abated,\nStill billows will be raised and the sea agitated.\nSeeing me,those in power think I’m rather queer;\nHearing me freely talk,they can’t refrain from sneer.\nConfucius was in dread of talents that would be;\nA sage will ne’er look down upon a youth like me.\n注释：\n[1]In 726 Li Bai sought the patronage of Li Yong,an official who was more than twenty years older than he.", "poemType": "七言律诗", "chineseHtml": "<p class=\"poem-lines\">大鹏一日同风起，<br>扶摇[2]直上九万里。<br>假令[3]风歇时下来，<br>犹能簸却[4]沧溟水。<br>世人见我恒[5]殊调[6]，<br>闻[7]余大言皆冷笑。<br>宣父[8]犹能畏后生，<br>丈夫[9]未可轻年少。</p>\n<p class=\"prose\">这首诗是李白青年时期的作品。李邕于开元七至九年（719—721）前后任渝州（今重庆）刺史，李白游渝州拜见李邕，希望通过李邕引荐找到政治出路，却因不拘俗礼，且谈论间放言高论，纵谈王霸，使李邕不悦，受到冷遇，愤激之余写下此诗，以示回敬。</p>\n<p class=\"prose\">但由于李邕年辈长于李白，故诗题云“上”。前四句中李白以大鹏自比，大鹏鸟是庄子哲学中自由的象征、理想的图腾。观李白诗作，不难发现其受道家哲学影响之深，而正是由于道教哲学的影响，才造就了李白的旷达飘逸、奇思妙想。诗的前四句既勾画出了一个力簸沧海的大鹏形象，也是诗人对自己形象的描述。</p>\n<p class=\"prose\">后四句则是对李邕的傲慢态度的直接回敬，不同凡响的言论不被凡夫俗子理解，孔子尚且说过“后生可畏”，谁又能轻视年轻人呢？这是揶揄，是讽刺，青年李白就已展示了过人的胆识。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]上：呈上。<br>[2]扶摇：乘风。摇，由下而上的大风。<br>[3]假令：假使，即使。<br>[4]簸却：激起。<br>[5]恒：总，经常。<br>[6]殊调：不寻常的论调，不同世俗的言行。<br>[7]闻：作“见”。<br>[8]宣父：即孔子，唐太宗贞观十一年（637年）诏尊孔子为宣父。<br>[9]丈夫：古代男子的通称，这里指李邕。</p>", "englishHtml": "<p class=\"prose\">If once together with the wind the roc could rise,<br>He would fly ninety thousand miles up to the skies.<br>E’en if he must descend when the wind has abated,<br>Still billows will be raised and the sea agitated.<br>Seeing me,those in power think I’m rather queer;<br>Hearing me freely talk,they can’t refrain from sneer.<br>Confucius was in dread of talents that would be;<br>A sage will ne’er look down upon a youth like me.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In 726 Li Bai sought the patronage of Li Yong,an official who was more than twenty years older than he.</p>"}, {"num": "016", "zhTitle": "静夜思", "enTitle": "Thoughts on a Silent Night", "chinese": "床前明月光，\n疑[2]是地上霜。\n举头[3]望明月，\n低头思故乡。\n《静夜思》是李白传诵最广的名诗。第一句“床前明月光”，有人说“床”应该是井床，“明月”应该是山月，但一般都理解为卧室的床前，英译文就从众了。因为明月是圆的，会引起中国人团圆的思想，这就是《静夜思》的主题。但西方人并没有团圆的观念，天上的圆月也不会使人想到家人的团圆。因此，译文第一行把明月光比作水，说是一池月光；第四行又说沉浸在乡愁中，再把乡愁也比作水。这样就用水，而不是用圆，把明月和乡愁联系起来了。\n注释：\n[1]静夜思：在安静夜晚所产生的思绪。\n[2]疑：好像。\n[3]举头：抬头。", "english": "Before my bed a pool of light—\nIs it hoarfrost upon the ground?\nEyes raised,I see the moon so bright;\nHead bent,in homesickness I’m drowned.", "poemType": "五言绝句", "chineseHtml": "<p class=\"poem-lines\">床前明月光，<br>疑[2]是地上霜。<br>举头[3]望明月，<br>低头思故乡。</p>\n<p class=\"prose\">《静夜思》是李白传诵最广的名诗。第一句“床前明月光”，有人说“床”应该是井床，“明月”应该是山月，但一般都理解为卧室的床前，英译文就从众了。因为明月是圆的，会引起中国人团圆的思想，这就是《静夜思》的主题。但西方人并没有团圆的观念，天上的圆月也不会使人想到家人的团圆。</p>\n<p class=\"prose\">因此，译文第一行把明月光比作水，说是一池月光；第四行又说沉浸在乡愁中，再把乡愁也比作水。这样就用水，而不是用圆，把明月和乡愁联系起来了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]静夜思：在安静夜晚所产生的思绪。<br>[2]疑：好像。<br>[3]举头：抬头。</p>", "englishHtml": "<p class=\"prose\">Before my bed a pool of light—<br>Is it hoarfrost upon the ground?<br>Eyes raised,I see the moon so bright;<br>Head bent,in homesickness I’m drowned.</p>"}, {"num": "017", "zhTitle": "黄鹤楼送孟浩然之广陵", "enTitle": "Seeing Meng Haoran off at Yellow Crane Tower", "chinese": "故人[4]西辞[5]黄鹤楼，\n烟花[6]三月下扬州。\n孤帆远影碧空尽[7]，\n唯见[8]长江天际流[9]。\n这首七绝是李白在一个繁华时代的繁华季节，送孟浩然去一个繁华地方的送别诗。诗中第一句的黄鹤楼，是传说中仙人驾鹤升天的地方，这会使人联想到孟浩然也是去人间天堂的广陵（今天的扬州），诗意就更浓了。第二句是千古丽句，写长江两岸杨柳如烟、鲜花似锦的美景，画意又增加了诗情。后两句更是融情于景。第三句表面上写的是孤帆远影，实际上说的是诗人的心已随友人远去了。第四句写的是天际江流，说的是诗人情思悠悠，无穷无尽。所以这是一首诗中有画、画中有诗的杰作。\n注释：\n[1]黄鹤楼：故址在今湖北省武汉市武昌蛇山的黄鹄矶上，属于长江下游地带，传说三国时期的费祎于此登仙乘黄鹤而去，故称黄鹤楼。孟浩然：李白的朋友。\n[2]之：到。\n[3]广陵：即扬州。\n[4]故人：老朋友，此处指孟浩然。其年龄比李白大，在诗坛上颇具盛名。李白对其非常钦佩，彼此感情深厚，因此称之为“故人”。\n[5]辞：辞别。\n[6]烟花：扬州柳絮飘荡和琼花美艳绝伦，这里指扬州绝美的春景。\n[7]碧空尽：消失在碧蓝的天际。尽：尽头，消失了。碧空：一作“碧山”。\n[8]唯见：只见。\n[9]天际流：向天边流去。天际：天边，天边的尽头。", "english": "My friend has left the west where towers Yellow Crane\nFor River Town[2]when willow-down and flowers reign.\nHis lessening sail is lost in boundless azure sky,\nWhere I see but the endless River rolling by.\n注释：\n[1]In Wuhan,capital of Hubei Province.\n[2]Yangzhou in Jiangsu Province.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">故人[4]西辞[5]黄鹤楼，<br>烟花[6]三月下扬州。<br>孤帆远影碧空尽[7]，<br>唯见[8]长江天际流[9]。</p>\n<p class=\"prose\">这首七绝是李白在一个繁华时代的繁华季节，送孟浩然去一个繁华地方的送别诗。诗中第一句的黄鹤楼，是传说中仙人驾鹤升天的地方，这会使人联想到孟浩然也是去人间天堂的广陵（今天的扬州），诗意就更浓了。第二句是千古丽句，写长江两岸杨柳如烟、鲜花似锦的美景，画意又增加了诗情。</p>\n<p class=\"prose\">后两句更是融情于景。第三句表面上写的是孤帆远影，实际上说的是诗人的心已随友人远去了。第四句写的是天际江流，说的是诗人情思悠悠，无穷无尽。所以这是一首诗中有画、画中有诗的杰作。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]黄鹤楼：故址在今湖北省武汉市武昌蛇山的黄鹄矶上，属于长江下游地带，传说三国时期的费祎于此登仙乘黄鹤而去，故称黄鹤楼。孟浩然：李白的朋友。<br>[2]之：到。<br>[3]广陵：即扬州。<br>[4]故人：老朋友，此处指孟浩然。其年龄比李白大，在诗坛上颇具盛名。李白对其非常钦佩，彼此感情深厚，因此称之为“故人”。<br>[5]辞：辞别。<br>[6]烟花：扬州柳絮飘荡和琼花美艳绝伦，这里指扬州绝美的春景。<br>[7]碧空尽：消失在碧蓝的天际。尽：尽头，消失了。碧空：一作“碧山”。<br>[8]唯见：只见。<br>[9]天际流：向天边流去。天际：天边，天边的尽头。</p>", "englishHtml": "<p class=\"prose\">My friend has left the west where towers Yellow Crane<br>For River Town[2]when willow-down and flowers reign.<br>His lessening sail is lost in boundless azure sky,<br>Where I see but the endless River rolling by.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In Wuhan,capital of Hubei Province.<br>[2]Yangzhou in Jiangsu Province.</p>"}, {"num": "018", "zhTitle": "长相思", "enTitle": "Lovesickness", "chinese": "（二首其一）\n长相思，\n在长安。\n络纬[2]秋啼金井阑，\n微霜凄凄簟[3]色寒。\n孤灯不明[4]思欲绝，\n卷帷望月空长叹。\n美人如花隔云端。\n上有青冥[5]之高天，\n下有渌[6]水之波澜。\n天长地远魂飞苦，\n梦魂不到关山难[7]。\n长相思，\n摧心肝！\n《长相思》共两首，都是写相思之作。这一首以秋声秋景起兴，写男子思念女子。所思美人，远在长安。天高地远，关山阻遏，梦魂难越。或以为此诗别有寄托，“美人如花隔云端”含有托兴意味，古代经常用“美人”比喻所追求之理想。而长安这个地点，当时的都城，更是赋予了此诗政治上的寓意。诗意牵涉政治虽然有些含蓄，但仍不乏诗人一贯的豪迈飘逸。\n注释：\n[1]长相思：属乐府《杂曲歌辞》，常以“长相思”三字开头和结尾。\n[2]络纬：昆虫名，又名莎鸡，俗称纺织娘。\n[3]簟：可用于坐卧的竹席。\n[4]不明：作“不寐”，也说“不眠”。\n[5]青冥：青色天空。\n[6]渌：清澈。\n[7]关山难：关山难渡。", "english": "(I)\nI yearn for one\nWho’s in Chang’an[1]\nIn autumn crickets wail beside the golden rail;\nThe first frost,although light,invades the bed’s delight.\nMy lonely lamp burns dull,of longing I would die;\nRolling up screens to view the moon,in vain I sigh.\nMy flower-like Beauty is high\nUp as clouds in the sky.\nAbove,the boundless heaven blue is seen;\nBelow,the endless river rolls its billows green.\nMy soul can’t fly o’er sky so vast nor earth so wide;\nIn dreams I can’t go through mountain pass to her side.\nWe are so far apart,\nThe yearning breaks my heart.\n注释：\n[1]The Tang capital.", "poemType": "七言古诗", "chineseHtml": "<p class=\"poem-lines\">（二首其一）长相思，<br>在长安。<br>络纬[2]秋啼金井阑，<br>微霜凄凄簟[3]色寒。<br>孤灯不明[4]思欲绝，<br>卷帷望月空长叹。<br>美人如花隔云端。<br>上有青冥[5]之高天，<br>下有渌[6]水之波澜。<br>天长地远魂飞苦，<br>梦魂不到关山难[7]。<br>长相思，<br>摧心肝！</p>\n<p class=\"prose\">《长相思》共两首，都是写相思之作。这一首以秋声秋景起兴，写男子思念女子。所思美人，远在长安。天高地远，关山阻遏，梦魂难越。或以为此诗别有寄托，“美人如花隔云端”含有托兴意味，古代经常用“美人”比喻所追求之理想。而长安这个地点，当时的都城，更是赋予了此诗政治上的寓意。</p>\n<p class=\"prose\">诗意牵涉政治虽然有些含蓄，但仍不乏诗人一贯的豪迈飘逸。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]长相思：属乐府《杂曲歌辞》，常以“长相思”三字开头和结尾。<br>[2]络纬：昆虫名，又名莎鸡，俗称纺织娘。<br>[3]簟：可用于坐卧的竹席。<br>[4]不明：作“不寐”，也说“不眠”。<br>[5]青冥：青色天空。<br>[6]渌：清澈。<br>[7]关山难：关山难渡。</p>", "englishHtml": "<p class=\"poem-lines\">(I)<br>I yearn for one</p>\n<p class=\"prose\">Who’s in Chang’an[1]<br>In autumn crickets wail beside the golden rail;<br>The first frost,although light,invades the bed’s delight.<br>My lonely lamp burns dull,of longing I would die;<br>Rolling up screens to view the moon,in vain I sigh.<br>My flower-like Beauty is high<br>Up as clouds in the sky.<br>Above,the boundless heaven blue is seen;<br>Below,the endless river rolls its billows green.<br>My soul can’t fly o’er sky so vast nor earth so wide;<br>In dreams I can’t go through mountain pass to her side.<br>We are so far apart,<br>The yearning breaks my heart.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The Tang capital.</p>"}, {"num": "019", "zhTitle": "长相思", "enTitle": "Lovesickness", "chinese": "（二首其二）\n日色欲尽花含烟，\n月明如素[1]愁不眠。\n赵瑟[2]初停凤凰柱，\n蜀琴[3]欲奏鸳鸯弦。\n此曲有意无人传，\n愿随春风寄燕然[4]。\n忆君迢迢隔青天。\n昔时横波[5]目，\n今作流泪泉。\n不信妾肠断，\n归来看取明镜前！\n这一首写女子对从征戍边的丈夫的思念。作为艺术创新，诗人打破了以“长相思”一语发端的固定格式。开篇虽是春夜春景，相思之愁苦却不减反增。女主人公鼓瑟弹琴，寄思念之情于音律，然思念成空，泪如泉涌，结尾悠远绵长。\n注释：\n[1]素：洁白的绢。\n[2]赵瑟：指弦乐器，相传古代赵国人擅长奏瑟。\n[3]蜀琴：指弦乐器，古人诗中提及蜀琴俱是佳琴。\n[4]燕然：山名，即杭爱山，位于今蒙古人民共和国境内。此处泛指塞北地区。\n[5]横波：指眼睛如横波一般，非常晶莹美丽。", "english": "(II)\nFlowers exhale thin mist when daylight fades away;\nThe sleepless feel sad to see the moon shed silken ray.\nMy harp on phoenix-holder has just become mute,\nI’ll try to play upon lovebird strings of my lute.\nMy song’s a message.\nWho will carry it to you?\nI’d ask spring wind to bear it up to the frontiers.\nBetween you and me there is the boundless blue sky.\nDo you remember my wave-like eyes of days gone by?\nNow they become a spring of tears.\nIf you do not believe my heart is broken,alas!\nCome back and look into my bright mirror of brass!", "poemType": "七言古诗", "chineseHtml": "<p class=\"poem-lines\">（二首其二）<br>日色欲尽花含烟，<br>月明如素[1]愁不眠。<br>赵瑟[2]初停凤凰柱，<br>蜀琴[3]欲奏鸳鸯弦。<br>此曲有意无人传，<br>愿随春风寄燕然[4]。<br>忆君迢迢隔青天。<br>昔时横波[5]目，<br>今作流泪泉。<br>不信妾肠断，<br>归来看取明镜前！</p>\n<p class=\"prose\">这一首写女子对从征戍边的丈夫的思念。作为艺术创新，诗人打破了以“长相思”一语发端的固定格式。开篇虽是春夜春景，相思之愁苦却不减反增。女主人公鼓瑟弹琴，寄思念之情于音律，然思念成空，泪如泉涌，结尾悠远绵长。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]素：洁白的绢。<br>[2]赵瑟：指弦乐器，相传古代赵国人擅长奏瑟。<br>[3]蜀琴：指弦乐器，古人诗中提及蜀琴俱是佳琴。<br>[4]燕然：山名，即杭爱山，位于今蒙古人民共和国境内。此处泛指塞北地区。<br>[5]横波：指眼睛如横波一般，非常晶莹美丽。</p>", "englishHtml": "<p class=\"poem-lines\">(II)</p>\n<p class=\"prose\">Flowers exhale thin mist when daylight fades away;<br>The sleepless feel sad to see the moon shed silken ray.<br>My harp on phoenix-holder has just become mute,<br>I’ll try to play upon lovebird strings of my lute.<br>My song’s a message.<br>Who will carry it to you?<br>I’d ask spring wind to bear it up to the frontiers.<br>Between you and me there is the boundless blue sky.<br>Do you remember my wave-like eyes of days gone by?<br>Now they become a spring of tears.<br>If you do not believe my heart is broken,alas!<br>Come back and look into my bright mirror of brass!</p>"}, {"num": "020", "zhTitle": "登新平楼", "enTitle": "Ascending Xinping Tower", "chinese": "去国[2]登兹楼，\n怀归伤暮秋。\n天长落日远，\n水净寒波流。\n秦云[3]起岭树，\n胡雁[4]飞沙洲。\n苍苍[5]几万里，\n目极[6]令人愁。\n此诗作于李白第一次离开长安时。开元十八年（730），李白在长安自夏至秋，谋求仕途未成，遂于暮秋时节从长安出发踏上了西游的道路。途经邠地时，诗人登上了矗立于新平原上的城楼，四周眺望，触景生情。邠地暮秋的景象，使人百感交集。诗人通过景物渲染，抒发了寓居他乡壮志难酬的孤独凄凉之感。“苍苍几万里，目极令人愁”，诗人极目环眺，视力所及，不知安身立命何处。都城虽然并不遥远，但对于“愿做帝王辅弼”的李白来说却是遥不可及的，所有这些，千头万绪，不觉无边愁绪油然而生。\n注释：\n[1]新平：唐朝郡名，又是县名。新平郡即邠州，治新平县。\n[2]去国：离开国都。\n[3]秦云：秦地的云。新平等地先秦时属秦国。\n[4]胡雁：北方的大雁。胡，古代北方少数民族的通称，这里借指北方地区。\n[5]苍苍：一片深青色，形容旷远苍茫的样子。\n[6]目极：指向远处眺望。", "english": "Leaving the capital,I climb this tower.\nCan I return home like late autumn flower?\nThe sky is vast,the setting sun is far;\nThe water clear,the waves much colder are.\nClouds rise above the western-mountain trees;\nO’er river dunes fly south-going wild geese.\nThe boundless land outspread’neath gloomy skies.\nHow gloomy I feel while I strain my eyes!\n注释：\n[1]In present-day Shaanxi Province.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">去国[2]登兹楼，<br>怀归伤暮秋。<br>天长落日远，<br>水净寒波流。<br>秦云[3]起岭树，<br>胡雁[4]飞沙洲。<br>苍苍[5]几万里，<br>目极[6]令人愁。</p>\n<p class=\"prose\">此诗作于李白第一次离开长安时。开元十八年（730），李白在长安自夏至秋，谋求仕途未成，遂于暮秋时节从长安出发踏上了西游的道路。途经邠地时，诗人登上了矗立于新平原上的城楼，四周眺望，触景生情。邠地暮秋的景象，使人百感交集。</p>\n<p class=\"prose\">诗人通过景物渲染，抒发了寓居他乡壮志难酬的孤独凄凉之感。“苍苍几万里，目极令人愁”，诗人极目环眺，视力所及，不知安身立命何处。都城虽然并不遥远，但对于“愿做帝王辅弼”的李白来说却是遥不可及的，所有这些，千头万绪，不觉无边愁绪油然而生。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]新平：唐朝郡名，又是县名。新平郡即邠州，治新平县。<br>[2]去国：离开国都。<br>[3]秦云：秦地的云。新平等地先秦时属秦国。<br>[4]胡雁：北方的大雁。胡，古代北方少数民族的通称，这里借指北方地区。<br>[5]苍苍：一片深青色，形容旷远苍茫的样子。<br>[6]目极：指向远处眺望。</p>", "englishHtml": "<p class=\"prose\">Leaving the capital,I climb this tower.<br>Can I return home like late autumn flower?<br>The sky is vast,the setting sun is far;<br>The water clear,the waves much colder are.<br>Clouds rise above the western-mountain trees;<br>O’er river dunes fly south-going wild geese.<br>The boundless land outspread’neath gloomy skies.<br>How gloomy I feel while I strain my eyes!</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]In present-day Shaanxi Province.</p>"}, {"num": "021", "zhTitle": "蜀道难", "enTitle": "Hard Is the Road to Shu", "chinese": "噫吁嚱[2]，\n危乎高哉！\n蜀道之难，\n难于上青天！\n蚕丛及鱼凫[3]，\n开国何茫然[4]！\n尔来[5]四万八千岁[6]，\n不与秦塞[7]通人烟[8]。\n西当[9]太白有鸟道[10]，\n可以横绝[11]峨眉巅。\n地崩山摧壮士死[12]，\n然后天梯[13]石栈[14]相钩连。\n上有六龙回日[15]之高标，\n下有冲波[16]逆折[17]之回川[18]。\n黄鹤之飞尚不得过，\n猿猱[19]欲度愁攀援。\n青泥[20]何盘盘[21]，\n百步九折[22]萦[23]岩峦[24]。\n扪参历井[25]仰胁息[26]，\n以手抚膺[27]坐[28]长叹。\n问君西游何时还？\n畏途[29]巉岩[30]不可攀。\n但见悲鸟号古木，\n雄飞雌从绕林间。\n又闻子规啼夜月，\n愁空山。\n蜀道之难，\n难于上青天，\n使人听此凋朱颜。\n连峰去[31]天不盈尺，\n枯松倒挂倚绝壁。\n飞湍[32]瀑流争喧豗[33]，\n砯崖[34]转石万壑雷。\n其险也如此，\n嗟尔远道之人胡为[35]乎来哉！\n剑阁峥嵘而崔嵬[36]，\n一夫当关，\n万夫莫开。\n所守或匪亲[37]，\n化为狼与豺。\n朝避猛虎，\n夕避长蛇，\n磨牙吮血，\n杀人如麻。\n锦城[38]虽云乐，\n不如早还家。\n蜀道之难，难于上青天，\n侧身西望长咨嗟[39]！\n《蜀道难》是李白首屈一指的名篇，大约是公元730年他第一次到长安时写的。如果说《长相思》是借美人写慕君之情，那《蜀道难》就是借山川之景来抒写报国无门之心了。蜀道指的是上长安的青云路，所以诗一开始，诗人长吁短叹，先用神话传说写开国之难。接着写山川险峻，连黄鹤都不能飞过太白峰，暗示自己不能青云直上。又写青泥岭盘旋曲折，暗示仕途艰难，诗人只有抚胸长叹。再借“问君”引出旅愁：“连峰去天不盈尺”，形容山峰之高；“枯松倒挂倚绝壁”，衬托绝壁之险。然后由静入动，写水石激荡、山谷轰鸣。最后写到剑阁，其实是借喻朝廷要津，所守非人，必为祸害。朝避猛虎，夕避长蛇，也是借喻朝廷上下的恶势力。所以这是一首借景写情的政治抒怀诗。\n注释：\n[1]蜀道难：南朝乐府旧题，属《相和歌·瑟调曲》。\n[2]噫（yī）吁（xū）嚱（xī）：惊叹声，蜀方言，表示吃惊。\n[3]蚕丛、鱼凫（fú）：传说是古蜀国两位国王之名，但无从取证。\n[4]何茫然：何：多么。茫然：完全不知道的样子。指对传说中古代历史悠远难详，不甚了解。\n[5]尔来：自那时以来。\n[6]四万八千岁：表示时间漫长，此处手法夸张。\n[7]秦塞（sài）：指秦地。秦地四周山川险阻，故称“四塞之地”。\n[8]通人烟：人员来往。\n[9]西当：在西边的。当：在。\n[10]鸟道：指连绵高山间的隙口，只有鸟能飞过，人迹不能至此。\n[11]横绝：横越。\n[12]地崩山摧壮士死：《华阳国志·蜀志》：相传秦惠王想征服蜀国，知道蜀王好色，答应送给他五个美女。蜀王派五位壮士去接人。回到梓潼的时候，看见一条大蛇进入穴中，一位壮士抓住了它的尾巴，其余四人也来相助，用力往外拽。不多时，山崩地裂，壮士和美女都被压死。\n[13]天梯：异常陡峭的山路。\n[14]石栈（zhàn）：栈道。\n[15]六龙回日：《淮南子》注云：“日乘车，驾以六龙。羲和御之。日至此面而薄于虞渊，羲和至此而回六螭。”，意思就是传说中的羲和驾驶着六龙之车（即太阳）到此处便迫近虞渊（传说中的日落处）。\n[16]冲波：水流冲击腾起的波浪，这里指激流。\n[17]逆折：水流回旋。\n[18]回川：有漩涡的河流。\n[19]猿猱（náo）：蜀山中最善攀援的猴类。\n[20]青泥：青泥岭，在今甘肃徽县南，陕西略阳县北。\n[21]盘盘：形容回旋曲折的样子。\n[22] 百步九折：形容道路极其曲折。\n[23] 萦（yínɡ）：盘绕。\n[24] 岩峦：山峰。\n[25] 扪（mén）参（shēn）历井：参、井是二星宿名。扪，用手摸。历，经过。\n[26] 胁息：屏住呼吸。\n[27] 膺（yīnɡ）：胸。\n[28] 坐：徒，空。\n[29] 畏途：可怕的路途。\n[30] 巉（chán）岩：指山壁高耸陡峭。\n[31]去：距离。\n[32]飞湍（tuān）：飞奔而下的急流\n[33]喧豗（huī）：喧闹声，这里指急流和瀑布撞击发出的巨大声响。\n[34]砯（pīng）崖：水与石撞击的巨响。砯，急流冲击石壁发出的声响，这里用作动词，冲击。\n[35]胡为：为什么。\n[36]峥嵘、崔（cuī）嵬（wéi）：都是形容山势雄伟高峻的样子。\n[37]或匪（fěi）亲：假使不是值得信赖的人。匪，同“非”。\n[38]锦城：古代成都以产棉闻名，朝廷曾经在此设官，收购棉织品，故名。\n[39]咨（zī）嗟：叹息。", "english": "Oho!Behold!\nHow steep!\nHow high!\nThe road to Shu is harder than to climb to the sky.\nSince the two pioneers\nPut the kingdom in order,\nHave passed forty-eight thousand years,\nAnd few have tried to pass its border.\nThere’s a bird track o’er Great White Mountain to the west,\nWhich cuts through Mountain Eyebrows by the crest.\nThe crest crumbled,five serpent-killing heroes slain,\nAlong the cliffs a rocky path was hacked then.\nAbove stand peaks too high for the sun to pass o’er;\nBelow the torrents run back and forth,churn and roar.\nEven the Golden Crane can’t fly across;\nHow to climb over,gibbons are at a loss.\nWhat tortuous mountain path Green Mud Ridge faces!\nAround the top we turn nine turns each hundred paces.\nLooking up breathless,I can touch the stars nearby;\nBeating my breast,I sink aground with long,long sigh.\nWhen will you come back from this journey to the west?\nHow can you climb up dangerous path and mountain crest,\nWhere you can hear on ancient trees but sad birds wail\nAnd see the female birds fly,followed by the male?\nAnd hear home-going cuckoos weep\nBeneath the moon in mountains deep?\nThe road to Shu is harder than to climb to the sky,\nOn hearing this,your cheeks would lose their rosy dye.\nBetween the sky and peaks there is not a foot’s space,\nAnd ancient pines hang,head down,from the cliff’s surface,\nAnd cataracts and torrents dash on boulders under,\nRoaring like thousands of echoes of thunder.\nSo dangerous these places are,\nAlas!Why should you come here from afar?\nRugged is the path between the cliffs so steep and high,\nGuarded by one\nAnd forced by none.\nDisloyal guards\nWould turn wolves and pards.\nMan-eating tigers at daybreak\nAnd at dusk blood-sucking long snake.\nOne may make merry in the Town of Silk[2],I know,\nBut I would rather homeward go.\nThe road to Shu is harder than to climb to the sky,\nI’d turn and westward look with long,long sigh.\n注释：\n[1]Present-day Sichuan Province.\n[2]Chengdu,capital of Sichuan Province.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">噫吁嚱[2]，<br>危乎高哉！<br>蜀道之难，<br>难于上青天！<br>蚕丛及鱼凫[3]，<br>开国何茫然[4]！<br>尔来[5]四万八千岁[6]，<br>不与秦塞[7]通人烟[8]。<br>西当[9]太白有鸟道[10]，<br>可以横绝[11]峨眉巅。<br>地崩山摧壮士死[12]，<br>然后天梯[13]石栈[14]相钩连。<br>上有六龙回日[15]之高标，</p>\n<p class=\"prose\">下有冲波[16]逆折[17]之回川[18]。黄鹤之飞尚不得过，猿猱[19]欲度愁攀援。青泥[20]何盘盘[21]，百步九折[22]萦[23]岩峦[24]。扪参历井[25]仰胁息[26]，以手抚膺[27]坐[28]长叹。问君西游何时还？</p>\n<p class=\"prose\">畏途[29]巉岩[30]不可攀。但见悲鸟号古木，雄飞雌从绕林间。又闻子规啼夜月，愁空山。蜀道之难，难于上青天，使人听此凋朱颜。连峰去[31]天不盈尺，枯松倒挂倚绝壁。飞湍[32]瀑流争喧豗[33]，砯崖[34]转石万壑雷。</p>\n<p class=\"prose\">其险也如此，嗟尔远道之人胡为[35]乎来哉！剑阁峥嵘而崔嵬[36]，一夫当关，万夫莫开。所守或匪亲[37]，化为狼与豺。朝避猛虎，夕避长蛇，磨牙吮血，杀人如麻。锦城[38]虽云乐，不如早还家。蜀道之难，难于上青天，侧身西望长咨嗟[39]！</p>\n<p class=\"prose\">《蜀道难》是李白首屈一指的名篇，大约是公元730年他第一次到长安时写的。如果说《长相思》是借美人写慕君之情，那《蜀道难》就是借山川之景来抒写报国无门之心了。蜀道指的是上长安的青云路，所以诗一开始，诗人长吁短叹，先用神话传说写开国之难。</p>\n<p class=\"prose\">接着写山川险峻，连黄鹤都不能飞过太白峰，暗示自己不能青云直上。又写青泥岭盘旋曲折，暗示仕途艰难，诗人只有抚胸长叹。再借“问君”引出旅愁：“连峰去天不盈尺”，形容山峰之高；“枯松倒挂倚绝壁”，衬托绝壁之险。然后由静入动，写水石激荡、山谷轰鸣。</p>\n<p class=\"prose\">最后写到剑阁，其实是借喻朝廷要津，所守非人，必为祸害。朝避猛虎，夕避长蛇，也是借喻朝廷上下的恶势力。所以这是一首借景写情的政治抒怀诗。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]蜀道难：南朝乐府旧题，属《相和歌·瑟调曲》。<br>[2]噫（yī）吁（xū）嚱（xī）：惊叹声，蜀方言，表示吃惊。<br>[3]蚕丛、鱼凫（fú）：传说是古蜀国两位国王之名，但无从取证。<br>[4]何茫然：何：多么。茫然：完全不知道的样子。指对传说中古代历史悠远难详，不甚了解。<br>[5]尔来：自那时以来。<br>[6]四万八千岁：表示时间漫长，此处手法夸张。<br>[7]秦塞（sài）：指秦地。秦地四周山川险阻，故称“四塞之地”。<br>[8]通人烟：人员来往。<br>[9]西当：在西边的。当：在。<br>[10]鸟道：指连绵高山间的隙口，只有鸟能飞过，人迹不能至此。<br>[11]横绝：横越。<br>[12]地崩山摧壮士死：《华阳国志·蜀志》：相传秦惠王想征服蜀国，知道蜀王好色，答应送给他五个美女。蜀王派五位壮士去接人。回到梓潼的时候，看见一条大蛇进入穴中，一位壮士抓住了它的尾巴，其余四人也来相助，用力往外拽。不多时，山崩地裂，壮士和美女都被压死。<br>[13]天梯：异常陡峭的山路。<br>[14]石栈（zhàn）：栈道。<br>[15]六龙回日：《淮南子》注云：“日乘车，驾以六龙。羲和御之。日至此面而薄于虞渊，羲和至此而回六螭。”，意思就是传说中的羲和驾驶着六龙之车（即太阳）到此处便迫近虞渊（传说中的日落处）。<br>[16]冲波：水流冲击腾起的波浪，这里指激流。<br>[17]逆折：水流回旋。<br>[18]回川：有漩涡的河流。<br>[19]猿猱（náo）：蜀山中最善攀援的猴类。<br>[20]青泥：青泥岭，在今甘肃徽县南，陕西略阳县北。<br>[21]盘盘：形容回旋曲折的样子。<br>[22] 百步九折：形容道路极其曲折。<br>[23] 萦（yínɡ）：盘绕。<br>[24] 岩峦：山峰。<br>[25] 扪（mén）参（shēn）历井：参、井是二星宿名。扪，用手摸。历，经过。<br>[26] 胁息：屏住呼吸。<br>[27] 膺（yīnɡ）：胸。<br>[28] 坐：徒，空。<br>[29] 畏途：可怕的路途。<br>[30] 巉（chán）岩：指山壁高耸陡峭。<br>[31]去：距离。<br>[32]飞湍（tuān）：飞奔而下的急流<br>[33]喧豗（huī）：喧闹声，这里指急流和瀑布撞击发出的巨大声响。<br>[34]砯（pīng）崖：水与石撞击的巨响。砯，急流冲击石壁发出的声响，这里用作动词，冲击。<br>[35]胡为：为什么。<br>[36]峥嵘、崔（cuī）嵬（wéi）：都是形容山势雄伟高峻的样子。<br>[37]或匪（fěi）亲：假使不是值得信赖的人。匪，同“非”。<br>[38]锦城：古代成都以产棉闻名，朝廷曾经在此设官，收购棉织品，故名。<br>[39]咨（zī）嗟：叹息。</p>", "englishHtml": "<p class=\"poem-lines\">Oho!Behold!<br>How steep!<br>How high!</p>\n<p class=\"prose\">The road to Shu is harder than to climb to the sky.<br>Since the two pioneers<br>Put the kingdom in order,<br>Have passed forty-eight thousand years,<br>And few have tried to pass its border.<br>There’s a bird track o’er Great White Mountain to the west,<br>Which cuts through Mountain Eyebrows by the crest.<br>The crest crumbled,five serpent-killing heroes slain,<br>Along the cliffs a rocky path was hacked then.<br>Above stand peaks too high for the sun to pass o’er;<br>Below the torrents run back and forth,churn and roar.<br>Even the Golden Crane can’t fly across;<br>How to climb over,gibbons are at a loss.<br>What tortuous mountain path Green Mud Ridge faces!<br>Around the top we turn nine turns each hundred paces.<br>Looking up breathless,I can touch the stars nearby;<br>Beating my breast,I sink aground with long,long sigh.<br>When will you come back from this journey to the west?<br>How can you climb up dangerous path and mountain crest,<br>Where you can hear on ancient trees but sad birds wail<br>And see the female birds fly,followed by the male?<br>And hear home-going cuckoos weep<br>Beneath the moon in mountains deep?<br>The road to Shu is harder than to climb to the sky,<br>On hearing this,your cheeks would lose their rosy dye.<br>Between the sky and peaks there is not a foot’s space,<br>And ancient pines hang,head down,from the cliff’s surface,<br>And cataracts and torrents dash on boulders under,<br>Roaring like thousands of echoes of thunder.<br>So dangerous these places are,<br>Alas!Why should you come here from afar?<br>Rugged is the path between the cliffs so steep and high,<br>Guarded by one<br>And forced by none.<br>Disloyal guards<br>Would turn wolves and pards.<br>Man-eating tigers at daybreak<br>And at dusk blood-sucking long snake.<br>One may make merry in the Town of Silk[2],I know,<br>But I would rather homeward go.<br>The road to Shu is harder than to climb to the sky,<br>I’d turn and westward look with long,long sigh.</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Sichuan Province.<br>[2]Chengdu,capital of Sichuan Province.</p>"}, {"num": "022", "zhTitle": "行路难", "enTitle": "Hard Is the Way of the World", "chinese": "（三首其一）\n金樽清酒斗十千[1]，\n玉盘珍羞[2]直[3]万钱。\n停杯投箸[4]不能食，\n拔剑四顾心茫然。\n欲渡黄河冰塞川，\n将登太行雪满山。\n闲来垂钓碧溪上，\n忽复乘舟梦日边[5]。\n行路难，\n行路难，\n多歧路，\n今安在？\n长风破浪[6]会有时，\n直挂云帆[7]济沧海。\n《行路难》共三首，大约是李白第一次离开长安时写的，这是其中的第一首。如果说《蜀道难》是借山川险阻来写人生道路的艰难，那么《行路难》就是借历史人物的遭遇来抒发宣泄自己的苦闷。开头两句引用了曹植的“美酒斗十千”，说明自己是用黄金买醉，一如曹植的郁郁不得志。接着两句引用了鲍照《拟行路难》的“对案不能食，拔剑击柱长叹息”，反映自己内心的矛盾，这是第一层波澜。接下去又从地理上写到大河冰冻、太行雪封，寸步难行，诗人不得不做退隐的打算，于是又引用了姜尚80岁钓鱼的典故，这是第二层波澜。下一句再引用伊尹梦见乘舟绕过日边，后来成了商代丞相的故事，自己的情绪也转为高昂，这是第三层波澜。最后，诗人摆脱了歧路彷徨的苦闷，发出了乘长风破万里浪，横渡沧海到达理想的彼岸的呼声。这样一波三折，表现了李白浪漫主义的乐观精神。\n注释：\n[1]斗十千：一斗值十千钱（即万钱），形容美酒价格昂贵。\n[2]珍羞：珍稀的菜肴。羞，同“馐”，美食。\n[3]直：通“值”，价值。\n[4]箸（zhù）：筷子。\n[5]闲来垂钓碧溪上，忽复乘舟梦日边：表示诗人自己仍对从政抱有期待。这两句暗用典故：姜太公吕尚曾在渭水的磻溪上钓鱼，得遇周文王，助周灭商；伊尹曾梦见自己乘船从日月旁边经过，后被商汤聘请，助商灭夏。\n[6]长风破浪：引喻为实现政治理想。\n[7云帆：高悬的船帆。船在海里航行，天水相接，船帆好似在云雾之中忽隐忽现。", "english": "(I)\nPure wine in golden cup costs ten thousand coppers,good!\nChoice dish in a jade plate is worth as much,nice food!\nPushing aside my cup and chopsticks,I can’t eat;\nDrawing my sword and looking round,I stamp my feet.\nI can’t cross Yellow River:ice has stopped its flow;\nI can’t climb Mount Taihang:the sky is blind with snow.\nI can but poise a fishing pole beside a stream\nOr set sail for the sun like a sage in a dream.\nHard is the way,\nHard is the way.\nDon’t go astray!\nWhither today?\nA time will come to ride the wind and cleave the waves,\nI’ll set my cloud-white sail and cross the sea which raves.", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">（三首其一）<br>金樽清酒斗十千[1]，<br>玉盘珍羞[2]直[3]万钱。<br>停杯投箸[4]不能食，<br>拔剑四顾心茫然。<br>欲渡黄河冰塞川，<br>将登太行雪满山。<br>闲来垂钓碧溪上，<br>忽复乘舟梦日边[5]。<br>行路难，<br>行路难，<br>多歧路，<br>今安在？<br>长风破浪[6]会有时，<br>直挂云帆[7]济沧海。</p>\n<p class=\"prose\">《行路难》共三首，大约是李白第一次离开长安时写的，这是其中的第一首。如果说《蜀道难》是借山川险阻来写人生道路的艰难，那么《行路难》就是借历史人物的遭遇来抒发宣泄自己的苦闷。开头两句引用了曹植的“美酒斗十千”，说明自己是用黄金买醉，一如曹植的郁郁不得志。</p>\n<p class=\"prose\">接着两句引用了鲍照《拟行路难》的“对案不能食，拔剑击柱长叹息”，反映自己内心的矛盾，这是第一层波澜。接下去又从地理上写到大河冰冻、太行雪封，寸步难行，诗人不得不做退隐的打算，于是又引用了姜尚80岁钓鱼的典故，这是第二层波澜。</p>\n<p class=\"prose\">下一句再引用伊尹梦见乘舟绕过日边，后来成了商代丞相的故事，自己的情绪也转为高昂，这是第三层波澜。最后，诗人摆脱了歧路彷徨的苦闷，发出了乘长风破万里浪，横渡沧海到达理想的彼岸的呼声。这样一波三折，表现了李白浪漫主义的乐观精神。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]斗十千：一斗值十千钱（即万钱），形容美酒价格昂贵。<br>[2]珍羞：珍稀的菜肴。羞，同“馐”，美食。<br>[3]直：通“值”，价值。<br>[4]箸（zhù）：筷子。<br>[5]闲来垂钓碧溪上，忽复乘舟梦日边：表示诗人自己仍对从政抱有期待。这两句暗用典故：姜太公吕尚曾在渭水的磻溪上钓鱼，得遇周文王，助周灭商；伊尹曾梦见自己乘船从日月旁边经过，后被商汤聘请，助商灭夏。<br>[6]长风破浪：引喻为实现政治理想。<br>[7云帆：高悬的船帆。船在海里航行，天水相接，船帆好似在云雾之中忽隐忽现。</p>", "englishHtml": "<p class=\"poem-lines\">(I)</p>\n<p class=\"prose\">Pure wine in golden cup costs ten thousand coppers,good!<br>Choice dish in a jade plate is worth as much,nice food!<br>Pushing aside my cup and chopsticks,I can’t eat;<br>Drawing my sword and looking round,I stamp my feet.<br>I can’t cross Yellow River:ice has stopped its flow;<br>I can’t climb Mount Taihang:the sky is blind with snow.<br>I can but poise a fishing pole beside a stream<br>Or set sail for the sun like a sage in a dream.<br>Hard is the way,<br>Hard is the way.<br>Don’t go astray!<br>Whither today?<br>A time will come to ride the wind and cleave the waves,<br>I’ll set my cloud-white sail and cross the sea which raves.</p>"}, {"num": "023", "zhTitle": "行路难", "enTitle": "Hard Is the Way of the World", "chinese": "（三首其二）\n大道如青天，\n我独不得出。\n羞逐长安社[1]中儿，\n赤鸡白狗赌梨栗。\n弹剑[2]作歌奏苦声，\n曳裾王门不称情。\n淮阴市井笑韩信，\n汉朝公卿忌贾生[3]。\n李白是一个很有才华的诗人，但他做不了一个政客。这首诗一开头陡起壁立，让胸中的万千感慨喷涌而出，也为下文埋下伏笔。原来诗人在政局中陷入困顿，明明大道通天，唯独自己却找不到出路，市井中斗鸡赌狗的泼皮，尚能谋得一官半职。其实诗人倒不是摸不到门路，而是不屑如此，他声明自己羞于与社中小儿为伍。至于达官贵人，又并不把他当一回事，使他像冯谖一样感到不能忍受。一般社会上的人对他嘲笑、\n注释：\n[1]社：古时二十五家为一社。\n[2]弹剑：战国时，齐公子孟尝君门下食客冯谖曾屡次弹剑作歌，以抒发内心抑郁不满之情。\n[3]贾生：汉初洛阳贾谊，曾上书汉文帝，劝其改制兴礼，但却受到当时朝臣反对。", "english": "(II)\nThe way is broad like the blue sky,\nBut no way out before my eye.\nI am ashamed to follow those who have no guts,\nGambling on fighting cocks and dogs for pears and nuts.\nFeng would go homeward way,having no fish to eat;\nZhou did not think to bow to noblemen was meet.\nGeneral Han was mocked in the marketplace;\nThe brilliant scholar Jia was banished in disgrace.\n轻视，当权者则忌妒、加以打击。“弹剑作歌奏苦声，曳裾王门不称情。淮阴市井笑韩信，汉朝公卿忌贾生。”是写他的不得志。诗人追求的是理想的君臣关系，即君明臣贤。他深情歌颂当初燕国君臣的互相尊重和信任。而当权阶级日渐昏庸腐朽，所以诗人发出了愤怒而又无奈的抗议：行路难，归去来！\n君不见，\n昔时燕家重郭隗，\n拥篲[1]折节无嫌猜。\n剧辛乐毅感恩分，\n输肝剖胆效英才。\n昭王白骨萦蔓草，\n谁人更扫黄金台？\n行路难，\n归去来[2]！\nHave you not heard of King of Yan in days gone by,\nWho venerated talents and built Terrace high\nOn which he offered gold to gifted men\nAnd stooped low and swept the floor to welcome them?\nGrateful,Ju Xin and Yue Yi came then\nAnd served him heart and soul,both full of stratagem.\nThe King’s bones were now buried,who would sweep the floor\nOf the Gold Terrace any more?\nHard is the way.\nGo back without delay!\n注释：\n[1]拥篲：燕昭王亲自扫路，为防灰尘飞扬，用衣袖挡帚，以礼迎贤士邹衍。\n[2]归去来：指隐居。语出东晋陶渊明《归去来辞》。", "poemType": "七言律诗", "chineseHtml": "<p class=\"poem-lines\">（三首其二）<br>大道如青天，<br>我独不得出。<br>羞逐长安社[1]中儿，<br>赤鸡白狗赌梨栗。<br>弹剑[2]作歌奏苦声，<br>曳裾王门不称情。<br>淮阴市井笑韩信，<br>汉朝公卿忌贾生[3]。</p>\n<p class=\"prose\">李白是一个很有才华的诗人，但他做不了一个政客。这首诗一开头陡起壁立，让胸中的万千感慨喷涌而出，也为下文埋下伏笔。原来诗人在政局中陷入困顿，明明大道通天，唯独自己却找不到出路，市井中斗鸡赌狗的泼皮，尚能谋得一官半职。其实诗人倒不是摸不到门路，而是不屑如此，他声明自己羞于与社中小儿为伍。</p>\n<p class=\"prose\">至于达官贵人，又并不把他当一回事，使他像冯谖一样感到不能忍受。一般社会上的人对他嘲笑、</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]社：古时二十五家为一社。<br>[2]弹剑：战国时，齐公子孟尝君门下食客冯谖曾屡次弹剑作歌，以抒发内心抑郁不满之情。<br>[3]贾生：汉初洛阳贾谊，曾上书汉文帝，劝其改制兴礼，但却受到当时朝臣反对。</p>", "englishHtml": "<p class=\"poem-lines\">(II)</p>\n<p class=\"prose\">The way is broad like the blue sky,But no way out before my eye.I am ashamed to follow those who have no guts,Gambling on fighting cocks and dogs for pears and nuts.Feng would go homeward way,having no fish to eat;</p>\n<p class=\"prose\">Zhou did not think to bow to noblemen was meet.General Han was mocked in the marketplace;The brilliant scholar Jia was banished in disgrace.轻视，当权者则忌妒、加以打击。</p>\n<p class=\"prose\">“弹剑作歌奏苦声，曳裾王门不称情。淮阴市井笑韩信，汉朝公卿忌贾生。”是写他的不得志。诗人追求的是理想的君臣关系，即君明臣贤。他深情歌颂当初燕国君臣的互相尊重和信任。而当权阶级日渐昏庸腐朽，所以诗人发出了愤怒而又无奈的抗议：行路难，归去来！</p>\n<p class=\"prose\">君不见，昔时燕家重郭隗，拥篲[1]折节无嫌猜。剧辛乐毅感恩分，输肝剖胆效英才。昭王白骨萦蔓草，谁人更扫黄金台？行路难，归去来[2]！</p>\n<p class=\"prose\">Have you not heard of King of Yan in days gone by,Who venerated talents and built Terrace highOn which he offered gold to gifted menAnd stooped low and swept the floor to welcome them?</p>\n<p class=\"prose\">Grateful,Ju Xin and Yue Yi came thenAnd served him heart and soul,both full of stratagem.The King’s bones were now buried,who would sweep the floorOf the Gold Terrace any more?</p>\n<p class=\"prose\">Hard is the way.Go back without delay!</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]拥篲：燕昭王亲自扫路，为防灰尘飞扬，用衣袖挡帚，以礼迎贤士邹衍。<br>[2]归去来：指隐居。语出东晋陶渊明《归去来辞》。</p>"}, {"num": "024", "zhTitle": "行路难", "enTitle": "Hard Is the Way of the World", "chinese": "（三首其三）\n有耳莫洗颍川水，\n有口莫食首阳蕨[1]。\n含光混世贵无名[2]，\n何用孤高比云月？\n吾观自古贤达人，\n功成不退皆殒身。\n子胥[3]既弃吴江上，\n屈原终投湘水滨。\n陆机[4]雄才岂自保？\n李斯[5]税驾苦不早。\n这应是诗人离京时，宽慰自己之作。做人像许由一般孤傲，像伯夷叔齐一样清高，自诩唯有云月可比有什么用呢，做人还须“含光混世”不务虚名。这既是诗人在长安期间得到的经验，也是对时局无奈的喟叹，因为他还未真正出世。诗人先后用伍子胥、屈原、陆机和李斯的事例说明，成功后贪恋名位不肯退隐的都殒丧了自己的性命。诗人或许是觉得，反正最后都要出世，又何必在乎早晚呢。\n注释：\n[1]有口莫食首阳蕨：反用伯夷、叔齐典故。《史记·伯夷列传》：“武王已平殷乱，天下宗周，而伯夷、叔齐耻之，义不食周粟，隐于首阳山，采薇而食之……遂饿死于首阳山。”《索引》：“薇，蕨也。”按薇、蕨本二草，前人误以为一。\n[2]含光混世贵无名：言不露锋芒，随世俯仰之意。贵无名，以无名为贵。\n[3]子胥：伍子胥，春秋末期吴国大夫。\n[4]陆机：西晋文学家。《晋书·陆机传》载：陆机因宦人诬陷而被杀害于军中，临终叹曰：“华亭鹤唳，岂可复闻乎？”\n[5]李斯：秦国统一六国的大功臣，任秦朝丞相，后被杀。", "english": "(III)\nDon’t wash your ears on hearing something you dislike\nNor die of hunger like famous hermits on the Pike!\nLiving without high fame among the motley crowd,\nWhy should one be as lofty as the moon or cloud?\nOf ancient talents who failed to retire,there’s none\nBut came to tragic ending after glory’s won.\nThe head of General Wu was hung o’er city gate;\nIn the river was drowned the Poet Laureate.\nThe highly talented scholar wished in vain\nTo preserve his life to hear the cry of the crane.\n华亭鹤唳讵可闻？\n上蔡苍鹰何足道[1]？\n君不见，\n吴中张翰称达生，\n秋风忽忆江东行[2]。\n且乐生前一杯酒，\n何须身后千载名？\nMinister Li regretted not to have retired\nTo hunt with falcon gray as he had long desired.\nHave you not heard of Zhang Han who resigned,carefree,\nTo go home to eat his perch with high glee?\nEnjoy a cup of wine while you’re alive!\nDo not care if your fame will not survive!\n注释：\n[1]华亭鹤唳讵可闻？上蔡苍鹰何足道：用李斯典故。《史记·李斯列传》：“二世二年七月，具斯五刑，论腰斩咸阳市。斯出狱，与其中子俱执，顾谓其中子曰：‘吾欲与若复牵黄犬俱出上蔡东门逐狡兔，岂可得乎！’”《太平御览》卷九二六：《史记》曰：“李斯临刑，思牵黄犬、臂苍鹰，出上蔡门，不可得矣。”\n[2]秋风忽忆江东行：用张翰典故。《晋书·张翰传》：“张翰，字季鹰，吴郡吴人也。……为大司马东曹掾。……因见秋风起，乃思吴中菰菜、莼羹、鲈鱼脍，曰：‘人生贵得适志，何能羁官数千里，以要名爵乎？’遂命驾而归。……或谓之曰：‘卿乃纵适一时，独不为身后名邪？’答曰：‘使我有身后名，不如即时一杯酒。’时人贵其旷达。”", "poemType": "乐府/古体", "chineseHtml": "<p class=\"poem-lines\">（三首其三）<br>有耳莫洗颍川水，<br>有口莫食首阳蕨[1]。<br>含光混世贵无名[2]，<br>何用孤高比云月？<br>吾观自古贤达人，<br>功成不退皆殒身。<br>子胥[3]既弃吴江上，<br>屈原终投湘水滨。<br>陆机[4]雄才岂自保？<br>李斯[5]税驾苦不早。</p>\n<p class=\"prose\">这应是诗人离京时，宽慰自己之作。做人像许由一般孤傲，像伯夷叔齐一样清高，自诩唯有云月可比有什么用呢，做人还须“含光混世”不务虚名。这既是诗人在长安期间得到的经验，也是对时局无奈的喟叹，因为他还未真正出世。诗人先后用伍子胥、屈原、陆机和李斯的事例说明，成功后贪恋名位不肯退隐的都殒丧了自己的性命。</p>\n<p class=\"prose\">诗人或许是觉得，反正最后都要出世，又何必在乎早晚呢。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]有口莫食首阳蕨：反用伯夷、叔齐典故。《史记·伯夷列传》：“武王已平殷乱，天下宗周，而伯夷、叔齐耻之，义不食周粟，隐于首阳山，采薇而食之……遂饿死于首阳山。”《索引》：“薇，蕨也。”按薇、蕨本二草，前人误以为一。<br>[2]含光混世贵无名：言不露锋芒，随世俯仰之意。贵无名，以无名为贵。<br>[3]子胥：伍子胥，春秋末期吴国大夫。<br>[4]陆机：西晋文学家。《晋书·陆机传》载：陆机因宦人诬陷而被杀害于军中，临终叹曰：“华亭鹤唳，岂可复闻乎？”<br>[5]李斯：秦国统一六国的大功臣，任秦朝丞相，后被杀。</p>", "englishHtml": "<p class=\"poem-lines\">(III)</p>\n<p class=\"prose\">Don’t wash your ears on hearing something you dislike<br>Nor die of hunger like famous hermits on the Pike!<br>Living without high fame among the motley crowd,<br>Why should one be as lofty as the moon or cloud?<br>Of ancient talents who failed to retire,there’s none<br>But came to tragic ending after glory’s won.<br>The head of General Wu was hung o’er city gate;<br>In the river was drowned the Poet Laureate.<br>The highly talented scholar wished in vain<br>To preserve his life to hear the cry of the crane.<br>华亭鹤唳讵可闻？<br>上蔡苍鹰何足道[1]？<br>君不见，<br>吴中张翰称达生，<br>秋风忽忆江东行[2]。<br>且乐生前一杯酒，<br>何须身后千载名？<br>Minister Li regretted not to have retired<br>To hunt with falcon gray as he had long desired.<br>Have you not heard of Zhang Han who resigned,carefree,<br>To go home to eat his perch with high glee?<br>Enjoy a cup of wine while you’re alive!<br>Do not care if your fame will not survive!</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]华亭鹤唳讵可闻？上蔡苍鹰何足道：用李斯典故。《史记·李斯列传》：“二世二年七月，具斯五刑，论腰斩咸阳市。斯出狱，与其中子俱执，顾谓其中子曰：‘吾欲与若复牵黄犬俱出上蔡东门逐狡兔，岂可得乎！’”《太平御览》卷九二六：《史记》曰：“李斯临刑，思牵黄犬、臂苍鹰，出上蔡门，不可得矣。”<br>[2]秋风忽忆江东行：用张翰典故。《晋书·张翰传》：“张翰，字季鹰，吴郡吴人也。……为大司马东曹掾。……因见秋风起，乃思吴中菰菜、莼羹、鲈鱼脍，曰：‘人生贵得适志，何能羁官数千里，以要名爵乎？’遂命驾而归。……或谓之曰：‘卿乃纵适一时，独不为身后名邪？’答曰：‘使我有身后名，不如即时一杯酒。’时人贵其旷达。”</p>"}, {"num": "025", "zhTitle": "送友人入蜀", "enTitle": "To a Friend Departing for Shu", "chinese": "见说蚕丛路[1]，\n崎岖不易行。\n山从人面起，\n云傍马头生[2]。\n芳树笼秦栈[3]，\n春流[4]绕蜀城。\n升沉[5]应已定，\n不必问君平[6]。\n这首诗是天宝二年（743）李白在长安送友人入蜀时所作，是一首以描绘蜀道山川的奇美而著称的抒情诗。开篇不同于《蜀道难》，而是语重心长，娓娓道来，欲语还休，情感真挚而诚恳。“山从人面起，云傍马头生”，生动地再现了蜀道崎岖狭窄，境界飞逸奇美，韵味十足。“笼”字是为诸多评家所称道的“诗眼”，非常传神，不是单纯写景，更是对上一联的呼应，很有表现力地描绘了蜀道的奇伟瑰丽，山岩的鬼斧神工。下句接合更妙，对仗工整，字字珠玑，带给读者强烈的色彩感。最后，诗人交代了他认为最重要也是一开始他就想说的，借用君平的典故，婉转地启发他的朋友不要沉迷于功名利禄之中，谆谆善诱，与开篇的欲语还休相呼应，情谊深挚，语短情长，又不乏对自身身世的感慨。\n注释：\n[1]蚕丛路：指入蜀的道路。蚕丛：蜀国的开国君王。\n[2]云傍马头生：云气依傍着马头而上升翻涌。\n[3]秦栈：由秦（今陕西省）入蜀的栈道。\n[4]春流：春江水涨，江水奔流。也可以指流经成都的郫江、流江。\n[5]升沉：进退沉浮，即人在世间的境遇和命运。\n[6]君平：西汉严遵，字君平，隐居不仕，曾在成都以卖卜为生。", "english": "Rugg’d is the road,I hear,\nBuilt by the pioneer.\nIn front steep mountains rise;\nBeside the steed cloud flies.\nO’er plank-way trees hang down;\nSpring water girds the town.\nDecid’d our rise and fall,\nDo not bother at all!\n注释：\n[1]Present-day Sichuan Province.", "poemType": "五言律诗", "chineseHtml": "<p class=\"poem-lines\">见说蚕丛路[1]，<br>崎岖不易行。<br>山从人面起，<br>云傍马头生[2]。<br>芳树笼秦栈[3]，<br>春流[4]绕蜀城。<br>升沉[5]应已定，<br>不必问君平[6]。</p>\n<p class=\"prose\">这首诗是天宝二年（743）李白在长安送友人入蜀时所作，是一首以描绘蜀道山川的奇美而著称的抒情诗。开篇不同于《蜀道难》，而是语重心长，娓娓道来，欲语还休，情感真挚而诚恳。“山从人面起，云傍马头生”，生动地再现了蜀道崎岖狭窄，境界飞逸奇美，韵味十足。</p>\n<p class=\"prose\">“笼”字是为诸多评家所称道的“诗眼”，非常传神，不是单纯写景，更是对上一联的呼应，很有表现力地描绘了蜀道的奇伟瑰丽，山岩的鬼斧神工。下句接合更妙，对仗工整，字字珠玑，带给读者强烈的色彩感。</p>\n<p class=\"prose\">最后，诗人交代了他认为最重要也是一开始他就想说的，借用君平的典故，婉转地启发他的朋友不要沉迷于功名利禄之中，谆谆善诱，与开篇的欲语还休相呼应，情谊深挚，语短情长，又不乏对自身身世的感慨。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]蚕丛路：指入蜀的道路。蚕丛：蜀国的开国君王。<br>[2]云傍马头生：云气依傍着马头而上升翻涌。<br>[3]秦栈：由秦（今陕西省）入蜀的栈道。<br>[4]春流：春江水涨，江水奔流。也可以指流经成都的郫江、流江。<br>[5]升沉：进退沉浮，即人在世间的境遇和命运。<br>[6]君平：西汉严遵，字君平，隐居不仕，曾在成都以卖卜为生。</p>", "englishHtml": "<p class=\"prose\">Rugg’d is the road,I hear,<br>Built by the pioneer.<br>In front steep mountains rise;<br>Beside the steed cloud flies.<br>O’er plank-way trees hang down;<br>Spring water girds the town.<br>Decid’d our rise and fall,<br>Do not bother at all!</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]Present-day Sichuan Province.</p>"}, {"num": "026", "zhTitle": "春夜洛城闻笛", "enTitle": "Hearing a Bamboo Flute on a Spring Night in Luoyang", "chinese": "谁家玉笛[2]暗飞声？\n散入东风满洛城。\n此夜曲中闻《折柳》[3]，\n何人不起故园情[4]？\n这首诗可能是公元734年（一说735年）春天，李白寄居洛阳时写的。他在长安晋谒王公大人，一无所得。离开长安后，经过开封、商丘，流寓洛阳。在一个春天的暗夜里，他忽然听到幽怨的笛声，在夜深人静之际，随风吹入千家万户。唐代亲友分离之时，有折柳赠别的习俗。诗人一听到折柳曲，自然会产生思乡之情，这也流露了他的失意之感。如果说《静夜思》是见月思乡的话，这首诗就是闻笛思归了。\n注释：\n[1]洛城：即洛阳城，在今河南省洛阳市。\n[2]玉笛：由玉制成或装饰的笛子。\n[3]折柳：即《折杨柳》笛曲，乐府“鼓角横吹曲”调名，其内容多写离情别绪。而“折柳”又暗含古时人们临别时折柳相赠的一种习俗。柳，暗指“留”。\n[4]故园情：思乡之情。故园，故乡。", "english": "From whose house comes the voice of flute of jade unseen?\nIt fills the town of Luoyang,spread by wind of spring.\nTonight I hear the farewell song of Willows Green.\nTo whom the tune will not nostalgic feeling bring?\n注释：\n[1]The eastern capital during the Tang Dynasty.", "poemType": "七言绝句", "chineseHtml": "<p class=\"poem-lines\">谁家玉笛[2]暗飞声？<br>散入东风满洛城。<br>此夜曲中闻《折柳》[3]，<br>何人不起故园情[4]？</p>\n<p class=\"prose\">这首诗可能是公元734年（一说735年）春天，李白寄居洛阳时写的。他在长安晋谒王公大人，一无所得。离开长安后，经过开封、商丘，流寓洛阳。在一个春天的暗夜里，他忽然听到幽怨的笛声，在夜深人静之际，随风吹入千家万户。唐代亲友分离之时，有折柳赠别的习俗。</p>\n<p class=\"prose\">诗人一听到折柳曲，自然会产生思乡之情，这也流露了他的失意之感。如果说《静夜思》是见月思乡的话，这首诗就是闻笛思归了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]洛城：即洛阳城，在今河南省洛阳市。<br>[2]玉笛：由玉制成或装饰的笛子。<br>[3]折柳：即《折杨柳》笛曲，乐府“鼓角横吹曲”调名，其内容多写离情别绪。而“折柳”又暗含古时人们临别时折柳相赠的一种习俗。柳，暗指“留”。<br>[4]故园情：思乡之情。故园，故乡。</p>", "englishHtml": "<p class=\"prose\">From whose house comes the voice of flute of jade unseen?<br>It fills the town of Luoyang,spread by wind of spring.<br>Tonight I hear the farewell song of Willows Green.<br>To whom the tune will not nostalgic feeling bring?</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]The eastern capital during the Tang Dynasty.</p>"}, {"num": "027", "zhTitle": "塞下曲", "enTitle": "Frontier Song", "chinese": "（六首其一）\n五月天山[1]雪，\n无花只有寒
