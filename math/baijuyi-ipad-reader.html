>\n<p class=\"commentary\">In “Passing by the Head-turning Peak in Banishment,” the poem turns a natural scene into a space of movement, wonder, and emotional release.</p>\n<p class=\"commentary\">As a seven-character quatrain, it lets Bai Juyi&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as mountains and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "020", "zhTitle": "蓝桥驿见元九诗", "enTitle": "Reading Yuan Zhen’s Poem at Blue Bridge Post", "chinese": "蓝桥春雪君归日，\n秦岭秋风我去时。\n每到驿亭[1]先下马，\n循墙绕柱觅君诗。\n公元815年农历正月，元稹回京城时经过蓝桥驿，在驿亭壁上留下了一首诗；三个月后，他就被贬谪到通州了。到了秋天，白居易也被贬去江州，经过蓝桥驿，读到了元稹的七律，就写了这首七绝。两人先后被贬，春雪秋风，西去东归，风尘仆仆。在人生的道路上，友情可贵，题咏可歌，共同的遭遇可泣。最后一句别开生面，用人物的行动作结：“循墙”是寸寸搜寻，“绕柱”是面面俱到，“觅诗”是转来转去。这首诗写出了诗人亲切的友情，收到了强烈的艺术效果。\n注释：\n[1]驿亭：驿站所设的供旅途休息处，古时驿站有亭。", "english": "When you came back, you passed by Blue Bridge in spring snow;\nNow banished to the south, in autumn breeze I go.\nSeeing a post, I dismount and enter the hall\nTo find your verse on the pillar along the wall.", "poemType": "七言绝句", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">蓝桥春雪君归日，<br>秦岭秋风我去时。<br>每到驿亭<sup class=\"note-ref\">[1]</sup>先下马，<br>循墙绕柱觅君诗。</p>\n<p class=\"prose\">公元815年农历正月，元稹回京城时经过蓝桥驿，在驿亭壁上留下了一首诗；三个月后，他就被贬谪到通州了。到了秋天，白居易也被贬去江州，经过蓝桥驿，读到了元稹的七律，就写了这首七绝。两人先后被贬，春雪秋风，西去东归，风尘仆仆。</p>\n<p class=\"prose\">在人生的道路上，友情可贵，题咏可歌，共同的遭遇可泣。最后一句别开生面，用人物的行动作结：“循墙”是寸寸搜寻，“绕柱”是面面俱到，“觅诗”是转来转去。这首诗写出了诗人亲切的友情，收到了强烈的艺术效果。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]驿亭：驿站所设的供旅途休息处，古时驿站有亭。</p>", "englishHtml": "<p class=\"poem-lines\">When you came back, you passed by Blue Bridge in spring snow;<br>Now banished to the south, in autumn breeze I go.<br>Seeing a post, I dismount and enter the hall<br>To find your verse on the pillar along the wall.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reading Yuan Zhen’s Poem at Blue Bridge Post,” the poem begins from a vivid object or scene and lets its energy expand into emotion.</p>\n<p class=\"commentary\">As a seven-character quatrain, it lets Bai Juyi&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as mountains and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "021", "zhTitle": "舟中读元九诗", "enTitle": "Reading Yuan Zhen’s Poems on a Boat", "chinese": "把君诗卷灯前读，\n诗尽灯残天未明。\n眼痛灭灯犹暗坐，\n逆风吹浪打船声。\n白居易被贬江州，离开长安，南下襄阳，然后坐船东去九江。他在船上伴着荧荧的灯火，读着元稹的诗卷，想着共同的遭遇，不免兴起同是天涯沦落人之感。满腔汹涌澎湃的感情，使他无法安枕；江上翻腾起伏的狂风巨浪，仿佛在为他的心情伴奏。诗中用了三个“灯”字：灯前、灯残、灭灯，灯光由高而低，风浪却由低而高，更从正反两面衬托出诗人悲愤不平的心情。", "english": "I read your book of poetry by the lamplight,\nAnd finish it when oil burns low at dead of night.\nEyes sore, I blow the light out and sit in the dark;\nThe waves brought up by adverse wind beat on the bark.", "poemType": "七言绝句", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">把君诗卷灯前读，<br>诗尽灯残天未明。<br>眼痛灭灯犹暗坐，<br>逆风吹浪打船声。</p>\n<p class=\"prose\">白居易被贬江州，离开长安，南下襄阳，然后坐船东去九江。他在船上伴着荧荧的灯火，读着元稹的诗卷，想着共同的遭遇，不免兴起同是天涯沦落人之感。满腔汹涌澎湃的感情，使他无法安枕；江上翻腾起伏的狂风巨浪，仿佛在为他的心情伴奏。诗中用了三个“灯”字：灯前、灯残、灭灯，灯光由高而低，风浪却由低而高，更从正反两面衬托出诗人悲愤不平的心情。</p>", "englishHtml": "<p class=\"poem-lines\">I read your book of poetry by the lamplight,<br>And finish it when oil burns low at dead of night.<br>Eyes sore, I blow the light out and sit in the dark;<br>The waves brought up by adverse wind beat on the bark.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Reading Yuan Zhen’s Poems on a Boat,” the poem turns a natural scene into a space of movement, wonder, and emotional release.</p>\n<p class=\"commentary\">As a seven-character quatrain, it lets Bai Juyi&#x27;s imagination enlarge the scene beyond ordinary description. Its power comes from the pressure between plain language and the feeling held beneath it.</p>"}, {"num": "022", "zhTitle": "放言", "enTitle": "Written at Random", "chinese": "朝真暮伪何人辨，\n古往今来底事无？\n但爱臧生[2]能诈圣，\n可知宁子解佯愚[3]？\n草萤有耀终非火，\n荷露虽团岂是珠？\n不取燔柴[4]兼照乘，\n可怜光彩亦何殊！\n《放言》五首是白居易贬江州途中所作，这里选的是第一首。诗中说到真假难辨，早上看来还是真的，到了晚上却又原形毕露。古往今来，什么怪事没有出过？春秋时代认为臧武仲是个圣人，孔子却揭穿他是个要挟君主的奸诈之徒；宁武子在乱世显得糊涂，其实却是大智若愚。草丛中的萤火虫虽能发光，但终究不是火；荷叶上的露珠虽然滚圆，却并不能当作珍珠。萤火既不能燃烧木柴，也不能照亮车辆，发光又有什么用？诗人就这样用形象和典故畅所欲言，说明了自己直言取祸的道理。\n注释：\n[1]放言：畅所欲言。\n[2]臧（zānɡ）生：指臧武仲。\n[3]佯愚：伪装愚笨。\n[4]燔（fán）柴：出自《礼记·祭法》：“燔柴于泰坛”，此处用作名词，意为大火。", "english": "It turns out false at dusk though at dawn it seemed true.\nIs there from olden days to now anything new?\nAll call the powerful hypocrite a saint cool.\nWho knows the wise man may pretend to be a fool?\nThe light sent out by fireflies is not fire amid grass;\nRound dewdrops on lotus leaves are not pearls, alas!\nIf fire cannot burn and illuminate the car,\nFireflies are bright and dewdrops are round as pearls are.", "poemType": "七言律诗", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">朝真暮伪何人辨，<br>古往今来底事无？<br>但爱臧生<sup class=\"note-ref\">[2]</sup>能诈圣，<br>可知宁子解佯愚<sup class=\"note-ref\">[3]</sup>？<br>草萤有耀终非火，<br>荷露虽团岂是珠？<br>不取燔柴<sup class=\"note-ref\">[4]</sup>兼照乘，<br>可怜光彩亦何殊！</p>\n<p class=\"prose\">《放言》五首是白居易贬江州途中所作，这里选的是第一首。诗中说到真假难辨，早上看来还是真的，到了晚上却又原形毕露。古往今来，什么怪事没有出过？春秋时代认为臧武仲是个圣人，孔子却揭穿他是个要挟君主的奸诈之徒；宁武子在乱世显得糊涂，其实却是大智若愚。</p>\n<p class=\"prose\">草丛中的萤火虫虽能发光，但终究不是火；荷叶上的露珠虽然滚圆，却并不能当作珍珠。萤火既不能燃烧木柴，也不能照亮车辆，发光又有什么用？诗人就这样用形象和典故畅所欲言，说明了自己直言取祸的道理。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]放言：畅所欲言。<br>[2]臧（zānɡ）生：指臧武仲。<br>[3]佯愚：伪装愚笨。<br>[4]燔（fán）柴：出自《礼记·祭法》：“燔柴于泰坛”，此处用作名词，意为大火。</p>", "englishHtml": "<p class=\"poem-lines\">It turns out false at dusk though at dawn it seemed true.<br>Is there from olden days to now anything new?<br>All call the powerful hypocrite a saint cool.<br>Who knows the wise man may pretend to be a fool?<br>The light sent out by fireflies is not fire amid grass;<br>Round dewdrops on lotus leaves are not pearls, alas!<br>If fire cannot burn and illuminate the car,<br>Fireflies are bright and dewdrops are round as pearls are.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Written at Random,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Its power comes from the pressure between plain language and the feeling held beneath it.</p>"}, {"num": "023", "zhTitle": "琵琶行", "enTitle": "Song of a Pipa Player", "chinese": "浔阳江[1]头夜送客，\n枫叶荻花秋瑟瑟。\n主人下马客在船，\n举酒欲饮无管弦。\n醉不成欢惨将别，\n别时茫茫江浸月。\n忽闻水上琵琶声，\n主人忘归客不发。\n寻声暗问弹者谁？\n琵琶声停欲语迟。\n移船相近邀相见，\n添酒回灯[2]重开宴。\n千呼万唤始出来，\n犹抱琵琶半遮面。\n转轴拨弦三两声，\n未成曲调先有情。\n弦弦掩抑[3]声声思[4]，\n似诉平生不得志。\n低眉信手续续弹，\n说尽心中无限事。\n轻拢慢捻抹复挑，\n初为《霓裳》后《六幺》[5]。\n大弦嘈嘈如急雨，\n小弦切切如私语。\n嘈嘈切切错杂弹，\n大珠小珠落玉盘。\n间关[6]莺语花底滑，\n幽咽[7]泉流冰下难[8]。\n冰泉冷涩弦凝绝[9]，\n凝绝不通声暂歇。\n别有幽愁暗恨生，\n此时无声胜有声。\n银瓶乍破水浆迸，\n铁骑突出刀枪鸣。\n曲终收拨当心画，\n四弦一声如裂帛。\n东船西舫悄无言，\n唯见江心秋月白。\n沉吟放拨插弦中，\n整顿衣裳起敛容[10]。\n自言本是京城女，\n家在虾蟆陵[11]下住。\n十三学得琵琶成，\n名属教坊[12]第一部。\n曲罢曾教善才服，\n妆成每被秋娘[13]妒。\n五陵年少争缠头[14]，\n一曲红绡[15]不知数。\n钿头银篦[16]击节碎，\n血色罗裙翻酒污。\n今年欢笑复明年，\n秋月春风等闲[17]度。\n弟走从军阿姨死，\n暮去朝来颜色故[18]。\n门前冷落鞍马稀，\n老大嫁作商人妇。\n商人重利轻别离，\n前月浮梁[19]买茶去。\n去来[20]江口守空船，\n绕船月明江水寒。\n夜深忽梦少年事，\n梦啼妆泪红阑干。\n我闻琵琶已叹息，\n又闻此语重唧唧[21]。\n同是天涯沦落人，\n相逢何必曾相识！\n我从去年辞帝京，\n谪居卧病浔阳城。\n浔阳地僻无音乐，\n终岁不闻丝竹声。\n住近湓江地低湿，\n黄芦苦竹绕宅生。\n其间旦暮闻何物？\n杜鹃啼血猿哀鸣。\n春江花朝秋月夜，\n往往取酒还独倾。\n岂无山歌与村笛？\n呕哑嘲哳[22]难为听。\n今夜闻君琵琶语，\n如听仙乐耳暂[23]明。\n莫辞更坐弹一曲，\n为君翻作《琵琶行》。\n感我此言良久立，\n却坐[24]促弦弦转急。\n凄凄不似向前声[25]，\n满座重闻皆掩泣。\n座中泣下谁最多？\n江州司马青衫[26]湿！\n《琵琶行》和《长恨歌》一样，也是白居易的传世名作。早在作者生前，已经是“童子解吟长恨曲，胡儿能唱琵琶篇”了。作者在诗中写自己从长安被贬到九江之后，在江边送客时，听到船上的歌女弹奏琵琶，诉说天涯沦落之恨，就同客人登船听乐。但是琵琶女“千呼万唤始出来”，因为她有话不便明说，也不愿意见人，只是借琵琶来揭示自己的内心世界。所以她弹奏的乐曲“似诉平生不得意”，“说尽心中无限事”。作者借助语言的音韵摹写音乐，用各种生动的比喻来加强形象性，如“大珠小珠落玉盘”就是用视觉形象来显露听觉形象；又如“别有幽愁暗恨生，此时无声胜有声”，更描绘了余音袅袅、余味无穷的艺术境界。这样，作者通过音乐形象的千变万化，展现了琵琶女起伏回荡的心潮。最后，作者更写琵琶女自诉身世，详昔而略今；写自己的遭遇，则详今而略昔。这样，他又使两个天涯沦落人的遗恨，一同流传千古了。\n注释：\n[1]浔阳江：据考证为流经浔阳城的湓水，即江西省九江市北的龙开河（1997年被人工填埋）。\n[2]回灯：重新点亮灯光。\n[3]掩抑：压抑。\n[4]思（sì）：悲伤的思绪。\n[5]《六幺》：唐代著名歌舞曲，又名《录要》《绿腰》《乐世》。\n[6]间（jiàn）关：鸟鸣声，莺语流转为“间关”。\n[7]幽咽：阻塞不畅。\n[8]冰下难：泉流冰下阻塞难通，形容弦声由流畅转为冷涩。\n[9]凝绝：凝滞。\n[10]敛容：神情庄重的样子。\n[11]虾（há）蟆陵：长安城东南，曲江附近。\n[12]教坊：唐代管理宫廷乐队、教练歌舞的官方机构。\n[13]秋娘：唐代歌舞伎常用的名号，此处泛指艺高貌美的歌伎。\n[14]缠头：用锦帛缠住乐舞者的头，以示奖赏。\n[15]绡（xiāo）：精致的丝织品。\n[16]钿（diàn）头银篦（bì）：镶嵌着精美花钿的篦形发饰；篦，梳子。\n[17]等闲：随随便便，形容虚度光阴。\n[18]颜色故：容颜老去。\n[19]浮梁：地名，唐属饶州。\n[20]去来：离别后；来，语气助词。\n[21]唧唧：叹息声。\n[22]呕哑嘲（zhāo）哳（zhā）：形容声音噪杂。\n[23]暂：突然。\n[24]却坐：坐回到原处。\n[25]向前声：之前弹奏过的曲调。\n[26]青衫：唐朝官服颜色由官阶决定，白居易时任官阶从九品，着青衫。", "english": "One night by riverside I bade a friend goodbye;\nIn maple leaves and rushes autumn seemed to sigh.\nMy friend and I dismounted and came into the boat;\nWe wished to drink but there was no music afloat.\nWithout flute songs we drank our cups with heavy head;\nThe moonbeams blended with water when we were to part.\nSuddenly o’er the stream we heard a pipa sound;\nI forgot to go home and the guest stood spellbound.\nWe followed where the music led to find the player,\nBut heard the pipa stop and no music in the air.\nWe moved our boat towards the one whence came the strain,\nBrought back the lamp, asked for more wine and drank again.\nRepeatedly we called for the fair player till\nShe came, her face half hidden behind a pipa still.\nShe turned the pegs and tested twice or thrice each string;\nBefore a tune was played we heard her feelings sing.\nEach string she plucked, each note she struck with pathos strong,\nAll seemed to say she’d missed her dreams all her life long.\nHead bent, she played with unpremeditated art\nOn and on to pour out her overflowing heart.\nShe lightly plucked, slowly stroked and twanged loud\nThe song of Green Waist after that of Rainbow Cloud.\nThe thick strings loudly thrummed like the pattering rain;\nThe fine strings softly tinkled in a murmuring strain.\nWhen mingling loud and soft notes were together played,\nYou heard large and small pearls cascade on plate of jade.\nNow you heard orioles warble in flowery land,\nThen a sobbing stream run along a beach of sand.\nBut the stream seemed so cold as to tighten the string;\nFrom tightened strings no more sound could be heard to sing.\nStill we heard hidden grief and vague regret concealed;\nThen music expressed far less than silence revealed.\nSuddenly we heard water burst a silver jar,\nAnd the clash of spears and sabres come from afar.\nShe made a central sweep when the music was ending;\nThe four strings made one sound, as of silk one was rending.\nSilence reigned left and right of the boat, east and west;\nWe saw but autumn moon white in the river’s breast.\nShe slid the plectrum pensively between the strings,\nSmoothed out her dress and rose with a composed mien.\n“I spent,” she said, “in the capital my early springs,\nWhere at the foot of Mount of Toads my home had been.\nAt thirteen I learned on the pipa how to play,\nAnd my name was among the primas of the day.\nI won my master’s admiration for my skill;\nMy beauty was envied by songstresses fair still.\nThe gallant young men vied to shower gifts on me;\nOne tune played, countless silk rolls were given with glee.\nBeating time, I let silver comb and pin drop down,\nAnd spilt-out wine oft stained my blood-red silken gown.\nFrom year to year I laughed my joyous life away\nOn moonlit autumn night as windy vernal day.\nMy younger brother left for war, and died my maid;\nDays passed, nights came, and my beauty began to fade.\nFewer and fewer were cabs and steeds at my door;\nI married a smug merchant when my prime was o’er.\nThe merchant cared for money much more than for me;\nOne month ago he went away to purchase tea,\nLeaving his lonely wife alone in empty boat;\nShrouded in moonlight, on the cold river I float.\nDeep in the night I dreamed of happy bygone years,\nAnd woke to find my rouged face crisscrossed with tears.”\nListening to her sad music, I sighed with pain;\nHearing her story, I sighed again and again.\nBoth of us in misfortune go from shore to shore.\nMeeting now, need we have known each other before?\n“I was banished from the capital last year\nTo live degraded and ill in this city here.\nThe city’s too remote to know melodious song,\nSo I have never heard music all the year long.\nI dwell by riverbank on a low and damp ground\nIn a house with wild reeds and stunted bamboos around.\nWhat is here to be heard from daybreak till nightfall\nBut gibbon’s cry and cuckoo’s homeward-going call?\nBy blooming riverside and under autumn moon\nI’ve often taken wine up and drunk it alone.\nThough I have mountain songs and village pipes to hear,\nYet they are crude and strident and grate on the ear.\nListening to you playing on pipa tonight,\nWith your music divine e’en my hearing seems bright.\nWill you sit down and play for us a tune once more?\nI’ll write for you an ode to the pipa I adore.”\nTouched by what I said, the player stood for long,\nThen sat down, tore at strings and played another song.\nSo sad, so drear, so different, it moved us deep;\nThose who heard it hid their face and began to weep.\nOf all the company at table who wept most?\nIt was none other than the exiled blue-robed host.", "poemType": "乐府/古体", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">浔阳江<sup class=\"note-ref\">[1]</sup>头夜送客，<br>枫叶荻花秋瑟瑟。<br>主人下马客在船，<br>举酒欲饮无管弦。<br>醉不成欢惨将别，<br>别时茫茫江浸月。<br>忽闻水上琵琶声，<br>主人忘归客不发。<br>寻声暗问弹者谁？<br>琵琶声停欲语迟。<br>移船相近邀相见，<br>添酒回灯<sup class=\"note-ref\">[2]</sup>重开宴。<br>千呼万唤始出来，<br>犹抱琵琶半遮面。<br>转轴拨弦三两声，<br>未成曲调先有情。<br>弦弦掩抑<sup class=\"note-ref\">[3]</sup>声声思<sup class=\"note-ref\">[4]</sup>，<br>似诉平生不得志。<br>低眉信手续续弹，<br>说尽心中无限事。<br>轻拢慢捻抹复挑，<br>初为《霓裳》后《六幺》<sup class=\"note-ref\">[5]</sup>。<br>大弦嘈嘈如急雨，<br>小弦切切如私语。<br>嘈嘈切切错杂弹，<br>大珠小珠落玉盘。<br>间关<sup class=\"note-ref\">[6]</sup>莺语花底滑，<br>幽咽<sup class=\"note-ref\">[7]</sup>泉流冰下难<sup class=\"note-ref\">[8]</sup>。<br>冰泉冷涩弦凝绝<sup class=\"note-ref\">[9]</sup>，<br>凝绝不通声暂歇。<br>别有幽愁暗恨生，<br>此时无声胜有声。<br>银瓶乍破水浆迸，<br>铁骑突出刀枪鸣。<br>曲终收拨当心画，<br>四弦一声如裂帛。<br>东船西舫悄无言，<br>唯见江心秋月白。<br>沉吟放拨插弦中，<br>整顿衣裳起敛容<sup class=\"note-ref\">[10]</sup>。<br>自言本是京城女，<br>家在虾蟆陵<sup class=\"note-ref\">[11]</sup>下住。<br>十三学得琵琶成，<br>名属教坊<sup class=\"note-ref\">[12]</sup>第一部。<br>曲罢曾教善才服，<br>妆成每被秋娘<sup class=\"note-ref\">[13]</sup>妒。<br>五陵年少争缠头<sup class=\"note-ref\">[14]</sup>，<br>一曲红绡<sup class=\"note-ref\">[15]</sup>不知数。<br>钿头银篦<sup class=\"note-ref\">[16]</sup>击节碎，<br>血色罗裙翻酒污。<br>今年欢笑复明年，<br>秋月春风等闲<sup class=\"note-ref\">[17]</sup>度。<br>弟走从军阿姨死，<br>暮去朝来颜色故<sup class=\"note-ref\">[18]</sup>。<br>门前冷落鞍马稀，<br>老大嫁作商人妇。<br>商人重利轻别离，<br>前月浮梁<sup class=\"note-ref\">[19]</sup>买茶去。<br>去来<sup class=\"note-ref\">[20]</sup>江口守空船，<br>绕船月明江水寒。<br>夜深忽梦少年事，<br>梦啼妆泪红阑干。<br>我闻琵琶已叹息，<br>又闻此语重唧唧<sup class=\"note-ref\">[21]</sup>。<br>同是天涯沦落人，<br>相逢何必曾相识！<br>我从去年辞帝京，<br>谪居卧病浔阳城。<br>浔阳地僻无音乐，<br>终岁不闻丝竹声。<br>住近湓江地低湿，<br>黄芦苦竹绕宅生。<br>其间旦暮闻何物？<br>杜鹃啼血猿哀鸣。<br>春江花朝秋月夜，<br>往往取酒还独倾。<br>岂无山歌与村笛？<br>呕哑嘲哳<sup class=\"note-ref\">[22]</sup>难为听。<br>今夜闻君琵琶语，<br>如听仙乐耳暂<sup class=\"note-ref\">[23]</sup>明。<br>莫辞更坐弹一曲，<br>为君翻作《琵琶行》。<br>感我此言良久立，<br>却坐<sup class=\"note-ref\">[24]</sup>促弦弦转急。<br>凄凄不似向前声<sup class=\"note-ref\">[25]</sup>，<br>满座重闻皆掩泣。<br>座中泣下谁最多？<br>江州司马青衫<sup class=\"note-ref\">[26]</sup>湿！</p>\n<p class=\"prose\">《琵琶行》和《长恨歌》一样，也是白居易的传世名作。早在作者生前，已经是“童子解吟长恨曲，胡儿能唱琵琶篇”了。作者在诗中写自己从长安被贬到九江之后，在江边送客时，听到船上的歌女弹奏琵琶，诉说天涯沦落之恨，就同客人登船听乐。</p>\n<p class=\"prose\">但是琵琶女“千呼万唤始出来”，因为她有话不便明说，也不愿意见人，只是借琵琶来揭示自己的内心世界。所以她弹奏的乐曲“似诉平生不得意”，“说尽心中无限事”。作者借助语言的音韵摹写音乐，用各种生动的比喻来加强形象性，如“大珠小珠落玉盘”就是用视觉形象来显露听觉形象；</p>\n<p class=\"prose\">又如“别有幽愁暗恨生，此时无声胜有声”，更描绘了余音袅袅、余味无穷的艺术境界。这样，作者通过音乐形象的千变万化，展现了琵琶女起伏回荡的心潮。最后，作者更写琵琶女自诉身世，详昔而略今；写自己的遭遇，则详今而略昔。这样，他又使两个天涯沦落人的遗恨，一同流传千古了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]浔阳江：据考证为流经浔阳城的湓水，即江西省九江市北的龙开河（1997年被人工填埋）。<br>[2]回灯：重新点亮灯光。<br>[3]掩抑：压抑。<br>[4]思（sì）：悲伤的思绪。<br>[5]《六幺》：唐代著名歌舞曲，又名《录要》《绿腰》《乐世》。<br>[6]间（jiàn）关：鸟鸣声，莺语流转为“间关”。<br>[7]幽咽：阻塞不畅。<br>[8]冰下难：泉流冰下阻塞难通，形容弦声由流畅转为冷涩。<br>[9]凝绝：凝滞。<br>[10]敛容：神情庄重的样子。<br>[11]虾（há）蟆陵：长安城东南，曲江附近。<br>[12]教坊：唐代管理宫廷乐队、教练歌舞的官方机构。<br>[13]秋娘：唐代歌舞伎常用的名号，此处泛指艺高貌美的歌伎。<br>[14]缠头：用锦帛缠住乐舞者的头，以示奖赏。<br>[15]绡（xiāo）：精致的丝织品。<br>[16]钿（diàn）头银篦（bì）：镶嵌着精美花钿的篦形发饰；篦，梳子。<br>[17]等闲：随随便便，形容虚度光阴。<br>[18]颜色故：容颜老去。<br>[19]浮梁：地名，唐属饶州。<br>[20]去来：离别后；来，语气助词。<br>[21]唧唧：叹息声。<br>[22]呕哑嘲（zhāo）哳（zhā）：形容声音噪杂。<br>[23]暂：突然。<br>[24]却坐：坐回到原处。<br>[25]向前声：之前弹奏过的曲调。<br>[26]青衫：唐朝官服颜色由官阶决定，白居易时任官阶从九品，着青衫。</p>", "englishHtml": "<p class=\"poem-lines\">One night by riverside I bade a friend goodbye;<br>In maple leaves and rushes autumn seemed to sigh.<br>My friend and I dismounted and came into the boat;<br>We wished to drink but there was no music afloat.<br>Without flute songs we drank our cups with heavy head;<br>The moonbeams blended with water when we were to part.<br>Suddenly o’er the stream we heard a pipa sound;<br>I forgot to go home and the guest stood spellbound.<br>We followed where the music led to find the player,<br>But heard the pipa stop and no music in the air.<br>We moved our boat towards the one whence came the strain,<br>Brought back the lamp, asked for more wine and drank again.<br>Repeatedly we called for the fair player till<br>She came, her face half hidden behind a pipa still.<br>She turned the pegs and tested twice or thrice each string;<br>Before a tune was played we heard her feelings sing.<br>Each string she plucked, each note she struck with pathos strong,<br>All seemed to say she’d missed her dreams all her life long.<br>Head bent, she played with unpremeditated art<br>On and on to pour out her overflowing heart.<br>She lightly plucked, slowly stroked and twanged loud<br>The song of Green Waist after that of Rainbow Cloud.<br>The thick strings loudly thrummed like the pattering rain;<br>The fine strings softly tinkled in a murmuring strain.<br>When mingling loud and soft notes were together played,<br>You heard large and small pearls cascade on plate of jade.<br>Now you heard orioles warble in flowery land,<br>Then a sobbing stream run along a beach of sand.<br>But the stream seemed so cold as to tighten the string;<br>From tightened strings no more sound could be heard to sing.<br>Still we heard hidden grief and vague regret concealed;<br>Then music expressed far less than silence revealed.<br>Suddenly we heard water burst a silver jar,<br>And the clash of spears and sabres come from afar.<br>She made a central sweep when the music was ending;<br>The four strings made one sound, as of silk one was rending.<br>Silence reigned left and right of the boat, east and west;<br>We saw but autumn moon white in the river’s breast.<br>She slid the plectrum pensively between the strings,<br>Smoothed out her dress and rose with a composed mien.<br>“I spent,” she said, “in the capital my early springs,<br>Where at the foot of Mount of Toads my home had been.<br>At thirteen I learned on the pipa how to play,<br>And my name was among the primas of the day.<br>I won my master’s admiration for my skill;<br>My beauty was envied by songstresses fair still.<br>The gallant young men vied to shower gifts on me;<br>One tune played, countless silk rolls were given with glee.<br>Beating time, I let silver comb and pin drop down,<br>And spilt-out wine oft stained my blood-red silken gown.<br>From year to year I laughed my joyous life away<br>On moonlit autumn night as windy vernal day.<br>My younger brother left for war, and died my maid;<br>Days passed, nights came, and my beauty began to fade.<br>Fewer and fewer were cabs and steeds at my door;<br>I married a smug merchant when my prime was o’er.<br>The merchant cared for money much more than for me;<br>One month ago he went away to purchase tea,<br>Leaving his lonely wife alone in empty boat;<br>Shrouded in moonlight, on the cold river I float.<br>Deep in the night I dreamed of happy bygone years,<br>And woke to find my rouged face crisscrossed with tears.”<br>Listening to her sad music, I sighed with pain;<br>Hearing her story, I sighed again and again.<br>Both of us in misfortune go from shore to shore.<br>Meeting now, need we have known each other before?<br>“I was banished from the capital last year<br>To live degraded and ill in this city here.<br>The city’s too remote to know melodious song,<br>So I have never heard music all the year long.<br>I dwell by riverbank on a low and damp ground<br>In a house with wild reeds and stunted bamboos around.<br>What is here to be heard from daybreak till nightfall<br>But gibbon’s cry and cuckoo’s homeward-going call?<br>By blooming riverside and under autumn moon<br>I’ve often taken wine up and drunk it alone.<br>Though I have mountain songs and village pipes to hear,<br>Yet they are crude and strident and grate on the ear.<br>Listening to you playing on pipa tonight,<br>With your music divine e’en my hearing seems bright.<br>Will you sit down and play for us a tune once more?<br>I’ll write for you an ode to the pipa I adore.”<br>Touched by what I said, the player stood for long,<br>Then sat down, tore at strings and played another song.<br>So sad, so drear, so different, it moved us deep;<br>Those who heard it hid their face and began to weep.<br>Of all the company at table who wept most?<br>It was none other than the exiled blue-robed host.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song of a Pipa Player,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as mountains, water, moonlight, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "024", "zhTitle": "南浦别", "enTitle": "Farewell by Southern Riverside", "chinese": "南浦凄凄别，\n西风袅袅秋。\n一看肠一断，\n好去莫回头。\n白居易在《琵琶行》序中说：“元和十年（815），予左迁九江郡司马。明年秋，送客湓浦口。”这首《南浦别》有可能是和《琵琶行》同时的作品。第一句形容内心的凄凉愁苦。第二句描写秋景的萧瑟暗淡，“袅袅”二字使风声如泣如诉，更衬托出离别的“凄凄”之情。离人已经登舟而去，但还频频回首，每一回首，都引起送行人“肠一断”，所以反劝离人不要回首。这就写出了依依惜别的深情。", "english": "By Southern Riverside we bid dreary goodbye;\nAutumn seems desolate to hear the west wind sigh.\nMy heart would break each time you look back to the shore.\nGo on before and don’t turn your head any more!", "poemType": "五言绝句", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">南浦凄凄别，<br>西风袅袅秋。<br>一看肠一断，<br>好去莫回头。</p>\n<p class=\"prose\">白居易在《琵琶行》序中说：“元和十年（815），予左迁九江郡司马。明年秋，送客湓浦口。”这首《南浦别》有可能是和《琵琶行》同时的作品。第一句形容内心的凄凉愁苦。第二句描写秋景的萧瑟暗淡，“袅袅”二字使风声如泣如诉，更衬托出离别的“凄凄”之情。</p>\n<p class=\"prose\">离人已经登舟而去，但还频频回首，每一回首，都引起送行人“肠一断”，所以反劝离人不要回首。这就写出了依依惜别的深情。</p>", "englishHtml": "<p class=\"poem-lines\">By Southern Riverside we bid dreary goodbye;<br>Autumn seems desolate to hear the west wind sigh.<br>My heart would break each time you look back to the shore.<br>Go on before and don’t turn your head any more!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Farewell by Southern Riverside,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Its power comes from the pressure between plain language and the feeling held beneath it.</p>"}, {"num": "025", "zhTitle": "大林寺桃花", "enTitle": "Peach Blossoms in the Temple of Great Forest", "chinese": "人间[1]四月芳菲尽，\n山寺桃花始盛开。\n长恨[2]春归无觅处，\n不知[3]转入此中来。\n大林寺在庐山香炉峰顶。这首诗是白居易于公元617年初夏所作。农历四月，平地上的桃花已经凋谢，作者登到高山古寺之中，不料却看到了一片盛开的桃花。这是山高地深、时节绝晚的景象，但作者却写出了感情上的飞跃，仿佛是从现实世界进入了仙境似的。在仙境中，作者用桃花代替抽象的春光，又把春光拟人化。这样就使本诗立意新颖，构思灵巧，启人深思，惹人喜爱，是唐人绝句中的珍品。\n注释：\n[1]人间：指庐山脚下的村落。\n[2]长恨：常常惋惜、遗憾。\n[3]不知：岂料，意想不到。", "english": "All flowers in late spring have fallen far and wide,\nBut peach blossoms are full-blown on the mountainside.\nI oft regret spring’s gone without leaving its trace;\nI didn’t know how it’s come up to adorn this place.", "poemType": "七言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">人间<sup class=\"note-ref\">[1]</sup>四月芳菲尽，<br>山寺桃花始盛开。<br>长恨<sup class=\"note-ref\">[2]</sup>春归无觅处，<br>不知<sup class=\"note-ref\">[3]</sup>转入此中来。</p>\n<p class=\"prose\">大林寺在庐山香炉峰顶。这首诗是白居易于公元617年初夏所作。农历四月，平地上的桃花已经凋谢，作者登到高山古寺之中，不料却看到了一片盛开的桃花。这是山高地深、时节绝晚的景象，但作者却写出了感情上的飞跃，仿佛是从现实世界进入了仙境似的。</p>\n<p class=\"prose\">在仙境中，作者用桃花代替抽象的春光，又把春光拟人化。这样就使本诗立意新颖，构思灵巧，启人深思，惹人喜爱，是唐人绝句中的珍品。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]人间：指庐山脚下的村落。<br>[2]长恨：常常惋惜、遗憾。<br>[3]不知：岂料，意想不到。</p>", "englishHtml": "<p class=\"poem-lines\">All flowers in late spring have fallen far and wide,<br>But peach blossoms are full-blown on the mountainside.<br>I oft regret spring’s gone without leaving its trace;<br>I didn’t know how it’s come up to adorn this place.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Peach Blossoms in the Temple of Great Forest,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as mountains, moonlight, flowers, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "026", "zhTitle": "遗爱寺", "enTitle": "Temple of Dear Memories", "chinese": "弄[1]石临溪坐，\n寻花绕寺行。\n时时闻鸟语，\n处处是泉声。\n遗爱寺在庐山香炉峰下，离白居易所建的草堂很近。这首小诗通过临溪弄石、绕寺寻花、时时闻鸟、处处听泉等几个乘兴漫游的活动，把读者带到一个令人神往的境界。诗着重的是从动中写景，从景中抒情。\n注释：\n[1]弄：在手中玩弄。", "english": "Playing with pebbles, I sit by the brook;\nSeeking for flowers, I turn temple’s nook.\nFrom time to time birds sing in mountains;\nFrom place to place I hear bubbling fountains.", "poemType": "五言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">弄<sup class=\"note-ref\">[1]</sup>石临溪坐，<br>寻花绕寺行。<br>时时闻鸟语，<br>处处是泉声。</p>\n<p class=\"prose\">遗爱寺在庐山香炉峰下，离白居易所建的草堂很近。这首小诗通过临溪弄石、绕寺寻花、时时闻鸟、处处听泉等几个乘兴漫游的活动，把读者带到一个令人神往的境界。诗着重的是从动中写景，从景中抒情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]弄：在手中玩弄。</p>", "englishHtml": "<p class=\"poem-lines\">Playing with pebbles, I sit by the brook;<br>Seeking for flowers, I turn temple’s nook.<br>From time to time birds sing in mountains;<br>From place to place I hear bubbling fountains.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Temple of Dear Memories,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as water, flowers, and birds give the poem its visual texture and emotional temperature.</p>"}, {"num": "027", "zhTitle": "问刘十九", "enTitle": "An Invitation", "chinese": "绿蚁新醅[1]酒，\n红泥小火炉。\n晚来天欲雪，\n能饮一杯无[2]？\n这首小诗可以说是约朋友来家小饮的邀请信。酒是新酿的，没有滤清时，酒渣会浮上来，颜色微绿，好像蚂蚁似的，所以叫作绿蚁。红色泥炉小巧朴实，炉火上升，映衬着泡沫浮动的绿酒，显得分外温暖；加上外面天要下雪，更显得室内温暖如春。这时作者想到邀请刘十九来共饮一杯，使红炉绿酒温暖友人的心，而温暖的友情又使寒室生春了。\n注释：\n[1]醅（pēi）：酿造。\n[2]无：义同“否”。", "english": "My new brew gives green glow;\nMy red clay stove flames up.\nAt dusk it threatens snow.\nWon’t you come for a cup?", "poemType": "五言绝句", "poemTheme": "饮酒抒怀", "chineseHtml": "<p class=\"poem-lines\">绿蚁新醅<sup class=\"note-ref\">[1]</sup>酒，<br>红泥小火炉。<br>晚来天欲雪，<br>能饮一杯无<sup class=\"note-ref\">[2]</sup>？</p>\n<p class=\"prose\">这首小诗可以说是约朋友来家小饮的邀请信。酒是新酿的，没有滤清时，酒渣会浮上来，颜色微绿，好像蚂蚁似的，所以叫作绿蚁。红色泥炉小巧朴实，炉火上升，映衬着泡沫浮动的绿酒，显得分外温暖；加上外面天要下雪，更显得室内温暖如春。这时作者想到邀请刘十九来共饮一杯，使红炉绿酒温暖友人的心，而温暖的友情又使寒室生春了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]醅（pēi）：酿造。<br>[2]无：义同“否”。</p>", "englishHtml": "<p class=\"poem-lines\">My new brew gives green glow;<br>My red clay stove flames up.<br>At dusk it threatens snow.<br>Won’t you come for a cup?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “An Invitation,” the poem uses wine, song, and bold rhythm to release feeling on a grand scale.</p>\n<p class=\"commentary\">As a five-character quatrain, it shows Bai Juyi&#x27;s gift for turning private feeling into a grave, resonant voice. Key images such as wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "028", "zhTitle": "夜雪", "enTitle": "Snowing at Night", "chinese": "已讶[1]衾枕[2]冷，\n复见窗户明。\n夜深知雪重，\n时闻折竹声[3]。\n咏雪诗写夜雪的不多，因为夜色深沉，雪光迷蒙，看不清楚，不好描写。但白居易从感觉入手，先写寒冷，这就不但点出了雪，而且暗示雪大。然后诗人才转入视觉的角度，但又不直接写雪，而是间接写窗，窗明自然表示雪下得大，积得深。前两句都写人，又处处点出了雪。后两句变换角度，转从听觉来写，听见积雪压断竹枝，可见雪势有增无已；同时说明了诗人一夜未眠，反映了他谪居江州时的孤寂心情。\n注释：\n[1]讶：惊讶。\n[2]衾（qīn）枕：被子和枕头。\n[3]折竹声：大雪压断竹子的声音。", "english": "Surprised to feel my quilt and pillow cold,\nI wake up but to see the window bright.\nHeavy with snow, I know night has grown old;\nAt times I hear bamboos snapped by snow white.", "poemType": "五言绝句", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">已讶<sup class=\"note-ref\">[1]</sup>衾枕<sup class=\"note-ref\">[2]</sup>冷，<br>复见窗户明。<br>夜深知雪重，<br>时闻折竹声<sup class=\"note-ref\">[3]</sup>。</p>\n<p class=\"prose\">咏雪诗写夜雪的不多，因为夜色深沉，雪光迷蒙，看不清楚，不好描写。但白居易从感觉入手，先写寒冷，这就不但点出了雪，而且暗示雪大。然后诗人才转入视觉的角度，但又不直接写雪，而是间接写窗，窗明自然表示雪下得大，积得深。前两句都写人，又处处点出了雪。</p>\n<p class=\"prose\">后两句变换角度，转从听觉来写，听见积雪压断竹枝，可见雪势有增无已；同时说明了诗人一夜未眠，反映了他谪居江州时的孤寂心情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]讶：惊讶。<br>[2]衾（qīn）枕：被子和枕头。<br>[3]折竹声：大雪压断竹子的声音。</p>", "englishHtml": "<p class=\"poem-lines\">Surprised to feel my quilt and pillow cold,<br>I wake up but to see the window bright.<br>Heavy with snow, I know night has grown old;<br>At times I hear bamboos snapped by snow white.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Snowing at Night,” the poem turns a natural scene into a space of movement, wonder, and emotional release.</p>\n<p class=\"commentary\">As a five-character quatrain, it lets Bai Juyi&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "029", "zhTitle": "钟陵饯送", "enTitle": "Farewell Feast at Zhongling", "chinese": "翠幕红筵[1]高在云，\n歌钟一曲万家闻。\n路人指点滕王阁[2]，\n看送忠州白使君[3]。\n这首诗是白居易离开江州后，友人在滕王阁为他送行，他所写下的饯别诗。王勃的滕王阁诗早已闻名天下，“滕王高阁临江渚”，白居易只用“高在云”三字虚写；“佩玉鸣鸾罢歌舞”，“画栋朝飞南浦云，珠帘暮卷西山雨”，白诗只用“翠幕红筵”四字概括；而“歌钟一曲万家闻”则是王诗“歌舞”的扩大；“路人指点滕王阁”，这才转入正题，而王诗却是开门见山；最后一句“看送忠州白使君”，还是从路人观点来写饯别。总之，这首诗用高阁之盛、饯别之欢，来反衬当年江州的孤寂。\n注释：\n[1]翠幕红筵：翠绿的帐幕，红锦铺设的筵席。\n[2]滕王阁：位于今江西省南昌市赣江东岸，与黄鹤楼、岳阳楼为并称“江南三大名楼”。\n[3]使君：古时对州郡长官的尊称。", "english": "Green curtains veil the crimson hall high in the cloud;\nWith thrilling farewell songs a thousand houses are loud.\nPassersby lending their ears point to Prince Teng’s Tower\nAnd see officials bid me adieu in the bower.", "poemType": "七言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">翠幕红筵<sup class=\"note-ref\">[1]</sup>高在云，<br>歌钟一曲万家闻。<br>路人指点滕王阁<sup class=\"note-ref\">[2]</sup>，<br>看送忠州白使君<sup class=\"note-ref\">[3]</sup>。</p>\n<p class=\"prose\">这首诗是白居易离开江州后，友人在滕王阁为他送行，他所写下的饯别诗。王勃的滕王阁诗早已闻名天下，“滕王高阁临江渚”，白居易只用“高在云”三字虚写；“佩玉鸣鸾罢歌舞”，“画栋朝飞南浦云，珠帘暮卷西山雨”，白诗只用“翠幕红筵”四字概括；</p>\n<p class=\"prose\">而“歌钟一曲万家闻”则是王诗“歌舞”的扩大；“路人指点滕王阁”，这才转入正题，而王诗却是开门见山；最后一句“看送忠州白使君”，还是从路人观点来写饯别。总之，这首诗用高阁之盛、饯别之欢，来反衬当年江州的孤寂。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]翠幕红筵：翠绿的帐幕，红锦铺设的筵席。<br>[2]滕王阁：位于今江西省南昌市赣江东岸，与黄鹤楼、岳阳楼为并称“江南三大名楼”。<br>[3]使君：古时对州郡长官的尊称。</p>", "englishHtml": "<p class=\"poem-lines\">Green curtains veil the crimson hall high in the cloud;<br>With thrilling farewell songs a thousand houses are loud.<br>Passersby lending their ears point to Prince Teng’s Tower<br>And see officials bid me adieu in the bower.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Farewell Feast at Zhongling,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as clouds and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "030", "zhTitle": "李白墓", "enTitle": "Li Bai’s Grave", "chinese": "采石江边李白坟，\n绕田无限草连云。\n可怜[2]荒垄穷泉骨，\n曾有惊天动地文。\n但是诗人多薄命，\n就中[3]沦落不过君。\n李白墓在采石矶江边，采石矶原名牛渚矶，是牛渚山突出长江的部分形成的。李白墓的周围一片荒凉，无边无际的野草从山下的田边一直延伸到天边。第三句的“荒垄”指荒芜的坟墓，“穷泉”就是黄泉，指埋葬人的地下。第四句说，李白的诗“笔落惊风雨，诗成泣鬼神”。第五句说，只可惜诗人的命运不好。第六句说，诗人中没有比李白更落魄的了。全诗对李白做了极高的评价，对诗人身后的萧条表示了深切的同情和不平。\n注释：\n[1]李白墓：现位于安徽省马鞍山市当涂县城东南的青山西麓，元和十二年（817年）由城南龙山东麓迁葬至此。\n[2]可怜：可悲，可叹。\n[3]就中：其中，当中。", "english": "By riverside near Rocky Hill Li Bai’s grave stands;\nThe boundless grassland round the fields blends with the cloud.\nWhat a pity his bones are buried in wastelands!\nWith his earth-shaking poems the world was loud.\nThere is no poet but suffers a bitter fate;\nBeside Li Bai no one can say he’s unfortunate!", "poemType": "古体诗", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">采石江边李白坟，<br>绕田无限草连云。<br>可怜<sup class=\"note-ref\">[2]</sup>荒垄穷泉骨，<br>曾有惊天动地文。<br>但是诗人多薄命，<br>就中<sup class=\"note-ref\">[3]</sup>沦落不过君。</p>\n<p class=\"prose\">李白墓在采石矶江边，采石矶原名牛渚矶，是牛渚山突出长江的部分形成的。李白墓的周围一片荒凉，无边无际的野草从山下的田边一直延伸到天边。第三句的“荒垄”指荒芜的坟墓，“穷泉”就是黄泉，指埋葬人的地下。第四句说，李白的诗“笔落惊风雨，诗成泣鬼神”。</p>\n<p class=\"prose\">第五句说，只可惜诗人的命运不好。第六句说，诗人中没有比李白更落魄的了。全诗对李白做了极高的评价，对诗人身后的萧条表示了深切的同情和不平。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]李白墓：现位于安徽省马鞍山市当涂县城东南的青山西麓，元和十二年（817年）由城南龙山东麓迁葬至此。<br>[2]可怜：可悲，可叹。<br>[3]就中：其中，当中。</p>", "englishHtml": "<p class=\"poem-lines\">By riverside near Rocky Hill Li Bai’s grave stands;<br>The boundless grassland round the fields blends with the cloud.<br>What a pity his bones are buried in wastelands!<br>With his earth-shaking poems the world was loud.<br>There is no poet but suffers a bitter fate;<br>Beside Li Bai no one can say he’s unfortunate!</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Li Bai’s Grave,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a ancient-style poem, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as water and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "031", "zhTitle": "后宫词", "enTitle": "The Deserted", "chinese": "泪湿罗巾梦不成，\n夜深前殿按歌声[1]。\n红颜未老恩先断，\n斜倚熏笼[2]坐到明。\n这首诗是代宫女所作的怨词。第一句“泪湿罗巾”写宫女等待君王不来，哭得泪眼不干，这是怨的外形，是第一层怨。等待的结果是失望，只好寻梦，梦又不成，这是第二层怨。梦不成却听见前殿歌声，说明君王正在寻欢作乐，但是没有自己陪伴，这是第三层怨。如果自己年龄大了，失宠倒也情有可原，偏偏红颜未老，这是第四层怨。如果从来没有受过恩宠倒也罢了，偏偏是受宠之后恩断，这是第五层怨。恩断还不死心，却要斜倚熏笼一直等到天明，这是第六层怨。全诗由希望转到失望，由失望转到苦望，由苦望最后转到绝望；由现实进入幻想，由幻想进入痴想，由痴想再回到现实，千回百转，倾注了诗人对宫女的深挚同情。\n注释：\n[1]按歌声：按照歌声的韵律打节拍。\n[2]熏笼：覆罩香炉的竹笼，古时一种烘烤和取暖的用具，用来熏衣被等。", "english": "Her handkerchief soaked with tears, she cannot fall asleep,\nBut overhears band music waft when night is deep.\nHer rosy face outlasts the favor of the king;\nShe leans on her perfumed bed till morning birds sing.", "poemType": "七言绝句", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">泪湿罗巾梦不成，<br>夜深前殿按歌声<sup class=\"note-ref\">[1]</sup>。<br>红颜未老恩先断，<br>斜倚熏笼<sup class=\"note-ref\">[2]</sup>坐到明。</p>\n<p class=\"prose\">这首诗是代宫女所作的怨词。第一句“泪湿罗巾”写宫女等待君王不来，哭得泪眼不干，这是怨的外形，是第一层怨。等待的结果是失望，只好寻梦，梦又不成，这是第二层怨。梦不成却听见前殿歌声，说明君王正在寻欢作乐，但是没有自己陪伴，这是第三层怨。</p>\n<p class=\"prose\">如果自己年龄大了，失宠倒也情有可原，偏偏红颜未老，这是第四层怨。如果从来没有受过恩宠倒也罢了，偏偏是受宠之后恩断，这是第五层怨。恩断还不死心，却要斜倚熏笼一直等到天明，这是第六层怨。全诗由希望转到失望，由失望转到苦望，由苦望最后转到绝望；</p>\n<p class=\"prose\">由现实进入幻想，由幻想进入痴想，由痴想再回到现实，千回百转，倾注了诗人对宫女的深挚同情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]按歌声：按照歌声的韵律打节拍。<br>[2]熏笼：覆罩香炉的竹笼，古时一种烘烤和取暖的用具，用来熏衣被等。</p>", "englishHtml": "<p class=\"poem-lines\">Her handkerchief soaked with tears, she cannot fall asleep,<br>But overhears band music waft when night is deep.<br>Her rosy face outlasts the favor of the king;<br>She leans on her perfumed bed till morning birds sing.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Deserted,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "032", "zhTitle": "夜筝", "enTitle": "Lute Playing at Night", "chinese": "紫袖红弦明月中，\n自弹自感[1]暗低容[2]。\n弦凝指咽声停处，\n别有深情一万重。\n《夜筝》可以说是把《琵琶行》剪裁成了一首绝句。第一句的“紫袖”代弹筝人，“红弦”代筝，暗示她的乐伎身份，衣饰美好，乐器精良；“明月”表示是夜，可以使人想起“浔阳江头夜送客”的情景。第二句的“自弹”使人想起“低眉信手续续弹”，“自感”则是沉浸在乐曲中。第三句的“弦凝”使人想到“冰泉冷涩弦凝绝”，“指咽”则会使人想到“幽咽泉流水下滩”，所以使人觉得“别有深情一万重”了。\n注释：\n[1]自弹自感：弹筝人被自己曲中的情思所感染。\n[2]暗低容：愁容满面、低头沉吟的样子。", "english": "In moonlight violet sleeves caress the lute red;\nPlaying alone and moved, she lowers and hides her head.\nHer fingers sob when music stops on congealed strings,\nBut you can hear ten thousand songs her deep heart sings.", "poemType": "七言绝句", "poemTheme": "咏物写景", "chineseHtml": "<p class=\"poem-lines\">紫袖红弦明月中，<br>自弹自感<sup class=\"note-ref\">[1]</sup>暗低容<sup class=\"note-ref\">[2]</sup>。<br>弦凝指咽声停处，<br>别有深情一万重。</p>\n<p class=\"prose\">《夜筝》可以说是把《琵琶行》剪裁成了一首绝句。第一句的“紫袖”代弹筝人，“红弦”代筝，暗示她的乐伎身份，衣饰美好，乐器精良；“明月”表示是夜，可以使人想起“浔阳江头夜送客”的情景。第二句的“自弹”使人想起“低眉信手续续弹”，“自感”则是沉浸在乐曲中。</p>\n<p class=\"prose\">第三句的“弦凝”使人想到“冰泉冷涩弦凝绝”，“指咽”则会使人想到“幽咽泉流水下滩”，所以使人觉得“别有深情一万重”了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]自弹自感：弹筝人被自己曲中的情思所感染。<br>[2]暗低容：愁容满面、低头沉吟的样子。</p>", "englishHtml": "<p class=\"poem-lines\">In moonlight violet sleeves caress the lute red;<br>Playing alone and moved, she lowers and hides her head.<br>Her fingers sob when music stops on congealed strings,<br>But you can hear ten thousand songs her deep heart sings.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Lute Playing at Night,” the poem begins from a vivid object or scene and lets its energy expand into emotion.</p>\n<p class=\"commentary\">As a seven-character quatrain, it lets Bai Juyi&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as moonlight give the poem its visual texture and emotional temperature.</p>"}, {"num": "033", "zhTitle": "勤政楼西老柳", "enTitle": "The Old Willow Tree West of the Administrative Hall", "chinese": "半朽临风树，\n多情立马人。\n开元[2]一枝柳，\n长庆二年[3]春。\n勤政楼西边的老柳树是唐玄宗开元年间（713—741）种的，到了长庆二年（822），已经有100年左右的历史了。当时白居易51岁，也是半朽之人，见了半朽之树，所以立马良久，凝望出神，处在物我交融的境界。前两句用画笔勾勒了一幅临风立马图，语短情长，意境苍茫；后两句用史笔补叙了柳树和诗人的年龄，隐含了百年变迁、自然变化、人世沧桑的感慨在内，是一幅充满了感情的生活小照。\n注释：\n[1]勤政楼：位于长安兴庆宫西南，始建于开元八年（720年）。\n[2]开元：唐玄宗年号，公元713年至741年。\n[3]长庆二年：唐穆宗李恒在位第二年，即公元822年。", "english": "In breeze stands a half-withered tree;\nLooking at it on horse has oldened me.\nThe tree’s seen ups and downs for years;\nFor fifty-one springs I’ve shed tears.", "poemType": "五言绝句", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">半朽临风树，<br>多情立马人。<br>开元<sup class=\"note-ref\">[2]</sup>一枝柳，<br>长庆二年<sup class=\"note-ref\">[3]</sup>春。</p>\n<p class=\"prose\">勤政楼西边的老柳树是唐玄宗开元年间（713—741）种的，到了长庆二年（822），已经有100年左右的历史了。当时白居易51岁，也是半朽之人，见了半朽之树，所以立马良久，凝望出神，处在物我交融的境界。前两句用画笔勾勒了一幅临风立马图，语短情长，意境苍茫；</p>\n<p class=\"prose\">后两句用史笔补叙了柳树和诗人的年龄，隐含了百年变迁、自然变化、人世沧桑的感慨在内，是一幅充满了感情的生活小照。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]勤政楼：位于长安兴庆宫西南，始建于开元八年（720年）。<br>[2]开元：唐玄宗年号，公元713年至741年。<br>[3]长庆二年：唐穆宗李恒在位第二年，即公元822年。</p>", "englishHtml": "<p class=\"poem-lines\">In breeze stands a half-withered tree;<br>Looking at it on horse has oldened me.<br>The tree’s seen ups and downs for years;<br>For fifty-one springs I’ve shed tears.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Old Willow Tree West of the Administrative Hall,” the poem presents retreat or solitude as a way to stand apart from worldly pressure.</p>\n<p class=\"commentary\">As a five-character quatrain, it lets Bai Juyi&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "034", "zhTitle": "暮江吟", "enTitle": "Sunset and Moonrise on the River", "chinese": "一道残阳铺水中，\n半江瑟瑟[2]半江红。\n可怜[3]九月初三夜，\n露似真珠月似弓。\n这首诗大约是公元822年白居易赴杭州任刺史途中的作品。第一句说残阳照射在江面上，不说“照”而说“铺”，因为落日已经接近地平线，几乎贴近水面，仿佛铺在江上一样，一个“铺”字用得很形象化。第二句说江面皱起波纹，受光多的部分呈现一片红色，受光少的部分呈现深深的碧绿色。前两句写日落，后两句写月出。新月如弓，圆露似珠，似乎也反映出诗人在江州时的落日心态和去杭州途中轻松愉快的新月心情。\n注释：\n[1]暮江吟：傍晚时分在江边所写的诗。\n[2]瑟瑟：本意为碧色宝石，此处形容江水呈碧绿色。\n[3]可怜：可爱。", "english": "The departing sunbeams pave a way on the river;\nHalf of its waves turn red and the other half shiver.\nHow I love the third night of the ninth moon aglow!\nThe dewdrops look like pearls, the crescent like a bow.", "poemType": "七言绝句", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">一道残阳铺水中，<br>半江瑟瑟<sup class=\"note-ref\">[2]</sup>半江红。<br>可怜<sup class=\"note-ref\">[3]</sup>九月初三夜，<br>露似真珠月似弓。</p>\n<p class=\"prose\">这首诗大约是公元822年白居易赴杭州任刺史途中的作品。第一句说残阳照射在江面上，不说“照”而说“铺”，因为落日已经接近地平线，几乎贴近水面，仿佛铺在江上一样，一个“铺”字用得很形象化。第二句说江面皱起波纹，受光多的部分呈现一片红色，受光少的部分呈现深深的碧绿色。</p>\n<p class=\"prose\">前两句写日落，后两句写月出。新月如弓，圆露似珠，似乎也反映出诗人在江州时的落日心态和去杭州途中轻松愉快的新月心情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]暮江吟：傍晚时分在江边所写的诗。<br>[2]瑟瑟：本意为碧色宝石，此处形容江水呈碧绿色。<br>[3]可怜：可爱。</p>", "englishHtml": "<p class=\"poem-lines\">The departing sunbeams pave a way on the river;<br>Half of its waves turn red and the other half shiver.<br>How I love the third night of the ninth moon aglow!<br>The dewdrops look like pearls, the crescent like a bow.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Sunset and Moonrise on the River,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as water and moonlight give the poem its visual texture and emotional temperature.</p>"}, {"num": "035", "zhTitle": "寒闺怨", "enTitle": "A Wife’s Grief in Autumn", "chinese": "寒月沉沉洞房静，\n真珠[1]帘外梧桐影。\n秋霜欲下手先知，\n灯底裁缝剪刀冷。\n唐代的府兵制规定：兵士自备衣装，衣服破损，要由家中寄来补充更换，特别是御寒的冬衣。诗中第一句的“洞房”指的是房屋后部女眷的居室。居所本已深邃，寒月一照，更见幽静；帘外梧桐投影，更见阴沉。室内的妻子正在灯下为远戍不归的征夫缝制寒衣，一摸剪刀，立刻感到秋凉；再想到远在边地受寒的丈夫，怎能不牵肠挂肚呢？全诗不言怨而怨自见，流露出作者对征夫怨妇的同情。\n注释：\n[1]真珠：珍珠。", "english": "The cool moon shivers over her bower tranquil,\nOutside the pearly screen the shadow of a parasol old.\nBefore autumn frost falls her fingers feel the chill,\nWhen she cuts clothes by lamplight with scissors cold.", "poemType": "七言绝句", "poemTheme": "宫怨闺情", "chineseHtml": "<p class=\"poem-lines\">寒月沉沉洞房静，<br>真珠<sup class=\"note-ref\">[1]</sup>帘外梧桐影。<br>秋霜欲下手先知，<br>灯底裁缝剪刀冷。</p>\n<p class=\"prose\">唐代的府兵制规定：兵士自备衣装，衣服破损，要由家中寄来补充更换，特别是御寒的冬衣。诗中第一句的“洞房”指的是房屋后部女眷的居室。居所本已深邃，寒月一照，更见幽静；帘外梧桐投影，更见阴沉。室内的妻子正在灯下为远戍不归的征夫缝制寒衣，一摸剪刀，立刻感到秋凉；</p>\n<p class=\"prose\">再想到远在边地受寒的丈夫，怎能不牵肠挂肚呢？全诗不言怨而怨自见，流露出作者对征夫怨妇的同情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]真珠：珍珠。</p>", "englishHtml": "<p class=\"poem-lines\">The cool moon shivers over her bower tranquil,<br>Outside the pearly screen the shadow of a parasol old.<br>Before autumn frost falls her fingers feel the chill,<br>When she cuts clothes by lamplight with scissors cold.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Wife’s Grief in Autumn,” the poem focuses on inward sorrow, letting restraint and delicate images carry the feeling.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as moonlight give the poem its visual texture and emotional temperature.</p>"}, {"num": "036", "zhTitle": "钱塘湖春行", "enTitle": "On Lake Qiantang in Spring", "chinese": "孤山寺北贾亭西，\n水面初平[1]云脚低[2]。\n几处早莺争暖树，\n谁家新燕啄春泥。\n乱花渐欲迷人眼，\n浅草才能没马蹄[3]。\n最爱湖东行不足[4]，\n绿杨阴[5]里白沙堤。\n这首诗是公元823年或824年春天，白居易任杭州刺史时的作品。钱塘湖就是西湖，后湖和外湖之间的孤山寺和贾公亭，都是湖中的登临胜地。在水色天光的苍茫中，白云和湖面上荡漾的波澜连成了一片。“几处早莺”，可见并不是处处的黄莺都在争夺向阳的暖树；“谁家新燕”，可见并不是家家燕子都在啄泥衔草，营建新巢。新开的花快要使人眼花缭乱，短短的绿草刚能遮没马蹄。这四句说明时间是早春。而最令人流连忘返的，还是绿柳掩映下的白沙堤。这首诗从“孤山寺”写起，到“白沙堤”结束，从点到面，又从面回到点，章法变化，条理井然，是写西湖的名篇。\n注释：\n[1]水面初平：湖水刚刚和堤岸齐平，形容春水初涨。\n[2]云脚低：浮云很低，看上去与湖面的水波连成一片。\n[3]没（mò）马蹄：遮没马蹄。\n[4]行不足：多次游览也不够；足，满足。\n[5]阴：同“荫”，树荫。", "english": "West of Pavilion Jia and north of Lonely Hill,\nWater brims level with the bank and clouds hang low.\nDisputing for sunny trees, early orioles trill;\nPecking vernal mud in, young swallows come and go.\nA riot of blooms begin to dazzle the eye;\nAmid short grass the horse hooves can barely be seen.\nI love best the east of the lake under the sky:\nThe bank paved with white sand is shaded by willows green.", "poemType": "七言律诗", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">孤山寺北贾亭西，<br>水面初平<sup class=\"note-ref\">[1]</sup>云脚低<sup class=\"note-ref\">[2]</sup>。<br>几处早莺争暖树，<br>谁家新燕啄春泥。<br>乱花渐欲迷人眼，<br>浅草才能没马蹄<sup class=\"note-ref\">[3]</sup>。<br>最爱湖东行不足<sup class=\"note-ref\">[4]</sup>，<br>绿杨阴<sup class=\"note-ref\">[5]</sup>里白沙堤。</p>\n<p class=\"prose\">这首诗是公元823年或824年春天，白居易任杭州刺史时的作品。钱塘湖就是西湖，后湖和外湖之间的孤山寺和贾公亭，都是湖中的登临胜地。在水色天光的苍茫中，白云和湖面上荡漾的波澜连成了一片。“几处早莺”，可见并不是处处的黄莺都在争夺向阳的暖树；</p>\n<p class=\"prose\">“谁家新燕”，可见并不是家家燕子都在啄泥衔草，营建新巢。新开的花快要使人眼花缭乱，短短的绿草刚能遮没马蹄。这四句说明时间是早春。而最令人流连忘返的，还是绿柳掩映下的白沙堤。这首诗从“孤山寺”写起，到“白沙堤”结束，从点到面，又从面回到点，章法变化，条理井然，是写西湖的名篇。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]水面初平：湖水刚刚和堤岸齐平，形容春水初涨。<br>[2]云脚低：浮云很低，看上去与湖面的水波连成一片。<br>[3]没（mò）马蹄：遮没马蹄。<br>[4]行不足：多次游览也不够；足，满足。<br>[5]阴：同“荫”，树荫。</p>", "englishHtml": "<p class=\"poem-lines\">West of Pavilion Jia and north of Lonely Hill,<br>Water brims level with the bank and clouds hang low.<br>Disputing for sunny trees, early orioles trill;<br>Pecking vernal mud in, young swallows come and go.<br>A riot of blooms begin to dazzle the eye;<br>Amid short grass the horse hooves can barely be seen.<br>I love best the east of the lake under the sky:<br>The bank paved with white sand is shaded by willows green.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On Lake Qiantang in Spring,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as mountains, water, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "037", "zhTitle": "春题湖上", "enTitle": "The Lake in Spring", "chinese": "湖上春来似画图，\n乱峰[1]围绕水平铺。\n松排山面千重翠，\n月点波心一颗珠。\n碧毯线头[2]抽早稻，\n青罗裙带展新蒲。\n未能抛得杭州去，\n一半勾留[3]是此湖。\n这首诗作于公元824年春天，作者杭州刺史任期将满之时。第一句是总评。第二句说西湖三面环山，峰峦错落，湖水平静地铺展在群山之间。第三句说山上松树成排，重峦叠翠。第四句说月亮映在湖心，好像一颗珍珠。第五句说早稻长满株行距，绿油油的一片，犹如绿色的地毯。第六句说新长出的嫩绿细长的蒲叶，就像罗裙的青带子一样迎风飘动。最后两句说诗人舍不得离开杭州，一半原因是为了西湖，可见作者对杭州西湖的情深意长。\n注释：\n[1]乱峰：参差错乱的山峰。\n[2]线头：此处指地毯上的绒毛。\n[3]勾留：留恋，不舍。", "english": "What a charming picture when spring comes to the lake!\nAmid the rugged peaks water’s smooth without a break.\nHills upon hills are green with thousands of pine trees,\nThe moon looks like a pearl swimming in waves with ease.\nLike a green carpet early paddy fields undulate,\nNew rushes spread out as silk girdle fascinate.\nFrom fair Hangzhou I cannot tear myself away,\nOn half my heart this lake holds an alluring sway.", "poemType": "七言律诗", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">湖上春来似画图，<br>乱峰<sup class=\"note-ref\">[1]</sup>围绕水平铺。<br>松排山面千重翠，<br>月点波心一颗珠。<br>碧毯线头<sup class=\"note-ref\">[2]</sup>抽早稻，<br>青罗裙带展新蒲。<br>未能抛得杭州去，<br>一半勾留<sup class=\"note-ref\">[3]</sup>是此湖。</p>\n<p class=\"prose\">这首诗作于公元824年春天，作者杭州刺史任期将满之时。第一句是总评。第二句说西湖三面环山，峰峦错落，湖水平静地铺展在群山之间。第三句说山上松树成排，重峦叠翠。第四句说月亮映在湖心，好像一颗珍珠。第五句说早稻长满株行距，绿油油的一片，犹如绿色的地毯。</p>\n<p class=\"prose\">第六句说新长出的嫩绿细长的蒲叶，就像罗裙的青带子一样迎风飘动。最后两句说诗人舍不得离开杭州，一半原因是为了西湖，可见作者对杭州西湖的情深意长。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]乱峰：参差错乱的山峰。<br>[2]线头：此处指地毯上的绒毛。<br>[3]勾留：留恋，不舍。</p>", "englishHtml": "<p class=\"poem-lines\">What a charming picture when spring comes to the lake!<br>Amid the rugged peaks water’s smooth without a break.<br>Hills upon hills are green with thousands of pine trees,<br>The moon looks like a pearl swimming in waves with ease.<br>Like a green carpet early paddy fields undulate,<br>New rushes spread out as silk girdle fascinate.<br>From fair Hangzhou I cannot tear myself away,<br>On half my heart this lake holds an alluring sway.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Lake in Spring,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as mountains, water, moonlight, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "038", "zhTitle": "西湖晚归回望孤山寺赠诸客", "enTitle": "Looking Back at the Lonely Hill", "chinese": "柳湖[1]松岛莲花寺，\n晚动归桡[2]出道场。\n卢橘子[3]低山雨重[4]，\n栟榈叶战水风凉。\n烟波澹荡[5]摇空碧，\n楼殿参差倚夕阳。\n到岸请君回首望，\n蓬莱宫在海中央。\n白居易在杭州时，常同宾客去垂柳掩映的西湖，青松劲立的孤山，莲花盛开的寺院，听僧侣在佛殿讲经，直到傍晚才离开庙堂，坐船回城。途中看到雨后的卢橘的果实把枝压得低垂下来，栟榈树高叶大，俨若凉扇遮径，清风一起，阔叶颤动，似乎感到了水风的清凉。在宽阔的湖面上，轻轻的寒烟似有似无，蓝蓝的湖波共长天一色。随着山势高下而建筑的佛寺楼殿，在夕阳残照下，金光明灭，仿佛神话中的海上蓬莱仙山，而孤山寺中又有蓬莱阁，更使佛地有如仙境。这首诗句句写景，句句含情，给人以情景交融的快感。\n注释：\n[1]柳湖：西湖周边多柳树，故称“柳湖”。\n[2]归桡（ráo）：归船；桡，本意为船桨。\n[3]卢橘子：又名“给客橙”，与橘子近似。\n[4]重（zhònɡ）：沉重。\n[5]澹（dàn）荡：荡漾，使人舒畅。", "english": "on My Way across West Lake\nFrom Lotus Temple, isle of pines in willow-girt lake,\nThe guests come out at dusk the oarsmen’s boat to take.\nAfter the rain, loquats hang heavy on the trees,\nThe waterside palm leaves shiver in the cool breeze.\nThe misty waves seem to blend with the azure sky,\nThe setting sun reddens pavilions low and high.\nWill you, on reaching the shore, turn your head to see\nThe fairy palaces in the midst of the sea?", "poemType": "七言律诗", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">柳湖<sup class=\"note-ref\">[1]</sup>松岛莲花寺，<br>晚动归桡<sup class=\"note-ref\">[2]</sup>出道场。<br>卢橘子<sup class=\"note-ref\">[3]</sup>低山雨重<sup class=\"note-ref\">[4]</sup>，<br>栟榈叶战水风凉。<br>烟波澹荡<sup class=\"note-ref\">[5]</sup>摇空碧，<br>楼殿参差倚夕阳。<br>到岸请君回首望，<br>蓬莱宫在海中央。</p>\n<p class=\"prose\">白居易在杭州时，常同宾客去垂柳掩映的西湖，青松劲立的孤山，莲花盛开的寺院，听僧侣在佛殿讲经，直到傍晚才离开庙堂，坐船回城。途中看到雨后的卢橘的果实把枝压得低垂下来，栟榈树高叶大，俨若凉扇遮径，清风一起，阔叶颤动，似乎感到了水风的清凉。</p>\n<p class=\"prose\">在宽阔的湖面上，轻轻的寒烟似有似无，蓝蓝的湖波共长天一色。随着山势高下而建筑的佛寺楼殿，在夕阳残照下，金光明灭，仿佛神话中的海上蓬莱仙山，而孤山寺中又有蓬莱阁，更使佛地有如仙境。这首诗句句写景，句句含情，给人以情景交融的快感。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]柳湖：西湖周边多柳树，故称“柳湖”。<br>[2]归桡（ráo）：归船；桡，本意为船桨。<br>[3]卢橘子：又名“给客橙”，与橘子近似。<br>[4]重（zhònɡ）：沉重。<br>[5]澹（dàn）荡：荡漾，使人舒畅。</p>", "englishHtml": "<p class=\"poem-lines\">on My Way across West Lake<br>From Lotus Temple, isle of pines in willow-girt lake,<br>The guests come out at dusk the oarsmen’s boat to take.<br>After the rain, loquats hang heavy on the trees,<br>The waterside palm leaves shiver in the cool breeze.<br>The misty waves seem to blend with the azure sky,<br>The setting sun reddens pavilions low and high.<br>Will you, on reaching the shore, turn your head to see<br>The fairy palaces in the midst of the sea?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Looking Back at the Lonely Hill,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as mountains, water, clouds, and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "039", "zhTitle": "杭州春望", "enTitle": "Spring View in Hangzhou", "chinese": "望海楼明照曙霞，\n护江堤[1]白踏晴沙。\n涛声夜入伍员[2]庙，\n柳色春藏苏小家。\n红袖织绫夸柿蒂，\n青旗沽酒趁梨花。\n谁开湖寺西南路？\n草绿裙腰一道斜。\n这首诗是白居易写杭州春景之作。第一联写登楼远望海天瑰丽的景色，旭日东升，霞光万道；钱塘江水，奔流入海；护江长堤，闪着银光。据民间传说，伍子胥因为怨恨吴王，死后驱水为涛，所以第二联说，夜里听见庙中涛声，分外清晰。苏小小是南齐钱塘名妓，这里的“苏小家”代指歌楼舞榭，掩藏在一片青青柳色之中。第三联的“红袖”指织绫的女子，“柿蒂”指绫花纹，“青旗”就是酒旗，代指酒店，“趁梨花”是说，正好赶在梨花开时去饮梨花春酒。最后一联转到西湖，“湖寺”指孤山寺，“西南路”指白沙堤，白堤在一片碧绿的湖洲之中，望之有如裙腰。这首诗写景结合咏古，把自然景色和风物人情结合起来，使景物更加丰富多彩，更加富有诗味。\n注释：\n[1]护江堤：指白沙堤，后人为纪念白居易称白堤。\n[2]伍员：字子胥，春秋时期楚国人。父兄皆被楚平王杀害，遂辗转逃往吴国，他协助吴王先后打败楚国、越国，然而吴王夫差听信谗言，将其杀害。", "english": "Viewed from the Seaside Tower morning clouds look bright,\nAlong the river bank I tread on fine sand white.\nThe General’s Temple hears roaring nocturnal tide,\nSpring dwells in the Beauty’s Bower green willows hide.\nThe red sleeves weave brocade broidered with flowers fine,\nBlue streamers show amid pear blossoms a shop of wine.\nWho opens a southwest road to the temple scene?\nIt slants like a silk girdle around a skirt green.", "poemType": "七言律诗", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">望海楼明照曙霞，<br>护江堤<sup class=\"note-ref\">[1]</sup>白踏晴沙。<br>涛声夜入伍员<sup class=\"note-ref\">[2]</sup>庙，<br>柳色春藏苏小家。<br>红袖织绫夸柿蒂，<br>青旗沽酒趁梨花。<br>谁开湖寺西南路？<br>草绿裙腰一道斜。</p>\n<p class=\"prose\">这首诗是白居易写杭州春景之作。第一联写登楼远望海天瑰丽的景色，旭日东升，霞光万道；钱塘江水，奔流入海；护江长堤，闪着银光。据民间传说，伍子胥因为怨恨吴王，死后驱水为涛，所以第二联说，夜里听见庙中涛声，分外清晰。苏小小是南齐钱塘名妓，这里的“苏小家”代指歌楼舞榭，掩藏在一片青青柳色之中。</p>\n<p class=\"prose\">第三联的“红袖”指织绫的女子，“柿蒂”指绫花纹，“青旗”就是酒旗，代指酒店，“趁梨花”是说，正好赶在梨花开时去饮梨花春酒。最后一联转到西湖，“湖寺”指孤山寺，“西南路”指白沙堤，白堤在一片碧绿的湖洲之中，望之有如裙腰。这首诗写景结合咏古，把自然景色和风物人情结合起来，使景物更加丰富多彩，更加富有诗味。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]护江堤：指白沙堤，后人为纪念白居易称白堤。<br>[2]伍员：字子胥，春秋时期楚国人。父兄皆被楚平王杀害，遂辗转逃往吴国，他协助吴王先后打败楚国、越国，然而吴王夫差听信谗言，将其杀害。</p>", "englishHtml": "<p class=\"poem-lines\">Viewed from the Seaside Tower morning clouds look bright,<br>Along the river bank I tread on fine sand white.<br>The General’s Temple hears roaring nocturnal tide,<br>Spring dwells in the Beauty’s Bower green willows hide.<br>The red sleeves weave brocade broidered with flowers fine,<br>Blue streamers show amid pear blossoms a shop of wine.<br>Who opens a southwest road to the temple scene?<br>It slants like a silk girdle around a skirt green.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Spring View in Hangzhou,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as water, clouds, flowers, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "040", "zhTitle": "别州民", "enTitle": "Farewell to the People of Hangzhou", "chinese": "耆老[1]遮归路，\n壶浆满别筵。\n甘棠[2]无一树，\n那得泪潸然？\n税重多贫户，\n农饥足旱田。\n唯留一湖水，\n与汝救凶年[3]。\n这首诗作于公元824年五月，是作者离杭州时的告别诗。“耆老”指60岁以上的老人，连他们都舍不得作者离开，拦住了他的去路，带来了盛满酒浆的壶和碗，摆下了送别的酒席。作者自谦不是在甘棠树下的草屋里听讼断案的清官，哪里值得老百姓这样感恩戴德，甚至感动得流泪呢？自己不过是怕捐税太重，百姓要过贫穷的日子，担心田地受旱，农民又要挨饿，所以就在钱塘门外修堤贮水，以防旱灾的威胁而已。这首诗写出了作者对人民的深情厚谊以及和群众的鱼水关系。\n注释：\n[1]耆（qí）老：六十称耆，七十称老，指六七十岁的老人。\n[2]甘棠：典故来自西周时期的开国功臣召公。相传他德政仁爱，出巡时为避免惊扰百姓，曾在一棵甘棠树下公正无私地听讼断案，后人遂以甘棠树作为颂扬官员政德之词。\n[3]凶年：干旱灾荒之年。", "english": "Old and young people bar my way,\nFeast tables piled with wine and tray.\nI’ve planted for you no pear tree.\nWhy should you weep to part with me?\nHeavy taxes make you poor grow;\nBarren fields make you hungry go.\nI leave you only a lake clear\nFor you to pass a famine year.", "poemType": "五言律诗", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">耆老<sup class=\"note-ref\">[1]</sup>遮归路，<br>壶浆满别筵。<br>甘棠<sup class=\"note-ref\">[2]</sup>无一树，<br>那得泪潸然？<br>税重多贫户，<br>农饥足旱田。<br>唯留一湖水，<br>与汝救凶年<sup class=\"note-ref\">[3]</sup>。</p>\n<p class=\"prose\">这首诗作于公元824年五月，是作者离杭州时的告别诗。“耆老”指60岁以上的老人，连他们都舍不得作者离开，拦住了他的去路，带来了盛满酒浆的壶和碗，摆下了送别的酒席。作者自谦不是在甘棠树下的草屋里听讼断案的清官，哪里值得老百姓这样感恩戴德，甚至感动得流泪呢？</p>\n<p class=\"prose\">自己不过是怕捐税太重，百姓要过贫穷的日子，担心田地受旱，农民又要挨饿，所以就在钱塘门外修堤贮水，以防旱灾的威胁而已。这首诗写出了作者对人民的深情厚谊以及和群众的鱼水关系。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]耆（qí）老：六十称耆，七十称老，指六七十岁的老人。<br>[2]甘棠：典故来自西周时期的开国功臣召公。相传他德政仁爱，出巡时为避免惊扰百姓，曾在一棵甘棠树下公正无私地听讼断案，后人遂以甘棠树作为颂扬官员政德之词。<br>[3]凶年：干旱灾荒之年。</p>", "englishHtml": "<p class=\"poem-lines\">Old and young people bar my way,<br>Feast tables piled with wine and tray.<br>I’ve planted for you no pear tree.<br>Why should you weep to part with me?<br>Heavy taxes make you poor grow;<br>Barren fields make you hungry go.<br>I leave you only a lake clear<br>For you to pass a famine year.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Farewell to the People of Hangzhou,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as water, trees, homecoming, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "041", "zhTitle": "白云泉", "enTitle": "White Cloud Fountain", "chinese": "天平山上白云泉，\n云自无心水自闲。\n何必奔冲山下去？\n更添波浪向人间！\n白云泉号称“吴中第一水”，在苏州市西二十里的天平山中。这首诗是白居易于公元825年任苏州刺史期间所作。诗中写到白云随风飘荡，舒卷自如，无牵无挂；泉水深深潺流，自由奔泻，从容自得。诗人强调云水的自由自在、自得其乐，逍遥而惬意，有一种清静无为、与世无争的思想。所以他问清清的泉水，何必向山下奔腾飞泻而去，给纷扰多事的人间推波助澜？这首诗集中反映了诗人随遇而安、出世归隐的思想，表现了他人生观的一个侧面。", "english": "Behold the White Cloud Fountain on the Sky-blue Mountain!\nWhite clouds enjoy free pleasure; water enjoys leisure.\nWhy should the torrent dash down from the mountain high\nAnd overflow the human world with waves far and nigh?", "poemType": "七言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">天平山上白云泉，<br>云自无心水自闲。<br>何必奔冲山下去？<br>更添波浪向人间！</p>\n<p class=\"prose\">白云泉号称“吴中第一水”，在苏州市西二十里的天平山中。这首诗是白居易于公元825年任苏州刺史期间所作。诗中写到白云随风飘荡，舒卷自如，无牵无挂；泉水深深潺流，自由奔泻，从容自得。诗人强调云水的自由自在、自得其乐，逍遥而惬意，有一种清静无为、与世无争的思想。</p>\n<p class=\"prose\">所以他问清清的泉水，何必向山下奔腾飞泻而去，给纷扰多事的人间推波助澜？这首诗集中反映了诗人随遇而安、出世归隐的思想，表现了他人生观的一个侧面。</p>", "englishHtml": "<p class=\"poem-lines\">Behold the White Cloud Fountain on the Sky-blue Mountain!<br>White clouds enjoy free pleasure; water enjoys leisure.<br>Why should the torrent dash down from the mountain high<br>And overflow the human world with waves far and nigh?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “White Cloud Fountain,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as mountains, water, and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "042", "zhTitle": "秋雨夜眠", "enTitle": "Sleeping on a Rainy Autumn Night", "chinese": "凉冷三秋[1]夜，\n安闲一老翁。\n卧迟灯灭后，\n睡美雨声中。\n灰宿[2]温瓶火，\n香添暖被笼。\n晓[3]晴寒未起，\n霜叶满阶红。\n这首诗大约是公元832年，60岁的白居易任河南尹时所作。第一句用气候给人的“凉冷”感来形容深秋之夜。第二句刻画出一个安适闲淡的老人形象。老人不喜欢早上床，免得半夜醒来；因为心无所虑，所以在雨夜睡得安稳，一直睡到烘瓶里的燃料化为灰烬，还要烧香使被笼温暖。第二天早晨虽然晴了，但是寒气未消，不久前还红似二月花的树叶，一夜之间就被秋风秋雨无情地扫得飘零满阶。诗中反映了诗人暮年政治上心灰意懒，生活上孤寂闲散的状况。\n注释：\n[1]三秋：即秋天。七月为孟秋，八月为仲秋，九月为季秋，合称三秋。\n[2]宿（xiǔ）：夜。\n[3]晓：拂晓，刚刚天亮的时候。", "english": "Cold, cold late autumn night,\nAn old, old man with ease\nPuts out the candlelight,\nSleeps to hear rain and breeze.\nAshes keep fire awake;\nIncense perfumes the bed.\nHe won’t rise at daybreak;\nMaple leaves dye steps red.", "poemType": "五言律诗", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">凉冷三秋<sup class=\"note-ref\">[1]</sup>夜，<br>安闲一老翁。<br>卧迟灯灭后，<br>睡美雨声中。<br>灰宿<sup class=\"note-ref\">[2]</sup>温瓶火，<br>香添暖被笼。<br>晓<sup class=\"note-ref\">[3]</sup>晴寒未起，<br>霜叶满阶红。</p>\n<p class=\"prose\">这首诗大约是公元832年，60岁的白居易任河南尹时所作。第一句用气候给人的“凉冷”感来形容深秋之夜。第二句刻画出一个安适闲淡的老人形象。老人不喜欢早上床，免得半夜醒来；因为心无所虑，所以在雨夜睡得安稳，一直睡到烘瓶里的燃料化为灰烬，还要烧香使被笼温暖。</p>\n<p class=\"prose\">第二天早晨虽然晴了，但是寒气未消，不久前还红似二月花的树叶，一夜之间就被秋风秋雨无情地扫得飘零满阶。诗中反映了诗人暮年政治上心灰意懒，生活上孤寂闲散的状况。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]三秋：即秋天。七月为孟秋，八月为仲秋，九月为季秋，合称三秋。<br>[2]宿（xiǔ）：夜。<br>[3]晓：拂晓，刚刚天亮的时候。</p>", "englishHtml": "<p class=\"poem-lines\">Cold, cold late autumn night,<br>An old, old man with ease<br>Puts out the candlelight,<br>Sleeps to hear rain and breeze.<br>Ashes keep fire awake;<br>Incense perfumes the bed.<br>He won’t rise at daybreak;<br>Maple leaves dye steps red.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Sleeping on a Rainy Autumn Night,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a five-character regulated verse, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "043", "zhTitle": "与梦得沽酒闲饮且约后期", "enTitle": "Drinking Together with Liu Yuxi", "chinese": "少时犹不忧生计，\n老后谁能惜酒钱？\n共把十千[3]沽一斗，\n相看七十欠三年。\n闲征雅令穷经史，\n醉听清吟胜管弦。\n更待菊黄[4]家酿熟，\n共君一醉一陶然[5]。\n此时，白居易和刘禹锡（梦得）同在洛阳，白居易任太子少傅，是个闲职。二人饮酒闲谈，回首平生，难免有“早岁那知世事艰”的感慨。两人争着付钱买酒，相看都已67岁，虽有高雅情怀，却只能引经据史，行行酒令，听听知己的“清吟”奏出心灵的乐章而已。二人相约等到重阳佳节，家酿的菊花酒熟了，再到家里会饮，更能消愁解闷。全诗言简意富，语淡情长，见出炉火纯青的艺术功力。\n注释：\n[1]沽酒：买酒。\n[2]后期：后会之期，再次相聚的日期。\n[3]十千：十千钱，极言酒价之高以表二人尽兴豪饮。\n[4]菊黄：菊花盛开的时节，通常指代重阳节。\n[5]陶然：闲适愉悦的样子。", "english": "While young, I was not worried about livelihood.\nNow old, how could I grudge money for buying wine?\nLet’s spend ten thousand coins for a jarful of drink good!\nLooking in face, two years more we’ll be sixty-nine.\nWe read and play the drinkers’ wager game at leisure;\nDrunk, we listen to verse better than music light.\nWhen chrysanthemums yellow, may I have the pleasure\nTo invite you to drink my home-brew with delight?", "poemType": "七言律诗", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">少时犹不忧生计，<br>老后谁能惜酒钱？<br>共把十千<sup class=\"note-ref\">[3]</sup>沽一斗，<br>相看七十欠三年。<br>闲征雅令穷经史，<br>醉听清吟胜管弦。<br>更待菊黄<sup class=\"note-ref\">[4]</sup>家酿熟，<br>共君一醉一陶然<sup class=\"note-ref\">[5]</sup>。</p>\n<p class=\"prose\">此时，白居易和刘禹锡（梦得）同在洛阳，白居易任太子少傅，是个闲职。二人饮酒闲谈，回首平生，难免有“早岁那知世事艰”的感慨。两人争着付钱买酒，相看都已67岁，虽有高雅情怀，却只能引经据史，行行酒令，听听知己的“清吟”奏出心灵的乐章而已。</p>\n<p class=\"prose\">二人相约等到重阳佳节，家酿的菊花酒熟了，再到家里会饮，更能消愁解闷。全诗言简意富，语淡情长，见出炉火纯青的艺术功力。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]沽酒：买酒。<br>[2]后期：后会之期，再次相聚的日期。<br>[3]十千：十千钱，极言酒价之高以表二人尽兴豪饮。<br>[4]菊黄：菊花盛开的时节，通常指代重阳节。<br>[5]陶然：闲适愉悦的样子。</p>", "englishHtml": "<p class=\"poem-lines\">While young, I was not worried about livelihood.<br>Now old, how could I grudge money for buying wine?<br>Let’s spend ten thousand coins for a jarful of drink good!<br>Looking in face, two years more we’ll be sixty-nine.<br>We read and play the drinkers’ wager game at leisure;<br>Drunk, we listen to verse better than music light.<br>When chrysanthemums yellow, may I have the pleasure<br>To invite you to drink my home-brew with delight?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Drinking Together with Liu Yuxi,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as wine, homecoming, and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "044", "zhTitle": "览卢子蒙侍御旧诗，多与微之唱和，感今伤昔，因赠子蒙，题于卷后", "enTitle": "On Reading Lu Zimeng’s Old Poems Written", "chinese": "昔闻元九咏君诗，\n恨与卢君相识迟。\n今日逢君开旧卷，\n卷中多道赠微之。\n相看泪眼情难说，\n别有伤心事岂知？\n闻道[1]咸阳坟上树，\n已抽三丈白杨枝。\n白居易晚年与卢子蒙侍御交往，公元841年翻阅卢子蒙的旧诗集，发现不少诗是赠给元稹（元九，字微之）的，而元稹去世已经10年了。白居易不禁心酸，就写下了这首诗。头两句把30年前与元稹论诗衡文、谈笑风生的情景，重新展现在眼前。三、四句写今日与卢子蒙聚首，共同批阅他赠元稹的诗。五、六句写两个老人你望着我，我望着你，却都不说一句话。最后说，元稹坟上的白杨树枝都已三丈长了，树犹如此，人何以堪？这首七律悼念亡友，是一首情真意深的作品。\n注释：\n[1]闻道：听闻，听说。", "english": "in the Same Rhyme Schemes as Yuan Zhen’s Poems\nI have read Yuan Zhen’s verse on you of early date,\nAnd I regret not to have known you till so late.\nToday we read your verse together to the end,\nI find so many poems on our deceased friend.\nLooking at you in tears, what can I say at last?\nWho else can know what broke my poor heart in the past?\nI’ve heard say poplar trees in old capital loom\nWith branches thirty feet long over our friend’s tomb.", "poemType": "七言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">昔闻元九咏君诗，<br>恨与卢君相识迟。<br>今日逢君开旧卷，<br>卷中多道赠微之。<br>相看泪眼情难说，<br>别有伤心事岂知？<br>闻道<sup class=\"note-ref\">[1]</sup>咸阳坟上树，<br>已抽三丈白杨枝。</p>\n<p class=\"prose\">白居易晚年与卢子蒙侍御交往，公元841年翻阅卢子蒙的旧诗集，发现不少诗是赠给元稹（元九，字微之）的，而元稹去世已经10年了。白居易不禁心酸，就写下了这首诗。头两句把30年前与元稹论诗衡文、谈笑风生的情景，重新展现在眼前。</p>\n<p class=\"prose\">三、四句写今日与卢子蒙聚首，共同批阅他赠元稹的诗。五、六句写两个老人你望着我，我望着你，却都不说一句话。最后说，元稹坟上的白杨树枝都已三丈长了，树犹如此，人何以堪？这首七律悼念亡友，是一首情真意深的作品。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]闻道：听闻，听说。</p>", "englishHtml": "<p class=\"poem-lines\">in the Same Rhyme Schemes as Yuan Zhen’s Poems<br>I have read Yuan Zhen’s verse on you of early date,<br>And I regret not to have known you till so late.<br>Today we read your verse together to the end,<br>I find so many poems on our deceased friend.<br>Looking at you in tears, what can I say at last?<br>Who else can know what broke my poor heart in the past?<br>I’ve heard say poplar trees in old capital loom<br>With branches thirty feet long over our friend’s tomb.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On Reading Lu Zimeng’s Old Poems Written,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Bai Juyi&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as trees and age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "045", "zhTitle": "红鹦鹉", "enTitle": "The Red Cockatoo", "chinese": "安南远进红鹦鹉，\n色似桃花语似人。\n文章辩慧皆如此，\n笼槛[1]何年出得身？\n这是白居易以议论入诗的一首七言绝句。第一句叙事，说红鹦鹉是远方进贡的珍禽。第二句状物，说明鹦鹉的色彩如花，言语似人。三、四句议论，说和红鹦鹉一样光彩夺目、能言善辩的知识分子，其实也和红鹦鹉一样关在笼子里，什么时候才能飞出牢笼，恢复自由，一展宏图呢？这首诗借物起兴，为天下不得志的读书人，吐出了一口不平的怨气。\n注释：\n[1]笼槛：囚困禽兽之处，此处指鸟笼。", "english": "Annam has sent us from afar a red cockatoo;\nColored like the peach blossom, it speaks as men do.\nBut it is shut up in a cage with bar on bar\nJust as the learned or eloquent scholars are.", "poemType": "七言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">安南远进红鹦鹉，<br>色似桃花语似人。<br>文章辩慧皆如此，<br>笼槛<sup class=\"note-ref\">[1]</sup>何年出得身？</p>\n<p class=\"prose\">这是白居易以议论入诗的一首七言绝句。第一句叙事，说红鹦鹉是远方进贡的珍禽。第二句状物，说明鹦鹉的色彩如花，言语似人。三、四句议论，说和红鹦鹉一样光彩夺目、能言善辩的知识分子，其实也和红鹦鹉一样关在笼子里，什么时候才能飞出牢笼，恢复自由，一展宏图呢？</p>\n<p class=\"prose\">这首诗借物起兴，为天下不得志的读书人，吐出了一口不平的怨气。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]笼槛：囚困禽兽之处，此处指鸟笼。</p>", "englishHtml": "<p class=\"poem-lines\">Annam has sent us from afar a red cockatoo;<br>Colored like the peach blossom, it speaks as men do.<br>But it is shut up in a cage with bar on bar<br>Just as the learned or eloquent scholars are.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Red Cockatoo,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "046", "zhTitle": "昼卧", "enTitle": "Depression", "chinese": "抱枕无言语，\n空房独悄然[1]。\n谁知尽日卧，\n非病亦非眠。\n这是白居易写孤寂心情的一首小诗。第一句写人，“抱枕”可见是独卧，“无言语”可见寂寞。第二句写境，“空房”更增加孤独之感，“悄然”更增加寂寞之情。第三句转为问话，“尽日卧”可见时间之长，“谁知”可见无人知晓，更加显得孤寂。第四句从反面作答，“非病”说明不是身体不好，“非眠”说明不是需要卧床；可见只是心情不佳，但又不便明说，而是有难言之隐。\n注释：\n[1]悄（qiǎo）然：形容寂静无声。", "english": "Hugging my pillow, what to say?\nMy empty room’s in silence deep.\nWho knows I lie in bed all day,\nNot ill and not even asleep?", "poemType": "五言绝句", "poemTheme": "隐逸闲适", "chineseHtml": "<p class=\"poem-lines\">抱枕无言语，<br>空房独悄然<sup class=\"note-ref\">[1]</sup>。<br>谁知尽日卧，<br>非病亦非眠。</p>\n<p class=\"prose\">这是白居易写孤寂心情的一首小诗。第一句写人，“抱枕”可见是独卧，“无言语”可见寂寞。第二句写境，“空房”更增加孤独之感，“悄然”更增加寂寞之情。第三句转为问话，“尽日卧”可见时间之长，“谁知”可见无人知晓，更加显得孤寂。</p>\n<p class=\"prose\">第四句从反面作答，“非病”说明不是身体不好，“非眠”说明不是需要卧床；可见只是心情不佳，但又不便明说，而是有难言之隐。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]悄（qiǎo）然：形容寂静无声。</p>", "englishHtml": "<p class=\"poem-lines\">Hugging my pillow, what to say?<br>My empty room’s in silence deep.<br>Who knows I lie in bed all day,<br>Not ill and not even asleep?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Depression,” the poem presents retreat or solitude as a way to stand apart from worldly pressure.</p>\n<p class=\"commentary\">As a five-character quatrain, it lets Bai Juyi&#x27;s imagination enlarge the scene beyond ordinary description. Key images such as age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "047", "zhTitle": "病中", "enTitle": "Illness", "chinese": "交亲[1]不要苦相忧，\n亦拟时时强出游。\n但有心情何用脚？\n陆乘肩舆[2]水乘舟。\n这首七言绝句是作者答复友人探问病情的小诗。第一句不写友人慰问之情，反劝友人不必担忧，可见作者的乐天精神。第二句说明自己只要可能的话，还是时时想出去游玩的。第三句说明精神能够战胜物质困难，只要自己想走，并不一定需要步行。为什么呢？第四句答道：在陆地上可以坐轿，在水上可以乘船。这首小诗表现了作者的达观。\n注释：\n[1]交亲：亲戚朋友。\n[2]肩舆（yú）：即轿子。", "english": "My bosom friends need not worry too much for me;\nSomehow I’ll take a walk if from illness I’m free.\nWhen I want to go far, I need not use my feet;\nSedan by land and boat on water are as fleet.", "poemType": "七言绝句", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">交亲<sup class=\"note-ref\">[1]</sup>不要苦相忧，<br>亦拟时时强出游。<br>但有心情何用脚？<br>陆乘肩舆<sup class=\"note-ref\">[2]</sup>水乘舟。</p>\n<p class=\"prose\">这首七言绝句是作者答复友人探问病情的小诗。第一句不写友人慰问之情，反劝友人不必担忧，可见作者的乐天精神。第二句说明自己只要可能的话，还是时时想出去游玩的。第三句说明精神能够战胜物质困难，只要自己想走，并不一定需要步行。为什么呢？</p>\n<p class=\"prose\">第四句答道：在陆地上可以坐轿，在水上可以乘船。这首小诗表现了作者的达观。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]交亲：亲戚朋友。<br>[2]肩舆（yú）：即轿子。</p>", "englishHtml": "<p class=\"poem-lines\">My bosom friends need not worry too much for me;<br>Somehow I’ll take a walk if from illness I’m free.<br>When I want to go far, I need not use my feet;<br>Sedan by land and boat on water are as fleet.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Illness,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as water give the poem its visual texture and emotional temperature.</p>"}, {"num": "048", "zhTitle": "杨柳枝词", "enTitle": "Song of Willow Branch", "chinese": "一树春风千万枝，\n嫩于金色软于丝。\n永丰西角荒园里，\n尽日无人属阿谁[1]？\n公元842年，白居易以刑部尚书退休后，寓居洛阳，有姬人樊素善歌，小蛮善舞，白居易写过诗句：“樱桃樊素口，杨柳小蛮腰。”这首词一说是为小蛮而写，一说只是写对人才埋没的感慨。第一句说春风吹拂，千丝万缕的柳枝随风起舞。第二句写柳枝绽出细叶嫩芽，望去一片嫩黄，比丝还要柔软。这两句把杨柳的生机横溢、秀色照人、轻盈袅娜，写得极为生动，有人认为是写小蛮舞姿之美。后两句一转，说杨柳长在永丰坊西角的荒园里，又有谁来一顾呢？只好终日寂寞了。有人认为白居易担心身后小蛮的处境，颇有为浔阳江琵琶女一洒同情泪之感。\n注释：\n[1]阿（ā）谁：唐宋时期口语，即“谁”，何人。", "english": "A tree of million branches sways in breeze of spring,\nMore tender and more soft than golden silk string by string.\nIn western corner of a garden in decay,\nWho would come to admire its beauty all the day?", "poemType": "七言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">一树春风千万枝，<br>嫩于金色软于丝。<br>永丰西角荒园里，<br>尽日无人属阿谁<sup class=\"note-ref\">[1]</sup>？</p>\n<p class=\"prose\">公元842年，白居易以刑部尚书退休后，寓居洛阳，有姬人樊素善歌，小蛮善舞，白居易写过诗句：“樱桃樊素口，杨柳小蛮腰。”这首词一说是为小蛮而写，一说只是写对人才埋没的感慨。第一句说春风吹拂，千丝万缕的柳枝随风起舞。第二句写柳枝绽出细叶嫩芽，望去一片嫩黄，比丝还要柔软。</p>\n<p class=\"prose\">这两句把杨柳的生机横溢、秀色照人、轻盈袅娜，写得极为生动，有人认为是写小蛮舞姿之美。后两句一转，说杨柳长在永丰坊西角的荒园里，又有谁来一顾呢？只好终日寂寞了。有人认为白居易担心身后小蛮的处境，颇有为浔阳江琵琶女一洒同情泪之感。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]阿（ā）谁：唐宋时期口语，即“谁”，何人。</p>", "englishHtml": "<p class=\"poem-lines\">A tree of million branches sways in breeze of spring,<br>More tender and more soft than golden silk string by string.<br>In western corner of a garden in decay,<br>Who would come to admire its beauty all the day?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Song of Willow Branch,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "049", "zhTitle": "忆江南", "enTitle": "Fair South Recalled", "chinese": "江南好，\n风景旧曾谙[2]。\n日出江花红胜火，\n春来江水绿如蓝。\n能不忆江南？\n公元822—826年，白居易先后任杭州、苏州刺史。回洛阳12年后（838），在67岁时，他写了三首《忆江南》词，这里选的是第一首。词一开头就说江南好，所以最后说不能不回忆。江南好并不是听人说，而是当年亲身感受到、体验过的。春来百花盛开，已极红艳，红日普照，更是红得耀眼；春江水绿，绿得胜过蓝草（蓝草叶子可制青绿染料）。由此可以看出白居易对大好河山的热爱。\n注释：\n[1]忆江南：本为唐代教坊曲名，后用作词牌名。\n[2]谙（ān）：熟悉。", "english": "Fair Southern shore\nWith scenes I much adore,\nAt sunrise riverside flowers more red than fire,\nIn spring green river waves grow as blue as sapphire,\nWhich I can’t but admire.", "poemType": "乐府/古体", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">江南好，<br>风景旧曾谙<sup class=\"note-ref\">[2]</sup>。<br>日出江花红胜火，<br>春来江水绿如蓝。<br>能不忆江南？</p>\n<p class=\"prose\">公元822—826年，白居易先后任杭州、苏州刺史。回洛阳12年后（838），在67岁时，他写了三首《忆江南》词，这里选的是第一首。词一开头就说江南好，所以最后说不能不回忆。江南好并不是听人说，而是当年亲身感受到、体验过的。</p>\n<p class=\"prose\">春来百花盛开，已极红艳，红日普照，更是红得耀眼；春江水绿，绿得胜过蓝草（蓝草叶子可制青绿染料）。由此可以看出白居易对大好河山的热爱。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]忆江南：本为唐代教坊曲名，后用作词牌名。<br>[2]谙（ān）：熟悉。</p>", "englishHtml": "<p class=\"poem-lines\">Fair Southern shore<br>With scenes I much adore,<br>At sunrise riverside flowers more red than fire,<br>In spring green river waves grow as blue as sapphire,<br>Which I can’t but admire.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Fair South Recalled,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as water and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "050", "zhTitle": "长相思", "enTitle": "Everlasting Longing", "chinese": "汴水流，\n泗水流，\n流到瓜洲古渡头。\n吴山[2]点点愁。\n思悠悠，\n恨悠悠，\n恨到归时方始休。\n月明人倚楼。\n《长相思》是一首怀人念远的抒情小词，写妻子在月明之夜独自倚楼，望着汴水和泗水向南流去，想到远在江南的丈夫久久不归，就不免积相思为怨恨了。妻子可能是在徐州一带。唐代汴水由汴州（开封）流经徐州，与发源于山东的泗水汇合，转入运河，再向南流到扬州，在瓜洲流入长江。瓜洲渡口在唐代是南北交通的要冲。面带点点愁容的吴山反映了妻子柔肠寸断的相思之情，这种相思无穷无尽，像悠悠不断的汴水和泗水一样，她一直从月出等到月落，要等到丈夫回家才能罢休。\n注释：\n[1]长相思：词牌名，取自南朝乐府“上言长相思，下言久离别”一句，多写男女相思之情。\n[2]吴山：位于今浙江省杭州市，春秋时期为吴国南界。", "english": "See Northern river flow,\nAnd Western river flow!\nBy Melon Islet, mingling waves, they go,\nThe Southern hills dotted with woe.\nO how can I forget?\nHow can I not regret?\nMy deep sorrow will last till with you I have met,\nWaiting from moonrise to moonset.", "poemType": "乐府/古体", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">汴水流，<br>泗水流，<br>流到瓜洲古渡头。<br>吴山<sup class=\"note-ref\">[2]</sup>点点愁。<br>思悠悠，<br>恨悠悠，<br>恨到归时方始休。<br>月明人倚楼。</p>\n<p class=\"prose\">《长相思》是一首怀人念远的抒情小词，写妻子在月明之夜独自倚楼，望着汴水和泗水向南流去，想到远在江南的丈夫久久不归，就不免积相思为怨恨了。妻子可能是在徐州一带。唐代汴水由汴州（开封）流经徐州，与发源于山东的泗水汇合，转入运河，再向南流到扬州，在瓜洲流入长江。</p>\n<p class=\"prose\">瓜洲渡口在唐代是南北交通的要冲。面带点点愁容的吴山反映了妻子柔肠寸断的相思之情，这种相思无穷无尽，像悠悠不断的汴水和泗水一样，她一直从月出等到月落，要等到丈夫回家才能罢休。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]长相思：词牌名，取自南朝乐府“上言长相思，下言久离别”一句，多写男女相思之情。<br>[2]吴山：位于今浙江省杭州市，春秋时期为吴国南界。</p>", "englishHtml": "<p class=\"poem-lines\">See Northern river flow,<br>And Western river flow!<br>By Melon Islet, mingling waves, they go,<br>The Southern hills dotted with woe.<br>O how can I forget?<br>How can I not regret?<br>My deep sorrow will last till with you I have met,<br>Waiting from moonrise to moonset.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Everlasting Longing,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as mountains, water, moonlight, and homecoming give the poem its visual texture and emotional temperature.</p>"}];
    const activeStorageKey = "baijuyi-reader-active-index";
    const originalStorageKey = "baijuyi-reader-original-hidden";
    let active = 0;
    let scale = Number(localStorage.getItem("baijuyi-reader-scale") || "0");
    let originalHidden = localStorage.getItem(originalStorageKey) === "1";

    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const title = document.getElementById("title");
    const enTitle = document.getElementById("enTitle");
    const poemType = document.getElementById("poemType");
    const poemTheme = document.getElementById("poemTheme");
    const chinese = document.getElementById("chinese");
    const english = document.getElementById("english");
    const toggleOriginal = document.getElementById("toggleOriginal");
    const leftPane = document.getElementById("leftPane");
    const rightPane = document.getElementById("rightPane");
    const progress = document.getElementById("progress");
    const wordPopover = document.getElementById("wordPopover");
    const wordPopoverWord = document.getElementById("wordPopoverWord");
    const wordZhLabel = document.getElementById("wordZhLabel");
    const wordEnLabel = document.getElementById("wordEnLabel");
    const wordPinyinLabel = document.getElementById("wordPinyinLabel");
    const wordContextLabel = document.getElementById("wordContextLabel");
    const wordPopoverZh = document.getElementById("wordPopoverZh");
    const wordPopoverEn = document.getElementById("wordPopoverEn");
    const wordPopoverPinyin = document.getElementById("wordPopoverPinyin");
    const wordPopoverContext = document.getElementById("wordPopoverContext");
    const wordPopoverClose = document.getElementById("wordPopoverClose");

    function applyScale() {
      document.documentElement.style.setProperty("--body-size", `${19 + scale}px`);
      document.documentElement.style.setProperty("--poem-size", `${23 + scale}px`);
      document.documentElement.style.setProperty("--en-size", `${23 + scale}px`);
      localStorage.setItem("baijuyi-reader-scale", String(scale));
    }

    function applyOriginalVisibility() {
      chinese.classList.toggle("memorize-hidden", originalHidden);
      toggleOriginal.textContent = originalHidden ? "显原文" : "藏原文";
      toggleOriginal.title = originalHidden ? "显示原文核对" : "隐藏原文用于背诵";
      localStorage.setItem(originalStorageKey, originalHidden ? "1" : "0");
    }

    function renderList(filter = "") {
      const q = filter.trim().toLowerCase();
      list.innerHTML = "";
      poems.forEach((poem, index) => {
        if (q && !`${poem.zhTitle} ${poem.enTitle} ${poem.poemType} ${poem.poemTheme}`.toLowerCase().includes(q)) return;
        const button = document.createElement("button");
        button.className = "poem-link" + (index === active ? " active" : "");
        button.innerHTML = `<span class="num">${poem.num}</span><span><span class="link-row"><span class="link-title">${poem.zhTitle}</span><span class="type-pill">${poem.poemType}</span><span class="type-pill theme-pill">${poem.poemTheme}</span></span><span class="link-en">${poem.enTitle}</span></span>`;
        button.addEventListener("click", () => showPoem(index));
        list.appendChild(button);
      });
    }

    function showPoem(index) {
      active = Math.max(0, Math.min(poems.length - 1, index));
      localStorage.setItem(activeStorageKey, String(active));
      const poem = poems[active];
      title.textContent = `${poem.num}. ${poem.zhTitle}`;
      enTitle.textContent = poem.enTitle;
      poemType.textContent = poem.poemType;
      poemTheme.textContent = poem.poemTheme;
      chinese.innerHTML = poem.chineseHtml;
      english.innerHTML = poem.englishHtml;
      applyOriginalVisibility();
      leftPane.scrollTop = 0;
      rightPane.scrollTop = 0;
      progress.style.width = `${((active + 1) / poems.length) * 100}%`;
      renderList(search.value);
      const current = list.querySelector(".active");
      if (current) current.scrollIntoView({ block: "nearest" });
      hideWordPopover();
    }

    function normalizeSelection(value, sourceLanguage) {
      const cleaned = value
        .trim()
