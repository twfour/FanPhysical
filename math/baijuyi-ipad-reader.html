<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>许渊冲译白居易诗选｜iPad 横屏对照阅读</title>
  <style>
    :root {
      --ink: #28231b;
      --muted: #756d60;
      --paper: #f8f1e4;
      --paper-deep: #eee0c7;
      --panel: rgba(255, 250, 239, .88);
      --line: rgba(80, 61, 33, .18);
      --accent: #9b3f24;
      --accent-2: #2f5d50;
      --shadow: 0 22px 70px rgba(56, 38, 16, .16);
      --body-size: 19px;
      --body-leading: 1.86;
      --poem-size: 23px;
      --en-size: calc(var(--body-size) + 4px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(155, 63, 36, .10), transparent 31%),
        radial-gradient(circle at 84% 18%, rgba(47, 93, 80, .11), transparent 28%),
        linear-gradient(135deg, #fbf5e8 0%, #f2e3c9 46%, #ead8b8 100%);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Times New Roman", serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .38;
      background-image:
        linear-gradient(rgba(72, 50, 22, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 50, 22, .035) 1px, transparent 1px);
      background-size: 28px 28px, 28px 28px;
      mix-blend-mode: multiply;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(220px, 24vw) 1fr;
      gap: 14px;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    .sidebar, .reader {
      position: relative;
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      border-radius: 14px 6px 6px 14px;
      overflow: hidden;
    }

    .brand {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0));
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-weight: 700;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: clamp(26px, 3.1vw, 42px);
      font-weight: 650;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .tool, .nav-button {
      appearance: none;
      border: 1px solid rgba(80, 61, 33, .22);
      background: rgba(255, 255, 255, .42);
      color: var(--ink);
      border-radius: 8px;
      min-height: 38px;
      font: 650 13px/1 "Avenir Next", "Helvetica Neue", sans-serif;
      cursor: pointer;
    }

    .tool:active, .nav-button:active, .poem-link:active {
      transform: translateY(1px);
    }

    .search-wrap {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: 100%;
      height: 40px;
      border: 1px solid rgba(80, 61, 33, .22);
      border-radius: 8px;
      padding: 0 12px;
      background: rgba(255, 255, 255, .58);
      color: var(--ink);
      font-size: 15px;
      outline: none;
    }

    .list {
      overflow: auto;
      padding: 8px;
    }

    .poem-link {
      width: 100%;
      border: 0;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 8px;
      align-items: start;
      padding: 10px 9px;
      margin: 2px 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .poem-link.active {
      background: #f0ddbb;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .num {
      color: var(--accent);
      font: 700 12px/1.5 "Avenir Next", sans-serif;
    }

    .link-title {
      display: block;
      font-size: 15px;
      line-height: 1.25;
      white-space: normal;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .type-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 7px;
      border: 1px solid rgba(155, 63, 36, .22);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(155, 63, 36, .07);
      font: 650 11px/1 "Avenir Next", "Helvetica Neue", sans-serif;
      white-space: nowrap;
    }

    .theme-pill {
      border-color: rgba(47, 93, 80, .24);
      color: var(--accent-2);
      background: rgba(47, 93, 80, .08);
    }

    .link-en {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font: 12px/1.25 "Georgia", serif;
    }

    .sidebar-footer {
      padding: 10px 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font: 12px/1.4 "Avenir Next", sans-serif;
    }

    .reader {
      border-radius: 6px 14px 14px 6px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .reader-header {
      min-height: 84px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(155,63,36,.09), transparent 38%),
        rgba(255,255,255,.22);
    }

    .current-title {
      margin: 0;
      font-size: clamp(25px, 3vw, 40px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .current-en {
      margin: 5px 0 0;
      color: var(--muted);
      font: italic 18px/1.25 Georgia, serif;
    }

    .current-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .nav {
      display: flex;
      gap: 8px;
    }

    .nav-button {
      min-width: 44px;
      font-size: 18px;
    }

    .columns {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .92fr);
      gap: 0;
      overflow: hidden;
    }

    .column {
      min-width: 0;
      overflow: auto;
      padding: 28px clamp(22px, 3vw, 44px) 60px;
      scroll-behavior: smooth;
    }

    .column.left {
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 239, .38);
    }

    .column.right {
      background: rgba(255, 255, 255, .28);
    }

    .column-label {
      position: sticky;
      top: -28px;
      z-index: 1;
      margin: -28px 0 22px;
      padding: 16px 0 12px;
      color: var(--accent);
      background: linear-gradient(180deg, rgba(255,250,239,.97), rgba(255,250,239,.78));
      font: 750 12px/1 "Avenir Next", sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .right .column-label {
      color: var(--accent-2);
      background: linear-gradient(180deg, rgba(250,249,243,.97), rgba(250,249,243,.76));
    }

    .poem-lines {
      margin: 0 0 24px;
      font-size: var(--poem-size);
      line-height: 1.78;
      letter-spacing: 0;
    }

    #chinese.memorize-hidden .poem-lines {
      position: relative;
      min-height: 118px;
      padding: 18px;
      border: 1px dashed rgba(155, 63, 36, .28);
      border-radius: 8px;
      color: transparent;
      text-shadow: none;
      user-select: none;
      background:
        linear-gradient(135deg, rgba(155, 63, 36, .06), rgba(47, 93, 80, .05)),
        rgba(255, 252, 244, .54);
    }

    #chinese.memorize-hidden .poem-lines .note-ref {
      visibility: hidden;
    }

    #chinese.memorize-hidden .poem-lines::after {
      content: "原文已隐藏，先背诵，再显示核对";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      color: var(--muted);
      font: 750 15px/1.5 "Avenir Next", "Helvetica Neue", sans-serif;
      text-align: center;
    }

    .note-ref {
      font-size: .52em;
      line-height: 0;
      vertical-align: super;
      margin: 0 .04em;
      color: var(--accent);
      font-family: "Avenir Next", sans-serif;
      font-weight: 700;
    }

    .stanza-marker {
      margin: 0 0 10px;
      color: var(--muted);
      font-family: "Avenir Next", sans-serif;
      font-size: 14px;
      letter-spacing: .12em;
      font-weight: 700;
    }

    .prose {
      margin: 0 0 18px;
      font-size: var(--body-size);
      line-height: var(--body-leading);
      text-align: justify;
    }

    .right .prose, .right .poem-lines {
      font-family: Georgia, "Times New Roman", serif;
      font-size: var(--en-size);
      line-height: 1.9;
      text-align: left;
    }

    .note-title {
      margin: 26px 0 12px;
      font-size: 15px;
      color: var(--accent);
      font-family: "Avenir Next", sans-serif;
      letter-spacing: .12em;
    }

    .commentary-title {
      margin: 30px 0 12px;
      color: var(--accent-2);
      font-family: "Avenir Next", sans-serif;
      font-size: 15px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .commentary {
      margin: 0 0 14px;
      color: #4c463d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: calc(var(--en-size) - 2px);
      line-height: 1.82;
      text-align: left;
    }

    .word-popover {
      position: fixed;
      z-index: 40;
      width: min(340px, calc(100vw - 28px));
      border: 1px solid rgba(47, 93, 80, .22);
      border-radius: 8px;
      background: rgba(255, 252, 244, .98);
      box-shadow: 0 22px 58px rgba(42, 32, 19, .24);
      padding: 14px;
      color: var(--ink);
      transform: translateY(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .word-popover.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .word-popover-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .word-popover-word {
      margin: 0;
      font: 700 22px/1.15 Georgia, "Times New Roman", serif;
      color: var(--accent-2);
    }

    .word-popover-close {
      width: 32px;
      height: 32px;
      min-width: 32px;
      padding: 0;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1;
    }

    .word-popover-label {
      margin: 0 0 4px;
      color: var(--muted);
      font: 800 11px/1 "Avenir Next", sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .word-popover p {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.58;
    }

    .word-popover [hidden] {
      display: none;
    }

    .progress {
      height: 5px;
      background: rgba(80, 61, 33, .10);
    }

    .progress-bar {
      height: 100%;
      width: 1%;
      background: linear-gradient(90deg, var(--accent), #c99045);
      transition: width .28s ease;
    }

    .compact-toggle {
      display: none;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100dvh;
        grid-template-columns: 1fr;
      }
      .sidebar {
        max-height: 42dvh;
        border-radius: 14px;
      }
      .reader {
        min-height: 72dvh;
        border-radius: 14px;
      }
      .columns {
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .column {
        overflow: visible;
      }
      .column.left {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <section class="brand">
        <div class="eyebrow">Xu Yuanchong Reader</div>
        <h1>白居易诗选</h1>
        <p class="subtitle">iPad 横屏中英对照阅读 · 50 首/组</p>
      </section>
      <section class="tools" aria-label="阅读设置">
        <button class="tool" id="smaller" title="缩小字号">A−</button>
        <button class="tool" id="larger" title="放大字号">A＋</button>
        <button class="tool" id="toggleOriginal" title="隐藏原文用于背诵">藏原文</button>
      </section>
      <section class="search-wrap">
        <input class="search" id="search" type="search" placeholder="搜索诗题 / 英文题名" />
      </section>
      <nav class="list" id="list" aria-label="诗歌目录"></nav>
      <footer class="sidebar-footer">
        左右栏可独立滚动，适合 iPad Pro 横屏阅读。
      </footer>
    </aside>

    <section class="reader">
      <header class="reader-header">
        <div>
          <h2 class="current-title" id="title"></h2>
          <p class="current-en" id="enTitle"></p>
          <div class="current-meta">
            <span class="type-pill" id="poemType"></span>
            <span class="type-pill theme-pill" id="poemTheme"></span>
          </div>
        </div>
        <div class="nav">
          <button class="nav-button" id="prev" title="上一首">‹</button>
          <button class="nav-button" id="next" title="下一首">›</button>
        </div>
      </header>
      <section class="columns">
        <article class="column left" id="leftPane">
          <div class="column-label">Chinese · 原文与赏析</div>
          <div id="chinese"></div>
        </article>
        <article class="column right" id="rightPane">
          <div class="column-label">English · Xu Yuanchong</div>
          <div id="english"></div>
        </article>
      </section>
      <div class="progress"><div class="progress-bar" id="progress"></div></div>
    </section>
    <aside class="word-popover" id="wordPopover" aria-live="polite">
      <div class="word-popover-header">
        <h3 class="word-popover-word" id="wordPopoverWord"></h3>
        <button class="word-popover-close" id="wordPopoverClose" type="button" title="关闭">×</button>
      </div>
      <div>
        <p class="word-popover-label" id="wordZhLabel">中文释义</p>
        <p id="wordPopoverZh"></p>
        <p class="word-popover-label" id="wordEnLabel">English</p>
        <p id="wordPopoverEn"></p>
        <p class="word-popover-label" id="wordPinyinLabel" hidden>拼音</p>
        <p id="wordPopoverPinyin" hidden></p>
        <p class="word-popover-label" id="wordContextLabel">In This Poem</p>
        <p id="wordPopoverContext"></p>
      </div>
    </aside>
  </main>

  <script>
    const poems = [{"num": "001", "zhTitle": "赋得古原草送别", "enTitle": "Grass on the Ancient Plain", "chinese": "离离[2]原上草，\n一岁一枯荣。\n野火烧不尽，\n春风吹又生。\n远芳[3]侵[4]古道，\n晴翠接荒城。\n又送王孙[5]去，\n萋萋[6]满别情。\n这首诗是公元787年白居易16岁应考时的作品。第一联起写草，说原上草多么茂盛，每年枯萎了还会新生。第二联承，“野火烧”是说草“枯”，“吹又生”是说草“荣”。第三联转为写古原：古道荒城，因为远近都长满了芳草，清香扑鼻；一片青翠，沐浴在阳光中，欣欣向荣。第四联写送别：看见萋萋芳草，更增添了送别的愁思，仿佛每一片草叶都饱含着别情似的。于是古原草和送别就合而为一了。\n注释：\n[1]赋得：借古人诗句或成语命题作诗，即在指定、限定的题目上加“赋得”二字。古人学习作诗、文人聚会分题作诗或科举考试时命题作诗的一种方式，被称为“赋得体”。\n[2]离离：形容草茂盛的样子。\n[3]芳：野草浓郁的香气。\n[4]侵：侵占，长满。\n[5]王孙：本指贵族后代，此处指作者的友人。\n[6]萋萋：形容草木繁盛的样子。", "english": "— Farewell to a Friend\nWild grasses spread o’er ancient plain;\nWith spring and fall they come and go.\nFire tries to burn them up in vain;\nThey rise again when spring winds blow.\nTheir fragrance overruns the way;\nTheir green invades the ruined town.\nTo see my friend going away;\nMy sorrow grows like grass o’ergrown.", "poemType": "五言律诗", "poemTheme": "送别", "chineseHtml": "<p class=\"poem-lines\">离离<sup class=\"note-ref\">[2]</sup>原上草，<br>一岁一枯荣。<br>野火烧不尽，<br>春风吹又生。<br>远芳<sup class=\"note-ref\">[3]</sup>侵<sup class=\"note-ref\">[4]</sup>古道，<br>晴翠接荒城。<br>又送王孙<sup class=\"note-ref\">[5]</sup>去，<br>萋萋<sup class=\"note-ref\">[6]</sup>满别情。</p>\n<p class=\"prose\">这首诗是公元787年白居易16岁应考时的作品。第一联起写草，说原上草多么茂盛，每年枯萎了还会新生。第二联承，“野火烧”是说草“枯”，“吹又生”是说草“荣”。第三联转为写古原：古道荒城，因为远近都长满了芳草，清香扑鼻；一片青翠，沐浴在阳光中，欣欣向荣。</p>\n<p class=\"prose\">第四联写送别：看见萋萋芳草，更增添了送别的愁思，仿佛每一片草叶都饱含着别情似的。于是古原草和送别就合而为一了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]赋得：借古人诗句或成语命题作诗，即在指定、限定的题目上加“赋得”二字。古人学习作诗、文人聚会分题作诗或科举考试时命题作诗的一种方式，被称为“赋得体”。<br>[2]离离：形容草茂盛的样子。<br>[3]芳：野草浓郁的香气。<br>[4]侵：侵占，长满。<br>[5]王孙：本指贵族后代，此处指作者的友人。<br>[6]萋萋：形容草木繁盛的样子。</p>", "englishHtml": "<p class=\"poem-lines\">— Farewell to a Friend<br>Wild grasses spread o’er ancient plain;<br>With spring and fall they come and go.<br>Fire tries to burn them up in vain;<br>They rise again when spring winds blow.<br>Their fragrance overruns the way;<br>Their green invades the ruined town.<br>To see my friend going away;<br>My sorrow grows like grass o’ergrown.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Grass on the Ancient Plain,” the poem is shaped by parting, but the farewell opens into a larger landscape of freedom and distance.</p>\n<p class=\"commentary\">As a five-character regulated verse, it makes farewell feel expansive rather than merely sad. Its power comes from the pressure between plain language and the feeling held beneath it.</p>"}, {"num": "002", "zhTitle": "望月有感", "enTitle": "By the Light of the Moon", "chinese": "时难年荒[1]世业[2]空，\n弟兄羁旅各西东。\n田园寥落干戈[3]后，\n骨肉流离道路中。\n吊影[4]分为千里雁[5]，\n辞根[6]散作九秋蓬[7]。\n共看明月应垂泪，\n一夜乡心五处同。\n公元799年，河南兵荒马乱，白居易兄弟离散，他写了这一首抒怀诗。在这灾难深重的年代，白家祖业荡然一空，同胞骨肉天各一方。回首故乡田园，在战乱中一片寥落凄清；兄弟姊妹奔波在异乡道路上，犹如纷飞千里的孤雁，只能吊影自怜；或像深秋时断根的蓬草，随着萧瑟的西风飘转不定。夜深人静，诗人看到明月，不禁想起分散在各地的亲人。如果他们也在望月，会不会和自己一样流下思乡之泪呢？这首诗用白描的手法、平易的语言，写出了人所共有的情感。奇语易，常语难，这首七律却可以说是“用常得奇”的佳作。\n注释：\n[1]时难年荒：指遭受战乱和灾荒。\n[2]世业：祖传的产业。唐代初实行“授田制”，死后子孙可继承“世业田”。\n[3]干戈：干和戈为古代两种兵器，此处代指战争。\n[4]吊影：一个人孤单的身影。\n[5]千里雁：比喻兄弟相隔千里，宛如离群的孤雁。\n[6]辞根：草木离开根部，比喻背井离乡。\n[7]九秋蓬：深秋随风飘荡的蓬草，用来比喻游子在异乡漂泊，九秋：即秋天。", "english": "Hard times with famine spread ruins in our home town;\nMy brothers go their way east or west, up and down.\nBattles have left the fields and gardens desolate;\nBy roadside wander families were separate.\nLike far-off wild geese over lonely shadows we weep,\nAs scattered rootless tumbleweed in autumn deep.\nWe should shed yearning tears to view the moon apart;\nThough in five places, we have the same homesick heart.", "poemType": "七言律诗", "poemTheme": "思乡怀亲", "chineseHtml": "<p class=\"poem-lines\">时难年荒<sup class=\"note-ref\">[1]</sup>世业<sup class=\"note-ref\">[2]</sup>空，<br>弟兄羁旅各西东。<br>田园寥落干戈<sup class=\"note-ref\">[3]</sup>后，<br>骨肉流离道路中。<br>吊影<sup class=\"note-ref\">[4]</sup>分为千里雁<sup class=\"note-ref\">[5]</sup>，<br>辞根<sup class=\"note-ref\">[6]</sup>散作九秋蓬<sup class=\"note-ref\">[7]</sup>。<br>共看明月应垂泪，<br>一夜乡心五处同。</p>\n<p class=\"prose\">公元799年，河南兵荒马乱，白居易兄弟离散，他写了这一首抒怀诗。在这灾难深重的年代，白家祖业荡然一空，同胞骨肉天各一方。回首故乡田园，在战乱中一片寥落凄清；兄弟姊妹奔波在异乡道路上，犹如纷飞千里的孤雁，只能吊影自怜；或像深秋时断根的蓬草，随着萧瑟的西风飘转不定。</p>\n<p class=\"prose\">夜深人静，诗人看到明月，不禁想起分散在各地的亲人。如果他们也在望月，会不会和自己一样流下思乡之泪呢？这首诗用白描的手法、平易的语言，写出了人所共有的情感。奇语易，常语难，这首七律却可以说是“用常得奇”的佳作。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]时难年荒：指遭受战乱和灾荒。<br>[2]世业：祖传的产业。唐代初实行“授田制”，死后子孙可继承“世业田”。<br>[3]干戈：干和戈为古代两种兵器，此处代指战争。<br>[4]吊影：一个人孤单的身影。<br>[5]千里雁：比喻兄弟相隔千里，宛如离群的孤雁。<br>[6]辞根：草木离开根部，比喻背井离乡。<br>[7]九秋蓬：深秋随风飘荡的蓬草，用来比喻游子在异乡漂泊，九秋：即秋天。</p>", "englishHtml": "<p class=\"poem-lines\">Hard times with famine spread ruins in our home town;<br>My brothers go their way east or west, up and down.<br>Battles have left the fields and gardens desolate;<br>By roadside wander families were separate.<br>Like far-off wild geese over lonely shadows we weep,<br>As scattered rootless tumbleweed in autumn deep.<br>We should shed yearning tears to view the moon apart;<br>Though in five places, we have the same homesick heart.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “By the Light of the Moon,” the poem speaks from distance and separation, using a small scene to open family feeling and homesickness.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as moonlight, birds, homecoming, and war and displacement give the poem its visual texture and emotional temperature.</p>"}, {"num": "003", "zhTitle": "邯郸冬至夜思家", "enTitle": "Thinking of Home on Winter", "chinese": "邯郸[1]驿[2]里逢冬至，\n抱膝灯前影伴身[3]。\n想得家中夜深坐，\n还应说着远行人[4]。\n在唐代，冬至是个重要的节日。朝廷放假，民间互赠饮食，穿新衣，贺节，一切都和元旦相似。公元804年的这一天，诗人却在客店里度过，只有抱膝枯坐的影子和他作伴，孤寂之感、思家之情，油然而生。自己思家直到深夜，料想家人也没有睡，也在想着说着远行在外的自己。这首诗写“每逢佳节倍思亲”，是一首感情真挚动人的作品。\n注释：\n[1]邯（hán）郸（dān）：地名，今河北省邯郸市。\n[2]驿：驿站，古代传送公文、转运货物或官员出差途中休息的地方。\n[3]影伴身：影子与自己相伴，形容孤独。\n[4]远行人：离家在外的人，此处指作者自己。", "english": "Solstice Night at Handan\nAt roadside inn I pass the Winter Solstice Day,\nClasping my knees, my shadow is my company,\nI think, till dead of night my family would stay,\nAnd talk about the poor lonely wayfaring me.", "poemType": "七言绝句", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">邯郸<sup class=\"note-ref\">[1]</sup>驿<sup class=\"note-ref\">[2]</sup>里逢冬至，<br>抱膝灯前影伴身<sup class=\"note-ref\">[3]</sup>。<br>想得家中夜深坐，<br>还应说着远行人<sup class=\"note-ref\">[4]</sup>。</p>\n<p class=\"prose\">在唐代，冬至是个重要的节日。朝廷放假，民间互赠饮食，穿新衣，贺节，一切都和元旦相似。公元804年的这一天，诗人却在客店里度过，只有抱膝枯坐的影子和他作伴，孤寂之感、思家之情，油然而生。自己思家直到深夜，料想家人也没有睡，也在想着说着远行在外的自己。</p>\n<p class=\"prose\">这首诗写“每逢佳节倍思亲”，是一首感情真挚动人的作品。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]邯（hán）郸（dān）：地名，今河北省邯郸市。<br>[2]驿：驿站，古代传送公文、转运货物或官员出差途中休息的地方。<br>[3]影伴身：影子与自己相伴，形容孤独。<br>[4]远行人：离家在外的人，此处指作者自己。</p>", "englishHtml": "<p class=\"poem-lines\">Solstice Night at Handan<br>At roadside inn I pass the Winter Solstice Day,<br>Clasping my knees, my shadow is my company,<br>I think, till dead of night my family would stay,<br>And talk about the poor lonely wayfaring me.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Thinking of Home on Winter,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "004", "zhTitle": "长恨歌", "enTitle": "The Everlasting Regret", "chinese": "汉皇[1]重色思倾国[2]，\n御宇[3]多年求不得。\n杨家有女初长成，\n养在深闺人未识。\n天生丽质难自弃，\n一朝选在君王侧。\n回眸一笑百媚生，\n六宫粉黛[4]无颜色。\n春寒赐浴华清池[5]，\n温泉水滑洗凝脂[6]。\n侍儿扶起娇无力，\n始是新承恩泽[7]时。\n云鬓[8]花颜金步摇[9]，\n芙蓉帐[10]暖度春宵。\n春宵苦短日高起，\n从此君王不早朝。\n承欢侍宴无闲暇，\n春从春游夜专夜。\n后宫佳丽三千人，\n三千宠爱在一身。\n金屋[11]妆成娇侍夜，\n玉楼宴罢醉和春。\n姊妹弟兄皆列土[12]，\n可怜[13]光彩生门户。\n遂令天下父母心，\n不重生男重生女。\n骊宫高处入青云，\n仙乐风飘处处闻。\n缓歌慢舞凝丝竹[14]，\n尽日君王看不足。\n渔阳[15]鼙鼓[16]动地来，\n惊破霓裳羽衣曲[17]。\n九重城阙[18]烟尘生，\n千乘万骑西南行。\n翠华[19]摇摇行复止，\n西出都门百余里。\n六军不发无奈何，\n宛转[20]蛾眉[21]马前死。\n花钿[22]委地[23]无人收，\n翠翅金雀玉搔头[24]。\n君王掩面救不得，\n回看血泪相和流。\n黄埃散漫风萧索，\n云栈[25]萦纡[26]登剑阁[27]。\n峨嵋山下少人行，\n旌旗无光日色薄。\n蜀江水碧蜀山青，\n圣主朝朝暮暮情。\n行宫见月伤心色，\n夜雨闻铃[28]断肠声。\n天旋地转[29]回龙驭，\n到此踌躇不能去。\n马嵬坡下泥土中，\n不见玉颜空死处。\n君臣相顾尽沾衣，\n东望都门信马[30]归。\n归来池苑皆依旧，\n太液[31]芙蓉未央[32]柳。\n芙蓉如面柳如眉，\n对此如何不泪垂！\n春风桃李花开日，\n秋雨梧桐叶落时。\n西宫南苑多秋草，\n落叶满阶红不扫。\n梨园弟子[33]白发新，\n椒房[34]阿监[35]青娥[36]老。\n夕殿萤飞思悄然，\n孤灯挑尽[37]未成眠。\n迟迟钟鼓初长夜，\n耿耿星河欲曙天。\n鸳鸯瓦冷霜华重，\n翡翠衾寒谁与共？\n悠悠生死别经年，\n魂魄不曾来入梦。\n临邛道士鸿都客[38]，\n能以精诚致魂魄。\n为感君王辗转思，\n遂教方士[39]殷勤觅。\n排空驭气[40]奔如电，\n升天入地求之遍。\n上穷碧落[41]下黄泉，\n两处茫茫皆不见。\n忽闻海上有仙山，\n山在虚无缥缈间。\n楼阁玲珑五云起，\n其中绰约多仙子。\n中有一人字太真，\n雪肤花貌参差是。\n金阙西厢叩玉扃[42]，\n转教小玉报双成。\n闻道汉家天子使，\n九华帐里梦魂惊。\n揽衣推枕起徘徊，\n珠箔银屏迤逦[43]开。\n云髻半偏新睡觉[44]，\n花冠不整下堂来。\n风吹仙袂[45]飘飖举，\n犹似霓裳羽衣舞。\n玉容寂寞[46]泪阑干[47]，\n梨花一枝春带雨。\n含情凝睇[48]谢君王，\n一别音容两渺茫。\n昭阳殿[49]里恩爱绝，\n蓬莱宫[50]中日月长。\n回头下望人寰[51]处，\n不见长安见尘雾。\n惟将旧物表深情，\n钿合金钗寄将去。\n钗留一股合一扇，\n钗擘[52]黄金合分钿。\n但令心似金钿坚，\n天上人间会相见。\n临别殷勤重寄词，\n词中有誓两心知。\n七月七日长生殿，\n夜半无人私语时。\n在天愿作比翼鸟[53]，\n在地愿为连理枝[54]。\n天长地久有时尽，\n此恨[55]绵绵无绝期。\n《长恨歌》是白居易传诵千古的名作，集叙事、写景、抒情于一体，借着历史的影子，根据民间的传说，写出了唐玄宗和杨贵妃在安史之乱中的爱情悲剧。诗人把缠绵悱恻之情，写得令人回肠荡气，于是《长恨歌》就成了千古绝唱。\n注释：\n[1]汉皇：原指汉武帝刘彻，此处借指唐玄宗李隆基。\n[2]倾国：绝色女子。“倾国倾城”常用来形容或指代美女。\n[3]御宇：驾御宇内，即统治天下。\n[4]六宫粉黛：指宫中所有的嫔妃；粉黛：本为化妆用品，粉以涂脸，黛以描眉，此处代指女性。\n[5]华清池：即华清池温泉，今西安市骊山脚下。唐贞观十八年（644年）建汤泉宫，后改名为华清宫。唐玄宗每年冬、春季节都到此居住。\n[6]凝脂：形容皮肤白嫩细腻，宛如凝固的脂肪。\n[7]承恩泽：得到君王的宠幸。\n[8]云鬓（bìn）：形容女子浓厚而柔美的鬓发。\n[9]金步摇：一种金首饰，插于发鬓，走路时摇曳生姿。\n[10]芙蓉帐：绣着莲花的帐子，形容帐之精美。\n[11]金屋：典故出自《汉武故事》，汉武帝刘彻曾言：“若得阿娇作妇，当作金屋贮之”，用以指女子受宠。\n[12]列土：分封土地。\n[13]可怜：可爱，令人羡慕。\n[14]凝丝竹：弦乐器和管乐器奏出舒缓的旋律。\n[15]渔阳：郡名，今北京市平谷区和天津市蓟县等地。\n[16]鼙（pí）鼓：古时军中使用的战鼓，此处借指战争。\n[17]霓（ní）裳羽衣曲：唐代宫廷舞曲，据传为唐玄宗根据古曲改编，最初用于在太清宫祭献老子时演奏。\n[18]九重城阙：九重门的宫殿，此处代指皇宫。\n[19]翠华：用翠鸟羽毛装饰而成的旗帜，皇帝仪仗队用。\n[20]宛转：形容美人临死之前哀怨、楚楚可怜的样子。\n[21]蛾眉：古代美女的代称，此处指杨贵妃。\n[22]花钿（diàn）：用金翠珠宝等制成的花形首饰。\n[23]委地：丢弃在地上。\n[24]翠翅金雀玉搔头：均为首饰，翠翅，形如翡翠鸟尾；金雀，金雀钗，钗形似朱雀（凤）；玉搔头，玉簪。\n[25]云栈：高入云霄的栈道。\n[26]萦（yíng）纡（yū）：迂回盘绕。\n[27]剑阁：即剑门关，是由秦入蜀的要道。该地群山如剑，峭壁中断处，两山对峙如门。\n[28]夜雨闻铃：《明皇杂录·补遗》中记载“明皇既幸蜀，西南行，初入斜谷，属霖雨涉旬，于栈道雨中闻铃，音与山相应。上既悼念贵妃，采其声为《雨霖铃曲》，以寄恨焉。”此处暗指此事。这也是《雨霖铃》词牌名的来历。\n[29]天旋地转：此处指时局好转。\n[30]信马：意为无心鞭马，任马前进。\n[31]太液：长安大明宫北的太液池。\n[32]未央：长安皇宫中的未央宫。\n[33]梨园弟子：指唐玄宗当年训练的乐工舞女。\n[34]椒房：后妃居住之所，因以花椒和泥抹墙，故称椒房。\n[35]阿监：宫中的侍从女官。\n[36]青娥：年轻的宫女。\n[37]孤灯挑尽：古时用油灯照明，为使灯火保持明亮，需要不时把浸在油中的灯草挑一下。挑尽，说明夜已深。旧时唐宫中夜间燃烛而非油灯，此处也暗示唐玄宗晚年生活的凄苦。\n[38]临邛（qiónɡ）道士鸿都客：意为长安有个从临邛来的道士；鸿都，东汉都城洛阳的宫门名，此处借指长安。\n[39]方士：有法术的人，指道士。\n[40]排空驭气：即腾云驾雾。\n[41]碧落：指天上。\n[42]玉扃（jiōnɡ）：玉门。\n[43]迤（yǐ）逦（lǐ）：接连不断地。\n[44]新睡觉（jué）：刚睡醒；觉，醒。\n[45]袂（mèi）：衣袖。\n[46]玉容寂寞：神色黯淡凄楚。\n[47]阑干：纵横交错的样子，此处形容泪痕。\n[48]凝睇（dì）：凝视，注视。\n[49]昭阳殿：汉成帝宠妃赵飞燕的宫殿，此处借指杨贵妃曾经的寝宫。\n[50]蓬莱宫：蓬莱为传说中的海上仙山，此处指杨贵妃在仙山的居所。\n[51]人寰（huán）：人间。\n[52]擘（bò）：分开，意同“掰”，也可读作“bāi”。\n[53]比翼鸟：传说中的鸟，据说只有一目一翼，雌雄并在一起才能飞行。\n[54]连理枝：两株树木的树干交缠相抱。古人常用此比喻情侣相爱、永不分离。\n[55]恨：遗憾。", "english": "The beauty-loving monarch longed year after year\nTo find a beautiful lady without a peer.\nA maiden of the Yangs to womanhood just grown,\nIn inner chambers bred, to the world was unknown.\nEndowed with natural beauty too hard to hide,\nShe was chosen one day to be the monarch’s bride.\nTurning her head, she smiled so sweet and full of grace\nThat she outshone in six palaces the fairest face.\nShe bathed in glassy water of Warm-fountain Pool,\nWhich laved and smoothed her creamy skin when spring was cool.\nWithout her maids’ support, she was too tired to move,\nAnd this was when she first received the monarch’s love.\nFlower-like face and cloud-like hair, golden-headdressed,\nIn lotus-adorned curtain she spent the night blessed.\nShe slept till the sun rose high for the blessed night was short,\nFrom then on the monarch held no longer morning court.\nIn revels as in feasts she shared her lord’s delight,\nHis companion on trips and his mistress at night.\nIn inner palace dwelt three thousand ladies fair;\nOn her alone was lavished royal love and care.\nHer beauty served the night when dressed up in Golden Bower;\nShe was drunk with wine and spring at banquet in Jade Tower.\nHer sisters and brothers all received rank and fief,\nAnd honors showered on her household, to the grief\nOf fathers and mothers who would rather give birth\nTo a fair maiden than to any son on earth.\nThe lofty palace towered high into the cloud;\nWith divine music borne on the breeze the air was loud.\nSeeing slow dance and hearing fluted or stringed song,\nThe emperor was never tired the whole day long.\nBut rebels beat their war drums, making the earth quake\nAnd Song of Rainbow Skirt and Coat of Feathers break.\nA cloud of dust was raised o’er city walls nine-fold;\nThousands of chariots and horsemen southwestward rolled.\nImperial flags moved slowly now and halted then,\nAnd thirty miles from Western Gate they stopped again.\nSix armies — what could be done — would not march with speed,\nUnless fair Lady Yang be killed before the steed.\nNone would pick up her hairpin fallen on the ground,\nNor golden bird nor comb with which her head was crowned.\nThe monarch could not save her and hid his face in fear;\nTurning his head, he saw her blood mix with his tear.\nThe yellow dust widespread, the wind blew desolate;\nA serpentine plank path led to cloud-capped Sword Gate.\nBelow the Eyebrow Mountains wayfarers were few;\nIn fading sunlight royal standards lost their hue.\nOn Western water blue and Western mountains green,\nThe monarch’s heart was daily gnawed by sorrow keen.\nThe moon viewed from his tent shed a soul-searing light;\nThe bells heard in night rain made a heart-rending sound.\nSuddenly turned the tide. Returning from his flight,\nThe monarch could not tear himself away from the ground.\nWhere ’mid the clods beneath the Slope he couldn’t forget\nThe fair-faced Lady Yang who was unfairly slain.\nHe looked at his courtiers, with tears his robe was wet;\nThey rode east to the capital but with loose rein.\nCome back; he found her pond and garden in old place,\nWith lotus in the lake and willows by the hall,\nWillow leaves like her brows and lotus like her face;\nAt the sight of all these, how could his tears not fall?\nOr when in vernal breeze were peach and plum full-blown\nOr when in autumn rain parasol leaves were shed?\nIn Western as in Southern Court was grass o’ergrown;\nWith fallen leaves unswept the marble steps turned red.\nActors, although still young, began to have hair grey;\nEunuchs and waiting maids looked old in palace deep.\nFireflies flitting the hall, mutely he pined away;\nThe lonely lampwick burned out, still he could not sleep.\nSlowly beat drums and rang bells, night began to grow long;\nBright shone the Starry Stream; daybreak seemed to come late.\nThe lovebird tiles grew chilly with hoarfrost so strong;\nHis kingfisher quilt was cold, not shared by a mate.\nOne long, long year the dead with the living was parted;\nHer soul came not in dreams to see the broken-hearted.\nA Taoist sorcerer came to the palace door,\nSkilled to summon the spirits from the other shore.\nMoved by the monarch’s yearning for the departed fair,\nHe was ordered to seek for her everywhere.\nBorne on the air, like flash of lightning flew,\nIn heaven and on earth he searched through and through.\nUp to the azure vault and down to deepest place,\nNor above nor below could he e’er find her trace.\nHe learned that on the sea were fairy mountains proud,\nWhich now appeared now disappeared amid the cloud\nOf rainbow colors, where rose magnificent bowers\nAnd dwelt so many fairies as graceful as flowers.\nAmong them was a queen whose name was Ever True;\nHer snow-white skin and sweet face might afford a clue.\nKnocking at western gate of palace hall, he bade\nThe fair porter to inform the queen’s waiting maid.\nWhen she heard that there came the monarch’s embassy,\nThe queen was startled out of dreams in her canopy.\nPushing aside the pillow, she rose and got dressed,\nPassing through silver screen and pearl shade to meet the guest.\nHer cloud-like hair awry, not full awake at all,\nHer flowery cap slanted, she came into the hall.\nThe wind blew up her fairy sleeves and made them float\nAs if she danced still Rainbow Skirt and Feathered Coat.\nHer jade-white face crisscrossed with tears in lonely world\nLike a spray of pear blossoms in spring rain impearled.\nShe bade him thank her lord, lovesick and broken-hearted;\nThey knew nothing of each other after they parted.\nLove and happiness long ended within palace walls;\nDays and nights appeared long in the Fairyland halls.\nTurning her head and fixing on the earth her gaze,\nShe found no capital ’mid clouds of dust and haze.\nTo show her love was deep, she took out keepsakes old\nFor him to carry back, hairpin and case of gold.\nKeeping one side of the case and one wing of the pin,\nShe sent to her lord the other half of the twin.\n“If our two hearts as firm as the gold should remain,\nIn heaven or on earth some time we’ll meet again.”\nAt parting, she confided to the messenger\nA secret vow known only to her lord and her.\nOn seventh day of seventh moon when none was near,\nAt midnight in Long Life Hall he whispered in her ear:\n“On high, we’d be two birds flying wing to wing;\nOn earth, two trees with branches twined from spring to spring.”\nThe boundless sky and endless earth may pass away,\nBut this vow unfulfilled will be regretted for aye.", "poemType": "乐府/古体", "poemTheme": "叙事抒情", "chineseHtml": "<p class=\"poem-lines\">汉皇<sup class=\"note-ref\">[1]</sup>重色思倾国<sup class=\"note-ref\">[2]</sup>，<br>御宇<sup class=\"note-ref\">[3]</sup>多年求不得。<br>杨家有女初长成，<br>养在深闺人未识。<br>天生丽质难自弃，<br>一朝选在君王侧。<br>回眸一笑百媚生，<br>六宫粉黛<sup class=\"note-ref\">[4]</sup>无颜色。<br>春寒赐浴华清池<sup class=\"note-ref\">[5]</sup>，<br>温泉水滑洗凝脂<sup class=\"note-ref\">[6]</sup>。<br>侍儿扶起娇无力，<br>始是新承恩泽<sup class=\"note-ref\">[7]</sup>时。<br>云鬓<sup class=\"note-ref\">[8]</sup>花颜金步摇<sup class=\"note-ref\">[9]</sup>，<br>芙蓉帐<sup class=\"note-ref\">[10]</sup>暖度春宵。<br>春宵苦短日高起，<br>从此君王不早朝。<br>承欢侍宴无闲暇，<br>春从春游夜专夜。<br>后宫佳丽三千人，<br>三千宠爱在一身。<br>金屋<sup class=\"note-ref\">[11]</sup>妆成娇侍夜，<br>玉楼宴罢醉和春。<br>姊妹弟兄皆列土<sup class=\"note-ref\">[12]</sup>，<br>可怜<sup class=\"note-ref\">[13]</sup>光彩生门户。<br>遂令天下父母心，<br>不重生男重生女。<br>骊宫高处入青云，<br>仙乐风飘处处闻。<br>缓歌慢舞凝丝竹<sup class=\"note-ref\">[14]</sup>，<br>尽日君王看不足。<br>渔阳<sup class=\"note-ref\">[15]</sup>鼙鼓<sup class=\"note-ref\">[16]</sup>动地来，<br>惊破霓裳羽衣曲<sup class=\"note-ref\">[17]</sup>。<br>九重城阙<sup class=\"note-ref\">[18]</sup>烟尘生，<br>千乘万骑西南行。<br>翠华<sup class=\"note-ref\">[19]</sup>摇摇行复止，<br>西出都门百余里。<br>六军不发无奈何，<br>宛转<sup class=\"note-ref\">[20]</sup>蛾眉<sup class=\"note-ref\">[21]</sup>马前死。<br>花钿<sup class=\"note-ref\">[22]</sup>委地<sup class=\"note-ref\">[23]</sup>无人收，<br>翠翅金雀玉搔头<sup class=\"note-ref\">[24]</sup>。<br>君王掩面救不得，<br>回看血泪相和流。<br>黄埃散漫风萧索，</p>\n<p class=\"prose\">云栈[25]萦纡[26]登剑阁[27]。<br>峨嵋山下少人行，<br>旌旗无光日色薄。<br>蜀江水碧蜀山青，<br>圣主朝朝暮暮情。<br>行宫见月伤心色，<br>夜雨闻铃[28]断肠声。<br>天旋地转[29]回龙驭，<br>到此踌躇不能去。<br>马嵬坡下泥土中，<br>不见玉颜空死处。<br>君臣相顾尽沾衣，<br>东望都门信马[30]归。<br>归来池苑皆依旧，<br>太液[31]芙蓉未央[32]柳。<br>芙蓉如面柳如眉，<br>对此如何不泪垂！<br>春风桃李花开日，<br>秋雨梧桐叶落时。<br>西宫南苑多秋草，<br>落叶满阶红不扫。<br>梨园弟子[33]白发新，<br>椒房[34]阿监[35]青娥[36]老。<br>夕殿萤飞思悄然，<br>孤灯挑尽[37]未成眠。<br>迟迟钟鼓初长夜，<br>耿耿星河欲曙天。<br>鸳鸯瓦冷霜华重，<br>翡翠衾寒谁与共？<br>悠悠生死别经年，<br>魂魄不曾来入梦。<br>临邛道士鸿都客[38]，<br>能以精诚致魂魄。<br>为感君王辗转思，<br>遂教方士[39]殷勤觅。<br>排空驭气[40]奔如电，<br>升天入地求之遍。<br>上穷碧落[41]下黄泉，<br>两处茫茫皆不见。<br>忽闻海上有仙山，<br>山在虚无缥缈间。<br>楼阁玲珑五云起，<br>其中绰约多仙子。<br>中有一人字太真，<br>雪肤花貌参差是。<br>金阙西厢叩玉扃[42]，<br>转教小玉报双成。<br>闻道汉家天子使，<br>九华帐里梦魂惊。<br>揽衣推枕起徘徊，<br>珠箔银屏迤逦[43]开。<br>云髻半偏新睡觉[44]，<br>花冠不整下堂来。<br>风吹仙袂[45]飘飖举，<br>犹似霓裳羽衣舞。<br>玉容寂寞[46]泪阑干[47]，<br>梨花一枝春带雨。<br>含情凝睇[48]谢君王，<br>一别音容两渺茫。<br>昭阳殿[49]里恩爱绝，<br>蓬莱宫[50]中日月长。<br>回头下望人寰[51]处，<br>不见长安见尘雾。<br>惟将旧物表深情，<br>钿合金钗寄将去。<br>钗留一股合一扇，<br>钗擘[52]黄金合分钿。<br>但令心似金钿坚，<br>天上人间会相见。<br>临别殷勤重寄词，<br>词中有誓两心知。<br>七月七日长生殿，<br>夜半无人私语时。<br>在天愿作比翼鸟[53]，<br>在地愿为连理枝[54]。<br>天长地久有时尽，<br>此恨[55]绵绵无绝期。<br>《长恨歌》是白居易传诵千古的名作，集叙事、写景、抒情于一体，借着历史的影子，根据民间的传说，写出了唐玄宗和杨贵妃在安史之乱中的爱情悲剧。诗人把缠绵悱恻之情，写得令人回肠荡气，于是《长恨歌》就成了千古绝唱。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]汉皇：原指汉武帝刘彻，此处借指唐玄宗李隆基。<br>[2]倾国：绝色女子。“倾国倾城”常用来形容或指代美女。<br>[3]御宇：驾御宇内，即统治天下。<br>[4]六宫粉黛：指宫中所有的嫔妃；粉黛：本为化妆用品，粉以涂脸，黛以描眉，此处代指女性。<br>[5]华清池：即华清池温泉，今西安市骊山脚下。唐贞观十八年（644年）建汤泉宫，后改名为华清宫。唐玄宗每年冬、春季节都到此居住。<br>[6]凝脂：形容皮肤白嫩细腻，宛如凝固的脂肪。<br>[7]承恩泽：得到君王的宠幸。<br>[8]云鬓（bìn）：形容女子浓厚而柔美的鬓发。<br>[9]金步摇：一种金首饰，插于发鬓，走路时摇曳生姿。<br>[10]芙蓉帐：绣着莲花的帐子，形容帐之精美。<br>[11]金屋：典故出自《汉武故事》，汉武帝刘彻曾言：“若得阿娇作妇，当作金屋贮之”，用以指女子受宠。<br>[12]列土：分封土地。<br>[13]可怜：可爱，令人羡慕。<br>[14]凝丝竹：弦乐器和管乐器奏出舒缓的旋律。<br>[15]渔阳：郡名，今北京市平谷区和天津市蓟县等地。<br>[16]鼙（pí）鼓：古时军中使用的战鼓，此处借指战争。<br>[17]霓（ní）裳羽衣曲：唐代宫廷舞曲，据传为唐玄宗根据古曲改编，最初用于在太清宫祭献老子时演奏。<br>[18]九重城阙：九重门的宫殿，此处代指皇宫。<br>[19]翠华：用翠鸟羽毛装饰而成的旗帜，皇帝仪仗队用。<br>[20]宛转：形容美人临死之前哀怨、楚楚可怜的样子。<br>[21]蛾眉：古代美女的代称，此处指杨贵妃。<br>[22]花钿（diàn）：用金翠珠宝等制成的花形首饰。<br>[23]委地：丢弃在地上。<br>[24]翠翅金雀玉搔头：均为首饰，翠翅，形如翡翠鸟尾；金雀，金雀钗，钗形似朱雀（凤）；玉搔头，玉簪。<br>[25]云栈：高入云霄的栈道。<br>[26]萦（yíng）纡（yū）：迂回盘绕。<br>[27]剑阁：即剑门关，是由秦入蜀的要道。该地群山如剑，峭壁中断处，两山对峙如门。<br>[28]夜雨闻铃：《明皇杂录·补遗》中记载“明皇既幸蜀，西南行，初入斜谷，属霖雨涉旬，于栈道雨中闻铃，音与山相应。上既悼念贵妃，采其声为《雨霖铃曲》，以寄恨焉。”此处暗指此事。这也是《雨霖铃》词牌名的来历。<br>[29]天旋地转：此处指时局好转。<br>[30]信马：意为无心鞭马，任马前进。<br>[31]太液：长安大明宫北的太液池。<br>[32]未央：长安皇宫中的未央宫。<br>[33]梨园弟子：指唐玄宗当年训练的乐工舞女。<br>[34]椒房：后妃居住之所，因以花椒和泥抹墙，故称椒房。<br>[35]阿监：宫中的侍从女官。<br>[36]青娥：年轻的宫女。<br>[37]孤灯挑尽：古时用油灯照明，为使灯火保持明亮，需要不时把浸在油中的灯草挑一下。挑尽，说明夜已深。旧时唐宫中夜间燃烛而非油灯，此处也暗示唐玄宗晚年生活的凄苦。<br>[38]临邛（qiónɡ）道士鸿都客：意为长安有个从临邛来的道士；鸿都，东汉都城洛阳的宫门名，此处借指长安。<br>[39]方士：有法术的人，指道士。<br>[40]排空驭气：即腾云驾雾。<br>[41]碧落：指天上。<br>[42]玉扃（jiōnɡ）：玉门。<br>[43]迤（yǐ）逦（lǐ）：接连不断地。<br>[44]新睡觉（jué）：刚睡醒；觉，醒。<br>[45]袂（mèi）：衣袖。<br>[46]玉容寂寞：神色黯淡凄楚。<br>[47]阑干：纵横交错的样子，此处形容泪痕。<br>[48]凝睇（dì）：凝视，注视。<br>[49]昭阳殿：汉成帝宠妃赵飞燕的宫殿，此处借指杨贵妃曾经的寝宫。<br>[50]蓬莱宫：蓬莱为传说中的海上仙山，此处指杨贵妃在仙山的居所。<br>[51]人寰（huán）：人间。<br>[52]擘（bò）：分开，意同“掰”，也可读作“bāi”。<br>[53]比翼鸟：传说中的鸟，据说只有一目一翼，雌雄并在一起才能飞行。<br>[54]连理枝：两株树木的树干交缠相抱。古人常用此比喻情侣相爱、永不分离。<br>[55]恨：遗憾。</p>", "englishHtml": "<p class=\"poem-lines\">The beauty-loving monarch longed year after year<br>To find a beautiful lady without a peer.<br>A maiden of the Yangs to womanhood just grown,<br>In inner chambers bred, to the world was unknown.<br>Endowed with natural beauty too hard to hide,<br>She was chosen one day to be the monarch’s bride.<br>Turning her head, she smiled so sweet and full of grace<br>That she outshone in six palaces the fairest late;<br>A serpentine plank path led to cloud-capped Sword Gate.<br>Below the Eyebrow Mountains wayfarers were few;<br>In fading sunlight royal standards lost their hue.<br>On Western water blue and Western mountains green,<br>The monarch’s heart was daily gnawed by sorrow keen.<br>The moon viewed from his tent shed a soul-searing light;<br>The bells heard in night rain made a heart-rending sound.<br>Suddenly turned the tide. Returning from his flight,<br>The monarch could not tear himself away from the ground.<br>Where ’mid the clods beneath the Slope he couldn’t forget<br>The fair-faced Lady Yang who was unfairly slain.<br>He looked at his courtiers, with tears his robe was wet;<br>They rode east to the capital but with loose rein.<br>Come back; he found her pond and garden in old place,<br>With lotus in the lake and willows by the hall,<br>Willow leaves like her brows and lotus like her face;<br>At the sight of all these, how could his tears not fall?<br>Or when in vernal breeze were peach and plum full-blown<br>Or when in autumn rain parasol leaves were shed?<br>In Western as in Southern Court was grass o’ergrown;<br>With fallen leaves unswept the marble steps turned red.<br>Actors, although still young, began to have hair grey;<br>Eunuchs and waiting maids looked old in palace deep.<br>Fireflies flitting the hall, mutely he pined away;<br>The lonely lampwick burned out, still he could not sleep.<br>Slowly beat drums and rang bells, night began to grow long;<br>Bright shone the Starry Stream; daybreak seemed to come late.<br>The lovebird tiles grew chilly with hoarfrost so strong;<br>His kingfisher quilt was cold, not shared by a mate.<br>One long, long year the dead with the living was parted;<br>Her soul came not in dreams to see the broken-hearted.<br>A Taoist sorcerer came to the palace door,<br>Skilled to summon the spirits from the other shore.<br>Moved by the monarch’s yearning for the departed fair,<br>He was ordered to seek for her everywhere.<br>Borne on the air, like flash of lightning flew,<br>In heaven and on earth he searched through and through.<br>Up to the azure vault and down to deepest place,<br>Nor above nor below could he e’er find her trace.<br>He learned that on the sea were fairy mountains proud,<br>Which now appeared now disappeared amid the cloud<br>Of rainbow colors, where rose magnificent bowers<br>And dwelt so many fairies as graceful as flowers.<br>Among them was a queen whose name was Ever True;<br>Her snow-white skin and sweet face might afford a clue.<br>Knocking at western gate of palace hall, he bade<br>The fair porter to inform the queen’s waiting maid.<br>When she heard that there came the monarch’s embassy,<br>The queen was startled out of dreams in her canopy.<br>Pushing aside the pillow, she rose and got dressed,<br>Passing through silver screen and pearl shade to meet the guest.<br>Her cloud-like hair awry, not full awake at all,<br>Her flowery cap slanted, she came into the hall.<br>The wind blew up her fairy sleeves and made them float<br>As if she danced still Rainbow Skirt and Feathered Coat.<br>Her jade-white face crisscrossed with tears in lonely world<br>Like a spray of pear blossoms in spring rain impearled.<br>She bade him thank her lord, lovesick and broken-hearted;<br>They knew nothing of each other after they parted.<br>Love and happiness long ended within palace walls;<br>Days and nights appeared long in the Fairyland halls.<br>Turning her head and fixing on the earth her gaze,<br>She found no capital ’mid clouds of dust and haze.<br>To show her love was deep, she took out keepsakes old<br>For him to carry back, hairpin and case of gold.<br>Keeping one side of the case and one wing of the pin,<br>She sent to her lord the other half of the twin.<br>“If our two hearts as firm as the gold should remain,<br>In heaven or on earth some time we’ll meet again.”<br>At parting, she confided to the messenger<br>A secret vow known only to her lord and her.<br>On seventh day of seventh moon when none was near,<br>At midnight in Long Life Hall he whispered in her ear:<br>“On high, we’d be two birds flying wing to wing;<br>On earth, two trees with branches twined from spring to spring.”<br>The boundless sky and endless earth may pass away,<br>But this vow unfulfilled will be regretted for aye.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Everlasting Regret,” the poem unfolds through story, allowing feeling, scene, and music to gather force over time.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as water, clouds, flowers, and trees give the poem its visual texture and emotional temperature.</p>"}, {"num": "005", "zhTitle": "赠卖松者", "enTitle": "For the Seller of Dwarf Pines", "chinese": "一束苍苍色，\n知从涧底来。\n斫掘[1]经几日，\n枝叶满尘埃。\n不买非他意，\n城中无地栽。\n公元808年，有人抨击时政，触犯了宰相，不但贬官，而且牵连多人。白居易当时任左拾遗，提出谏议，未被采纳，就写了这首诗。“苍苍色”指被贬官的人，“涧底”就是山沟，比喻出身寒微。挖掘松树不易，暗示发现人才困难；松树挖掘出来之后，枝叶上满是尘埃，象征人才被埋没；松树没有人买，表示人才不受重用。“城中”隐射朝廷，朝政黑暗，人才也就无用武之地了。\n注释：\n[1]斫（zhuó）掘：挖掘。", "english": "A bundle of dwarf pines look pale;\nThey come from the depth of the vale.\nDug up for only a few days,\nTheir twigs are dusted as in haze.\nI will not buy them in the town.\nWhere can I plant them up or down?", "poemType": "古体诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">一束苍苍色，<br>知从涧底来。<br>斫掘<sup class=\"note-ref\">[1]</sup>经几日，<br>枝叶满尘埃。<br>不买非他意，<br>城中无地栽。</p>\n<p class=\"prose\">公元808年，有人抨击时政，触犯了宰相，不但贬官，而且牵连多人。白居易当时任左拾遗，提出谏议，未被采纳，就写了这首诗。“苍苍色”指被贬官的人，“涧底”就是山沟，比喻出身寒微。挖掘松树不易，暗示发现人才困难；松树挖掘出来之后，枝叶上满是尘埃，象征人才被埋没；</p>\n<p class=\"prose\">松树没有人买，表示人才不受重用。“城中”隐射朝廷，朝政黑暗，人才也就无用武之地了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]斫（zhuó）掘：挖掘。</p>", "englishHtml": "<p class=\"poem-lines\">A bundle of dwarf pines look pale;<br>They come from the depth of the vale.<br>Dug up for only a few days,<br>Their twigs are dusted as in haze.<br>I will not buy them in the town.<br>Where can I plant them up or down?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For the Seller of Dwarf Pines,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a ancient-style poem, it shows Bai Juyi&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water give the poem its visual texture and emotional temperature.</p>"}, {"num": "006", "zhTitle": "上阳白发人", "enTitle": "The White-haired Palace Maid", "chinese": "上阳人，上阳人，\n红颜暗老白发新。\n绿衣监使[1]守宫门，\n一闭上阳多少春！\n玄宗末岁初选入，\n入时十六今六十。\n同时采择百余人，\n零落年深残此身。\n忆昔吞悲别亲族，\n扶入车中不教[2]哭。\n皆云入内便承恩，\n脸似芙蓉胸似玉。\n未容君王得见面，\n已被杨妃遥侧目[3]。\n妒令潜配上阳宫，\n一生遂向空房宿。\n宿空房，秋夜长，\n夜长无寐天不明。\n耿耿[4]残灯背壁影，\n萧萧暗雨打窗声。\n春日迟，\n日迟独坐天难暮。\n宫莺百啭[5]愁厌闻，\n梁燕双栖老休妒[6]。\n莺归燕去长悄然，\n春往秋来不记年。\n唯向深宫望明月，\n东西四五百回圆。\n今日宫中年最老，\n大家[7]遥赐尚书号。\n小头鞵履[8]窄衣裳，\n青黛点眉眉细长。\n外人不见见应笑，\n天宝末年时世妆。\n上阳人，苦最多。\n少亦苦，老亦苦，\n少苦老苦两如何？\n君不见昔时吕向美人赋[9]，\n又不见今日上阳白发歌！\n《上阳白发人》是白居易《新乐府》50首中的第7首。上阳宫是唐玄宗在洛阳的行宫。玄宗派人到民间去挑选美女，但是杨贵妃专宠，怕美丽的宫女接近皇帝，就把她们派到上阳宫去。诗中的白发人是一个16岁入宫的妙龄少女，在深宫内院幽禁了44年，没有见过皇帝一面，只是既嫌秋夜长，又怨春日迟，天明盼着天黑，天黑又盼天明，一直盼成了白发苍苍的老人，盼望变成失望，失望又变成了绝望。这首诗写出了古代女性的悲惨命运。\n注释：\n[1]绿衣监使：内侍省负责监视宫女的宫教等官员，唐制中着绿衣。\n[2]不教：不让。\n[3]遥侧目：远远地斜眼看，表示嫉妒。\n[4]耿耿：微弱的光亮。\n[5]啭（zhuàn）：鸣叫。\n[6]休妒：不再羡慕、嫉妒。\n[7]大家：内宫对皇帝的称谓。\n[8]鞵（xié）、履（lǚ）：二字同义，皆是指鞋。\n[9]美人赋：作者自注为“天宝末，有密采艳色者，当时号花鸟使，吕向献《美人赋》以讽之。”", "english": "The Shangyang Palace maid, the Shangyang Palace maid,\nHer hair grows white, her rosy cheeks grow dark and fade.\nThe palace gate is guarded by eunuchs in green.\nHow many springs have passed, immured as she has been!\nShe was first chosen for the imperial household\nAt the age of sixteen; now she’s sixty years old.\nThe hundred beauties brought in with her have all gone,\nFlickering out through long years, leaving her alone.\nShe swallowed grief when she left home in days gone by,\nHelped into the cab, she was forbidden to cry.\nOnce in the palace, she’d be favored, it was said;\nHer face was fair as lotus, her bosom like jade.\nBut to the emperor she could never come nigh,\nFor Lady Yang had cast on her a jealous eye.\nShe was consigned to Shangyang Palace full of gloom,\nTo pass her lonely days and nights in a bare room.\nIn empty chamber long seemed each autumnal night;\nSleepless in bed, it seemed she’d never see daylight.\nDim, dim the lamplight throws her shadow on the walls;\nShower by shower on her windows chill rain falls.\nSpring days drag slow;\nShe sits alone to see light won’t be dim and low.\nShe’s tired to hear the palace orioles sing and sing,\nToo old to envy pairs of swallows on the wing.\nSilent, she sees the birds appear and disappear,\nAnd counts nor springs nor autumns coming year by year.\nWatching the moon o’er palace again and again,\nFour hundred times and more she’s seen it wax and wane.\nToday the oldest honorable maid of all,\nShe is entitled Secretary of Palace Hall.\nHer gown is tightly fitted, her shoes like pointed prows;\nWith dark green pencil she draws long, long slender brows.\nSeeing her, outsiders would even laugh with tears;\nHer old-fashioned dress has been out of date for years.\nThe Shangyang maid, to suffer is her fate, all told;\nShe suffered while still young; she suffers now she’s old.\nDo you not know a satire spread in days gone by?\nToday for white-haired Shangyang Palace maid we’ll sigh.", "poemType": "乐府/古体", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">上阳人，上阳人，<br>红颜暗老白发新。<br>绿衣监使<sup class=\"note-ref\">[1]</sup>守宫门，<br>一闭上阳多少春！<br>玄宗末岁初选入，<br>入时十六今六十。<br>同时采择百余人，<br>零落年深残此身。<br>忆昔吞悲别亲族，<br>扶入车中不教<sup class=\"note-ref\">[2]</sup>哭。<br>皆云入内便承恩，<br>脸似芙蓉胸似玉。<br>未容君王得见面，<br>已被杨妃遥侧目<sup class=\"note-ref\">[3]</sup>。<br>妒令潜配上阳宫，<br>一生遂向空房宿。<br>宿空房，秋夜长，<br>夜长无寐天不明。<br>耿耿<sup class=\"note-ref\">[4]</sup>残灯背壁影，<br>萧萧暗雨打窗声。<br>春日迟，<br>日迟独坐天难暮。<br>宫莺百啭<sup class=\"note-ref\">[5]</sup>愁厌闻，<br>梁燕双栖老休妒<sup class=\"note-ref\">[6]</sup>。<br>莺归燕去长悄然，<br>春往秋来不记年。<br>唯向深宫望明月，<br>东西四五百回圆。<br>今日宫中年最老，<br>大家<sup class=\"note-ref\">[7]</sup>遥赐尚书号。<br>小头鞵履<sup class=\"note-ref\">[8]</sup>窄衣裳，<br>青黛点眉眉细长。<br>外人不见见应笑，<br>天宝末年时世妆。<br>上阳人，苦最多。<br>少亦苦，老亦苦，<br>少苦老苦两如何？<br>君不见昔时吕向美人赋<sup class=\"note-ref\">[9]</sup>，<br>又不见今日上阳白发歌！</p>\n<p class=\"prose\">《上阳白发人》是白居易《新乐府》50首中的第7首。上阳宫是唐玄宗在洛阳的行宫。玄宗派人到民间去挑选美女，但是杨贵妃专宠，怕美丽的宫女接近皇帝，就把她们派到上阳宫去。</p>\n<p class=\"prose\">诗中的白发人是一个16岁入宫的妙龄少女，在深宫内院幽禁了44年，没有见过皇帝一面，只是既嫌秋夜长，又怨春日迟，天明盼着天黑，天黑又盼天明，一直盼成了白发苍苍的老人，盼望变成失望，失望又变成了绝望。这首诗写出了古代女性的悲惨命运。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]绿衣监使：内侍省负责监视宫女的宫教等官员，唐制中着绿衣。<br>[2]不教：不让。<br>[3]遥侧目：远远地斜眼看，表示嫉妒。<br>[4]耿耿：微弱的光亮。<br>[5]啭（zhuàn）：鸣叫。<br>[6]休妒：不再羡慕、嫉妒。<br>[7]大家：内宫对皇帝的称谓。<br>[8]鞵（xié）、履（lǚ）：二字同义，皆是指鞋。<br>[9]美人赋：作者自注为“天宝末，有密采艳色者，当时号花鸟使，吕向献《美人赋》以讽之。”</p>", "englishHtml": "<p class=\"poem-lines\">The Shangyang Palace maid, the Shangyang Palace maid,<br>Her hair grows white, her rosy cheeks grow dark and fade.<br>The palace gate is guarded by eunuchs in green.<br>How many springs have passed, immured as she has been!<br>She was first chosen for the imperial household<br>At the age of sixteen; now she’s sixty years old.<br>The hundred beauties brought in with her have all gone,<br>Flickering out through long years, leaving her alone.<br>She swallowed grief when she left home in days gone by,<br>Helped into the cab, she was forbidden to cry.<br>Once in the palace, she’d be favored, it was said;<br>Her face was fair as lotus, her bosom like jade.<br>But to the emperor she could never come nigh,<br>For Lady Yang had cast on her a jealous eye.<br>She was consigned to Shangyang Palace full of gloom,<br>To pass her lonely days and nights in a bare room.<br>In empty chamber long seemed each autumnal night;<br>Sleepless in bed, it seemed she’d never see daylight.<br>Dim, dim the lamplight throws her shadow on the walls;<br>Shower by shower on her windows chill rain falls.<br>Spring days drag slow;<br>She sits alone to see light won’t be dim and low.<br>She’s tired to hear the palace orioles sing and sing,<br>Too old to envy pairs of swallows on the wing.<br>Silent, she sees the birds appear and disappear,<br>And counts nor springs nor autumns coming year by year.<br>Watching the moon o’er palace again and again,<br>Four hundred times and more she’s seen it wax and wane.<br>Today the oldest honorable maid of all,<br>She is entitled Secretary of Palace Hall.<br>Her gown is tightly fitted, her shoes like pointed prows;<br>With dark green pencil she draws long, long slender brows.<br>Seeing her, outsiders would even laugh with tears;<br>Her old-fashioned dress has been out of date for years.<br>The Shangyang maid, to suffer is her fate, all told;<br>She suffered while still young; she suffers now she’s old.<br>Do you not know a satire spread in days gone by?<br>Today for white-haired Shangyang Palace maid we’ll sigh.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The White-haired Palace Maid,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as moonlight, clouds, birds, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "007", "zhTitle": "卖炭翁", "enTitle": "The Old Charcoal Seller", "chinese": "伐薪烧炭南山中。\n满面尘灰烟火色[1]，\n两鬓苍苍十指黑。\n卖炭得钱何所营？\n身上衣裳口中食。\n可怜身上衣正单，\n心忧炭贱愿天寒。\n夜来城外一尺雪，\n晓驾炭车辗冰辙。\n牛困人饥日已高，\n市南门外泥中歇。\n翩翩两骑来是谁？\n黄衣使者[2]白衫儿[3]。\n手把文书口称敕[4]，\n回车叱牛牵向北[5]。\n一车炭，千余斤，\n宫使驱将惜不得。\n半匹红纱一丈绫[6]，\n系向牛头充炭直。\n《卖炭翁》是《新乐府》中的第三十二首。诗中写卖炭翁伐薪烧炭，两鬓苍苍，可见年迈；满面尘土，可见生活艰苦。“卖炭得钱何所营？身上衣裳口中食”，可见他贫寒。虽然他“身上衣正单”，却“心忧炭贱愿天寒”，可见他多么需要卖炭赚钱来维持生计。但他千辛万苦烧出来的千余斤炭，却被宦官强征暴敛，只用“半匹红纱一丈绫”的代价，就抢走了，叫卖炭翁如何能生活下去!诗人以个别表现一般，通过卖炭翁的遭遇，揭示了封建王朝的剥削本质。\n注释：\n[1]烟火色：烟熏后的脸色，此处表现卖炭翁的辛劳。\n[2]黄衣使者：指宦官。\n[3]白衫儿：宦官的手下。\n[4]敕（chì）：皇帝的诏书或命令。\n[5]牵向北：此处指牵向宫中。\n[6]半匹红绡一丈绫：唐代商贸交易中，绢帛等丝织品可代货币使用。当时半匹纱和一丈绫，比一车炭的价值相差很远。此为官方用贱价强夺民财的体现。", "english": "What does the old man fare?\nHe cuts the wood in southern hill and fires his ware.\nHis face is grimed with smoke and streaked with ash and dust,\nHis temples grizzled and his fingers all turned black.\nThe money earned by selling charcoal is not just\nEnough for food for his mouth and clothing for his back.\nThough his coat is thin, he hopes winter will set in,\nFor cold weather will keep up the charcoal’s good price.\nAt night a foot of snow falls outside city walls;\nAt dawn his charcoal cart crushes ruts in the ice.\nThe sun is high, the ox tired out and hungry he;\nOutside the southern gate in snow and slush they rest.\nTwo riders canter up. Alas! Who can they be?\nTwo palace heralds in the yellow jackets dressed.\nDecree in hand, which is imperial order, one says;\nThey turn the cart about and at the ox they shout.\nA cartload of charcoal a thousand catties weighs;\nThey drive the cart away. What dare the old man say?\nTen feet of silk and twenty feet of gauze deep red,\nThat is the payment they fasten to the ox’s head.", "poemType": "乐府/古体", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">伐薪烧炭南山中。<br>满面尘灰烟火色<sup class=\"note-ref\">[1]</sup>，<br>两鬓苍苍十指黑。<br>卖炭得钱何所营？<br>身上衣裳口中食。<br>可怜身上衣正单，<br>心忧炭贱愿天寒。<br>夜来城外一尺雪，<br>晓驾炭车辗冰辙。<br>牛困人饥日已高，<br>市南门外泥中歇。<br>翩翩两骑来是谁？<br>黄衣使者<sup class=\"note-ref\">[2]</sup>白衫儿<sup class=\"note-ref\">[3]</sup>。<br>手把文书口称敕<sup class=\"note-ref\">[4]</sup>，<br>回车叱牛牵向北<sup class=\"note-ref\">[5]</sup>。<br>一车炭，千余斤，<br>宫使驱将惜不得。<br>半匹红纱一丈绫<sup class=\"note-ref\">[6]</sup>，<br>系向牛头充炭直。</p>\n<p class=\"prose\">《卖炭翁》是《新乐府》中的第三十二首。诗中写卖炭翁伐薪烧炭，两鬓苍苍，可见年迈；满面尘土，可见生活艰苦。“卖炭得钱何所营？身上衣裳口中食”，可见他贫寒。虽然他“身上衣正单”，却“心忧炭贱愿天寒”，可见他多么需要卖炭赚钱来维持生计。</p>\n<p class=\"prose\">但他千辛万苦烧出来的千余斤炭，却被宦官强征暴敛，只用“半匹红纱一丈绫”的代价，就抢走了，叫卖炭翁如何能生活下去!诗人以个别表现一般，通过卖炭翁的遭遇，揭示了封建王朝的剥削本质。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]烟火色：烟熏后的脸色，此处表现卖炭翁的辛劳。<br>[2]黄衣使者：指宦官。<br>[3]白衫儿：宦官的手下。<br>[4]敕（chì）：皇帝的诏书或命令。<br>[5]牵向北：此处指牵向宫中。<br>[6]半匹红绡一丈绫：唐代商贸交易中，绢帛等丝织品可代货币使用。当时半匹纱和一丈绫，比一车炭的价值相差很远。此为官方用贱价强夺民财的体现。</p>", "englishHtml": "<p class=\"poem-lines\">What does the old man fare?<br>He cuts the wood in southern hill and fires his ware.<br>His face is grimed with smoke and streaked with ash and dust,<br>His temples grizzled and his fingers all turned black.<br>The money earned by selling charcoal is not just<br>Enough for food for his mouth and clothing for his back.<br>Though his coat is thin, he hopes winter will set in,<br>For cold weather will keep up the charcoal’s good price.<br>At night a foot of snow falls outside city walls;<br>At dawn his charcoal cart crushes ruts in the ice.<br>The sun is high, the ox tired out and hungry he;<br>Outside the southern gate in snow and slush they rest.<br>Two riders canter up. Alas! Who can they be?<br>Two palace heralds in the yellow jackets dressed.<br>Decree in hand, which is imperial order, one says;<br>They turn the cart about and at the ox they shout.<br>A cartload of charcoal a thousand catties weighs;<br>They drive the cart away. What dare the old man say?<br>Ten feet of silk and twenty feet of gauze deep red,<br>That is the payment they fasten to the ox’s head.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Old Charcoal Seller,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a yuefu or ancient-style poem, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as mountains and clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "008", "zhTitle": "同李十一醉忆元九", "enTitle": "Thinking of Yuan Zhen While Drinking with Li Eleventh", "chinese": "花时同醉破[1]春愁，\n醉折花枝当酒筹。\n忽忆故人天际[2]去，\n计程今日到梁州。\n公元809年，元稹奉命出使东川，白居易在长安，同李十一到曲江慈恩寺春游饮酒，席上怀念元稹，就写了这首诗。这时元稹正在梁州，并且写了一首《梁州梦》：“梦君同绕曲江头，也向慈恩院院游。亭吏呼人排去马，忽惊身在古梁州。”说来也巧，元稹写的梦境，居然和白居易写的真实情况相符，真是“心有灵犀一点通”了。白居易的诗是一首即景生情、因事起意、以情深意真见长的作品。\n注释：\n[1]破：破除，消除。\n[2]天际：天地交接的地方。", "english": "We drink beneath the flowers to drown vernal grief;\nI pluck a branch in blossom to write on a leaf,\nThinking of our friend who has gone far, far away;\nCounting up, he must have reached Liangzhou today.", "poemType": "七言绝句", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">花时同醉破<sup class=\"note-ref\">[1]</sup>春愁，<br>醉折花枝当酒筹。<br>忽忆故人天际<sup class=\"note-ref\">[2]</sup>去，<br>计程今日到梁州。</p>\n<p class=\"prose\">公元809年，元稹奉命出使东川，白居易在长安，同李十一到曲江慈恩寺春游饮酒，席上怀念元稹，就写了这首诗。这时元稹正在梁州，并且写了一首《梁州梦》：“梦君同绕曲江头，也向慈恩院院游。亭吏呼人排去马，忽惊身在古梁州。”说来也巧，元稹写的梦境，居然和白居易写的真实情况相符，真是“心有灵犀一点通”了。</p>\n<p class=\"prose\">白居易的诗是一首即景生情、因事起意、以情深意真见长的作品。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]破：破除，消除。<br>[2]天际：天地交接的地方。</p>", "englishHtml": "<p class=\"poem-lines\">We drink beneath the flowers to drown vernal grief;<br>I pluck a branch in blossom to write on a leaf,<br>Thinking of our friend who has gone far, far away;<br>Counting up, he must have reached Liangzhou today.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Thinking of Yuan Zhen While Drinking with Li Eleventh,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as flowers and wine give the poem its visual texture and emotional temperature.</p>"}, {"num": "009", "zhTitle": "望驿台", "enTitle": "For Roaming Yuan Zhen", "chinese": "靖安宅里当窗柳，\n望驿台前扑地花。\n两处春光同日尽，\n居人[1]思客[2]客思家。\n公元809年，元稹在东川写了一组绝句《使东川》，白居易也写了12首和诗，这是其中之一。第一句“靖安宅里”指元稹夫人在长安靖安宅里思念丈夫。“当窗柳”是怀念远人的意思，唐代折柳送别，柳丝柔长不断，象征情思不绝。第二句写元稹在东川驿邸，看见落花满地，自然也想起了家中的如花美眷。后两句说：到了三月三十日，两地都春尽花残，夫妇却不能重聚，只好流泪眼想流泪眼，断肠人念断肠人了。\n注释：\n[1]居人：留在家中的人，此处指元稹妻子。\n[2]客：指离家在外的元稹。", "english": "Your wife gazes at yellowing willow at home;\nYou at flowers falling on the ground while you roam.\nSpring comes to end in two places on the same day;\nYou think of home and she of you far, far away.", "poemType": "七言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">靖安宅里当窗柳，<br>望驿台前扑地花。<br>两处春光同日尽，<br>居人<sup class=\"note-ref\">[1]</sup>思客<sup class=\"note-ref\">[2]</sup>客思家。</p>\n<p class=\"prose\">公元809年，元稹在东川写了一组绝句《使东川》，白居易也写了12首和诗，这是其中之一。第一句“靖安宅里”指元稹夫人在长安靖安宅里思念丈夫。“当窗柳”是怀念远人的意思，唐代折柳送别，柳丝柔长不断，象征情思不绝。第二句写元稹在东川驿邸，看见落花满地，自然也想起了家中的如花美眷。</p>\n<p class=\"prose\">后两句说：到了三月三十日，两地都春尽花残，夫妇却不能重聚，只好流泪眼想流泪眼，断肠人念断肠人了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]居人：留在家中的人，此处指元稹妻子。<br>[2]客：指离家在外的元稹。</p>", "englishHtml": "<p class=\"poem-lines\">Your wife gazes at yellowing willow at home;<br>You at flowers falling on the ground while you roam.<br>Spring comes to end in two places on the same day;<br>You think of home and she of you far, far away.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “For Roaming Yuan Zhen,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as flowers, trees, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "010", "zhTitle": "江楼月", "enTitle": "The Moon over the Riverside Tower", "chinese": "嘉陵江曲曲江池，\n明月虽同人别离。\n一宵光景潜[1]相忆，\n两地阴晴远不知。\n谁料江边怀我夜，\n正当池畔望君时。\n今朝同语方共悔，\n不解[2]多情先寄诗。\n本诗也是白居易公元809年和元稹的作品。第一联写元稹远在东川嘉陵江边，白居易在长安曲江池畔，两人同时对月，却相距千里之遥。第二联“一宵”说明相忆时间之长，“潜”字暗示相忆之深，但是两地并不能相互沟通。第三联说：想不到元稹在嘉陵江边遥念我时，我也在曲江池畔望月怀人。第四联说：一直等到我得了元稹寄来的诗，才后悔自己为什么不早把诗寄去。全诗情景交融，看来句句抒情，其实情中有景：江楼、明月、诗人、友人，都融合在怀念之中了。\n注释：\n[1]潜：表深思的神态。\n[2]不解：没有想到。", "english": "You stand by River Jialing, I by winding streams.\nThough far apart, still we share the same bright moonbeams.\nAll night long I think of you and for you I pine,\nFor I am not sure if you see the same moon shine.\nWho knows when by waterside I’m longing for you,\nBy nocturnal riverside you’re missing me too.\nWhen I receive your poem, I regret today:\nWhy did I not send mine to you so far away?", "poemType": "七言律诗", "poemTheme": "酬赠怀人", "chineseHtml": "<p class=\"poem-lines\">嘉陵江曲曲江池，<br>明月虽同人别离。<br>一宵光景潜<sup class=\"note-ref\">[1]</sup>相忆，<br>两地阴晴远不知。<br>谁料江边怀我夜，<br>正当池畔望君时。<br>今朝同语方共悔，<br>不解<sup class=\"note-ref\">[2]</sup>多情先寄诗。</p>\n<p class=\"prose\">本诗也是白居易公元809年和元稹的作品。第一联写元稹远在东川嘉陵江边，白居易在长安曲江池畔，两人同时对月，却相距千里之遥。第二联“一宵”说明相忆时间之长，“潜”字暗示相忆之深，但是两地并不能相互沟通。第三联说：想不到元稹在嘉陵江边遥念我时，我也在曲江池畔望月怀人。</p>\n<p class=\"prose\">第四联说：一直等到我得了元稹寄来的诗，才后悔自己为什么不早把诗寄去。全诗情景交融，看来句句抒情，其实情中有景：江楼、明月、诗人、友人，都融合在怀念之中了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]潜：表深思的神态。<br>[2]不解：没有想到。</p>", "englishHtml": "<p class=\"poem-lines\">You stand by River Jialing, I by winding streams.<br>Though far apart, still we share the same bright moonbeams.<br>All night long I think of you and for you I pine,<br>For I am not sure if you see the same moon shine.<br>Who knows when by waterside I’m longing for you,<br>By nocturnal riverside you’re missing me too.<br>When I receive your poem, I regret today:<br>Why did I not send mine to you so far away?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Moon over the Riverside Tower,” the poem is addressed through friendship, memory, or response, making personal connection its center.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Bai Juyi&#x27;s ability to make a brief scene carry a full emotional atmosphere. Key images such as water and moonlight give the poem its visual texture and emotional temperature.</p>"}, {"num": "011", "zhTitle": "买花", "enTitle": "Buying Flowers", "chinese": "帝城春欲暮，\n喧喧[1]车马度。\n共道牡丹时，\n相随买花去。\n贵贱无常价[2]，\n酬直[3]看花数：\n灼灼[4]百朵红，\n戋戋[5]五束素[6]。\n上张幄幕庇[7]，\n旁织笆篱护。\n水洒复泥封，\n移来色如故。\n家家习为俗，\n人人迷不悟[8]。\n有一田舍翁，\n偶来买花处。\n低头独长叹，\n此叹无人谕[9]。\n一丛深色花，\n十户中人[10]赋。\n这首诗通过唐代京城买牡丹花的盛况，揭露了社会矛盾的某些本质方面。暮春时，农村青黄不接，长安城中却车水马龙，忙于买花。富贵人家挥金如土，一株开了百朵花的红牡丹，估价竟相当于二十五匹帛，昂贵得惊人。一个从啼饥号寒的农村来到京城的田舍翁，看了不禁长叹，一丛花居然要花费十户中等人家的税粮。这就尖锐地反映了剥削的富人和穷苦的农民之间的深刻矛盾。\n注释：\n[1]喧喧：喧闹嘈杂的声音。\n[2]无常价：没有固定的价格。\n[3]酬直：指花的价钱；直：通“值”。\n[4]灼灼：形容色彩鲜艳的样子。\n[5]戋（jiān）戋：形容堆积得很多的样子。\n[6]五束素：古代以五匹为一束，即二十五匹白娟。\n[7]幄幕庇：用帘幕遮挡。\n[8]迷不悟：迷恋于赏花，不知这是奢侈的事情。\n[9]谕：知晓，明白。\n[10]中人：即中户，中等人家。唐代按户征收赋税，分上中下三等。", "english": "The capital’s in parting spring,\nSteeds run and neigh and cab bells ring.\nPeonies are at their best hours\nAnd people rush to buy the flowers.\nThey do not care about the price,\nJust count and buy those which seem nice.\nFor hundred blossoms dazzling red,\nTwenty-five rolls of silk they spread.\nSheltered above by curtains wide,\nProtected with fences by the side,\nRoots sealed with mud, with water sprayed,\nRemoved, their beauty does not fade.\nAccustomed to this way for long,\nNo family e’er thinks it wrong.\nWhat’s the old peasant doing there?\nWhy should he come to Flower Fair?\nHead bowed, he utters sigh on sigh\nAnd nobody understands why.\nA bunch of deep-red peonies\nCosts taxes of ten families.", "poemType": "五言古诗", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">帝城春欲暮，<br>喧喧<sup class=\"note-ref\">[1]</sup>车马度。<br>共道牡丹时，<br>相随买花去。<br>贵贱无常价<sup class=\"note-ref\">[2]</sup>，<br>酬直<sup class=\"note-ref\">[3]</sup>看花数：<br>灼灼<sup class=\"note-ref\">[4]</sup>百朵红，<br>戋戋<sup class=\"note-ref\">[5]</sup>五束素<sup class=\"note-ref\">[6]</sup>。<br>上张幄幕庇<sup class=\"note-ref\">[7]</sup>，<br>旁织笆篱护。<br>水洒复泥封，<br>移来色如故。<br>家家习为俗，<br>人人迷不悟<sup class=\"note-ref\">[8]</sup>。<br>有一田舍翁，<br>偶来买花处。<br>低头独长叹，<br>此叹无人谕<sup class=\"note-ref\">[9]</sup>。<br>一丛深色花，<br>十户中人<sup class=\"note-ref\">[10]</sup>赋。</p>\n<p class=\"prose\">这首诗通过唐代京城买牡丹花的盛况，揭露了社会矛盾的某些本质方面。暮春时，农村青黄不接，长安城中却车水马龙，忙于买花。富贵人家挥金如土，一株开了百朵花的红牡丹，估价竟相当于二十五匹帛，昂贵得惊人。一个从啼饥号寒的农村来到京城的田舍翁，看了不禁长叹，一丛花居然要花费十户中等人家的税粮。</p>\n<p class=\"prose\">这就尖锐地反映了剥削的富人和穷苦的农民之间的深刻矛盾。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]喧喧：喧闹嘈杂的声音。<br>[2]无常价：没有固定的价格。<br>[3]酬直：指花的价钱；直：通“值”。<br>[4]灼灼：形容色彩鲜艳的样子。<br>[5]戋（jiān）戋：形容堆积得很多的样子。<br>[6]五束素：古代以五匹为一束，即二十五匹白娟。<br>[7]幄幕庇：用帘幕遮挡。<br>[8]迷不悟：迷恋于赏花，不知这是奢侈的事情。<br>[9]谕：知晓，明白。<br>[10]中人：即中户，中等人家。唐代按户征收赋税，分上中下三等。</p>", "englishHtml": "<p class=\"poem-lines\">The capital’s in parting spring,<br>Steeds run and neigh and cab bells ring.<br>Peonies are at their best hours<br>And people rush to buy the flowers.<br>They do not care about the price,<br>Just count and buy those which seem nice.<br>For hundred blossoms dazzling red,<br>Twenty-five rolls of silk they spread.<br>Sheltered above by curtains wide,<br>Protected with fences by the side,<br>Roots sealed with mud, with water sprayed,<br>Removed, their beauty does not fade.<br>Accustomed to this way for long,<br>No family e’er thinks it wrong.<br>What’s the old peasant doing there?<br>Why should he come to Flower Fair?<br>Head bowed, he utters sigh on sigh<br>And nobody understands why.<br>A bunch of deep-red peonies<br>Costs taxes of ten families.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “Buying Flowers,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a five-character ancient-style poem, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as water, flowers, and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "012", "zhTitle": "惜牡丹花", "enTitle": "The Last Look at the Peonies at Night", "chinese": "惆怅[1]阶前红牡丹，\n晚来唯有两枝残。\n明朝风起应吹尽，\n夜惜衰红把火看。\n白居易这首诗很出名，后来李商隐的《花下醉》“客散酒醒深夜后，更持红烛赏残花”，苏东坡的《海棠》“只恐夜深花睡去，故烧高烛照红妆”，可能都受到白居易这首诗的启发。 《唐诗鉴赏辞典》中说：第二句“晚来唯有两枝残”是“只有两枝残败”的意思。那第一句为什么说“惆怅阶前红牡丹”呢？可见第二句是红牡丹“唯有”两残枝的意思，所以诗人才惆怅了。因为担心明日起风会把残花吹尽，所以诗人才会秉烛看残红。\n注释：\n[1]惆怅：伤感，失意。", "english": "I’m saddened by the courtyard peonies brilliant red;\nAt dusk only two of them are left on their bed.\nI am afraid they can’t survive the morning blast;\nBy lantern light I take a look at the long, long last.", "poemType": "七言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">惆怅<sup class=\"note-ref\">[1]</sup>阶前红牡丹，<br>晚来唯有两枝残。<br>明朝风起应吹尽，<br>夜惜衰红把火看。</p>\n<p class=\"prose\">白居易这首诗很出名，后来李商隐的《花下醉》“客散酒醒深夜后，更持红烛赏残花”，苏东坡的《海棠》“只恐夜深花睡去，故烧高烛照红妆”，可能都受到白居易这首诗的启发。《唐诗鉴赏辞典》中说：第二句“晚来唯有两枝残”是“只有两枝残败”的意思。</p>\n<p class=\"prose\">那第一句为什么说“惆怅阶前红牡丹”呢？可见第二句是红牡丹“唯有”两残枝的意思，所以诗人才惆怅了。因为担心明日起风会把残花吹尽，所以诗人才会秉烛看残红。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]惆怅：伤感，失意。</p>", "englishHtml": "<p class=\"poem-lines\">I’m saddened by the courtyard peonies brilliant red;<br>At dusk only two of them are left on their bed.<br>I am afraid they can’t survive the morning blast;<br>By lantern light I take a look at the long, long last.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Last Look at the Peonies at Night,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as age and illness give the poem its visual texture and emotional temperature.</p>"}, {"num": "013", "zhTitle": "村夜", "enTitle": "One Night in the Village", "chinese": "霜草苍苍[1]虫切切，\n村南村北行人绝。\n独出前门望野田，\n月明荞麦花如雪。\n这首诗用白描的手法写出了一个乡村之夜。“霜草苍苍”点出了秋色的浓重，虫声切切渲染了秋夜的凄清。村南村北，行人绝迹，写的是景，但是景色的萧瑟凄凉，又透露出诗人孤独寂寞的心情。后两句从门内转到野外，一望明月如水，荞麦如雪，这光明的景象和诗人忧郁的心情形成了鲜明的对比，使诗人的心灵受到大自然的洗礼，感情也变得洁如霜雪了。这种寓情于景的写法使诗读起来更富有韵味。\n注释：\n[1]苍苍：苍白色。", "english": "The chilly crickets chirp among the grass frost-white;\nNorth and south of the village there’s no man in sight.\nI come outdoors alone and gaze on the fields, lo!\nThe buckwheat steeped in moonlight looks as white as snow.", "poemType": "七言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">霜草苍苍<sup class=\"note-ref\">[1]</sup>虫切切，<br>村南村北行人绝。<br>独出前门望野田，<br>月明荞麦花如雪。</p>\n<p class=\"prose\">这首诗用白描的手法写出了一个乡村之夜。“霜草苍苍”点出了秋色的浓重，虫声切切渲染了秋夜的凄清。村南村北，行人绝迹，写的是景，但是景色的萧瑟凄凉，又透露出诗人孤独寂寞的心情。后两句从门内转到野外，一望明月如水，荞麦如雪，这光明的景象和诗人忧郁的心情形成了鲜明的对比，使诗人的心灵受到大自然的洗礼，感情也变得洁如霜雪了。</p>\n<p class=\"prose\">这种寓情于景的写法使诗读起来更富有韵味。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]苍苍：苍白色。</p>", "englishHtml": "<p class=\"poem-lines\">The chilly crickets chirp among the grass frost-white;<br>North and south of the village there’s no man in sight.<br>I come outdoors alone and gaze on the fields, lo!<br>The buckwheat steeped in moonlight looks as white as snow.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “One Night in the Village,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as moonlight and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "014", "zhTitle": "欲与元八卜邻，先有是赠", "enTitle": "On Becoming Neighbor of Yuan Eighth", "chinese": "平生心迹最相亲，\n欲隐墙东[1]不为身。\n明月好同三径[2]夜，\n绿杨[3]宜作两家春。\n每因暂出犹思伴，\n岂得安居不择邻？\n可独[4]终身数相见，\n子孙长作隔墙人。\n元八是元稹（元九）的堂兄，是白居易的诗友。公元815年，元八在长安升平坊买了一所新宅，白居易想和他结邻而居，就写了这首诗。前四句说：你我是生平最知心的朋友，都想隐居生活而不谋求自身的功名利禄。既然如此，那我们就结为邻居吧，让明月的清辉共照我们的松径，让绿杨的春色回到我们两家。后四句说：暂时外出，还需要结伴同行，长期定居，怎能不选择邻居？一旦为邻，不但可以时常相见，而且子孙后代也可以和睦相处。这首诗看起来是说理，其实理中有情，写出了殷切而纯真的友谊。\n注释：\n[1]墙东：指代隐居之地。典故出自《后汉书·逸民传·逢萌》：“君公遭乱独不去，侩牛自隐。时人谓之论曰：‘避世墙东王君公。’”\n[2]三径：指代隐居之所。典故出自陶渊明《归去来兮辞》：“三径就荒，松菊犹存”。\n[3]绿杨：借用南朝陆慧晓与张融为邻的典故，两家中间有池，池上有绿杨，表示自己愿与元八为邻。\n[4]可独：何止，不仅仅。", "english": "In my life you are the friend nearest to my heart;\nI’ll live by your east wall, not to be kept apart.\nThe moon will shed bright rays on our pine-clad pathways;\nGreen willows bring to our houses the same spring days.\nEven in short outings we need companions good.\nHow can we not, when long installed, choose neighborhood?\nNow we may call on each other from spring to fall;\nOur sons will never be separated by the wall.", "poemType": "七言律诗", "poemTheme": "讽喻民生", "chineseHtml": "<p class=\"poem-lines\">平生心迹最相亲，<br>欲隐墙东<sup class=\"note-ref\">[1]</sup>不为身。<br>明月好同三径<sup class=\"note-ref\">[2]</sup>夜，<br>绿杨<sup class=\"note-ref\">[3]</sup>宜作两家春。<br>每因暂出犹思伴，<br>岂得安居不择邻？<br>可独<sup class=\"note-ref\">[4]</sup>终身数相见，<br>子孙长作隔墙人。</p>\n<p class=\"prose\">元八是元稹（元九）的堂兄，是白居易的诗友。公元815年，元八在长安升平坊买了一所新宅，白居易想和他结邻而居，就写了这首诗。前四句说：你我是生平最知心的朋友，都想隐居生活而不谋求自身的功名利禄。既然如此，那我们就结为邻居吧，让明月的清辉共照我们的松径，让绿杨的春色回到我们两家。</p>\n<p class=\"prose\">后四句说：暂时外出，还需要结伴同行，长期定居，怎能不选择邻居？一旦为邻，不但可以时常相见，而且子孙后代也可以和睦相处。这首诗看起来是说理，其实理中有情，写出了殷切而纯真的友谊。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]墙东：指代隐居之地。典故出自《后汉书·逸民传·逢萌》：“君公遭乱独不去，侩牛自隐。时人谓之论曰：‘避世墙东王君公。’”<br>[2]三径：指代隐居之所。典故出自陶渊明《归去来兮辞》：“三径就荒，松菊犹存”。<br>[3]绿杨：借用南朝陆慧晓与张融为邻的典故，两家中间有池，池上有绿杨，表示自己愿与元八为邻。<br>[4]可独：何止，不仅仅。</p>", "englishHtml": "<p class=\"poem-lines\">In my life you are the friend nearest to my heart;<br>I’ll live by your east wall, not to be kept apart.<br>The moon will shed bright rays on our pine-clad pathways;<br>Green willows bring to our houses the same spring days.<br>Even in short outings we need companions good.<br>How can we not, when long installed, choose neighborhood?<br>Now we may call on each other from spring to fall;<br>Our sons will never be separated by the wall.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “On Becoming Neighbor of Yuan Eighth,” the poem turns an ordinary human situation into clear social criticism, keeping sympathy close to plain speech.</p>\n<p class=\"commentary\">As a seven-character regulated verse, it shows Bai Juyi&#x27;s gift for making story and plain language carry moral force. Key images such as moonlight and homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "015", "zhTitle": "燕子楼", "enTitle": "The Pavilion of Swallows", "chinese": "（三首其一）\n满窗明月满帘霜，\n被冷灯残拂卧床[1]。\n燕子楼中霜月夜，\n秋来只为一人长。\n燕子楼是唐代张尚书在彭城（今徐州）的宅第。尚书曾在宅中宴请白居易和张仲素，并请出爱伎盼盼歌舞助兴。尚书死后，盼盼誓不再嫁，在燕子楼住了十几年。张仲素对盼盼的专情不胜感慨，写了三首七绝《燕子楼》，白居易也和了三首。第一首用“满窗月”和“满帘霜”对照，把“被冷”和“灯残”合写，当年盼盼为尚书拂床，而今只为自己一人，就觉得霜晨月夜都太长了。第二首写盼盼怎样对待歌舞时穿过的衣裳。《霓裳曲》是唐玄宗时著名的舞曲，现在尚书已死，她也不再歌舞，就把舞衣叠起，让金花褪去光彩，罗衫改变颜色，只剩自己一个人流泪了。第三首中的“客”是张仲素，他去洛阳看了尚书墓，说是坟前的白杨已经高大得可以做柱子了，盼盼的红颜怎能不“蜡炬成灰泪始干”呢！诗人抚今思昔，写出了盼盼春日秋夜的相思，表达了她的一片深情。\n注释：\n[1]拂卧床：此处暗示盼盼侍妾的身份，也表明其生活的变化。", "english": "(I)\nHer room is drowned in moonlight and the screen in frost;\nThe quilt grows cold with dying lamp; she makes the bed.\nThe moonlit night in which Swallows’ Pavilion’s lost,\nSince autumn came, lengthens for one who mourns the dead.", "poemType": "七言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">（三首其一）<br>满窗明月满帘霜，<br>被冷灯残拂卧床<sup class=\"note-ref\">[1]</sup>。<br>燕子楼中霜月夜，<br>秋来只为一人长。</p>\n<p class=\"prose\">燕子楼是唐代张尚书在彭城（今徐州）的宅第。尚书曾在宅中宴请白居易和张仲素，并请出爱伎盼盼歌舞助兴。尚书死后，盼盼誓不再嫁，在燕子楼住了十几年。张仲素对盼盼的专情不胜感慨，写了三首七绝《燕子楼》，白居易也和了三首。第一首用“满窗月”和“满帘霜”对照，把“被冷”和“灯残”合写，当年盼盼为尚书拂床，而今只为自己一人，就觉得霜晨月夜都太长了。</p>\n<p class=\"prose\">第二首写盼盼怎样对待歌舞时穿过的衣裳。《霓裳曲》是唐玄宗时著名的舞曲，现在尚书已死，她也不再歌舞，就把舞衣叠起，让金花褪去光彩，罗衫改变颜色，只剩自己一个人流泪了。第三首中的“客”是张仲素，他去洛阳看了尚书墓，说是坟前的白杨已经高大得可以做柱子了，盼盼的红颜怎能不“蜡炬成灰泪始干”呢！</p>\n<p class=\"prose\">诗人抚今思昔，写出了盼盼春日秋夜的相思，表达了她的一片深情。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]拂卧床：此处暗示盼盼侍妾的身份，也表明其生活的变化。</p>", "englishHtml": "<p class=\"stanza-marker\">(I)</p>\n<p class=\"poem-lines\">Her room is drowned in moonlight and the screen in frost;<br>The quilt grows cold with dying lamp; she makes the bed.<br>The moonlit night in which Swallows’ Pavilion’s lost,<br>Since autumn came, lengthens for one who mourns the dead.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Pavilion of Swallows,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as moonlight give the poem its visual texture and emotional temperature.</p>"}, {"num": "016", "zhTitle": "燕子楼", "enTitle": "The Pavilion of Swallows", "chinese": "（三首其二）\n钿晕罗衫色似烟，\n几回欲著即潸然。\n自从不舞霓裳曲，\n叠在空[1]箱十一年。\n注释：\n[1]空：形容精神上的空虚。", "english": "(II)\nHer silken dress with golden flowers fades like smoke;\nShe tries to put it on, but soon she melts in tears.\nSince she no longer danced to the air of “Rainbow Cloak”,\nIt has been stored up in the chest for ten long years.", "poemType": "七言绝句", "poemTheme": "平易抒怀", "chineseHtml": "<p class=\"poem-lines\">（三首其二）<br>钿晕罗衫色似烟，<br>几回欲著即潸然。<br>自从不舞霓裳曲，<br>叠在空<sup class=\"note-ref\">[1]</sup>箱十一年。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]空：形容精神上的空虚。</p>", "englishHtml": "<p class=\"stanza-marker\">(II)</p>\n<p class=\"poem-lines\">Her silken dress with golden flowers fades like smoke;<br>She tries to put it on, but soon she melts in tears.<br>Since she no longer danced to the air of “Rainbow Cloak”,<br>It has been stored up in the chest for ten long years.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Pavilion of Swallows,” the poem lets direct language carry emotion without heaviness, which is central to Bai Juyi&#x27;s appeal.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as clouds give the poem its visual texture and emotional temperature.</p>"}, {"num": "017", "zhTitle": "燕子楼", "enTitle": "The Pavilion of Swallows", "chinese": "（三首其三）\n今春有客洛阳回，\n曾到尚书墓上来。\n见说白杨堪作柱，\n争教红粉[1]不成灰？\n注释：\n[1]红粉：此处指盼盼的红颜。", "english": "(III)\nSome friends coming back from ancient capital say\nThey’ve visited the grave of her dear lord again.\nThe graveyard poplar white grows high as pillar grey.\nHow can her rosy face still beautiful remain?", "poemType": "七言绝句", "poemTheme": "平易抒怀", "chineseHtml": "<p class=\"poem-lines\">（三首其三）<br>今春有客洛阳回，<br>曾到尚书墓上来。<br>见说白杨堪作柱，<br>争教红粉<sup class=\"note-ref\">[1]</sup>不成灰？</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]红粉：此处指盼盼的红颜。</p>", "englishHtml": "<p class=\"stanza-marker\">(III)</p>\n<p class=\"poem-lines\">Some friends coming back from ancient capital say<br>They’ve visited the grave of her dear lord again.<br>The graveyard poplar white grows high as pillar grey.<br>How can her rosy face still beautiful remain?</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “The Pavilion of Swallows,” the poem lets direct language carry emotion without heaviness, which is central to Bai Juyi&#x27;s appeal.</p>\n<p class=\"commentary\">As a seven-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as homecoming give the poem its visual texture and emotional temperature.</p>"}, {"num": "018", "zhTitle": "花非花", "enTitle": "A Flower in the Haze", "chinese": "花非花，雾非雾。\n夜半来，天明去。\n来如春梦几多时，\n去似朝云[1]无觅处。\n《花非花》是白居易写的一首朦胧诗，诗中人物似花似雾，如梦如云。通篇都用比喻，但是只用喻体（用作比喻之物），不见喻本（所喻之人或物），所以就朦胧了。这首诗由作者编入“感伤”之部，放在悼亡之作《真娘墓》和《简简吟》之后。《真娘墓》中有“真娘死时犹少年”“难留连，易销歇；塞北花，江南雪”等三七言诗句，《简简吟》中有“彩云易散琉璃脆”之句，所以《花非花》也很可能是悼亡之作。\n注释：\n[1]朝云：典故出自《高唐赋》，化用“朝云暮雨”，比喻男女情爱。", "english": "In bloom, she’s not a flower;\nHazy, she’s not a haze.\nShe comes at midnight hour;\nShe goes with starry rays.\nShe comes like vernal dreams that cannot stay;\nShe goes like morning clouds that melt away.", "poemType": "六言绝句", "poemTheme": "江南风物", "chineseHtml": "<p class=\"poem-lines\">花非花，雾非雾。<br>夜半来，天明去。<br>来如春梦几多时，<br>去似朝云<sup class=\"note-ref\">[1]</sup>无觅处。</p>\n<p class=\"prose\">《花非花》是白居易写的一首朦胧诗，诗中人物似花似雾，如梦如云。通篇都用比喻，但是只用喻体（用作比喻之物），不见喻本（所喻之人或物），所以就朦胧了。这首诗由作者编入“感伤”之部，放在悼亡之作《真娘墓》和《简简吟》之后。《真娘墓》中有“真娘死时犹少年”“难留连，易销歇；</p>\n<p class=\"prose\">塞北花，江南雪”等三七言诗句，《简简吟》中有“彩云易散琉璃脆”之句，所以《花非花》也很可能是悼亡之作。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]朝云：典故出自《高唐赋》，化用“朝云暮雨”，比喻男女情爱。</p>", "englishHtml": "<p class=\"poem-lines\">In bloom, she’s not a flower;<br>Hazy, she’s not a haze.<br>She comes at midnight hour;<br>She goes with starry rays.<br>She comes like vernal dreams that cannot stay;<br>She goes like morning clouds that melt away.</p>\n<h4 class=\"commentary-title\">Commentary</h4>\n<p class=\"commentary\">In “A Flower in the Haze,” the poem remembers landscape through color, rhythm, and sensuous detail, making place feel intimate and vivid.</p>\n<p class=\"commentary\">As a six-character quatrain, it shows Bai Juyi&#x27;s gift for making lucid language feel musical and memorable. Key images such as clouds and flowers give the poem its visual texture and emotional temperature.</p>"}, {"num": "019", "zhTitle": "初贬官过望秦岭", "enTitle": "Passing by the Head-turning Peak in Banishment", "chinese": "草草[1]辞家忧后事，\n迟迟去国问前途。\n望秦岭上回头立，\n无限秋风吹白须。\n公元815年，宰相武元衡被暗杀身亡，白居易上书奏请捉拿凶手，却被权贵责为越职上奏，贬为江州（今江西省九江市）司马。他路经骊山脚下的望秦岭时，写下了这首双关诗。第一句说匆匆离家，来不及安排家事，更担心的是国家大事。第二句说慢慢上路，舍不得离开国都，去江州的路途遥远，自己政治上的前途更是渺茫。所以在望秦岭上回望京城，就只感到秋风吹动白须，自己觉得茫然了。\n注释：\n[1]草草：匆忙。", "english": "Leaving home in haste, I’m worried about my fate;\nWithout knowing what will happen, I linger late.\nOn the Head-turning Peak I look back without cease,\nLetting my white beard sway in endless autumn breeze.", "poemType": "七言绝句", "poemTheme": "山水田园", "chineseHtml": "<p class=\"poem-lines\">草草<sup class=\"note-ref\">[1]</sup>辞家忧后事，<br>迟迟去国问前途。<br>望秦岭上回头立，<br>无限秋风吹白须。</p>\n<p class=\"prose\">公元815年，宰相武元衡被暗杀身亡，白居易上书奏请捉拿凶手，却被权贵责为越职上奏，贬为江州（今江西省九江市）司马。他路经骊山脚下的望秦岭时，写下了这首双关诗。第一句说匆匆离家，来不及安排家事，更担心的是国家大事。第二句说慢慢上路，舍不得离开国都，去江州的路途遥远，自己政治上的前途更是渺茫。</p>\n<p class=\"prose\">所以在望秦岭上回望京城，就只感到秋风吹动白须，自己觉得茫然了。</p>\n<h4 class=\"note-title\">注释</h4>\n<p class=\"prose\">[1]草草：匆忙。</p>", "englishHtml": "<p class=\"poem-lines\">Leaving home in haste, I’m worried about my fate;<br>Without knowing what will happen, I linger late.<br>On the Head-turning Peak I look back without cease,<br>Letting my white beard sway in endless autumn breeze.</p>\n<h4 class=\"commentary-title\">Commentary</h4
