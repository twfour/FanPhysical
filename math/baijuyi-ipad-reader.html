        .replace(/[“”"‘’.,;:!?()[\]{}<>，。？！；：《》【】（）]/g, "")
        .replace(/^[-—]+|[-—]+$/g, "");
      if (sourceLanguage === "zh") {
        return cleaned.replace(/\s+/g, "").slice(0, 24);
      }
      return cleaned.toLowerCase();
    }

    function getSelectionSource(selection) {
      if (!selection || selection.rangeCount === 0) return null;
      const range = selection.getRangeAt(0);
      const node = range.commonAncestorContainer.nodeType === Node.TEXT_NODE
        ? range.commonAncestorContainer.parentElement
        : range.commonAncestorContainer;
      if (!node) return null;
      if (title.contains(node)) return "zh";
      if (leftPane.contains(node)) return "zh";
      if (rightPane.contains(node)) return "en";
      return null;
    }

    function showWordPopover() {
      const selection = window.getSelection();
      const sourceLanguage = getSelectionSource(selection);
      if (!sourceLanguage) {
        hideWordPopover();
        return;
      }
      const raw = selection.toString().trim();
      const word = normalizeSelection(raw, sourceLanguage);
      if (
        !word
        || (sourceLanguage === "en" && (word.includes(" ") || word.length > 32 || !/[a-z]/.test(word)))
        || (sourceLanguage === "zh" && (word.length > 12 || !/[\u3400-\u9fff]/.test(word)))
      ) {
        hideWordPopover();
        return;
      }
      const range = selection.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      if (!rect || (rect.width === 0 && rect.height === 0)) return;
      configureWordPopoverLabels(sourceLanguage);
      wordPopoverWord.textContent = word;
      wordPopoverZh.textContent = "AI 正在解释...";
      wordPopoverEn.textContent = sourceLanguage === "zh" ? "Preparing an English gloss..." : "Thinking in context...";
      wordPopoverPinyin.textContent = sourceLanguage === "zh" ? "正在生成拼音..." : "正在生成音标...";
      wordPopoverContext.textContent = sourceLanguage === "zh"
        ? "会结合当前诗题、中文诗句和赏析上下文解释这个词。"
        : "会结合当前诗题、英文诗句和上下文解释这个词。";
      positionWordPopover(rect);
      wordPopover.classList.add("open");
      queryWordAi(word, selection, raw, sourceLanguage);
    }

    function configureWordPopoverLabels(sourceLanguage) {
      if (sourceLanguage === "zh") {
        wordZhLabel.textContent = "词语释义";
        wordEnLabel.textContent = "English Gloss";
        wordPinyinLabel.textContent = "拼音";
        wordContextLabel.textContent = "诗中用法";
      } else {
        wordZhLabel.textContent = "中文释义";
        wordEnLabel.textContent = "English";
        wordPinyinLabel.textContent = "音标";
        wordContextLabel.textContent = "In This Poem";
      }
      wordPinyinLabel.hidden = false;
      wordPopoverPinyin.hidden = false;
    }

    async function queryWordAi(word, selection, rawSelection, sourceLanguage) {
      const poem = poems[active];
      const sentence = getSelectionSentence(selection, rawSelection, sourceLanguage);
      const fallback = {
        zh: "AI 暂时不可用，本地词表也暂无释义。",
        en: "No local entry yet.",
        pinyin: sourceLanguage === "zh" ? "暂无拼音。" : "音标暂缺。",
        context: "可以稍后重新选择该词再试。"
      };
      try {
        const response = await fetch("/api/word-ai", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            word,
            sentence,
            sourceLanguage,
            poemTitle: poem.zhTitle,
            poemEnTitle: poem.enTitle,
            commentaryContext: (sourceLanguage === "zh" ? poem.chinese : poem.english).replace(/\s+/g, " ").slice(0, 500)
          })
        });
        const data = await response.json();
        if (!response.ok || !data.ok || !data.explanation) {
          throw new Error(data.error || "AI request failed");
        }
        if (wordPopoverWord.textContent !== word) return;
        wordPopoverZh.textContent = data.explanation.zh || fallback.zh;
        wordPopoverEn.textContent = data.explanation.en || fallback.en;
        wordPopoverPinyin.textContent = data.explanation.pinyin || fallback.pinyin || (sourceLanguage === "zh" ? "暂无拼音。" : "音标暂缺。");
        wordPopoverContext.textContent = data.explanation.context || fallback.context;
      } catch (error) {
        if (wordPopoverWord.textContent !== word) return;
        wordPopoverZh.textContent = fallback.zh;
        wordPopoverEn.textContent = fallback.en;
        wordPopoverPinyin.textContent = fallback.pinyin || (sourceLanguage === "zh" ? "暂无拼音。" : "音标暂缺。");
        wordPopoverContext.textContent = fallback.context + "（AI 解释暂时不可用：" + error.message + "）";
      }
    }

    function getSelectionSentence(selection, rawSelection, sourceLanguage) {
      if (!selection || selection.rangeCount === 0) return rawSelection || "";
      const range = selection.getRangeAt(0);
      if (title.contains(range.startContainer)) {
        return title.textContent.replace(/^\d+\.\s*/, "").trim();
      }
      const block = range.startContainer.parentElement && range.startContainer.parentElement.closest("p");
      if (!block) return rawSelection || "";
      const text = block.textContent.replace(/\s+/g, " ").trim();
      if (!text) return rawSelection || "";
      const selected = rawSelection.trim();
      const index = text.indexOf(selected);
      if (index === -1) return text.slice(0, 260);
      const marks = sourceLanguage === "zh" ? ["。", "；", "？", "！"] : [".", ";", "?", "!"];
      const left = Math.max(0, ...marks.map((mark) => text.lastIndexOf(mark, index)));
      const rightCandidates = marks
        .map((mark) => text.indexOf(mark, index + selected.length))
        .filter((pos) => pos !== -1);
      const right = rightCandidates.length ? Math.min(...rightCandidates) + 1 : text.length;
      return text.slice(left, right).trim().slice(0, 260);
    }

    function positionWordPopover(rect) {
      const gap = 10;
      const width = Math.min(340, window.innerWidth - 28);
      let left = rect.left + rect.width / 2 - width / 2;
      left = Math.max(14, Math.min(left, window.innerWidth - width - 14));
      let top = rect.bottom + gap;
      if (top + 220 > window.innerHeight) {
        top = Math.max(14, rect.top - 230);
      }
      wordPopover.style.left = `${left}px`;
      wordPopover.style.top = `${top}px`;
    }

    function hideWordPopover() {
      if (wordPopover) wordPopover.classList.remove("open");
    }

    document.getElementById("prev").addEventListener("click", () => showPoem(active - 1));
    document.getElementById("next").addEventListener("click", () => showPoem(active + 1));
    document.getElementById("smaller").addEventListener("click", () => { scale = Math.max(-4, scale - 1); applyScale(); });
    document.getElementById("larger").addEventListener("click", () => { scale = Math.min(7, scale + 1); applyScale(); });
    toggleOriginal.addEventListener("click", () => { originalHidden = !originalHidden; applyOriginalVisibility(); });
    search.addEventListener("input", () => renderList(search.value));
    title.addEventListener("mouseup", () => setTimeout(showWordPopover, 10));
    title.addEventListener("touchend", () => setTimeout(showWordPopover, 220));
    leftPane.addEventListener("mouseup", () => setTimeout(showWordPopover, 10));
    leftPane.addEventListener("touchend", () => setTimeout(showWordPopover, 220));
    rightPane.addEventListener("mouseup", () => setTimeout(showWordPopover, 10));
    rightPane.addEventListener("touchend", () => setTimeout(showWordPopover, 220));
    wordPopoverClose.addEventListener("click", hideWordPopover);
    document.addEventListener("mousedown", (event) => {
      if (!wordPopover.contains(event.target) && !title.contains(event.target) && !rightPane.contains(event.target) && !leftPane.contains(event.target)) hideWordPopover();
    });
    window.addEventListener("resize", hideWordPopover);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") hideWordPopover();
      if (event.key === "ArrowLeft") showPoem(active - 1);
      if (event.key === "ArrowRight") showPoem(active + 1);
    });

    applyScale();
    renderList();
    const savedActive = Number(localStorage.getItem(activeStorageKey));
    showPoem(Number.isInteger(savedActive) ? savedActive : 0);
  </script>
</body>
</html>
