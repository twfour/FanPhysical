<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>诗歌读本｜许渊冲译唐诗</title>
  <style>
    :root {
      --paper: #fbf7ee;
      --paper-deep: #efe5d2;
      --ink: #2d251b;
      --muted: #786c5d;
      --line: rgba(63, 49, 34, .18);
      --cinnabar: #9b3f24;
      --pine: #2f5d50;
      --gold: #c8923c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(115deg, rgba(155, 63, 36, .10), transparent 30%),
        linear-gradient(180deg, var(--paper), var(--paper-deep));
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
    }

    .shell {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 42px 0;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 34px;
      align-items: end;
      min-height: 38vh;
      border-bottom: 1px solid var(--line);
      padding: 16px 0 34px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--cinnabar);
      font: 800 13px/1.2 "Avenir Next", "Helvetica Neue", sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 86px);
      line-height: .98;
      letter-spacing: 0;
    }

    .summary {
      max-width: 680px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.75;
    }

    .seal {
      justify-self: end;
      width: 210px;
      aspect-ratio: 1;
      border: 2px solid rgba(155, 63, 36, .56);
      display: grid;
      place-items: center;
      color: var(--cinnabar);
      transform: rotate(-4deg);
      background:
        linear-gradient(135deg, rgba(255,255,255,.38), rgba(255,255,255,0)),
        rgba(255, 249, 236, .72);
    }

    .seal span {
      writing-mode: vertical-rl;
      font-size: 38px;
      line-height: 1.25;
      letter-spacing: .18em;
    }

    .library {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      padding: 28px 0 0;
    }

    .book {
      min-height: 260px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 252, 244, .72);
      color: inherit;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 24px;
      text-decoration: none;
      box-shadow: 0 18px 46px rgba(45, 37, 27, .08);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .book:hover {
      transform: translateY(-3px);
      border-color: rgba(155, 63, 36, .38);
      box-shadow: 0 24px 58px rgba(45, 37, 27, .14);
    }

    .book small {
      color: var(--cinnabar);
      font: 800 12px/1.3 "Avenir Next", "Helvetica Neue", sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .book h2 {
      margin: 16px 0 10px;
      font-size: 38px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .book p {
      max-width: 420px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .book footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 18px;
      color: var(--pine);
      font: 800 14px/1.2 "Avenir Next", "Helvetica Neue", sans-serif;
    }

    .arrow {
      color: var(--gold);
      font-size: 24px;
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 24px, 560px);
        padding: 22px 0;
      }

      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .seal {
        justify-self: start;
        width: 132px;
      }

      .seal span {
        font-size: 25px;
      }

      .library {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Xu Yuanchong Poetry Reader</p>
        <h1>诗歌读本</h1>
        <p class="summary">王维、李白与杜甫诗选，中英对照，支持选词释义、拼音、英文音标与语境讲解。为横屏阅读、课堂讲读和慢读唐诗保留一张安静的书桌。</p>
      </div>
      <div class="seal" aria-hidden="true"><span>诗译双读</span></div>
    </section>

    <section class="library" aria-label="诗歌目录">
      <a class="book" href="/wangwei/">
        <div>
          <small>Wang Wei</small>
          <h2>王维诗选</h2>
          <p>山水、田园、送别与禅意，在简静的中英文对照里逐首展开。</p>
        </div>
        <footer><span>进入王维读本</span><span class="arrow">›</span></footer>
      </a>

      <a class="book" href="/libai/">
        <div>
          <small>Li Bai</small>
          <h2>李白诗选</h2>
          <p>月光、酒意、远游和壮阔想象，适合一首一首打开来读。</p>
        </div>
        <footer><span>进入李白读本</span><span class="arrow">›</span></footer>
      </a>

      <a class="book" href="/dufu/">
        <div>
          <small>Du Fu</small>
          <h2>杜甫诗选</h2>
          <p>家国、漂泊、草堂与登临，在沉郁顿挫的诗心里照见时代。</p>
        </div>
        <footer><span>进入杜甫读本</span><span class="arrow">›</span></footer>
      </a>
    </section>
  </main>
</body>
</html>
