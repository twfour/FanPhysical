server {
    listen 80;
    server_name physics.qinyibin.com;

    client_max_body_size 256k;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/fanphysics/current;
        default_type text/plain;
        try_files $uri =404;
    }

    # BEGIN SENIOR-MATH2 COURSE
    # Preserve legacy links while hosting SeniorMath2 on its own domain.
    location = /senior-math2 {
        return 308 https://math.qinyibin.com/seniormath2/;
    }

    location ~ ^/senior-math2/(?<senior_math_path>.*)$ {
        return 308 https://math.qinyibin.com/seniormath2/$senior_math_path$is_args$args;
    }
    # END SENIOR-MATH2 COURSE

    # FanMath now lives on its dedicated domain.
    location = /math {
        return 308 https://math.qinyibin.com/fanmath/;
    }

    location ^~ /math/ {
        return 308 https://math.qinyibin.com/fanmath/;
    }

    location ^~ /assets/ {
        root /opt/fanphysics/current;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /data/ {
        root /opt/fanphysics/current;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /notebooklm {
        return 308 /notebooklm/;
    }

    location ^~ /notebooklm/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /models {
        return 308 /models/;
    }

    location ^~ /models/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = / {
        root /opt/fanphysics/current;
        add_header Cache-Control "no-cache" always;
        try_files /classical-mechanics-demo.html =404;
    }

    location / {
        root /opt/fanphysics/current;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /classical-mechanics-demo.html;
    }
}
